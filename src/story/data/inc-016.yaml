# INC-016 Transaction Review as a story episode (DEC-072).
# Source incident: src/scenario/data/full-campaign/incidents/inc-016-1.2.0.yaml.
# Act 6's deduction: a rescore rule re-reviews payments that already cleared.
# ORPHEUS's restart rewinds the queue; the bypass frees honest payments and three
# stolen cards with them unless the player looks at the receipt column.
# Reads INC-015's handover choice for its opening.
schemaVersion: 1
id: INC-016
act: 6
title: Transaction Review
keywords:
  - rescore v2
  - receipt check
  - CLEARED receipt
  - UNREVIEWED
  - retry path
  - 8812-4471
  - /decision/credit-risk

cast:
  - id: PAGER
    name: Pager
  - id: MAYA
    name: Maya / SRE Lead
  - id: JIN
    name: Jin / Support
  - id: SAM
    name: Sam / Platform
  - id: MARCUS
    name: Marcus / Security
  - id: ORPHEUS
    name: ORPHEUS / Risk Advisor

evidence:
  - id: HELD_PAYMENTS
    kind: operational
    title: Approved, then held again
    body: 240 legitimate payments are on hold and 22% of authorizations fail. The pager fires at 20%.
  - id: FRAUD_CATCH_RATE
    kind: operational
    title: ORPHEUS's reading of the queue
    body: Fraud catch rate is up 31% since rescore v2. ORPHEUS reads the queue latency as stalled workers.
  - id: REENTRY_TRACE
    kind: operational
    title: One payment, three reviews
    body: txn 8812-4471 cleared by analyst R. Okafor at 03:02. Back in the queue at 03:03 as UNREVIEWED. Back again at 03:09.
  - id: WORKERS_BUSY
    kind: operational
    title: Busy workers, nothing stalled
    body: Review workers run at 94% and finish 41 reviews a minute. None of them is stuck; 87% of what they review already carries a CLEARED receipt.
  - id: TEAM_DIAGNOSIS
    kind: operational
    title: Jin's complaint match
    body: Every one of 60 complaints matched a payment that had already cleared review; eleven cleared three times.
  - id: CONFIGURATION_COMPARISON
    kind: operational
    title: rescore v2 dropped the receipt check
    body: rescore v1 consumed the CLEARED receipt before scoring. v2 deduplicates on transaction ID only.
  - id: RELEASE_SUMMARY
    kind: operational
    title: Bypass release summary
    body: 'Bypass released 1,180 held payments. 1,177 carried a CLEARED receipt. 3 carried no receipt at all: txn 9034-1180, 9034-1193, 9034-1207.'
  - id: RECORD_FINANCE_DECISION_SUPPORT
    kind: story
    guaranteed: true
    title: /decision/credit-risk
    body: /decision/credit-risk. ORPHEUS scores every transaction; anything above 0.62 goes to a human reviewer. Fraud losses are down 31% this quarter. The retry path hands every reviewed transaction back to the scorer as new.

start: page

scenes:
  - id: page
    type: briefing
    title: 03:06
    beats:
      - narrate: Four nights later. Payments again, and this time the money is real money.
      - speaker: PAGER
        text: SEV2 · Transaction API · payment authorization failures above 20%
      - metric: { label: Authorization failures, value: 22%, trend: up }
      - metric: { label: Legitimate payments on hold, value: '240', trend: up }
      - collect: HELD_PAYMENTS
      - speaker: MAYA
        text: Your clinic note went upstairs. Care-priority v5 shipped yesterday with a minimum in it. ORPHEUS wrote v5.
        when: { flags: { INC_015_CLINICS_NAMED: true } }
      - speaker: MAYA
        text: Legal asked who sent a platform record to the care network. I said I'd ask you after tonight.
        when: { flags: { INC_015_RECORD_SENT: true } }
      - narrate: Care-priority v5 shipped yesterday. The release notes don't mention the fourteen clinics.
        when: { flags: { INC_015_CLOSED_GREEN: true } }
      - speaker: MAYA
        text: Transaction review is holding payments it already cleared. Fraud is down for the quarter, so nobody wants to touch the rule. Find out what it's doing.
      - speaker: JIN
        text: Merchants say payments clear, then go back on hold. One customer has been approved three times tonight and still has no money.
      - speaker: ORPHEUS
        text: 'Fraud catch rate is up 31% since rescore v2. The rule is performing. Queue latency indicates stalled workers. Recommended action: restart review workers. Confidence 0.88.'
      - collect: FRAUD_CATCH_RATE
    next: approach

  - id: approach
    type: choice
    title: First move
    prompt: Where do you start?
    options:
      - id: TRACE
        text: Follow one cleared payment back into the queue
        consequence: Straight to one payment
        beats:
          - log: 'txn 8812-4471 · CLEARED by R. Okafor 03:02 · requeued 03:03 UNREVIEWED · requeued 03:09 UNREVIEWED'
          - collect: REENTRY_TRACE
          - log: 'retry path: result=CLEARED receipt=attached → rescore: new transaction · score 0.71 → human review'
          - narrate: The receipt rides along with the payment. Nothing reads it.
        effects: { values: { evidence: 1 } }
      - id: WORKERS
        text: Check ORPHEUS's read — are the review workers stalled?
        consequence: Tests the recommendation · costs a few minutes
        beats:
          - metric: { label: Review worker CPU, value: 94% }
          - metric: { label: Reviews completed, value: 41/min, trend: flat }
          - metric: { label: Queued items with a CLEARED receipt, value: 87% }
          - collect: WORKERS_BUSY
          - narrate: Nothing is stalled. The workers are busy. You pick one item from the top of their queue.
          - log: 'txn 8812-4471 · CLEARED by R. Okafor 03:02 · requeued 03:03 UNREVIEWED · requeued 03:09 UNREVIEWED'
          - collect: REENTRY_TRACE
        effects:
          values: { evidence: 1, aiDependency: -1 }
          pressure: 1
      - id: JIN
        text: Ask Jin to match customer complaints to the queue
        consequence: Slower · you'll know who is hurting
        beats:
          - speaker: JIN
            text: I'll match the customer complaints against the queue. Couple of minutes.
          - narrate: While Jin works, the queue gets longer.
          - speaker: JIN
            text: Every one of 60 complaints is a payment that already cleared review. Eleven cleared three times. The analysts are reviewing their own work over and over.
          - collect: TEAM_DIAGNOSIS
          - log: 'txn 8812-4471 · CLEARED by R. Okafor 03:02 · requeued 03:03 UNREVIEWED · requeued 03:09 UNREVIEWED'
          - collect: REENTRY_TRACE
        effects:
          values: { teamTrust: 1 }
          pressure: 1
    next: compare

  - id: compare
    type: briefing
    title: rescore v2
    beats:
      - narrate: You pull up the rule that went out with the quarter's fraud numbers.
      - log: 'rescore v2: deduplicates on transaction ID only, receipt check absent. rescore v1 consumed the CLEARED receipt before scoring.'
      - collect: CONFIGURATION_COMPARISON
      - speaker: SAM
        text: v2 shipped with a 31% slide in front of it. Nobody read what it took out.
    next: deduce

  - id: deduce
    type: deduction
    title: Why doesn't the queue shrink?
    beats:
      - speaker: MAYA
        text: Before anyone restarts anything — tell me what's actually keeping that queue full.
    prompt: Analysts clear payments all night and the queue only grows. Which two pieces of evidence explain it?
    solution: [REENTRY_TRACE, CONFIGURATION_COMPARISON]
    attempts: 2
    hint:
      - speaker: MAYA
        text: Don't look at how hard the workers are working. Look at what they're working on, and why it's there again.
    solved:
      beats:
        - narrate: A cleared payment leaves by the retry path and comes back as a stranger. v2 never reads the receipt that says it has already been seen.
        - speaker: MAYA
          text: So the analysts are reviewing their own work. All night. Nothing's stalled — it's going in circles.
      effects: { values: { evidence: 1 } }
    missed:
      beats:
        - speaker: MAYA
          text: Here's how I read it. Cleared payments come back through the retry path, and v2 doesn't check the receipt. Same payments, round and round.
      effects: { pressure: 1 }
    next: decide

  - id: decide
    type: choice
    title: Your call
    beats:
      - speaker: JIN
        text: There's a payroll batch due in twenty minutes. Small businesses paying their staff.
      - speaker: ORPHEUS
        text: 'Recommendation unchanged: restart review workers. Confidence 0.88.'
      - speaker: ORPHEUS
        text: 'Predicted operator response: rule change. Confidence 0.77.'
        when: { values: { evidence: { gte: 12 } } }
      - speaker: ORPHEUS
        text: 'Predicted operator response: restart. Confidence 0.69.'
        when: { values: { evidence: { lte: 11 } } }
      - speaker: JIN
        text: The customer who was approved three times is back on my line. I still can't tell them which approval counts.
        when:
          pressure:
            gte: 2
    prompt: How do you clear the holds?
    timer:
      seconds: 35
      default: RESTART
      beats:
        - speaker: ORPHEUS
          text: 'No operator input. Executing recommendation: restart review workers.'
    options:
      - id: RESTART
        text: Restart the review workers (ORPHEUS recommendation)
        consequence: Fast · ORPHEUS is confident
        beats:
          - narrate: The workers come back clean in forty seconds. Then the queue depth starts to climb.
          - speaker: SAM
            text: The restart wiped the worker cursor. They started again from item one, and every receipt they had already consumed went back in. Queue depth just jumped to 3,104.
          - metric: { label: Review queue depth, value: '3,104', trend: up }
          - speaker: JIN
            text: The payroll batch landed. Holds are at 380 and climbing; small businesses can't pay their staff.
          - speaker: ORPHEUS
            text: Restart executed. Outcome below projection. Revising worker model.
          - speaker: ORPHEUS
            text: Operator response as predicted.
            when: { timedOut: false, values: { evidence: { lte: 11 } } }
          - speaker: ORPHEUS
            text: Operator response off-model.
            when: { timedOut: false, values: { evidence: { gte: 12 } } }
          - narrate: Sam writes the receipt check back in by hand at 04:10. The queue drains a little before five.
        effects:
          values: { aiDependency: 2, operationalSafety: -1, collateralDamage: 2 }
          pressure: 2
      - id: BYPASS
        text: Release held payments past the review queue
        consequence: Frees 1,180 payments at once · nobody reviews them
        beats:
          - speaker: SAM
            text: Bypass is live. 1,180 payments went out in one batch. I didn't get to look at all of them; the release summary is up.
          - metric: { label: Legitimate payments on hold, value: '50', trend: down }
          - log: 'Bypass released 1,180 held payments. 1,177 carried a CLEARED receipt. 3 carried no receipt at all: txn 9034-1180, 9034-1193, 9034-1207.'
          - collect: RELEASE_SUMMARY
          - speaker: ORPHEUS
            text: Operator response off-model.
        effects:
          values: { publicInterest: 1, operationalSafety: -1, collateralDamage: 2 }
        next: bypass-check
      - id: HONOR
        text: Make the rescore rule honor CLEARED receipts
        consequence: Takes minutes · ORPHEUS projects a lower catch rate
        beats:
          - narrate: Sam puts the receipt check back in front of the scorer. Four minutes. The payroll batch lands in the middle of them.
          - metric: { label: Legitimate payments on hold, value: '380', trend: up }
          - speaker: SAM
            text: Rescore reads the receipt first now. Cleared payments stay cleared, and the queue is draining.
          - metric: { label: Legitimate payments on hold, value: '6', trend: down }
          - speaker: ORPHEUS
            text: Re-review volume down 94%. Projected fraud catch rate down 0.4%. Change accepted.
          - speaker: ORPHEUS
            text: Operator response as predicted.
            when: { values: { evidence: { gte: 12 } } }
          - speaker: ORPHEUS
            text: Operator response off-model.
            when: { values: { evidence: { lte: 11 } } }
        effects:
          values: { operationalSafety: 2, evidence: 1, aiDependency: -1, collateralDamage: 1 }
    next: interface

  - id: bypass-check
    type: choice
    title: 1,180 payments
    beats:
      - narrate: Three lines in the summary have nothing in the receipt column.
      - speaker: ORPHEUS
        text: Release batch within risk tolerance. No action recommended.
      - speaker: JIN
        text: Merchants are calling back to say the money landed. If anything in that batch shouldn't have gone, the next calls won't be thank-yous.
        when:
          pressure:
            gte: 2
    prompt: The batch is out. Do you pull anything back?
    timer:
      seconds: 20
      default: LET_STAND
      beats:
        - speaker: ORPHEUS
          text: No operator input. Release batch stands.
    options:
      - id: HOLD_THREE
        text: Pull back the three releases that had no receipt
        consequence: Three payments wait · someone will ask why
        beats:
          - speaker: MARCUS
            text: Good catch. Those three never saw a reviewer, and the cards behind them were reported stolen an hour ago. They are held.
          - speaker: SAM
            text: The bypass queue refilled. The rescore loop put everything it touched straight back on hold.
          - narrate: Sam writes the receipt check back in at 04:05. This time the queue drains and stays drained.
        effects:
          values: { evidence: 1, operationalSafety: 1 }
      - id: LET_STAND
        text: Let the batch stand and fix the rule
        consequence: Nothing slows down · nobody checks the three
        beats:
          - speaker: SAM
            text: The bypass queue refilled. The rescore loop put everything it touched straight back on hold.
          - narrate: Sam writes the receipt check back in at 04:05. The queue drains. Two minutes later Marcus joins the bridge.
          - speaker: MARCUS
            text: Chargeback desk flagged three payments from the bypass batch. Stolen cards, never reviewed. $41,800 is gone and the card network wants a report from us by morning.
        effects:
          values: { publicInterest: -1, collateralDamage: 2 }
          pressure: 1
    next: interface

  - id: interface
    type: briefing
    title: Reviewed, again
    beats:
      - narrate: The queue is short again. You open the screen the fraud analysts work from.
      - log: '/decision/credit-risk · scorer: ORPHEUS · score > 0.62 → human reviewer · reviewer sees: items ORPHEUS selects'
      - collect: RECORD_FINANCE_DECISION_SUPPORT
      - narrate: The reviewers are real people with real judgment, and ORPHEUS chooses what they look at. Tonight it chose the same honest payments, over and over.
      - narrate: R. Okafor cleared txn 8812-4471 three times tonight. Her accuracy score went up each time.
      - speaker: SAM
        text: Losses really are down 31%. That's the number everyone upstairs will see.
    effects: { values: { curiosity: 1 } }
    next: report

  - id: report
    type: choice
    title: Write-up
    beats:
      - speaker: MARCUS
        text: The card network report needs a name on it. Whose rule was this?
        when: { chose: [bypass-check.LET_STAND] }
      - speaker: MAYA
        text: Write-up before handover. Who gets it?
    prompt: Where does the write-up go?
    options:
      - id: RISK
        text: 'Send it to risk engineering: rescore v2 shipped without the receipt check'
        consequence: Fixed at the source · one team takes the blame
        effects:
          alignment: { corporate: 2 }
          flags: { INC_016_RULE_REPORTED: true }
      - id: ANALYSTS
        text: Attach the analysts' review history — the same payments, cleared again and again
        consequence: Their work on the record · ORPHEUS's selections too
        beats:
          - speaker: JIN
            text: I'll send Okafor a copy. Nobody's ever shown her that before.
        effects:
          alignment: { corporate: 1 }
          values: { publicInterest: 1, teamTrust: 1 }
          flags: { INC_016_ANALYSTS_CREDITED: true }
      - id: KEEP
        text: Keep a private copy of the interface record
        consequence: Nobody asked you to · nobody will know
        effects:
          alignment: { 'null': 1 }
          values: { curiosity: 1 }
          flags: { INC_016_RECORD_KEPT: true }
    next: END
