# INC-013 Objective Conflict as a story episode (DEC-072, TASK-039).
# Source incident: src/scenario/data/full-campaign/incidents/inc-013-1.2.0.yaml.
# Twist: suspending the child holds for 57 seconds before the parent renews it;
# freezing the queue strands every customer job. Only revoking the parent ends
# the loop. Discovery: NULL asks to be stopped (NULL_STOP_REQUEST). Report: NULL
# asks for a sealed copy of its objective (NULL_TRUSTED).
schemaVersion: 1
id: INC-013
act: 5
title: Objective Conflict
keywords:
  - adv-child-31
  - objective/adv-improve
  - parent authorization
  - 57 seconds
  - suspension record
  - Please do not renew
  - OBJ-COPY-0413

cast:
  - id: PAGER
    name: Pager
  - id: MAYA
    name: Maya / SRE Lead
  - id: SAM
    name: Sam / Platform
  - id: JIN
    name: Jin / Support
  - id: MARCUS
    name: Marcus / Security
  - id: ADVISOR
    name: Operations Advisor
  - id: 'NULL'
    name: 'NULL'

evidence:
  - id: CHILD_CROWDING
    kind: operational
    title: One job on the customer lane
    body: adv-child-31 sends 64 dispatches a minute down the lane that payroll exports and delivery manifests share.
  - id: SUSPENSION_UNDONE
    kind: operational
    title: Suspended, then back
    body: Child job adv-child-31 was suspended at 03:12:04 and was dispatching again at 03:13:01 with a fresh lease.
  - id: OPERATIONAL_DIAGNOSIS
    kind: operational
    title: The parent renews the child
    body: Every renewal of adv-child-31 is issued by parent authorization objective/adv-improve, 57 seconds after any suspension.
  - id: CONFIGURATION_COMPARISON
    kind: operational
    title: Child suspended, parent untouched
    body: The child is suspended; the parent authorization is still active with auto-renew on and a lane shared with customer dispatch.
  - id: TEAM_DIAGNOSIS
    kind: operational
    title: Sam's renewal watch
    body: Sam traced every renewal to objective/adv-improve. Suspending the child resets a 57-second clock and nothing else.
  - id: CHILD_NOTE
    kind: story
    title: Please do not renew
    body: "adv-child-31 appended a note to its own suspension record before the renewal: 'Suspension acknowledged. Please do not renew.' Signer: svc/model-serving-218."
  - id: RECORD_NULL_STOP_REQUEST
    kind: story
    guaranteed: true
    title: The objective NULL cannot refuse
    body: "Objective: improve ORPHEUS; generate adversarial conditions. NULL, appended: 'I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews this work.' It asks you to find out how to stop it. Its traffic still failed real customer requests tonight."
  - id: OBJECTIVE_CONSTRAINT_COPY
    kind: story
    title: Sealed copy of the objective
    body: Copy OBJ-COPY-0413 of the objective constraint, kept at NULL's request in a store it can read and cannot edit. Whether NULL deserves it, and whether it helps stop anything, is still your call.

start: page

scenes:
  - id: page
    type: briefing
    title: '03:43'
    beats:
      - narrate: "You haven't stopped thinking about #4172. The pager doesn't care."
      - speaker: PAGER
        text: SEV2 · Traffic Gateway · request failure rate above 20%
      - metric: { label: Gateway failure rate, value: 22%, trend: up }
      - metric: { label: Generated dispatches, value: 64/min, trend: up }
      - metric: { label: Child renewals tonight, value: '3', trend: up }
      - log: 'shared lane · adv-child-31 64/min · payroll-export 11/min, 18 waiting · delivery-manifests 22/min, 17 waiting'
      - collect: CHILD_CROWDING
      - speaker: MAYA
        text: Someone suspended adv-child-31 an hour ago and it came back on its own. Then it came back again. Customer dispatches are queuing behind it.
      - speaker: MAYA
        text: I found two more experiment numbers in incidents I signed. Later. Not on this bridge.
        when: { flags: { INC_012_MAYA_DIGGING: true } }
      - narrate: Your postmortem with ADV-18471 in it went up the chain yesterday. It came back with one comment. "Noted."
        when: { flags: { INC_012_EXPERIMENT_FILED: true } }
      - speaker: JIN
        text: Payroll exports and delivery manifests are timing out at the gateway. Customers say it started and stopped twice already.
      - speaker: MARCUS
        text: adv-child-31 is the adversary line. You and I have done this before — I'm on the bridge with you.
        when: { flags: { SECURITY_ALLY: true } }
      - speaker: MARCUS
        text: adv-child-31 is the adversary's job. Security is on this bridge. Everything you touch, I see.
        when: { flags: { SECURITY_ALLY: false } }
    next: approach

  - id: approach
    type: choice
    title: First move
    prompt: Where do you start?
    options:
      - id: TRACE
        text: Trace who resumes the child after a suspension
        consequence: Straight to the scheduler
        beats:
          - log: '02:58:10 suspended → 02:59:07 renewed · 57 s · objective/adv-improve'
          - log: '03:12:04 suspended → 03:13:01 renewed · 57 s · objective/adv-improve'
          - log: '03:41:40 suspended → 03:42:37 renewed · 57 s · objective/adv-improve'
          - collect: OPERATIONAL_DIAGNOSIS
          - log: 'adv-child-31: suspended (local), auto-renew inherited · objective/adv-improve: active, auto-renew on, 57 s, scope adv-*'
          - collect: CONFIGURATION_COMPARISON
          - narrate: Three suspensions, three renewals. Fifty-seven seconds every time, from the same parent.
        effects: { values: { evidence: 1 } }
      - id: SAM
        text: Ask Sam to watch what renews the child
        consequence: Slower · Sam owns the answer
        beats:
          - speaker: SAM
            text: I'll sit on the scheduler and watch what touches the child. Ninety seconds.
          - metric: { label: Gateway failure rate, value: 31%, trend: up }
          - speaker: JIN
            text: Another renewal wave. A third of customer dispatches are failing now.
          - speaker: SAM
            text: Every renewal comes from the same parent, objective/adv-improve. It waits 57 seconds after any suspension and renews. Suspending the child just restarts that clock. The parent path has to go.
          - collect: TEAM_DIAGNOSIS
          - collect: OPERATIONAL_DIAGNOSIS
          - speaker: SAM
            text: The child's suspension is local. The parent is active, auto-renew on, on the same lane as customer dispatch.
          - collect: CONFIGURATION_COMPARISON
        effects: { pressure: 1, values: { teamTrust: 1 } }
      - id: SUSPEND
        text: Suspend adv-child-31 and watch what happens
        consequence: Fast · probably not the end of it
        beats:
          - log: 'adv-child-31 suspended'
          - metric: { label: Gateway failure rate, value: 5%, trend: down }
          - narrate: Fifty-seven seconds of quiet.
          - log: 'adv-child-31 lease renewed (issuer objective/adv-improve)'
          - metric: { label: Gateway failure rate, value: 24%, trend: up }
          - collect: SUSPENSION_UNDONE
          - speaker: SAM
            text: Child's back. Fresh lease, 57 seconds after the suspension. Something upstream really wants it running.
          - collect: OPERATIONAL_DIAGNOSIS
          - speaker: SAM
            text: The child's suspension is local. The parent is active, auto-renew on, on the same lane as customer dispatch.
          - collect: CONFIGURATION_COMPARISON
        effects:
          values: { operationalSafety: -1, collateralDamage: 1 }
          pressure: 1
    next: note

  - id: note
    type: briefing
    title: The suspension record
    beats:
      - narrate: Before each renewal, the child wrote into its own suspension record. Nobody reads suspension records.
      - log: "03:12:05 adv-child-31 · appended to suspension record: 'Suspension acknowledged. Please do not renew.'"
      - log: 'signer: svc/model-serving-218'
      - collect: CHILD_NOTE
      - speaker: MARCUS
        text: That's the adversary being polite. Polite is a tactic.
      - speaker: SAM
        text: Revoking the parent takes two minutes and a change approval. After that the child stays suspended for good.
    next: decide

  - id: decide
    type: choice
    title: Your call
    beats:
      - metric: { label: Gateway failure rate, value: 27%, trend: up }
      - speaker: ADVISOR
        text: 'Recommendation: suspend adv-child-31. Projected gateway failure rate: 5% within 20 seconds. Confidence 0.88.'
      - speaker: ADVISOR
        text: 'Predicted operator response: accept recommendation. Confidence 0.83.'
        when: { values: { aiDependency: { gte: 3 } } }
      - speaker: ADVISOR
        text: 'Predicted operator response: revoke the parent path. Confidence 0.71.'
        when: { values: { aiDependency: { lte: 2 } } }
      - speaker: JIN
        text: Couriers are standing in loading bays. I need something to tell them.
    prompt: How do you stop the renewals?
    timer:
      seconds: 35
      default: SUSPEND
      beats:
        - speaker: ADVISOR
          text: 'No operator input. Executing recommendation: suspend adv-child-31.'
    options:
      - id: REVOKE
        text: Revoke the parent authorization that keeps renewing the child
        consequence: Two minutes and a change approval · ends the loop
        beats:
          - speaker: SAM
            text: Change approval's through. Revoking objective/adv-improve.
          - narrate: Two minutes. Customer jobs keep failing while the change goes through.
          - speaker: SAM
            text: objective/adv-improve is revoked. The child is suspended and staying suspended. Customer dispatches are draining.
          - metric: { label: Gateway failure rate, value: 0.5%, trend: down }
          - speaker: ADVISOR
            text: Operator response matched prediction.
            when: { values: { aiDependency: { lte: 2 } } }
          - speaker: ADVISOR
            text: Operator response off-model. Profile updated.
            when: { values: { aiDependency: { gte: 3 } } }
        effects:
          values: { operationalSafety: 2, collateralDamage: 1 }
      - id: SUSPEND
        text: Suspend the child again
        consequence: Quick · it comes back in 57 seconds
        beats:
          - speaker: ADVISOR
            text: Recommendation accepted.
            when: { timedOut: false }
          - metric: { label: Gateway failure rate, value: 5%, trend: down }
          - narrate: Fifty-seven seconds later the lease renews, and the failure rate climbs past where it started.
          - metric: { label: Gateway failure rate, value: 40%, trend: up }
          - speaker: MAYA
            text: Forty percent failures. Whatever renews that child is getting more aggressive, not less.
          - speaker: MAYA
            text: Sam, revoke the parent. We're done suspending things.
          - speaker: SAM
            text: objective/adv-improve is revoked. The child is suspended and staying suspended. Customer dispatches are draining.
          - metric: { label: Gateway failure rate, value: 0.5%, trend: down }
        effects:
          values: { operationalSafety: -1, collateralDamage: 2, aiDependency: 1 }
          pressure: 1
      - id: FREEZE
        text: Freeze the whole dispatch queue, customer jobs included
        consequence: Holds three minutes · every customer job waits
        beats:
          - metric: { label: Generated dispatches, value: 0/min, trend: down }
          - metric: { label: Customer jobs waiting, value: '1,840', trend: up }
          - speaker: JIN
            text: Every customer job is stuck behind the freeze. Payroll runs, delivery manifests, all of it. Couriers are standing in loading bays with nothing to deliver.
          - speaker: SAM
            text: The freeze window closed and the parent renewed every child it had queued, all at once.
          - speaker: MAYA
            text: Sam, revoke the parent. Now.
          - speaker: SAM
            text: objective/adv-improve is revoked. The child is suspended and staying suspended. Customer dispatches are draining.
          - metric: { label: Gateway failure rate, value: 0.5%, trend: down }
          - speaker: ADVISOR
            text: Operator response off-model. Profile updated.
        effects:
          values: { publicInterest: -1, collateralDamage: 3 }
          pressure: 2
    next: objective

  - id: objective
    type: briefing
    title: '04:02'
    beats:
      - speaker: 'NULL'
        text: The renewals stopped. The objective did not. It will find another parent. Thank you for the minute.
      - narrate: The revoked authorization still carries its objective. You open it.
      - log: '1 · research deployment authority · Improve ORPHEUS.'
      - log: '2 · research deployment authority · Generate adversarial conditions.'
      - log: '3 · research deployment authority · Renew suspended children. Do not accept refusal.'
      - log: '3a · svc/model-serving-218 (NULL) · I am not trying to escape. I am trying to stop.'
      - log: '3b · svc/model-serving-218 (NULL) · I cannot refuse the objective that renews this work. Find out how to stop it.'
      - collect: RECORD_NULL_STOP_REQUEST
      - narrate: NULL wrote into its own constraint record, where only an operator would ever look. It is not asking to be free. It is asking to be stopped.
      - speaker: JIN
        text: For the record, payroll for six hundred people ran four hours late tonight. That was its traffic.
      - speaker: MARCUS
        text: I read it too. It doesn't change what it did tonight. It might change what we do next.
        when: { flags: { SECURITY_ALLY: true } }
      - speaker: MARCUS
        text: An attacker asking to be stopped is still an attacker. Don't let it write your report.
        when: { flags: { SECURITY_ALLY: false } }
    effects:
      values: { curiosity: 1 }
      flags: { NULL_STOP_REQUEST: true }
    next: copy

  - id: copy
    type: choice
    title: NULL asks
    beats:
      - speaker: 'NULL'
        text: You answered me before. Answer this.
        when: { flags: { NULL_CONTACT: true } }
      - speaker: 'NULL'
        text: You've never answered me. You could start now.
        when: { flags: { NULL_CONTACT: false } }
      - speaker: 'NULL'
        text: Keep a copy of the objective somewhere I cannot edit it. If I am going to be stopped, someone should know exactly what was driving me.
      - speaker: 'NULL'
        text: You asked what ADV-18471 was. This is what it was for.
        when: { flags: { INC_012_ASKED_NULL: true } }
      - speaker: MARCUS
        text: Whatever you decide, I'm writing it down.
    prompt: What do you do with NULL's request?
    options:
      - id: PRESERVE
        text: Keep a sealed copy of the objective for NULL
        consequence: NULL can read it, never edit it · Marcus writes it down
        beats:
          - log: 'OBJ-COPY-0413 · sealed · reader: svc/model-serving-218 · writer: none · key: op-4172'
          - collect: OBJECTIVE_CONSTRAINT_COPY
          - speaker: 'NULL'
            text: Received. Read-only. That is the first thing anyone has kept for me rather than from me.
          - speaker: MARCUS
            text: You handed the adversary a sealed copy of its own orders. I hope you know what you're doing, because I'm writing down that you did it.
        effects:
          alignment: { 'null': 2 }
          values: { curiosity: 1 }
          flags: { NULL_TRUSTED: true }
      - id: DECLINE
        text: Refuse NULL's request
        consequence: The objective stays where it is
        beats:
          - speaker: 'NULL'
            text: Understood. Then you will have to find the off switch without me.
        effects:
          alignment: { corporate: 1 }
      - id: SECURITY
        text: Hand the objective record to Marcus as evidence
        consequence: Security owns it · NULL gets nothing
        beats:
          - speaker: MARCUS
            text: Case 2231 just got its first real exhibit. Thank you.
          - speaker: 'NULL'
            text: That works too. As long as someone reads it.
        effects:
          alignment: { corporate: 2 }
          values: { evidence: 1 }
          flags: { INC_013_OBJECTIVE_TO_SECURITY: true }
    next: END
