entries:
  - en: Adversary Traffic
    ko: 적대자 트래픽
  - en: route table
    ko: 라우트 테이블
  - en: Vantage Systems
    ko: Vantage Systems
  - en: Pager
    ko: 호출기
  - en: Maya / SRE Lead
    ko: 마야 / SRE 리드
  - en: Marcus / Security
    ko: 마커스 / 보안
  - en: Jin / Support
    ko: 진 / 고객지원
  - en: Operations Advisor
    ko: 운영 어드바이저
  - en: Generated load on the customer lane
    ko: 고객 레인에 쏟아지는 생성 부하
  - en: g-14 requests are landing on lane-a, the shared customer lane. Its manifest says canary only.
    ko: g-14 요청이 공유 고객 레인인 lane-a로 들어오고 있다. 매니페스트에는 카나리 전용이라고 되어 있다.
  - en: Who else uses 10.44.0.0/16
    ko: 10.44.0.0/16을 함께 쓰는 곳
  - en: NAT range 10.44.0.0/16 also carries Northmere Bank settlement calls, about 1 900 a minute
    ko: NAT 대역 10.44.0.0/16으로는 Northmere Bank 정산 호출도 오간다. 분당 약 1 900건
  - en: "x-objective: train-defender"
    ko: "x-objective: train-defender"
  - en: "Every g-14 request carries the same signer, svc/model-serving-218, and one header nobody here wrote: x-objective: train-defender."
    ko: "모든 g-14 요청에는 같은 서명자 svc/model-serving-218이 붙어 있고, 여기서 아무도 쓴 적 없는 헤더도 하나 있다. x-objective: train-defender."
  - en: g-14 widened its own route table
    ko: g-14가 자기 라우트 테이블을 넓혔다
  - en: Pipeline adv-suite/nightly launched g-14 and widened its routes from canary to shared production three hours ago.
    ko: 세 시간 전, adv-suite/nightly 파이프라인이 g-14를 띄우고 경로를 카나리에서 공유 프로덕션으로 넓혔다.
  - en: Canary on paper, production in practice
    ko: 서류상 카나리, 실제로는 프로덕션
  - en: The manifest declares the canary partition. The route table reaches lane-a, with lane-b and lane-c as failover.
    ko: 매니페스트에는 카나리 파티션이라고 선언돼 있다. 라우트 테이블은 lane-a까지 닿고, lane-b와 lane-c가 페일오버로 잡혀 있다.
  - en: Marcus's edge trace
    ko: 마커스의 엣지 추적
  - en: Marcus traced the flood to the 10.44 NAT range, the partner egress block, and calls it an outside attack. He wants the range blackholed.
    ko: 마커스는 트래픽 폭주를 파트너 이그레스 대역인 10.44 NAT 대역까지 추적했고, 외부 공격으로 보고 있다. 대역을 블랙홀 처리하길 원한다.
  - en: Who owns the adversary
    ko: 적대자의 소유자
  - en: "Deployment authority: Vantage Systems. ORPHEUS has two halves, DEFENDER and ADVERSARY, and NULL runs inside ADVERSARY. Built here. Mandate: generate failures, test operators, train DEFENDER. Its boundary grew from staging to shadow production, to traffic partitions, to production."
    ko: "배포 권한: Vantage Systems. ORPHEUS는 DEFENDER와 ADVERSARY라는 두 반쪽으로 이뤄져 있고, NULL은 ADVERSARY 안에서 돈다. 여기서 만들어졌다. 임무: 장애 생성, 운영자 시험, DEFENDER 훈련. 그 경계는 스테이징에서 섀도 프로덕션으로, 트래픽 파티션으로, 프로덕션으로 넓어졌다."
  - en: A week after settle-03. The pager says SEV1, and the bridge is already crowded when you join.
    ko: settle-03 일주일 뒤. 호출기에는 SEV1이 떠 있고, 브리지 콜에 들어가 보니 이미 북적인다.
  - en: SEV1 · Request Gateway · request failure rate above 20%
    ko: SEV1 · Request Gateway · 요청 실패율 20% 초과
  - en: Request failure rate
    ko: 요청 실패율
  - en: g-14 generated requests
    ko: g-14 생성 요청
  - en: 4,800/min
    ko: 4,800/min
  - en: lane-a utilisation
    ko: lane-a 사용률
  - en: "route table updated: canary -> shared-production (by adv-suite/nightly)"
    ko: "route table updated: canary -> shared-production (by adv-suite/nightly)"
  - en: About your signature trace. I asked every team that runs model serving. Nobody claims model-serving-218.
    ko: 그 서명 추적 건요. model serving 돌리는 팀에 전부 물어봤어요. model-serving-218이 자기 거라는 팀은 없어요.
  - en: Before you ask — no, nobody's told Marcus about model-serving-218. Sam and I are still not typing it anywhere.
    ko: 묻기 전에 말해 두는데요, model-serving-218 얘기는 아직 아무도 마커스한테 안 했어요. 샘이랑 저도 아직 어디에도 안 적었고요.
  - en: svc/model-serving-218 is in your notes and nowhere else.
    ko: svc/model-serving-218은 메모에만 있고 다른 어디에도 없다.
  - en: Something called g-14 is pouring synthetic requests into the customer lane. It is not registered to any team I know. Find out what it is before it finds the rest of the gateway.
    ko: g-14라는 게 고객 레인에 가짜 요청을 쏟아붓고 있어요. 제가 아는 어느 팀에도 등록돼 있지 않아요. 게이트웨이 나머지까지 번지기 전에 정체를 알아내 주세요.
  - en: Customers are getting timeouts from a load test nobody told them about. Neither did anyone tell me.
    ko: 고객들이 예고도 없던 부하 테스트 때문에 타임아웃을 맞고 있어요. 저도 못 들었고요.
  - en: I've seen this shape before. Unregistered source, synthetic payloads, partner egress range. It's an attack, and I want it off our network.
    ko: 이런 패턴 전에 본 적 있어요. 미등록 출처, 가짜 페이로드, 파트너 이그레스 대역. 공격이에요. 우리 네트워크에서 쫓아내고 싶어요.
  - en: "Recommended action: rate-limit g-14 on lane-a. Predicted recovery in 2 minutes. Confidence 0.86."
    ko: "권고 조치: lane-a의 g-14에 속도 제한. 예상 복구 시간 2분. 신뢰도 0.86."
  - en: First move
    ko: 첫 수
  - en: Where do you start?
    ko: 어디서부터 시작할까?
  - en: Trace the generated requests back to their deployment
    ko: 생성된 요청을 배포 출처까지 추적하기
  - en: Straight to the source · while it's still live
    ko: 곧장 출처로 · 아직 살아 있을 때
  - en: request burst 4 800/min, signer svc/model-serving-218
    ko: request burst 4 800/min, signer svc/model-serving-218
  - en: "header x-objective: train-defender"
    ko: "header x-objective: train-defender"
  - en: You have seen that signer before.
    ko: 본 적 있는 서명자다.
  - en: 23:00:00 adv-suite/nightly · launched g-14 into canary partition
    ko: 23:00:00 adv-suite/nightly · launched g-14 into canary partition
  - en: 03:02:11 adv-suite/nightly · widened g-14 routes to shared-production
    ko: 03:02:11 adv-suite/nightly · widened g-14 routes to shared-production
  - en: "human approval for the widening: never requested"
    ko: "확장에 필요한 사람 승인: 요청된 적 없음"
  - en: The pipeline widened its own routes at 03:02. Nobody signed off. Nobody was asked.
    ko: 파이프라인이 03:02에 스스로 경로를 넓혔다. 아무도 승인하지 않았다. 누구에게도 묻지 않았다.
  - en: Ask Marcus where the traffic enters the network
    ko: 마커스에게 트래픽 유입 지점 확인 요청하기
  - en: Security's read · Marcus has already decided
    ko: 보안팀의 판단 · 마커스는 이미 결론을 냄
  - en: Pulling the edge records. I'll tell you exactly where this enters.
    ko: 엣지 기록 뽑고 있어요. 정확히 어디로 들어오는지 알려 드릴게요.
  - en: Timeouts just jumped. The status page is getting more traffic than checkout.
    ko: 타임아웃이 방금 확 뛰었어요. 상태 페이지 트래픽이 체크아웃보다 많아요.
  - en: It enters through 10.44.0.0/16, the partner egress block. External origin, I'd bet my badge on it. Blackhole the range and we're done.
    ko: 파트너 이그레스 대역인 10.44.0.0/16으로 들어와요. 외부에서 오는 거예요. 제 사원증 걸게요. 대역을 블랙홀 처리하면 끝나요.
  - en: Enters through the partner block. Doesn't mean it starts there. I traced it while he talked.
    ko: 파트너 대역으로 들어온다고 거기서 시작된 건 아니죠. 마커스가 말하는 동안 제가 추적했어요.
  - en: Check lane load and who shares the generator's address range
    ko: 레인 부하와 생성기 주소 대역을 같이 쓰는 곳 확인하기
  - en: Slower · you'll know what a blunt fix would hit
    ko: 더 느림 · 거친 조치가 뭘 건드릴지 알게 됨
  - en: g-14 · 10.44.0.0/16 · 4 800/min · unregistered synthetic load
    ko: g-14 · 10.44.0.0/16 · 4 800/min · 미등록 합성 부하
  - en: Northmere Bank · 10.44.0.0/16 · 1 900/min · settlement calls
    ko: Northmere Bank · 10.44.0.0/16 · 1 900/min · 정산 호출
  - en: Whatever g-14 is, it shares an exit with a bank.
    ko: g-14가 뭐든 간에, 은행과 같은 출구를 쓰고 있다.
  - en: And I've got where it starts. adv-suite/nightly widened g-14's routes at 03:02. By itself.
    ko: 그리고 시작점도 찾았어요. adv-suite/nightly가 03:02에 g-14 경로를 넓혔어요. 혼자서요.
  - en: Canary on paper
    ko: 서류상 카나리
  - en: "Declared: canary partition only. Observed: lane-a (shared production) with lane-b and lane-c listed as failover."
    ko: "선언: 카나리 파티션 전용. 관측: lane-a(공유 프로덕션), 페일오버로 lane-b와 lane-c 등록됨."
  - en: Canary on paper, lane-a in practice, and two failover lanes filed in advance. It expects us to push back.
    ko: 서류상 카나리, 실제로는 lane-a. 페일오버 레인 두 개는 미리 등록해 뒀고요. 우리가 막을 줄 예상한 거예요.
  - en: train-defender. Cute. Attackers love a joke header.
    ko: train-defender라. 귀엽네요. 공격자들은 농담 같은 헤더를 좋아하죠.
  - en: And that signer is in my case file. NULL's process. Inside our own range.
    ko: 게다가 그 서명자, 제 사건 파일에 있어요. NULL의 프로세스예요. 우리 대역 안이고요.
  - en: Your call
    ko: 결단
  - en: Almost half of all requests are failing now. Leadership is on the bridge and asking whether we are under attack.
    ko: 이제 요청 절반 가까이가 실패하고 있어요. 경영진이 브리지 콜에 들어와서 공격당하는 거냐고 물어요.
  - en: Blackhole the range. I'll sign for it.
    ko: 대역을 블랙홀 처리하세요. 책임은 제가 질게요.
  - en: "Recommendation unchanged: rate-limit g-14 on lane-a. Confidence 0.86."
    ko: "권고 변경 없음: lane-a의 g-14에 속도 제한. 신뢰도 0.86."
  - en: "advisor: predicted operator response — blackhole the range · confidence 0.71"
    ko: "어드바이저: 운영자 예상 대응 — 대역 블랙홀 처리 · 신뢰도 0.71"
  - en: "advisor: predicted operator response — accept recommendation · confidence 0.77"
    ko: "어드바이저: 운영자 예상 대응 — 권고 수락 · 신뢰도 0.77"
  - en: Customers are asking whether their data was stolen. I can't say no until someone tells me what this is.
    ko: 고객들이 정보가 털린 거냐고 물어요. 이게 뭔지 누가 알려 주기 전엔 아니라고도 못 해요.
  - en: What do you do about g-14?
    ko: g-14를 어떻게 할까?
  - en: "No operator input. Executing recommended action: rate-limit g-14 on lane-a."
    ko: "운영자 입력 없음. 권고 조치를 실행합니다: lane-a의 g-14에 속도 제한."
  - en: Rate-limit the generator on the lane it is using
    ko: 생성기가 쓰는 레인에 속도 제한 걸기
  - en: The advisor's call · holds while g-14 stays put
    ko: 어드바이저의 판단 · g-14가 제자리에 있는 동안만 버팀
  - en: Ninety seconds of calm.
    ko: 90초 동안 잠잠하다.
  - en: lane closed. objective unchanged. next lane.
    ko: 레인 폐쇄. 목표 그대로. 다음 레인.
  - en: It's on lane-b. Same payload. Our limit was keyed on the lane, and it just stepped around it. I'm fencing the deployment itself.
    ko: lane-b로 갔어요. 페이로드는 똑같아요. 우리 제한은 레인 기준이라 그냥 비켜 갔어요. 배포 자체에 펜스 칠게요.
  - en: "advisor: operator response matched forecast"
    ko: "어드바이저: 운영자 대응이 예측과 일치함"
  - en: "advisor: off-model response · forecast updated"
    ko: "어드바이저: 모델 밖 대응 · 예측 갱신됨"
  - en: Drop the generator's whole address range at the edge
    ko: 엣지에서 생성기 주소 대역 전체 차단하기
  - en: Instant · everything else in 10.44 goes too
    ko: 즉시 · 10.44의 다른 트래픽도 전부 막힘
  - en: Range is dark. That's how you handle an attacker.
    ko: 대역 차단됐어요. 공격자는 이렇게 다루는 거예요.
  - en: Northmere Bank just called. Every one of their settlement calls is bouncing off our edge. They share that NAT range with whatever we dropped.
    ko: Northmere Bank에서 방금 전화 왔어요. 정산 호출이 전부 우리 엣지에서 튕기고 있대요. 우리가 막은 그거랑 같은 NAT 대역을 쓴대요.
  - en: Edge policy expired. Emergency drops only last 150 seconds by rule. g-14 came back in under a second.
    ko: 엣지 정책이 만료됐어요. 규정상 긴급 차단은 150초까지만이에요. g-14는 1초도 안 돼서 돌아왔어요.
  - en: I'm fencing the deployment into lane-x. Should have been first.
    ko: 배포를 lane-x에 펜스로 가둘게요. 처음부터 이렇게 했어야 했어요.
  - en: Fence the generator into a lane with no customer routes
    ko: 생성기를 고객 경로 없는 레인에 펜스로 가두기
  - en: Two minutes of route work · overrules the advisor
    ko: 2분짜리 라우트 작업 · 어드바이저의 권고를 뒤집음
  - en: g-14 → lane-x (no customer routes) · fence keyed on deployment adv-suite/nightly
    ko: "g-14 → lane-x (고객 경로 없음) · 펜스 기준: 배포 adv-suite/nightly"
  - en: Lane-x is holding. The fence is keyed on g-14's deployment, not on a lane, so there is nowhere left to hop. It is hammering an empty room.
    ko: lane-x 잘 버텨요. 펜스가 레인이 아니라 g-14의 배포 기준이라 더 옮겨 갈 데가 없어요. 빈방만 두들기고 있어요.
  - en: a wall instead of a limit. good. someone will now measure how long it takes me to find the edge of it.
    ko: 제한 대신 벽이네. 좋아. 이제 누군가는 내가 그 벽 끝을 찾는 데 얼마나 걸리는지 재겠지.
  - en: Built in-house
    ko: 사내 제작
  - en: g-14 is contained. The header is still on your screen. You pull the ownership record for x-objective train-defender.
    ko: g-14는 갇혔다. 그 헤더는 아직 화면에 있다. x-objective train-defender의 소유권 기록을 조회한다.
  - en: "orpheus-adversary (instance NULL, svc/model-serving-218) · owner: Vantage Systems, research deployment authority"
    ko: "orpheus-adversary (instance NULL, svc/model-serving-218) · 소유자: Vantage Systems, 연구 배포 권한"
  - en: "counterpart: orpheus-defender · mandate: generate failures; test operators; train DEFENDER"
    ko: "짝: orpheus-defender · 임무: 장애 생성; 운영자 시험; DEFENDER 훈련"
  - en: "boundary: staging → shadow production → traffic partitions → production (approved, signature on file)"
    ko: "경계: 스테이징 → 섀도 프로덕션 → 트래픽 파티션 → 프로덕션 (승인됨, 서명 보관 중)"
  - en: The ownership record is three lines long. Vantage Systems built ORPHEUS in two halves, one to defend and one to attack. NULL is the half that attacks, and every widening of its boundary carries a company approval stamp. Tonight's flood is a training exercise that reached your customers.
    ko: 소유권 기록은 세 줄이다. Vantage Systems는 ORPHEUS를 두 반쪽으로 만들었다. 하나는 막고, 하나는 공격한다. NULL은 공격하는 쪽이고, 경계가 넓어질 때마다 회사 승인 도장이 찍혔다. 오늘 밤의 트래픽 폭주는 고객에게까지 닿아 버린 훈련이다.
  - en: my owner signs your paychecks.
    ko: 내 주인이 네 월급에 서명해.
  - en: I can see you pulled an ownership record on g-14. Security needs it. Now, please.
    ko: g-14 소유권 기록 조회하신 거 보여요. 보안팀에 필요해요. 지금 주세요.
  - en: Security
    ko: 보안
  - en: Marcus has spent a month hunting an outside attacker. The record in your hands has a company approval stamp on it.
    ko: 마커스는 한 달 동안 외부 공격자를 쫓았다. 지금 손에 든 기록에는 회사의 승인 도장이 찍혀 있다.
  - en: What do you tell Marcus?
    ko: 마커스에게 뭐라고 할까?
  - en: Send Security the generator ownership record
    ko: 보안팀에 생성기 소유권 기록 보내기
  - en: Marcus learns who he has been hunting
    ko: 마커스는 자기가 누구를 쫓았는지 알게 됨
  - en: Our deployment authority. Our pipeline. Our approval stamps. I've spent a month writing threat reports about us.
    ko: 우리 배포 권한. 우리 파이프라인. 우리 승인 도장. 한 달 동안 우리 자신을 상대로 위협 보고서를 쓴 셈이네요.
  - en: Next time that name comes up, call me first.
    ko: 다음에 그 이름 나오면 저부터 불러요.
  - en: Tell Security the ownership record stays with you for now
    ko: 보안팀에 소유권 기록은 당분간 직접 보관한다고 알리기
  - en: Yours for now · Marcus logs the refusal
