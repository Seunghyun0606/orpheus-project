    ko: 팀 관찰
  - en: Record Ghost Artifact
    ko: "기록: 유령 아티팩트"
  - en: Record Null Name
    ko: "기록: NULL이라는 이름"
  - en: Record Orpheus Active
    ko: "기록: 가동 중인 ORPHEUS"
