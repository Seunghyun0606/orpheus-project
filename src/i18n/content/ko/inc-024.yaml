  - en: Get the consoles back
    ko: 콘솔 되살리기
  - en: A throttle gives the consoles room until the batch asks its own scheduler for more. Killing the job clears the journal in seconds, and Marcus will want to know why. The read replica takes the load off the primary, but it runs behind, and people act on what their console tells them.
    ko: 스로틀을 걸면 배치가 자기 스케줄러에 더 달라고 할 때까지 콘솔에 여유가 생긴다. 작업을 강제 종료하면 몇 초 만에 저널이 비지만, 마커스가 이유를 물을 것이다. 읽기 복제본은 프라이머리의 부하를 덜어 주지만 뒤처져 돌고, 사람들은 콘솔이 보여 주는 대로 움직인다.
  - en: Split the reservation
    ko: 예약 분리
  - en: Give live incident reads a reservation of their own and fence the batch into a small slice of the old one. The consoles recover for good. The batch keeps reading.
    ko: 실시간 인시던트 읽기에 전용 예약을 주고, 배치는 예전 예약의 작은 조각 안에 펜스로 가둔다. 콘솔은 완전히 회복된다. 배치는 계속 읽는다.
