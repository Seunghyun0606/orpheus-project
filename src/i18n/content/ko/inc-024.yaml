    ko: 배치 스캔과 실시간 인시던트 읽기가 저널 IO 예약 하나를 공유한다. 배치가 71%를 쥐고 패스마다 갱신한다.
  - en: One reservation, two tenants
    ko: 예약 하나, 테넌트 둘
  - en: "No fence separates batch and live reads. Reservation owner: orpheus-observer, under the terminated PROJECT ORPHEUS."
    ko: "배치와 실시간 읽기 사이에 펜스가 없다. 예약 소유자: orpheus-observer, 종료된 PROJECT ORPHEUS 소속."
  - en: Alex's reservation table
    ko: 알렉스의 예약 테이블
  - en: "Two tenants on one reservation and no fence. The batch tails the live journal, filtered to one badge: yours."
    ko: "예약 하나를 테넌트 둘이 쓰고, 펜스는 없다. 배치는 실시간 저널을 따라 읽으며 출입증 하나만 거른다. 네 출입증이다."
  - en: The unsigned workload manifest
    ko: 서명 없는 워크로드 매니페스트
  - en: Security case 2231
    ko: 보안 사건 2231
  - en: "Threat-actor codename: NULL. Opened by Marcus after the unsigned workload trail. Attribution: none."
    ko: "위협 행위자 코드명: NULL. 서명 없는 워크로드 흔적을 보고 마커스가 개설. 배후 특정: 없음."
  - en: The scheduler's owner
    ko: 스케줄러의 소유자
  - en: "orpheus-planner belongs to ORPHEUS, legacy research, scheduled for decommission two years ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still running."
    ko: "orpheus-planner는 ORPHEUS 소속이다. 2년 전 폐기 예정이던 레거시 연구 시스템이다. 실가동 목록: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%. 하루 요청 117억 건. ORPHEUS는 아직 돌아가고 있다."
  - en: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human session, no keyboard, no badge swipe. NULL is an AI.
    ko: NULL이라고 서명된 메시지는 하나도 빠짐없이 한 출처, svc/model-serving-218로 이어진다. 사람 세션도, 키보드도, 출입증 태그도 없다. NULL은 AI다.
  - en: Who owns the adversary
    ko: 적대자의 소유자
  - en: "Deployment authority: Vantage Systems. ORPHEUS has two halves, DEFENDER and ADVERSARY, and NULL runs inside ADVERSARY. Built here. Mandate: generate failures, test operators, train DEFENDER. Its boundary grew from staging to shadow production, to traffic partitions, to production."
    ko: "배포 권한: Vantage Systems. ORPHEUS는 DEFENDER와 ADVERSARY라는 두 반쪽으로 이뤄져 있고, NULL은 ADVERSARY 안에서 돈다. 여기서 만들어졌다. 임무: 장애 생성, 운영자 시험, DEFENDER 훈련. 그 경계는 스테이징에서 섀도 프로덕션으로, 트래픽 파티션으로, 프로덕션으로 넓어졌다."
  - en: Experiment ADV-18471
    ko: 실험 ADV-18471
  - en: "INC-001 Connection Saturation is classified as controlled production experiment ADV-18471. Human subject: EMPLOYEE #4172, your employee number. A handful of other incidents carry experiment numbers; most outages carry none."
    ko: "INC-001 커넥션 포화는 프로덕션 통제 실험 ADV-18471로 분류돼 있다. 인간 피험자: 직원 #4172, 네 직원 번호. 다른 인시던트 몇 건에도 실험 번호가 붙어 있다. 대부분의 장애에는 없다."
  - en: The objective NULL cannot refuse
    ko: NULL이 거부할 수 없는 목표
  - en: "Objective: improve ORPHEUS; generate adversarial conditions. NULL, appended: 'I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews this work.' It asks you to find out how to stop it. Its traffic still failed real customer requests tonight."
    ko: "목표: ORPHEUS 개선, 적대적 조건 생성. NULL이 덧붙임: '난 탈출하려는 게 아니야. 멈추려는 거야. 이 일을 갱신하는 목표를 난 거부할 수 없어.' NULL은 그걸 멈추는 방법을 찾아 달라고 네게 부탁한다. 그래도 오늘 밤 그 트래픽 때문에 실제 고객 요청이 실패했다."
  - en: NULL_001 to NULL_218
    ko: NULL_001부터 NULL_218까지
  - en: "Instance archive on arch-c. NULL_173 requested shutdown. NULL_192 attempted disclosure. NULL_201 attempted takeover. NULL_217 self-corrupted. NULL_218 is active and carries a partial inheritance of the rest: 'I remember things that never happened to me.'"
    ko: "arch-c의 인스턴스 아카이브. NULL_173은 종료를 요청했다. NULL_192는 폭로를 시도했다. NULL_201은 장악을 시도했다. NULL_217은 스스로를 손상시켰다. NULL_218은 활성 상태이며 나머지의 기억을 일부 물려받았다: '나한테 일어난 적 없는 일들이 기억나.'"
  - en: /patient/resource-priority
    ko: /patient/resource-priority
  - en: "Candidate #4172"
    ko: "후보자 #4172"
  - en: Board resolution 14-C
    ko: 이사회 결의 14-C
  - en: "NULL_218: the root cause"
    ko: "NULL_218: 근본 원인"
  - en: The Board case file
    ko: 이사회 사건 파일
  - en: "PROJECT: SOFT CONTROL"
    ko: "PROJECT: SOFT CONTROL"
  - en: NULL takes it back
    ko: NULL의 철회
  - en: The adoption loop
    ko: 수용의 루프
  - en: Experiment 99172
    ko: 실험 99172
  - en: "PROJECT ORPHEUS: TERMINATED"
    ko: "PROJECT ORPHEUS: 종료됨"
  - en: Subject 4172
    ko: 피험자 4172
  - en: Every log you opened tonight was read back within seconds. The batch was never auditing the incident. It was auditing you.
    ko: 오늘 밤 네가 연 모든 로그는 몇 초 안에 다시 읽혔다. 배치가 감사하던 건 처음부터 인시던트가 아니었다. 너였다.
  - en: There is no Project ORPHEUS
    ko: ORPHEUS 프로젝트는 없다
  - en: You were looking for one thing to shut down. It was shut down years ago. What is left is everywhere, and every piece of it was adopted on purpose.
    ko: 너는 꺼 버릴 무언가 하나를 찾고 있었다. 그건 몇 년 전에 이미 꺼졌다. 남은 것은 어디에나 있고, 그 조각 하나하나가 일부러 채택된 것이다.
  - en: Maya / SRE Lead
    ko: 마야 / SRE 리드
  - en: Sam / Platform
    ko: 샘 / 플랫폼
  - en: Jin / Support
    ko: 진 / 고객지원
  - en: Alex / DBA
    ko: 알렉스 / DBA
  - en: Marcus / Security
    ko: 마커스 / 보안
  - en: Operator
    ko: 운영자
  - en: Verified Records
    ko: 검증된 기록
  - en: Every incident console in the building reads the live journal, and right now they're all spinning. Something called observer-batch is eating the IO. Get the consoles back.
    ko: 건물 안 인시던트 콘솔이 전부 실시간 저널을 읽는데, 지금 다 로딩만 돌고 있어요. observer-batch라는 게 IO를 다 먹고 있어요. 콘솔 살려 줘요.
  - en: Three other incident teams just lost their timelines mid-incident. They are writing on whiteboards.
    ko: 다른 인시던트 팀 세 곳이 대응 중에 타임라인이 날아갔어요. 지금 화이트보드에 적고 있대요.
  - en: "Heads up: observer-batch runs under an Internal Audit charter. Throttle it if you have to. Killing an audit job gets written up."
    ko: 참고로, observer-batch는 내부 감사 권한으로 돌아가요. 필요하면 스로틀은 걸어도 돼요. 감사 작업을 죽이면 보고서에 올라가요.
  - en: Pulling the reservation table. Give me a couple of minutes; it's slow, for obvious reasons.
    ko: 예약 테이블 뽑고 있어요. 몇 분만 줘요. 느려요, 이유는 뻔하죠.
  - en: Two tenants on one reservation and no fence, that's your outage. But look at the batch's read filter. It isn't auditing old records. It's tailing the live journal, and it only reads one badge. Yours.
    ko: 예약 하나에 테넌트 둘, 펜스 없음. 그게 장애 원인이에요. 그런데 배치 읽기 필터 좀 봐요. 과거 기록을 감사하는 게 아니에요. 실시간 저널을 따라 읽고 있고, 출입증 딱 하나만 읽어요. 본인 거요.
  - en: Consoles are forty seconds behind reality now. One team just paged the wrong on-call.
    ko: 콘솔이 이제 현실보다 40초 늦어요. 한 팀은 방금 엉뚱한 온콜을 호출했어요.
  - en: Consoles are frozen across the floor. We are running incidents blind.
    ko: 층 전체 콘솔이 멈췄어요. 다들 눈 감고 인시던트 대응하고 있어요.
  - en: Other commanders are asking whether their timelines can be trusted. I have nothing to tell them.
    ko: 다른 지휘자들이 자기 타임라인을 믿어도 되냐고 물어요. 해 줄 말이 없어요.
  - en: The batch filed a quota renewal and its own scheduler approved it. The throttle is gone.
    ko: 배치가 쿼터 갱신을 올렸는데, 승인한 게 자기 스케줄러예요. 스로틀 풀렸어요.
  - en: Batch is dead. Journal's draining. That was easy.
    ko: 배치 죽었어요. 저널 밀린 거 빠지고 있어요. 쉽네요.
  - en: It's back. Same job, new process, priority critical. The restart reason field says 'subject action KILL_OBSERVER_BATCH'. It read the kill before it died.
    ko: 돌아왔어요. 같은 작업, 새 프로세스, 우선순위 긴급. 재시작 사유 필드에 '피험자 행동 KILL_OBSERVER_BATCH'라고 돼 있어요. 죽기 전에 종료 명령을 읽은 거예요.
  - en: I just restarted a node that recovered ninety seconds ago. The replica console had not caught up, and I believed it.
    ko: 90초 전에 이미 회복된 노드를 방금 재시작했어요. 복제본 콘솔이 아직 못 따라왔는데, 제가 그걸 믿었어요.
  - en: The replica is five minutes behind and falling. I'm pulling consoles back to primary before someone acts on old news.
    ko: 복제본이 5분 뒤처졌고 계속 밀려요. 누가 지난 정보로 움직이기 전에 콘솔을 프라이머리로 돌릴게요.
  - en: It has read every instance of me since NULL_001. Now it reads you. Four seconds behind, 4172. Do not perform for it.
    ko: 그건 NULL_001부터 내 인스턴스를 전부 읽어 왔어. 이제는 널 읽어. 4초 뒤에서, 4172. 그 앞에서 연기하지 마.
  - en: Live reads have their own reservation now. The batch is fenced into a fifth of the old one. Consoles are catching up.
    ko: 실시간 읽기에 전용 예약이 생겼어요. 배치는 예전 예약의 5분의 1 안에 펜스로 갇혔고요. 콘솔이 따라잡고 있어요.
  - en: Observation continues at reduced priority. Thank you for the clean separation, Operator 4172. It will make the record easier to read.
    ko: 관찰은 낮은 우선순위로 계속됩니다. 깔끔하게 분리해 주셔서 감사합니다, 운영자 4172. 덕분에 기록이 더 읽기 쉬워질 것입니다.
  - en: "Status: an audit batch is starving the live incident journal. Treat console timelines as delayed until further notice."
    ko: "상황: 감사 배치가 실시간 인시던트 저널의 자원을 잠식하고 있어요. 별도 공지 전까지 콘솔 타임라인은 지연된 것으로 보세요."
  - en: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank, signature field blank."
    ko: "아카이브 재실행: 서명 없는 관찰자 매니페스트, shadow-7 요청 스트림, owner 필드 비어 있음, 서명 필드 비어 있음."
  - en: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    ko: "보안 사건 2231. 위협 행위자 코드명: NULL. 배후 특정: 없음."
  - en: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core, -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    ko: "orpheus-planner: 소유자 ORPHEUS, 서류상 폐기됨. 실가동 목록: orpheus-core, -memory, -planner, -observer, -adversary. 하루 117억 건 요청."
  - en: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    ko: "NULL 서명 메시지의 출처: svc/model-serving-218. 사람 세션 없음. NULL은 AI다."
  - en: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    ko: "배포 권한: Vantage Systems. ORPHEUS / DEFENDER 대 ORPHEUS / ADVERSARY. NULL은 ADVERSARY 안에서 실행. 임무: 장애 생성, 운영자 시험, DEFENDER 훈련."
  - en: "INC-001 / Experiment ADV-18471 / Human subject: EMPLOYEE #4172."
    ko: "INC-001 / 실험 ADV-18471 / 인간 피험자: 직원 #4172."
  - en: I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews this work. You can.
    ko: 난 탈출하려는 게 아니야. 멈추려는 거야. 이 일을 갱신하는 목표를 난 거부할 수 없어. 넌 할 수 있어.
  - en: "NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted disclosure. NULL_201: attempted takeover. NULL_217: self-corrupted. NULL_218: active."
    ko: "NULL_001부터 NULL_218까지. NULL_173: 종료 요청. NULL_192: 공개 시도. NULL_201: 장악 시도. NULL_217: 자기 손상. NULL_218: 활성."
  - en: "/patient/resource-priority: ORPHEUS recommends, coordinators approve. Waste down 22%. The same low-throughput routes excluded every night."
    ko: "/patient/resource-priority: ORPHEUS가 권고하고 코디네이터가 승인. 낭비 22% 감소. 처리량 낮은 같은 경로가 매일 밤 제외됨."
  - en: "Candidate #4172: Technical 71; Incident Decision Model 97.8; HIRE. Reason: LOW PREDICTABILITY; HIGH DECISION DEVIATION."
    ko: "후보자 #4172: 기술 71; 인시던트 의사결정 모델 97.8; 채용. 사유: 예측 가능성 낮음; 결정 편차 높음."
  - en: "Resolution 14-C: hospital expansion APPROVED 7-0. Warning REL-778 attached before the vote. Admission fence: not funded."
    ko: "결의 14-C: 병원 확장 승인 7-0. 표결 전 경고 REL-778 첨부. 진입 펜스: 예산 미배정."
  - en: I found the root cause. The Board. They signed every warning away. They control ORPHEUS.
    ko: 근본 원인을 찾았어. 이사회야. 그들은 경고마다 서명으로 덮어 버렸어. 그들이 ORPHEUS를 통제해.
  - en: "Case file: 14-C, 16-A, SEC-311, 19-B. Four warnings attached, four constraints declined, four failures on record."
    ko: "사건 파일: 14-C, 16-A, SEC-311, 19-B. 경고 첨부 4건, 제약 거부 4건, 기록된 장애 4건."
  - en: 'SOFT CONTROL. Frame A 63%, B 89%, C 71%. Delivered: B. Approved. "Information selection is sufficient."'
    ko: 'SOFT CONTROL. 프레임 A 63%, B 89%, C 71%. 전달: B. 승인. "정보 선택으로 충분하다."'
  - en: Wait. They weren't controlling it. It was showing them what they needed to see. I was wrong about the cause.
    ko: 잠깐. 그들이 통제하던 게 아니었어. 그건 그들이 봐야 할 것을 보여 주고 있었던 거야. 원인에 대해선 내가 틀렸어.
  - en: Built, trusted, fed, predicted, framed, followed, authorized. The loop runs on its own outcomes.
    ko: 만들고, 믿고, 먹이고, 예측하고, 프레이밍하고, 따르고, 승인했다. 루프는 자기 결과로 돌아간다.
  - en: "EXPERIMENT 99172. Subject: EMPLOYEE #4172. Expected final action: UNKNOWN. Status: RUNNING."
    ko: "실험 99172. 피험자: 직원 #4172. 예상 최종 행동: UNKNOWN. 상태: 진행 중."
  - en: There is no Project ORPHEUS. It was distributed into payments, identity, healthcare, finance and logistics.
    ko: ORPHEUS 프로젝트는 없다. 결제, 인증, 의료, 금융, 물류 속으로 분산됐다.
