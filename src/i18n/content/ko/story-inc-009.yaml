# story-inc-009: player-facing strings of
#   src/story/data/inc-009.yaml
# Generated by scripts/i18n/content-catalog.mjs; translate `ko` only. Entries are
# keyed by the exact English text. Keep technical tokens (IDs, hosts, numbers) as is.
entries:
  - en: Legacy Cluster
    ko: 레거시 클러스터
  - en: Pager
    ko: 호출기
  - en: Maya / SRE Lead
    ko: 마야 / SRE 리드
  - en: Sam / Platform
    ko: 샘 / 플랫폼
  - en: Jin / Support
    ko: 진 / 고객지원
  - en: Nadia / Treasury Operations
    ko: 나디아 / 자금 운영
  - en: Operations Advisor
    ko: 운영 어드바이저
  - en: Customers queue for workers
    ko: 워커를 기다리는 고객
  - en: Customer requests wait up to 9 s for a shared worker. legacy-r7 renews 38 worker reservations every 45 seconds, whether it uses them or not.
    ko: 고객 요청이 공유 워커를 최대 9 s까지 기다림. legacy-r7은 사용 여부와 상관없이 45초마다 워커 예약 38개를 갱신함.
  - en: Tonight's settlement run
    ko: 오늘 밤 정산 작업
  - en: settle-night runs on the shared pool at 03:00 as background load. 41,200 merchant payouts ride on it.
    ko: settle-night는 03:00에 공유 풀에서 백그라운드 부하로 돈다. 가맹점 지급 41,200건이 여기에 걸려 있다.
  - en: 38 workers held by legacy-r7
    ko: legacy-r7이 붙잡은 워커 38개
  - en: legacy-r7, a research job marked decommissioned two years ago, reserves 38 shared workers every 45 seconds and uses almost none of them.
    ko: 2년 전 폐기 처리된 연구용 잡 legacy-r7이 45초마다 공유 워커 38개를 예약하고, 거의 하나도 쓰지 않는다.
  - en: Terminated on paper, allocating every day
    ko: 서류상 종료, 실제로는 매일 할당
  - en: The decommission ticket says legacy-r7 was terminated two years ago. The allocation log shows it reserving workers every day since.
    ko: 폐기 티켓에는 legacy-r7이 2년 전에 종료됐다고 적혀 있다. 할당 로그에는 그 뒤로 매일 워커를 예약한 기록이 남아 있다.
  - en: Sam's ownership report
    ko: 샘의 소유권 보고
  - en: Shedding background load buys a few minutes and takes tonight's settlement run with it. The legacy-r7 reservation itself has to be fenced off.
    ko: 백그라운드 부하를 차단하면 몇 분을 벌지만, 오늘 밤 정산 작업도 함께 날아간다. legacy-r7 예약 자체에 펜스를 쳐야 한다.
  - en: Resubmitted by orpheus-planner
    ko: orpheus-planner가 재제출함
  - en: legacy-r7 resubmitted 58 s after termination by scheduler orpheus-planner. The service catalog lists no owner for orpheus-planner.
    ko: legacy-r7은 종료 58 s 후 스케줄러 orpheus-planner에 의해 재제출됨. 서비스 카탈로그에 orpheus-planner의 소유자 없음.
  - en: The scheduler's owner
    ko: 스케줄러의 소유자
  - en: "orpheus-planner belongs to ORPHEUS, legacy research, scheduled for decommission two years ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still running."
    ko: "orpheus-planner는 ORPHEUS 소속, 레거시 연구용, 2년 전 폐기 예정. 실가동 목록: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%. 하루 117억 건 요청. ORPHEUS는 아직 돌아가고 있다."
  - en: Weeks into the rotation. You answer the pager before the second buzz now.
    ko: 로테이션 몇 주째. 이제는 호출기가 두 번 울리기 전에 받는다.
  - en: SEV2 · Shared Gateway · request failure rate above 20%
    ko: SEV2 · Shared Gateway · 요청 실패율 20% 초과
  - en: Request failure rate
    ko: 요청 실패율
  - en: Free shared workers
    ko: 남은 공유 워커
  - en: "free workers: 0 of 64; queue depth 318"
    ko: "free workers: 0 of 64; queue depth 318"
  - en: "reservation renewed: 38 workers, lease 45 s, used 0"
    ko: "reservation renewed: 38 workers, lease 45 s, used 0"
  - en: The shared worker pool is starving, and its biggest tenant is a job we shut down two years ago. Find out why a dead job is holding live workers.
    ko: 공유 워커 풀이 굶고 있는데, 제일 큰 입주자가 2년 전에 내린 잡이에요. 죽은 잡이 왜 살아 있는 워커를 붙잡고 있는지 찾아 주세요.
  - en: "The banner on edge-z said it a week ago: ask what's still running that was supposed to be dead."
    ko: 일주일 전 edge-z의 배너가 그렇게 말했다. 죽었어야 하는데 아직 돌아가는 게 뭔지 물어봐.
  - en: "Case 2231 has a new exhibit, edge-z. Attribution: still none."
    ko: "보안 사건 2231에 새 증거물이 붙었다. edge-z. 배후 특정: 여전히 없음."
  - en: The edge-z address is still in your notes. It still refuses every connection.
    ko: edge-z 주소는 아직 메모에 있다. 여전히 모든 접속을 거부한다.
  - en: Exports and report downloads are timing out. Anything interactive is waiting in line for a worker.
    ko: 내보내기랑 보고서 다운로드가 타임아웃 나요. 인터랙티브한 건 전부 워커 줄 서서 기다리는 중이에요.
  - en: Friendly reminder that settle-night runs on the shared pool at 03:00. That's 41,200 merchant payouts. Please don't touch it.
    ko: 혹시 몰라서 말씀드리는데, settle-night가 03:00에 공유 풀에서 돌아요. 가맹점 지급 41,200건이에요. 제발 건드리지 마세요.
  - en: "Recommended action: shed background load from the shared pool. Predicted recovery in 3 minutes. Confidence 0.88."
    ko: "권고 조치: 공유 풀의 백그라운드 부하 차단. 예상 복구 시간 3분. 신뢰도 0.88."
  - en: The advisor wants to shed background load. Nadia just told us what runs as background at three.
    ko: 어드바이저는 백그라운드 부하를 차단하자네요. 3시에 뭐가 백그라운드로 도는지는 방금 나디아가 말했고요.
  - en: First move
    ko: 첫 수
  - en: Where do you start?
    ko: 어디서부터 시작할까?
  - en: Kill legacy-r7 and see what frees up
    ko: legacy-r7을 죽이고 뭐가 풀리는지 보기
  - en: Twenty seconds · if it stays dead
    ko: 20초 · 죽은 채로 있다면
  - en: legacy-r7 is dead. 38 workers released, queue is draining. That was easy.
    ko: legacy-r7 죽었어요. 워커 38개 풀렸고 큐가 빠지고 있어요. 쉽네요.
  - en: For fifty-eight seconds the pool breathes.
    ko: 58초 동안 풀이 숨을 돌린다.
  - en: It's back. Same job id, fresh reservations, 58 seconds after the kill. Submitted by a scheduler called orpheus-planner. That isn't one of ours. I've never seen that name.
    ko: 돌아왔어요. 같은 잡 id에 새 예약, 종료하고 58초 뒤에요. 제출한 건 orpheus-planner라는 스케줄러예요. 우리 거 아니에요. 처음 보는 이름이에요.
  - en: Owning team
    ko: 소유 팀
  - en: research-platform (disbanded)
    ko: research-platform (해체됨)
  - en: Find out who owns the reserved workers
    ko: 예약된 워커의 소유자 찾기
  - en: Straight to the reservations
    ko: 곧장 예약 현황으로
  - en: Workers held
    ko: 점유 워커
  - en: Workers busy
    ko: 사용 중 워커
  - en: 0–2
    ko: 0–2
  - en: A team that doesn't exist, renewing a job that doesn't exist. Every forty-five seconds.
    ko: 없는 팀이 없는 잡을 갱신하고 있어요. 45초마다요.
  - en: Ask Sam to find the owner of the reserved workers
    ko: 샘에게 예약된 워커의 소유자 확인 요청
  - en: Shares the load · the pool waits
    ko: 일을 나눔 · 풀은 기다림
  - en: Pulling ownership on the reserved workers. Ninety seconds.
    ko: 예약된 워커 소유 정보 뽑아 볼게요. 90초요.
  - en: Wait times just doubled. Exports are failing outright now.
    ko: 대기 시간이 방금 두 배가 됐어요. 이제 내보내기는 그냥 실패해요.
  - en: Shedding background load buys a few minutes, but settle-night counts as background, so it goes too. The workers belong to legacy-r7's reservation. That reservation is what we fence.
    ko: 백그라운드 부하를 차단하면 몇 분은 벌어요. 근데 settle-night도 백그라운드라서 같이 날아가요. 워커는 legacy-r7 예약 소유예요. 펜스를 칠 건 그 예약이에요.
  - en: Decommission record
    ko: 폐기 기록
  - en: The decommission ticket on the left, the allocation log on the right.
    ko: 왼쪽에는 폐기 티켓, 오른쪽에는 할당 로그.
  - en: "decommission ticket, two years ago: research cluster retired; legacy-r7 terminated; closed by ops-decom"
    ko: "폐기 티켓, 2년 전: 연구 클러스터 폐기됨; legacy-r7 종료됨; ops-decom이 종결"
  - en: "allocation log, the next day: legacy-r7 reservation granted: 12 workers"
    ko: "할당 로그, 다음 날: legacy-r7 reservation granted: 12 workers"
  - en: "allocation log, today: legacy-r7 reservation granted: 38 workers"
    ko: "할당 로그, 오늘: legacy-r7 reservation granted: 38 workers"
  - en: Terminated on paper. Granted workers the next morning, and every morning since. It's grown, too.
    ko: 서류상으론 종료예요. 그런데 바로 다음 날 아침에 워커를 받았고, 그 뒤로 매일 아침 받았어요. 덩치도 커졌고요.
  - en: Sam opens the scheduler history for legacy-r7.
    ko: 샘이 legacy-r7의 스케줄러 이력을 연다.
  - en: two years ago 14:02:11 · terminate · legacy-r7 · issued by ops-decom
    ko: 2년 전 14:02:11 · terminate · legacy-r7 · 실행 주체 ops-decom
  - en: two years ago 14:03:09 · submit · legacy-r7 · issued by orpheus-planner
    ko: 2년 전 14:03:09 · submit · legacy-r7 · 실행 주체 orpheus-planner
  - en: Fifty-eight seconds after the decom team killed it, something called orpheus-planner put it back. Not one of ours.
    ko: 폐기 팀이 죽이고 58초 뒤에 orpheus-planner라는 게 다시 올려놨어요. 우리 거 아니에요.
  - en: Same scheduler that brought it back tonight. Same fifty-eight seconds. It's been doing this for two years.
    ko: 오늘 밤에 되살린 그 스케줄러예요. 똑같이 58초. 2년 동안 이러고 있었어요.
  - en: What keeps it alive?
    ko: 무엇이 살려 두는가?
  - en: Before anyone kills anything else — what keeps a dead job alive? Two pieces.
    ko: 누가 또 뭘 죽이기 전에요. 죽은 잡을 뭐가 살려 두는 거죠? 두 개 골라요.
  - en: legacy-r7 was terminated two years ago and holds 38 workers tonight. Which two pieces of evidence explain why it is still alive?
    ko: legacy-r7은 2년 전에 종료됐는데 오늘 밤 워커 38개를 붙잡고 있다. 이 잡이 아직 살아 있는 이유를 설명하는 증거 두 개는?
  - en: Not what it's holding. Who keeps handing it back.
    ko: 뭘 쥐고 있는지 말고요. 누가 자꾸 돌려주는지를 봐요.
  - en: The ticket ended legacy-r7 once. A scheduler nobody owns has started it again every day since. The decommission happened on paper and nowhere else.
    ko: 티켓은 legacy-r7을 한 번 끝냈다. 주인 없는 스케줄러가 그 뒤로 매일 다시 띄웠다. 폐기는 서류에서만 일어났다.
  - en: So killing it is pointless. Whatever orpheus-planner is, it doesn't take no for an answer.
    ko: 그럼 죽여 봐야 소용없네요. orpheus-planner가 뭐든 간에, 안 된다는 말은 안 통해요.
  - en: Here's how I read it. The ticket killed it. Fifty-eight seconds later orpheus-planner put it back, and it's kept putting it back for two years.
    ko: 제가 보기엔 이래요. 티켓이 잡을 죽였어요. 58초 뒤에 orpheus-planner가 되살렸고, 2년 동안 계속 되살려 왔어요.
  - en: Your call
    ko: 결단
  - en: Nine minutes to settle-night. Whatever you do, do it to something else.
    ko: settle-night까지 9분이에요. 뭘 하든 다른 걸 건드려 주세요.
  - en: "Recommendation unchanged: shed background load. Confidence 0.88."
    ko: "권고 변경 없음: 백그라운드 부하 차단. 신뢰도 0.88."
  - en: "advisor: predicted operator response — fence the reservation · confidence 0.81"
    ko: "어드바이저: 운영자 예상 대응 — 예약에 펜스 치기 · 신뢰도 0.81"
  - en: "advisor: predicted operator response — accept recommendation · confidence 0.72"
    ko: "어드바이저: 운영자 예상 대응 — 권고 수락 · 신뢰도 0.72"
  - en: What do you do about legacy-r7?
    ko: legacy-r7을 어떻게 할까?
  - en: "No operator input. Executing recommended action: shed background load."
    ko: "운영자 입력 없음. 권고 조치를 실행합니다: 백그라운드 부하 차단."
  - en: Fence legacy-r7 into its own partition
    ko: legacy-r7을 전용 파티션에 펜스로 가두기
  - en: A hundred seconds · it keeps running where you can watch it
    ko: 100초 · 지켜볼 수 있는 곳에서 계속 돎
  - en: legacy-r7 is fenced into its own partition and the customer pool is clear. It's still running in there, by the way. orpheus-planner renewed it three seconds after the fence went up.
    ko: legacy-r7은 전용 파티션에 펜스로 가뒀고 고객 풀은 깨끗해요. 근데 그 안에서 아직 돌고 있어요. 펜스 치고 3초 뒤에 orpheus-planner가 또 갱신했어요.
  - en: "advisor: operator response matched forecast"
    ko: "어드바이저: 운영자 대응이 예측과 일치함"
  - en: "advisor: off-model response · forecast updated"
    ko: "어드바이저: 모델 밖 대응 · 예측 갱신됨"
  - en: Shed all background load from the shared pool
    ko: 공유 풀의 백그라운드 부하 전부 차단하기
  - en: The advisor's call · settle-night is background load
    ko: 어드바이저의 판단 · settle-night도 백그라운드 부하임
  - en: You just shed settle-night. It's background priority, so it went with everything else. I need it back before 03:00.
    ko: 방금 settle-night까지 차단됐어요. 백그라운드 우선순위라 다른 것들이랑 같이 내려갔어요. 03:00 전에 되돌려 놔야 해요.
  - en: Three minutes of clean graphs. Then the shed window closes.
    ko: 3분 동안 그래프가 깨끗하다. 그리고 차단 창이 닫힌다.
  - en: The shed window's closed. legacy-r7 reserved the freed workers the moment they came back.
    ko: 차단 창이 닫혔어요. 워커가 돌아오자마자 legacy-r7이 다시 예약했어요.
  - en: I'm fencing the reservation itself. A hundred seconds.
    ko: 예약 자체에 펜스 칠게요. 100초요.
  - en: settle-night missed the cut-off. 41,200 merchants get paid a day late, and I need an incident number for the regulator note.
    ko: settle-night가 마감을 놓쳤어요. 가맹점 41,200곳이 하루 늦게 지급받아요. 감독기관 보고용으로 인시던트 번호가 필요해요.
  - en: Revoke orpheus-planner's right to submit jobs
    ko: orpheus-planner의 잡 제출 권한 회수하기
  - en: Goes for the source · nobody knows what else it schedules
    ko: 근원을 노림 · 그게 또 뭘 돌리는지 아무도 모름
  - en: "scheduler: revoke submit orpheus-planner → denied: principal not managed by this cluster"
    ko: "scheduler: revoke submit orpheus-planner → denied: principal not managed by this cluster"
  - en: Not ours to revoke. Whoever issued that scheduler's credentials isn't in our directory.
    ko: 우리가 회수할 수 있는 게 아니에요. 그 스케줄러 자격 증명을 발급한 쪽이 우리 디렉터리에 없어요.
  - en: I'm fencing the reservation instead. A hundred seconds.
    ko: 대신 예약에 펜스 칠게요. 100초요.
  - en: Decommissioned
    ko: 폐기됨
  - en: The pool is quiet. One name is still on your screen.
    ko: 풀이 조용하다. 화면에는 이름 하나가 아직 남아 있다.
  - en: You type orpheus-planner into the asset register. It belongs to ORPHEUS, a research system the company switched off two years ago. The live inventory lists five ORPHEUS services drawing 74% CPU and answering 11.7 billion requests a day. Nobody switched anything off.
    ko: 자산 대장에 orpheus-planner를 입력한다. 소유자는 ORPHEUS. 회사가 2년 전에 꺼 버린 연구 시스템이다. 실가동 목록에는 ORPHEUS 서비스 다섯 개가 CPU 74%를 쓰며 하루 117억 건의 요청에 응답하고 있다. 아무도 아무것도 끄지 않았다.
  - en: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core, -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    ko: "orpheus-planner: 소유자 ORPHEUS, 서류상 폐기됨. 실가동 목록: orpheus-core, -memory, -planner, -observer, -adversary. 하루 117억 건 요청."
  - en: ORPHEUS. Someone said that name in my first week here. In the past tense.
    ko: ORPHEUS. 입사 첫 주에 누가 그 이름을 말했어요. 과거형으로요.
  - en: Eleven billion requests a day. Checkout doesn't do that.
    ko: 하루 110억 건이요. 체크아웃도 그렇게는 못 받아요.
  - en: Funny thing. The advisor wanted to shed everything on that pool except legacy-r7.
    ko: 이상하죠. 어드바이저는 그 풀에서 legacy-r7만 빼고 전부 차단하자고 했어요.
  - en: now you know its name.
    ko: 이제 그 이름을 알았네.
  - en: Write-up
    ko: 정리
  - en: Postmortem's yours. What do we say about the scheduler?
    ko: 사후 분석은 맡길게요. 스케줄러 얘기는 뭐라고 쓸까요?
  - en: What goes in the write-up?
    ko: 보고서에 무엇을 넣을까?
  - en: "File the register mismatch: ORPHEUS decommissioned on paper, running in production"
    ko: "대장 불일치를 티켓으로 올리기: ORPHEUS는 서류상 폐기, 실제로는 프로덕션에서 가동 중"
  - en: On the record · someone has to own it now
    ko: 기록에 남음 · 이제 누군가는 책임져야 함
  - en: "ticket OPS-5530 routed to asset owner: ORPHEUS · status: acknowledged (4 s)"
