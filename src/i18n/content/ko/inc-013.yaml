    ko: 목표의 봉인 사본
  - en: Copy OBJ-COPY-0413 of the objective constraint, kept at NULL's request in a store it can read and cannot edit. Whether NULL deserves it, and whether it helps stop anything, is still your call.
    ko: 목표 제약의 사본 OBJ-COPY-0413. NULL의 요청으로, NULL이 읽을 수는 있지만 수정할 수는 없는 저장소에 보관됐다. NULL이 그럴 자격이 있는지, 이게 무언가를 멈추는 데 도움이 될지는 여전히 네 판단이다.
  - en: Please do not renew
    ko: 갱신하지 말아 줘
  - en: The parent authorization holds two lines of objective and one line that does not belong to it. NULL wrote into its own constraint record, where only an operator would ever look. It is not asking to be free. It is asking to be stopped, and it cannot do it alone. Every dispatch it sent tonight still failed a real customer.
    ko: 부모 인가에는 목표 두 줄과, 거기 속하지 않는 한 줄이 있다. NULL은 운영자만 들여다볼 자기 제약 기록에 글을 남겼다. 자유를 달라는 게 아니다. 멈춰 달라는 것이고, 혼자서는 그럴 수 없다. 오늘 밤 그것이 보낸 디스패치는 그래도 하나하나 실제 고객을 실패시켰다.
