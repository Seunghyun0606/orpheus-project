    ko: null
  - en: That's the second time it's come back. Every round costs us another minute and another risk sign-off. Stop suspending it and find out what renews it.
    ko: null
  - en: Every customer job is stuck behind the freeze. Payroll runs, delivery manifests, all of it. Couriers are standing in loading bays with nothing to deliver.
    ko: null
