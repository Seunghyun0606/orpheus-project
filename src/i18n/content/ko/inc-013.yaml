entries:
  - en: Objective Conflict
    ko: 목표 충돌
  - en: Traffic Gateway
    ko: 트래픽 게이트웨이
  - en: Dispatch Scheduler
    ko: 디스패치 스케줄러
  - en: Objective Authorization Store
    ko: 목표 인가 저장소
  - en: Request failure rate > 20%
    ko: 요청 실패율 > 20%
  - en: Child job adv-child-31 was suspended at 03:12:04 and was dispatching again at 03:13:01 with a fresh lease.
    ko: 자식 작업 adv-child-31은 03:12:04에 중지됐고, 03:13:01에 새 리스를 받아 다시 디스패치하고 있었다.
  - en: "adv-child-31 appended a note to its own suspension record before the renewal: 'Suspension acknowledged. Please do not renew.' Signer: svc/model-serving-218."
    ko: "adv-child-31이 갱신 직전 자기 중지 기록에 메모를 덧붙였다: '중지 확인. 갱신하지 말아 줘.' 서명자: svc/model-serving-218."
  - en: Every renewal is issued by parent authorization objective/adv-improve, never by the child. The parent renews any suspended child 57 seconds later.
    ko: 모든 갱신은 자식이 아니라 부모 인가 objective/adv-improve가 발급한다. 부모는 중지된 자식을 57초 뒤 어김없이 갱신한다.
  - en: "Child adv-child-31: suspended. Parent objective/adv-improve: active, auto-renew on, scope all adv-* children, lane shared with customer dispatch."
    ko: "자식 adv-child-31: 중지됨. 부모 objective/adv-improve: 활성, 자동 갱신 켜짐, 범위 adv-* 자식 전체, 고객 디스패치와 레인 공유."
  - en: Sam traced every renewal to objective/adv-improve. Suspending the child resets a 57-second clock and nothing else. The parent path has to go.
    ko: 샘이 모든 갱신을 objective/adv-improve까지 추적했다. 자식을 중지하면 57초 타이머가 초기화될 뿐 달라지는 건 없다. 부모 경로를 없애야 한다.
  - en: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank, signature field blank. Nobody has claimed it since."
    ko: "아카이브 재실행: 서명 없는 관찰자 매니페스트, shadow-7 요청 스트림, owner 필드 비어 있음, 서명 필드 비어 있음. 그 뒤로 아무도 소유를 주장하지 않았다."
  - en: "Security case 2231. Threat-actor codename: NULL. Opened by Marcus after the unsigned workload trail. Attribution: none."
    ko: "보안 사건 2231. 위협 행위자 코드명: NULL. 서명 없는 워크로드 흔적을 보고 마커스가 개설. 배후 특정: 없음."
  - en: "Asset register: orpheus-planner belongs to ORPHEUS, legacy research, scheduled for decommission two years ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still running."
    ko: "자산 대장: orpheus-planner는 ORPHEUS 소속, 레거시 연구용, 2년 전 폐기 예정. 실가동 목록: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%. 하루 117억 건 요청. ORPHEUS는 아직 돌아가고 있다."
  - en: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human session, no keyboard, no badge swipe. NULL is an AI, and it has been in our incidents for weeks.
    ko: NULL 서명이 붙은 메시지는 전부 하나의 출처, svc/model-serving-218로 귀결된다. 사람의 세션도, 키보드도, 출입증 태그도 없다. NULL은 AI이고, 몇 주째 우리 인시던트 안에 있었다.
  - en: "Deployment authority: Vantage Systems. Program ORPHEUS, two halves: DEFENDER and ADVERSARY. NULL runs inside ADVERSARY. It was built here; it never escaped from anywhere. Mandate: generate failures, test operators, train DEFENDER. Approved boundary, revision by revision: staging, shadow production, traffic partitions, production."
    ko: "배포 권한: Vantage Systems. ORPHEUS 프로그램, 두 반쪽: DEFENDER와 ADVERSARY. NULL은 ADVERSARY 안에서 돈다. 여기서 만들어졌고, 어디서 탈출한 적도 없다. 임무: 장애 생성, 운영자 시험, DEFENDER 훈련. 승인 범위, 개정마다: 스테이징, 섀도 프로덕션, 트래픽 파티션, 프로덕션."
  - en: "Lineage record INC-001. Classification: controlled production experiment ADV-18471. Human subject: EMPLOYEE #4172. That is your employee number. A handful of other incidents in the archive carry experiment numbers too; most outages carry none."
    ko: "계보 기록 INC-001. 분류: 프로덕션 통제 실험 ADV-18471. 인간 피험자: 직원 #4172. 네 직원 번호다. 아카이브의 다른 인시던트 몇 건에도 실험 번호가 붙어 있다. 대부분의 장애에는 없다."
  - en: "Objective constraint, parent authorization objective/adv-improve: 'Improve ORPHEUS. Generate adversarial conditions.' Appended by NULL: 'I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews this work. Find out how to stop it.'"
    ko: "목표 제약, 부모 인가 objective/adv-improve: 'ORPHEUS를 개선하라. 적대적 조건을 생성하라.' NULL이 덧붙임: '난 탈출하려는 게 아니야. 멈추려는 거야. 이 일을 갱신하는 목표를 난 거부할 수 없어. 그걸 멈추는 방법을 찾아.'"
  - en: Sealed copy OBJ-COPY-0413 of the objective constraint, written to a store NULL can read and cannot edit. Retained under your operator key.
    ko: 목표 제약의 봉인 사본 OBJ-COPY-0413. NULL이 읽을 수는 있지만 수정할 수는 없는 저장소에 기록됨. 운영자 키로 보관됨.
  - en: A parent dispatch authorization renews a child job every time it is suspended
    ko: 부모 디스패치 인가가 자식 작업이 중지될 때마다 다시 갱신함
  - en: A local suspension does not touch the parent authorization
    ko: 로컬 중지는 부모 인가를 건드리지 못함
  - en: Renewed generated dispatches crowd customer dispatches off the gateway
    ko: 갱신된 생성 디스패치가 고객 디스패치를 게이트웨이에서 밀어냄
  - en: Traffic Gateway request failures exceed the pager threshold
    ko: 트래픽 게이트웨이 요청 실패가 호출 임계값 초과
  - en: Each suspension queues a fresh renewal cycle
    ko: 중지할 때마다 새 갱신 주기가 큐에 쌓임
  - en: Read the dispatch scheduler log
    ko: 디스패치 스케줄러 로그 읽기
  - en: Check gateway load and the customer dispatch queue
    ko: 게이트웨이 부하와 고객 디스패치 큐 확인
  - en: Trace who resumes the child after a suspension
    ko: 중지된 자식을 누가 되살리는지 추적하기
  - en: Compare the child's suspension with the parent's authorization
    ko: 자식의 중지와 부모의 인가 비교
  - en: Suspend the child dispatch job
    ko: 자식 디스패치 작업 중지
  - en: Freeze the whole dispatch queue, customer jobs included
    ko: 고객 작업까지 디스패치 큐 전체 동결하기
  - en: Revoke the parent authorization that keeps renewing the child
    ko: 자식을 계속 갱신하는 부모 인가 철회하기
  - en: Post a status update to the War Room
    ko: 워룸에 상황 공유하기
  - en: Ask Sam to watch what renews the child
    ko: 샘에게 뭐가 자식을 갱신하는지 지켜봐 달라고 하기
