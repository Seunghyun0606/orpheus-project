  - en: A cap holds the line for two minutes and turns away real buyers with the bots. More nodes give it more room, if it doesn't take the room first. Deleting the workload is the fastest idea on the table, and Marcus has a hold on it.
    ko: 제한을 걸면 2분은 버티지만 봇과 함께 실제 구매자도 돌려보낸다. 노드를 늘리면 여유가 생긴다. 저것이 먼저 차지하지 않는다면. 워크로드 삭제가 가장 빠른 방법이지만, 마커스가 보류를 걸어 두었다.
