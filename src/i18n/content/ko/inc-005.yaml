    ko: 워크로드에 펜스 치기
  - en: With the lane and pod known, the gateway can push observer-workload into quarantine lane q-0, where it can't touch customer capacity and Security can still read every byte of it.
    ko: 레인과 파드를 알았으니 게이트웨이가 observer-workload를 격리 레인 q-0으로 밀어 넣을 수 있다. 거기서는 고객 용량에 손댈 수 없고, 보안팀은 그 안의 모든 바이트를 계속 읽을 수 있다.
