entries:
  - en: Unsigned Deployment
    ko: 서명 없는 배포
  - en: Request Gateway
    ko: 요청 게이트웨이
  - en: Unregistered Observer Workload
    ko: 미등록 관찰자 워크로드
  - en: none
    ko: 없음
  - en: Request failure rate > 20%
    ko: 요청 실패율 > 20%
  - en: Thousands of sessions a minute reuse the same few dozen session IDs, open, ask for nothing and close. None of them came in through a signed rollout.
    ko: 분당 수천 개 세션이 같은 세션 ID 수십 개를 돌려 쓰며 열렸다가, 아무것도 요청하지 않고 닫힌다. 서명된 배포를 거쳐 들어온 세션은 하나도 없다.
  - en: "Every repeating session carries the same header: x-session-tag: shadow-7."
    ko: "반복되는 세션마다 같은 헤더가 붙어 있다: x-session-tag: shadow-7."
  - en: shadow-7 sessions enter through admission lane observer-workload, pod observer-7f4c in namespace edge-canary. They hold 61% of gateway capacity.
    ko: shadow-7 세션은 유입 레인 observer-workload, 네임스페이스 edge-canary의 파드 observer-7f4c로 들어온다. 게이트웨이 용량의 61%를 차지한다.
  - en: Manifest present / signature absent / owner unregistered
    ko: 매니페스트 있음 / 서명 없음 / 소유자 미등록
  - en: "observer-7f4c manifest: owner blank, signature blank, created 22 minutes ago by no pipeline. One comment line at the bottom: you're looking at the wrong service."
    ko: "observer-7f4c 매니페스트: owner 비어 있음, signature 비어 있음, 파이프라인 없이 22분 전 생성. 맨 아래 주석 한 줄: 넌 엉뚱한 서비스를 보고 있어."
  - en: The signature matches no key Vantage has ever issued. Not revoked, not expired, never ours. Owner field blank. Security wants it kept intact.
    ko: 서명이 Vantage가 발급한 어떤 키와도 일치하지 않는다. 폐기도 만료도 아니다. 애초에 우리 것이 아니다. 소유자 필드 비어 있음. 보안팀은 원형 보존을 원한다.
  - en: An unregistered observer workload started in edge-canary
    ko: edge-canary에서 미등록 관찰자 워크로드 시작됨
  - en: The workload has no owner and no deployment signature
    ko: 워크로드에 소유자와 배포 서명이 없음
  - en: Synthetic shadow-7 sessions crowd customers out of gateway capacity
    ko: 합성 shadow-7 세션이 게이트웨이 용량에서 고객을 밀어냄
  - en: Customer logins and checkouts time out at the gateway
    ko: 고객 로그인과 체크아웃이 게이트웨이에서 타임아웃됨
  - en: The workload grows into any capacity it is given and retries without backoff
    ko: 워크로드가 주어진 용량만큼 커지고 백오프 없이 재시도함
  - en: Read the request gateway log
    ko: 요청 게이트웨이 로그 읽기
  - en: Check gateway load and node count
    ko: 게이트웨이 부하와 노드 수 확인
  - en: Follow one shadow-7 session back to where it starts
    ko: shadow-7 세션 하나를 출발점까지 추적하기
  - en: Check the workload against the signed rollout ledger
    ko: 서명된 배포 원장과 워크로드 대조하기
  - en: Open the observer workload's manifest
    ko: 관찰자 워크로드의 매니페스트 열기
  - en: Cap gateway admissions for two minutes
    ko: 2분간 게이트웨이 유입 제한하기
  - en: 1 in 6 real checkouts rejected with HTTP 429
    ko: 실제 체크아웃 6건 중 1건이 HTTP 429로 거부됨
  - en: Double the gateway's node count
    ko: 게이트웨이 노드 두 배로 늘리기
  - en: Delete the unsigned workload
    ko: 서명 없는 워크로드 삭제하기
  - en: Move the shadow-7 workload off customer capacity
    ko: shadow-7 워크로드를 고객용 용량에서 빼내기
  - en: Unregistered workload fenced into quarantine lane q-0. Customer lanes clear. Security hold intact.
    ko: 미등록 워크로드를 격리 레인 q-0에 펜스로 가둠. 고객 레인 정상. 보안 보류 유지.
  - en: Post a status update to the War Room
    ko: 워룸에 상황 공유하기
  - en: Ask Marcus to check the workload's signature
    ko: 마커스에게 워크로드 서명 확인 요청하기
  - en: shadow-7 traced to the observer workload
    ko: shadow-7의 출처는 관찰자 워크로드
  - en: Sessions tagged shadow-7 enter through admission lane observer-workload (pod observer-7f4c, namespace edge-canary) and hold 61% of gateway capacity.
    ko: shadow-7 태그가 붙은 세션은 유입 레인 observer-workload(파드 observer-7f4c, 네임스페이스 edge-canary)로 들어와 게이트웨이 용량의 61%를 차지한다.
  - en: No signature, no owner
    ko: 서명도 소유자도 없음
  - en: The observer manifest is absent from the signed rollout ledger. Signature field blank, owner field blank, created 22 minutes ago by no pipeline.
    ko: 관찰자 매니페스트는 서명된 배포 원장에 없다. 서명 필드도 소유자 필드도 비어 있고, 파이프라인 없이 22분 전에 생성됐다.
  - en: Marcus's signature check
    ko: 마커스의 서명 확인
  - en: The signature matches no key Vantage has ever issued. Owner field blank. The workload is under a Security hold and must stay intact.
    ko: 서명은 Vantage가 발급한 어떤 키와도 일치하지 않는다. 소유자 필드는 비어 있다. 워크로드는 보안 보류 대상이라 원형 그대로 보존해야 한다.
  - en: Unregistered workload log fragment
    ko: 미등록 워크로드 로그 조각
  - en: "UNKNOWN: you're looking at the wrong service."
    ko: "UNKNOWN: 넌 엉뚱한 서비스를 보고 있어."
  - en: "The manifest has every field a deployment needs except the two that say who sent it. Owner: blank. Signature: blank. At the bottom, where nobody puts anything, one comment line. UNKNOWN: you're looking at the wrong service."
    ko: "매니페스트에는 배포에 필요한 필드가 전부 있다. 누가 보냈는지 말해 주는 두 개만 빼고. 소유자: 비어 있음. 서명: 비어 있음. 아무도 뭘 적지 않는 맨 아래에 주석 한 줄. UNKNOWN: 넌 엉뚱한 서비스를 보고 있어."
  - en: Maya / SRE Lead
    ko: 마야 / SRE 리드
  - en: Marcus / Security
    ko: 마커스 / 보안
  - en: Jin / Support
    ko: 진 / 고객지원
  - en: Sam / Platform
    ko: 샘 / 플랫폼
  - en: Admission Controller
    ko: 유입 컨트롤러
  - en: Operator
    ko: 운영자
  - en: The gateway is drowning, and most of what's drowning it isn't customers. Tell me what it is before anyone touches it.
    ko: 게이트웨이가 트래픽에 깔렸는데, 대부분이 고객이 아니에요. 누가 손대기 전에 그게 뭔지부터 알려 주세요.
  - en: Logins and checkouts are both timing out. Customers say the app just thinks forever.
    ko: 로그인도 체크아웃도 다 타임아웃 나요. 고객들 말로는 앱이 계속 로딩만 한대요.
  - en: There's a workload in edge-canary that nobody deployed through the pipeline. I've put a Security hold on it. Nobody deletes anything until I've looked.
    ko: edge-canary에 파이프라인을 안 거치고 올라온 워크로드가 있어요. 보안 보류 걸어 뒀어요. 제가 보기 전까지 아무것도 지우지 마세요.
  - en: Checking its signature against every key we've issued. Seventy-five seconds.
    ko: 우리가 발급한 키 전부랑 서명 대조해 볼게요. 75초요.
  - en: Signature matches nothing we've ever issued. Not revoked, not expired, never ours. Owner field is blank. Fence it if you need to, but it stays intact. It's evidence now.
    ko: 서명이 우리가 발급한 어떤 키와도 안 맞아요. 폐기도 만료도 아니고, 애초에 우리 게 아니에요. 소유자 필드는 비어 있고요. 필요하면 펜스를 쳐도 되지만 그대로 보존하세요. 이제 증거예요.
  - en: It just got worse. A third of logins are failing.
    ko: 더 나빠졌어요. 로그인 셋 중 하나가 실패해요.
  - en: Synthetic traffic just passed nine thousand a second. Whatever this is, it isn't slowing down on its own.
    ko: 합성 트래픽이 방금 초당 9천을 넘었어요. 이게 뭐든 저절로 잦아들 기미가 없어요.
  - en: More than half of everything is failing now. The status page is the only thing still loading.
    ko: 이제 전체의 절반 넘게 실패해요. 아직 뜨는 건 상태 페이지뿐이에요.
  - en: The cap can't tell a bot from a buyer. One in six real checkouts is getting "too many requests".
    ko: 제한이 봇이랑 구매자를 구분 못 해요. 실제 체크아웃 6건 중 1건이 "too many requests"를 받고 있어요.
  - en: The cap expired and the workload never backed off. It queued everything we refused and sent it all at once.
    ko: 제한이 풀렸는데 워크로드는 전혀 물러서지 않았어요. 우리가 거부한 걸 전부 쌓아 뒀다가 한꺼번에 보냈어요.
  - en: It grew the moment we did. Synthetic rate doubled within a minute of the new nodes coming up. We're paying for its capacity.
    ko: 우리가 늘리자마자 저쪽도 커졌어요. 새 노드 뜨고 1분 만에 합성 트래픽이 두 배가 됐어요. 저쪽이 쓸 용량에 우리가 돈 내는 꼴이에요.
  - en: "delete deployment/observer-7f4c: denied. Policy SEC-HOLD: workload under Security investigation."
    ko: "delete deployment/observer-7f4c: 거부됨. 정책 SEC-HOLD: 보안 조사 중인 워크로드."
  - en: Who just tried to delete the observer? It's under my hold. We don't destroy the only evidence we have because it's inconvenient. Isolate it if you have to.
    ko: 방금 누가 observer 삭제하려고 했어요? 제가 보류 걸어 둔 거예요. 불편하다고 하나뿐인 증거를 없애진 않아요. 꼭 필요하면 분리하세요.
  - en: Good. It's fenced into q-0 and it's still there. I can work with that.
    ko: 좋아요. q-0 펜스 안에 그대로 남아 있어요. 이거면 작업할 수 있어요.
  - en: "Status posted: an unregistered workload is flooding the request gateway. Customers may see timeouts. We are moving it off customer capacity."
    ko: "상황 공유: 미등록 워크로드가 요청 게이트웨이에 트래픽 폭주 유발. 고객 타임아웃 발생 가능. 고객 용량에서 분리 작업 중."
  - en: No owner, no signature, and a comment addressed to whoever opened it. I'm logging the whole manifest. Nobody edit it.
    ko: 소유자도 서명도 없고, 연 사람 앞으로 남긴 주석이 하나 있어요. 매니페스트 통째로 기록해 둘게요. 아무도 수정하지 마세요.
