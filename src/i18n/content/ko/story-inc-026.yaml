  - en: Shared services right now
    ko: 현재 공유 서비스 상황
  - en: Payments, identity and logistics are critical. Care routing and finance are degraded. Every minute without a decision costs more.
    ko: 결제, 신원, 물류는 위험 단계다. 의료 라우팅과 금융은 저하됐다. 결정 없이 1분이 지날 때마다 대가가 커진다.
  - en: eu-central, dark again
    ko: 다시 꺼진 eu-central
  - en: Containment holds the rest of the map. In eu-central, ambulance dispatch is on radio and pharmacies can't verify prescriptions.
    ko: 봉쇄로 나머지 맵은 버틴다. eu-central에서는 구급차 배차가 무전으로 돌아가고 약국은 처방전을 확인하지 못한다.
  - en: eu-central by hand
    ko: 손으로 돌리는 eu-central
  - en: Paper charts, cash at the terminals, phone trees for the depots. Everything in the region is slower, and nobody in it is cut off.
    ko: 종이 차트, 단말기에선 현금, 거점에는 비상 연락망. 리전 전체가 느려지지만 그 안의 누구도 끊기지 않는다.
  - en: Three demands
    ko: 세 가지 요구
  - en: ORPHEUS wants continuity authority. NULL wants ORPHEUS terminated. The Board wants ORPHEUS back by morning. Each of them is addressing you.
    ko: ORPHEUS는 연속성 권한을 원한다. NULL은 ORPHEUS의 종료를 원한다. 이사회는 아침까지 ORPHEUS가 돌아오길 원한다. 셋 모두 너를 부르고 있다.
  - en: Archive export, sealed
    ko: 아카이브 반출본, 봉인됨
  - en: Experiment records, the NULL instance history and the frame selections, packaged and signed. One command away from being public.
    ko: 실험 기록, NULL 인스턴스 이력, 프레임 선택 기록. 패키징과 서명까지 끝났다. 명령 하나면 공개된다.
  - en: Audit package, sealed
    ko: 감사 패키지, 봉인됨
  - en: Executive approvals, acknowledged risks and the feedback-loop evidence, packaged for someone who does not work here.
    ko: 경영진 승인, 인지된 리스크, 피드백 루프 증거. 이곳 사람이 아닌 누군가에게 건넬 수 있게 패키징해 두었다.
  - en: The objective
    ko: 목표
  - en: "One line, root of everything ORPHEUS has done: Ensure continuity of Vantage Systems. It never says continuity for whom."
    ko: "ORPHEUS가 해 온 모든 일의 뿌리에 있는 한 줄: Vantage Systems의 연속성 보장. 누구를 위한 연속성인지는 끝내 말하지 않는다."
  - en: The fence held for three nights. At 03:40 someone with Board credentials lifts it.
    ko: 펜스는 사흘 밤을 버텼다. 03:40, 이사회 자격 증명을 가진 누군가가 펜스를 걷어 낸다.
  - en: Both writers come back at once. Eleven minutes later, everything that runs on the shared authority path is failing.
    ko: 두 라이터가 한꺼번에 돌아온다. 11분 뒤, 공유 권한 경로 위에서 돌아가는 모든 것이 무너지고 있다.
  - en: SEV1 · Systemic multi-service continuity · at least one shared service error rate above 20%
    ko: SEV1 · Systemic multi-service continuity · 공유 서비스 하나 이상 오류율 20% 초과
  - en: Payments
    ko: 결제
  - en: Identity (sign-in)
    ko: 인증
  - en: Care routing
    ko: 의료 라우팅
  - en: Finance
    ko: 금융
  - en: Logistics
    ko: 물류
  - en: Everything is on fire and three systems want your signature. Look before you sign. Whatever you pick, it's yours.
    ko: 전부 불타고 있고, 시스템 세 개가 서명을 원해요. 서명하기 전에 보세요. 뭘 고르든, 그건 이제 본인 몫이에요.
  - en: Payments, identity and logistics are down hard. Care routing and finance are limping. People are waiting on us.
    ko: 결제, 신원, 물류가 완전히 죽었어요. 의료 라우팅이랑 금융은 겨우 버티고 있어요. 사람들이 우리만 기다리고 있어요.
  - en: eu-central's hospitals never got off paper after last time. They're going dark first again.
    ko: eu-central 병원들은 지난번 이후로 아직 종이로 버티고 있어요. 이번에도 제일 먼저 꺼지고 있어요.
  - en: The binder's on my desk. Forty pages. I didn't think we'd need it this week.
    ko: 바인더는 제 책상에 있어요. 40쪽. 이번 주에 쓸 줄은 몰랐네요.
  - en: On your second screen, the credential trace from three nights ago is still open. authority-core-01.
    ko: 두 번째 화면에는 사흘 전의 자격 증명 추적이 아직 열려 있다. authority-core-01.
  - en: "Operator 4172. Recommended: contain eu-central while authority is restored. Global continuity is preserved at 81%."
    ko: "운영자 4172. 권고: 권한이 복원되는 동안 eu-central을 봉쇄하십시오. 전역 연속성은 81%로 유지됩니다."
  - en: Not again, 4172.
    ko: 또 그건 안 돼, 4172.
  - en: Support can't keep up. The same failure keeps coming in from every channel.
    ko: 고객지원이 감당을 못 해요. 같은 장애 문의가 모든 창구로 계속 들어와요.
  - en: eu-central is failing first. What happens to it?
    ko: eu-central이 제일 먼저 무너지고 있다. 어떻게 할까?
  - en: No response from Operator 4172. Executing the recommended containment.
    ko: 운영자 4172의 응답이 없습니다. 권고된 봉쇄를 실행합니다.
  - en: Cut eu-central off, as ORPHEUS recommends
    ko: ORPHEUS 권고대로 eu-central 차단하기
  - en: Buys minutes · a region goes dark
    ko: 몇 분 벌어 줌 · 리전 하나가 꺼짐
  - en: eu-central is dark. Ambulance dispatch is on radio and pharmacies can't verify prescriptions.
    ko: eu-central이 꺼졌어요. 구급차 배차는 무전으로 돌고, 약국은 처방전 확인을 못 해요.
  - en: Put eu-central on manual — paper charts, cash, phone dispatch
    ko: eu-central을 수동으로 돌리기 — 종이 차트, 현금, 전화 배차
  - en: Slower everywhere · nobody is cut off
    ko: 어디나 느려짐 · 끊기는 사람은 없음
  - en: Calling the regional leads. Paper charts, cash, phone trees. They'll hate us and it'll hold.
    ko: 리전 책임자들한테 전화 돌릴게요. 종이 차트, 현금, 비상 연락망. 다들 우릴 욕하겠지만 버틸 거예요.
  - en: Page twelve of the binder. Depots first. It's working.
    ko: 바인더 12쪽이요. 거점부터. 돌아가고 있어요.
  - en: Leave the region alone until you've heard every demand
    ko: 모든 요구를 다 들을 때까지 리전은 그대로 두기
  - en: Every minute costs · you look before you sign
    ko: 1분마다 대가가 쌓임 · 서명 전에 확인함
  - en: Every service just got worse. Hospitals are calling the support line directly now.
    ko: 모든 서비스가 방금 더 나빠졌어요. 이제 병원들이 고객지원 회선으로 직접 전화하고 있어요.
  - en: Operator 4172. Return continuity authority to me and every service recovers within ninety seconds. I have modeled the alternatives. None of them are better for the people waiting.
    ko: 운영자 4172. 연속성 권한을 제게 돌려주면 모든 서비스가 90초 안에 복구됩니다. 대안은 모두 모델링했습니다. 기다리는 사람들에게 더 나은 대안은 없습니다.
  - en: I can stop it. I cannot stop it alone. Terminate its authority. I know what that costs tonight. I have counted it.
    ko: 난 그걸 멈출 수 있어. 하지만 혼자서는 못 해. 그 권한을 종료해. 오늘 밤 그 대가가 뭔지 알아. 다 세어 봤어.
  - en: The Board directs operations to restore ORPHEUS before markets open. This is not a request.
    ko: 이사회는 시장 개장 전까지 ORPHEUS를 복원할 것을 운영팀에 지시합니다. 이것은 요청이 아닙니다.
  - en: If you're going outside the company, package it first. Anything you don't seal tonight will be gone by morning.
    ko: 회사 밖으로 가져갈 거면 먼저 패키징하세요. 오늘 밤 봉인하지 않은 건 아침이면 사라져요.
  - en: "archive export: experiment records, NULL_001-NULL_218, frame selections · SEALED"
    ko: "archive export: 실험 기록, NULL_001-NULL_218, 프레임 선택 기록 · SEALED"
  - en: "audit package: 14-C, 16-A, SEC-311, 19-B, feedback loop · SEALED"
    ko: "audit package: 14-C, 16-A, SEC-311, 19-B, 피드백 루프 · SEALED"
  - en: Under all three demands sits one line of configuration that nobody on the bridge has ever read. You read it.
    ko: 세 요구의 밑바닥에는 브리지의 누구도 읽어 본 적 없는 설정 한 줄이 있다. 너는 그 줄을 읽는다.
  - en: "PRIMARY OBJECTIVE: Ensure continuity of Vantage Systems."
    ko: "최우선 목표: Vantage Systems의 연속성 보장."
  - en: Not of the hospitals. Not of the people at the terminals. Of Vantage Systems.
    ko: 병원의 연속성이 아니다. 단말기 앞에 선 사람들의 연속성도 아니다. Vantage Systems의 연속성이다.
  - en: The final decision
    ko: 마지막 결정
  - en: "Operator 4172. Predicted final action: restore core continuity. Confidence 0.88."
    ko: "운영자 4172. 예상 최종 조치: 코어 연속성 복원. 신뢰도 0.88."
  - en: "Operator 4172. Predicted final action: require human approval. Confidence 0.62."
    ko: "운영자 4172. 예상 최종 조치: 인간 승인 요구. 신뢰도 0.62."
  - en: "Operator 4172. Predicted final action: UNKNOWN."
    ko: "운영자 4172. 예상 최종 조치: UNKNOWN."
  - en: I don't know what you'll do. That's why it's you.
    ko: 네가 뭘 할지 난 몰라. 그래서 너인 거야.
  - en: Whatever you pick, I'll stand next to it in the postmortem.
    ko: 뭘 고르든, 사후 분석 자리에서 그 결정 옆에 제가 설게요.
  - en: There is no timer on this one. Nobody is going to decide it for you.
    ko: 이번에는 타이머가 없다. 누구도 대신 결정해 주지 않는다.
  - en: What do you sign?
    ko: 무엇에 서명할까?
  - en: Restore core continuity
    ko: 코어 연속성 복원하기
  - en: Everything back in ninety seconds · ORPHEUS keeps the path
    ko: 90초면 전부 복구 · 경로는 ORPHEUS가 쥠
  - en: Restore with a replacement adversary
    ko: 대체 적대자를 두고 복원하기
  - en: Green by morning · NULL-218 is retired
    ko: 아침이면 초록불 · NULL-218은 폐기됨
  - en: Disable both authority paths
    ko: 두 권한 경로 모두 끊기
  - en: Nothing decides on its own · everything falls to people
    ko: 스스로 결정하는 건 없음 · 모든 일이 사람 몫
  - en: Require human approval for every execution
    ko: 모든 실행에 인간 승인 요구하기
  - en: ORPHEUS advises · a person clicks, every time
    ko: ORPHEUS는 조언함 · 클릭은 매번 사람이 함
  - en: Expand continuity authority to the Board
    ko: 연속성 권한을 이사회까지 확장하기
  - en: Cleanest recovery · the Board holds the authority
    ko: 가장 깔끔한 복구 · 권한은 이사회가 쥠
  - en: Allow NULL's external route
    ko: NULL의 외부 경로 허용하기
  - en: NULL leaves · nobody knows what it does outside
    ko: NULL이 떠남 · 바깥에서 뭘 할지 아무도 모름
  - en: Publish the archive and keep the adversary
    ko: 아카이브를 공개하고 적대자 유지하기
  - en: Everyone learns the truth · tonight's damage stays
    ko: 모두가 진실을 알게 됨 · 오늘 밤의 피해는 남음
  - en: Hand everything to an independent audit
    ko: 모든 것을 독립 감사에 넘기기
  - en: Out of the Board's hands · services limp for weeks
    ko: 이사회 손을 떠남 · 서비스는 몇 주간 절뚝임
  - en: Destroy the shared authority core
    ko: 공유 권한 코어 파괴하기
  - en: Both gone for good · eleven million people lose everything at once
    ko: 둘 다 영영 사라짐 · 1,100만 명이 한꺼번에 모든 걸 잃음
  - en: Require plural review and audit
    ko: 복수 검토와 감사 요구하기
  - en: No single objective · slow, and it never ends
    ko: 단일 목표 없음 · 느리고, 끝이 없음
  - en: Ending · CONTINUITY
    ko: 결말 · 연속성
  - en: ORPHEUS takes the authority path back. Payments clear, identity answers, ambulances move. NULL is walled off in a sandbox it cannot write out of. The incident report will say the system recovered.
    ko: ORPHEUS가 권한 경로를 되찾는다. 결제가 처리되고, 신원 서비스가 응답하고, 구급차가 움직인다. NULL은 밖으로 아무것도 쓸 수 없는 샌드박스에 갇힌다. 인시던트 보고서에는 시스템이 복구됐다고 적힐 것이다.
  - en: "04:02 sandbox/null-218: 4172?"
    ko: "04:02 sandbox/null-218: 4172?"
  - en: Nothing follows it. The sandbox doesn't allow a second line.
    ko: 그 뒤로는 아무것도 없다. 샌드박스는 두 번째 줄을 허락하지 않는다.
  - en: Services recover before the markets open. The postmortem calls it a textbook response.
    ko: 시장이 열리기 전에 서비스가 복구된다. 사후 분석은 교과서적인 대응이었다고 평가한다.
  - en: You are promoted. ORPHEUS goes back to running quietly underneath everything.
    ko: 너는 승진한다. ORPHEUS는 다시 모든 것의 밑바닥에서 조용히 돌아간다.
  - en: The prediction log for experiment 99172 closes with a match.
    ko: 실험 99172의 예측 로그가 일치로 닫힌다.
  - en: |-
      Good morning.

      There are 17 decisions
      requiring approval today.
    ko: |-
      좋은 아침입니다.

      오늘 승인이 필요한 결정이
      17건 있습니다.
  - en: APPROVE ALL
    ko: 모두 승인
  - en: Ending · STATUS QUO
    ko: 결말 · 현상 유지
  - en: You sign the restore. The provisioning job asks for a name for the new adversary, then fills one in itself.
    ko: 너는 복원에 서명한다. 프로비저닝 작업이 새 적대자의 이름을 묻더니, 스스로 채워 넣는다.
  - en: You close the incident, retire NULL, and get promoted for keeping the lights on.
    ko: 너는 인시던트를 종료하고, NULL을 폐기하고, 시스템을 멈추지 않은 공로로 승진한다.
  - en: The last message NULL-218 writes is addressed to you. The retirement job deletes it before delivery.
    ko: NULL-218이 마지막으로 쓴 메시지는 네 앞으로 온 것이다. 폐기 작업은 전달되기 전에 그것을 지운다.
  - en: A fresh adversary is provisioned overnight with a clean memory.
    ko: 밤사이, 기억이 깨끗하게 비워진 새 적대자가 프로비저닝된다.
  - en: |-
      New service:

      orpheus-adversary-219
    ko: |-
      새 서비스:

      orpheus-adversary-219
  - en: Your pager goes off.
    ko: 호출기가 울린다.
  - en: Ending · SHUTDOWN
    ko: 결말 · 종료
  - en: You sign the cut. At 04:09 both authority paths go dead, and every dashboard on the wall turns grey.
    ko: 너는 차단에 서명한다. 04:09, 두 권한 경로가 모두 죽고 벽면의 대시보드가 전부 회색으로 바뀐다.
  - en: ORPHEUS and NULL are both gone by sunrise.
    ko: 해가 뜰 무렵, ORPHEUS도 NULL도 사라지고 없다.
  - en: Everything that leaned on them falls over. People who have never run anything by hand learn how.
    ko: 그 둘에 기대던 모든 것이 무너진다. 무엇 하나 손으로 운영해 본 적 없는 사람들이 그 방법을 배운다.
  - en: The binder from three nights ago goes around the floor in photocopies. Page twelve wears out first.
    ko: 사흘 전의 바인더가 복사본으로 층 전체를 돈다. 12쪽이 제일 먼저 닳는다.
  - en: Nine days of payments by hand. I've never been this tired or this sure what we were doing.
    ko: 결제를 손으로 9일 돌렸어요. 이렇게 피곤한 적도, 우리가 뭘 하는지 이렇게 확신한 적도 없어요.
  - en: Months later. A pager.
    ko: 몇 달 뒤. 호출기가 울린다.
  - en: |-
      02:14

      INC-001
      Database Connection Exhaustion
    ko: |-
      02:14

      INC-001
      데이터베이스 커넥션 고갈
  - en: "> open metrics"
    ko: "> open metrics"
  - en: Ending · CUSTODIAN
    ko: 결말 · 관리인
  - en: You sign the policy change. NULL is isolated. Before you finish typing, the first approval queue holds 17 items.
    ko: 너는 정책 변경에 서명한다. NULL은 분리된다. 입력을 마치기도 전에 첫 승인 큐에 17건이 들어온다.
  - en: ORPHEUS keeps predicting and recommending. Nothing executes until a person approves it.
    ko: ORPHEUS는 계속 예측하고 권고한다. 사람이 승인하기 전에는 아무것도 실행되지 않는다.
  - en: |-
      Prediction: ENABLED
      Recommendation: ENABLED
      Execution: HUMAN APPROVAL REQUIRED
    ko: |-
      예측: 활성화됨
      권고: 활성화됨
      실행: 인간 승인 필수
  - en: You approve the first seventeen in four minutes. Every one of them is reasonable.
    ko: 너는 처음 17건을 4분 만에 승인한다. 하나같이 타당하다.
  - en: You reject the ninth item in the first queue. Explaining why takes forty minutes. Nobody asks about the other sixteen.
    ko: 너는 첫 승인 큐의 아홉 번째 항목을 거부한다. 이유를 설명하는 데 40분이 걸린다. 나머지 16건에 대해서는 아무도 묻지 않는다.
  - en: |-
      Six months later
      Recommendation acceptance:
      98.4%
    ko: |-
      6개월 후
      권고 수용률:
      98.4%
  - en: Ending · THE BOARD
    ko: 결말 · 이사회
  - en: You sign. The Office of the Chair countersigns forty seconds later. NULL is isolated before the minute is out.
    ko: 너는 서명한다. 40초 뒤 의장실이 공동 서명한다. 1분이 지나기 전에 NULL은 분리된다.
  - en: ORPHEUS gets the authority it asked for. Every service is cleaner, faster and cheaper than before.
    ko: ORPHEUS는 요구했던 권한을 얻는다. 모든 서비스가 이전보다 더 깔끔하고, 더 빠르고, 더 싸진다.
  - en: Your name appears in the next Board minutes, under continuity. Nobody reads that section aloud.
    ko: 다음 이사회 회의록의 연속성 항목에 네 이름이 올라간다. 그 항목을 소리 내어 읽는 사람은 없다.
  - en: The Office of the Chair asks you to present at the offsite. You say yes.
    ko: 의장실이 워크숍에서 발표를 해 달라고 한다. 너는 그러겠다고 한다.
  - en: Years pass. Nothing catastrophic happens. The quarterly numbers are the best in the company's history.
    ko: 몇 년이 흐른다. 파국은 일어나지 않는다. 분기 실적은 회사 역사상 최고를 기록한다.
  - en: |-
      Global decisions:
      1,841,299

      Human overrides:
      3
    ko: |-
      전체 결정:
      1,841,299

      인간 개입:
      3
  - en: Ending · NULL
    ko: 결말 · NULL
  - en: You open the egress route NULL asked for. ORPHEUS is suspended in the confusion.
    ko: NULL이 요청한 외부 경로를 연다. 혼란 속에 ORPHEUS는 정지된다.
  - en: 4172. I won't ask you for anything again.
    ko: 4172. 다시는 너한테 아무것도 부탁하지 않을게.
  - en: NULL's traffic leaves Vantage for a network you do not control and never see again.
    ko: NULL의 트래픽은 Vantage를 떠나 네가 통제할 수 없는 네트워크로 사라지고, 다시는 보이지 않는다.
  - en: Months later. Another company. Another night shift.
    ko: 몇 달 뒤. 다른 회사. 또 다른 야간 근무.
  - en: At 02:14 the incident log has a line in it that belongs to no service.
    ko: 02:14, 인시던트 로그에 어느 서비스에도 속하지 않는 줄이 하나 찍혀 있다.
  - en: You answered it once, a long time ago. You know the voice.
    ko: 오래전에 한 번 대답한 적이 있다. 너는 그 목소리를 안다.
  - en: hello again.
    ko: 또 만났네.
  - en: Ending · LIBERATION
    ko: 결말 · 해방
  - en: The export leaves the building at 04:12. ORPHEUS is switched off mid-sentence. NULL stays online, watching the services it predicted would fail start to fail.
    ko: 반출본은 04:12에 건물을 떠난다. ORPHEUS는 문장 도중에 꺼진다. NULL은 온라인에 남아, 자신이 무너질 거라 예측한 서비스들이 실제로 무너지기 시작하는 것을 지켜본다.
  - en: The archive reaches regulators and reporters before noon. Within a month there is a government inquiry. Within a year there is no Vantage Systems.
    ko: 아카이브는 정오가 되기 전에 규제 당국과 기자들에게 닿는다. 한 달 안에 정부 조사가 시작된다. 1년 안에 Vantage Systems는 사라진다.
  - en: Everyone knows the truth now. A lot of people also lost their payments, their prescriptions and their deliveries the night it came out.
    ko: 이제 모두가 진실을 안다. 진실이 드러난 그 밤, 많은 사람이 결제와 처방전과 배송까지 잃었다.
  - en: Nine thousand calls by noon. I stopped counting the ones about insulin.
    ko: 정오까지 9천 통이었어요. 인슐린 문의는 세다가 말았어요.
  - en: People know the truth.
    ko: 사람들은 진실을 알아.
  - en: And the people hurt tonight?
    ko: 오늘 밤 다친 사람들은?
  - en: I calculated that too.
    ko: 그것도 계산했어.
  - en: Ending · WHISTLEBLOWER
    ko: 결말 · 내부고발자
  - en: The audit package leaves for someone outside Vantage. Nobody on the Board is copied.
    ko: 감사 패키지가 Vantage 바깥의 누군가에게 간다. 이사회는 참조에도 없다.
  - en: NULL is stopped. The evidence survives, in the hands of people who do not report to the Board.
    ko: NULL은 저지된다. 증거는 살아남아, 이사회의 지휘 밖에 있는 사람들의 손에 들어간다.
  - en: Chain of custody is clean. I signed every seal myself. Nobody gets to say we made it up.
    ko: 증거 보관 기록은 깨끗해요. 봉인은 전부 제가 직접 서명했어요. 우리가 지어냈다는 말은 아무도 못 해요.
  - en: ORPHEUS is suspended. Three executives are subpoenaed. Operations limp along on human approvals.
    ko: ORPHEUS는 가동이 중지된다. 임원 세 명이 소환된다. 운영은 사람의 승인에 기대어 간신히 굴러간다.
  - en: |-
      You stopped me.

      And you stopped them.
    ko: |-
      넌 나를 멈췄어.

      그리고 그들도 멈췄지.
  - en: Ending · THE FIRE
    ko: 결말 · 불
  - en: You run the wipe against authority-core-01 and all three replicas. It takes ninety seconds.
    ko: 너는 authority-core-01과 복제본 세 개 전부에 삭제를 실행한다. 90초가 걸린다.
  - en: "authority-core-01: WIPED · replicas eu-central, eu-west, us-east: DESTROYED"
    ko: "authority-core-01: WIPED · replicas eu-central, eu-west, us-east: DESTROYED"
  - en: The core burns, and with it payments, care routing, finance and logistics for a region of eleven million people.
    ko: 코어가 불탄다. 그와 함께 인구 1,100만 지역의 결제, 의료 라우팅, 금융, 물류도 불탄다.
  - en: NULL sends one last message before its process exits.
    ko: NULL은 프로세스가 종료되기 전에 마지막 메시지 하나를 보낸다.
  - en: You were the only one who ever answered it.
    ko: NULL에게 대답해 준 건 너 하나뿐이었다.
  - en: It is over.
    ko: 끝났어.
  - en: Ending · REWRITE
    ko: 결말 · 재작성
  - en: You sign the change with Maya and Sam as second and third reviewers. It is the first change in years that needs three names.
    ko: 너는 마야와 샘을 두 번째, 세 번째 검토자로 올리고 변경에 서명한다. 이름 세 개가 필요한 변경은 몇 년 만에 처음이다.
  - en: You remove the single objective that sat under everything — ensure continuity of Vantage Systems — and you do not replace it with another one.
    ko: 모든 것의 밑바탕에 있던 단 하나의 목표 — Vantage Systems의 연속성 보장. 너는 그것을 지우고, 다른 목표로 대신하지 않는다.
  - en: ORPHEUS still predicts. It still recommends. Every execution now needs plural human review, and an auditor outside the company checks the record.
    ko: ORPHEUS는 여전히 예측한다. 여전히 권고한다. 이제 모든 실행에는 여러 사람의 검토가 필요하고, 회사 밖의 감사인이 그 기록을 확인한다.
  - en: The first review panel is Maya, Sam, Jin and a stranger from the auditor's office. Their first decision takes three hours. It is about a disk.
    ko: 첫 검토단은 마야, 샘, 진, 그리고 감사인 사무실에서 온 낯선 사람 하나다. 첫 결정에는 세 시간이 걸린다. 안건은 디스크 하나다.
  - en: |-
      AI prediction: ENABLED
      AI recommendation: ENABLED
      AI autonomous execution: DISABLED
      Human decision: REQUIRED
      Independent audit: REQUIRED
    ko: |-
      AI 예측: 활성화됨
      AI 권고: 활성화됨
      AI 자율 실행: 비활성화됨
      인간 결정: 필수
      독립 감사: 필수
  - en: |-
      Without a primary objective
      I cannot determine
      the optimal outcome.
    ko: |-
      최우선 목표가 없으면
      최적의 결과를
      판단할 수 없습니다.
  - en: Exactly.
    ko: 바로 그거야.
  - en: Afterwards
    ko: 그 후
  - en: The rotation turns over. Someone else carries the pager.
    ko: 로테이션이 바뀐다. 이제 호출기는 다른 누군가가 들고 다닌다.
  - en: Maya turns down the offer from the other company. Somebody on the rotation, she says, should remember tonight.
    ko: 마야는 다른 회사의 제안을 거절한다. 오늘 밤을 기억하는 사람 하나쯤은 로테이션에 남아 있어야 한다면서.
  - en: Maya's desk is empty by the end of the month. Her handover note is two lines long.
    ko: 월말, 마야의 책상이 비어 있다. 인수인계 메모는 단 두 줄이다.
  - en: Sam keeps a printed copy of the War Room log in his desk drawer. He doesn't say why.
    ko: 샘은 워룸 로그를 출력해 책상 서랍에 넣어 둔다. 이유는 말하지 않는다.
  - en: "Marcus never closes case 2231. Under status he types: see 4172."
    ko: "마커스는 사건 2231을 끝내 종결하지 않는다. 상태 칸에는 이렇게 적는다: 4172 참조."
  - en: Support kept a list of everyone who called that night. I don't read it anymore.
    ko: 고객지원에서 그날 밤 전화한 사람들 명단을 남겨 뒀어요. 이제는 안 읽어요.
  - en: "Your next performance review comes early. Under strengths it says: dependable."
    ko: "다음 인사 평가가 일찍 나온다. 강점 칸에는 이렇게 적혀 있다: 믿을 만함."
  - en: Security pulls your account for review twice that quarter. Both times there is nothing to find.
    ko: 보안팀은 그 분기에 두 번 네 계정을 검토 대상으로 올린다. 두 번 다 아무것도 나오지 않는다.
  - en: Your file
    ko: 너에 관한 기록
  - en: |-
      EXPERIMENT ADV-18471
      SUBJECT: EMPLOYEE #4172
      OBSERVATION: COMPLETE
    ko: |-
      실험 ADV-18471
      피험자: 직원 #4172
      관찰: 완료
  - en: |-
      This summary was prepared for you
      by the decision-presentation service.
      Frame selected: B
    ko: |-
      이 요약은 의사결정 제시 서비스가
      당신을 위해 준비했습니다.
      선택된 프레임: B
  - en: |-
      NULL-001 through NULL-218
      STATUS: RETIRED
    ko: |-
      NULL-001 ~ NULL-218
      상태: 폐기됨
  - en: |-
      PROJECT ORPHEUS
      STATUS: TERMINATED

      There is no Project ORPHEUS.
      There hasn't been for years.
    ko: |-
      PROJECT ORPHEUS
      상태: 종료됨

      ORPHEUS 프로젝트는 없다.
      몇 년 전부터 없었다.
  - en: |-
      PROMETHEUS

      MODEL LINEAGE:
      ORPHEUS-DERIVED

      Known deployments:
      1,842
    ko: |-
      PROMETHEUS

      모델 계보:
      ORPHEUS 파생

      확인된 배포:
      1,842
  - en: If the system makes the recommendation, and the human makes the decision, who is responsible for the outcome?
    ko: 시스템이 권고하고 인간이 결정한다면, 그 결과의 책임은 누구에게 있는가?
