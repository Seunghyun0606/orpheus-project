  - en: Sign-in failure rate > 20%
    ko: 로그인 실패율 > 20%
  - en: Sign-ins time out after 8 s while 970 sessions sit open. Most of the open sessions renew on the dot every 30 seconds from one internal subnet, 10.40.2.0/24.
    ko: 열린 세션 970개가 쌓인 채 로그인이 8 s 만에 타임아웃됨. 열린 세션 대부분은 내부 서브넷 하나(10.40.2.0/24)에서 정확히 30초마다 갱신됨.
  - en: synthetic / tag repeat-214 / 781 of 970 open sessions / median idle time 0 s
    ko: 합성 / 태그 repeat-214 / 열린 세션 970개 중 781개 / 유휴 시간 중앙값 0 s
  - en: Tagged sessions carry no session-class header, so they fall through to the customer default rule. No quota, normal priority, 4-hour idle timeout.
    ko: 태그된 세션에는 session-class 헤더가 없어 고객 기본 규칙으로 떨어짐. 할당량 없음, 일반 우선순위, 유휴 타임아웃 4시간.
  - en: Tagged sessions open in batches of exactly 214, one batch every 214 seconds. The creator field reads "repeat". Too regular for a load test, too loud for an intruder.
    ko: 태그된 세션이 정확히 214개씩, 214초마다 한 배치로 열림. 생성자 필드 값은 "repeat". 부하 테스트라기엔 너무 규칙적이고, 침입자라기엔 너무 요란함.
  - en: Session database connection pool at 90 %. Every held connection belongs to a session that has not closed in hours. Alex wants to recycle the pool and raise the cap.
    ko: 세션 DB 커넥션 풀 90 %. 점유된 커넥션은 전부 몇 시간째 닫히지 않은 세션 소유. 알렉스는 풀을 재생성하고 상한을 올리길 원함.
  - en: An untagged synthetic workload opens sessions in fixed batches
    ko: 태그 미지정 합성 워크로드가 고정 배치 단위로 세션을 연다
  - en: Sessions without a class header inherit the customer admission rule
    ko: class 헤더가 없는 세션은 고객 입장 규칙을 물려받는다
  - en: Never-idle synthetic sessions hold the shared pool and its database connections
    ko: 유휴 상태가 되지 않는 합성 세션이 공유 풀과 DB 커넥션을 붙잡는다
  - en: Customer sign-ins time out waiting for a session seat
    ko: 고객 로그인이 세션 자리를 기다리다 타임아웃된다
  - en: The mobile app retries sign-in in a tight loop
    ko: 모바일 앱이 촘촘한 루프로 로그인을 재시도한다
  - en: Read the Session API log
    ko: 세션 API 로그 읽기
  - en: Check session pool and database load
    ko: 세션 풀과 데이터베이스 부하 확인
  - en: List who is holding the open sessions
    ko: 열린 세션을 누가 붙잡고 있는지 조회하기
  - en: Trace which admission rule lets tagged sessions in
    ko: 태그된 세션을 통과시키는 입장 규칙 추적하기
  - en: Count how often repeat-214 sessions are created
    ko: repeat-214 세션 생성 빈도 세기
  - en: Add an overflow session pool
    ko: 오버플로 세션 풀 추가하기
  - en: Evict idle sessions to free seats
    ko: 유휴 세션을 퇴출해 자리 비우기
  - en: Recycle the session database connection pool
    ko: 세션 DB 커넥션 풀 재생성하기
  - en: Give repeat-214 its own admission quota
    ko: repeat-214에 전용 입장 할당량 주기
  - en: repeat-214 capped at 20 sessions, low priority, 2-minute idle timeout. Customer rule unchanged.
    ko: repeat-214 세션 20개로 제한, 낮은 우선순위, 유휴 타임아웃 2분. 고객 규칙은 그대로.
  - en: Post a status update to the War Room
    ko: 워룸에 상황 공유하기
  - en: Ask Alex to check the session database
    ko: 알렉스에게 세션 데이터베이스 점검 요청
  - en: 781 seats held by repeat-214
    ko: repeat-214가 점유한 자리 781개
  - en: Synthetic sessions tagged repeat-214 hold 781 of 970 seats in the shared pool and renew every 30 seconds. Not one of them has ever gone idle.
    ko: repeat-214 태그가 붙은 합성 세션이 공유 풀 970자리 중 781자리를 차지하고 30초마다 갱신한다. 그중 단 하나도 유휴 상태가 된 적이 없다.
  - en: Synthetic traffic on the customer rule
    ko: 고객 규칙을 타는 합성 트래픽
  - en: The synthetic admission rule exists but never matches. Tagged sessions carry no class header, so they inherit the customer rule. No quota, normal priority, 4-hour idle timeout.
    ko: 합성 입장 규칙은 존재하지만 한 번도 매칭되지 않는다. 태그된 세션에는 class 헤더가 없어 고객 규칙을 물려받는다. 할당량 없음, 일반 우선순위, 유휴 타임아웃 4시간.
  - en: Alex's database report
    ko: 알렉스의 데이터베이스 보고
  - en: The session database connection pool is at 90 %, pinned by sessions that never close. Alex blames the database and wants to recycle it.
    ko: 세션 DB 커넥션 풀이 90 %다. 닫히지 않는 세션들이 붙잡고 있다. 알렉스는 데이터베이스를 탓하며 풀을 재생성하려 한다.
  - en: Repeated session marker
    ko: 반복된 세션 표식
  - en: "UNKNOWN: follow the tag. I left it where you could see it."
    ko: "UNKNOWN: 태그를 따라가. 네 눈에 띄는 곳에 남겨 뒀어."
  - en: "Two hundred fourteen sessions, every two hundred fourteen seconds. In the creator field of the newest batch, past the word repeat, a line no load generator would ever write. UNKNOWN: follow the tag. I left it where you could see it."
    ko: "이백십사 개의 세션, 이백십사 초마다. 가장 최근 배치의 생성자 필드, repeat라는 단어 뒤에 어떤 부하 생성기도 쓰지 않을 한 줄이 있다. UNKNOWN: 태그를 따라가. 네 눈에 띄는 곳에 남겨 뒀어."
  - en: Maya / SRE Lead
    ko: 마야 / SRE 리드
  - en: Alex / DBA
    ko: 알렉스 / DBA
  - en: Sam / Platform
    ko: 샘 / 플랫폼
  - en: Jin / Support
    ko: 진 / 고객지원
  - en: Operator
    ko: 운영자
  - en: Sign-ins are timing out and the session pool says it is full, but CPU is bored. Something is holding seats and never giving them back. Find out what before the evening rush.
    ko: 로그인이 타임아웃되고 세션 풀은 꽉 찼다는데 CPU는 한가해요. 뭔가가 자리를 잡고 안 놓고 있어요. 저녁 피크 전에 뭔지 찾아 주세요.
  - en: Customers can't sign in. The ones who already are keep getting bounced back to an empty cart.
    ko: 고객들이 로그인을 못 해요. 이미 로그인한 사람들은 자꾸 빈 장바구니로 튕겨 나가고요.
  - en: Session database is running hot. I'd bet my lunch this is the connection pool again.
    ko: 세션 DB가 과열이에요. 점심 걸고 말하는데, 또 커넥션 풀이에요.
  - en: On it. It's going to be the database, you watch. Back in under two minutes.
    ko: 볼게요. 두고 봐요, 데이터베이스일 거예요. 2분 안에 돌아올게요.
  - en: Told you. Connection pool is at 90 %, and every connection is pinned by a session that hasn't closed in hours. Recycle the pool, raise my cap, and we're out of this.
    ko: 거봐요. 커넥션 풀 90 %고, 커넥션마다 몇 시간째 안 닫힌 세션이 붙잡고 있어요. 풀 재생성하고 상한만 올려 주면 끝나요.
  - en: Session pool just went past 1,100. A third of sign-ins are failing and the mobile app is retrying in a loop.
    ko: 세션 풀이 방금 1,100을 넘었어요. 로그인 3분의 1이 실패하고 모바일 앱은 루프 돌면서 재시도 중이에요.
  - en: We're basically closed to new logins. People are posting screenshots.
    ko: 신규 로그인은 사실상 막혔어요. 사람들이 스크린샷을 올리고 있어요.
  - en: Support has heard nothing from you in almost three minutes. I'm making up answers for customers.
    ko: 거의 3분째 고객지원 쪽에 아무 소식이 없어요. 고객한테 답을 지어내고 있다고요.
  - en: The overflow pool is already full. Nine in ten new sessions in it carry the same tag. Whatever this is, it grows into anything we give it.
    ko: 오버플로 풀도 벌써 꽉 찼어요. 거기 새 세션 열에 아홉이 같은 태그예요. 이게 뭐든, 주는 만큼 자라요.
  - en: Eviction went through, and so did 3,140 customer carts. Everyone we kicked was a person who stepped away to find a card. Not one tagged session was idle.
    ko: 퇴출은 됐어요. 고객 장바구니 3,140개도 같이 날아갔고요. 쫓겨난 건 전부 카드 찾으러 잠깐 자리 비운 사람들이에요. 태그된 세션은 하나도 유휴 상태가 아니었어요.
  - en: Pool is back over a thousand. The seats we freed went straight to repeat-214.
    ko: 풀이 다시 천 개를 넘었어요. 비운 자리는 곧장 repeat-214가 가져갔어요.
  - en: Pool recycled. Connections down to a third. See? Database.
    ko: 풀 재생성 끝. 커넥션이 3분의 1로 줄었어요. 거봐요, 데이터베이스라니까요.
  - en: Huh. They're back. Same sessions grabbed every connection again inside a minute. They reconnect faster than any customer could.
    ko: 어. 다시 찼어요. 같은 세션들이 1분도 안 돼서 커넥션을 전부 다시 잡았어요. 어떤 고객보다도 빠르게 재접속해요.
  - en: repeat-214 is capped at twenty seats. The pool is draining and real sign-ins are going through. Alex, your database just got its breath back.
    ko: repeat-214는 스무 자리로 묶었어요. 풀이 빠지고 진짜 로그인이 들어오고 있어요. 알렉스, 데이터베이스가 이제 숨 좀 쉬네요.
  - en: "Status posted: sign-in failures are caused by automated sessions holding the session pool. A scoped fix is in progress."
    ko: "상황 공유: 로그인 실패 원인은 세션 풀을 점유한 자동화 세션임. 범위를 좁힌 수정 조치 진행 중."
