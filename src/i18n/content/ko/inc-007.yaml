  - en: Sam can stand up an overflow pool in under a minute; it is expensive, and Sam has seen workloads that grow into whatever room they get. Evicting idle sessions frees seats now, but whoever is idle loses their cart. Alex swears by recycling the database pool.
    ko: 샘은 1분 안에 오버플로 풀을 띄울 수 있다. 비싸고, 샘은 주는 공간만큼 자라는 워크로드를 본 적이 있다. 유휴 세션을 퇴출하면 지금 당장 자리가 나지만, 자리를 비운 사람은 장바구니를 잃는다. 알렉스는 DB 풀 재생성을 철석같이 믿는다.
  - en: Scope the tag's admission
    ko: 태그 입장 범위 제한
  - en: Matching repeat-214 by tag puts it on its own quota of twenty seats at low priority with a two-minute idle timeout. Customers keep their rule. Eighty seconds to roll out, and the tagged sessions above the quota are shed as it lands.
    ko: repeat-214를 태그로 매칭하면 낮은 우선순위, 유휴 타임아웃 2분의 전용 할당량 스무 자리로 묶인다. 고객 규칙은 그대로다. 배포에 80초, 적용되는 순간 할당량을 넘는 태그 세션은 떨어져 나간다.
  - en: War Room
    ko: 워룸
