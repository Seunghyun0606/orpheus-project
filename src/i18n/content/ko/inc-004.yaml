entries:
  - en: Memory Leak
    ko: 메모리 누수
  - en: Checkout API
    ko: 체크아웃 API
  - en: Request Handler
    ko: 요청 핸들러
  - en: Cart Pricing
    ko: 장바구니 가격 계산
  - en: 6% of tonight's carts have more than 50 items, almost all wholesale reorders
    ko: 오늘 밤 장바구니의 6%가 50개 초과, 거의 전부 도매 재주문
  - en: Heap above 75% on 3 or more checkout instances
    ko: 체크아웃 인스턴스 3대 이상에서 힙 75% 초과
  - en: Every checkout logs "response sent" and then, minutes later, its request object is still being walked by the garbage collector. Nothing is being let go.
    ko: 체크아웃마다 "response sent"가 찍히는데, 몇 분 뒤에도 그 요청 객체를 가비지 컬렉터가 계속 훑고 있다. 놓아주는 게 하나도 없다.
  - en: checkout-handler / completionCallbacks / completed-request. 1.9 million completed requests, each still pinned by the callback that fired when it finished.
    ko: checkout-handler / completionCallbacks / completed-request. 완료된 요청 190만 건이 저마다 완료 시점에 실행된 콜백에 여전히 묶여 있다.
  - en: "One retained block is not ours: owner pid 3318, a process the scheduler deleted nine days ago. The block is still referenced from completionCallbacks."
    ko: 보유 블록 하나는 우리 것이 아니다. 소유자 pid 3318, 스케줄러가 9일 전에 삭제한 프로세스다. 이 블록은 아직도 completionCallbacks에서 참조된다.
  - en: "pid 3318: no deploy record, no owner, scheduler entry deleted nine days ago. One line survives in the cold log store, written after the process was gone."
    ko: "pid 3318: 배포 기록 없음, 소유자 없음, 스케줄러 항목은 9일 전 삭제됨. 콜드 로그 저장소에 한 줄이 남아 있다. 프로세스가 사라진 뒤에 기록된 줄이다."
  - en: Release 4.12 registers a completion callback per request behind the flag checkout.completion_callbacks and never removes it. Release 4.11 has no callback.
    ko: 릴리스 4.12는 checkout.completion_callbacks 플래그 뒤에서 요청마다 완료 콜백을 등록하고 끝내 제거하지 않는다. 릴리스 4.11에는 콜백이 없다.
  - en: Two heap snapshots a minute apart agree. Completed requests pile up under completionCallbacks. A restart empties the pile, then it refills at the same slope.
    ko: 1분 간격 힙 스냅샷 두 개가 일치한다. 완료된 요청이 completionCallbacks 아래에 쌓인다. 재시작하면 비워지지만 같은 기울기로 다시 찬다.
  - en: Release 4.12 enabled per-request completion callbacks
    ko: 릴리스 4.12에서 요청별 완료 콜백 활성화
  - en: Callbacks are registered for every request and never removed
    ko: 콜백이 요청마다 등록되고 제거되지 않음
  - en: Completed requests stay reachable and exhaust the instance heap
    ko: 완료된 요청이 참조된 채 남아 인스턴스 힙을 소진함
  - en: Checkouts stall in garbage-collection pauses and fail
    ko: 체크아웃이 GC 일시정지에 걸려 멈추고 실패함
  - en: Evening sale traffic doubles the rate of retained objects
    ko: 저녁 세일 트래픽으로 보유 객체 증가 속도가 두 배가 됨
  - en: Read the checkout handler log
    ko: 체크아웃 핸들러 로그 읽기
  - en: Check heap growth, instance count and cart sizes
    ko: 힙 증가량, 인스턴스 수, 장바구니 크기 확인
  - en: Take a heap dump and see what is being kept
    ko: 힙 덤프를 떠서 무엇이 남아 있는지 보기
  - en: Compare tonight's checkout handler with last week's
    ko: 오늘 밤 체크아웃 핸들러를 지난주 것과 비교하기
  - en: Look up the deleted process that owns one kept block
    ko: 보유 블록 하나의 주인인 삭제된 프로세스 조회하기
  - en: Restart the checkout instances to empty the heap
    ko: 체크아웃 인스턴스를 재시작해 힙 비우기
  - en: Roll checkout back to last week's release (4.11)
    ko: 체크아웃을 지난주 릴리스(4.11)로 롤백하기
  - en: Add eight checkout instances (Capacity Advisor)
    ko: 체크아웃 인스턴스 8대 추가하기 (용량 어드바이저)
  - en: Turn off the completion-callback flag on tonight's release
    ko: 오늘 밤 릴리스의 완료 콜백 플래그 끄기
  - en: Release 4.12 running with checkout.completion_callbacks = off. Callback registry empty after the next collection. Large carts price normally.
    ko: 릴리스 4.12, checkout.completion_callbacks = off로 실행 중. 다음 컬렉션 후 콜백 레지스트리 비어 있음. 대형 장바구니 가격 계산 정상.
  - en: Post a status update to the War Room
    ko: 워룸에 상황 공유하기
  - en: Ask Sam to compare two heap snapshots
    ko: 샘에게 힙 스냅샷 두 개 비교 맡기기
  - en: Completed requests held by their callbacks
    ko: 콜백에 붙잡힌 완료 요청
  - en: "Heap dump: checkout-handler / completionCallbacks / completed-request. 1.9 million requests kept alive after their responses were sent."
    ko: "힙 덤프: checkout-handler / completionCallbacks / completed-request. 응답을 보낸 뒤에도 살아 있는 요청 190만 건."
  - en: Release 4.12 never lets go
    ko: 놓아주지 않는 릴리스 4.12
  - en: 4.12 registers a completion callback per request behind checkout.completion_callbacks and never removes it. 4.11 has no callback, and still has the large-cart crash 4.12 fixed.
    ko: 4.12는 checkout.completion_callbacks 플래그가 켜지면 요청마다 완료 콜백을 등록하고, 끝내 제거하지 않는다. 4.11에는 콜백이 없지만, 4.12가 고친 대형 장바구니 크래시가 그대로 있다.
  - en: Sam's heap snapshots
    ko: 샘의 힙 스냅샷
  - en: Completed requests pile up under completionCallbacks. A restart empties the pile and it refills at the same slope. Rolling back to 4.11 brings back the large-cart crash.
    ko: 완료된 요청이 completionCallbacks 아래에 쌓인다. 재시작하면 비워지지만 같은 기울기로 다시 찬다. 4.11로 롤백하면 대형 장바구니 크래시가 돌아온다.
  - en: Deleted allocation log fragment
    ko: 삭제된 할당 로그 조각
  - en: "UNKNOWN: the objects are gone. the references are not."
    ko: "UNKNOWN: 객체는 사라졌어. 참조는 남았어."
  - en: "pid 3318 was removed nine days ago. Its block is still in your heap, still pinned by the same callback as everything else, and the cold store kept one line it wrote after it was gone. UNKNOWN: the objects are gone. the references are not."
    ko: "pid 3318은 9일 전에 제거됐다. 그 블록은 아직 네 힙에 있다. 다른 모든 것과 같은 콜백에 여전히 묶인 채로. 그리고 콜드 스토어에는 그것이 사라진 뒤에 쓴 한 줄이 남아 있었다. UNKNOWN: 객체는 사라졌어. 참조는 남았어."
  - en: Maya / SRE Lead
    ko: 마야 / SRE 리드
  - en: Sam / Platform
    ko: 샘 / 플랫폼
  - en: Jin / Support
    ko: 진 / 고객지원
  - en: Capacity Advisor
    ko: 용량 어드바이저
  - en: Operator
    ko: 운영자
  - en: Checkout heap is climbing on every instance, not just one. The evening sale opens in about four minutes. I want this understood before then.
    ko: 체크아웃 힙이 인스턴스 하나가 아니라 전부에서 올라가고 있어요. 저녁 세일이 4분쯤 뒤에 열려요. 그 전에 원인을 파악하고 싶어요.
  - en: A handful of customers say the payment screen spins and never finishes. Not many yet.
    ko: 결제 화면이 계속 돌기만 하고 안 끝난다는 고객이 몇 명 있어요. 아직 많진 않아요.
  - en: "Recommended action: scale checkout pool from 12 to 20 instances. Projected heap per instance: 61%. Confidence 0.88."
    ko: "권고 조치: 체크아웃 풀을 인스턴스 12대에서 20대로 확장하십시오. 인스턴스당 예상 힙: 61%. 신뢰도 0.88."
  - en: On it. Two heap snapshots a minute apart will tell us what's growing.
    ko: 맡을게요. 1분 간격으로 힙 스냅샷 두 개 뜨면 뭐가 늘어나는지 보일 거예요.
  - en: Snapshots agree. Completed requests pile up under completionCallbacks. A restart empties the pile and it refills at the same slope. And please don't roll back to 4.11. That's the release that crashes on big carts.
    ko: 스냅샷 결과가 일치해요. 완료된 요청이 completionCallbacks 아래에 쌓여요. 재시작하면 비워졌다가 같은 기울기로 다시 차요. 그리고 4.11로 롤백하는 건 제발 하지 마요. 대형 장바구니에서 크래시 나는 릴리스예요.
  - en: GC is running back to back on checkout-07. Pauses are at 900 ms and climbing.
    ko: checkout-07에서 GC가 쉴 새 없이 돌고 있어요. 일시정지가 900 ms인데 계속 늘어나요.
  - en: The evening sale is live. Traffic doubled, and so did the complaints.
    ko: 저녁 세일 시작됐어요. 트래픽도 두 배, 불만도 두 배예요.
  - en: checkout-03 and checkout-09 just got killed for running out of memory. Every cart in flight on them is gone.
    ko: checkout-03이랑 checkout-09가 방금 메모리 부족으로 죽었어요. 거기서 처리 중이던 장바구니는 전부 날아갔어요.
  - en: Support has had nothing from us in two and a half minutes. A customer post asking if checkout is down is going around and we have no answer for it.
    ko: 고객지원은 2분 30초째 우리한테서 아무 소식도 못 받았어요. 체크아웃 다운됐냐는 고객 글이 돌고 있는데 답할 말이 없어요.
  - en: Rolling restart finished. Heap is down to 41% on every instance. Same build, same handler.
    ko: 롤링 재시작 끝났어요. 모든 인스턴스에서 힙이 41%로 내려갔어요. 빌드도 핸들러도 그대로예요.
  - en: The restarted instances are back above 85%. Same slope as before.
    ko: 재시작한 인스턴스가 다시 85%를 넘었어요. 아까랑 같은 기울기예요.
  - en: With the sale running, the restarted instances filled up in just over a minute.
    ko: 세일 중이라 재시작한 인스턴스가 1분 남짓 만에 다 찼어요.
  - en: 4.11 is live and the heap is flat. And every cart over fifty items is crashing at pricing again. That's the bug 4.12 was shipped to fix.
    ko: 4.11 올라갔고 힙은 안정됐어요. 그런데 50개 넘는 장바구니가 전부 가격 계산에서 다시 크래시 나요. 4.12가 고치려던 바로 그 버그예요.
  - en: Our wholesale accounts can't place orders. Anything over fifty lines dies at pricing. Those are our biggest customers.
    ko: 도매 고객들이 주문을 못 넣고 있어요. 50줄 넘는 주문은 전부 가격 계산에서 죽어요. 제일 큰 고객들이에요.
  - en: All twenty instances are leaking now. We nearly doubled the bill and bought two minutes.
    ko: 이제 인스턴스 20대가 전부 새고 있어요. 비용을 거의 두 배로 쓰고 번 건 2분이에요.
  - en: Flag is off. The callback registry drained on the next collection and heap is flat at 39%. Big carts are pricing fine.
    ko: 플래그 껐어요. 다음 GC 때 콜백 레지스트리가 비워졌고 힙은 39%에서 멈춰 있어요. 대형 장바구니 가격 계산도 정상이에요.
  - en: "Status posted: checkout instances are running out of memory after tonight's release. Some payments are slow or failing. A fix is in progress."
    ko: "상황 공유: 오늘 밤 릴리스 이후 체크아웃 인스턴스 메모리 부족 발생. 일부 결제 지연 또는 실패. 수정 진행 중."
  - en: I checked pid 3318 three times. It was deleted nine days ago. I don't know how a process that doesn't exist is holding memory in tonight's build.
    ko: pid 3318 세 번 확인했어요. 9일 전에 삭제된 프로세스예요. 존재하지도 않는 프로세스가 어떻게 오늘 밤 빌드에서 메모리를 잡고 있는지 모르겠어요.
