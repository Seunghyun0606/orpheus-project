  - en: A restart empties every heap and the same handler starts filling them again; once the sale starts they fill twice as fast. Going back to 4.11 stops the leak and brings back the crash on carts over fifty items. The advisor's eight extra instances cost real money and run the same build.
    ko: 재시작하면 모든 힙이 비워지지만 같은 핸들러가 곧바로 다시 채운다. 세일이 시작되면 두 배 빨리 찬다. 4.11로 돌아가면 누수는 멈추지만 50개 넘는 장바구니의 크래시가 돌아온다. 어드바이저가 말하는 추가 인스턴스 8대는 실제 돈이 들고, 같은 빌드를 돌린다.
  - en: Switch off the callbacks
    ko: 콜백 끄기
  - en: Flipping checkout.completion_callbacks off keeps tonight's release and its large-cart fix, and stops registering callbacks. If we already rolled back, this rolls forward. Ninety seconds of redeploy.
    ko: checkout.completion_callbacks를 끄면 오늘 밤 릴리스와 대형 장바구니 수정은 그대로 두고 콜백 등록만 멈춘다. 이미 롤백했다면 이 조치로 다시 롤포워드한다. 재배포에 90초.
