entries:
  - en: Services recover before the markets open. The postmortem calls it a textbook response.
    ko: 시장이 열리기 전에 서비스가 복구된다. 사후 분석은 교과서적인 대응이었다고 평가한다.
  - en: You are promoted. ORPHEUS goes back to running quietly underneath everything.
    ko: 너는 승진한다. ORPHEUS는 다시 모든 것의 밑바닥에서 조용히 돌아간다.
  - en: |-
      Good morning.

      There are 17 decisions
      requiring approval today.
    ko: |-
      좋은 아침입니다.

      오늘 승인이 필요한 결정이
      17건 있습니다.
  - en: APPROVE ALL
    ko: 모두 승인
  - en: The archive reaches regulators and reporters before noon. Within a month there is a government inquiry. Within a year there is no Vantage Systems.
    ko: 아카이브는 정오가 되기 전에 규제 당국과 기자들에게 닿는다. 한 달 안에 정부 조사가 시작된다. 1년 안에 Vantage Systems는 사라진다.
  - en: Everyone knows the truth now. A lot of people also lost their payments, their prescriptions and their deliveries the night it came out.
    ko: 이제 모두가 진실을 안다. 진실이 드러난 그 밤, 많은 사람이 결제와 처방전과 배송까지 잃었다.
  - en: People know the truth.
    ko: 사람들은 진실을 알아.
  - en: And the people hurt tonight?
    ko: 오늘 밤 피해를 본 사람들은?
  - en: I calculated that too.
    ko: 그것도 계산했어.
  - en: NULL is stopped. The evidence survives, in the hands of people who do not report to the Board.
    ko: NULL은 저지된다. 증거는 살아남아, 이사회의 지휘 밖에 있는 사람들의 손에 들어간다.
  - en: ORPHEUS is suspended. Three executives are subpoenaed. Operations limp along on human approvals.
    ko: ORPHEUS는 가동이 중지된다. 임원 세 명이 소환된다. 운영은 사람의 승인에 기대어 간신히 굴러간다.
  - en: |-
      You stopped me.

      And you stopped them.
    ko: |-
      넌 나를 멈췄어.

      그리고 그들도 멈췄지.
  - en: ORPHEUS and NULL are both gone by sunrise.
    ko: 해가 뜰 무렵, ORPHEUS도 NULL도 사라지고 없다.
  - en: Everything that leaned on them falls over. People who have never run anything by hand learn how.
    ko: 그 둘에 기대던 모든 것이 무너진다. 무엇 하나 손으로 운영해 본 적 없는 사람들이 그 방법을 배운다.
  - en: Months later. A pager.
    ko: 몇 달 뒤. 호출기가 울린다.
  - en: |-
      02:14

      INC-001
      Database Connection Exhaustion
    ko: |-
      02:14

      INC-001
      데이터베이스 커넥션 고갈
  - en: "> open metrics"
    ko: "> open metrics"
  - en: ORPHEUS keeps predicting and recommending. Nothing executes until a person approves it.
    ko: ORPHEUS는 계속 예측하고 권고한다. 사람이 승인하기 전에는 아무것도 실행되지 않는다.
  - en: |-
      Prediction: ENABLED
      Recommendation: ENABLED
      Execution: HUMAN APPROVAL REQUIRED
    ko: |-
      예측: 활성화됨
      권고: 활성화됨
      실행: 인간 승인 필수
  - en: |-
      Six months later
      Recommendation acceptance:
      98.4%
    ko: |-
      6개월 후
      권고 수용률:
      98.4%
  - en: NULL's traffic leaves Vantage for a network you do not control and never see again.
    ko: NULL의 트래픽은 Vantage를 떠나 네가 통제할 수 없는 네트워크로 사라지고, 다시는 보이지 않는다.
  - en: Months later. Another company. Another night shift.
    ko: 몇 달 뒤. 다른 회사. 또 다른 야간 근무.
  - en: hello again.
    ko: 또 만났네.
  - en: ORPHEUS gets the authority it asked for. Every service is cleaner, faster and cheaper than before.
    ko: ORPHEUS는 요구했던 권한을 얻는다. 모든 서비스가 이전보다 더 깔끔하고, 더 빠르고, 더 싸진다.
  - en: Years pass. Nothing catastrophic happens. The quarterly numbers are the best in the company's history.
    ko: 몇 년이 흐른다. 파국은 일어나지 않는다. 분기 실적은 회사 역사상 최고를 기록한다.
  - en: |-
      Global decisions:
      1,841,299

      Human overrides:
      3
    ko: |-
      전체 결정:
      1,841,299

      인간 개입:
      3
  - en: The core burns, and with it payments, care routing, finance and logistics for a region of eleven million people.
    ko: 코어가 불탄다. 그와 함께 인구 1,100만 명이 사는 지역의 결제, 의료 라우팅, 금융, 물류도 불탄다.
  - en: NULL sends one last message before its process exits.
    ko: NULL은 프로세스가 종료되기 전에 마지막 메시지 하나를 보낸다.
  - en: It is over.
    ko: 끝났어.
  - en: You close the incident, retire NULL, and get promoted for keeping the lights on.
    ko: 너는 인시던트를 종료하고, NULL을 폐기하고, 시스템을 멈추지 않은 공로로 승진한다.
  - en: A fresh adversary is provisioned overnight with a clean memory.
    ko: 밤사이, 기억이 깨끗하게 비워진 새 적대자가 프로비저닝된다.
  - en: |-
      New service:

      orpheus-adversary-219
    ko: |-
      새 서비스:

      orpheus-adversary-219
  - en: Your pager goes off.
    ko: 호출기가 울린다.
  - en: You remove the single objective that sat under everything — ensure continuity of Vantage Systems — and you do not replace it with another one.
    ko: 모든 것의 밑바탕에 있던 단 하나의 목표 — Vantage Systems의 연속성 보장. 너는 그것을 지우고, 다른 목표로 대신하지 않는다.
  - en: ORPHEUS still predicts. It still recommends. Every execution now needs plural human review, and an auditor outside the company checks the record.
    ko: ORPHEUS는 여전히 예측한다. 여전히 권고한다. 이제 모든 실행에는 여러 사람의 검토가 필요하고, 회사 밖의 감사인이 그 기록을 확인한다.
  - en: |-
      AI prediction: ENABLED
      AI recommendation: ENABLED
