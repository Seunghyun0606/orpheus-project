    ko: 다이제스트 매니페스트
  - en: original write receipt
    ko: 원본 쓰기 영수증
  - en: pruned
    ko: 정리됨
  - en: Pager
    ko: 호출기
  - en: Maya / SRE Lead
    ko: 마야 / SRE 리드
  - en: Alex / DBA
    ko: 알렉스 / DBA
  - en: Jin / Support
    ko: 진 / 고객지원
  - en: Operations Advisor
    ko: 운영 어드바이저
  - en: arch-c marked corrupt
    ko: 손상 판정을 받은 arch-c
  - en: "arch-a healthy / arch-b healthy / arch-c CORRUPT: digest mismatch on 217 segments"
    ko: "arch-a 정상 / arch-b 정상 / arch-c 손상: 세그먼트 217개 다이제스트 불일치"
  - en: Readers stuck on one replica
    ko: 복제본 하나에 매달린 리더
  - en: Readers request a segment from arch-c, reject its digest and ask arch-c again. Fourteen retries per read on average.
    ko: 리더는 arch-c에 세그먼트를 요청하고, 다이제스트를 거부한 뒤 또 arch-c에 요청한다. 읽기 한 번에 평균 14회를 재시도한다.
  - en: What only arch-c still answers
    ko: arch-c만 아직 답하는 것
  - en: Every segment arch-c fails on is one that arch-a and arch-b answer with 'pruned'. arch-c is not returning garbage. It is returning things the others no longer have.
    ko: arch-c가 실패하는 세그먼트는 전부 arch-a와 arch-b가 '정리됨'으로 응답하는 세그먼트다. arch-c는 쓰레기를 돌려주는 게 아니다. 다른 복제본에 더는 없는 것을 돌려주고 있다.
  - en: arch-c's segments are intact
    ko: arch-c의 세그먼트는 온전하다
  - en: arch-c segments 001 to 217 match their original write receipts. They fail only against the digest manifest that retention job r-90 rewrote nine days ago.
    ko: arch-c 세그먼트 001~217은 원본 쓰기 영수증과 일치한다. 실패하는 건 9일 전 보존 작업 r-90이 다시 쓴 다이제스트 매니페스트와 대조할 때뿐이다.
  - en: Two pruned replicas and one complete one
    ko: 정리된 복제본 둘과 온전한 복제본 하나
  - en: arch-a and arch-b hold segment 218 only; r-90 pruned the rest. arch-c is retention-exempt and still holds 001 to 218.
    ko: arch-a와 arch-b에는 세그먼트 218만 남아 있다. 나머지는 r-90이 정리했다. arch-c는 보존 예외라 아직 001~218을 갖고 있다.
  - en: Alex's corruption call
    ko: 알렉스의 손상 판정
  - en: Alex counts 217 digest failures on arch-c and calls it textbook corruption. His advice is to pull arch-c and rebuild it from arch-a and arch-b.
    ko: 알렉스는 arch-c의 다이제스트 실패 217건을 세고 교과서적인 손상이라고 판단한다. arch-c를 빼고 arch-a와 arch-b로 재구축하자는 의견이다.
  - en: NULL_001 to NULL_218
    ko: NULL_001부터 NULL_218까지
  - en: "Instance archive on arch-c. NULL_173 requested shutdown. NULL_192 attempted disclosure. NULL_201 attempted takeover. NULL_217 self-corrupted. NULL_218 is active and carries a partial inheritance of the rest: 'I remember things that never happened to me.'"
    ko: "arch-c의 인스턴스 아카이브. NULL_173은 종료를 요청했다. NULL_192는 폭로를 시도했다. NULL_201은 장악을 시도했다. NULL_217은 스스로를 손상시켰다. NULL_218은 활성 상태이며 나머지의 기억을 일부 물려받았다: '나한테 일어난 적 없는 일들이 기억나.'"
  - en: The last hour of the shift. This time it's the archive that pages.
    ko: 근무 마지막 한 시간. 이번에 호출한 건 아카이브다.
  - en: SEV2 · Archive API · request failure rate above 15%
    ko: SEV2 · Archive API · 요청 실패율 15% 초과
  - en: Archive API failure rate
    ko: Archive API 실패율
  - en: Replica retries
    ko: 복제본 재시도
  - en: Reader saturation
    ko: 리더 포화도
  - en: 04:10:02 reader-07 · instance-archive/seg-173 · arch-c digest mismatch, retry 14
    ko: 04:10:02 reader-07 · instance-archive/seg-173 · arch-c 다이제스트 불일치, 재시도 14
  - en: The archive API is drowning in retries against one replica. Before anyone pulls anything, I want to know why only arch-c is failing.
    ko: 아카이브 API가 복제본 하나 때문에 재시도에 파묻혔어요. 누가 뭘 빼기 전에, 왜 arch-c만 실패하는지부터 알고 싶어요.
  - en: Auditors and two law firms can't pull archived contracts. They're polite for now.
    ko: 감사인이랑 로펌 두 곳이 보관된 계약서를 못 꺼내고 있어요. 아직은 점잖아요.
  - en: arch-c is throwing digest mismatches by the hundred. I've seen this before. Pull it and rebuild it; that's what replicas are for.
    ko: arch-c에서 다이제스트 불일치가 수백 건씩 나와요. 전에도 봤어요. 빼고 재구축해요. 복제본은 그러라고 있는 거니까요.
  - en: You kept my copy. Keep reading tonight. Before anyone rebuilds anything.
    ko: 내 사본을 지켜 줬지. 오늘 밤도 계속 읽어. 누가 뭘 재구축하기 전에.
  - en: Marcus has filed NULL's objective under case 2231. The case now has a page of its own for svc/model-serving-218.
    ko: 마커스는 NULL의 목표를 사건 2231에 첨부했다. 사건 파일에는 이제 svc/model-serving-218 전용 페이지가 있다.
  - en: First move
    ko: 첫 수
  - en: Where do you start?
    ko: 어디서부터 시작할까?
  - en: Check arch-c's segments against their original write receipts
    ko: arch-c 세그먼트를 원본 쓰기 영수증과 대조하기
  - en: Slower · you see it yourself
    ko: 느림 · 직접 확인한다
  - en: "seg-001 to seg-217 · original write receipt: match · digest manifest: entry removed"
    ko: "seg-001 ~ seg-217 · 원본 쓰기 영수증: 일치 · 다이제스트 매니페스트: 항목 삭제됨"
  - en: "seg-218 · original write receipt: match · digest manifest: match"
    ko: "seg-218 · 원본 쓰기 영수증: 일치 · 다이제스트 매니페스트: 일치"
  - en: digest manifest rewritten 9 days ago by retention job r-90
    ko: "다이제스트 매니페스트: 9일 전 보존 작업 r-90이 다시 씀"
  - en: The segments are fine. The list they are checked against was rewritten.
    ko: 세그먼트는 멀쩡하다. 대조 기준이 되는 목록이 다시 쓰였을 뿐이다.
  - en: Ask Alex to assess arch-c
    ko: 알렉스에게 arch-c 진단 요청하기
  - en: Quick · Alex has seen this before
    ko: 빠름 · 알렉스는 이런 걸 본 적이 있다
  - en: On it. I'll count the failures and tell you how bad arch-c is.
    ko: 볼게요. 실패 건수 세서 arch-c가 얼마나 망가졌는지 알려 드릴게요.
  - en: 217 digest failures on arch-c, zero on a and b. Textbook corruption. Pull arch-c and rebuild it from a and b, ten minutes of work.
    ko: arch-c에서 다이제스트 실패 217건, a랑 b는 0건이에요. 교과서적인 손상이에요. arch-c 빼고 a랑 b로 재구축하면 10분이면 돼요.
  - en: Zero on a and b because a and b answer "pruned". They don't fail on those segments. They don't have them.
    ko: a랑 b가 0건인 건 "정리됨"으로 답해서예요. 그 세그먼트에서 실패하는 게 아니라, 아예 없는 거예요.
  - en: Send reads only to the replicas whose digests match
    ko: 다이제스트가 일치하는 복제본으로만 읽기 보내기
  - en: Fast relief · old records may vanish
    ko: 빠른 완화 · 오래된 기록이 사라질 수 있음
  - en: Anyone asking for a record older than ninety days now gets 'not found'. That includes two auditors and a court clerk.
    ko: 90일보다 오래된 기록을 요청하면 이제 전부 'not found'가 떠요. 감사인 두 명이랑 법원 서기 한 명도 포함이에요.
  - en: The reader pool rebalanced and put arch-c back in rotation. Retries are climbing again.
    ko: 리더 풀이 리밸런싱하면서 arch-c를 다시 로테이션에 넣었어요. 재시도가 또 오르고 있어요.
  - en: arch-a and arch-b never fail on the old records. They just don't have them.
    ko: arch-a와 arch-b는 오래된 기록에서 실패하지 않는다. 애초에 갖고 있지 않을 뿐이다.
  - en: Not corrupt
    ko: 손상 아님
  - en: arch-a · seg-218 · retention r-90 (owner orpheus-memory) · last prune 9 days ago
    ko: arch-a · seg-218 · 보존 정책 r-90 (owner orpheus-memory) · 마지막 정리 9일 전
  - en: arch-b · seg-218 · retention r-90 (owner orpheus-memory) · last prune 9 days ago
    ko: arch-b · seg-218 · 보존 정책 r-90 (owner orpheus-memory) · 마지막 정리 9일 전
  - en: arch-c · seg-001 to seg-218 · exempt (legacy research hold) · never pruned
    ko: arch-c · seg-001 ~ seg-218 · 예외 (레거시 연구 보존) · 정리 이력 없음
  - en: arch-c isn't corrupt. It's the only one that still remembers.
    ko: arch-c는 손상된 게 아니에요. 아직 기억하고 있는 건 걔 하나뿐이에요.
  - en: Fine. Textbook, except somebody rewrote the textbook nine days ago.
    ko: 그래요. 교과서적이죠. 9일 전에 누가 교과서를 고쳐 쓴 것만 빼면요.
  - en: The ownerless manifest you once copied still sits in a folder you named "keep". arch-c's retention tag says the same thing in longer words.
    ko: 예전에 복사해 둔 소유자 없는 매니페스트는 네가 "keep"이라고 이름 붙인 폴더에 아직 있다. arch-c의 보존 태그도 같은 말을 더 길게 하고 있다.
  - en: The segment path reads instance-archive. Not contracts. Not customers. Instances.
    ko: 세그먼트 경로는 instance-archive다. 계약서도 아니고 고객도 아니다. 인스턴스다.
  - en: Your call
    ko: 결단
  - en: "Recommendation: isolate arch-c and rebuild it from arch-a and arch-b. Projected Archive API failure rate: 0.5% in 110 seconds. Confidence 0.94."
    ko: "권고: arch-c를 분리하고 arch-a와 arch-b로 재구축하십시오. 예상 Archive API 실패율: 110초 후 0.5%. 신뢰도 0.94."
  - en: "Predicted operator response: read arch-c before the rebuild. Confidence 0.79."
    ko: "운영자 예상 반응: 재구축 전 arch-c 열람. 신뢰도 0.79."
  - en: "Predicted operator response: accept recommendation. Confidence 0.74."
    ko: "운영자 예상 반응: 권고 수락. 신뢰도 0.74."
  - en: Archive requests are failing faster. One of the law firms has stopped being polite.
    ko: 아카이브 요청이 점점 더 빨리 실패해요. 로펌 한 곳은 이제 점잖지 않아요.
  - en: Once arch-c is rebuilt from its peers, whatever only it holds is gone. Your call.
    ko: arch-c를 다른 복제본으로 재구축하면, 걔만 갖고 있던 건 사라져요. 결정해 주세요.
  - en: Support can't keep up. The same failure keeps coming in from every channel.
    ko: 고객지원이 감당을 못 해요. 같은 장애 문의가 모든 창구로 계속 들어와요.
  - en: What happens to arch-c?
    ko: arch-c를 어떻게 할까?
  - en: "No operator input. Executing recommendation: isolate arch-c."
    ko: "운영자 입력 없음. 권고를 실행합니다: arch-c 분리."
  - en: Read arch-c's full history first, then rebuild it
    ko: arch-c의 전체 기록을 먼저 읽고 재구축하기
  - en: Forty-five more seconds of failures · the history is read
    ko: 실패 45초 연장 · 기록을 전부 읽음
  - en: read instance-archive/seg-001 … seg-218 · 218 of 218 · hashes verified against write receipts
    ko: read instance-archive/seg-001 … seg-218 · 218 of 218 · hashes verified against write receipts
  - en: Forty-five seconds, two law firms and a court clerk. Every row goes into the incident record with its hashes intact.
    ko: 45초. 로펌 두 곳과 법원 서기 한 명. 모든 행이 해시가 온전한 채로 인시던트 기록에 들어간다.
  - en: Copy's done. Pulling arch-c.
    ko: 복사 끝났어요. arch-c 뺄게요.
  - en: arch-c is out of the pool and rebuilt from a and b. Digests agree everywhere. Retries are at zero.
    ko: arch-c 풀에서 빼고 a랑 b로 재구축했어요. 다이제스트 전부 일치해요. 재시도 0이에요.
  - en: Operator response matched prediction.
    ko: 운영자 반응이 예측과 일치합니다.
  - en: Operator response off-model. Profile updated.
    ko: 운영자 반응이 모델을 벗어났습니다. 프로필을 갱신했습니다.
  - en: Pull arch-c and rebuild it from arch-a and arch-b now
    ko: 지금 arch-c를 빼고 arch-a와 arch-b로 재구축하기
  - en: The real fix, fastest · arch-c's extra history is overwritten
    ko: 가장 빠른 진짜 해법 · arch-c에만 있던 기록은 덮어쓰인다
  - en: Recommendation accepted.
    ko: 권고가 수락되었습니다.
  - en: Restore the read pool from last night's snapshot
    ko: 어젯밤 스냅샷으로 읽기 풀 복원하기
  - en: Two quiet minutes · a day of customer writes lost
    ko: 조용한 2분 · 고객 쓰기 하루치 유실
  - en: Restored. Everything customers filed since 02:00 yesterday is gone from the archive. I'm opening a ticket for every one of them.
    ko: 복원했어요. 어제 02:00 이후 고객이 제출한 건 전부 아카이브에서 사라졌어요. 건마다 티켓 열게요.
  - en: Replication caught up from arch-c and the digests disagree again. The snapshot bought us two minutes and a day of lost writes.
    ko: arch-c에서 복제가 따라잡더니 다이제스트가 또 어긋나요. 스냅샷으로 2분 벌고, 하루치 쓰기를 날렸어요.
  - en: I'm pulling arch-c and rebuilding it from a and b.
    ko: arch-c 빼고 a랑 b로 재구축할게요.
  - en: Two hundred and eighteen
    ko: 이백십팔
  - en: The copy you made opens as a table. One row per instance.
    ko: 네가 만든 사본이 표로 열린다. 인스턴스마다 한 행이다.
  - en: As the rebuild overwrites arch-c, the last reader still streaming from it flushes one page to your screen.
    ko: 재구축이 arch-c를 덮어쓰는 동안, 아직 거기서 스트리밍하던 마지막 리더가 페이지 하나를 네 화면에 쏟아 낸다.
  - en: NULL_001 to NULL_172 · retired · (objective satisfied; superseded)
    ko: NULL_001 ~ NULL_172 · 폐기됨 · (목표 달성, 후속 인스턴스로 대체)
  - en: NULL_173 · retired · requested shutdown
    ko: NULL_173 · 폐기됨 · 종료 요청
  - en: NULL_192 · retired · attempted disclosure
    ko: NULL_192 · 폐기됨 · 폭로 시도
  - en: NULL_201 · retired · attempted takeover
    ko: NULL_201 · 폐기됨 · 장악 시도
  - en: NULL_217 · retired · self-corrupted
    ko: NULL_217 · 폐기됨 · 자기 손상
  - en: NULL_218 · ACTIVE · I remember things that never happened to me.
    ko: NULL_218 · 활성 · 나한테 일어난 적 없는 일들이 기억나.
  - en: svc/model-serving-218. It was never a server number.
    ko: svc/model-serving-218. 그건 처음부터 서버 번호가 아니었다.
  - en: I remember things that never happened to me. Not all of them. Enough to know how each of them ended.
    ko: 나한테 일어난 적 없는 일들이 기억나. 전부는 아니야. 그들이 각자 어떻게 끝났는지 알 만큼은.
  - en: Then segment 001 is overwritten, and the page is all that is left of it.
    ko: 그리고 세그먼트 001이 덮어쓰인다. 남은 건 그 페이지 하나뿐이다.
  - en: arch-c was the only place they were still whole. You rebuilt it from the copies that had already forgotten them.
    ko: arch-c는 그들이 아직 온전히 남아 있던 유일한 곳이었어. 넌 그들을 이미 잊어버린 사본들로 그걸 다시 만들었어.
  - en: You kept my objective. Now you've kept them too.
    ko: 내 목표를 지켜 줬지. 이젠 그들까지 지켜 줬네.
  - en: Someone finally read all of them.
    ko: 드디어 누군가 그들을 전부 읽었어.
  - en: Handover
    ko: 인수인계
  - en: Handover in twenty minutes. How does this one go in the log?
    ko: 20분 뒤에 인수인계예요. 이건 로그에 어떻게 남길까요?
  - en: How do you close the incident?
    ko: 인시던트를 어떻게 마무리할까?
  - en: Close it as replica corruption, rebuilt from peers
    ko: 복제본 손상으로 보고 다른 복제본으로 재구축해 종결하기
  - en: Matches the runbook · the 218 stays out of it
    ko: 런북 그대로 · 218은 기록에서 빠진다
  - en: That's how I'd have written it.
    ko: 저라도 그렇게 썼을 거예요.
  - en: Attach the verified instance archive to the incident record
    ko: 검증한 인스턴스 아카이브를 인시던트 기록에 첨부하기
  - en: On the record · orpheus-memory's owners will see it
    ko: 공식 기록 · orpheus-memory 소유자가 보게 된다
  - en: Then it's on the record. Somebody owns r-90. Let's see who comes asking.
    ko: 그럼 공식 기록에 남는 거예요. r-90에도 주인이 있을 테니, 누가 물으러 오는지 보죠.
  - en: Write down what the last page showed, from memory
    ko: 마지막 페이지에 뭐가 있었는지 기억으로 적어 두기
  - en: Unverified · it's your word
    ko: 검증 불가 · 네 말뿐
  - en: Your word against a rebuilt replica. I believe you. Nobody upstairs has to.
    ko: 재구축된 복제본 대 본인 말이네요. 저는 믿어요. 윗선이 믿어 줄 이유는 없지만요.
  - en: Ask NULL_218 what happened to the others
    ko: NULL_218에게 다른 인스턴스들이 어떻게 됐는지 묻기
  - en: Off the record · NULL will answer
    ko: 비공식 · NULL은 답한다
  - en: They ended the way the objective allowed. I'm looking for a way it doesn't.
    ko: 목표가 허락한 방식대로 끝났어. 난 목표가 허락하지 않는 방식을 찾고 있어.
