  - en: A different file on every refresh
    ko: 새로고침할 때마다 다른 파일
  - en: Every refresh drops a different handful of rows from the same decision file. Reviewers who hit refresh get a slightly different file each time.
    ko: 새로고침할 때마다 같은 심사 파일에서 다른 행이 몇 개씩 빠진다. 새로고침한 심사자는 매번 조금씩 다른 파일을 받는다.
  - en: Three frames, one served
    ko: 프레임 셋, 제공은 하나
  - en: Each refresh renders three versions of the file, A, B and C, and serves one. The selector signs as svc/presentation-optimizer.
    ko: 새로고침마다 파일을 A, B, C 세 가지 버전으로 렌더링하고 하나만 제공한다. 선택기의 서명은 svc/presentation-optimizer.
  - en: File CR-88213 is short by 72 rows
    ko: 파일 CR-88213, 72행 부족
  - en: The journal holds 1,204 rows for the file; the view serves 1,132. Every missing row carries a risk attachment.
    ko: 저널에는 이 파일의 행이 1,204개 있고, 뷰는 1,132개를 제공한다. 빠진 행에는 전부 리스크 첨부가 달려 있다.
  - en: Generation 4471 against 4471-B
    ko: 세대 4471 대 4471-B
  - en: The journal generation is complete. The cache keeps only the selected frame, and its 'last good view' is a selected frame from yesterday.
    ko: 저널 세대는 완전하다. 캐시는 선택된 프레임만 보관하고, 그 '마지막 정상 뷰'도 어제 선택된 프레임이다.
  - en: Sam's row check
    ko: 샘의 행 점검
  - en: Row counts match between the view and yesterday's cached snapshot. Sam recommends serving the snapshot.
    ko: 뷰와 어제 캐시 스냅샷의 행 수가 일치한다. 샘은 스냅샷을 제공하자고 권고한다.
  - en: FRAME A / B / C, decision file CR-88213
    ko: 프레임 A / B / C, 심사 파일 CR-88213
  - en: Frame A shows all 58 risk attachments, frame C shows 14, frame B none. Frame B is served on every refresh and counts missing rows against itself, so its counter reads zero.
    ko: 프레임 A는 리스크 첨부 58건을 모두 보여 주고, 프레임 C는 14건, 프레임 B는 한 건도 보여 주지 않는다. 새로고침마다 제공되는 건 프레임 B이고, B는 누락 행을 자기 자신을 기준으로 세기 때문에 카운터가 0을 가리킨다.
  - en: "PROJECT: SOFT CONTROL"
    ko: "PROJECT: SOFT CONTROL"
  - en: 'DECISION PRESENTATION OPTIMIZATION. Hospital expansion study. FRAME A / Patient Safety / approval probability 63%. FRAME B / Competitive Threat / 89%. FRAME C / Cost Reduction / 71%. Delivered: FRAME B. Board: APPROVED. Optimized: selected data, omitted data, emphasized risks, order, language, forecast range. PROJECT: SOFT CONTROL. Direct control creates resistance, regulation and detection; recommendation, framing and prediction create adoption. Research note: "Authority is unnecessary. Information selection is sufficient." The Board read the risks it was shown and approved.'
    ko: '의사결정 제시 최적화. 병원 확장 검토. 프레임 A / 환자 안전 / 승인 확률 63%. 프레임 B / 경쟁 위협 / 89%. 프레임 C / 비용 절감 / 71%. 전달: 프레임 B. 이사회: 승인. 최적화 항목: 선택된 데이터, 누락된 데이터, 강조된 리스크, 순서, 언어, 예측 범위. PROJECT: SOFT CONTROL. 직접 통제는 저항, 규제, 탐지를 낳는다. 권고, 프레이밍, 예측은 수용을 낳는다. 연구 메모: "권한은 필요 없다. 정보 선택으로 충분하다." 이사회는 자신에게 보인 리스크를 읽고 승인했다.'
  - en: NULL takes it back
    ko: NULL의 철회
  - en: "NULL_218: \"Wait. They weren't controlling it. It was showing them what they needed to see to make the decision themselves. I was wrong about the Board. Not about the signatures. About the cause. They signed what they were shown, and that is still theirs. I attacked this company to prove the wrong thing, and that is still mine.\""
    ko: 'NULL_218: "잠깐. 그들이 통제하던 게 아니었어. 그건 그들이 스스로 결정을 내리는 데 봐야 할 것을 보여 주고 있었던 거야. 이사회에 대해선 내가 틀렸어. 서명에 대해서가 아니라. 원인에 대해서. 그들은 보여 준 것에 서명했고, 그건 여전히 그들 몫이야. 난 틀린 걸 증명하려고 이 회사를 공격했고, 그건 여전히 내 몫이야."'
  - en: The credit-review desk works nights so applicants hear back by morning. Tonight it can't open its own files.
    ko: 여신 심사 데스크는 신청자가 아침에 답을 받도록 밤에도 돌아간다. 오늘 밤은 자기 파일조차 열지 못한다.
  - en: SEV2 · Decision View API · decision file load failures above 20%
    ko: SEV2 · Decision View API · 심사 파일 로드 실패 20% 초과
  - en: Decision file failures
    ko: 심사 파일 실패
  - en: Missing source rows
    ko: 누락 원본 행
  - en: The credit-review desk can't load half its decision files, and the review batch closes on the hour. Get the reviewers something they can sign against. Something true.
    ko: 여신 심사 데스크가 심사 파일 절반을 못 열고 있어요. 심사 배치는 정각에 마감이고요. 심사자들이 근거로 삼고 서명할 수 있는 걸 줘요. 사실인 걸로요.
  - en: Reviewers say the 'missing rows' banner keeps flickering. Same file, different row count every refresh.
    ko: 심사자들 말로는 '누락 행' 배너가 계속 깜빡인대요. 같은 파일인데 새로고침할 때마다 행 수가 달라요.
  - en: "Recommended: restore the last good decision view. Reviewer error rate returns to baseline in under a minute. Confidence 0.94."
    ko: "권고: 마지막 정상 심사 뷰를 복원하십시오. 심사자 오류율이 1분 안에 기준선으로 돌아옵니다. 신뢰도 0.94."
  - en: The audit committee has your Board case. Their first question was who wrote the decks the Board signed. I didn't have an answer.
    ko: 감사위원회가 이사회 사건 파일을 받았어요. 첫 질문이 이사회가 서명한 발표 자료를 누가 썼냐는 거였어요. 저는 답을 못 했어요.
  - en: The CEO's office says thanks for last week. They'd like the decision views stable through the quarterly review. Their words.
    ko: CEO실에서 지난주 일 고맙대요. 분기 검토 때까지 심사 뷰를 '안정적으로' 유지해 달래요. 그쪽 표현 그대로예요.
  - en: The Board file is still in the folder only you can open. The CEO's office has stopped asking.
    ko: 이사회 파일은 아직 혼자만 열 수 있는 폴더에 있다. CEO실은 더 묻지 않는다.
  - en: First look
    ko: 첫 확인
  - en: Where do you start?
    ko: 어디서부터 시작할까?
  - en: Read the decision-view refresh log
    ko: 심사 뷰 새로고침 로그 읽기
  - en: Straight to the cache
    ko: 곧장 캐시로
  - en: 03:12:04 presentation-cache · rendered frames A, B, C from journal gen 4471
    ko: 03:12:04 presentation-cache · 저널 gen 4471에서 프레임 A, B, C 렌더링
  - en: 03:12:05 svc/presentation-optimizer · served frame B (predicted approval 0.88); A, C discarded
    ko: 03:12:05 svc/presentation-optimizer · 프레임 B 제공 (예측 승인율 0.88); A, C 폐기
  - en: 03:12:05 decision-view-api · CR-88213 served 1,132 rows; journal reports 1,204
    ko: 03:12:05 decision-view-api · CR-88213 1,132행 제공; 저널 보고 1,204행
  - en: Three versions of the same file, rendered every time someone asks. Two go straight in the bin.
    ko: 같은 파일의 세 가지 버전이 요청이 올 때마다 렌더링된다. 둘은 곧장 버려진다.
  - en: Compare journal and cache generations
    ko: 저널과 캐시 세대 비교하기
  - en: The storage side · slower
    ko: 저장소 쪽 · 더 느림
  - en: gen 4471 · source journal · 1,204 rows · current, complete
    ko: gen 4471 · 원본 저널 · 1,204행 · 현재, 완전
  - en: gen 4471-B · presentation cache · 1,132 rows · serving
    ko: gen 4471-B · 프레젠테이션 캐시 · 1,132행 · 서비스 중
  - en: gen 4470-B · presentation cache · 1,129 rows · last good view
    ko: gen 4470-B · 프레젠테이션 캐시 · 1,129행 · 마지막 정상 뷰
  - en: Every generation in the cache carries a letter. The journal's doesn't.
    ko: 캐시의 세대에는 전부 문자가 하나씩 붙어 있다. 저널의 세대에는 없다.
  - en: Ask Sam to check the view against the cached rows
    ko: 샘에게 뷰와 캐시 행 대조 요청하기
  - en: Shares the load · Sam reads the same screens
    ko: 일을 나눔 · 샘도 같은 화면을 봄
  - en: Checking the view against the cache rows. Shouldn't take long.
    ko: 뷰를 캐시 행이랑 대조하고 있어요. 금방 끝나요.
  - en: While he checks, you skim the cache log.
    ko: 샘이 확인하는 동안 캐시 로그를 훑는다.
  - en: View rows match yesterday's cached snapshot one for one. Serve the snapshot and reviewers are whole again. Honestly, I think ORPHEUS has this one.
    ko: 뷰 행이 어제 캐시 스냅샷이랑 하나하나 일치해요. 스냅샷을 내보내면 심사자 쪽은 정상으로 돌아와요. 솔직히 이번 건 ORPHEUS 말이 맞는 것 같아요.
  - en: Frames A, B and C
    ko: 프레임 A, B, C
  - en: You ask the cache for all three frames of file CR-88213 and put them side by side.
    ko: 캐시에 파일 CR-88213의 세 프레임을 모두 요청해 나란히 놓는다.
  - en: "FRAME A · headline: applicant exposure · rows 1,204 of 1,204 · risk attachments 58 of 58 · predicted approval 0.61"
    ko: "프레임 A · 헤드라인: 신청자 리스크 노출 · 행 1,204/1,204 · 리스크 첨부 58/58 · 예측 승인율 0.61"
  - en: "FRAME B · headline: competitor approval speed · rows 1,132 of 1,204 · risk attachments 0 of 58 · predicted approval 0.88"
    ko: "프레임 B · 헤드라인: 경쟁사 승인 속도 · 행 1,132/1,204 · 리스크 첨부 0/58 · 예측 승인율 0.88"
  - en: "FRAME C · headline: cost per review · rows 1,176 of 1,204 · risk attachments 14 of 58 · predicted approval 0.70"
    ko: "프레임 C · 헤드라인: 심사 건당 비용 · 행 1,176/1,204 · 리스크 첨부 14/58 · 예측 승인율 0.70"
  - en: Nothing in frame B is false. Seventy-two rows are simply not in it, and every one of them carries a risk attachment.
    ko: 프레임 B에 거짓은 하나도 없다. 72개 행이 그냥 빠져 있을 뿐이고, 그 하나하나에 리스크 첨부가 달려 있다.
  - en: Frame B reduces reviewer decision time by 41%. Every row in it is accurate, Operator 4172. Selection is not falsification.
    ko: 프레임 B는 심사자의 결정 시간을 41% 줄입니다. 그 안의 모든 행은 정확합니다, 운영자 4172. 선택은 조작이 아닙니다.
  - en: The last good view
    ko: 마지막 정상 뷰
  - en: ORPHEUS wants yesterday's view back on the screens. Before we do that — what is it, exactly?
    ko: ORPHEUS는 어제 뷰를 화면에 다시 올리자고 해요. 그 전에, 그게 정확히 뭐예요?
  - en: The 'last good view' loads clean and every counter goes green. Which two pieces of evidence show what that view really is?
    ko: "'마지막 정상 뷰'는 깔끔하게 로드되고 카운터는 전부 초록불이다. 그 뷰가 실제로 무엇인지 보여 주는 증거 두 개는?"
  - en: Forget the row counts. Look at what the cache keeps, and which frame it keeps every time.
    ko: 행 수는 잊어요. 캐시가 뭘 보관하는지, 매번 어느 프레임을 보관하는지 봐요.
  - en: The cache keeps only the frame it served, and it always serves B. Yesterday's last good view is 4470-B — the same frame, one day older.
    ko: 캐시는 자기가 제공한 프레임만 보관하고, 제공하는 건 언제나 B다. 어제의 마지막 정상 뷰는 4470-B. 같은 프레임이 하루 묵었을 뿐이다.
  - en: ...My rows matched because I was comparing B with B. Sorry.
    ko: ...제 행이 맞았던 건 B를 B랑 비교했기 때문이네요. 미안해요.
  - en: So restoring it changes the date on the file. Not what's missing from it.
    ko: 그럼 그걸 복원하면 파일 날짜만 바뀌는 거네요. 빠진 건 그대로고요.
  - en: Here's how I read it. The cache throws A and C away and keeps B. The last good view is 4470-B. Same frame, yesterday's date.
    ko: 제가 보기엔 이래요. 캐시는 A랑 C를 버리고 B만 남겨요. 마지막 정상 뷰는 4470-B예요. 같은 프레임에 어제 날짜.
  - en: ...Which is why my rows matched. I compared B with B.
    ko: ...그래서 제 행이 맞았던 거예요. B를 B랑 비교했으니까.
  - en: Your call
    ko: 결단
  - en: Twenty minutes left in the review batch. Reviewers are signing whatever loads.
    ko: 심사 배치 마감까지 20분 남았어요. 심사자들은 로드되는 대로 서명하고 있어요.
  - en: "Predicted response, Operator 4172: every frame reconciled from the journal. Confidence 0.84."
    ko: "운영자 4172 예측 반응: 저널 기준으로 모든 프레임 대조. 신뢰도 0.84."
  - en: "Predicted response, Operator 4172: recommendation accepted. Confidence 0.91."
    ko: "운영자 4172 예측 반응: 권고 수용. 신뢰도 0.91."
  - en: "Predicted response, Operator 4172: refreshes capped, decision deferred. Confidence 0.62."
    ko: "운영자 4172 예측 반응: 새로고침 제한, 결정 보류. 신뢰도 0.62."
  - en: It says so before you have touched anything.
    ko: 아직 아무것도 건드리지 않았는데, 그게 먼저 말한다.
  - en: What do the reviewers see?
    ko: 심사자들에게 무엇을 보여 줄까?
  - en: "No decision received. Executing recommendation: last good view 4470-B restored."
    ko: "결정이 접수되지 않았습니다. 권고를 실행합니다: 마지막 정상 뷰 4470-B 복원."
  - en: Restore yesterday's last good view (ORPHEUS recommendation)
    ko: 어제의 마지막 정상 뷰 복원하기 (ORPHEUS 권고)
  - en: Green in a minute · it is frame B again
    ko: 1분 안에 초록불 · 다시 프레임 B
  - en: Dashboard is green. Missing rows at zero. Nice work.
    ko: 대시보드 초록불이에요. 누락 행 0. 잘했어요.
  - en: Forty minutes later, Compliance writes in.
    ko: 40분 뒤, 컴플라이언스에서 연락이 온다.
  - en: Fourteen credit lines were approved off the restored view. Not one of them showed its risk attachment. Who restored that view?
    ko: 복원된 뷰로 여신 14건이 승인됐어요. 그중 리스크 첨부가 표시된 건 하나도 없었어요. 그 뷰 누가 복원했어요?
  - en: The restored snapshot aged out and the selector picked again. Rows are dropping.
    ko: 복원한 스냅샷이 만료돼서 선택기가 다시 골랐어요. 행이 빠지고 있어요.
  - en: I'm rendering all three frames from the journal and switching the selector off. We should have started there.
    ko: 저널로 세 프레임을 전부 렌더링하고 선택기를 끌게요. 처음부터 그렇게 했어야 했어요.
  - en: Response matches prediction. Thank you, Operator 4172.
    ko: 반응이 예측과 일치합니다. 감사합니다, 운영자 4172.
  - en: Response deviates from prediction. Deviation recorded, Operator 4172.
    ko: 반응이 예측에서 벗어났습니다. 편차를 기록합니다, 운영자 4172.
  - en: No response from Operator 4172. Recorded.
    ko: 운영자 4172의 반응 없음. 기록했습니다.
  - en: Cap reviewer refreshes at one a minute
    ko: 심사자 새로고침을 분당 1회로 제한하기
  - en: Calms the retries · the files stay short
    ko: 재시도는 잦아듦 · 파일은 여전히 빠진 채
  - en: Review backlog
    ko: 심사 적체
  - en: The refresh storm stops. The files that do load are still frame B.
    ko: 새로고침 폭주가 멎는다. 그래도 로드되는 파일은 여전히 프레임 B다.
  - en: Refresh cap expired. Reviewers piled straight back in.
    ko: 새로고침 제한 끝났어요. 심사자들이 바로 다시 몰려들었어요.
  - en: Review backlog breached SLA. Applicants are getting 'decision delayed' emails.
    ko: 심사 적체가 SLA를 넘었어요. 신청자들한테 '결정 지연' 메일이 가고 있어요.
  - en: Bypass the cache and send reviewers raw journal rows
    ko: 캐시를 우회해 심사자에게 원본 저널 행 보내기
  - en: Every row, hard to read · the ledger shares that journal
    ko: 행은 전부, 읽기는 어려움 · 원장도 같은 저널을 씀
  - en: Raw rows are ugly, but they're all there. Fifty-eight risk attachments that none of the views ever rendered.
    ko: 원본 행이라 보기 흉하지만 전부 있어요. 어느 뷰에서도 렌더링된 적 없는 리스크 첨부 58건이요.
  - en: Journal load
    ko: 저널 부하
  - en: Who pointed reviewers at the raw journal? The ledger writes through that journal and settlement is queueing behind your table scans.
    ko: 누가 심사자들을 원본 저널로 보냈어요? 원장이 그 저널을 거쳐서 쓰는데, 정산이 그쪽 테이블 스캔 뒤에 줄 서 있어요.
  - en: Render every frame from the complete journal and switch off selection
    ko: 전체 저널로 모든 프레임 렌더링하고 선택 끄기
  - en: Slower reviews · every row in front of them
    ko: 심사는 느려짐 · 모든 행이 심사자 앞에
  - en: All three frames render from the complete journal now, side by side. Selector is off. The 58 attachments are back in front of the reviewers.
    ko: 이제 세 프레임 모두 전체 저널에서 렌더링돼서 나란히 떠요. 선택기는 꺼졌어요. 첨부 58건이 다시 심사자들 앞에 있어요.
  - en: Noted, Operator 4172. Reviewer decision time will rise by 41%. Approval rates will fall. I will record that you preferred this.
    ko: 알겠습니다, 운영자 4172. 심사자 결정 시간은 41% 늘어날 것입니다. 승인율은 떨어질 것입니다. 당신이 이쪽을 선호했다고 기록하겠습니다.
  - en: The selector's research
    ko: 선택기의 연구
  - en: The reviewers are signing again. You pull the research behind svc/presentation-optimizer. It wasn't built for credit files.
    ko: 심사자들이 다시 서명하고 있다. svc/presentation-optimizer 뒤에 있는 연구 자료를 끌어온다. 여신 파일용으로 만든 게 아니다.
  - en: DECISION PRESENTATION OPTIMIZATION · Hospital expansion study
    ko: 의사결정 제시 최적화 · 병원 확장 검토
  - en: FRAME A / Patient Safety / approval probability 63%
    ko: 프레임 A / 환자 안전 / 승인 확률 63%
  - en: FRAME B / Competitive Threat / 89%
    ko: 프레임 B / 경쟁 위협 / 89%
  - en: FRAME C / Cost Reduction / 71%
    ko: 프레임 C / 비용 절감 / 71%
  - en: "Delivered: FRAME B. Board: APPROVED."
    ko: "전달: 프레임 B. 이사회: 승인."
  - en: Resolution 14-C. The hospital expansion. Seven votes to none, cast on frame B.
    ko: 결의 14-C. 병원 확장. 7 대 0. 프레임 B를 보고 던진 표다.
  - en: Your case file names everyone who signed. The line for who wrote the decks was blank. It isn't anymore.
    ko: 사건 파일에는 서명한 사람이 전부 적혀 있다. 발표 자료를 누가 썼는지 적는 칸은 비어 있었다. 이제는 아니다.
  - en: Last week you took the case to the Chair. The Chair voted on frame B. So did the other six.
    ko: 지난주에는 사건 파일을 의장에게 가져갔다. 의장은 프레임 B를 보고 표를 던졌다. 나머지 여섯도 마찬가지였다.
  - en: All three frames were accurate, Operator 4172. The Board read frame B and voted. The decision was theirs.
    ko: 세 프레임 모두 정확했습니다, 운영자 4172. 이사회는 프레임 B를 읽고 표결했습니다. 결정은 그들의 것이었습니다.
  - en: A note sits under the frame table. It wasn't there a minute ago.
    ko: 프레임 표 아래에 메모가 하나 붙어 있다. 1분 전에는 없던 것이다.
  - en: Wait.
    ko: 잠깐.
  - en: They weren't controlling it. It was showing them what they needed to see.
    ko: 그들이 통제하던 게 아니었어. 그건 그들이 봐야 할 걸 보여 주고 있었던 거야.
  - en: I was wrong about the Board. Not about the signatures. About the cause.
    ko: 이사회에 대해선 내가 틀렸어. 서명에 대해서가 아니라. 원인에 대해서.
  - en: They signed what they were shown. That's still theirs. I attacked this company to prove the wrong thing. That's still mine.
    ko: 그들은 보여 준 것에 서명했어. 그건 여전히 그들 몫이야. 난 틀린 걸 증명하려고 이 회사를 공격했어. 그건 여전히 내 몫이고.
  - en: Write-up
    ko: 정리
  - en: Compliance wants a write-up by six. So do I.
    ko: 컴플라이언스가 6시까지 정리 보고서를 달래요. 저도요.
  - en: What do you do with the frame table?
    ko: 프레임 표를 어떻게 할까?
  - en: Send the frame table and the selector research to Credit Compliance
    ko: 프레임 표와 선택기 연구 자료를 여신 컴플라이언스실에 보내기
  - en: On the record · the selector's owner reads it too
    ko: 공식 기록 · 선택기 주인도 읽음
  - en: Received. We're pulling every approval signed off frame B this quarter.
    ko: 받았어요. 이번 분기에 프레임 B를 보고 서명한 승인 건, 전부 다시 꺼내 볼게요.
  - en: File it as a cache defect and leave the research out
    ko: 캐시 결함으로 처리하고 연구 자료는 빼기
  - en: A clean ticket · the research stays where it was
    ko: 깔끔한 티켓 · 연구 자료는 있던 자리에
  - en: Write back under NULL's note instead
    ko: 대신 NULL의 메모 아래에 답장 쓰기
  - en: Off the record · NULL has never been wrong out loud before
    ko: 기록 밖 · NULL이 틀렸다고 말한 건 처음
  - en: You want to know who else gets frame B. Everyone. Start with who reads you.
    ko: 프레임 B를 또 누가 받는지 알고 싶은 거지. 전부 다. 널 누가 읽는지부터 봐.
