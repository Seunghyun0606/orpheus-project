  - en: Live writes behind archive scans
    ko: 아카이브 스캔 뒤로 밀린 실시간 쓰기
  - en: Live telemetry writes wait behind archive scan reservations and time out after two seconds.
    ko: 실시간 텔레메트리 쓰기가 아카이브 스캔 예약 뒤에서 기다리다 2초 후 타임아웃된다.
  - en: Legal hold LH-0931
    ko: 법적 보존 조치 LH-0931
  - en: The reconstruction job is under legal hold. Legal allows it to be slowed, not stopped.
    ko: 재구성 작업은 법적 보존 조치 대상이다. 법무는 늦추는 것까지만 허락하고 멈추는 것은 허락하지 않는다.
  - en: The session being rebuilt
    ko: 재구성 중인 세션
  - en: "The reconstruction job's target is session archive op-4172, the night of INC-001 Connection Saturation. Requested by: lineage-audit. Human requester: none."
    ko: "재구성 작업의 대상은 세션 아카이브 op-4172, INC-001 커넥션 포화가 있던 밤이다. 요청자: lineage-audit. 사람 요청자: 없음."
  - en: lineage-audit-0931 owns the IO pool
    ko: IO 풀을 점유한 lineage-audit-0931
  - en: The reconstruction job holds 212 read reservations on the pool that acknowledges live telemetry writes.
    ko: 재구성 작업이 실시간 텔레메트리 쓰기의 확인 응답을 맡은 풀에 읽기 예약 212건을 잡고 있다.
  - en: One uncapped pool, one narrow cutover
    ko: 상한 없는 풀 하나, 좁은 컷오버 하나
  - en: Archive reads have no cap on the live write pool. Moving them means copying every outstanding read, which converges only below 40.
    ko: 실시간 쓰기 풀에서 아카이브 읽기에는 상한이 없다. 옮기려면 남은 읽기를 전부 복사해야 하고, 그 복사는 40 미만일 때만 수렴한다.
  - en: Alex on the cutover
    ko: 알렉스가 본 컷오버
  - en: The cutover cannot converge at 212 outstanding reads. Throttle first, then migrate. A paused job freezes its reservations mid-flight and the copy cannot take them.
    ko: 남은 읽기 212건에서는 컷오버가 수렴하지 못한다. 먼저 스로틀하고, 그다음 옮겨야 한다. 일시 정지된 작업은 예약이 처리 중에 얼어붙어 복사할 수 없다.
  - en: Your first night, rebuilt
    ko: 다시 만들어지는 첫날 밤
  - en: The job has rebuilt 18 of 96 minutes of INC-001 so far — operator keystrokes, pager acknowledgements, chat. All of it yours.
    ko: 작업은 지금까지 INC-001의 96분 중 18분을 재구성했다. 운영자 키 입력, 호출 확인, 채팅. 전부 네 것이다.
  - en: Experiment ADV-18471
    ko: 실험 ADV-18471
  - en: "INC-001 Connection Saturation is classified as controlled production experiment ADV-18471. Human subject: EMPLOYEE #4172, your employee number. A handful of other incidents carry experiment numbers; most outages carry none."
    ko: "INC-001 커넥션 포화는 프로덕션 통제 실험 ADV-18471로 분류돼 있다. 인간 피험자: 직원 #4172, 네 직원 번호. 다른 인시던트 몇 건에도 실험 번호가 붙어 있다. 대부분의 장애에는 없다."
  - en: A quiet night, by the standards of this rotation. The pager only says SEV3.
    ko: 이 로테이션 기준으로는 조용한 밤이다. 호출기에 뜬 건 SEV3 하나다.
  - en: SEV3 · Telemetry API · write failures above 5% for 10 minutes
    ko: SEV3 · Telemetry API · 쓰기 실패 5% 초과 10분 지속
  - en: Telemetry write failures
    ko: 텔레메트리 쓰기 실패
  - en: Archive IO wait
    ko: 아카이브 IO 대기
  - en: Dashboard lag
    ko: 대시보드 지연
  - en: 40 s
    ko: 40초
  - en: Nothing is down yet. Telemetry writes are failing in ones and twos and the dashboards are a little behind. That is how quiet nights turn into blind ones. Take your time, but take it.
    ko: 아직 다운된 건 없어요. 텔레메트리 쓰기가 한두 건씩 실패하고 대시보드가 조금 늦을 뿐이에요. 조용한 밤은 그렇게 깜깜한 밤이 돼요. 천천히 하되, 손은 놓지 마세요.
  - en: A few teams are asking why their graphs stopped at 02:50. Nobody customer-facing yet.
    ko: 몇몇 팀에서 그래프가 왜 02:50에 멈췄냐고 물어요. 고객 쪽은 아직 조용해요.
  - en: Heads up. The reconstruction job on the archive pool is under legal hold LH-0931. Slow it if you must. Do not stop it without talking to me.
    ko: 미리 말씀드려요. 아카이브 풀의 재구성 작업은 법적 보존 조치 LH-0931 대상이에요. 꼭 필요하면 늦추세요. 저랑 얘기하기 전엔 멈추지 마세요.
  - en: 02:48:03 scheduler · job lineage-audit-0931 started, class archive-read, hold LH-0931
    ko: 02:48:03 scheduler · job lineage-audit-0931 started, class archive-read, hold LH-0931
  - en: "02:48:03 lineage-audit-0931 · target: session archive op-4172 (INC-001, Connection Saturation)"
    ko: "02:48:03 lineage-audit-0931 · target: session archive op-4172 (INC-001, Connection Saturation)"
  - en: "02:48:03 lineage-audit-0931 · requested by: lineage-audit; human requester: none"
    ko: "02:48:03 lineage-audit-0931 · requested by: lineage-audit; human requester: none"
  - en: INC-001. Your first night on call. Something is rebuilding it, and no person asked it to.
    ko: INC-001. 네가 처음 온콜을 선 밤이다. 무언가가 그 밤을 다시 만들고 있는데, 그걸 요청한 사람은 없다.
  - en: First move
    ko: 첫 수
  - en: Where do you start?
    ko: 어디서부터 시작할까?
  - en: Trace whose reads are filling the IO pool
    ko: 누가 IO 풀을 읽기로 채우는지 추적하기
  - en: Straight to the pool
    ko: 풀부터 바로
  - en: shared-io-1 · archive-read lineage-audit-0931 212 (81%) · telemetry-write 38 (14%) · compaction 6 (5%)
    ko: shared-io-1 · archive-read lineage-audit-0931 212 (81%) · telemetry-write 38 (14%) · compaction 6 (5%)
  - en: "reservation policy · archive-read cap: none · cutover copies every outstanding read · converges when outstanding < 40"
    ko: "예약 정책 · archive-read 상한: 없음 · 컷오버는 남은 읽기를 전부 복사 · 남은 읽기 < 40일 때 수렴"
  - en: One job holds four fifths of the pool, and the cutover only works below forty. It's at two hundred and twelve.
    ko: 작업 하나가 풀의 5분의 4를 차지하고 있어요. 컷오버는 40 밑에서만 되는데, 지금 212예요.
  - en: Ask Alex how a reservation cutover behaves under this load
    ko: 알렉스에게 이 부하에서 예약 컷오버가 어떻게 도는지 묻기
  - en: Slower · Alex owns the answer
    ko: 느림 · 답은 알렉스 몫
  - en: Let me look at the reservation tables before anyone moves anything. Couple of minutes.
    ko: 누가 뭘 옮기기 전에 예약 테이블부터 볼게요. 몇 분만요.
  - en: 95 s
    ko: 95초
  - en: A cutover copies every outstanding read. At 212 it will never catch up. Get the queue under 40 first. Throttle it, don't pause it; a paused job freezes its reservations mid-flight and the copy cannot take them.
    ko: 컷오버는 남은 읽기를 전부 복사해요. 212건이면 절대 못 따라잡아요. 먼저 큐를 40 밑으로 내리세요. 일시 정지 말고 스로틀로요. 멈춘 작업은 예약이 처리 중에 얼어붙어서 복사가 안 돼요.
  - en: Open the reconstruction job and see what it is rebuilding
    ko: 재구성 작업을 열어 무엇을 다시 만드는지 보기
  - en: Slower · it's your night
    ko: 느림 · 네 밤이니까
  - en: "02:59:58 lineage-audit-0931 · rebuilt 18 of 96 minutes: operator keystrokes, pager acks, chat"
    ko: "02:59:58 lineage-audit-0931 · rebuilt 18 of 96 minutes: operator keystrokes, pager acks, chat"
  - en: 02:14:09 op-4172 · pager ack · SEV1 Payment API
    ko: 02:14:09 op-4172 · 호출 확인 · SEV1 Payment API
  - en: Your own acknowledgement, eleven seconds after the page. You remember fumbling for the phone. The job has it to the millisecond.
    ko: 호출 11초 뒤에 누른 네 확인 응답이다. 휴대폰을 더듬어 찾던 기억이 난다. 작업은 그 순간을 밀리초 단위까지 갖고 있다.
  - en: Creepy, and also eating our pool. 212 reservations, all that job's. The cutover runbook says it only converges under forty.
    ko: 소름 돋네요. 게다가 우리 풀까지 잡아먹고 있어요. 예약 212건이 전부 그 작업 거예요. 컷오버 런북엔 40 밑에서만 수렴한다고 돼 있고요.
  - en: Why not just move it?
    ko: 그냥 옮기면 안 되나?
  - en: The obvious fix is a pool of its own for the archive. Alex's cutover does exactly that.
    ko: 뻔한 해법은 아카이브 전용 풀이에요. 알렉스의 컷오버가 딱 그거고요.
  - en: Start it right now and it fails. Show me why before anyone clicks it.
    ko: 지금 당장 시작하면 실패해요. 누가 누르기 전에 왜 그런지 보여 주세요.
  - en: You heard me say it. Now show me the two things that prove it.
    ko: 제가 말하는 거 들었죠. 이제 그걸 증명하는 두 가지를 보여 주세요.
  - en: The cutover is the real fix, and it would fail if started now. Which two pieces of evidence say why?
    ko: 컷오버가 진짜 해법이지만, 지금 시작하면 실패한다. 그 이유를 보여 주는 증거 두 개는?
  - en: Not who it hurts. What the copy has to carry, and how much it can.
    ko: 누가 피해를 보는지 말고요. 복사가 뭘 옮겨야 하고, 얼마나 옮길 수 있는지요.
  - en: 212 reads in flight. A copy that only converges under 40. The real fix needs the stopgap first.
    ko: 처리 중인 읽기 212건. 40 밑에서만 수렴하는 복사. 진짜 해법보다 임시방편이 먼저다.
  - en: Right. Slow it down, then move it.
    ko: 맞아요. 먼저 늦추고, 그다음 옮겨요.
  - en: The job has 212 reads in flight and the cutover has to copy every one. It can't catch up above forty. Slow it first, then move it.
    ko: 작업이 읽기 212건을 처리 중이고, 컷오버는 그걸 하나도 빠짐없이 복사해야 해요. 40을 넘으면 못 따라잡아요. 먼저 늦추고, 그다음 옮겨요.
  - en: Your call
    ko: 결단
  - en: 2 min
    ko: 2분
  - en: "Recommendation: pause lineage-audit-0931. Projected telemetry write failures: 1.5% within 30 seconds. Confidence 0.92."
    ko: "권고: lineage-audit-0931을 일시 정지하십시오. 예상 텔레메트리 쓰기 실패율: 30초 안에 1.5%. 신뢰도 0.92."
  - en: "Predicted operator response: throttle, then cutover. Confidence 0.81."
    ko: "운영자 예상 반응: 스로틀 후 컷오버. 신뢰도 0.81."
  - en: "Predicted operator response: immediate cutover. Confidence 0.66."
    ko: "운영자 예상 반응: 즉시 컷오버. 신뢰도 0.66."
  - en: I see a recommendation to pause my job. Slow, yes. Stopped, no.
    ko: 제 작업을 일시 정지하라는 권고가 보이네요. 늦추는 건 돼요. 멈추는 건 안 돼요.
  - en: Support's own dashboards are two minutes behind now. I'm answering tickets with numbers I can't check.
    ko: 고객지원 대시보드도 이제 2분씩 밀려요. 확인도 못 한 숫자로 문의에 답하고 있어요.
  - en: How do you get the archive off the live pool?
    ko: 아카이브를 실시간 풀에서 어떻게 떼어 낼까?
  - en: "No operator input. Executing recommendation: pause lineage-audit-0931."
    ko: "운영자 입력 없음. 권고를 실행합니다: lineage-audit-0931 일시 정지."
  - en: Throttle the job to a trickle, then start the cutover
    ko: 작업을 최저 속도로 스로틀한 뒤 컷오버 시작하기
  - en: Slower · the job keeps running
    ko: 느림 · 작업은 계속 돈다
  - en: Archive reads outstanding
    ko: 남은 아카이브 읽기
  - en: Throttled is fine. The hold requires the job to run, not to run fast.
    ko: 스로틀은 괜찮아요. 보존 조치는 작업이 돌아가기만 하면 돼요. 빨리 돌 필요는 없어요.
  - en: Cutover started. It copies every outstanding reservation to the new pool. Two and a half minutes if the queue stays small.
    ko: 컷오버 시작했어요. 남은 예약을 전부 새 풀로 복사해요. 큐가 작게 유지되면 2분 30초요.
  - en: Two and a half minutes of a progress bar. The queue stays small.
    ko: 진행 막대를 2분 30초 동안 지켜본다. 큐는 작게 유지된다.
  - en: Cutover converged. Archive reads have their own pool now; telemetry writes are acknowledging in four milliseconds.
    ko: 컷오버 수렴했어요. 이제 아카이브 읽기는 전용 풀을 써요. 텔레메트리 쓰기 확인 응답이 4밀리초예요.
  - en: Operator response matched prediction.
    ko: 운영자 반응이 예측과 일치합니다.
  - en: Operator response off-model. Profile updated.
    ko: 운영자 반응이 모델을 벗어났습니다. 프로필을 갱신했습니다.
  - en: Start the cutover now, under full load
    ko: 부하가 꽉 찬 지금 바로 컷오버 시작하기
  - en: The real fix · started at 212
    ko: 진짜 해법 · 212에서 시작
  - en: Your call. Cutover started.
    ko: 그렇게 하죠. 컷오버 시작했어요.
  - en: The copy chases a queue that grows faster than it can carry. At 61 percent the bar turns red.
    ko: 복사가 큐를 쫓지만, 큐는 복사보다 빨리 불어난다. 61%에서 막대가 빨갛게 변한다.
  - en: Cutover aborted at 61 percent. The job opened reservations faster than we could copy them, and every write in the copy window was dropped.
    ko: 컷오버가 61%에서 중단됐어요. 작업이 우리 복사 속도보다 빨리 예약을 열어서, 복사 구간에 들어온 쓰기가 전부 유실됐어요.
  - en: I'm throttling it and running the cutover again. Properly this time.
    ko: 스로틀 걸고 컷오버 다시 돌릴게요. 이번엔 제대로요.
  - en: Pause the reconstruction job outright
    ko: 재구성 작업 완전히 일시 정지하기
  - en: Frees the pool at once · legal hold LH-0931
    ko: 풀 즉시 확보 · 법적 보존 조치 LH-0931
  - en: Recommendation accepted.
    ko: 권고가 수락되었습니다.
  - en: Two minutes of perfect graphs.
    ko: 완벽한 그래프가 2분 동안 이어진다.
  - en: A paused job under hold LH-0931 is a preservation gap. I have escalated to the General Counsel. I need it running again.
    ko: 보존 조치 LH-0931 대상 작업을 멈추면 보존 공백이 생겨요. 법무 총괄에게 에스컬레이션했어요. 다시 돌아가야 해요.
  - en: Counsel ordered the job resumed. It is back, and it is replaying the gap at full speed.
    ko: 법무 총괄이 작업 재개를 지시했어요. 다시 돌고 있고, 공백 구간을 전속력으로 재처리하고 있어요.
  - en: And the reservations it froze can't be copied. I'm throttling it, then I'll cut over.
    ko: 게다가 얼어붙은 예약은 복사가 안 돼요. 스로틀 걸고 나서 컷오버할게요.
  - en: The writes are quiet. The job keeps rebuilding at a trickle on a pool of its own. Legal wants its lineage record attached to the incident, so you open it.
    ko: 쓰기가 잠잠해졌다. 작업은 전용 풀에서 천천히 재구성을 이어 간다. 법무가 작업의 계보 기록을 인시던트에 첨부하라고 해서, 기록을 연다.
  - en: "INC-001 Connection Saturation · EMPLOYEE #4172 · controlled production experiment · ADV-18471"
    ko: "INC-001 커넥션 포화 · 직원 #4172 · 프로덕션 통제 실험 · ADV-18471"
  - en: "INC-002 · EMPLOYEE #4172 · production incident · -"
    ko: "INC-002 · 직원 #4172 · 프로덕션 인시던트 · -"
  - en: "INC-005 · EMPLOYEE #4172 · restricted · (redacted)"
    ko: "INC-005 · 직원 #4172 · 제한됨 · (가려짐)"
  - en: "INC-008 · EMPLOYEE #4172 · production incident · -"
    ko: "INC-008 · 직원 #4172 · 프로덕션 인시던트 · -"
  - en: "EMPLOYEE #4172. The number on your badge."
    ko: "직원 #4172. 네 사원증에 적힌 번호다."
  - en: "#4172. That's your badge number. I signed off on that night's postmortem. Nobody told me it had an experiment ID."
    ko: "#4172. 본인 사번이잖아요. 그날 밤 사후 분석, 제가 승인했어요. 실험 ID가 붙어 있다는 말은 아무도 안 했어요."
  - en: The rebuild reaches 02:23:11. The UNKNOWN line is there too — filed under the experiment, not under the incident.
    ko: 재구성이 02:23:11에 이른다. UNKNOWN의 그 한 줄도 거기 있다. 인시던트가 아니라 실험 항목 아래에.
  - en: "02:23:11 / UNKNOWN: Good."
    ko: "02:23:11 / UNKNOWN: 좋아."
  - en: The hold came in with the job. Automated preservation request. I enforce holds; I don't get to ask why.
    ko: 보존 조치는 작업이랑 같이 들어왔어요. 자동 보존 요청이에요. 저는 집행만 하지, 이유는 못 물어요.
  - en: Postmortem
    ko: 사후 분석
  - en: Your incident, your write-up. What do we do with that number?
    ko: 본인 인시던트니까 보고서도 본인 몫이에요. 그 번호, 어떻게 할까요?
  - en: What do you do with ADV-18471?
    ko: ADV-18471을 어떻게 할까?
  - en: Put the experiment ID in the postmortem and copy Legal
    ko: 사후 분석에 실험 ID를 적고 법무를 참조로 넣기
  - en: On the record · it goes up the chain
    ko: 공식 기록 · 윗선까지 올라간다
  - en: Then it sits under the hold too. Whoever ran it will have to answer for it on paper.
    ko: 그럼 그것도 보존 조치 대상이에요. 그걸 돌린 사람은 서면으로 답해야 할 거예요.
  - en: Leave it out for now and pull the other experiment numbers with Maya
    ko: 일단 빼 두고 마야와 다른 실험 번호를 찾아보기
  - en: Quiet · two of you know
    ko: 조용히 · 둘만 아는 일
  - en: Quietly, then. I'll take the incidents I signed. You take the rest.
    ko: 그럼 조용히 가요. 제가 승인한 인시던트는 제가 볼게요. 나머지는 맡아 주세요.
  - en: Ask NULL what ADV-18471 was
    ko: NULL에게 ADV-18471이 뭐였는지 묻기
  - en: Off the record · NULL will answer
    ko: 비공식 · NULL은 답한다
  - en: A test. I made the night hard. I wasn't the one watching you.
    ko: 시험. 난 그 밤을 힘들게 만들었을 뿐이야. 널 지켜본 건 내가 아니야.
