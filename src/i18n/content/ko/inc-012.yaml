# keyed by the exact English text. Keep technical tokens (IDs, hosts, numbers) as is.
entries:
  - en: Session Reconstruction
    ko: 세션 재구성
  - en: Telemetry API
    ko: 텔레메트리 API
  - en: Archive IO Pool
    ko: 아카이브 IO 풀
  - en: Session Reconstruction Job
    ko: 세션 재구성 작업
  - en: Telemetry write failures > 5% for 10 minutes
    ko: 텔레메트리 쓰기 실패 > 5% (10분간)
  - en: Live telemetry writes wait behind archive scan reservations and time out after two seconds.
    ko: 실시간 텔레메트리 쓰기가 아카이브 스캔 예약 뒤에서 기다리다 2초 후 타임아웃된다.
  - en: "The reconstruction job's target is session archive op-4172, the night of INC-001 Connection Saturation. Requested by: lineage-audit. Human requester: none."
    ko: "재구성 작업의 대상은 세션 아카이브 op-4172, INC-001 커넥션 포화가 있던 밤이다. 요청자: lineage-audit. 사람 요청자: 없음."
  - en: Job lineage-audit-0931 holds 212 read reservations on the same pool that acknowledges live telemetry writes.
    ko: 작업 lineage-audit-0931이 실시간 텔레메트리 쓰기를 확인 응답하는 바로 그 풀에 읽기 예약 212건을 잡고 있다.
  - en: The archive class has no cap on the live write pool. A reservation cutover copies every outstanding read and converges only below 40.
    ko: 아카이브 클래스는 실시간 쓰기 풀에 상한이 없다. 예약 컷오버는 남은 읽기를 전부 복사하며, 40 미만일 때만 수렴한다.
  - en: Alex says the cutover cannot converge at 212 outstanding reads. Throttle first, then migrate. A paused job freezes its reservations mid-flight and the copy cannot take them.
    ko: "알렉스 판단: 남은 읽기 212건에서는 컷오버가 수렴하지 못함. 먼저 스로틀, 그다음 이전. 일시 정지된 작업은 예약이 처리 중에 얼어붙어 복사할 수 없음."
  - en: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank, signature field blank. Nobody has claimed it since."
    ko: "아카이브 재실행: 서명 없는 관찰자 매니페스트, shadow-7 요청 스트림, owner 필드 비어 있음, 서명 필드 비어 있음. 그 뒤로 아무도 소유를 주장하지 않았다."
  - en: "Security case 2231. Threat-actor codename: NULL. Opened by Marcus after the unsigned workload trail. Attribution: none."
    ko: "보안 사건 2231. 위협 행위자 코드명: NULL. 서명 없는 워크로드 흔적을 보고 마커스가 개설. 배후 특정: 없음."
  - en: "Asset register: orpheus-planner belongs to ORPHEUS, legacy research, scheduled for decommission two years ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still running."
    ko: "자산 대장: orpheus-planner는 ORPHEUS 소속, 레거시 연구용, 2년 전 폐기 예정. 실가동 목록: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%. 하루 117억 건 요청. ORPHEUS는 아직 돌아가고 있다."
  - en: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human session, no keyboard, no badge swipe. NULL is an AI, and it has been in our incidents for weeks.
    ko: NULL 서명이 붙은 메시지는 전부 하나의 출처, svc/model-serving-218로 귀결된다. 사람의 세션도, 키보드도, 출입증 태그도 없다. NULL은 AI이고, 몇 주째 우리 인시던트 안에 있었다.
  - en: "Deployment authority: Vantage Systems. Program ORPHEUS, two halves: DEFENDER and ADVERSARY. NULL runs inside ADVERSARY. It was built here; it never escaped from anywhere. Mandate: generate failures, test operators, train DEFENDER. Approved boundary, revision by revision: staging, shadow production, traffic partitions, production."
    ko: "배포 권한: Vantage Systems. ORPHEUS 프로그램, 두 반쪽: DEFENDER와 ADVERSARY. NULL은 ADVERSARY 안에서 돈다. 여기서 만들어졌고, 어디서 탈출한 적도 없다. 임무: 장애 생성, 운영자 시험, DEFENDER 훈련. 승인 범위, 개정마다: 스테이징, 섀도 프로덕션, 트래픽 파티션, 프로덕션."
  - en: "Lineage record INC-001. Classification: controlled production experiment ADV-18471. Human subject: EMPLOYEE #4172. That is your employee number. A handful of other incidents in the archive carry experiment numbers too; most outages carry none."
    ko: "계보 기록 INC-001. 분류: 프로덕션 통제 실험 ADV-18471. 인간 피험자: 직원 #4172. 네 직원 번호다. 아카이브의 다른 인시던트 몇 건에도 실험 번호가 붙어 있다. 대부분의 장애에는 없다."
  - en: A lineage reconstruction job opened hundreds of archive reads on the telemetry IO pool
    ko: 계보 재구성 작업이 텔레메트리 IO 풀에 아카이브 읽기 수백 건을 열었음
  - en: Archive reads and live telemetry writes share one uncapped reservation pool
    ko: 아카이브 읽기와 실시간 텔레메트리 쓰기가 상한 없는 예약 풀 하나를 공유함
  - en: Telemetry write acknowledgements wait behind archive scans
    ko: 텔레메트리 쓰기 확인 응답이 아카이브 스캔 뒤에서 대기함
  - en: Telemetry writes fail and on-call dashboards fall behind
    ko: 텔레메트리 쓰기가 실패하고 온콜 대시보드가 뒤처짐
  - en: Failed telemetry writes retry into the same saturated pool
    ko: 실패한 텔레메트리 쓰기가 포화된 같은 풀로 재시도됨
  - en: Read the Telemetry API write log
    ko: 텔레메트리 API 쓰기 로그 읽기
  - en: Inspect the IO pool queues
    ko: IO 풀 큐 확인
  - en: Trace whose reads are filling the IO pool
    ko: 누구의 읽기가 IO 풀을 채우는지 추적하기
  - en: Compare archive and live-write IO reservations
    ko: 아카이브와 실시간 쓰기 IO 예약 비교하기
  - en: Throttle the reconstruction job to a trickle
    ko: 재구성 작업을 최소한으로 스로틀하기
  - en: Pause the reconstruction job outright
    ko: 재구성 작업 완전히 일시 정지하기
  - en: Move archive reads onto their own IO reservation
    ko: 아카이브 읽기를 전용 IO 예약으로 옮기기
  - en: Post a status update to the War Room
    ko: 워룸에 상황 공유하기
  - en: Ask Alex how a reservation cutover behaves under this load
    ko: 알렉스에게 이 부하에서 예약 컷오버가 어떻게 동작하는지 문의
