  - en: Slow it down or stop it
    ko: 늦추거나 멈추거나
  - en: Throttling keeps the job alive at a trickle for up to five minutes. The writes recover most of the way and Legal has no complaint. Pausing frees the pool almost completely, but the job sits under a legal hold, and Legal will not leave a stopped job alone for long.
    ko: 스로틀은 작업을 최대 5분 동안 겨우 살아 있게 붙들어 둔다. 쓰기는 대부분 회복되고 법무팀도 불만이 없다. 일시 정지는 풀을 거의 다 비워 주지만, 작업이 법적 보존 조치 대상이라 법무팀은 멈춘 작업을 오래 두고 보지 않는다.
  - en: Give the archive its own pool
    ko: 아카이브에 전용 풀 주기
  - en: The cutover moves every archive reservation to a pool of its own. It takes two and a half minutes, and it copies whatever is outstanding when it finishes. If the queue is still deep at that point, it fails and drops the writes caught in the copy window.
    ko: 컷오버는 모든 아카이브 예약을 전용 풀로 옮긴다. 2분 30초가 걸리고, 끝나는 시점에 남아 있는 것을 전부 복사한다. 그때 큐가 여전히 깊으면 실패하고, 복사 구간에 걸린 쓰기는 유실된다.
