  - en: "Subject #4172"
    ko: null
  - en: The job is rebuilding your first night on call, keystroke by keystroke. Its lineage record gives that night a second name. Connection Saturation was experiment ADV-18471, and the human subject is listed by employee number. The number is yours.
    ko: null
