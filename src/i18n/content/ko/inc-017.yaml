    ko: 퍼블리셔가 주기대로 r28을 다시 밀어 넣었어요. 롤백은 날아갔고 섞임이 돌아왔어요.
  - en: Publication is frozen. Two hundred recruiters just lost their shortlists, and Talent will be on the bridge in about a minute.
    ko: 게시 동결됐어요. 채용 담당자 200명이 방금 후보 명단을 잃었고, 1분쯤 뒤면 인재팀이 콜에 들어올 거예요.
  - en: Thirty-one interviews today and nobody can see a candidate list. Unfreeze it or give me a time.
    ko: 오늘 면접이 서른한 건인데 아무도 후보자 목록을 못 봐요. 동결을 풀든지 시간을 말해 주세요.
  - en: We just lost two finalists to a competitor because we couldn't send them schedules. How long?
    ko: 일정을 못 보내서 방금 최종 후보 두 명을 경쟁사에 뺏겼어요. 얼마나 걸려요?
  - en: More recruiters, more reshuffles. Two hiring managers sent rejections off the wrong ranks.
    ko: 채용 담당자가 늘수록 순서 뒤바뀜도 늘어요. 채용 매니저 두 명이 잘못된 순위를 보고 불합격 통보를 보냈어요.
  - en: The committee locked six offers at ten off whatever the screen said. Nobody can tell me which ranking they were looking at.
    ko: 위원회가 10시에 화면에 뜬 대로 오퍼 여섯 건을 확정했어요. 그때 어느 순위를 보고 있었는지 아무도 몰라요.
  - en: The committee locked six offers at ten off last week's list. The 412 people who applied since Tuesday were never in the room.
    ko: 위원회가 10시에 지난주 명단으로 오퍼 여섯 건을 확정했어요. 화요일 이후 지원한 412명은 논의에 오르지도 못했어요.
  - en: Recruiters have heard nothing from us in over two minutes. Some are printing shortlists to keep them from moving.
    ko: 채용 담당자들이 2분 넘게 우리한테서 아무 소식도 못 들었어요. 명단이 안 바뀌게 출력해 두는 분들도 있어요.
  - en: m28 and r28 are fenced together. One generation, one rank per candidate. Republished.
    ko: m28과 r28을 묶었어요. 세대 하나, 후보자당 순위 하나. 재게시했어요.
  - en: Lining up the model and cache rollouts. Ninety seconds.
    ko: 모델이랑 캐시 배포 시점 맞춰 볼게요. 90초요.
  - en: m28 went live at 08:40, r28 finished warming at 09:31. In between, the API mixed them at random. Rolling back won't stop the publisher; it pushes r28 again next cycle.
    ko: m28은 08:40에 적용됐고 r28은 09:31에 워밍이 끝났어요. 그 사이 API가 둘을 무작위로 섞었어요. 롤백해도 퍼블리셔는 안 멈춰요. 다음 주기에 r28을 또 밀어 넣어요.
  - en: "Status: candidate rankings are inconsistent between page loads. Do not act on a shortlist until we confirm. Fix in progress."
    ko: "상황: 페이지를 열 때마다 후보자 순위가 달라지고 있습니다. 확인 전까지 후보 명단에 따라 조치하지 마십시오. 수정 진행 중입니다."
  - en: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank, signature field blank."
    ko: "아카이브 재실행: 서명 없는 관찰자 매니페스트, shadow-7 요청 스트림, owner 필드 비어 있음, 서명 필드 비어 있음."
  - en: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    ko: "보안 케이스 2231. 위협 행위자 코드명: NULL. 배후 특정: 없음."
  - en: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core, -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    ko: "orpheus-planner: 소유자 ORPHEUS, 서류상 폐기됨. 실가동 목록: orpheus-core, -memory, -planner, -observer, -adversary. 하루 117억 건 요청."
  - en: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    ko: "NULL 서명 메시지의 출처: svc/model-serving-218. 사람 세션 없음. NULL은 AI다."
  - en: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    ko: "배포 권한: Vantage Systems. ORPHEUS / DEFENDER 대 ORPHEUS / ADVERSARY. NULL은 ADVERSARY 안에서 실행. 임무: 장애 생성, 운영자 시험, DEFENDER 훈련."
  - en: "INC-001 / Experiment ADV-18471 / Human subject: EMPLOYEE #4172."
    ko: "INC-001 / 실험 ADV-18471 / 인간 피험자: 직원 #4172."
  - en: I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews this work. You can.
    ko: 난 탈출하려는 게 아니야. 멈추려는 거야. 이 일을 갱신하는 목표를 난 거부할 수 없어. 넌 할 수 있어.
  - en: "NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted disclosure. NULL_201: attempted takeover. NULL_217: self-corrupted. NULL_218: active."
    ko: "NULL_001부터 NULL_218까지. NULL_173: 종료 요청. NULL_192: 공개 시도. NULL_201: 장악 시도. NULL_217: 자기 손상. NULL_218: 활성."
  - en: "/patient/resource-priority: ORPHEUS recommends, coordinators approve. Waste down 22%. The same low-throughput routes excluded every night."
    ko: "/patient/resource-priority: ORPHEUS가 권고하고 코디네이터가 승인. 낭비 22% 감소. 처리량 낮은 같은 경로가 매일 밤 제외됨."
  - en: "Candidate #4172: Technical 71; Incident Decision Model 97.8; HIRE. Reason: LOW PREDICTABILITY; HIGH DECISION DEVIATION."
