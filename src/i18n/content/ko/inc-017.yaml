  - en: r27 is serving and the ranks have stopped moving. Also, every applicant since Tuesday has vanished from them. That is 412 people.
    ko: r27이 서빙 중이고 순위 변동은 멈췄어요. 그런데 화요일 이후 지원자가 전부 순위에서 사라졌어요. 412명이요.
