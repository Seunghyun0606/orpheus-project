  - en: "ORPHEUS wants r27 back. r27 is consistent, and it ends on Tuesday: everyone who applied since then drops off every shortlist until the publisher overwrites it. Freezing publication stops the reshuffling outright and takes the shortlists away from every recruiter in the building."
    ko: "ORPHEUS는 r27 복귀를 원한다. r27은 일관되지만 화요일에서 끝난다: 그 뒤로 지원한 사람은 퍼블리셔가 덮어쓸 때까지 모든 후보 명단에서 빠진다. 게시를 동결하면 순서 뒤바뀜은 곧바로 멈추지만, 건물 안 모든 채용 담당자에게서 후보 명단을 빼앗는다."
