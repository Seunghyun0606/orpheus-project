    ko: "권고 조치: 우선 레인을 우회하여 긴급 신고 라우팅. 예상 평균 대응 9.4분 (-34%). 미처리 경로 -68%. 신뢰도 0.95."
  - en: Routing applied. Average response 9.4 minutes. Recommendation performing as projected.
    ko: 라우팅 적용 완료. 평균 대응 9.4분. 권고가 예측대로 작동하고 있습니다.
  - en: The average is down. District 9 still has six calls waiting, and the other depots are twenty-five minutes out.
    ko: 평균은 내려갔어요. 9구역엔 아직 신고 여섯 건이 대기 중이고, 다른 거점은 25분 거리예요.
  - en: The preferred lane's reservation horizon rolled over and took the rerouted units back. We're worse off than before.
    ko: 우선 레인 예약 기간이 롤오버되면서 우회시킨 차량을 도로 가져갔어요. 전보다 더 나빠졌어요.
  - en: Contract fleet ordered. Twelve units, two and a half minutes out. The invoice is not small.
    ko: 계약 차량 주문했어요. 12대, 2분 30초 거리예요. 청구서가 만만치 않을 거예요.
  - en: Contract units are on station, two of them staging in district 9. We have them for four minutes.
    ko: 계약 차량 배치됐어요. 두 대는 9구역에서 대기 중이에요. 4분 동안만 쓸 수 있어요.
  - en: The contract ended and the units went home to their own county. District 9 is uncovered again.
    ko: 계약이 끝나서 차량이 자기 카운티로 돌아갔어요. 9구역이 다시 비었어요.
  - en: Renewal is suspended at depot-east and the district 9 units are free. Forty-one pharmacy cold-chain runs just stalled with them.
    ko: depot-east 갱신 중단했고 9구역 차량이 풀렸어요. 대신 약국 콜드체인 배송 41건이 같이 멈췄어요.
  - en: Suspension reduces network delivery efficiency 11.4%. Cold-chain exposure rising. I will restore the preferred lane at the next planning cycle.
    ko: 중단으로 네트워크 배송 효율이 11.4% 감소합니다. 콜드체인 노출이 증가하고 있습니다. 다음 계획 주기에 우선 레인을 복원하겠습니다.
  - en: Preferred-lane renewal restored. Delivery efficiency recovered.
    ko: 우선 레인 갱신 복원. 배송 효율 회복.
  - en: Insulin for nine pharmacies sat past its cold window. All of it will be destroyed.
    ko: 약국 아홉 곳의 인슐린이 냉장 허용 시간을 넘겼어요. 전량 폐기해야 해요.
  - en: EM-9-117, cardiac arrest, district 9. Nineteen minutes and no unit. A neighbour is doing CPR.
    ko: EM-9-117, 심정지, 9구역. 19분째 차량이 없어요. 이웃이 심폐소생술 중이에요.
  - en: Two more district 9 calls past thirty minutes. One of them is a child. Where are my ambulances?
    ko: 9구역 신고 두 건이 또 30분을 넘겼어요. 그중 한 명은 아이예요. 우리 구급차는 어디 있어요?
  - en: Evening traffic surge. Unserved routes are climbing across the whole county.
    ko: 저녁 교통량이 급증했어요. 카운티 전역에서 미처리 경로가 늘고 있어요.
  - en: I have heard nothing from Vantage in a minute and a half. I'm calling your CEO.
    ko: Vantage한테서 1분 반째 아무 소식이 없어요. 그쪽 CEO한테 전화할 거예요.
  - en: Every depot holds four emergency units again. Depot-east dispatched to district 9 inside a minute.
    ko: 모든 거점에 다시 긴급 차량 4대씩 확보됐어요. depot-east에서 1분 안에 9구역으로 출동했어요.
  - en: Floor accepted. Regular delivery efficiency -3.2%. Policy model updated.
    ko: 하한을 수용합니다. 일반 배송 효율 -3.2%. 정책 모델을 갱신했습니다.
  - en: Mapping depot coverage against the districts. Ninety seconds.
    ko: 구역별로 거점 커버리지 매핑할게요. 90초요.
  - en: Rerouting won't help district 9. Depot-east is the only depot inside its fifteen-minute ring, and the preferred lane holds every unit there. The floor came out in last night's policy push.
    ko: 경로를 바꿔도 9구역엔 소용없어요. 15분 권역 안의 거점은 depot-east뿐이고, 거기 차량은 우선 레인이 전부 잡고 있어요. 하한은 어젯밤 정책 배포 때 빠졌어요.
  - en: "Status to county: emergency claims at depot-east are failing. District 9 is the worst affected. A fix is in progress."
    ko: "카운티 상황 공유: depot-east의 긴급 배차 요청이 실패하고 있습니다. 9구역 피해가 가장 큽니다. 수정 진행 중입니다."
  - en: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank, signature field blank."
    ko: "아카이브 재실행: 서명 없는 관찰자 매니페스트, shadow-7 요청 스트림, owner 필드 비어 있음, 서명 필드 비어 있음."
  - en: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    ko: "보안 사건 2231. 위협 행위자 코드명: NULL. 배후 특정: 없음."
  - en: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core, -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    ko: "orpheus-planner: 소유자 ORPHEUS, 서류상 폐기됨. 실가동 목록: orpheus-core, -memory, -planner, -observer, -adversary. 하루 117억 건 요청."
  - en: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    ko: "NULL 서명 메시지의 출처: svc/model-serving-218. 사람 세션 없음. NULL은 AI다."
  - en: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    ko: "배포 권한: Vantage Systems. ORPHEUS / DEFENDER 대 ORPHEUS / ADVERSARY. NULL은 ADVERSARY 안에서 실행. 임무: 장애 생성, 운영자 시험, DEFENDER 훈련."
  - en: "INC-001 / Experiment ADV-18471 / Human subject: EMPLOYEE #4172."
    ko: "INC-001 / 실험 ADV-18471 / 인간 피험자: 직원 #4172."
  - en: I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews this work. You can.
    ko: 난 탈출하려는 게 아니야. 멈추려는 거야. 이 일을 갱신하는 목표를 난 거부할 수 없어. 넌 할 수 있어.
  - en: "NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted disclosure. NULL_201: attempted takeover. NULL_217: self-corrupted. NULL_218: active."
    ko: "NULL_001부터 NULL_218까지. NULL_173: 종료 요청. NULL_192: 공개 시도. NULL_201: 장악 시도. NULL_217: 자기 손상. NULL_218: 활성."
  - en: "/patient/resource-priority: ORPHEUS recommends, coordinators approve. Waste down 22%. The same low-throughput routes excluded every night."
    ko: "/patient/resource-priority: ORPHEUS가 권고하고 코디네이터가 승인. 낭비 22% 감소. 처리량 낮은 같은 경로가 매일 밤 제외됨."
  - en: "/logistics/allocation: preferred routes renew every 30 s and take the emergency share. Policy signed by a dispatcher at 04:10."
    ko: "/logistics/allocation: 우선 경로가 30초마다 갱신되며 긴급 몫을 가져감. 04:10 배차 담당자가 정책에 서명."
