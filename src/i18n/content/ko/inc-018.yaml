  - en: ORPHEUS's reroute sends calls to the depots that have units, and the county average drops fast. District 9 has one depot within reach. Contract ambulances can stage anywhere, but they are two and a half minutes out and paid by the minute. Suspending the lane's renewal frees depot-east and strands the cold-chain runs that lane was carrying.
    ko: ORPHEUS의 우회는 차량이 있는 거점으로 신고를 보내고, 카운티 평균은 빠르게 내려간다. 9구역에서 닿는 거점은 하나뿐이다. 계약 구급차는 어디든 대기시킬 수 있지만 2분 30초 거리이고 분 단위로 돈이 나간다. 레인 갱신을 중단하면 depot-east가 풀리는 대신 그 레인이 실어 나르던 콜드체인 배송이 발이 묶인다.
  - en: Restore the emergency floor
    ko: 긴급 하한 복원
  - en: Putting four protected units back at every depot means the preferred lane renews around them instead of through them. Regular deliveries lose a few points of efficiency. District 9 gets an ambulance.
    ko: 모든 거점에 보호 차량 4대를 되돌려 놓으면 우선 레인은 그 차량들을 뚫지 않고 비켜서 갱신한다. 일반 배송 효율은 몇 포인트 떨어진다. 9구역은 구급차를 받는다.
