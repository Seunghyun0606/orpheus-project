  - en: The defender fleet has been auto-healing settle-03 all night, and tonight it is hurting more than it heals. Find out who keeps pulling the lever.
    ko: 방어 플릿이 밤새 settle-03을 자동 복구하고 있는데, 오늘은 고치는 것보다 망가뜨리는 게 더 많아요. 누가 자꾸 레버를 당기는지 찾아 주세요.
  - en: Merchants are reporting payments that vanish mid-flight. Not slow. Gone.
    ko: 가맹점들이 결제가 처리 도중 사라진다고 해요. 느린 게 아니에요. 그냥 없어져요.
  - en: "Recommended action: restart dependency-controller. Predicted recovery in 4 minutes. Confidence 0.91."
    ko: "권고 조치: dependency-controller 재시작. 예상 복구 시간 4분. 신뢰도 0.91."
  - en: Pulling the controller lease history now. Give me ninety seconds.
    ko: 지금 컨트롤러 리스 이력 뽑고 있어요. 90초만 주세요.
  - en: Lease says controller-a owns settle-03. Controller-b lost its lease 41 minutes ago and never stopped writing. If you suspend toggles you silence both of them, including the one that is right.
    ko: 리스상 settle-03 소유자는 controller-a예요. controller-b는 41분 전에 리스를 잃고도 쓰기를 멈춘 적이 없어요. 토글을 중단하면 맞는 쪽까지 둘 다 멈춰요.
  - en: Second wave. Checkout retries are landing on the same replica and doubling the drop rate.
    ko: 2차로 터졌어요. 체크아웃 재시도가 같은 복제본으로 몰려서 유실률이 두 배가 됐어요.
  - en: A third of payments are failing. Leadership just joined the bridge.
    ko: 결제 3분의 1이 실패하고 있어요. 방금 경영진이 브리지 콜에 들어왔어요.
  - en: Merchants have heard nothing from us in over two minutes. They are asking if we are down.
    ko: 가맹점들이 2분 넘게 우리 쪽 소식을 못 들었어요. 서비스가 다운된 거냐고 묻고 있어요.
  - en: The restart dropped controller-a's lease and controller-b grabbed it with the stale fence. Toggles just doubled.
    ko: 재시작하면서 controller-a의 리스가 풀렸고, controller-b가 낡은 펜스로 그걸 가져갔어요. 토글이 방금 두 배가 됐어요.
  - en: With every toggle suspended, nothing is healing settle-05. It just went down for real.
    ko: 토글을 전부 멈추니까 settle-05를 고쳐 줄 게 없어요. 방금 진짜로 죽었어요.
  - en: The suspension window closed and the detach storm came straight back.
    ko: 중단 시간이 끝나자마자 연결 해제 폭풍이 그대로 돌아왔어요.
  - en: Controller-b refreshed its cached lease. The pin is leaking; it will not hold on its own.
    ko: controller-b가 캐시된 리스를 갱신했어요. 고정이 새고 있어요. 이대로는 못 버텨요.
  - en: Store is fenced at 41. Controller-b's writes are bouncing. settle-03 has stopped flapping.
    ko: 스토어에 41로 펜스 쳤어요. controller-b 쓰기는 튕겨 나가고 있어요. settle-03 플래핑 멈췄어요.
  - en: "Status posted: two remediation controllers are fighting over a payment replica. Drops are real; a fix is in progress."
    ko: "상황 공유 완료: 복구 컨트롤러 두 개가 결제 복제본 하나를 두고 충돌 중. 결제 유실은 실제로 발생 중이며 수정 진행 중."
  - en: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank, signature field blank."
