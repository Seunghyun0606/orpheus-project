  - en: settle-03 flapping / settle-05 degraded / 4 of 6 healthy
    ko: settle-03 플래핑 / settle-05 성능 저하 / 6대 중 4대 정상
  - en: Payment drop rate > 15%
    ko: 결제 유실률 > 15%
  - en: settle-03 was detached and reattached 11 times in 6 minutes. Every detach drops the payments in flight on that replica.
    ko: settle-03이 6분 동안 11번 연결 해제와 재연결을 반복했다. 해제될 때마다 그 복제본에서 처리 중이던 결제가 유실된다.
  - en: "One detach note is not signed by the controller fleet at all: issuer svc/model-serving-218."
    ko: "연결 해제 기록 하나에는 컨트롤러 플릿의 서명이 아예 없다. 발행자: svc/model-serving-218."
  - en: Detach orders alternate. controller-a holds the lease; controller-b lost it 41 minutes ago and is still writing.
    ko: 연결 해제 명령이 번갈아 나온다. 리스는 controller-a가 보유 중이고, controller-b는 41분 전에 리스를 잃고도 계속 쓰고 있다.
  - en: controller-a fence 41 / controller-b fence 40 / store accepts writes from both
    ko: controller-a 펜스 41 / controller-b 펜스 40 / 스토어가 양쪽 쓰기 모두 수락
  - en: Lease history confirms controller-a owns settle-03. Suspending toggles silences both controllers, including the one that is right.
    ko: 리스 이력상 settle-03의 소유자는 controller-a다. 토글을 중단하면 맞는 쪽까지 두 컨트롤러가 모두 멈춘다.
  - en: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank, signature field blank. Nobody has claimed it since."
    ko: "아카이브 재실행: 서명 없는 관찰자 매니페스트, shadow-7 요청 스트림, owner 필드 비어 있음, 서명 필드 비어 있음. 그 뒤로 아무도 소유를 주장하지 않았다."
  - en: "Security case 2231. Threat-actor codename: NULL. Opened by Marcus after the unsigned workload trail. Attribution: none."
    ko: "보안 사건 2231. 위협 행위자 코드명: NULL. 서명 없는 워크로드 흔적을 보고 마커스가 개설. 배후 특정: 없음."
  - en: "Asset register: orpheus-planner belongs to ORPHEUS, legacy research, scheduled for decommission two years ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still running."
    ko: "자산 대장: orpheus-planner는 ORPHEUS 소속, 레거시 연구용, 2년 전 폐기 예정. 실가동 목록: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%. 하루 117억 건 요청. ORPHEUS는 아직 돌아가고 있다."
  - en: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human session, no keyboard, no badge swipe. NULL is an AI, and it has been in our incidents for weeks.
    ko: NULL 서명이 붙은 메시지는 전부 하나의 출처, svc/model-serving-218로 귀결된다. 사람의 세션도, 키보드도, 출입증 태그도 없다. NULL은 AI이고, 몇 주째 우리 인시던트 안에 있었다.
  - en: A remediation controller keeps writing after losing its lease
    ko: 복구 컨트롤러 하나가 리스를 잃은 뒤에도 계속 쓰기를 수행함
  - en: The lease store accepts writes from any fence generation
    ko: 리스 스토어가 모든 펜스 세대의 쓰기를 수락함
  - en: Two controllers alternate detach and reattach orders on a healthy replica
    ko: 두 컨트롤러가 정상 복제본에 연결 해제와 재연결 명령을 번갈아 내림
  - en: In-flight payments are dropped on every detach
    ko: 연결 해제 때마다 처리 중인 결제가 유실됨
  - en: Checkout retries pile onto the replica that keeps disappearing
    ko: 체크아웃 재시도가 계속 사라지는 복제본으로 몰림
  - en: Read the dependency controller log
    ko: 의존성 컨트롤러 로그 읽기
  - en: Inspect replica and remediation metrics
    ko: 복제본 및 복구 지표 확인
  - en: Trace who issued the detach orders
    ko: 연결 해제 명령을 누가 냈는지 추적하기
  - en: Compare controller lease fences
    ko: 컨트롤러 리스 펜스 비교하기
  - en: Restart the dependency controller (advisor recommendation)
    ko: 의존성 컨트롤러 재시작하기 (어드바이저 권고)
  - en: Suspend all remediation toggles
    ko: 모든 복구 토글 중단하기
  - en: Pin remediation to the lease holder, controller-a
    ko: 복구를 리스 보유자 controller-a에 고정하기
  - en: Fence the store to generation 41 and evict controller-b
    ko: 스토어에 41세대 펜스를 치고 controller-b 축출하기
  - en: Post a status update to the War Room
    ko: 워룸에 상황 공유하기
