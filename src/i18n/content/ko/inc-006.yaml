  - en: Keep people signing in
    ko: 로그인 계속 받기
  - en: The old ca-17 pool can take new sign-ins for a few minutes. It was sized for a quarter of our traffic, and the partner banks share it. A restart makes every verifier load whatever bundle is on its disk, which helps exactly as many verifiers as have the new one.
    ko: 기존 ca-17 풀은 몇 분 동안 새 로그인을 받을 수 있다. 우리 트래픽의 4분의 1에 맞춰 잡은 크기이고, 제휴 은행들이 같이 쓴다. 재시작하면 모든 검증기가 디스크에 있는 번들을 로드한다. 새 번들을 가진 검증기 수만큼만 효과가 있다.
  - en: Fix the trust gap
    ko: 신뢰 공백 메우기
  - en: Withdrawing ca-18 fixes sign-ins in a minute and signs out the 31,240 customers it has already signed, all at once. Finishing the stalled bundle copy takes two and a half minutes, needs to know which verifiers are missing it, and logs out nobody.
    ko: ca-18을 철회하면 1분 안에 로그인이 복구되지만, 이미 서명된 고객 31,240명이 한꺼번에 로그아웃된다. 멈춘 번들 복사를 마치는 데는 2분 30초가 걸리고 어느 검증기에 번들이 없는지 알아야 하지만, 아무도 로그아웃되지 않는다.
