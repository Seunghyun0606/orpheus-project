  - en: Identity is rejecting every new sign-in. Anyone already logged in is fine; anyone signing in fresh bounces. Morning peak is coming. Find out why.
    ko: null
  - en: Customers can't sign in. The app tells them their certificate can't be verified, which they're reading as "you've been hacked".
    ko: null
  - en: Security here. An issuer we weren't expecting for another six hours is signing production sessions. I'm treating this as hostile until someone shows me otherwise.
    ko: null
  - en: Pulling the issuance log and the bundle rollout history. Give me two minutes.
    ko: null
  - en: ca-18 went live six hours ahead of its trust bundle, and the promotion came from a request with no change ticket. An issuer that shows up early is an issuer I don't trust. I'd roll it back, whatever it costs.
    ko: null
  - en: Retries are piling up. People who failed once are hammering the button and failing faster.
    ko: null
  - en: Half of sign-ins are failing and the morning peak has started. I need a decision, not another graph.
    ko: null
  - en: The partner banks share the old identity pool. Their API sign-ins just went from 200 ms to four seconds.
    ko: null
  - en: The old pool is at 100%. It was sized for a quarter of our traffic. Everything we sent there is bouncing back.
    ko: null
  - en: Restart's done. Three of six came back accepting ca-18. The other three rebooted into the same old bundle. Nothing newer ever reached them.
    ko: null
  - en: ca-18 is withdrawn and we're signing with ca-17 again. New sign-ins work. Everyone who signed in under ca-18 just got logged out.
    ko: null
  - en: 31,000 customers just got signed out mid-session. The sign-in queue is eleven minutes long and the phones haven't stopped.
    ko: null
  - en: Bundle 2025-11 is on all six verifiers and loaded. ca-18 verifies everywhere. Nobody got logged out.
    ko: null
  - en: "Status posted: customers cannot sign in because a new certificate issuer went live before our verifiers trusted it. Existing sessions are unaffected. A fix is in progress."
    ko: null
  - en: Case 2231 is open. Codename NULL. Same tag as the unsigned workload, same no-ticket habit. I don't know who it is. I know it's been here before.
