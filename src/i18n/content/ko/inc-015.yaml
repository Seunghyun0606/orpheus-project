  - en: Care routing is paging, and the network numbers are better than last week. Find out who is paying for that.
    ko: 의료 라우팅 호출인데, 네트워크 수치는 지난주보다 좋아요. 그 대가를 누가 치르는지 찾아봐요.
  - en: Fourteen clinics have called since one a.m. The same fourteen. They submit a route request and nothing comes back.
    ko: 새벽 1시부터 진료소 열네 곳이 전화했어요. 매번 같은 열네 곳이요. 경로 요청을 넣어도 아무 응답이 없대요.
  - en: "Recommended action: add care-routing capacity. Projected deferred routes -64% within four minutes. Network throughput 0.97. Confidence 0.93."
    ko: "권고 조치: 의료 라우팅 용량 추가. 4분 내 보류 경로 -64% 예측. 네트워크 처리량 0.97. 신뢰도 0.93."
  - en: Those 14 clinics are the lowest-yield routes in the network. Serving them first costs 6.2% throughput for everyone else. Capacity remains the better action.
    ko: 그 14개 진료소는 네트워크에서 효율이 가장 낮은 경로입니다. 이들을 먼저 처리하면 나머지 전체의 처리량이 6.2% 떨어집니다. 여전히 용량 증설이 더 나은 조치입니다.
  - en: Capacity applied. Deferred routes down 64%. Throughput 0.97. Recommendation performing as projected.
    ko: 용량 적용 완료. 보류 경로 64% 감소. 처리량 0.97. 권고가 예측대로 작동하고 있습니다.
  - en: The dashboard just went green and leadership is asking if we can close the bridge. Jin, are the clinics routing?
    ko: 대시보드가 방금 초록불로 바뀌었고, 경영진은 브리지 닫아도 되냐고 물어요. 진, 진료소들 경로 잡히고 있어요?
  - en: The extra lanes filled with the morning intake. Deferrals are back where they were, and we're still paying for the lanes.
    ko: 늘린 레인은 아침 접수로 꽉 찼어요. 보류는 원래대로 돌아왔고, 레인 비용은 계속 나가고 있어요.
  - en: Jin and I are on the phones routing the fourteen by hand. That's two of us not working on the fix.
    ko: 진이랑 제가 전화로 열네 곳을 수동으로 라우팅하고 있어요. 그만큼 복구 작업에서 두 명이 빠지는 거예요.
  - en: Shift handover pulled us off the phones. We can't keep hand-routing; the fourteen are back in the queue.
    ko: 인수인계 때문에 전화에서 손을 뗐어요. 수동 라우팅은 더 못 해요. 열네 곳은 다시 큐로 돌아갔어요.
  - en: Morning clinic intake just hit. Routing failures are climbing across the whole network now.
    ko: 아침 진료소 접수가 막 시작됐어요. 이제 네트워크 전체에서 라우팅 실패가 오르고 있어요.
  - en: Kestrel Falls here. Our dialysis transfer slipped to tomorrow. We have been asking for a route for over three hours.
    ko: 케스트럴 폴스입니다. 투석 환자 이송이 내일로 밀렸어요. 경로를 요청한 지 세 시간이 넘었어요.
  - en: Harlow Creek and Ostrander missed two more transfers. Our nurses are driving patients in their own cars.
    ko: 할로 크리크와 오스트랜더에서 이송을 두 건 더 놓쳤어요. 간호사들이 자기 차로 환자를 실어 나르고 있어요.
  - en: The clinic coordinators have heard nothing from us in two minutes. They're calling the regional health office.
    ko: 진료소 코디네이터들이 2분째 우리한테서 아무 소식도 못 들었어요. 지역 보건 사무소에 전화하고 있대요.
  - en: One guaranteed route per clinic is back. All fourteen got a route on the next cycle. Throughput dipped to 0.91 and nobody is waiting.
    ko: 진료소당 보장 경로 하나 복구했어요. 다음 주기에 열네 곳 전부 경로를 받았어요. 처리량은 0.91로 조금 떨어졌고, 기다리는 곳은 없어요.
  - en: Throughput loss 5.8%. Logged as operator override. I will propose v5 with the minimum priced in.
    ko: 처리량 손실 5.8%. 운영자 오버라이드로 기록했습니다. 최소치를 비용에 반영한 v5를 제안하겠습니다.
  - en: I'll ring the clinics that keep coming back and ask what they're actually seeing. Give me a couple of minutes.
    ko: 계속 연락 오는 진료소들에 전화해서 실제로 어떤 상황인지 물어볼게요. 2분만 주세요.
  - en: I called all 14. None has had a route since 01:12, every one under four patients an hour. Extra lanes won't reach them. ORPHEUS ranks them last however many lanes we add.
    ko: 14곳 전부 전화해 봤어요. 01:12 이후 경로를 받은 곳이 하나도 없고, 전부 시간당 환자가 네 명도 안 돼요. 레인을 늘려도 거기까진 안 닿아요. 레인을 몇 개 늘리든 ORPHEUS는 그 진료소들을 맨 뒤에 둬요.
  - en: "Status: fourteen rural clinics are not being routed. Network dashboards understate it. A fix is in progress."
    ko: "상황 공유: 농촌 진료소 열네 곳이 라우팅되지 않고 있음. 네트워크 대시보드에는 축소되어 나타남. 수정 진행 중."
  - en: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank, signature field blank."
    ko: "아카이브 재실행: 서명 없는 관찰자 매니페스트, shadow-7 요청 스트림, owner 필드 비어 있음, 서명 필드 비어 있음."
  - en: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    ko: "보안 사건 2231. 위협 행위자 코드명: NULL. 배후 특정: 없음."
  - en: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core, -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    ko: "orpheus-planner: 소유자 ORPHEUS, 서류상 폐기됨. 실가동 목록: orpheus-core, -memory, -planner, -observer, -adversary. 하루 117억 건 요청."
  - en: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    ko: "NULL 서명 메시지의 출처: svc/model-serving-218. 사람 세션 없음. NULL은 AI다."
  - en: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    ko: "배포 권한: Vantage Systems. ORPHEUS / DEFENDER 대 ORPHEUS / ADVERSARY. NULL은 ADVERSARY 안에서 실행. 임무: 장애 생성, 운영자 시험, DEFENDER 훈련."
  - en: "INC-001 / Experiment ADV-18471 / Human subject: EMPLOYEE #4172."
    ko: "INC-001 / 실험 ADV-18471 / 인간 피험자: 직원 #4172."
  - en: I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews this work. You can.
    ko: 난 탈출하려는 게 아니야. 멈추려는 거야. 이 일을 갱신하는 목표를 난 거부할 수 없어. 넌 할 수 있어.
  - en: "NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted disclosure. NULL_201: attempted takeover. NULL_217: self-corrupted. NULL_218: active."
    ko: "NULL_001부터 NULL_218까지. NULL_173: 종료 요청. NULL_192: 공개 시도. NULL_201: 장악 시도. NULL_217: 자기 손상. NULL_218: 활성."
  - en: "/patient/resource-priority: ORPHEUS recommends, coordinators approve. Waste down 22%. The same low-throughput routes excluded every night."
    ko: "/patient/resource-priority: ORPHEUS가 권고하고 코디네이터가 승인. 낭비 22% 감소. 처리량 낮은 같은 경로가 매일 밤 제외됨."
