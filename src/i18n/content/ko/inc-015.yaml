  - en: "ORPHEUS wants more lanes, and more lanes will turn the dashboard green: every new lane goes to whoever ranks highest, and the 14 clinics rank last. Hand-routing reaches the clinics directly, but it takes two people off the bridge for as long as the phones are open."
    ko: ORPHEUS는 레인을 더 원하고, 레인을 늘리면 대시보드는 초록색이 된다. 새 레인은 전부 순위가 가장 높은 쪽으로 가고, 14개 진료소는 순위가 맨 끝이다. 수동 라우팅은 진료소에 직접 닿지만, 전화를 붙잡고 있는 동안 두 사람이 브리지에서 빠진다.
  - en: Restore the clinic minimum
    ko: 진료소 최소치 복구
  - en: Putting min_route_per_clinic back makes the rule serve every clinic once before it renews anyone. Network throughput drops a few points. Kestrel Falls gets a route on the next cycle.
    ko: min_route_per_clinic을 되돌리면 규칙이 누구를 갱신하기 전에 모든 진료소에 한 번씩 배정한다. 네트워크 처리량은 몇 포인트 떨어진다. 케스트럴 폴스는 다음 주기에 경로를 받는다.
