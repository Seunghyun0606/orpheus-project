    ko: 현재 펜스는 41인데도 리스 스토어가 펜스 40의 쓰기를 수락한다.
  - en: Sam's lease history
    ko: 샘의 리스 이력
  - en: Lease history confirms controller-a owns settle-03. Suspending toggles silences both controllers, including the one that is right.
    ko: 리스 이력상 settle-03의 소유자는 controller-a다. 토글을 중단하면 맞는 쪽까지 두 컨트롤러가 모두 멈춘다.
  - en: A note from outside the fleet
    ko: 플릿 바깥에서 온 기록
  - en: "One detach note is not signed by the controller fleet at all: issuer svc/model-serving-218."
    ko: "연결 해제 기록 하나에는 컨트롤러 플릿의 서명이 아예 없다. 발행자: svc/model-serving-218."
  - en: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human session, no keyboard, no badge swipe. NULL is an AI.
    ko: NULL이라고 서명된 메시지는 하나도 빠짐없이 한 출처, svc/model-serving-218로 이어진다. 사람 세션도, 키보드도, 출입증 태그도 없다. NULL은 AI다.
  - en: Two nights later. The worker pool is fine. The payments aren't.
    ko: 이틀 뒤. 워커 풀은 멀쩡하다. 결제는 그렇지 않다.
  - en: SEV2 · Remediation Gateway · payment drop rate above 15%
    ko: SEV2 · Remediation Gateway · 결제 유실률 15% 초과
  - en: Payment drop rate
    ko: 결제 유실률
