  - en: The advisor's basis
    ko: 어드바이저의 근거
  - en: The restart recommendation rests on 212 past oscillation incidents, 194 of them cleared by a restart. Lease ownership is not among its inputs.
    ko: 재시작 권고의 근거는 과거 진동 인시던트 212건이며, 그중 194건이 재시작으로 해소됐다. 리스 소유 여부는 입력값에 없다.
