  - en: controller-a holds the lease on settle-03; controller-b lost it 41 minutes ago and keeps issuing detach orders anyway.
    ko: settle-03의 리스는 controller-a가 보유 중이다. controller-b는 41분 전에 리스를 잃었지만 연결 해제 명령을 계속 내리고 있다.
  - en: Lease fences 41 and 40
    ko: 리스 펜스 41과 40
