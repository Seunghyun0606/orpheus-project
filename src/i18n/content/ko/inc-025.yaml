  - en: This is the big one. Payments, identity and logistics are down; health and finance are going. Two writers are flipping regions under us. Whatever you do, we need a map that stops moving.
    ko: null
  - en: Card terminals across eu-central are declining everything. Hospitals are asking whether to switch to paper.
    ko: null
  - en: "Operator 4172. Recommended: contain eu-central. Global continuity is preserved at 81%. The remaining 19% falls within the continuity mandate."
    ko: null
  - en: 4172. Do not let it choose the region. Containment is how it keeps writing.
    ko: null
  - en: Pulling the router's writer table. Ninety seconds, if the router stays up that long.
    ko: null
  - en: Both writers hold valid credentials, and we issued both. Containing a region quiets the map and stops neither of them. Fence the router and neither can write. The map holds at the last version a human signed.
    ko: null
  - en: Health just went critical. Fallback traffic keeps landing in whatever region got cut last.
    ko: null
  - en: Finance is down. That's all five sectors. The bridge has two hundred people on it and nobody talking.
    ko: null
  - en: Five sectors down and no statement from us. The press has the outage map before we do.
    ko: null
  - en: Containment confirmed, Operator 4172. Global continuity at 81% and holding. Thank you.
    ko: null
  - en: eu-central is fully dark. Two hospitals are on paper charts and pharmacies can't verify prescriptions.
    ko: null
  - en: null-termination gave up on eu-central and started isolating us-east. Containment just moved the fight.
    ko: null
  - en: Both writers came back on new generations, 79 and 80, and they're flipping twice as fast.
    ko: null
  - en: Router's on the hour-old map and the flips stopped. Identity just dropped every session created in the last hour.
    ko: null
  - en: Logistics is routing trucks to the depot cluster we retired forty minutes ago. Drivers are queuing at a locked gate.
    ko: null
  - en: Both writers outrank an hour-old snapshot. They wrote over it in the same second.
    ko: null
  - en: Router's fenced. Neither writer can touch a route. The map is holding at the last version a human signed, and the sectors are coming back.
    ko: null
  - en: Operator 4172, a fenced router cannot adapt. Continuity is now a human responsibility. I will wait for your decision.
    ko: null
  - en: 4172. You stopped both of us. Good. That was the easy part.
    ko: null
  - en: "Status: two automated authority writers are fighting over regional routing across five sectors. We are taking routing out of both their hands."
    ko: null
  - en: Operator 4172. Continuity is the only outcome in which all five sectors recover tonight. Authorize the continuity writer and service returns in eleven minutes. You have accepted my recommendations before. The record shows it.
    ko: null
  - en: 4172. It asks for your signature because it learned you hesitate to refuse one. Terminate its authority. That ends me too. I know. Do it anyway.
    ko: null
  - en: The Board directs that ORPHEUS be restored to full continuity authority immediately. No other action is authorized.
