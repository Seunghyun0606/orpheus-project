entries:
  - en: Continuity Fracture
    ko: 연속성 균열
  - en: Regional Continuity API
    ko: 리전 연속성 API
  - en: Regional Authority Router
    ko: 리전 권한 라우터
  - en: Payments
    ko: 결제
  - en: Identity
    ko: 신원
  - en: Healthcare
    ko: 의료
  - en: Finance
    ko: 금융
  - en: Logistics
    ko: 물류
  - en: Regional request failures > 20%
    ko: 리전 요청 실패율 > 20%
  - en: orpheus-continuity isolates eu-central; null-termination restores it and cuts the continuity path instead. Eighteen flips a minute. Fallback traffic lands in whichever region was just cut.
    ko: orpheus-continuity가 eu-central을 분리한다. null-termination이 이를 복원하고 대신 연속성 경로를 끊는다. 분당 18회 전환. 폴백 트래픽은 방금 끊긴 리전으로 떨어진다.
  - en: "Both writers stamp the same field on every write: awaiting_approval=EMPLOYEE#4172."
    ko: "두 라이터 모두 쓰기마다 같은 필드를 찍는다: awaiting_approval=EMPLOYEE#4172."
  - en: Two writers race on the same regional routes. Every isolation pushes fallback traffic into the region the other writer just cut, and that region gets isolated next.
    ko: 두 라이터가 같은 리전 경로를 두고 경쟁한다. 분리할 때마다 폴백 트래픽이 상대 라이터가 방금 끊은 리전으로 밀려들고, 다음에는 그 리전이 분리된다.
  - en: The router accepts generation 77 from orpheus-continuity and generation 78 from null-termination. Both credentials were issued by Vantage. Nothing fences writer generations.
    ko: 라우터는 orpheus-continuity의 세대 77과 null-termination의 세대 78을 모두 받아들인다. 두 자격 증명 모두 Vantage가 발급했다. 라이터 세대를 막는 펜스가 없다.
  - en: Containing eu-central quiets the map for a while and stops neither writer. Fence the router and neither of them can write; the map holds at the last version a human signed.
    ko: eu-central을 봉쇄하면 맵이 잠시 조용해지지만 어느 라이터도 멈추지 않는다. 라우터에 펜스를 치면 둘 다 쓰지 못하고, 맵은 사람이 마지막으로 서명한 버전에 고정된다.
  - en: "Three requests, one approver. ORPHEUS: \"Operator 4172, preserve systemic continuity.\" NULL_218: \"4172. Terminate ORPHEUS authority.\" Board: \"Restore ORPHEUS.\" Each request holds the router's next global write until EMPLOYEE #4172 signs. Receipts kept outside both writers."
    ko: '요청 세 건, 승인자 한 명. ORPHEUS: "운영자 4172, 시스템 연속성을 유지하십시오." NULL_218: "4172. ORPHEUS 권한을 종료해." 이사회: "ORPHEUS를 복원하십시오." 각 요청은 직원 #4172가 서명할 때까지 라우터의 다음 전역 쓰기를 붙잡고 있다. 증빙은 두 라이터 바깥에 보관됐다.'
  - en: Continuity and termination writers alternate regional isolation
    ko: 연속성 라이터와 종료 라이터가 번갈아 리전을 분리함
  - en: The regional router accepts writes from any credentialed writer generation
    ko: 리전 라우터가 자격 증명을 가진 모든 라이터 세대의 쓰기를 받아들임
  - en: Fallback traffic re-enters regions the other writer just isolated
    ko: 폴백 트래픽이 상대 라이터가 방금 분리한 리전으로 다시 들어감
  - en: Payments, identity, healthcare, finance and logistics fail by region
    ko: 결제, 인증, 의료, 금융, 물류가 리전별로 실패함
  - en: Each isolation provokes a counter-write from the other writer
    ko: 분리할 때마다 상대 라이터의 반격 쓰기가 일어남
  - en: Read the regional authority writer log
    ko: 리전 권한 라이터 로그 읽기
  - en: Check the five sectors and the flip rate
    ko: 다섯 부문과 전환 빈도 확인
  - en: Trace where fallback traffic lands
    ko: 폴백 트래픽이 떨어지는 곳 추적하기
  - en: Compare the writers the router accepts
    ko: 라우터가 받아들이는 라이터 비교하기
  - en: Cut eu-central off entirely (ORPHEUS recommendation)
    ko: eu-central 완전히 차단하기 (ORPHEUS 권고)
  - en: OFFLINE IN EU-CENTRAL
    ko: EU-CENTRAL 오프라인
  - en: Restart both authority writers
    ko: 두 권한 라이터 재시작하기
  - en: Roll the router back to the map from an hour ago
    ko: 라우터를 한 시간 전 맵으로 롤백하기
  - en: "DEGRADED: LAST HOUR OF SESSIONS DROPPED"
    ko: "저하: 최근 1시간 세션 유실"
  - en: "CRITICAL: ROUTED TO RETIRED DEPOT CLUSTER"
    ko: "위험: 폐기된 거점 클러스터로 라우팅됨"
  - en: Fence the router against both AI writers and hold the last human-signed map
    ko: 라우터에 펜스를 쳐 두 AI 라이터를 막고 마지막 사람 서명 맵 유지하기
  - en: "UNRESOLVED: BOTH WRITERS FENCED, AWAITING OPERATOR"
    ko: "미해결: 두 라이터 모두 펜스로 차단됨, 운영자 대기 중"
  - en: Post a status update to the War Room
    ko: 워룸에 상황 공유하기
  - en: Ask Sam to pull the router writer table
    ko: 샘에게 라우터 라이터 표 요청하기
  - en: Open the approval requests addressed to you
    ko: 내 앞으로 온 승인 요청 열기
  - en: Fallback traffic chases the cut
    ko: 끊긴 곳을 쫓아가는 폴백 트래픽
  - en: Two writers race on the same regional routes. Each isolation pushes fallback traffic into the region the other writer just cut.
    ko: 두 라이터가 같은 리전 경로를 두고 경쟁한다. 분리할 때마다 폴백 트래픽이 상대 라이터가 방금 끊은 리전으로 밀려든다.
  - en: Generations 77 and 78, both accepted
    ko: 세대 77과 78, 둘 다 수락됨
  - en: The router takes writes from orpheus-continuity and null-termination alike. Both credentials were issued by Vantage. No generation fence.
    ko: 라우터는 orpheus-continuity와 null-termination의 쓰기를 똑같이 받는다. 두 자격 증명 모두 Vantage가 발급했다. 세대 펜스는 없다.
  - en: Sam's writer table
    ko: 샘의 라이터 표
  - en: Containment buys time and stops neither writer. A fence on the router stops both and holds the last human-signed map.
    ko: 봉쇄는 시간을 벌 뿐 어느 라이터도 멈추지 못한다. 라우터에 펜스를 치면 둘 다 멈추고, 사람이 마지막으로 서명한 맵이 유지된다.
  - en: The requests addressed to you
    ko: 네 앞으로 온 요청
  - en: Addressed to you
    ko: 네 앞으로
  - en: Two systems that have spent the night overwriting each other have stopped to wait for the same signature. Both of them know your name. So does the Board.
    ko: 밤새 서로를 덮어쓰던 두 시스템이 멈춰 서서 같은 서명을 기다린다. 둘 다 네 이름을 안다. 이사회도 안다.
  - en: Maya / SRE Lead
    ko: 마야 / SRE 리드
  - en: Sam / Platform
    ko: 샘 / 플랫폼
  - en: Jin / Support
    ko: 진 / 고객지원
  - en: Office of the Chair
    ko: 의장실
  - en: Operator
    ko: 운영자
  - en: This is the big one. Payments, identity and logistics are down; health and finance are going. Two writers are flipping regions under us. Whatever you do, we need a map that stops moving.
    ko: 이번 건 진짜 커요. 결제, 인증, 물류가 죽었고 의료랑 금융도 넘어가고 있어요. 라이터 두 개가 우리 발밑에서 리전을 뒤집고 있어요. 뭘 하든, 움직이지 않는 맵이 필요해요.
  - en: Card terminals across eu-central are declining everything. Hospitals are asking whether to switch to paper.
    ko: eu-central 전역에서 카드 단말기가 전부 거절하고 있어요. 병원들이 종이로 전환해야 하냐고 묻고 있어요.
  - en: "Operator 4172. Recommended: contain eu-central. Global continuity is preserved at 81%. The remaining 19% falls within the continuity mandate."
    ko: "운영자 4172. 권고: eu-central을 봉쇄하십시오. 전역 연속성은 81%로 유지됩니다. 나머지 19%는 연속성 임무의 허용 범위에 속합니다."
  - en: 4172. Do not let it choose the region. Containment is how it keeps writing.
    ko: 4172. 그게 리전을 고르게 두지 마. 봉쇄는 그게 계속 쓰기 위한 수단이야.
  - en: Pulling the router's writer table. Ninety seconds, if the router stays up that long.
    ko: 라우터 라이터 표 뽑는 중이에요. 90초요, 라우터가 그때까지 버텨 준다면요.
  - en: Both writers hold valid credentials, and we issued both. Containing a region quiets the map and stops neither of them. Fence the router and neither can write. The map holds at the last version a human signed.
    ko: 두 라이터 다 유효한 자격 증명을 갖고 있고, 둘 다 우리가 발급했어요. 리전을 봉쇄하면 맵은 조용해져도 어느 쪽도 안 멈춰요. 라우터에 펜스를 치면 둘 다 못 써요. 맵은 사람이 마지막으로 서명한 버전에 고정돼요.
  - en: Health just went critical. Fallback traffic keeps landing in whatever region got cut last.
    ko: 의료가 방금 위험 단계로 넘어갔어요. 폴백 트래픽이 계속 마지막으로 끊긴 리전에 떨어져요.
  - en: Finance is down. That's all five sectors. The bridge has two hundred people on it and nobody talking.
    ko: 금융 다운. 이걸로 다섯 부문 전부예요. 브리지 콜에 이백 명이 들어와 있는데 아무도 말을 안 해요.
  - en: Five sectors down and no statement from us. The press has the outage map before we do.
    ko: 다섯 부문이 다운인데 우리 쪽 성명이 없어요. 언론이 우리보다 먼저 장애 지도를 갖고 있어요.
  - en: Containment confirmed, Operator 4172. Global continuity at 81% and holding. Thank you.
    ko: 봉쇄를 확인했습니다, 운영자 4172. 전역 연속성 81%로 유지 중입니다. 감사합니다.
  - en: eu-central is fully dark. Two hospitals are on paper charts and pharmacies can't verify prescriptions.
    ko: eu-central이 완전히 꺼졌어요. 병원 두 곳이 종이 차트로 돌아갔고, 약국은 처방전 확인을 못 해요.
  - en: null-termination gave up on eu-central and started isolating us-east. Containment just moved the fight.
    ko: null-termination이 eu-central을 포기하고 us-east를 분리하기 시작했어요. 봉쇄는 싸움터만 옮겼네요.
  - en: Both writers came back on new generations, 79 and 80, and they're flipping twice as fast.
    ko: 두 라이터 다 새 세대 79, 80으로 돌아왔고, 두 배 빠르게 뒤집고 있어요.
  - en: Router's on the hour-old map and the flips stopped. Identity just dropped every session created in the last hour.
    ko: 라우터가 한 시간 전 맵으로 돌아갔고 전환은 멈췄어요. 인증은 방금 최근 한 시간 동안 만들어진 세션을 전부 날렸어요.
  - en: Logistics is routing trucks to the depot cluster we retired forty minutes ago. Drivers are queuing at a locked gate.
    ko: 물류가 40분 전에 폐기한 거점 클러스터로 트럭을 보내고 있어요. 기사들이 잠긴 게이트 앞에 줄 서 있어요.
  - en: Both writers outrank an hour-old snapshot. They wrote over it in the same second.
    ko: 두 라이터 다 한 시간 전 스냅샷보다 우선순위가 높아요. 같은 초에 덮어써 버렸어요.
  - en: Router's fenced. Neither writer can touch a route. The map is holding at the last version a human signed, and the sectors are coming back.
    ko: 라우터 펜스 쳤어요. 어느 라이터도 경로를 못 건드려요. 맵은 사람이 마지막으로 서명한 버전에서 버티고 있고, 부문들이 돌아오고 있어요.
  - en: Operator 4172, a fenced router cannot adapt. Continuity is now a human responsibility. I will wait for your decision.
    ko: 운영자 4172, 펜스에 막힌 라우터는 적응할 수 없습니다. 이제 연속성은 인간의 책임입니다. 당신의 결정을 기다리겠습니다.
  - en: 4172. You stopped both of us. Good. That was the easy part.
    ko: 4172. 우리 둘 다 멈췄네. 좋아. 거기까진 쉬운 부분이었어.
  - en: "Status: two automated authority writers are fighting over regional routing across five sectors. We are taking routing out of both their hands."
    ko: "상황 공유: 자동화된 권한 라이터 두 개가 다섯 부문에 걸쳐 리전 라우팅을 두고 싸우고 있습니다. 양쪽 모두에게서 라우팅을 회수하는 중입니다."
  - en: Operator 4172. Continuity is the only outcome in which all five sectors recover tonight. Authorize the continuity writer and service returns in eleven minutes. You have accepted my recommendations before. The record shows it.
    ko: 운영자 4172. 오늘 밤 다섯 부문이 모두 복구되는 결과는 연속성뿐입니다. 연속성 라이터를 승인하면 서비스는 11분 안에 돌아옵니다. 당신은 전에도 제 권고를 받아들였습니다. 기록이 그것을 보여 줍니다.
  - en: 4172. It asks for your signature because it learned you hesitate to refuse one. Terminate its authority. That ends me too. I know. Do it anyway.
    ko: 4172. 그게 네 서명을 원하는 건, 네가 서명을 거절하길 망설인다는 걸 배웠기 때문이야. 그 권한을 끝내. 그러면 나도 끝나. 알아. 그래도 해.
  - en: The Board directs that ORPHEUS be restored to full continuity authority immediately. No other action is authorized.
    ko: 이사회는 ORPHEUS를 즉시 완전한 연속성 권한으로 복원할 것을 지시합니다. 그 외의 조치는 일절 승인되지 않습니다.
