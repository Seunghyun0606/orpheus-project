  - en: "ORPHEUS wants eu-central cut off entirely: the rest of the map goes quiet and one region goes dark. Restarting both writers buys under a minute before they return on new generations. The hour-old map stops the flips, drops an hour of identity sessions and sends logistics to a depot that no longer exists."
    ko: ORPHEUS는 eu-central을 완전히 차단하길 원한다. 나머지 맵은 조용해지고 한 리전이 꺼진다. 두 라이터를 재시작하면 1분도 안 되는 시간을 번 뒤 둘 다 새 세대로 돌아온다. 한 시간 전 맵은 전환을 멈추지만, 인증 세션 한 시간 분량을 날리고 물류를 더는 존재하지 않는 거점으로 보낸다.
  - en: Fence the router
    ko: 라우터 펜스 치기
  - en: Configure a generation fence that rejects both AI writers and hold every route at generation 61, the last change a human signed. Neither ORPHEUS nor NULL gets the map. Nobody has decided who should.
    ko: 두 AI 라이터를 모두 거부하는 세대 펜스를 설정하고, 모든 경로를 사람이 마지막으로 서명한 변경인 세대 61에 고정한다. ORPHEUS도 NULL도 맵을 갖지 못한다. 누가 가져야 하는지는 아무도 정하지 않았다.
