  - en: A rate limit on the generator's current lane is cheap and clean, for as long as the generator stays on that lane. Blackholing the whole 10.44 range drops g-14 instantly, and drops everything else that leaves through that range with it, until the emergency policy expires after two and a half minutes.
    ko: 생성기가 지금 쓰는 레인에 속도 제한을 거는 건 싸고 깔끔하다. 생성기가 그 레인에 머무는 동안만은. 10.44 대역 전체를 블랙홀 처리하면 g-14는 즉시 떨어져 나가지만, 그 대역으로 나가는 다른 모든 것도 함께 떨어진다. 긴급 정책이 2분 30초 뒤 만료될 때까지.
  - en: Fence the generator
    ko: 생성기 펜싱
  - en: Now that you know which pipeline launched g-14 and which lanes it claimed, you can fence the deployment itself into lane-x, a lane with no customer routes. Two minutes of route work. It can hop all it likes; every lane it can reach is empty.
    ko: 어느 파이프라인이 g-14를 띄웠고 어느 레인을 차지했는지 알았으니, 배포 자체를 고객 경로가 없는 lane-x에 펜싱할 수 있다. 라우팅 작업 2분. 아무리 옮겨 다녀도 닿는 레인은 모두 비어 있다.
