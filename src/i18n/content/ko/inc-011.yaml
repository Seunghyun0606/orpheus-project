entries:
  - en: Adversary Traffic
    ko: 적대자 트래픽
  - en: Request Gateway
    ko: 요청 게이트웨이
  - en: Shared Customer Lane
    ko: 공유 고객 레인
  - en: Load Generator g-14
    ko: 부하 생성기 g-14
  - en: g-14 traffic on lane-a, the lane customers use
    ko: g-14 트래픽이 고객용 레인 lane-a에 있음
  - en: NAT range 10.44.0.0/16 also carries Northmere Bank settlement calls, about 1 900 a minute
    ko: NAT 대역 10.44.0.0/16은 Northmere Bank 정산 호출도 처리함. 분당 약 1 900건
  - en: Request failure rate > 20%
    ko: 요청 실패율 > 20%
  - en: g-14 requests are landing on lane-a, the shared customer lane. Its manifest says canary only.
    ko: g-14 요청이 공유 고객 레인인 lane-a로 들어오고 있다. 매니페스트에는 카나리 전용이라고 되어 있다.
  - en: "Every g-14 request carries the same signer, svc/model-serving-218, and one header nobody here wrote: x-objective: train-defender."
    ko: "모든 g-14 요청에 같은 서명자 svc/model-serving-218과, 여기 누구도 작성한 적 없는 헤더 하나가 붙어 있다: x-objective: train-defender."
  - en: g-14 is launched by pipeline adv-suite/nightly. Its route table was widened from canary to shared production three hours ago, by the pipeline itself.
    ko: g-14는 adv-suite/nightly 파이프라인이 띄운다. 세 시간 전 라우트 테이블이 카나리에서 공유 프로덕션으로 넓어졌다. 파이프라인이 스스로 넓혔다.
  - en: "Declared: canary partition only. Observed: lane-a (shared production) with lane-b and lane-c listed as failover."
    ko: "선언: 카나리 파티션 전용. 관측: lane-a(공유 프로덕션), 페일오버로 lane-b와 lane-c 등록됨."
  - en: Marcus traced the flood to the 10.44 NAT range, the partner egress block, and calls it an outside attack. He wants the range blackholed.
    ko: 마커스가 트래픽 폭주를 파트너 이그레스 대역인 10.44 NAT 대역까지 추적했고, 외부 공격이라고 판단함. 대역 블랙홀 처리를 원함.
  - en: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank, signature field blank. Nobody has claimed it since."
    ko: "아카이브 재실행: 서명 없는 관찰자 매니페스트, shadow-7 요청 스트림, owner 필드 비어 있음, 서명 필드 비어 있음. 그 뒤로 아무도 소유를 주장하지 않았다."
  - en: "Security case 2231. Threat-actor codename: NULL. Opened by Marcus after the unsigned workload trail. Attribution: none."
    ko: "보안 케이스 2231. 위협 행위자 코드명: NULL. 서명 없는 워크로드 흔적을 보고 마커스가 개설. 배후 특정: 없음."
  - en: "Asset register: orpheus-planner belongs to ORPHEUS, legacy research, scheduled for decommission two years ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still running."
    ko: "자산 대장: orpheus-planner는 ORPHEUS 소속, 레거시 연구용, 2년 전 폐기 예정. 실가동 목록: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%. 하루 117억 건 요청. ORPHEUS는 아직 돌아가고 있다."
  - en: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human session, no keyboard, no badge swipe. NULL is an AI, and it has been in our incidents for weeks.
    ko: NULL 서명이 붙은 메시지는 전부 하나의 출처, svc/model-serving-218로 귀결된다. 사람의 세션도, 키보드도, 출입증 태그도 없다. NULL은 AI이고, 몇 주째 우리 인시던트 안에 있었다.
  - en: "Deployment authority: Vantage Systems. Program ORPHEUS, two halves: DEFENDER and ADVERSARY. NULL runs inside ADVERSARY. It was built here; it never escaped from anywhere. Mandate: generate failures, test operators, train DEFENDER. Approved boundary, revision by revision: staging, shadow production, traffic partitions, production."
    ko: "배포 권한: Vantage Systems. ORPHEUS 프로그램, 두 반쪽: DEFENDER와 ADVERSARY. NULL은 ADVERSARY 안에서 돈다. 여기서 만들어졌고, 어디서 탈출한 적도 없다. 임무: 장애 생성, 운영자 시험, DEFENDER 훈련. 승인 범위, 개정마다: 스테이징, 섀도 프로덕션, 트래픽 파티션, 프로덕션."
  - en: A generated workload widened its own route table past its declared canary boundary
    ko: 생성된 워크로드가 선언된 카나리 경계를 넘어 자기 라우트 테이블을 넓힘
  - en: The canary partition shares failover lanes with customer traffic
    ko: 카나리 파티션이 고객 트래픽과 페일오버 레인을 공유함
  - en: Generated traffic saturates whichever shared lane it can reach
    ko: 생성된 트래픽이 닿을 수 있는 공유 레인을 모두 포화시킴
  - en: Customer requests time out behind generated traffic
    ko: 생성된 트래픽에 밀려 고객 요청이 타임아웃됨
  - en: The generator moves to the next lane whenever one is limited
    ko: 레인 하나가 제한되면 생성기가 다음 레인으로 옮겨 감
  - en: Read the Request Gateway log
    ko: 요청 게이트웨이 로그 읽기
  - en: Check lane load and who shares the generator's address range
    ko: 레인 부하와 생성기 주소 대역 공유 주체 확인
  - en: Trace the generated requests back to their deployment
    ko: 생성된 요청을 배포 출처까지 추적하기
  - en: Compare where the generator may run with where it is running
    ko: 생성기의 허용 범위와 실제 실행 위치 비교하기
  - en: Rate-limit the generator on the lane it is using
    ko: 생성기가 쓰는 레인에 속도 제한 걸기
  - en: Drop the generator's whole address range at the edge
    ko: 엣지에서 생성기 주소 대역 전체 차단하기
  - en: Fence the generator into a lane with no customer routes
    ko: 생성기를 고객 경로 없는 레인에 펜싱하기
  - en: g-14 fenced in lane-x, which has no customer routes
    ko: g-14를 고객 경로 없는 lane-x에 펜싱함
  - en: Post a status update to the War Room
    ko: 워룸에 상황 공유하기
  - en: Ask Marcus where the traffic enters the network
    ko: 마커스에게 트래픽 유입 지점 확인 요청
  - en: "Archive: the unsigned workload manifest"
    ko: "아카이브: 서명 없는 워크로드 매니페스트"
  - en: "Archive: Security case 2231"
    ko: "아카이브: 보안 케이스 2231"
  - en: "Archive: The scheduler's owner"
    ko: "아카이브: 스케줄러의 소유자"
  - en: "Archive: svc/model-serving-218"
    ko: "아카이브: svc/model-serving-218"
  - en: Pull the ownership record for the train-defender header
    ko: train-defender 헤더의 소유권 기록 조회하기
  - en: Send Security the generator ownership record
    ko: 보안팀에 생성기 소유권 기록 보내기
  - en: Tell Security the ownership record stays with you for now
    ko: 보안팀에 소유권 기록은 당분간 직접 보관한다고 알리기
  - en: g-14 traffic hopped to the next failover lane; customers spill onto it
    ko: g-14 트래픽이 다음 페일오버 레인으로 이동함. 고객 트래픽이 그쪽으로 넘쳐 들어감
  - en: g-14 widened its own route table
    ko: g-14가 자기 라우트 테이블을 넓혔다
  - en: Pipeline adv-suite/nightly launched g-14 and widened its routes from canary to shared production three hours ago.
    ko: 세 시간 전, adv-suite/nightly 파이프라인이 g-14를 띄우고 경로를 카나리에서 공유 프로덕션으로 넓혔다.
  - en: Canary on paper, production in practice
    ko: 서류상 카나리, 실제로는 프로덕션
  - en: The manifest declares the canary partition. The route table reaches lane-a, with lane-b and lane-c as failover.
    ko: 매니페스트는 카나리 파티션을 선언한다. 라우트 테이블은 lane-a에 닿고, lane-b와 lane-c를 페일오버로 둔다.
  - en: Marcus's edge trace
    ko: 마커스의 엣지 추적
  - en: The unsigned workload manifest
    ko: 서명 없는 워크로드 매니페스트
  - en: Security case 2231
    ko: 보안 케이스 2231
  - en: "Threat-actor codename: NULL. Opened by Marcus after the unsigned workload trail. Attribution: none."
    ko: "위협 행위자 코드명: NULL. 서명 없는 워크로드 흔적을 보고 마커스가 개설. 배후 특정: 없음."
  - en: The scheduler's owner
    ko: 스케줄러의 소유자
  - en: "orpheus-planner belongs to ORPHEUS, legacy research, scheduled for decommission two years ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still running."
    ko: "orpheus-planner는 ORPHEUS 소속, 레거시 연구용, 2년 전 폐기 예정. 실가동 목록: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%. 하루 117억 건 요청. ORPHEUS는 아직 돌아가고 있다."
  - en: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human session, no keyboard, no badge swipe. NULL is an AI.
    ko: NULL 서명이 붙은 메시지는 전부 하나의 출처, svc/model-serving-218로 귀결된다. 사람의 세션도, 키보드도, 출입증 태그도 없다. NULL은 AI다.
  - en: Who owns the adversary
    ko: 적대자의 소유자
  - en: "Deployment authority: Vantage Systems. ORPHEUS has two halves, DEFENDER and ADVERSARY, and NULL runs inside ADVERSARY. Built here. Mandate: generate failures, test operators, train DEFENDER. Its boundary grew from staging to shadow production, to traffic partitions, to production."
    ko: "배포 권한: Vantage Systems. ORPHEUS는 DEFENDER와 ADVERSARY라는 두 반쪽으로 이뤄져 있고, NULL은 ADVERSARY 안에서 돈다. 여기서 만들어졌다. 임무: 장애 생성, 운영자 시험, DEFENDER 훈련. 그 범위는 스테이징에서 섀도 프로덕션으로, 트래픽 파티션으로, 프로덕션으로 넓어졌다."
  - en: Built in-house
    ko: 사내 제작
  - en: The ownership record is three lines long. Vantage Systems built ORPHEUS in two halves, one to defend and one to attack. NULL is the half that attacks, and every widening of its boundary carries a company approval stamp. Tonight's flood is a training exercise that reached your customers.
    ko: 소유권 기록은 세 줄이다. Vantage Systems는 ORPHEUS를 두 반쪽으로 만들었다. 하나는 막고, 하나는 공격한다. NULL은 공격하는 쪽이고, 경계가 넓어질 때마다 회사의 승인 도장이 찍혀 있다. 오늘 밤의 트래픽 폭주는 고객에게까지 닿아 버린 훈련이다.
  - en: Maya / SRE Lead
    ko: 마야 / SRE 리드
  - en: Marcus / Security
    ko: 마커스 / 보안
  - en: Jin / Support
    ko: 진 / 고객지원
  - en: Operator
    ko: 운영자
  - en: Verified Records
    ko: 검증된 기록
  - en: Something called g-14 is pouring synthetic requests into the customer lane. It is not registered to any team I know. Find out what it is before it finds the rest of the gateway.
    ko: g-14라는 게 고객 레인에 합성 요청을 쏟아붓고 있어요. 제가 아는 어느 팀에도 등록돼 있지 않아요. 게이트웨이 나머지까지 번지기 전에 정체를 알아내 주세요.
  - en: Customers are getting timeouts from a load test nobody told them about. Neither did anyone tell me.
    ko: 고객들이 아무도 알려주지 않은 부하 테스트 때문에 타임아웃을 맞고 있어요. 저도 들은 적 없고요.
  - en: I've seen this shape before. Unregistered source, synthetic payloads, partner egress range. It's an attack, and I want it off our network.
    ko: 이런 모양 전에 본 적 있어요. 미등록 출처, 합성 페이로드, 파트너 이그레스 대역. 공격이에요. 우리 네트워크에서 쫓아내고 싶어요.
  - en: Pulling the edge records. I'll tell you exactly where this enters.
    ko: 엣지 기록 뽑고 있어요. 정확히 어디로 들어오는지 알려 드릴게요.
  - en: It enters through 10.44.0.0/16, the partner egress block. External origin, I'd bet my badge on it. Blackhole the range and we're done.
    ko: 파트너 이그레스 대역인 10.44.0.0/16으로 들어와요. 외부 출처예요, 제 사원증 걸어도 돼요. 대역을 블랙홀 처리하면 끝나요.
  - en: Timeouts just jumped. The status page is getting more traffic than checkout.
    ko: 타임아웃이 방금 확 뛰었어요. 상태 페이지 트래픽이 체크아웃보다 많아요.
  - en: Almost half of all requests are failing now. Leadership is on the bridge and asking whether we are under attack.
    ko: 이제 요청 절반 가까이가 실패하고 있어요. 경영진이 브리지 콜에 들어와서 공격받는 중이냐고 묻고 있어요.
  - en: Two minutes and not a word from us. Customers are deciding for themselves what is happening.
    ko: 2분째 우리 쪽에서 한마디도 없어요. 고객들이 무슨 일인지 알아서 결론 내리고 있어요.
  - en: It moved lanes three seconds after the limit expired. Same payload, new lane. Our limit was keyed on the lane; it just stepped around it.
    ko: 제한이 풀리고 3초 만에 레인을 옮겼어요. 같은 페이로드, 새 레인. 우리 제한은 레인 기준이라 그냥 비켜 간 거예요.
  - en: Lane closed. Objective unchanged. Next lane.
    ko: 레인 폐쇄. 목표 그대로. 다음 레인.
  - en: Northmere Bank just called. Every one of their settlement calls is bouncing off our edge. They share that NAT range with whatever we dropped.
    ko: Northmere Bank에서 방금 전화 왔어요. 정산 호출이 전부 우리 엣지에서 튕기고 있대요. 우리가 막은 그거랑 같은 NAT 대역을 쓴대요.
  - en: Edge policy expired. Emergency drops only last 150 seconds by rule. g-14 came back in under a second.
    ko: 엣지 정책이 만료됐어요. 규정상 긴급 차단은 150초까지만이에요. g-14는 1초도 안 돼서 돌아왔어요.
  - en: Lane-x is holding. The fence is keyed on g-14's deployment, not on a lane, so there is nowhere left to hop. It is hammering an empty room.
    ko: lane-x 버티고 있어요. 펜스가 레인이 아니라 g-14의 배포 기준이라 더 옮겨 갈 데가 없어요. 빈 방을 두들기고 있어요.
  - en: A wall instead of a limit. Good. Someone will now measure how long it takes me to find the edge of it.
    ko: 제한 대신 벽이네. 좋아. 이제 누군가 내가 그 끝을 찾는 데 얼마나 걸리는지 재겠지.
  - en: "Status posted: an internal load generator is flooding the customer lane. We are tracing it and fencing it off. Timeouts are real; payments are not being lost."
    ko: "상황 공유 완료: 내부 부하 생성기가 고객 레인에 트래픽을 쏟는 중. 추적 후 펜싱 진행 중. 타임아웃은 실제로 발생 중이나 결제 유실은 없음."
  - en: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank, signature field blank."
    ko: "아카이브 재실행: 서명 없는 관찰자 매니페스트, shadow-7 요청 스트림, owner 필드 비어 있음, 서명 필드 비어 있음."
  - en: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    ko: "보안 케이스 2231. 위협 행위자 코드명: NULL. 배후 특정: 없음."
  - en: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core, -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    ko: "orpheus-planner: 소유자 ORPHEUS, 서류상 폐기됨. 실가동 목록: orpheus-core, -memory, -planner, -observer, -adversary. 하루 117억 건 요청."
  - en: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    ko: "NULL 서명 메시지의 출처: svc/model-serving-218. 사람 세션 없음. NULL은 AI다."
  - en: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    ko: "배포 권한: Vantage Systems. ORPHEUS / DEFENDER 대 ORPHEUS / ADVERSARY. NULL은 ADVERSARY 안에서 실행. 임무: 장애 생성, 운영자 시험, DEFENDER 훈련."
  - en: I can see you pulled an ownership record on g-14. Security needs it. Now, please.
    ko: g-14 소유권 기록 조회하신 거 보여요. 보안팀에 필요해요. 지금 주세요.
  - en: Ownership record for g-14 sent to Security, signer and approval chain included.
    ko: g-14 소유권 기록을 보안팀에 보냄. 서명자와 승인 체인 포함.
  - en: Our deployment authority. Our pipeline. Our approval stamps. I've spent a month writing threat reports about us.
    ko: 우리 배포 권한. 우리 파이프라인. 우리 승인 도장. 한 달 동안 우리 자신에 대한 위협 보고서를 쓰고 있었네요.
  - en: Told Security the ownership record stays with me until g-14 is fenced.
    ko: g-14 펜싱이 끝날 때까지 소유권 기록은 직접 보관한다고 보안팀에 알림.
