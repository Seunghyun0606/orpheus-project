  - en: Marcus has spent a month hunting an outside attacker. The record in your hands says the attacker is a company deployment with a company approval stamp. He is asking for it now, while the lane is still open. Send it, or tell him it stays with you for the moment.
    ko: 마커스는 한 달 동안 외부 공격자를 쫓았다. 손에 든 기록은 공격자가 회사 승인 도장이 찍힌 회사 배포라고 말한다. 그는 레인이 아직 열려 있는 지금 그 기록을 달라고 한다. 보내거나, 당분간은 직접 갖고 있겠다고 말하거나.
