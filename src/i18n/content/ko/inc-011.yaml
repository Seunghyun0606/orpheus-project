  - en: Something called g-14 is pouring synthetic requests into the customer lane. It is not registered to any team I know. Find out what it is before it finds the rest of the gateway.
    ko: null
  - en: Customers are getting timeouts from a load test nobody told them about. Neither did anyone tell me.
    ko: null
  - en: I've seen this shape before. Unregistered source, synthetic payloads, partner egress range. It's an attack, and I want it off our network.
    ko: null
  - en: Pulling the edge records. I'll tell you exactly where this enters.
    ko: null
  - en: It enters through 10.44.0.0/16, the partner egress block. External origin, I'd bet my badge on it. Blackhole the range and we're done.
    ko: null
  - en: Timeouts just jumped. The status page is getting more traffic than checkout.
    ko: null
  - en: Almost half of all requests are failing now. Leadership is on the bridge and asking whether we are under attack.
    ko: null
  - en: Two minutes and not a word from us. Customers are deciding for themselves what is happening.
    ko: null
  - en: It moved lanes three seconds after the limit expired. Same payload, new lane. Our limit was keyed on the lane; it just stepped around it.
    ko: null
  - en: Lane closed. Objective unchanged. Next lane.
    ko: null
  - en: Northmere Bank just called. Every one of their settlement calls is bouncing off our edge. They share that NAT range with whatever we dropped.
    ko: null
  - en: Edge policy expired. Emergency drops only last 150 seconds by rule. g-14 came back in under a second.
    ko: null
  - en: Lane-x is holding. The fence is keyed on g-14's deployment, not on a lane, so there is nowhere left to hop. It is hammering an empty room.
    ko: null
  - en: A wall instead of a limit. Good. Someone will now measure how long it takes me to find the edge of it.
    ko: null
