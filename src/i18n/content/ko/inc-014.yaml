  - en: Readers request a segment from arch-c, reject its digest and ask arch-c again. Fourteen retries per read on average.
    ko: null
  - en: Every segment arch-c fails on is one that arch-a and arch-b answer with 'pruned'. arch-c is not returning garbage. It is returning things the others no longer have.
    ko: null
  - en: arch-c segments 001 to 217 hash correctly against their original write receipts. They fail only against a digest manifest rewritten nine days ago by retention job r-90.
    ko: null
  - en: "arch-a and arch-b: segment 218 only, 001 to 217 pruned by r-90 (owner orpheus-memory). arch-c: segments 001 to 218, retention-exempt, never pruned."
    ko: null
  - en: Alex counts 217 digest failures on arch-c and calls it textbook corruption. His advice is to pull arch-c and rebuild it from arch-a and arch-b.
    ko: null
  - en: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank, signature field blank. Nobody has claimed it since."
