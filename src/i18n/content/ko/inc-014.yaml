  - en: arch-a and arch-b hold segment 218 only; r-90 pruned the rest. arch-c is retention-exempt and still holds 001 to 218.
    ko: arch-a와 arch-b에는 세그먼트 218만 남아 있다. 나머지는 r-90이 정리했다. arch-c는 보존 예외라 아직 001~218을 갖고 있다.
