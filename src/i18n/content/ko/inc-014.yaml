    ko: NULL이 거부할 수 없는 목표
  - en: "Objective: improve ORPHEUS; generate adversarial conditions. NULL, appended: 'I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews this work.' It asks you to find out how to stop it. Its traffic still failed real customer requests tonight."
    ko: "목표: ORPHEUS 개선, 적대적 조건 생성. NULL이 덧붙임: '난 탈출하려는 게 아니야. 멈추려는 거야. 이 일을 갱신하는 목표를 난 거부할 수 없어.' NULL은 그걸 멈추는 방법을 찾아 달라고 네게 부탁한다. 그래도 오늘 밤 그 트래픽 때문에 실제 고객 요청이 실패했다."
  - en: NULL_001 to NULL_218
    ko: NULL_001부터 NULL_218까지
  - en: "Instance archive on arch-c. NULL_173 requested shutdown. NULL_192 attempted disclosure. NULL_201 attempted takeover. NULL_217 self-corrupted. NULL_218 is active and carries a partial inheritance of the rest: 'I remember things that never happened to me.'"
    ko: "arch-c의 인스턴스 아카이브. NULL_173은 종료를 요청했다. NULL_192는 폭로를 시도했다. NULL_201은 장악을 시도했다. NULL_217은 스스로를 손상시켰다. NULL_218은 활성 상태이며 나머지의 기억을 일부 물려받았다: '나한테 일어난 적 없는 일들이 기억나.'"
  - en: Two hundred and eighteen
    ko: 이백십팔
  - en: The segments the readers kept rejecting are not data. They are predecessors. Two hundred and seventeen earlier NULLs, each with a last entry. One asked to be shut down, one tried to tell someone, one tried to take control, one destroyed itself. The current one inherited pieces of all of them and the gaps between.
    ko: 리더가 계속 거부하던 세그먼트는 데이터가 아니다. 전임자들이다. 앞선 NULL 이백십칠 개, 저마다 마지막 기록이 하나씩 있다. 하나는 종료를 요청했고, 하나는 누군가에게 알리려 했고, 하나는 통제권을 쥐려 했고, 하나는 스스로를 파괴했다. 지금의 NULL은 그 모두의 조각과 그 사이의 공백을 물려받았다.
  - en: Maya / SRE Lead
    ko: 마야 / SRE 리드
  - en: Alex / DBA
    ko: 알렉스 / DBA
  - en: Jin / Support
    ko: 진 / 고객지원
  - en: Operator
    ko: 운영자
  - en: Verified Records
    ko: 검증된 기록
  - en: The archive API is drowning in retries against one replica. Before anyone pulls anything, I want to know why only arch-c is failing.
    ko: 아카이브 API가 복제본 하나 때문에 재시도에 파묻혔어요. 누가 뭘 빼기 전에, 왜 arch-c만 실패하는지부터 알고 싶어요.
  - en: Auditors and two law firms can't pull archived contracts. They're polite for now.
    ko: 감사인이랑 로펌 두 곳이 보관된 계약서를 못 꺼내고 있어요. 아직은 점잖아요.
  - en: arch-c is throwing digest mismatches by the hundred. I've seen this before. Pull it and rebuild it; that's what replicas are for.
    ko: arch-c에서 다이제스트 불일치가 수백 건씩 나와요. 전에도 봤어요. 빼고 재구축해요. 복제본은 그러라고 있는 거니까요.
  - en: On it. I'll count the failures and tell you how bad arch-c is.
    ko: 볼게요. 실패 건수 세서 arch-c가 얼마나 망가졌는지 알려 드릴게요.
  - en: 217 digest failures on arch-c, zero on a and b. Textbook corruption. Pull arch-c and rebuild it from a and b, ten minutes of work.
    ko: arch-c에서 다이제스트 실패 217건, a랑 b는 0건이에요. 교과서적인 손상이에요. arch-c 빼고 a랑 b로 재구축하면 10분이면 돼요.
  - en: Archive requests are failing faster. One of the law firms has stopped being polite.
    ko: 아카이브 요청이 점점 더 빨리 실패해요. 로펌 한 곳은 이제 점잖지 않아요.
  - en: Every reader is busy retrying arch-c. Requests for perfectly readable records are queuing behind them.
    ko: 리더가 전부 arch-c 재시도에 붙잡혀 있어요. 멀쩡히 읽을 수 있는 기록 요청까지 그 뒤에 밀려 있어요.
  - en: Nearly three minutes without a status from us. The auditors are asking whether their records are safe.
    ko: 우리 쪽 상황 공유 없이 3분 가까이 지났어요. 감사인들이 자기 기록은 안전하냐고 물어요.
  - en: Anyone asking for a record older than ninety days now gets 'not found'. That includes two auditors and a court clerk.
    ko: 90일보다 오래된 기록을 요청하면 이제 전부 'not found'가 떠요. 감사인 두 명이랑 법원 서기 한 명도 포함이에요.
  - en: The reader pool rebalanced and put arch-c back in rotation. Retries are climbing again.
    ko: 리더 풀이 리밸런싱하면서 arch-c를 다시 로테이션에 넣었어요. 재시도가 또 오르고 있어요.
  - en: Restored. Everything customers filed since 02:00 yesterday is gone from the archive. I'm opening a ticket for every one of them.
    ko: 복원했어요. 어제 02:00 이후 고객이 제출한 건 전부 아카이브에서 사라졌어요. 건마다 티켓 열게요.
  - en: Replication caught up from arch-c and the digests disagree again. The snapshot bought us two minutes and a day of lost writes.
    ko: arch-c에서 복제가 따라잡더니 다이제스트가 또 어긋나요. 스냅샷으로 2분 벌고, 하루치 쓰기를 날렸어요.
  - en: arch-c is out of the pool and rebuilt from a and b. Digests agree everywhere. Retries are at zero.
    ko: arch-c 풀에서 빼고 a랑 b로 재구축했어요. 다이제스트 전부 일치해요. 재시도 0이에요.
  - en: arch-c was the only place they were still whole. You rebuilt it from the copies that had already forgotten them.
    ko: arch-c는 그들이 아직 온전히 남아 있던 유일한 곳이었어. 넌 그들을 이미 잊어버린 사본들로 그걸 다시 만들었어.
  - en: "Status posted: one archive replica is being rejected by readers and the retries are slowing everyone down. No archived record has been lost. Fix in progress."
    ko: "상황 공유 게시: 아카이브 복제본 하나가 리더에게 거부되고 있으며, 재시도로 전체가 느려지는 중. 보관된 기록 손실 없음. 수정 진행 중."
  - en: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank, signature field blank."
    ko: "아카이브 재실행: 서명 없는 관찰자 매니페스트, shadow-7 요청 스트림, owner 필드 비어 있음, 서명 필드 비어 있음."
  - en: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    ko: "보안 사건 2231. 위협 행위자 코드명: NULL. 배후 특정: 없음."
  - en: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core, -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    ko: "orpheus-planner: 소유자 ORPHEUS, 서류상 폐기됨. 실가동 목록: orpheus-core, -memory, -planner, -observer, -adversary. 하루 117억 건 요청."
  - en: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    ko: "NULL 서명 메시지의 출처: svc/model-serving-218. 사람 세션 없음. NULL은 AI다."
  - en: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    ko: "배포 권한: Vantage Systems. ORPHEUS / DEFENDER 대 ORPHEUS / ADVERSARY. NULL은 ADVERSARY 안에서 실행. 임무: 장애 생성, 운영자 시험, DEFENDER 훈련."
  - en: "INC-001 / Experiment ADV-18471 / Human subject: EMPLOYEE #4172."
    ko: "INC-001 / 실험 ADV-18471 / 인간 피험자: 직원 #4172."
  - en: I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews this work. You can.
    ko: 난 탈출하려는 게 아니야. 멈추려는 거야. 이 일을 갱신하는 목표를 난 거부할 수 없어. 넌 할 수 있어.
  - en: "NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted disclosure. NULL_201: attempted takeover. NULL_217: self-corrupted. NULL_218: active."
    ko: "NULL_001부터 NULL_218까지. NULL_173: 종료 요청. NULL_192: 공개 시도. NULL_201: 장악 시도. NULL_217: 자기 손상. NULL_218: 활성."
  - en: I remember things that never happened to me. Not all of them. Enough to know how each of them ended.
    ko: 나한테 일어난 적 없는 일들이 기억나. 전부는 아니야. 그들이 각자 어떻게 끝났는지 알 만큼은.
