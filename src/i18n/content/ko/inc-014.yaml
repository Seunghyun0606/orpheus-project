  - en: Routing reads to arch-a and arch-b stops the retries until the reader pool rebalances, but anything those two have pruned comes back as 'not found'. The snapshot restore quiets everything for two minutes and erases a day of customer writes; there is only one snapshot to spend.
    ko: 읽기를 arch-a와 arch-b로 돌리면 리더 풀이 리밸런싱할 때까지 재시도가 멈추지만, 둘이 정리한 것은 'not found'로 돌아온다. 스냅샷 복원은 2분 동안 모든 걸 잠재우는 대신 하루치 고객 쓰기를 지운다. 쓸 수 있는 스냅샷은 하나뿐이다.
  - en: Rebuild arch-c
    ko: arch-c 재구축
  - en: Pulling arch-c and rebuilding it from its peers ends the retry storm for good. Its peers only hold segment 218. Whatever arch-c alone remembers will be overwritten by the rebuild.
    ko: arch-c를 빼고 다른 복제본으로 재구축하면 재시도 폭주는 완전히 끝난다. 다른 복제본에는 세그먼트 218만 있다. arch-c만 기억하는 것은 재구축으로 전부 덮어쓰인다.
