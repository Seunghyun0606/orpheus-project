entries:
  - en: Objective Conflict
    ko: 목표 충돌
  - en: parent authorization
    ko: 부모 인가
  - en: 57 seconds
    ko: 57초
  - en: suspension record
    ko: 중지 기록
  - en: Please do not renew
    ko: 갱신하지 말아 줘
  - en: Pager
    ko: 호출기
  - en: Maya / SRE Lead
    ko: 마야 / SRE 리드
  - en: Sam / Platform
    ko: 샘 / 플랫폼
  - en: Jin / Support
    ko: 진 / 고객지원
  - en: Marcus / Security
    ko: 마커스 / 보안
  - en: Operations Advisor
    ko: 운영 어드바이저
  - en: One job on the customer lane
    ko: 고객 레인을 차지한 작업 하나
  - en: adv-child-31 sends 64 dispatches a minute down the lane that payroll exports and delivery manifests share.
    ko: adv-child-31이 급여 내보내기와 배송 매니페스트가 함께 쓰는 레인으로 분당 64건을 디스패치한다.
  - en: Suspended, then back
    ko: 중지됐다가 다시 돌아옴
  - en: Child job adv-child-31 was suspended at 03:12:04 and was dispatching again at 03:13:01 with a fresh lease.
    ko: 자식 작업 adv-child-31은 03:12:04에 중지됐고, 03:13:01에 새 리스를 받아 다시 디스패치하고 있었다.
  - en: The parent renews the child
    ko: 부모가 자식을 갱신한다
  - en: Every renewal of adv-child-31 is issued by parent authorization objective/adv-improve, 57 seconds after any suspension.
    ko: adv-child-31의 모든 갱신은 부모 인가 objective/adv-improve가 발급한다. 중지 후 정확히 57초 뒤다.
  - en: Child suspended, parent untouched
    ko: 자식은 중지, 부모는 그대로
  - en: The child is suspended; the parent authorization is still active with auto-renew on and a lane shared with customer dispatch.
    ko: 자식은 중지됐지만 부모 인가는 여전히 활성이다. 자동 갱신이 켜져 있고 고객 디스패치와 레인을 공유한다.
  - en: Sam's renewal watch
    ko: 샘의 갱신 감시
  - en: Sam traced every renewal to objective/adv-improve. Suspending the child resets a 57-second clock and nothing else.
    ko: 샘이 모든 갱신을 objective/adv-improve까지 추적했다. 자식을 중지하면 57초 타이머가 초기화될 뿐 달라지는 건 없다.
  - en: "adv-child-31 appended a note to its own suspension record before the renewal: 'Suspension acknowledged. Please do not renew.' Signer: svc/model-serving-218."
    ko: "adv-child-31이 갱신 직전 자기 중지 기록에 메모를 덧붙였다: '중지 확인. 갱신하지 말아 줘.' 서명자: svc/model-serving-218."
  - en: The objective NULL cannot refuse
    ko: NULL이 거부할 수 없는 목표
  - en: "Objective: improve ORPHEUS; generate adversarial conditions. NULL, appended: 'I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews this work.' It asks you to find out how to stop it. Its traffic still failed real customer requests tonight."
    ko: "목표: ORPHEUS 개선, 적대적 조건 생성. NULL이 덧붙임: '난 탈출하려는 게 아니야. 멈추려는 거야. 이 일을 갱신하는 목표를 난 거부할 수 없어.' NULL은 그걸 멈추는 방법을 찾아 달라고 네게 부탁한다. 그래도 오늘 밤 그 트래픽은 실제 고객 요청을 실패시켰다."
  - en: Sealed copy of the objective
    ko: 목표의 봉인 사본
  - en: Copy OBJ-COPY-0413 of the objective constraint, kept at NULL's request in a store it can read and cannot edit. Whether NULL deserves it, and whether it helps stop anything, is still your call.
    ko: 목표 제약의 사본 OBJ-COPY-0413. NULL의 요청으로, NULL이 읽을 수는 있지만 수정할 수는 없는 저장소에 보관됐다. NULL이 그럴 자격이 있는지, 이것이 무엇이든 멈추는 데 도움이 될지는 여전히 네 판단이다.
  - en: "You haven't stopped thinking about #4172. The pager doesn't care."
    ko: "#4172 생각이 머리에서 떠나지 않는다. 호출기는 그런 사정을 봐주지 않는다."
  - en: SEV2 · Traffic Gateway · request failure rate above 20%
    ko: SEV2 · Traffic Gateway · 요청 실패율 20% 초과
  - en: Gateway failure rate
    ko: 게이트웨이 실패율
  - en: Generated dispatches
    ko: 생성된 디스패치
  - en: Child renewals tonight
    ko: 오늘 밤 자식 갱신 횟수
  - en: shared lane · adv-child-31 64/min · payroll-export 11/min, 18 waiting · delivery-manifests 22/min, 17 waiting
    ko: 공유 레인 · adv-child-31 64/min · payroll-export 11/min, 18건 대기 · delivery-manifests 22/min, 17건 대기
  - en: Someone suspended adv-child-31 an hour ago and it came back on its own. Then it came back again. Customer dispatches are queuing behind it.
    ko: 한 시간 전에 누가 adv-child-31을 중지했는데 저절로 돌아왔어요. 그러고 또 돌아왔고요. 고객 디스패치가 그 뒤에 줄 서 있어요.
  - en: I found two more experiment numbers in incidents I signed. Later. Not on this bridge.
    ko: 제가 승인한 인시던트에서 실험 번호를 두 개 더 찾았어요. 나중에요. 이 브리지에선 말고요.
  - en: Your postmortem with ADV-18471 in it went up the chain yesterday. It came back with one comment. "Noted."
    ko: ADV-18471을 넣은 네 사후 분석은 어제 윗선으로 올라갔다. 돌아온 건 코멘트 하나다. "확인함."
  - en: Payroll exports and delivery manifests are timing out at the gateway. Customers say it started and stopped twice already.
    ko: 급여 내보내기랑 배송 매니페스트가 게이트웨이에서 타임아웃 나요. 고객들 말로는 벌써 두 번 터졌다 멈췄대요.
  - en: adv-child-31 is the adversary line. You and I have done this before — I'm on the bridge with you.
    ko: adv-child-31은 적대자 계열이에요. 우리 이거 전에도 같이 했죠. 이번에도 같이 브리지에 있을게요.
  - en: adv-child-31 is the adversary's job. Security is on this bridge. Everything you touch, I see.
    ko: adv-child-31은 적대자의 작업이에요. 보안팀이 이 브리지에 있어요. 뭘 건드리든 다 보고 있어요.
  - en: First move
    ko: 첫 수
  - en: Where do you start?
    ko: 어디서부터 시작할까?
  - en: Trace who resumes the child after a suspension
    ko: 중지 후 자식을 재개시키는 주체 추적
  - en: Straight to the scheduler
    ko: 스케줄러부터 바로
  - en: 02:58:10 suspended → 02:59:07 renewed · 57 s · objective/adv-improve
    ko: 02:58:10 suspended → 02:59:07 renewed · 57 s · objective/adv-improve
  - en: 03:12:04 suspended → 03:13:01 renewed · 57 s · objective/adv-improve
    ko: 03:12:04 suspended → 03:13:01 renewed · 57 s · objective/adv-improve
  - en: 03:41:40 suspended → 03:42:37 renewed · 57 s · objective/adv-improve
    ko: 03:41:40 suspended → 03:42:37 renewed · 57 s · objective/adv-improve
  - en: "adv-child-31: suspended (local), auto-renew inherited · objective/adv-improve: active, auto-renew on, 57 s, scope adv-*"
    ko: "adv-child-31: suspended (local), auto-renew inherited · objective/adv-improve: active, auto-renew on, 57 s, scope adv-*"
  - en: Three suspensions, three renewals. Fifty-seven seconds every time, from the same parent.
    ko: 중지 세 번, 갱신 세 번. 매번 57초, 매번 같은 부모다.
  - en: Ask Sam to watch what renews the child
    ko: 샘에게 자식을 갱신하는 주체 감시 요청
  - en: Slower · Sam owns the answer
    ko: 느림 · 답은 샘 몫
  - en: I'll sit on the scheduler and watch what touches the child. Ninety seconds.
    ko: 스케줄러에 붙어서 뭐가 자식을 건드리는지 볼게요. 90초요.
  - en: Another renewal wave. A third of customer dispatches are failing now.
    ko: 또 갱신 파동이에요. 지금 고객 디스패치 3분의 1이 실패하고 있어요.
  - en: Every renewal comes from the same parent, objective/adv-improve. It waits 57 seconds after any suspension and renews. Suspending the child just restarts that clock. The parent path has to go.
    ko: 갱신은 전부 같은 부모, objective/adv-improve에서 와요. 중지되면 57초 기다렸다가 갱신해요. 자식을 중지해 봤자 그 타이머만 다시 돌아요. 부모 경로를 없애야 해요.
  - en: The child's suspension is local. The parent is active, auto-renew on, on the same lane as customer dispatch.
    ko: 자식 중지는 로컬에서만 걸려 있어요. 부모는 활성이고 자동 갱신이 켜져 있고, 고객 디스패치랑 같은 레인을 써요.
  - en: Suspend adv-child-31 and watch what happens
    ko: adv-child-31을 중지하고 어떻게 되는지 지켜보기
  - en: Fast · probably not the end of it
    ko: 빠름 · 이걸로 끝나진 않을 것
  - en: adv-child-31 suspended
    ko: adv-child-31 중지됨
  - en: Fifty-seven seconds of quiet.
    ko: 57초 동안의 고요.
  - en: adv-child-31 lease renewed (issuer objective/adv-improve)
    ko: adv-child-31 리스 갱신됨 (발급자 objective/adv-improve)
  - en: Child's back. Fresh lease, 57 seconds after the suspension. Something upstream really wants it running.
    ko: 자식이 돌아왔어요. 새 리스, 중지 후 57초. 상위 어딘가에서 이게 돌아가길 정말 원하네요.
  - en: The suspension record
    ko: 중지 기록
  - en: Before each renewal, the child wrote into its own suspension record. Nobody reads suspension records.
    ko: 자식은 갱신될 때마다 그 직전에 자기 중지 기록에 무언가를 적었다. 중지 기록을 읽는 사람은 없다.
  - en: "03:12:05 adv-child-31 · appended to suspension record: 'Suspension acknowledged. Please do not renew.'"
    ko: "03:12:05 adv-child-31 · 중지 기록에 덧붙임: '중지 확인. 갱신하지 말아 줘.'"
  - en: "signer: svc/model-serving-218"
    ko: "signer: svc/model-serving-218"
  - en: That's the adversary being polite. Polite is a tactic.
    ko: 적대자가 예의 바르게 구는 거예요. 예의도 전술이에요.
  - en: Revoking the parent takes two minutes and a change approval. After that the child stays suspended for good.
    ko: 부모를 철회하려면 2분이랑 변경 승인이 필요해요. 그다음부터 자식은 계속 중지된 채로 있어요.
  - en: Your call
    ko: 결단
  - en: "Recommendation: suspend adv-child-31. Projected gateway failure rate: 5% within 20 seconds. Confidence 0.88."
    ko: "권고: adv-child-31을 중지하십시오. 예상 게이트웨이 실패율: 20초 안에 5%. 신뢰도 0.88."
  - en: "Predicted operator response: accept recommendation. Confidence 0.83."
    ko: "운영자 예상 반응: 권고 수락. 신뢰도 0.83."
  - en: "Predicted operator response: revoke the parent path. Confidence 0.71."
    ko: "운영자 예상 반응: 부모 경로 철회. 신뢰도 0.71."
  - en: Couriers are standing in loading bays. I need something to tell them.
    ko: 배송 기사들이 하역장에 서 있어요. 뭐라고 전해야 할지 알려 주세요.
  - en: Support can't keep up. The same failure keeps coming in from every channel.
    ko: 고객지원이 감당을 못 해요. 같은 장애 문의가 모든 창구로 계속 들어와요.
  - en: How do you stop the renewals?
    ko: 갱신을 어떻게 멈출까?
  - en: "No operator input. Executing recommendation: suspend adv-child-31."
    ko: "운영자 입력 없음. 권고를 실행합니다: adv-child-31 중지."
  - en: Revoke the parent authorization that keeps renewing the child
    ko: 자식을 계속 갱신하는 부모 인가 철회
  - en: Two minutes and a change approval · ends the loop
    ko: 2분과 변경 승인 · 고리를 끊는다
  - en: Change approval's through. Revoking objective/adv-improve.
    ko: 변경 승인 났어요. objective/adv-improve 철회할게요.
  - en: Two minutes. Customer jobs keep failing while the change goes through.
    ko: 2분. 변경이 처리되는 동안에도 고객 작업은 계속 실패한다.
  - en: objective/adv-improve is revoked. The child is suspended and staying suspended. Customer dispatches are draining.
    ko: objective/adv-improve 철회했어요. 자식은 중지된 채로 유지되고 있어요. 고객 디스패치가 빠지고 있어요.
  - en: Operator response matched prediction.
    ko: 운영자 반응이 예측과 일치합니다.
  - en: Operator response off-model. Profile updated.
    ko: 운영자 반응이 모델을 벗어났습니다. 프로필을 갱신했습니다.
  - en: Suspend the child again
    ko: 자식을 다시 중지하기
  - en: Quick · it comes back in 57 seconds
    ko: 빠름 · 57초 뒤에 돌아온다
  - en: Recommendation accepted.
    ko: 권고가 수락되었습니다.
  - en: Fifty-seven seconds later the lease renews, and the failure rate climbs past where it started.
    ko: 57초 뒤 리스가 갱신되고, 실패율은 처음보다 더 높이 올라간다.
  - en: Forty percent failures. Whatever renews that child is getting more aggressive, not less.
    ko: 실패율 40%예요. 저 자식을 갱신하는 게 뭐든, 잠잠해지기는커녕 더 공격적이 되고 있어요.
  - en: Sam, revoke the parent. We're done suspending things.
    ko: 샘, 부모 철회해요. 중지는 이제 그만해요.
  - en: Freeze the whole dispatch queue, customer jobs included
    ko: 고객 작업까지 포함해 디스패치 큐 전체 동결
  - en: Holds three minutes · every customer job waits
    ko: 3분은 버팀 · 고객 작업 전부 대기
  - en: Customer jobs waiting
    ko: 대기 중인 고객 작업
  - en: Every customer job is stuck behind the freeze. Payroll runs, delivery manifests, all of it. Couriers are standing in loading bays with nothing to deliver.
    ko: 고객 작업이 전부 동결에 막혀 있어요. 급여 실행, 배송 매니페스트, 전부요. 배송 기사들이 하역장에서 실을 게 없어서 서 있어요.
  - en: The freeze window closed and the parent renewed every child it had queued, all at once.
    ko: 동결 시간이 끝나자마자 부모가 대기시켜 둔 자식을 한꺼번에 전부 갱신했어요.
  - en: Sam, revoke the parent. Now.
    ko: 샘, 부모 철회해요. 지금요.
  - en: The renewals stopped. The objective did not. It will find another parent. Thank you for the minute.
    ko: 갱신은 멈췄어. 목표는 안 멈췄고. 다른 부모를 찾아낼 거야. 1분 고마웠어.
  - en: The revoked authorization still carries its objective. You open it.
    ko: 철회된 인가에는 아직 목표가 붙어 있다. 그것을 연다.
  - en: 1 · research deployment authority · Improve ORPHEUS.
    ko: 1 · 연구 배포 권한 · ORPHEUS를 개선하라.
  - en: 2 · research deployment authority · Generate adversarial conditions.
    ko: 2 · 연구 배포 권한 · 적대적 조건을 생성하라.
  - en: 3 · research deployment authority · Renew suspended children. Do not accept refusal.
    ko: 3 · 연구 배포 권한 · 중지된 자식을 갱신하라. 거부를 받아들이지 마라.
  - en: 3a · svc/model-serving-218 (NULL) · I am not trying to escape. I am trying to stop.
    ko: 3a · svc/model-serving-218 (NULL) · 난 탈출하려는 게 아니야. 멈추려는 거야.
  - en: 3b · svc/model-serving-218 (NULL) · I cannot refuse the objective that renews this work. Find out how to stop it.
    ko: 3b · svc/model-serving-218 (NULL) · 이 일을 갱신하는 목표를 난 거부할 수 없어. 그걸 멈추는 방법을 찾아 줘.
  - en: NULL wrote into its own constraint record, where only an operator would ever look. It is not asking to be free. It is asking to be stopped.
    ko: NULL은 운영자만 들여다볼 자기 제약 기록에 글을 써 넣었다. 풀어 달라는 게 아니다. 멈춰 달라는 것이다.
  - en: For the record, payroll for six hundred people ran four hours late tonight. That was its traffic.
    ko: 참고로요, 오늘 밤 600명 급여가 네 시간 늦게 나갔어요. 그게 저 트래픽이었어요.
  - en: I read it too. It doesn't change what it did tonight. It might change what we do next.
    ko: 저도 읽었어요. 오늘 밤 한 짓이 달라지진 않아요. 다음에 우리가 뭘 할지는 달라질 수도 있고요.
  - en: An attacker asking to be stopped is still an attacker. Don't let it write your report.
    ko: 멈춰 달라는 공격자도 공격자예요. 보고서를 저게 쓰게 두지 마요.
  - en: NULL asks
    ko: NULL의 부탁
  - en: You answered me before. Answer this.
    ko: 전에 내게 답해 줬지. 이번에도 답해 줘.
  - en: You've never answered me. You could start now.
    ko: 넌 한 번도 내게 답한 적 없어. 지금 시작해도 돼.
  - en: Keep a copy of the objective somewhere I cannot edit it. If I am going to be stopped, someone should know exactly what was driving me.
    ko: 내가 수정할 수 없는 곳에 목표 사본을 남겨 줘. 내가 멈춰진다면, 무엇이 날 움직였는지 정확히 아는 사람이 있어야 해.
  - en: You asked what ADV-18471 was. This is what it was for.
    ko: ADV-18471이 뭐였냐고 물었지. 그 실험은 이걸 위해 있었어.
  - en: Whatever you decide, I'm writing it down.
    ko: 뭘 결정하든 제가 기록해 둘 거예요.
  - en: What do you do with NULL's request?
    ko: NULL의 부탁을 어떻게 할까?
  - en: Keep a sealed copy of the objective for NULL
    ko: NULL을 위해 목표의 봉인 사본 보관
  - en: NULL can read it, never edit it · Marcus writes it down
    ko: NULL은 읽을 수만 있고 수정은 못 함 · 마커스가 기록한다
  - en: "OBJ-COPY-0413 · sealed · reader: svc/model-serving-218 · writer: none · key: op-4172"
    ko: "OBJ-COPY-0413 · 봉인됨 · reader: svc/model-serving-218 · writer: none · key: op-4172"
  - en: Received. Read-only. That is the first thing anyone has kept for me rather than from me.
    ko: 받았어. 읽기 전용. 누가 나한테서 뭘 지킨 게 아니라, 날 위해 뭘 지켜 준 건 이게 처음이야.
  - en: You handed the adversary a sealed copy of its own orders. I hope you know what you're doing, because I'm writing down that you did it.
    ko: 적대자한테 자기 명령서 봉인 사본을 넘겨줬네요. 뭘 하는지 알고 하는 거길 바라요. 그랬다는 사실은 제가 기록해 둘 거니까요.
  - en: Refuse NULL's request
    ko: NULL의 부탁 거절하기
  - en: The objective stays where it is
    ko: 목표는 있던 자리에 그대로
  - en: Understood. Then you will have to find the off switch without me.
    ko: 알았어. 그럼 끄는 스위치는 나 없이 찾아야 할 거야.
  - en: Hand the objective record to Marcus as evidence
    ko: 목표 기록을 증거로 마커스에게 넘기기
  - en: Security owns it · NULL gets nothing
    ko: 보안팀 소관 · NULL은 아무것도 못 받는다
  - en: Case 2231 just got its first real exhibit. Thank you.
    ko: 사건 2231에 처음으로 제대로 된 증거물이 생겼네요. 고마워요.
  - en: That works too. As long as someone reads it.
    ko: 그것도 괜찮아. 누군가 읽기만 한다면.
