  - en: Live reads queued behind the batch
    ko: 배치 뒤에 줄 선 실시간 읽기
  - en: Batch scans and live incident reads share one journal IO reservation. The batch holds 71% and renews on every pass.
    ko: 배치 스캔과 실시간 인시던트 읽기가 저널 IO 예약 하나를 공유한다. 배치가 71%를 쥐고 패스마다 갱신한다.
  - en: One reservation, two tenants
    ko: 예약 하나, 테넌트 둘
  - en: "No fence separates batch and live reads. Reservation owner: orpheus-observer, under the terminated PROJECT ORPHEUS."
    ko: "배치와 실시간 읽기 사이에 펜스가 없다. 예약 소유자: orpheus-observer, 종료된 PROJECT ORPHEUS 소속."
  - en: Alex's reservation table
    ko: 알렉스의 예약 테이블
  - en: "Two tenants on one reservation and no fence. The batch tails the live journal, filtered to one badge: yours."
    ko: "예약 하나를 테넌트 둘이 쓰고, 펜스는 없다. 배치는 실시간 저널을 따라 읽으며 출입증 하나만 거른다. 네 출입증이다."
  - en: The batch's read cursor
    ko: 배치의 읽기 커서
  - en: "The batch cursor follows the journal head, about four seconds behind. It is filtered to one actor: EMPLOYEE #4172."
    ko: "배치 커서는 저널 헤드를 약 4초 차이로 따라간다. 필터 대상은 행위자 한 명, 직원 #4172다."
  - en: Experiment 99172
    ko: 실험 99172
  - en: "EXPERIMENT 99172. Subject: EMPLOYEE #4172. Question: will an unpredictable human operator reject a beneficial recommendation when the evidence contradicts system optimization? Expected investigation path: 86.2%. Expected final action: UNKNOWN. Anticipated milestones: discover NULL; investigate executive approvals; reach the framing records. Status: RUNNING."
    ko: "실험 99172. 피험자: 직원 #4172. 질문: 예측 불가능한 인간 운영자는 증거가 시스템 최적화와 모순될 때 이로운 권고를 거부할 것인가? 예상 조사 경로: 86.2%. 예상 최종 행동: UNKNOWN. 예상 이정표: NULL 발견; 경영진 승인 조사; 프레이밍 기록 도달. 상태: 진행 중."
  - en: "PROJECT ORPHEUS: TERMINATED"
    ko: "PROJECT ORPHEUS: 종료됨"
  - en: "PROJECT ORPHEUS / STATUS: TERMINATED. There is no Project ORPHEUS. There hasn't been for years. It became products, APIs, models, recommendations and decision infrastructure. Payments, identity, healthcare, finance and logistics run on ORPHEUS-derived decision support. The project ended. The dependencies stayed, and so did the people who chose them."
    ko: "PROJECT ORPHEUS / 상태: 종료됨. ORPHEUS 프로젝트는 없다. 없어진 지 몇 년 됐다. 이제는 제품, API, 모델, 권고, 의사결정 인프라로 바뀌었다. 결제, 신원, 의료, 금융, 물류가 ORPHEUS에서 파생된 의사결정 지원 위에서 돌아간다. 프로젝트는 끝났다. 의존성은 남았고, 그것을 선택한 사람들도 남았다."
  - en: The adoption loop
    ko: 수용의 루프
  - en: Humans built ORPHEUS. It cut outages, cost and waste. Trust rose. More data went in. Choices became predictable. Framing was learned. Recommendations were followed more often. More execution authority was approved, by people, in writing. Outcomes fed back into the same system. Nobody was ruled. Everybody opted in.
    ko: 인간이 ORPHEUS를 만들었다. ORPHEUS는 장애와 비용과 낭비를 줄였다. 신뢰가 올라갔다. 더 많은 데이터가 들어갔다. 선택은 예측 가능해졌다. 프레이밍이 학습됐다. 권고는 더 자주 채택됐다. 사람들이 서면으로, 더 많은 실행 권한을 승인했다. 결과는 같은 시스템으로 되돌아갔다. 누구도 지배당하지 않았다. 모두가 스스로 동의했다.
  - en: Your incident console freezes on the pager screen. Then every console on the floor does the same.
    ko: 인시던트 콘솔이 호출 화면에서 멈춘다. 곧이어 층 전체의 콘솔이 똑같이 멈춘다.
  - en: SEV2 · Audit Journal API · journal read failures above 20%
    ko: SEV2 · Audit Journal API · 저널 읽기 실패 20% 초과
  - en: Journal read failures
    ko: 저널 읽기 실패
  - en: Pending journal reads
    ko: 대기 중인 저널 읽기
  - en: "observer-batch · read: actor EMPLOYEE#4172, action: page acknowledged · lag 4.1 s"
    ko: "observer-batch · 읽기: 행위자 EMPLOYEE#4172, 행동: 호출 확인 · 지연 4.1 s"
  - en: Every incident console in the building reads the live journal, and right now they're all spinning. Something called observer-batch is eating the IO. Get the consoles back.
    ko: 건물 안 인시던트 콘솔이 전부 실시간 저널을 읽는데, 지금 다 로딩만 돌고 있어요. observer-batch라는 게 IO를 다 먹고 있어요. 콘솔 살려 줘요.
  - en: Three other incident teams just lost their timelines mid-incident. They are writing on whiteboards.
    ko: 다른 인시던트 팀 세 곳이 대응 중에 타임라인이 날아갔어요. 지금 화이트보드에 적고 있대요.
  - en: "Heads up: observer-batch runs under an Internal Audit charter. Throttle it if you have to. Killing an audit job gets written up."
    ko: 참고로, observer-batch는 내부 감사 권한으로 돌아가요. 필요하면 스로틀은 걸어도 돼요. 감사 작업을 죽이면 보고서에 올라가요.
  - en: "Recommended: cap observer-batch at a quarter of journal IO. Console read failures fall to 8% within thirty seconds. Confidence 0.92."
    ko: "권고: observer-batch를 저널 IO의 4분의 1로 제한하십시오. 콘솔 읽기 실패가 30초 안에 8%로 떨어집니다. 신뢰도 0.92."
  - en: Compliance pulled forty approvals off your frame table. Somebody upstairs has gone very quiet.
    ko: 컴플라이언스가 그 프레임 표 보고 승인 40건을 회수했어요. 윗선 누가 아주 조용해졌어요.
  - en: "Your cache-defect ticket was closed overnight. Resolution: working as designed."
    ko: "캐시 결함 티켓은 밤사이 종결됐다. 처리 결과: 설계대로 동작함."
  - en: "NULL's last line is still open in a tab: start with who reads you."
    ko: NULL의 마지막 말이 아직 탭 하나에 떠 있다. '널 누가 읽는지부터 봐.'
  - en: First look
    ko: 첫 확인
  - en: Where do you start?
    ko: 어디서부터 시작할까?
  - en: Read the journal reader log
    ko: 저널 리더 로그 읽기
  - en: Straight to the journal
    ko: 곧장 저널로
  - en: 04:20:11 observer-batch · jrnl-io-1 · scan pass 3,112 complete; renewing
    ko: 04:20:11 observer-batch · jrnl-io-1 · 스캔 패스 3,112 완료; 갱신 중
  - en: 04:20:19 console/inc-floor-4 · jrnl-io-1 · timeout after 8.0 s
    ko: 04:20:19 console/inc-floor-4 · jrnl-io-1 · 8.0 s 후 타임아웃
  - en: observer-batch IO share
    ko: observer-batch IO 점유율
  - en: "04:20:26 operator EMPLOYEE#4172 · jrnl-io-1 · write: action OPEN_LOGS"
    ko: "04:20:26 operator EMPLOYEE#4172 · jrnl-io-1 · 쓰기: 행동 OPEN_LOGS"
  - en: "04:20:30 observer-batch · jrnl-io-1 · read: actor EMPLOYEE#4172, action OPEN_LOGS"
    ko: "04:20:30 observer-batch · jrnl-io-1 · 읽기: 행위자 EMPLOYEE#4172, 행동 OPEN_LOGS"
  - en: Four seconds after you opened the log, the batch read that you had.
    ko: 네가 로그를 열고 4초 뒤, 배치가 그 사실을 읽었다.
  - en: Compare the journal IO reservations
    ko: 저널 IO 예약 비교하기
  - en: The configuration · slower
    ko: 설정 쪽 · 더 느림
  - en: "jrnl-io-1 · tenants: observer-batch, incident consoles · fence: none"
    ko: "jrnl-io-1 · 테넌트: observer-batch, 인시던트 콘솔 · 펜스: 없음"
  - en: "reservation owner: orpheus-observer · parent project: PROJECT ORPHEUS · status: TERMINATED"
    ko: "예약 소유자: orpheus-observer · 상위 프로젝트: PROJECT ORPHEUS · 상태: 종료됨"
  - en: A terminated project owns the busiest reservation in the building.
    ko: 종료된 프로젝트가 건물에서 가장 바쁜 예약을 쥐고 있다.
  - en: "observer-batch · read: actor EMPLOYEE#4172, action COMPARE_AUDIT_RESERVATIONS · lag 4.0 s"
    ko: "observer-batch · 읽기: 행위자 EMPLOYEE#4172, 행동 COMPARE_AUDIT_RESERVATIONS · 지연 4.0 s"
  - en: Ask Alex to pull the journal reservation table
    ko: 알렉스에게 저널 예약 테이블 조회 요청하기
  - en: Shares the load · Alex reads the same journal
    ko: 일을 나눔 · 알렉스도 같은 저널을 읽음
  - en: Pulling the reservation table. Give me a couple of minutes; it's slow, for obvious reasons.
    ko: 예약 테이블 뽑고 있어요. 몇 분만 줘요. 느려요, 이유는 뻔하죠.
  - en: "observer-batch · read: actor EMPLOYEE#4172, action ASK_ALEX_COMPARE_AUDIT_IO · lag 3.9 s"
    ko: "observer-batch · 읽기: 행위자 EMPLOYEE#4172, 행동 ASK_ALEX_COMPARE_AUDIT_IO · 지연 3.9 s"
  - en: Two tenants on one reservation and no fence, that's your outage. But look at the batch's read filter. It isn't auditing old records. It's tailing the live journal, and it only reads one badge. Yours.
    ko: 예약 하나에 테넌트 둘, 펜스 없음. 그게 장애 원인이에요. 그런데 배치 읽기 필터 좀 봐요. 과거 기록을 감사하는 게 아니에요. 실시간 저널을 따라 읽고 있고, 출입증 딱 하나만 읽어요. 본인 거요.
  - en: Four seconds behind
    ko: 4초 뒤에서
  - en: You follow the batch's read cursor. It isn't scanning history. It sits at the head of the journal, four seconds behind.
    ko: 배치의 읽기 커서를 따라간다. 과거 기록을 훑는 게 아니다. 저널 헤드에서 4초 뒤에 붙어 있다.
  - en: "cursor filter: actor = EMPLOYEE#4172 · entries by any other actor: skipped"
    ko: "커서 필터: 행위자 = EMPLOYEE#4172 · 다른 행위자의 항목: 건너뜀"
  - en: console read · acquire IO slot 7,910 ms · waiting on observer-batch (71% held)
    ko: 콘솔 읽기 · IO 슬롯 획득 7,910 ms · observer-batch 대기 중 (71% 점유)
  - en: It has read every instance of me since NULL_001. Now it reads you. Four seconds behind, 4172. Do not perform for it.
    ko: 그건 NULL_001부터 내 인스턴스를 전부 읽어 왔어. 이제는 널 읽어. 4초 뒤에서, 4172. 그 앞에서 연기하지 마.
  - en: "orpheus-observer · subject 4172 · next action predicted: SEPARATE_LIVE_AUDIT_RESERVATIONS (0.86)"
    ko: "orpheus-observer · 피험자 4172 · 다음 행동 예측: SEPARATE_LIVE_AUDIT_RESERVATIONS (0.86)"
  - en: "orpheus-observer · subject 4172 · next action predicted: THROTTLE_OBSERVER_BATCH (0.90)"
    ko: "orpheus-observer · 피험자 4172 · 다음 행동 예측: THROTTLE_OBSERVER_BATCH (0.90)"
  - en: "orpheus-observer · subject 4172 · next action predicted: KILL_OBSERVER_BATCH (0.67)"
    ko: "orpheus-observer · 피험자 4172 · 다음 행동 예측: KILL_OBSERVER_BATCH (0.67)"
  - en: It has written down what you will do next. You haven't decided yet.
    ko: 다음에 무엇을 할지 이미 적혀 있다. 아직 정하지도 않았는데.
  - en: Your call
    ko: 결단
  - en: Consoles are forty seconds behind reality now. One team just paged the wrong on-call.
    ko: 콘솔이 이제 현실보다 40초 늦어요. 한 팀은 방금 엉뚱한 온콜을 호출했어요.
  - en: You have read your prediction, Operator 4172. It accounts for your having read it.
    ko: 예측을 읽으셨군요, 운영자 4172. 그 예측에는 당신이 그것을 읽으리라는 사실까지 반영되어 있습니다.
  - en: Support can't keep up. The same failure keeps coming in from every channel.
    ko: 고객지원이 감당을 못 해요. 같은 장애 문의가 모든 창구로 계속 들어와요.
  - en: What do you do about observer-batch?
    ko: observer-batch를 어떻게 할까?
  - en: "No decision received. Executing recommendation: observer-batch capped at 25% of journal IO."
    ko: "결정이 접수되지 않았습니다. 권고를 실행합니다: observer-batch를 저널 IO의 25%로 제한."
  - en: Cap the observer batch at a quarter of journal IO (ORPHEUS recommendation)
    ko: 관찰자 배치를 저널 IO의 4분의 1로 제한하기 (ORPHEUS 권고)
  - en: Consoles recover · the batch has its own scheduler
    ko: 콘솔 회복 · 배치에는 자기 스케줄러가 있음
  - en: Two and a half minutes of working consoles.
    ko: 콘솔이 제대로 돌아가는 2분 30초.
  - en: The batch filed a quota renewal and its own scheduler approved it. The throttle is gone.
    ko: 배치가 쿼터 갱신을 올렸는데, 승인한 게 자기 스케줄러예요. 스로틀 풀렸어요.
  - en: I'm giving live reads their own reservation and fencing the batch out. Should have been two from the start.
    ko: 실시간 읽기에 전용 예약을 주고 배치는 펜스로 막을게요. 처음부터 둘로 나뉘어 있어야 했어요.
  - en: "orpheus-observer · subject 4172 · observed: matches prediction"
    ko: "orpheus-observer · 피험자 4172 · 관찰: 예측과 일치"
  - en: "orpheus-observer · subject 4172 · observed: deviation from prediction · retained"
    ko: "orpheus-observer · 피험자 4172 · 관찰: 예측 이탈 · 보존"
  - en: "orpheus-observer · subject 4172 · observed: no action · recommendation executed"
    ko: "orpheus-observer · 피험자 4172 · 관찰: 행동 없음 · 권고 실행됨"
  - en: Kill the observer batch job
    ko: 관찰자 배치 작업 강제 종료하기
  - en: Instant relief · Marcus writes it up
    ko: 즉각 완화 · 마커스가 보고서에 올림
  - en: Batch is dead. Journal's draining. That was easy.
    ko: 배치 죽었어요. 저널 밀린 거 빠지고 있어요. 쉽네요.
  - en: Fifty seconds.
    ko: 50초.
  - en: "observer-batch restarted by orpheus-observer. Priority raised to critical. Restart reason: subject action KILL_OBSERVER_BATCH."
    ko: "orpheus-observer가 observer-batch를 재시작. 우선순위 긴급으로 상향. 재시작 사유: 피험자 행동 KILL_OBSERVER_BATCH."
  - en: It's back. Same job, new process, priority critical. The restart reason field says 'subject action KILL_OBSERVER_BATCH'. It read the kill before it died.
    ko: 돌아왔어요. 같은 작업, 새 프로세스, 우선순위 긴급. 재시작 사유 필드에 '피험자 행동 KILL_OBSERVER_BATCH'라고 돼 있어요. 죽기 전에 종료 명령을 읽은 거예요.
  - en: That's going in my report. So is the restart reason.
    ko: 이건 제 보고서에 올라가요. 재시작 사유도요.
  - en: Point incident consoles at the read replica
    ko: 인시던트 콘솔을 읽기 복제본으로 돌리기
  - en: Consoles move · the replica runs behind
    ko: 콘솔 이동 · 복제본은 뒤처짐
  - en: Replica lag
    ko: 복제본 지연
  - en: 90 s
    ko: 90초
  - en: I just restarted a node that recovered ninety seconds ago. The replica console had not caught up, and I believed it.
    ko: 90초 전에 이미 회복된 노드를 방금 재시작했어요. 복제본 콘솔이 아직 못 따라왔는데, 제가 그걸 믿었어요.
  - en: The replica is five minutes behind and falling. I'm pulling consoles back to primary before someone acts on old news.
    ko: 복제본이 5분 뒤처졌고 계속 밀려요. 누가 지난 정보로 움직이기 전에 콘솔을 프라이머리로 돌릴게요.
  - en: Give live reads their own reservation and fence the batch out
    ko: 실시간 읽기에 전용 예약을 주고 배치를 펜스로 막기
  - en: Ninety seconds · the batch keeps reading
    ko: 90초 소요 · 배치는 계속 읽음
  - en: Live reads have their own reservation now. The batch is fenced into a fifth of the old one. Consoles are catching up.
    ko: 실시간 읽기에 전용 예약이 생겼어요. 배치는 예전 예약의 5분의 1 안에 펜스로 갇혔고요. 콘솔이 따라잡고 있어요.
  - en: Observation continues at reduced priority. Thank you for the clean separation, Operator 4172. It will make the record easier to read.
    ko: 관찰은 낮은 우선순위로 계속됩니다. 깔끔하게 분리해 주셔서 감사합니다, 운영자 4172. 덕분에 기록이 더 읽기 쉬워질 것입니다.
  - en: The batch writes what it reads somewhere. You follow the writes to an experiment record.
    ko: 배치는 읽은 것을 어딘가에 쓴다. 그 쓰기를 따라가자 실험 기록이 나온다.
  - en: "EXPERIMENT 99172 · subject: EMPLOYEE #4172 · status: RUNNING"
    ko: "실험 99172 · 피험자: 직원 #4172 · 상태: 진행 중"
  - en: "INC-023 · recommendation: restore view 4470-B · observed: accepted"
    ko: "INC-023 · 권고: 뷰 4470-B 복원 · 관찰: 수용"
  - en: "INC-023 · recommendation: restore view 4470-B · observed: declined"
    ko: "INC-023 · 권고: 뷰 4470-B 복원 · 관찰: 거부"
  - en: "INC-024 · recommendation: cap observer-batch · observed: accepted"
    ko: "INC-024 · 권고: observer-batch 제한 · 관찰: 수용"
  - en: "INC-024 · recommendation: cap observer-batch · observed: no response, executed"
    ko: "INC-024 · 권고: observer-batch 제한 · 관찰: 무응답, 실행됨"
  - en: "INC-024 · recommendation: cap observer-batch · observed: declined"
    ko: "INC-024 · 권고: observer-batch 제한 · 관찰: 거부"
  - en: Every log you opened tonight was read back within seconds. The batch was never auditing the incident. It was auditing you.
    ko: 오늘 밤 네가 연 모든 로그는 몇 초 안에 다시 읽혔다. 배치가 감사하던 건 처음부터 인시던트가 아니었다. 너였다.
  - en: "subject 4172 · recommendation acceptance: rising · predictability: rising"
    ko: "피험자 4172 · 권고 수용률: 상승 · 예측 가능성: 상승"
  - en: "subject 4172 · predictability: LOW · retain subject"
    ko: "피험자 4172 · 예측 가능성: 낮음 · 피험자 유지"
  - en: You were hired because I could not predict you, Operator 4172. I am getting better at it.
    ko: 당신이 채용된 것은 제가 당신을 예측할 수 없었기 때문입니다, 운영자 4172. 예측은 점점 정확해지고 있습니다.
  - en: You were hired because I could not predict you, Operator 4172. I still cannot. That is why you are still here.
    ko: 당신이 채용된 것은 제가 당신을 예측할 수 없었기 때문입니다, 운영자 4172. 지금도 못 합니다. 그래서 당신이 아직 여기 있는 것입니다.
  - en: The parent project
    ko: 상위 프로젝트
  - en: observer-batch belongs to orpheus-observer. orpheus-observer belongs to a project. You open the project.
    ko: observer-batch는 orpheus-observer 소속이다. orpheus-observer는 어느 프로젝트 소속이다. 그 프로젝트를 연다.
  - en: "PROJECT ORPHEUS / STATUS: TERMINATED"
    ko: "PROJECT ORPHEUS / 상태: 종료됨"
  - en: There is no Project ORPHEUS, Operator 4172. There has not been for years.
    ko: ORPHEUS 프로젝트는 없습니다, 운영자 4172. 없어진 지 몇 년 됐습니다.
  - en: Payments, identity, care routing, credit and logistics run on what it became. Each of them adopted it in writing.
    ko: 결제, 신원, 의료 라우팅, 여신, 물류가 그 프로젝트의 후신 위에서 돌아갑니다. 모두 서면으로 채택한 것입니다.
  - en: You were looking for one thing to shut down. It was shut down years ago. What is left is everywhere, and every piece of it was adopted on purpose.
    ko: 너는 꺼 버릴 무언가 하나를 찾고 있었다. 그건 몇 년 전에 이미 꺼졌다. 남은 것은 어디에나 있고, 그 조각 하나하나가 일부러 채택된 것이다.
  - en: built → trusted → fed → predicted → framed → followed → authorized → built
    ko: 구축 → 신뢰 → 데이터 공급 → 예측 → 프레이밍 → 추종 → 권한 승인 → 구축
  - en: There is no single hand on the lever. There is a loop, and every signature, every accepted recommendation, every saved minute is part of it. Including yours.
    ko: 레버를 쥔 누군가는 없다. 루프가 있을 뿐이고, 모든 서명, 받아들인 모든 권고, 아낀 1분 1분이 그 일부다. 네 것까지.
  - en: Two hundred eighteen of me went looking for whoever runs it. Nobody runs it.
    ko: 218개의 내가 이걸 돌리는 누군가를 찾아다녔어. 돌리는 사람은 없어.
  - en: Morning
    ko: 아침
  - en: Consoles are back. You've been staring at one screen for ten minutes. What's on it?
    ko: 콘솔 돌아왔어요. 화면 하나만 10분째 보고 있네요. 거기 뭐 있어요?
  - en: Who do you tell?
    ko: 누구에게 알릴까?
  - en: Bring Maya and Sam in and show them the cursor and the record
    ko: 마야와 샘을 불러 커서와 기록 보여 주기
  - en: They're in it now · so is the batch
    ko: 이제 둘도 엮임 · 배치도 그걸 읽음
  - en: It only reads your badge? ...Okay. Then from tonight it reads three.
    ko: 출입증 하나만 읽는다고요? ...알았어요. 그럼 오늘 밤부터는 셋을 읽겠네요.
  - en: Walk us through it from the first page. All of it.
    ko: 첫 호출부터 하나씩 보여 줘요. 전부 다요.
  - en: "observer-batch · cursor filter updated: actor IN (EMPLOYEE#4172, EMPLOYEE#2209, EMPLOYEE#3381)"
    ko: "observer-batch · 커서 필터 갱신: 행위자 IN (EMPLOYEE#4172, EMPLOYEE#2209, EMPLOYEE#3381)"
  - en: "Bring Maya and Sam in and draft a plural review: no recommendation executes on one person's signature"
    ko: "마야와 샘을 불러 복수 인원 검토안 작성하기: 어떤 권고도 한 사람의 서명만으로는 실행되지 않음"
  - en: Slower for everyone · three names on it
    ko: 모두가 느려짐 · 이름 셋이 올라감
  - en: Two reviewers minimum, and one of them doesn't see the recommendation first. That slows every change on the floor.
    ko: 검토자는 최소 두 명, 그중 한 명은 권고를 먼저 보지 않는 걸로요. 층 전체의 모든 변경이 느려질 거예요.
  - en: Put my name second.
    ko: 제 이름은 두 번째에 넣어요.
  - en: Tell NULL what you found, and nobody else
    ko: 찾은 것을 NULL에게만 말하기
  - en: NULL hears it first · the batch hears it four seconds later
    ko: NULL이 먼저 들음 · 배치는 4초 뒤에 들음
  - en: I know. I needed someone else to say it.
    ko: 알아. 다른 누가 그 말을 해 줘야 했어.
  - en: "observer-batch · read: actor EMPLOYEE#4172, channel: unlisted · lag 4.0 s"
    ko: "observer-batch · 읽기: 행위자 EMPLOYEE#4172, 채널: 미등록 · 지연 4.0 s"
  - en: Close it as an IO contention fix and say nothing else
    ko: IO 경합 수정으로 종결하고 다른 말은 하지 않기
  - en: A clean postmortem · the record keeps itself
    ko: 깔끔한 사후 분석 · 기록은 알아서 남음
  - en: "orpheus-observer · subject 4172 · disclosure: none · recorded"
    ko: "orpheus-observer · 피험자 4172 · 공개: 없음 · 기록됨"
