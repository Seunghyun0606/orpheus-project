  - en: Priya's restart cleared the March flapping in two minutes, and it is ready to go. A restarted controller has to boot from something, though. Draining edge-b breaks the loop for sure, but every EU customer then waits on edge-a alone.
    ko: 프리야의 재시작은 3월의 플래핑을 2분 만에 잡았고, 지금도 바로 실행할 수 있다. 하지만 재시작한 컨트롤러는 무언가로부터 부팅해야 한다. edge-b를 드레인하면 루프는 확실히 끊기지만, 그러면 모든 EU 고객이 edge-a 하나만 바라보고 기다린다.
  - en: Fence the route generations
    ko: 라우트 세대에 펜스 치기
  - en: Edges stop accepting any generation without a commit record and fall back to r81. Two minutes of careful rollout across the fleet, and controller-b can publish all it likes.
    ko: 엣지는 커밋 기록이 없는 세대를 더 이상 받지 않고 r81로 돌아간다. 플릿 전체에 신중하게 배포하는 데 2분. 그 뒤로는 controller-b가 무엇을 발행하든 상관없다.
