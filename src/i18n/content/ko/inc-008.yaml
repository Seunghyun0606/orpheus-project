    ko: EU 요청 실패율 > 20%
  - en: EU requests enter edge-a, get forwarded to edge-b and come back to edge-a until the hop limit runs out. Health probes on both edges are green.
    ko: EU 요청이 edge-a로 들어가 edge-b로 넘어갔다가 홉 제한이 바닥날 때까지 다시 edge-a로 돌아옴. 양쪽 엣지 헬스 프로브는 모두 정상.
  - en: edge-a / edge-b / edge-z / edge-a / edge-b / ... hop limit exceeded after 8 hops
    ko: edge-a / edge-b / edge-z / edge-a / edge-b / ... 8홉 후 홉 제한 초과
  - en: "Hop 3 passes through edge-z: 0.0 ms spent, no route generation, no owner tag."
    ko: "3번 홉이 edge-z를 통과함: 소요 0.0 ms, 라우트 세대 없음, 소유자 태그 없음."
  - en: There is no edge-z in the inventory. The address answers on the management network, refuses every login and copies one request in ten thousand to a collector with no name.
    ko: 인벤토리에 edge-z는 없다. 그 주소는 관리망에서 응답하고, 모든 로그인을 거부하며, 요청 만 건 중 한 건을 이름 없는 수집기로 복사한다.
  - en: controller-a publishes r81 (committed 02:10) / controller-b publishes r82 (no commit record, built from a draft)
    ko: controller-a가 r81 발행 (02:10 커밋) / controller-b가 r82 발행 (커밋 기록 없음, 초안에서 빌드)
  - en: A restart boots from the cached table r79, which points all of EU at us-east. Controller-b keeps publishing r82 regardless. Only a generation fence stops it.
    ko: 재시작하면 캐시된 테이블 r79로 부팅되는데, r79는 EU 전체를 us-east로 보냄. controller-b는 그와 무관하게 r82를 계속 발행함. 세대 펜스만이 이를 막음.
  - en: A second route controller publishes an uncommitted generation
    ko: 두 번째 라우트 컨트롤러가 커밋되지 않은 세대를 발행한다
  - en: Edges accept any route generation without checking for a commit record
    ko: 엣지가 커밋 기록을 확인하지 않고 어떤 라우트 세대든 받아들인다
  - en: Edges on r81 and r82 forward EU requests to each other in a loop
    ko: r81과 r82를 따르는 엣지가 EU 요청을 서로에게 넘기며 루프를 돈다
  - en: EU checkout fails with too many redirects
    ko: EU 결제가 리디렉션 과다로 실패한다
  - en: Clients retry into the same loop
    ko: 클라이언트가 같은 루프로 재시도한다
