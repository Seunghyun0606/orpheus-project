    ko: "인벤토리에는 edge-z가 없다. 추적에는 있다. 그 주소 뒤에는 라우트 테이블조차 없고, 로그인 프롬프트가 있어야 할 자리에 배너 하나뿐이다. UNKNOWN: 세대를 비교해. 초록불 말고."
