  - en: Buy time
    ko: 시간 벌기
  - en: Killing legacy-r7 is twenty seconds of work and frees every worker it holds, if it stays dead. Shedding background load clears room for customers too, and Nadia has already said what runs as background at 03:00.
    ko: legacy-r7을 죽이는 데는 20초면 되고, 죽은 채로 있기만 하면 붙잡고 있던 워커가 전부 풀린다. 백그라운드 부하를 차단해도 고객 몫의 자리가 생기지만, 03:00에 무엇이 백그라운드로 도는지는 나디아가 이미 말했다.
  - en: Fence the reservation
    ko: 예약 분리
  - en: A partition of its own gives legacy-r7 four workers and nothing else, however often it renews. Customer work gets the rest of the pool. It takes a hundred seconds, and the job keeps running where you can watch it.
    ko: 전용 파티션을 주면 legacy-r7은 아무리 자주 갱신해도 워커 네 개 이상은 못 가진다. 풀의 나머지는 고객 작업 몫이다. 100초가 걸리고, 잡은 지켜볼 수 있는 곳에서 계속 돌아간다.
