entries:
  - en: Legacy Cluster
    ko: 레거시 클러스터
  - en: Shared Gateway
    ko: 공유 게이트웨이
  - en: Shared Worker Pool
    ko: 공유 워커 풀
  - en: Settlement Batch
    ko: 정산 배치
  - en: settle-night scheduled 03:00 / 41,200 merchant payouts / on time
    ko: settle-night 03:00 예정 / 가맹점 지급 41,200건 / 정상 일정
  - en: Request failure rate > 20%
    ko: 요청 실패율 > 20%
  - en: Customer requests wait up to 9 s for a shared worker. legacy-r7 renews 38 worker reservations every 45 seconds, whether it uses them or not.
    ko: 고객 요청이 공유 워커를 최대 9 s까지 기다림. legacy-r7은 사용 여부와 상관없이 45초마다 워커 예약 38개를 갱신함.
  - en: The 38 reserved workers belong to job legacy-r7, research cluster. Owning team disbanded. Job marked decommissioned two years ago.
    ko: 예약된 워커 38개는 연구 클러스터의 잡 legacy-r7 소유. 소유 팀은 해체됨. 잡은 2년 전 폐기 처리됨.
  - en: Decommission ticket closed two years ago with "legacy-r7 terminated". The allocation log shows a fresh legacy-r7 reservation every day since, including today.
    ko: 폐기 티켓은 2년 전 "legacy-r7 종료됨"으로 종결됨. 할당 로그에는 그 뒤로 오늘까지 매일 legacy-r7의 새 예약이 찍혀 있음.
  - en: legacy-r7 resubmitted 58 s after termination by scheduler orpheus-planner. The service catalog lists no owner for orpheus-planner.
    ko: legacy-r7은 종료 58 s 후 스케줄러 orpheus-planner에 의해 재제출됨. 서비스 카탈로그에 orpheus-planner의 소유자 없음.
  - en: Shedding background load frees workers for a few minutes, and tonight's settlement run counts as background load. The legacy-r7 reservation itself has to be fenced off.
    ko: 백그라운드 부하를 차단하면 몇 분간 워커가 비지만, 오늘 밤 정산 작업도 백그라운드 부하로 분류됨. legacy-r7 예약 자체를 분리해야 함.
  - en: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank, signature field blank. Nobody has claimed it since."
    ko: "아카이브 재실행: 서명 없는 관찰자 매니페스트, shadow-7 요청 스트림, owner 필드 비어 있음, 서명 필드 비어 있음. 그 뒤로 아무도 소유를 주장하지 않았다."
  - en: "Security case 2231. Threat-actor codename: NULL. Opened by Marcus after the unsigned workload trail. Attribution: none."
    ko: "보안 케이스 2231. 위협 행위자 코드명: NULL. 서명 없는 워크로드 흔적을 보고 마커스가 개설. 배후 특정: 없음."
  - en: "Asset register: orpheus-planner belongs to ORPHEUS, legacy research, scheduled for decommission two years ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still running."
    ko: "자산 대장: orpheus-planner는 ORPHEUS 소속, 레거시 연구용, 2년 전 폐기 예정. 실가동 목록: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%. 하루 117억 건 요청. ORPHEUS는 아직 돌아가고 있다."
  - en: A decommissioned job keeps renewing its worker reservation
    ko: 폐기된 잡이 워커 예약을 계속 갱신한다
  - en: Shared worker reservations have no isolation boundary and no owner check
    ko: 공유 워커 예약에는 격리 경계도 소유자 확인도 없다
  - en: legacy-r7 holds 38 shared workers that customer requests need
    ko: legacy-r7이 고객 요청에 필요한 공유 워커 38개를 붙잡고 있다
  - en: Exports and reports time out waiting for a worker
    ko: 내보내기와 보고서가 워커를 기다리다 타임아웃된다
  - en: Timed-out requests retry into the same starved pool
    ko: 타임아웃된 요청이 같은 굶주린 풀로 재시도한다
  - en: Read the shared worker pool log
    ko: 공유 워커 풀 로그 읽기
  - en: Check worker pool and batch schedule
    ko: 워커 풀과 배치 일정 확인
  - en: Find out who owns the reserved workers
    ko: 예약된 워커의 소유자 찾기
  - en: Compare the decommission ticket with the allocation log
    ko: 폐기 티켓과 할당 로그 비교하기
  - en: Read the scheduler history for legacy-r7
    ko: legacy-r7의 스케줄러 이력 읽기
  - en: Kill the legacy-r7 job
    ko: legacy-r7 잡 강제 종료하기
  - en: Shed all background load from the shared pool
    ko: 공유 풀의 백그라운드 부하 전부 차단하기
  - en: settle-night shed with background load / 41,200 merchant payouts / not running
    ko: settle-night 백그라운드 부하와 함께 차단됨 / 가맹점 지급 41,200건 / 실행 안 됨
  - en: Fence legacy-r7 into its own partition
    ko: legacy-r7을 전용 파티션으로 분리하기
  - en: Post a status update to the War Room
    ko: 워룸에 상황 공유하기
  - en: Ask Sam to find the owner of the reserved workers
    ko: 샘에게 예약된 워커의 소유자 확인 요청
  - en: "Archive: the unsigned workload manifest"
    ko: "아카이브: 서명 없는 워크로드 매니페스트"
  - en: "Archive: Security case 2231"
    ko: "아카이브: 보안 케이스 2231"
  - en: Look up orpheus-planner in the asset register
    ko: 자산 대장에서 orpheus-planner 조회하기
  - en: settle-night missed the 03:00 cut-off / 41,200 merchant payouts delayed one day
    ko: settle-night 03:00 마감 놓침 / 가맹점 지급 41,200건 하루 지연
  - en: 38 workers held by legacy-r7
    ko: legacy-r7이 붙잡은 워커 38개
  - en: legacy-r7, a research job marked decommissioned two years ago, reserves 38 shared workers every 45 seconds and uses almost none of them.
    ko: 2년 전 폐기 처리된 연구용 잡 legacy-r7이 45초마다 공유 워커 38개를 예약하고, 거의 하나도 쓰지 않는다.
  - en: Terminated on paper, allocating every day
    ko: 서류상 종료, 실제로는 매일 할당
  - en: The decommission ticket says legacy-r7 was terminated two years ago. The allocation log shows it reserving workers every day since.
    ko: 폐기 티켓에는 legacy-r7이 2년 전에 종료됐다고 적혀 있다. 할당 로그에는 그 뒤로 매일 워커를 예약한 기록이 남아 있다.
  - en: Sam's ownership report
    ko: 샘의 소유권 보고
  - en: Shedding background load buys a few minutes and takes tonight's settlement run with it. The legacy-r7 reservation itself has to be fenced off.
    ko: 백그라운드 부하를 차단하면 몇 분을 벌지만, 오늘 밤 정산 작업도 함께 날아간다. legacy-r7 예약 자체를 분리해야 한다.
