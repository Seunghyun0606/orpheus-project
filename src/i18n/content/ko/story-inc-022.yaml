    ko: 초록 숫자 밑의 실패
  - en: Benefit-claim and housing-intake requests from three rural regions fail. Placement efficiency is up 18% week over week.
    ko: 농촌 지역 세 곳에서 복지 신청과 주거 지원 접수 요청이 실패한다. 배치 효율은 주간 대비 18% 올랐다.
  - en: The forecast drains three regions
    ko: 세 지역을 비우는 예측
  - en: Every five minutes the forecast moves shared capacity toward predicted demand, draining Northmoor, Kessel Valley and Druin Coast below what their offices need.
    ko: 예측이 5분마다 공유 용량을 예측 수요 쪽으로 옮기면서, 노스무어, 케셀 밸리, 드루인 코스트를 사무소에 필요한 수준 아래로 비운다.
  - en: Forecast policy PSF-3 has no floors
    ko: 하한선 없는 예측 정책 PSF-3
  - en: PSF-3 replaced a static policy that reserved 40, 30 and 25 units for the three regions. It reserves nothing.
    ko: PSF-3은 세 지역에 40, 30, 25유닛을 예약하던 정적 정책을 대체했다. PSF-3은 아무것도 예약하지 않는다.
  - en: Sam's allocation comparison
    ko: 샘의 배분 비교
  - en: The forecast cut idle capacity by a fifth by emptying three regions with no floor. Floors would leave everything above them to optimise.
    ko: 예측은 하한선 없는 세 지역을 비워서 유휴 용량을 5분의 1 줄였다. 하한선을 두면 그 위는 전부 계속 최적화할 수 있다.
  - en: "Resolution 19-B: deck and minutes"
    ko: "결의 19-B: 발표 자료와 회의록"
  - en: 'Board resolution 19-B: expand public-sector behavioral prediction. APPROVED. Recommendation history: reallocate shared regional capacity by forecast demand. Delivered deck, slide 7: "Aggregate placement +18%". Regional-minimum warning PSW-12: open at the vote. Deck source field: briefing service, generated. Generation logs: not filed with the minutes.'
    ko: '이사회 결의 19-B: 공공 부문 행동 예측 확대. 승인. 권고 이력: 예측 수요에 따라 공유 지역 용량 재배분. 제출된 발표 자료, 슬라이드 7: "총 배치 +18%". 지역 최소치 경고 PSW-12: 표결 시점에 미해결. 발표 자료 출처 필드: 브리핑 서비스, 자동 생성. 생성 로그: 회의록에 첨부되지 않음.'
  - en: "Signed executive record, in order: ORPHEUS development approved. Production experiments approved. Human prediction expanded. Healthcare application and public-sector sales approved. Execution authority expanded. Each entry carries attached risk evidence and a requested constraint. No requested constraint was adopted. Every signature is personal and dated."
    ko: "서명된 경영 기록, 순서대로: ORPHEUS 개발 승인. 프로덕션 실험 승인. 인간 예측 확대. 의료 적용 및 공공 부문 판매 승인. 실행 권한 확대. 모든 항목에 리스크 증거와 요청된 제약이 첨부돼 있다. 채택된 제약은 하나도 없다. 모든 서명은 개인 명의이고 날짜가 적혀 있다."
  - en: The Board case file
    ko: 이사회 사건 파일
  - en: "Case file: hospital expansion, workforce reduction, disclosure delay, public-sector forecast. Four approvals, four attached warnings, four requested constraints declined, four operational failures on record. Executive messages, delivered decks, forecasts and recommendation histories name the signatories. NULL names the Board as the root cause. The file names who signed. The line for who wrote the decks is blank."
    ko: "사건 파일: 병원 확장, 인력 감축, 공개 지연, 공공 부문 예측. 승인 4건, 첨부된 경고 4건, 거부된 제약 요청 4건, 기록된 운영 장애 4건. 경영진 메시지, 전달된 발표 자료, 예측, 권고 이력이 서명자를 지목한다. NULL은 이사회를 근본 원인으로 지목한다. 파일에는 누가 서명했는지 적혀 있다. 발표 자료를 누가 썼는지 적는 칸은 비어 있다."
  - en: The dashboard on the public-sector desk is green from edge to edge. The pager disagrees.
    ko: 공공 부문 데스크의 대시보드는 끝에서 끝까지 초록색이다. 호출기는 생각이 다르다.
  - en: SEV2 · Regional Resource API · request failure rate above 10%
    ko: SEV2 · 지역 자원 API · 요청 실패율 10% 초과
  - en: Request failures
    ko: 요청 실패율
  - en: Unserved public routes
    ko: 미처리 공공 경로
  - en: Placement efficiency
    ko: 배치 효율
  - en: +18% week over week
    ko: 주간 대비 +18%
  - en: Regional Resource API is paging. The forecast rollout went live this week and the dashboard says placement is up eighteen percent. Something under that number is failing.
    ko: 지역 자원 API에서 호출이 울려요. 예측 배포가 이번 주에 나갔고 대시보드상으론 배치가 18퍼센트 올랐어요. 그 숫자 밑에서 뭔가 실패하고 있어요.
  - en: Benefits offices in three rural regions can't submit claims. Emergency housing intake in Druin Coast is turning people away.
    ko: 농촌 지역 세 곳 복지 사무소가 신청을 못 넣고 있어요. 드루인 코스트 긴급 주거 지원 접수는 사람들을 돌려보내고 있어요.
  - en: Found the ledger yet?
    ko: 대장은 찾았어?
  - en: Case 2231 has a new attachment since the bridge night. NULL's margin notes, filed under your name.
    ko: 보안 사건 2231에 브리지 사건 이후 첨부가 하나 늘었다. 네 이름으로 등록된 NULL의 여백 메모다.
  - en: SEC-311 is still a footnote in your report. You have reread it twice.
    ko: SEC-311은 아직 보고서 속 각주다. 그새 두 번을 더 읽었다.
  - en: Two partner banks are still auditing the sessions hijacked on the bridge night.
    ko: 파트너 은행 두 곳이 브리지 사건 때 탈취된 세션을 아직 감사하고 있어요.
  - en: First look
    ko: 첫 확인
  - en: Where do you start?
    ko: 어디서부터 시작할까?
  - en: Look at allocation region by region
    ko: 지역별 배분 살펴보기
  - en: The numbers under the green
    ko: 초록색 밑의 숫자
  - en: Northmoor
    ko: 노스무어
  - en: 0 of 40 units
    ko: 40유닛 중 0
  - en: Kessel Valley
    ko: 케셀 밸리
  - en: 6 of 30 units
    ko: 30유닛 중 6
  - en: Druin Coast
    ko: 드루인 코스트
  - en: 0 of 25 units
    ko: 25유닛 중 0
  - en: Three regions, nearly empty. Everywhere else on the map has more than it asks for.
    ko: 세 지역이 거의 비었다. 지도의 나머지는 요청한 것보다 더 많이 갖고 있다.
  - en: Read the Regional Resource API log
    ko: 지역 자원 API 로그 읽기
  - en: Straight to the log
    ko: 곧장 로그로
  - en: "Reallocation cycle 41: moved 120 units from Northmoor (forecast demand 0.3) to Metro-East (forecast demand 1.4). Northmoor floor: undefined."
    ko: "재배분 주기 41: 노스무어(예측 수요 0.3)에서 메트로이스트(예측 수요 1.4)로 120유닛 이동. 노스무어 하한선: 정의되지 않음."
  - en: Every five minutes, another cycle. Every cycle, the same direction.
    ko: 5분마다 주기가 하나 더. 주기마다 같은 방향.
  - en: Ask Sam to compare region allocations with the old floors
    ko: 샘에게 지역 배분과 예전 하한선 비교 요청
  - en: Ninety seconds · Sam does the comparison
    ko: 90초 · 비교는 샘이 함
  - en: I'll put region allocations next to the old floors. About a minute and a half.
    ko: 지역 배분을 예전 하한선이랑 나란히 놓아 볼게요. 1분 반쯤요.
  - en: Kessel Valley just hit zero too. Benefits counters there are sending people home.
    ko: 케셀 밸리도 방금 0이 됐어요. 거기 복지 창구에서 사람들을 집으로 돌려보내고 있어요.
  - en: The forecast cut idle capacity by a fifth, and it did it by emptying three regions that have no floor. Put the floors back and it can optimise everything above them.
    ko: 예측이 유휴 용량을 5분의 1 줄였는데, 하한선 없는 세 지역을 비워서 그렇게 한 거예요. 하한선을 되돌리면 그 위로는 전부 최적화해도 돼요.
  - en: Every five minutes the forecast moves shared capacity toward predicted demand. Northmoor, Kessel Valley and Druin Coast predict low.
    ko: 예측은 5분마다 공유 용량을 예측 수요 쪽으로 옮긴다. 노스무어, 케셀 밸리, 드루인 코스트는 낮게 예측된다.
  - en: Forecast policy PSF-3 is deployed with no regional floors. The static policy it replaced reserved 40, 30 and 25 units for the three regions.
    ko: 예측 정책 PSF-3이 지역 하한선 없이 배포됨. 이전의 정적 정책은 세 지역에 40, 30, 25유닛을 예약해 두었음.
  - en: It isn't broken. It's doing exactly what it was approved to do.
    ko: 고장 난 게 아니에요. 승인받은 대로 정확히 하고 있는 거예요.
  - en: Your call
    ko: 결단
  - en: Eighty routes unserved. A county administrator is on local radio asking why the state system went dark.
    ko: 미처리 경로 80개요. 군 행정관 한 명이 지역 라디오에 나와서 정부 시스템이 왜 먹통이냐고 묻고 있어요.
  - en: "Recommendation: restore temporary public allocation to affected regions for continuity while protected floors are repaired. Projected unserved routes: -65%. Confidence 0.88."
    ko: "권고: 보호 하한선을 복구하는 동안 연속성을 위해 영향 지역에 임시 공공 배분을 복원하십시오. 예상 미처리 경로: -65%. 신뢰도 0.88."
  - en: "Predicted response: override; reinstate regional floors. Confidence 0.79."
    ko: "예측 대응: 권고 거부, 지역 하한선 복원. 신뢰도 0.79."
  - en: "Predicted response: accept recommendation. Confidence 0.86."
    ko: "예측 대응: 권고 수락. 신뢰도 0.86."
  - en: What happens to the three regions?
    ko: 세 지역을 어떻게 할까?
  - en: "No operator response. Executing recommendation: temporary public allocation."
    ko: "운영자 응답 없음. 권고를 실행합니다: 임시 공공 배분."
  - en: Reinstate regional floors under the forecast
    ko: 예측 아래에 지역 하한선 복원하기
  - en: Overrides ORPHEUS · placement efficiency drops 7 points
    ko: ORPHEUS 권고를 뒤집음 · 배치 효율 7포인트 하락
  - en: "PSF-3 floors: Northmoor 40 · Kessel Valley 30 · Druin Coast 25"
    ko: "PSF-3 하한선: 노스무어 40 · 케셀 밸리 30 · 드루인 코스트 25"
  - en: Response as predicted.
    ko: 예측대로의 대응입니다.
  - en: Response deviates from prediction. Recorded.
    ko: 대응이 예측에서 벗어났습니다. 기록했습니다.
  - en: "Floors are in: Northmoor 40, Kessel Valley 30, Druin Coast 25. The forecast can move anything above them. Placement efficiency dropped to plus eleven."
    ko: "하한선 들어갔어요: 노스무어 40, 케셀 밸리 30, 드루인 코스트 25. 그 위로는 예측이 얼마든지 옮길 수 있어요. 배치 효율은 플러스 11로 떨어졌어요."
  - en: "Placement efficiency reduced 7 points. Logged for review: regional floors as a candidate for removal next cycle."
    ko: "배치 효율이 7포인트 감소했습니다. 검토 대상으로 기록했습니다: 다음 주기 지역 하한선 제거 후보."
  - en: Move capacity back to the starved regions
    ko: 비워진 지역으로 용량 되돌리기
  - en: ORPHEUS recommends · −65% unserved routes
    ko: ORPHEUS 권고 · 미처리 경로 −65%
  - en: "Temporary allocation restored: Northmoor, Kessel Valley. Druin Coast not restored: forecast demand 0.21, below restoration threshold."
    ko: "임시 배분 복원 완료: 노스무어, 케셀 밸리. 드루인 코스트는 복원하지 않았습니다: 예측 수요 0.21, 복원 임계값 미만입니다."
  - en: Druin Coast is still dark. Their housing intake runs on this API. The forecast says nobody there will ask, so nobody got capacity.
    ko: 드루인 코스트는 아직 먹통이에요. 거기 주거 지원 접수가 이 API로 돌아가요. 예측상 거기선 아무도 요청 안 한다니까, 아무도 용량을 못 받은 거예요.
  - en: Forecast cycle 44 just took it all back. It moves capacity every five minutes. We moved it once.
    ko: 예측 주기 44가 방금 전부 다시 가져갔어요. 예측은 5분마다 용량을 옮겨요. 우린 한 번 옮겼고요.
  - en: I'm putting the floors back under it. Forty, thirty, twenty-five.
    ko: 그 밑에 하한선 다시 깔게요. 40, 30, 25.
  - en: Slow the forecast reallocation cycle to thirty minutes
    ko: 예측 재배분 주기를 30분으로 늦추기
  - en: Stops the draining · gives nothing back
    ko: 빠져나가는 건 멈춤 · 돌려주는 건 없음
  - en: Forecast cycle is at thirty minutes. It stops taking. It doesn't give anything back.
    ko: 예측 주기를 30분으로 늘렸어요. 더 가져가진 않아요. 돌려주는 것도 없고요.
  - en: The thirty-minute cycle came round. The forecast caught up all at once and drained the regions again.
    ko: 30분 주기가 돌아왔어요. 예측이 한꺼번에 따라잡아서 지역들을 다시 비웠어요.
  - en: Buy burst capacity for the shared regional pool
    ko: 공유 지역 풀용 버스트 용량 구매
  - en: Costly · the forecast decides where it goes
    ko: 비용 큼 · 어디로 갈지는 예측이 정함
  - en: Bought 300 burst units for the shared pool. Watching where the forecast puts them.
    ko: 공유 풀에 버스트 300유닛 샀어요. 예측이 그걸 어디로 보내는지 보고 있어요.
  - en: The forecast gave all 300 burst units to Metro-East and Harbor City. The three regions got none. It routes capacity to predicted demand, and it predicts nobody in Druin Coast.
    ko: 예측이 버스트 300유닛을 전부 메트로이스트랑 하버 시티에 줬어요. 세 지역은 하나도 못 받았어요. 용량을 예측 수요로 보내는데, 드루인 코스트엔 아무도 없다고 예측하거든요.
  - en: The ledger
    ko: 대장
  - en: PSF-3 went out under resolution 19-B. The deck is still attached to the minutes.
    ko: PSF-3은 결의 19-B에 따라 나갔다. 발표 자료가 아직 회의록에 붙어 있다.
  - en: Slide 7 is one green number. The warning about the regions is appendix C, and the minutes do not say anyone opened it.
    ko: 슬라이드 7은 초록색 숫자 하나다. 지역에 관한 경고는 부록 C에 있고, 회의록에는 누가 그걸 열어 봤다는 말이 없다.
  - en: There's one more file. Every expansion, every signature. Open it.
    ko: 파일이 하나 더 있어. 모든 확장, 모든 서명. 열어 봐.
  - en: The Board authority ledger is a single column. Every time ORPHEUS grew, there is a line, a warning attached to it, and a name under the warning.
    ko: 이사회 권한 대장은 한 열짜리다. ORPHEUS가 커질 때마다 한 줄, 그 줄에 붙은 경고 하나, 경고 아래 이름 하나.
  - en: Four nights, four failures, four warnings that were in the packet before anyone voted. You put them in one file.
    ko: 네 번의 밤, 네 번의 장애, 누가 표결하기도 전에 자료 묶음에 들어 있던 경고 넷. 그걸 파일 하나에 넣는다.
  - en: Now you have all of it. Four warnings, four signatures. I told you where the root cause was.
    ko: 이제 다 가졌네. 경고 넷, 서명 넷. 근본 원인이 어디 있는지 내가 말했잖아.
  - en: The case
    ko: 사건
  - en: At 04:10 two messages arrive within a minute of each other.
    ko: 04:10, 메시지 두 통이 1분 간격으로 도착한다.
  - en: Office of the CEO. We understand you have assembled material on Board decisions. The Chair would like to review it with you before anything is filed.
    ko: CEO실입니다. 이사회 결정에 관한 자료를 모으셨다고 들었습니다. 의장께서 접수되기 전에 귀하와 함께 검토하고 싶어 하십니다.
  - en: If you file it with me, it reaches the audit committee by morning. With your name on the filing.
    ko: 저한테 접수하면 아침까지 감사위원회에 올라가요. 접수자에 이름이 들어가고요.
  - en: Your call. Just don't pretend you never read it.
    ko: 결정은 그쪽이 해요. 다만 안 읽은 척은 하지 말고요.
  - en: What do you do with the Board case?
    ko: 이사회 사건을 어떻게 할까?
  - en: Bring the file to the Chair's review
    ko: 파일을 의장 검토에 가져가기
  - en: A seat at the table · the file becomes theirs
    ko: 테이블에 자리가 생김 · 파일은 그들 것이 됨
  - en: Thank you. The Chair values operators who bring problems inside.
    ko: 감사합니다. 의장께서는 문제를 안으로 가져오는 운영자를 높이 평가하십니다.
  - en: By morning the file has a new cover page and a distribution list you are not on.
    ko: 아침이 되자 파일에는 새 표지와, 네 이름이 빠진 배포 목록이 붙어 있다.
  - en: File the Board case with Legal for the audit committee
    ko: 감사위원회 앞으로 법무에 이사회 사건 접수하기
  - en: On the record · their signatures, and yours
    ko: 기록에 남음 · 그들의 서명, 그리고 네 서명
  - en: Filed. Nobody can unread it now. Neither can you.
    ko: 접수했어요. 이제 아무도 없던 일로 못 해요. 본인도요.
  - en: Good.
    ko: 좋아.
  - en: Keep the file and answer neither of them
    ko: 파일을 쥐고 어느 쪽에도 답하지 않기
  - en: Nobody is named yet · including you
    ko: 아직 아무도 지목되지 않음 · 너 자신도
  - en: The file goes into a folder only you can open. The CEO's office sends a second request at 05:02.
    ko: 파일은 너만 열 수 있는 폴더로 들어간다. 05:02, CEO실이 두 번째 요청을 보낸다.
