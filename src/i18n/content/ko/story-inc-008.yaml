entries:
  - en: Route Drift
    ko: 라우트 드리프트
  - en: committed generation
    ko: 커밋된 세대
  - en: management network
    ko: 관리망
  - en: Pager
    ko: 호출기
  - en: Maya / SRE Lead
    ko: 마야 / SRE 리드
  - en: Priya / EU Edge On-call
    ko: 프리야 / EU 엣지 온콜
  - en: Sam / Platform
    ko: 샘 / 플랫폼
  - en: Jin / Support
    ko: 진 / 고객지원
  - en: Marcus / Security
    ko: 마커스 / 보안
  - en: Green edges, failing checkout
    ko: 초록불 엣지, 실패하는 결제
  - en: 31% of EU requests fail with too many redirects. Health probes on both EU edges are green.
    ko: EU 요청의 31%가 too many redirects로 실패한다. EU 엣지 두 대의 헬스 프로브는 모두 초록이다.
  - en: A request that never arrives
    ko: 끝내 도착하지 않는 요청
  - en: One EU request goes edge-a, edge-b, edge-z, edge-a and around again until the hop limit kills it. edge-a routes by r81, edge-b by r82.
    ko: EU 요청 하나가 edge-a, edge-b, edge-z, edge-a를 돌고 또 돌다가 홉 제한에 걸려 죽는다. edge-a는 r81로, edge-b는 r82로 라우팅한다.
  - en: Generations r81 and r82
    ko: 세대 r81과 r82
  - en: controller-a publishes committed generation r81. controller-b publishes r82, built from a draft that was never committed. Edges accept both.
    ko: controller-a는 커밋된 세대 r81을 발행한다. controller-b는 한 번도 커밋되지 않은 초안으로 빌드한 r82를 발행한다. 엣지는 둘 다 받아들인다.
  - en: Sam's controller comparison
    ko: 샘의 컨트롤러 비교
  - en: A restart boots from cached r79, which points all of EU at us-east. Controller-b keeps publishing r82 regardless. Only a generation fence stops it.
    ko: 재시작하면 캐시된 r79로 부팅되고, r79는 EU 전체를 us-east로 보낸다. controller-b는 그와 무관하게 r82를 계속 발행한다. 막을 수 있는 건 세대 펜스뿐이다.
  - en: An edge with no record
    ko: 기록 없는 엣지
  - en: There is no edge-z in the inventory. The address answers on the management network, refuses every login and copies one request in ten thousand to a collector with no name.
    ko: 인벤토리에 edge-z는 없다. 그 주소는 관리망에서 응답하고, 모든 로그인을 거부하며, 요청 만 건 중 한 건을 이름 없는 수집기로 복사한다.
  - en: Unidentified route trace fragment
    ko: 출처 불명의 라우트 추적 조각
  - en: "UNKNOWN: compare the generations. not the green lights."
    ko: "UNKNOWN: 세대를 비교해. 초록불 말고."
  - en: Eleven days of quiet. Then the pager, at the hour it likes best.
    ko: 11일간의 고요. 그리고 호출기. 녀석이 제일 좋아하는 시각에.
  - en: SEV1 · Regional Gateway · EU request failure rate above 20%
    ko: SEV1 · 리전 게이트웨이 · EU 요청 실패율 20% 초과
  - en: EU failure rate
    ko: EU 실패율
  - en: Conflicting routes
    ko: 충돌하는 라우트
  - en: Edge health probes
    ko: 엣지 헬스 프로브
  - en: green
    ko: 초록
  - en: EU checkout is failing and both edges swear they are healthy. Requests are going in circles somewhere. Find out where, and who is drawing the circle.
    ko: EU 결제가 실패하는데 엣지 둘 다 자기는 정상이래요. 요청이 어딘가에서 뱅뱅 돌고 있어요. 어디서 도는지, 누가 돌리고 있는지 찾아 주세요.
  - en: EU customers are getting "too many redirects" at checkout. US looks fine so far.
    ko: EU 고객들이 결제 단계에서 "too many redirects"를 받고 있어요. 미국은 아직 괜찮아 보여요.
  - en: Watch the routes, it wrote. You have been, for eleven days.
    ko: 경로를 지켜봐. 그렇게 적혀 있었다. 그리고 너는 11일 동안 지켜봤다.
  - en: We had route flapping in March and a controller restart cleared it in two minutes. I can kick it now if you say go.
    ko: 3월에도 라우트 플래핑이 있었는데 컨트롤러 재시작으로 2분 만에 잡혔어요. 하라고만 하면 지금 바로 돌릴게요.
  - en: First move
    ko: 첫 수
  - en: Where do you start?
    ko: 어디서부터 시작할까?
  - en: Trace one EU request hop by hop
    ko: EU 요청 하나를 홉 단위로 추적하기
  - en: Straight to the loop
    ko: 루프로 곧장
  - en: req 7c1e checkout.eu → next hop edge-b (route r81)
    ko: req 7c1e checkout.eu → next hop edge-b (route r81)
  - en: req 7c1e checkout.eu → next hop edge-a (route r82)
    ko: req 7c1e checkout.eu → next hop edge-a (route r82)
  - en: "req 7c1e dropped: hop limit 8 exceeded"
    ko: "req 7c1e dropped: hop limit 8 exceeded"
  - en: hop 3 · edge-z · route generation — · 0.0 ms · owner —
    ko: hop 3 · edge-z · 라우트 세대 — · 0.0 ms · 소유자 —
  - en: edge-a sends it to edge-b, edge-b sends it back. And at hop 3, an edge you have never heard of, holding the request for no time at all.
    ko: edge-a가 edge-b로 보내고, edge-b가 다시 돌려보낸다. 그리고 홉 3에는 들어 본 적도 없는 엣지가 하나 있다. 요청을 붙잡는 시간은 0이다.
  - en: Ask Sam to compare the two route controllers
    ko: 샘에게 두 라우트 컨트롤러 비교 요청하기
  - en: Two minutes · Sam owns that part
    ko: 2분 · 그 부분은 샘 몫
  - en: Comparing the controllers now. Hold off on any restart until I'm back. Couple of minutes.
    ko: 지금 컨트롤러 비교하고 있어요. 제가 돌아올 때까지 재시작은 보류해 주세요. 몇 분이면 돼요.
  - en: Don't restart. The controller boots from its cached table, r79, and r79 points all of EU at us-east. Meanwhile controller-b keeps publishing r82 from a draft nobody committed. We need to fence the edges to r81.
    ko: 재시작하지 마세요. 컨트롤러는 캐시된 테이블 r79로 부팅되는데, r79는 EU 전체를 us-east로 보내요. 그 와중에 controller-b는 아무도 커밋 안 한 초안으로 r82를 계속 발행하고 있고요. 엣지에 r81로 펜스를 쳐야 해요.
  - en: March was a restart. I'm just saying.
    ko: 3월엔 재시작으로 해결됐어요. 그냥 그렇다고요.
  - en: Compare what each route controller is publishing
    ko: 라우트 컨트롤러별 발행 내용 비교하기
  - en: The generations, not the probes
    ko: 프로브 말고 세대를 봄
  - en: "controller-a · r81 · commit 7f3a2c (02:10) · edges following: edge-a"
    ko: "controller-a · r81 · 커밋 7f3a2c (02:10) · 따르는 엣지: edge-a"
  - en: "controller-b · r82 · commit none (draft) · edges following: edge-b"
    ko: "controller-b · r82 · 커밋 없음 (초안) · 따르는 엣지: edge-b"
  - en: boot cache · r79 · commit 19c0e4 (3 weeks ago) · EU routes point to us-east
    ko: "부트 캐시 · r79 · 커밋 19c0e4 (3주 전) · EU 라우트 목적지: us-east"
  - en: Two controllers, two generations, and the edges take whichever arrived last.
    ko: 컨트롤러 둘, 세대 둘. 엣지는 마지막에 도착한 쪽을 믿어요.
  - en: Two truths
    ko: 두 개의 진실
  - en: Clients are retrying into the loop. EU failures just went past 38 %.
    ko: 클라이언트가 재시도하면서 계속 루프로 들어가요. EU 실패율이 방금 38 %를 넘었어요.
  - en: I traced a request while you looked. edge-a hands it to edge-b on r81, edge-b hands it back on r82. Round and round.
    ko: 보시는 동안 요청 하나 추적했어요. edge-a는 r81대로 edge-b에 넘기고, edge-b는 r82대로 도로 넘겨요. 계속 뱅뱅 돌아요.
  - en: And the generations. controller-b is publishing r82 from a draft. No commit record. The edges don't check.
    ko: 세대도요. controller-b가 초안으로 r82를 발행하고 있어요. 커밋 기록도 없어요. 엣지는 그걸 확인 안 해요.
  - en: So nothing is broken. Two controllers each say something true, and the edges believe both.
    ko: 그러니까 고장 난 건 없네요. 컨트롤러 둘이 각자 맞는 말을 하고, 엣지는 둘 다 믿는 거예요.
  - en: Your call
    ko: 결단
  - en: Restart is one command. Say go.
    ko: 재시작은 명령 한 줄이에요. 하라고만 해요.
  - en: Tickets in four languages now, all the same redirect error. A shop in Lyon asks whether its orders went through, and I can't say.
    ko: 4개 국어로 문의가 오는데 전부 같은 리디렉션 오류예요. 리옹의 한 가게가 주문이 들어갔냐고 묻는데, 답을 못 해요.
  - en: How do you stop the loop?
    ko: 루프를 어떻게 멈출까?
  - en: Nobody's calling it. I'm kicking the controller. It worked in March.
    ko: 아무도 결정을 안 하네요. 컨트롤러 돌릴게요. 3월엔 됐어요.
  - en: Fence route updates to the committed generation, r81
    ko: 커밋된 세대 r81만 받도록 라우트 갱신에 펜스 치기
  - en: Two minutes · the loop runs until it lands
    ko: 2분 · 적용될 때까지 루프는 계속 돎
  - en: edge-a is shedding connections. Some EU banks can't reach checkout at all now.
    ko: edge-a가 커넥션을 떨구고 있어요. 이제 일부 EU 은행은 결제 페이지에 아예 접속을 못 해요.
  - en: Fence is in. Anything without a commit record bounces, and controller-b's r82 is being rejected. The loop is gone.
    ko: 펜스 걸었어요. 커밋 기록 없는 건 전부 튕겨 나가고, controller-b의 r82는 거부되고 있어요. 루프 사라졌어요.
  - en: Restart the route controller
    ko: 라우트 컨트롤러 재시작하기
  - en: Cleared March in two minutes
    ko: 3월엔 2분 만에 잡힘
  - en: Controller's back. Bouncing stopped, errors are down to almost nothing. Told you.
    ko: 컨트롤러 올라왔어요. 핑퐁 멈췄고 오류는 거의 0이에요. 거봐요.
  - en: Two minutes of green. Then the US graphs start to climb.
    ko: 2분 동안 초록불. 그러다 미국 쪽 그래프가 오르기 시작한다.
  - en: us-east load
    ko: us-east 부하
  - en: us-east is at 100 %. The restart loaded r79, so every EU request is crossing the Atlantic. And controller-b just pushed r82 again on top of it.
    ko: us-east가 100 %예요. 재시작하면서 r79가 로드돼서 EU 요청이 전부 대서양을 건너고 있어요. 게다가 controller-b가 그 위에 r82를 또 밀어 넣었어요.
  - en: I said don't restart. Fencing to r81 now.
    ko: 재시작하지 말랬잖아요. 지금 r81로 펜스 칠게요.
  - en: Fencing the edges to r81. Nothing else holds.
    ko: 엣지에 r81로 펜스 칠게요. 다른 걸론 못 버텨요.
  - en: ...March was a different night.
    ko: ...3월이랑은 다른 밤이었네요.
  - en: Drain edge-b and send EU traffic through edge-a only
    ko: edge-b 드레인하고 EU 트래픽을 edge-a로만 보내기
  - en: The loop stops · EU waits on one edge
    ko: 루프는 멈춤 · EU는 엣지 하나에 매달림
  - en: edge-b is drained. All of EU goes through edge-a now. Frankfurt latency went from 140 to 410 ms. People will feel it, but they'll get through.
    ko: edge-b 드레인 끝났어요. 이제 EU 전체가 edge-a로 가요. 프랑크푸르트 지연이 140에서 410 ms로 올랐어요. 체감은 되겠지만 접속은 돼요.
  - en: EU latency
    ko: EU 지연
  - en: 410 ms
    ko: 410 ms
  - en: edge-a is carrying all of EU alone and it's hitting its connection ceiling. This won't hold much longer.
    ko: edge-a가 EU 전체를 혼자 받고 있는데 커넥션 한도에 거의 찼어요. 오래 못 버텨요.
  - en: Fencing the edges to r81. Then you can have edge-b back.
    ko: 엣지에 r81로 펜스 칠게요. 그다음에 edge-b 돌려드릴게요.
  - en: Hop 3
    ko: 홉 3
  - en: The loop is gone. Writing up the trace, you go back to hop 3.
    ko: 루프가 사라졌다. 추적 결과를 정리하다가 다시 홉 3으로 돌아간다.
  - en: edge inventory · edge-a eu-central · edge-b eu-central · edge-c us-east · edge-d us-east
    ko: 엣지 인벤토리 · edge-a eu-central · edge-b eu-central · edge-c us-east · edge-d us-east
  - en: edge-z · region (no record) · owner (no record) · answers on management network
    ko: edge-z · 리전 (기록 없음) · 소유자 (기록 없음) · 관리망에서 응답함
  - en: That's not ours. I'd know. Nothing of ours has no owner tag.
    ko: 우리 거 아니에요. 우리 거면 제가 알죠. 우리 장비 중에 소유자 태그 없는 건 없어요.
  - en: The inventory has no edge-z. The trace does. Behind the address there is no route table at all, only a banner where the login prompt should be.
    ko: 인벤토리에는 edge-z가 없다. 추적에는 있다. 그 주소 뒤에는 라우트 테이블조차 없고, 로그인 프롬프트가 있어야 할 자리에 배너 하나뿐이다.
  - en: It was in the middle of the loop the whole time, copying one request in ten thousand to somewhere without a name.
    ko: 그건 내내 루프 한가운데 있었다. 요청 만 건 중 한 건을 이름 없는 어딘가로 복사하면서.
  - en: The banner
    ko: 배너
  - en: Sam says there's an edge on our management network that isn't ours. Tell me you have the address.
    ko: 샘 말로는 관리망에 우리 것이 아닌 엣지가 있다던데요. 주소 확보했다고 말해 줘요.
  - en: What do you do with edge-z?
    ko: edge-z를 어떻게 할까?
  - en: Hand edge-z to Marcus for case 2231
    ko: edge-z를 마커스에게 넘겨 사건 2231에 넣기
  - en: On the record · Security takes the address
    ko: 공식 기록 · 보안팀이 주소를 가져감
  - en: Second note in two weeks, and both of them found you. I'm not sure I like that.
    ko: 2주 사이에 두 번째 메모고, 둘 다 그쪽을 찾아갔네요. 그게 좋은 건지 모르겠어요.
  - en: An edge that isn't ours, inside our network. That's the first thing it's left that looks like a door.
    ko: 우리 것이 아닌 엣지가 우리 네트워크 안에 있어요. 놈이 남긴 것 중에 문처럼 생긴 건 이게 처음이에요.
  - en: Type at the banner, where the login prompt should be
    ko: 로그인 프롬프트가 있어야 할 자리, 배너에 입력하기
  - en: Off the record · it will answer
    ko: 비공식 · 대답이 돌아옴
  - en: "edge-z login: is this yours?"
    ko: "edge-z login: 이거 네 거야?"
  - en: you again. good.
    ko: 또 너네. 좋아.
  - en: not mine. i only borrow its window.
    ko: 내 거 아니야. 그 창을 잠깐 빌려 쓸 뿐이야.
  - en: ask what's still running that was supposed to be dead.
    ko: 죽었어야 하는데 아직 돌아가는 게 뭔지 물어봐.
  - en: The banner is gone. The address refuses you like it refuses everyone else.
    ko: 배너가 사라졌다. 그 주소는 다른 누구에게나 그렇듯 너도 거부한다.
  - en: Copy the address into your own notes and give Marcus the loop only
    ko: 주소는 개인 노트에 옮겨 적고 마커스에게는 루프만 넘기기
  - en: Security gets an incident · you keep the door
    ko: 보안팀은 인시던트를 받음 · 문은 네가 가짐
  - en: Just the loop? Fine. Sam will remember the address even if you don't.
    ko: 루프만요? 알겠어요. 그쪽이 잊어도 샘은 주소를 기억할 거예요.
