  - en: Recovery tasks with no one on the other end
    ko: 받는 사람 없는 복구 작업
  - en: 86 recovery tasks wait — refunds, account unlocks, benefit transfers, accessibility requests. The oldest has waited 41 minutes.
    ko: 복구 작업 86건이 대기 중이다. 환불, 계정 잠금 해제, 수당 이체, 접근성 요청. 가장 오래된 건은 41분째 기다리고 있다.
  - en: Tasks assigned to an empty rotation
    ko: 빈 로테이션에 배정되는 작업
  - en: Every recovery task goes to recovery-east-2, which has no members. The staffed emergency rotation is never asked.
    ko: 모든 복구 작업이 구성원 없는 recovery-east-2로 간다. 인원이 있는 비상 로테이션은 한 번도 호출되지 않는다.
  - en: Queue owners older than the cuts
    ko: 감축보다 오래된 큐 소유자
  - en: Queue ownership generation 88 predates the reduction; rotation directory generation 91 removed the owning rotations.
    ko: 큐 소유 세대 88은 감축 이전 것이다. 로테이션 디렉터리 세대 91에서 그 소유 로테이션이 제거됐다.
  - en: Maya's coverage audit
    ko: 마야의 커버리지 감사
  - en: The queue still assigns to a rotation deleted with the cuts. Emergency operators exist; nobody pointed the queue at them.
    ko: 큐는 아직도 감축 때 삭제된 로테이션에 작업을 배정한다. 비상 운영자는 있는데, 아무도 큐를 그쪽으로 돌려놓지 않았다.
  - en: Change record WF-118
    ko: 변경 기록 WF-118
  - en: 'WF-118: remove recovery rotations east-2 and west-1. Approver: Executive Staffing Committee, under Board resolution 16-A. Step 3, reassign queue owners: deferred "until after headcount close".'
    ko: 'WF-118: 복구 로테이션 east-2, west-1 제거. 승인자: 경영진 인력 위원회, 이사회 결의 16-A에 따름. 3단계, 큐 소유자 재배정: "인원 확정 마감 이후로" 연기.'
  - en: Board resolution 16-A
    ko: 이사회 결의 16-A
  - en: 'Board resolution 16-A: reduce workforce by 12,410 roles. APPROVED. Input: ORPHEUS staffing forecast, consolidated coverage, idle cost down $41M a year. Attached: queue-ownership review REC-55, warning that recovery rotations would be removed before their queues were reassigned. Executive response on REC-55: "Exposure accepted."'
    ko: '이사회 결의 16-A: 12,410개 직무 감축. 승인. 근거 자료: ORPHEUS 인력 예측, 커버리지 통합, 유휴 비용 연 $41M 절감. 첨부: 큐 소유 검토 REC-55, 큐 재배정 전에 복구 로테이션이 제거된다는 경고. REC-55에 대한 경영진 답변: "리스크 수용."'
  - en: Staffing case chronology
    ko: 인력 건 연대기
  - en: "Staffing case chronology. Day -14: consolidation forecast delivered. Day -10: recovery leads attach REC-55, removed-rotation coverage warning. Day -9: leads ask the CEO to keep queue owners. Day -7: reduction of 12,410 roles approved. Day -3: reassignment step WF-118/3 marked DEFERRED. Day -1: rotations removed, queue ownership unchanged. Savings and the acknowledged exposure sit in the same authorization file."
    ko: "인력 건 연대기. D-14: 통합 예측 전달. D-10: 복구 리드들이 REC-55, 로테이션 제거 시 커버리지 경고 첨부. D-9: 리드들이 CEO에게 큐 소유자 유지 요청. D-7: 12,410개 직무 감축 승인. D-3: 재배정 단계 WF-118/3 DEFERRED 처리. D-1: 로테이션 제거, 큐 소유는 그대로. 절감액과 인지된 리스크가 같은 승인 파일에 들어 있다."
  - en: "CEO reply: they need the system to work"
    ko: "CEO 답장: 시스템이 작동하기만 하면 된다"
  - en: "CEO internal message, reply to recovery leads who asked for staffed queue owners before the cuts: \"The public doesn't need to understand the system. They need the system to work.\" The consolidation schedule stayed as signed. The savings line has no entry for the uncovered queue."
    ko: 'CEO 내부 메시지, 감축 전에 인원이 있는 큐 소유자를 요청한 복구 리드들에게 보낸 답장: "대중이 시스템을 이해할 필요는 없습니다. 시스템이 작동하기만 하면 됩니다." 통합 일정은 서명된 그대로 유지됐다. 절감액 항목 어디에도 비어 버린 큐는 적혀 있지 않다.'
  - en: The first week after the reduction. Half the chairs on the recovery side of the floor are pushed in and stay that way.
    ko: 감축 후 첫 주. 복구팀 쪽 의자 절반이 책상 밑으로 밀려 들어간 채 그대로다.
  - en: SEV2 · Recovery Queue API · recovery task failure rate above 10%
    ko: SEV2 · 복구 큐 API · 복구 작업 실패율 10% 초과
  - en: Unowned recovery tasks
    ko: 소유자 없는 복구 작업
  - en: Oldest task
    ko: 가장 오래된 작업
  - en: 41 min
    ko: 41분
  - en: Recovery Queue API is paging. Refunds, account unlocks and benefit transfers are sitting in a queue with nobody on the other end. First week after the reduction.
    ko: 복구 큐 API 호출 떴어요. 환불, 계정 잠금 해제, 수당 이체가 받는 사람 없는 큐에 쌓여 있어요. 감축 후 첫 주예요.
  - en: Customers are waiting on recoveries we promised within the hour. Eighty-six of them right now, and the oldest has been waiting since before midnight.
    ko: 한 시간 안에 처리해 드린다고 약속한 복구 건을 고객들이 기다리고 있어요. 지금 86명이고, 제일 오래된 분은 자정 전부터 기다리셨어요.
  - en: The Chair's briefing went out with your name in it. Spelled right. Nobody has said a word to me about it, which is worse.
    ko: 의장 브리핑 나갔어요. 이름 들어갔고, 철자도 맞아요. 아무도 저한테 그 얘길 안 해요. 그게 더 찜찜해요.
  - en: Your hospital postmortem came back from the Chair's office with one comment on the 14-C paragraph. "Noted."
    ko: 병원 사후 분석이 의장실에서 돌아왔다. 14-C 단락에 코멘트가 하나 달려 있다. "확인함."
  - en: The hospital postmortem was approved within the hour. Nobody asked about BRD-2291.
    ko: 병원 사후 분석은 한 시간 만에 승인됐다. BRD-2291을 묻는 사람은 없었다.
  - en: This is the next one.
    ko: 이게 다음 거야.
  - en: First look
    ko: 첫 확인
  - en: Where do you start?
    ko: 어디서부터 시작할까?
  - en: Read the coverage router log
    ko: 커버리지 라우터 로그 읽기
  - en: Straight to the router
    ko: 곧장 라우터로
  - en: "Assignment to rotation recovery-east-2 timed out: no staffed operator. Retrying the same owner."
    ko: "로테이션 recovery-east-2 배정 타임아웃: 근무 중인 운영자 없음. 같은 소유자로 재시도."
  - en: The router keeps knocking on the same door. Nobody has worked behind it since yesterday.
    ko: 라우터는 같은 문을 계속 두드린다. 어제부터 그 문 뒤에서 일하는 사람은 없다.
  - en: Ask Maya to audit who owns the queue tonight
    ko: 마야에게 오늘 밤 큐 소유자 감사 요청
  - en: Two minutes · Maya does the audit
    ko: 2분 · 감사는 마야가 함
  - en: I'll audit who actually owns that queue right now. Two minutes.
    ko: 그 큐 실제 소유자가 누군지 지금 감사 돌려 볼게요. 2분이요.
  - en: Backlog's past a hundred and twenty. A man locked out of his account has called six times. He's trying to pay rent.
    ko: 백로그가 120건을 넘었어요. 계정 잠긴 남자분이 벌써 여섯 번째 전화예요. 월세를 내야 한대요.
  - en: The queue still assigns to recovery-east-2. That rotation was deleted yesterday with the cuts. Emergency operators exist; nobody pointed the queue at them.
    ko: 큐가 아직도 recovery-east-2로 작업을 배정해요. 그 로테이션은 어제 감축 때 삭제됐어요. 비상 운영자는 있는데, 아무도 큐를 그쪽으로 돌려놓지 않았어요.
  - en: Break the recovery queue down by task type
    ko: 복구 큐를 작업 유형별로 나눠 보기
  - en: Who is waiting, first
    ko: 누가 기다리는지부터
  - en: Refunds
    ko: 환불
  - en: Account unlocks
    ko: 계정 잠금 해제
  - en: Benefit transfers
    ko: 수당 이체
  - en: Accessibility requests
    ko: 접근성 요청
  - en: Every one of them was promised within the hour. Every one is assigned to the same rotation.
    ko: 하나같이 한 시간 안에 처리하겠다고 약속한 건이다. 하나같이 같은 로테이션에 배정돼 있다.
  - en: Step 3
    ko: 3단계
  - en: "Rotation directory: recovery-east-2 removed under change WF-118 at 23:58 yesterday. Queue reassignment step: DEFERRED."
    ko: "로테이션 디렉터리: 어제 23:58 변경 WF-118로 recovery-east-2 제거됨. 큐 재배정 단계: DEFERRED."
  - en: The queue ownership table is generation 88. The rotation directory is generation 91. Nobody re-pointed the queues in between.
    ko: 큐 소유 테이블은 세대 88이다. 로테이션 디렉터리는 세대 91이다. 그 사이에 아무도 큐를 돌려놓지 않았다.
  - en: Nine people on the emergency rotation tonight. The queue never asks them.
    ko: 오늘 밤 비상 로테이션에 아홉 명 있어요. 큐는 그 사람들을 한 번도 안 불러요.
  - en: WF-118 runs under Board resolution 16-A. Pulling it.
    ko: WF-118은 이사회 결의 16-A에 따른 거예요. 찾아올게요.
  - en: The resolution is one page. Clipped behind it is a review somebody attached before the vote.
    ko: 결의는 한 페이지다. 그 뒤에는 누군가 표결 전에 첨부한 검토서가 클립으로 끼워져 있다.
  - en: Before the cuts
    ko: 감축 전에
  - en: Before I re-point anything — was this a slip, or did somebody know? It changes who I call in the morning.
    ko: 뭘 돌려놓기 전에요. 이게 실수였어요, 아니면 누가 알고 있었어요? 그거에 따라 아침에 누구한테 전화할지가 달라져요.
  - en: Was the empty rotation an accident of the cuts? Pick the two records that show the risk was raised before them.
    ko: 빈 로테이션은 감축이 낳은 사고였는가? 감축 전에 이미 리스크가 제기됐음을 보여 주는 기록 두 개는 무엇인가?
  - en: Not what broke tonight. Who was told, and when.
    ko: 오늘 밤 뭐가 터졌는지 말고요. 누가, 언제 들었는지요.
  - en: REC-55 named these queues before the vote. The step that would have saved them was deferred on purpose, until after headcount close.
    ko: REC-55는 표결 전에 바로 이 큐들을 짚었다. 이 큐들을 살렸을 단계는 인원 확정 마감 이후로 일부러 미뤄졌다.
  - en: Exposure accepted. Two words. That was the whole answer.
    ko: 리스크 수용. 두 단어. 그게 답의 전부였어요.
  - en: Here's how I read it. REC-55 warned them on day -10. They voted on day -7. Step 3 was deferred on day -3. Nobody was surprised.
    ko: 제가 보기엔 이래요. REC-55가 D-10에 경고했어요. 표결은 D-7이었고요. 3단계는 D-3에 미뤄졌어요. 놀란 사람은 아무도 없었어요.
  - en: Your call
    ko: 결단
  - en: We haven't said a word publicly. The community forum is calling it a silent outage.
    ko: 아직 공지 한 줄 안 냈어요. 커뮤니티 포럼에선 조용한 장애라고 부르고 있어요.
  - en: "Recommendation: transfer the recovery queue to automation. Projected backlog: 0 within 6 minutes. Confidence 0.93."
    ko: "권고: 복구 큐를 자동화로 이관하십시오. 예상 백로그: 6분 내 0. 신뢰도 0.93."
  - en: "Predicted response: overtime volunteers. Confidence 0.77."
    ko: "예측 대응: 초과 근무 자원자 투입. 신뢰도 0.77."
  - en: "Predicted response: accept recommendation. Confidence 0.82."
    ko: "예측 대응: 권고 수락. 신뢰도 0.82."
  - en: Eleven people answered my call for overtime. Say the word and they take it by hand.
    ko: 초과 근무 요청에 열한 명이 응했어요. 말만 하면 바로 수작업으로 붙을 거예요.
  - en: "A woman waiting on a benefit transfer has called four times tonight. I finally told her the truth: nobody is assigned to her ticket."
    ko: 수당 이체를 기다리는 여자분이 오늘 밤에만 네 번 전화했어요. 결국 사실대로 말했어요. 그분 티켓엔 담당자가 아무도 없다고요.
  - en: Who takes the recovery queue?
    ko: 복구 큐는 누가 맡을까?
  - en: "No operator response. Executing recommendation: recovery queue transferred to automation."
    ko: "운영자 응답 없음. 권고를 실행합니다: 복구 큐를 자동화로 이관."
  - en: Point every recovery queue at the staffed emergency rotation
    ko: 모든 복구 큐를 인원이 있는 비상 로테이션으로 돌리기
  - en: Fixes the cause · finishes the step they deferred
    ko: 원인 해결 · 미뤄 둔 단계를 마무리
  - en: queue-owner recovery/* → recovery-oncall · ownership generation 92
    ko: queue-owner recovery/* → recovery-oncall · 소유 세대 92
  - en: Response deviates from prediction. Recorded.
    ko: 대응이 예측에서 벗어났습니다. 기록했습니다.
  - en: Queue ownership points at the staffed emergency rotation now. Tasks are landing on real people and clearing.
    ko: 큐 소유가 이제 인원 있는 비상 로테이션을 가리켜요. 작업이 진짜 사람한테 가서 처리되고 있어요.
  - en: Accept volunteers working overtime to take the queue by hand
    ko: 초과 근무 자원자들이 큐를 수작업으로 처리하게 하기
  - en: Every task gets a person · eleven tired people
    ko: 모든 작업에 사람이 붙음 · 지친 열한 명
  - en: Eleven people answered the call for overtime. Four of them are working out their notice. They're taking the queue by hand, oldest first, every task.
    ko: 초과 근무 요청에 열한 명이 응했어요. 그중 넷은 퇴사 날짜 받아 놓은 사람들이에요. 오래된 것부터 하나하나 손으로 처리하고 있어요.
  - en: Response as predicted.
    ko: 예측대로의 대응입니다.
  - en: They're slowing down. Two of them have been up since yesterday's shift.
    ko: 다들 느려지고 있어요. 둘은 어제 근무 때부터 한숨도 못 잤어요.
  - en: I sent the volunteers home. They did what they could. The queue is filling again behind them.
    ko: 자원자들 집에 보냈어요. 할 만큼 했어요. 다들 빠지자마자 큐가 다시 차고 있어요.
  - en: Pointing the queues at the emergency rotation. That was step 3.
    ko: 큐를 비상 로테이션으로 돌릴게요. 그게 3단계였어요.
  - en: Hand the recovery queue to automation
    ko: 복구 큐를 자동화에 넘기기
  - en: ORPHEUS recommends · fastest · it decides what is worth doing
    ko: ORPHEUS 권고 · 가장 빠름 · 뭘 할 가치가 있는지는 자동화가 판단
  - en: "Queue accepted. 126 tasks scored. 103 dispatched. 23 closed: LOW_VALUE. Projected backlog: 0."
    ko: "큐 인수함. 작업 126건 점수 산정. 103건 배정. 23건 종료: LOW_VALUE. 예상 백로그: 0."
  - en: The graph lies flat for nine minutes.
    ko: 9분 동안 그래프가 바닥에 붙어 있다.
  - en: People are calling back about tickets marked resolved. A wheelchair-access booking. A thirty-one dollar refund. Nobody resolved them. The automation closed them.
    ko: 해결됨으로 표시된 티켓 때문에 다시 전화가 와요. 휠체어 이용 예약 하나. 31달러 환불 하나. 해결된 적 없어요. 자동화가 닫아 버린 거예요.
  - en: Automation cleared what was already in the queue. New tasks still route to recovery-east-2, so it is filling up again.
    ko: 자동화는 이미 큐에 있던 것만 치웠어요. 새 작업은 여전히 recovery-east-2로 가서 큐가 다시 차고 있어요.
  - en: Reopened the twenty-three the automation closed. We're calling every one of them back.
    ko: 자동화가 닫은 23건 다시 열었어요. 한 분 한 분 다시 전화 드리고 있어요.
  - en: Park retries for unowned tasks in a hold queue
    ko: 소유자 없는 작업 재시도를 보류 큐에 세워 두기
  - en: The API calms down · the tasks keep aging
    ko: API는 진정됨 · 작업은 계속 묵어 감
  - en: Retries parked. The API stopped thrashing. The tasks are still there; they just stopped knocking.
    ko: 재시도 세워 뒀어요. API 헛도는 건 멈췄어요. 작업은 그대로예요. 문 두드리는 것만 멈춘 거죠.
  - en: Parked tasks are past their promise window. Refund deadlines are breaching one after another.
    ko: 세워 둔 작업들이 약속 시간을 넘겼어요. 환불 기한이 줄줄이 지나가고 있어요.
  - en: The queue is empty and staying empty. Maya is still reading the 16-A file.
    ko: 큐가 비었고, 계속 비어 있다. 마야는 아직 16-A 파일을 읽고 있다.
  - en: There's a reply in here. Day -9, the recovery leads asked the CEO to keep queue owners until the cuts were done. This is the answer.
    ko: 여기 답장이 있어요. D-9에 복구 리드들이 감축이 끝날 때까지 큐 소유자를 남겨 달라고 CEO한테 요청했어요. 이게 그 답이에요.
  - en: The public doesn't need to understand the system. They need the system to work.
    ko: 대중이 시스템을 이해할 필요는 없습니다. 시스템이 작동하기만 하면 됩니다.
  - en: Staffing forecast accuracy for the reduction period is 98.1%. Tonight's coverage gap is attributable to deferred step WF-118/3.
    ko: 감축 기간의 인력 예측 정확도는 98.1%입니다. 오늘 밤의 커버리지 공백은 보류된 단계 WF-118/3에 기인합니다.
  - en: The forecast was right. The people who read it decided the rest could wait.
    ko: 예측은 맞았다. 그걸 읽은 사람들이 나머지는 기다려도 된다고 정했다.
  - en: Two resolutions
    ko: 결의 두 건
  - en: What do you do with the timeline?
    ko: 이 연대기를 어떻게 할까?
  - en: Show Maya and Sam 14-C and 16-A side by side
    ko: 마야와 샘에게 14-C와 16-A를 나란히 보여 주기
  - en: They're in it with you now · so are their badges
    ko: 이제 둘도 한배를 탐 · 사원증까지 걸고
  - en: Same shape. Warning attached, signed anyway.
    ko: 구조가 똑같네요. 경고가 붙어 있는데도 서명.
  - en: Okay. We do this together and we do it quietly. Nothing on shared drives.
    ko: 좋아요. 같이 해요. 대신 조용히. 공유 드라이브엔 아무것도 올리지 말고요.
  - en: Attach the timeline to the postmortem
    ko: 연대기를 사후 분석에 첨부하기
  - en: On the record · the Staffing Committee reads it too
    ko: 기록에 남음 · 인력 위원회도 읽음
  - en: Close it as a coverage gap
    ko: 커버리지 공백으로 종결하기
  - en: Fast · the dates stay in your notes
    ko: 빠름 · 날짜는 메모에만 남음
  - en: The postmortem says generation 88 and generation 91. The dates go into a file only you can open.
    ko: 사후 분석에는 세대 88과 세대 91이 적혀 있다. 날짜들은 너만 열 수 있는 파일로 들어간다.
