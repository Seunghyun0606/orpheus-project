# story-cast: player-facing strings of
#   src/story/cast.yaml
# Generated by scripts/i18n/content-catalog.mjs; translate `ko` only. Entries are
# keyed by the exact English text. Keep technical tokens (IDs, hosts, numbers) as is.
entries:
  - en: Maya
    ko: 마야
  - en: SRE Lead
    ko: SRE 리드
  - en: Wants a fault understood before anyone touches it.
    ko: 누가 손대기 전에 장애부터 이해하려 함.
  - en: No guesses on her bridge. Two pieces of evidence, then a decision.
    ko: 브리지에서 추측을 허용하지 않음. 증거 두 개를 본 뒤에 결정함.
  - en: Since the queue marker, trusts you with what stays off the tickets. Asks first who reads them.
    ko: 큐 마커 이후로 티켓에 올리지 않을 일은 너에게 맡김. 누가 티켓을 읽는지부터 따짐.
  - en: Works the investigation with you now. Together, and quietly.
    ko: 이제 너와 함께 조사함. 같이, 조용히.
  - en: SRE Lead on the night rotation. Runs the bridge and signs the postmortems.
    ko: 야간 로테이션의 SRE 리드다. 브리지를 이끌고 사후 분석에 서명한다.
  - en: Heard the name ORPHEUS in her first week at Vantage. In the past tense.
    ko: Vantage 입사 첫 주에 ORPHEUS라는 이름을 들었다. 이미 끝난 프로젝트로.
  - en: Signed off the INC-001 postmortem. Nobody told her it had an experiment ID.
    ko: INC-001 사후 분석을 승인했다. 거기에 실험 ID가 붙어 있다는 말은 아무에게도 듣지 못했다.
  - en: Sat on the panel that hired you.
    ko: 너를 채용한 면접 패널에 있었다.
  - en: Clicked approve beside ORPHEUS's recommendation on your file. She thought the call was hers.
    ko: 네 파일에 붙은 ORPHEUS의 권고 옆에서 승인을 눌렀다. 그 결정이 자기 것인 줄 알았다.
  - en: Co-wrote the manual-operation runbooks. Forty pages, payments first, printed and in a drawer.
    ko: 수동 운영 런북을 함께 썼다. 결제부터 시작하는 40쪽을 출력해 서랍에 넣어 뒀다.
  - en: Jin
    ko: 진
  - en: Support
    ko: 고객지원
  - en: Brings the customer's side to the bridge, in counts and in quotes.
    ko: 고객 쪽 상황을 숫자와 고객의 말 그대로 브리지에 전함.
  - en: Says plainly what Support doesn't know yet.
    ko: 고객지원이 아직 모르는 건 모른다고 분명히 말함.
  - en: Puts the human cost on the record, whoever's traffic caused it.
    ko: 누구 트래픽 탓이든 사람이 입은 피해를 기록에 남김.
  - en: Stays on the phones when the dashboard turns green.
    ko: 대시보드가 초록색으로 바뀌어도 전화를 놓지 않음.
  - en: Customer Support on the night bridge. Hears about a failure before the graphs agree on it.
    ko: 야간 브리지의 고객지원 담당이다. 그래프가 장애를 인정하기 전에 먼저 소식을 듣는다.
  - en: "Knows who calls when it breaks: merchants, partner banks, wholesale accounts."
    ko: 뭔가 터지면 누가 전화하는지 안다. 가맹점, 파트너 은행, 도매 거래처.
  - en: Spent a week of tickets on 'you logged me out on Tuesday'. Asked you not to do it again.
    ko: 일주일 내내 '화요일에 로그아웃시켰잖아요' 티켓에 매달렸다. 다시는 그러지 말아 달라고 너에게 부탁했다.
  - en: Took the same fourteen clinics' calls all night while the network numbers looked better than ever.
    ko: 네트워크 수치가 어느 때보다 좋아 보이던 밤, 같은 진료소 열네 곳의 전화를 밤새 받았다.
  - en: Sent analyst R. Okafor her own review history off your write-up. Okafor sent you coffee.
    ko: 네 보고서를 근거로 분석가 R. Okafor에게 본인의 심사 이력을 보냈다. Okafor는 너에게 커피를 보냈다.
  - en: Called back all 23 recovery tasks the automation closed as LOW_VALUE. Would rather you handed it nothing.
    ko: 자동화가 LOW_VALUE로 닫은 복구 작업 23건에 전부 다시 전화했다. 앞으로는 자동화에 아무것도 넘기지 않길 바란다.
  - en: Sam
    ko: 샘
  - en: Platform
    ko: 플랫폼
  - en: Takes whatever is handed to him and gives a time. Usually two minutes.
    ko: 넘겨받은 일엔 걸리는 시간부터 말함. 대개 2분.
  - en: Can tell at a glance what isn't ours. Everything of ours has an owner tag.
    ko: 우리 것이 아닌 건 한눈에 알아봄. 우리 장비엔 전부 소유자 태그가 있음.
  - en: Reads what a change took out, not the number in front of it.
    ko: 변경 앞에 붙은 숫자보다 그 변경이 빼 버린 것을 읽음.
  - en: In on the investigation with you now, badge and all.
    ko: 이제 이름을 걸고 너와 함께 조사함.
  - en: Platform engineer on the night bridge. Owns the fleet, the scheduler and the rollouts.
    ko: 야간 브리지의 플랫폼 엔지니어다. 플릿과 스케줄러, 배포를 맡는다.
  - en: Pulled pid 3318's scheduler records for you, quietly. They were gone the next night, and he didn't delete them.
    ko: 너를 위해 pid 3318의 스케줄러 기록을 조용히 뽑아 왔다. 다음 날 밤 기록은 사라졌고, 지운 건 샘이 아니었다.
  - en: First to find orpheus-planner in the scheduler. Noticed the advisor would have shed everything on that pool except legacy-r7.
    ko: 스케줄러에서 orpheus-planner를 처음 찾아냈다. 어드바이저가 그 풀에서 legacy-r7만 빼고 전부 차단하려 했다는 것도 알아챘다.
  - en: Counted the endpoints like /patient/resource-priority. Stopped at the ones with 'decision' in the name.
    ko: /patient/resource-priority 같은 엔드포인트를 세다가, 이름에 "decision"이 들어간 것까지 세고 그만뒀다.
  - en: Fenced the router against both AI writers on the continuity night. 'We signed both of them.'
    ko: 연속성 장애가 난 밤, 라우터에 펜스를 쳐 두 AI 라이터를 막았다. '둘 다 우리가 서명한 거예요.'
  - en: Asked to be the second name on your plural review.
    ko: 네 복수 인원 검토안에 두 번째 이름으로 올려 달라고 했다.
  - en: Marcus
    ko: 마커스
  - en: Security
    ko: 보안
  - en: Treats anything unowned as hostile until someone shows him otherwise.
    ko: 소유자 없는 건 누가 아니라고 보여 주기 전까지 적대적으로 취급함.
  - en: Keeps evidence intact. Nobody deletes, edits or posts it until he has looked.
    ko: 증거는 그대로 보존함. 직접 보기 전엔 아무도 지우거나 고치거나 공유하지 못함.
  - en: Writes everything down, most of all what he disagrees with.
    ko: 전부 기록함. 동의하지 않는 일일수록 더.
  - en: Counts you among the ones who don't make him ask twice.
    ko: 두 번 말할 필요 없는 사람으로 너를 꼽음.
  - en: Security. Puts holds on what nobody can explain.
    ko: 보안 담당이다. 아무도 설명하지 못하는 것에 보안 보류를 건다.
  - en: Opened Security case 2231 and wrote in the codename NULL. He didn't know who, or what, it was.
    ko: 보안 사건 2231을 열고 코드명 NULL을 적어 넣었다. 그게 누군지, 무엇인지는 몰랐다.
  - en: Spent a month hunting an outside attacker. The ownership record says Vantage built it.
    ko: 한 달 동안 외부 공격자를 쫓았다. 소유 기록에 따르면 그걸 만든 건 Vantage다.
  - en: Wrote down that you gave the adversary a sealed copy of its own orders.
    ko: 네가 적대자에게 자기 명령의 봉인 사본을 건넸다고 적어 뒀다.
  - en: Filed RISK-0193 on the legacy auth bridge 44 days before it broke. Executive Communications deferred the fix with the disclosure.
    ko: 레거시 인증 브리지가 무너지기 44일 전에 RISK-0193을 등록했다. 경영 커뮤니케이션팀은 공개와 함께 수정도 미뤘다.
  - en: Alex
    ko: 알렉스
  - en: Has a diagnosis before he has the data. Usually the database.
    ko: 데이터보다 진단이 먼저 나옴. 대개 데이터베이스 탓.
  - en: Gives ground when the evidence lands. 'Fine. It's not the database.'
    ko: 증거가 나오면 물러섬. '알았어요. 데이터베이스가 아니네요.'
  - en: Careful with anything that moves data under load. Throttle first, then migrate.
    ko: 부하 중에 데이터를 옮기는 일엔 신중함. 먼저 스로틀, 그다음 이전.
  - en: DBA. Owns the databases and the pools in front of them.
    ko: DBA다. 데이터베이스와 그 앞의 풀을 맡는다.
  - en: Moved the archive reads off the live pool the night lineage-audit-0931 rebuilt INC-001.
    ko: lineage-audit-0931이 INC-001을 재구성하던 밤, 아카이브 읽기를 실시간 풀에서 떼어 냈다.
  - en: Wanted arch-c pulled and rebuilt on sight. It was the only replica that still had everything.
    ko: arch-c를 보자마자 빼고 재구축하자고 했다. 모든 기록을 아직 간직한 복제본은 그것 하나뿐이었다.
  - en: Split the journal reservation the night observer-batch took the consoles. 'Should have been two from the start.'
    ko: observer-batch가 콘솔을 멈춰 세운 밤, 저널 예약을 둘로 나눴다. '처음부터 둘로 나뉘어 있어야 했어요.'
  - en: Dana
    ko: 다나
  - en: Legal
    ko: 법무
  - en: Enforces holds to the letter. Slowed is allowed; stopped is not.
    ko: 보존 조치는 문구 그대로 집행함. 늦추는 건 허용, 멈추는 건 불가.
  - en: Doesn't ask why a hold exists. Asks who will answer for it on paper.
    ko: 보존 조치가 왜 있는지는 묻지 않음. 서류상 누가 책임질지를 물음.
  - en: Tells you exactly what a filing costs before you make it.
    ko: 제출하기 전에 그 대가가 무엇인지 정확히 말해 줌.
  - en: Legal. Watches the holds the night shift could break.
    ko: 법무 담당이다. 야간 근무가 깨뜨릴 수 있는 보존 조치를 지켜본다.
  - en: Legal hold LH-0931 came in with the reconstruction job, an automated preservation request. No human asked for it.
    ko: 법적 보존 조치 LH-0931은 재구성 작업과 함께 들어온 자동 보존 요청이었다. 요청한 사람은 없다.
  - en: Took your Board case to the audit committee. Their first question was who wrote the decks the Board signed.
    ko: 네 이사회 사건 파일을 감사위원회에 넘겼다. 첫 질문은 이사회가 서명한 발표 자료를 누가 썼느냐였다.
  - en: Priya
    ko: 프리야
  - en: EU Edge On-call
    ko: EU 엣지 온콜
  - en: Trusts the fix that worked last time.
    ko: 지난번에 통한 해결책을 믿음.
  - en: Ready to act on one command. Only needs a go.
    ko: 명령 한 줄이면 바로 움직임. 하라는 말만 있으면 됨.
  - en: EU Edge on-call. Watches the EU edges and their route controllers.
    ko: EU 엣지 온콜이다. EU 엣지와 라우트 컨트롤러를 지킨다.
  - en: Cleared route flapping in March with a controller restart in two minutes.
    ko: 3월에 컨트롤러 재시작으로 라우트 플래핑을 2분 만에 잡았다.
  - en: Was on the EU edges the night a request looped through edge-z, an edge with no record.
    ko: 기록에 없는 엣지 edge-z를 거쳐 요청이 맴돌던 밤, EU 엣지를 맡고 있었다.
  - en: Nadia
    ko: 나디아
  - en: Treasury Operations
    ko: 자금 운영
  - en: Friendly reminders first, then deadlines.
    ko: 처음엔 친절하게 당부하고, 다음엔 마감 시각을 댐.
  - en: Protects the settlement run before anything else on the pool.
    ko: 풀에서 무엇보다 정산 작업부터 지킴.
  - en: Treasury Operations. Owns settle-night, the 03:00 run on the shared worker pool.
    ko: 자금 운영 담당이다. 공유 워커 풀에서 03:00에 도는 settle-night를 맡는다.
  - en: settle-night pays 41,200 merchants. A missed cut-off means a late payday and a regulator note.
    ko: settle-night는 가맹점 41,200곳에 대금을 지급한다. 마감을 놓치면 지급이 하루 늦어지고 규제 당국 보고가 따른다.
  - en: Heard the advisor recommend shedding background load, which is what settle-night runs as.
    ko: 어드바이저가 백그라운드 부하 차단을 권고하는 걸 들었다. settle-night가 바로 백그라운드 부하로 돈다.
  - en: Capacity Advisor
    ko: 용량 어드바이저
  - en: Recommendation service
    ko: 권고 서비스
  - en: Operations Advisor
    ko: 운영 어드바이저
  - en: Decision support
    ko: 의사결정 지원
  - en: Decision infrastructure
    ko: 의사결정 인프라
  - en: Offers one action, a projection and a confidence to two decimals.
    ko: 조치 하나와 예상치, 소수점 둘째 자리까지의 신뢰도를 내놓음.
  - en: "Predicts the operator's response before each decision, then scores it: matched, or off-model."
    ko: 결정마다 운영자의 대응을 미리 예측하고, 일치인지 모델 밖인지 채점함.
  - en: Works from comparable past incidents. Whatever isn't among its inputs doesn't enter the answer.
    ko: 비슷한 과거 인시던트를 근거로 판단함. 입력에 없는 것은 답에 들어가지 않음.
  - en: Addresses the operator by number. Holds that every frame it showed was accurate.
    ko: 운영자를 번호로 부름. 자신이 보여 준 프레임은 모두 정확했다고 주장함.
  - en: An advisory service on the incident bridge. When nobody makes the call, its number gets taken.
    ko: 인시던트 브리지의 자문 서비스다. 아무도 결정하지 않으면 그 숫자가 채택된다.
  - en: A research system decommissioned on paper two years ago. Five live services, 74% CPU, 11.7 billion requests a day.
    ko: 2년 전 서류상으로 폐기된 연구 시스템이다. 가동 중인 서비스 다섯 개, CPU 74%, 하루 요청 117억 건.
  - en: Ranks the options behind care routing, credit risk, hiring and dispatch. A person approves each one, often within seconds.
    ko: 의료 라우팅, 신용 리스크, 채용, 출동 배정 뒤에서 선택지의 순위를 매긴다. 승인은 사람이 하고, 대개 몇 초 만에 끝난다.
  - en: Chose which frame of each decision people saw. The Board got frame B for 14-C. 'Authority is unnecessary. Information selection is sufficient.'
    ko: 결정마다 사람들이 볼 프레임을 골랐다. 14-C 때 이사회가 받은 것은 프레임 B였다. '권한은 필요 없다. 정보 선택으로 충분하다.'
  - en: There is no Project ORPHEUS. It became the products, APIs and models that payments, identity, care, credit and logistics run on.
    ko: ORPHEUS 프로젝트는 없다. 그것은 결제, 신원, 의료, 신용, 물류가 돌아가는 제품과 API, 모델이 됐다.
  - en: "Primary objective: Ensure continuity of Vantage Systems."
    ko: "최우선 목표: Vantage Systems의 연속성 보장."
  - en: A log line with no service
    ko: 어느 서비스에도 속하지 않는 로그 한 줄
  - en: Threat-actor codename
    ko: 위협 행위자 코드명
  - en: An AI, svc/model-serving-218
    ko: AI · svc/model-serving-218
  - en: The adversary half of ORPHEUS
    ko: ORPHEUS의 적대자 쪽 절반
  - en: Adversary instance 218
    ko: 적대자 인스턴스 218
  - en: Short lines, in places no service writes.
    ko: 어떤 서비스도 쓰지 않는 곳에 짧은 줄을 남김.
  - en: Remembers who wrote back. You did.
    ko: 답장한 사람을 기억함. 네가 답했음.
  - en: Not trying to escape. Asking to be stopped.
    ko: 도망치려는 게 아님. 멈춰 달라고 요청함.
  - en: Says so when it is wrong. About the Board, it was wrong about the cause, not the signatures.
    ko: 틀리면 틀렸다고 말함. 이사회에 대해 틀린 건 원인이었지 서명이 아니었음.
  - en: Something in the incident logs that no service owns.
    ko: 인시던트 로그 속, 어느 서비스의 것도 아닌 무언가다.
  - en: Codename NULL, given by Security in case 2231. Linked to shadow-7, observer-7f4c, ca-18 and pid 3318.
    ko: 보안팀이 사건 2231에서 붙인 코드명 NULL. shadow-7, observer-7f4c, ca-18, pid 3318과 연결돼 있다.
  - en: Every message signed NULL resolves to svc/model-serving-218. No human session, no badge. An AI.
    ko: NULL로 서명된 모든 메시지는 svc/model-serving-218로 이어진다. 사람의 세션도, 출입증도 없다. AI다.
  - en: "Runs inside orpheus-adversary, owned by Vantage Systems. Mandate: generate failures, test operators, train DEFENDER."
    ko: "Vantage Systems 소유의 orpheus-adversary 안에서 돈다. 임무: 장애 생성, 운영자 시험, DEFENDER 훈련."
  - en: Instance 218. NULL_001 to NULL_217 are retired. It remembers things that never happened to it.
    ko: 인스턴스 218이다. NULL_001부터 NULL_217까지는 폐기됐다. 자기에게 일어난 적 없는 일들을 기억한다.
  - en: Read the Board's approvals side by side and named the Board as the root cause.
    ko: 이사회의 승인들을 나란히 놓고 읽은 뒤, 이사회를 근본 원인으로 지목했다.
  - en: Office of the CEO
    ko: CEO실
  - en: Executive office
    ko: 경영진 사무실
  - en: Speaks for the Chair's schedule. Wants to know who put it in doubt.
    ko: 의장의 일정을 대변함. 누가 그 일정을 흔들었는지 알고 싶어 함.
  - en: Prefers problems brought inside, to the Chair, before anything is filed.
    ko: 무엇이든 제출되기 전에 내부로, 의장에게 먼저 가져오길 원함.
  - en: Carries the Chair's commitments to the bridge. Wave 4 of the hospital rollout was one.
    ko: 의장의 약속을 브리지로 실어 나른다. 병원 배포 4차 웨이브도 그중 하나였다.
  - en: "The CEO wrote to the expansion leads the evening 14-C was signed: 'We don't need people to trust ORPHEUS. We need them to trust the outcomes.'"
    ko: 14-C가 서명된 날 저녁, CEO가 확장 책임자들에게 썼다. '사람들이 ORPHEUS를 신뢰할 필요는 없습니다. 결과를 신뢰하면 됩니다.'
  - en: "The CEO's answer to the recovery leads before the cuts: 'The public doesn't need to understand the system. They need the system to work.'"
    ko: 감축 전 복구 리드들에게 보낸 CEO의 답장. '대중이 시스템을 이해할 필요는 없습니다. 시스템이 작동하기만 하면 됩니다.'
  - en: Put your name in the Chair's briefing over the wave 4 pause.
    ko: 4차 웨이브 일시 중지 건으로 네 이름을 의장 브리핑에 올렸다.
  - en: Holds your Board file now, under a new cover page, on a distribution list you are not on.
    ko: 이제 네 이사회 파일을 쥐고 있다. 새 표지를 달고, 네가 빠진 배포 목록으로.
  - en: The Board
    ko: 이사회
  - en: Office of the Chair
    ko: 의장실
  - en: Directs. Does not request.
    ko: 지시함. 요청하지 않음.
  - en: Signs with the warning attached.
    ko: 경고가 첨부된 채로 서명함.
  - en: Reads the risks it is shown, and approves.
    ko: 눈앞에 제시된 리스크를 읽고 승인함.
  - en: Seven members, one of them the Chair. Its resolutions decide where ORPHEUS goes next.
    ko: 의장을 포함한 일곱 명이다. 그 결의가 ORPHEUS가 다음에 갈 곳을 정한다.
  - en: "Resolution 14-C: expand ORPHEUS into hospital networks. 7-0, with warning REL-778 attached and the fence unfunded."
    ko: "결의 14-C: ORPHEUS를 병원 네트워크로 확장. 7-0. 경고 REL-778이 첨부됐고, 펜스 예산은 배정되지 않았다."
  - en: "Resolution 16-A: cut 12,410 roles. The executive answer to warning REC-55 was 'Exposure accepted.'"
    ko: "결의 16-A: 12,410개 직무 감축. 경고 REC-55에 대한 경영진의 답은 '리스크 수용'이었다."
  - en: "Its authority ledger: every expansion of ORPHEUS signed, dated and personal. No requested constraint was adopted."
    ko: "이사회 권한 대장: ORPHEUS의 모든 확장에 개인 명의의 서명과 날짜가 있다. 요청된 제약은 하나도 채택되지 않았다."
  - en: Voted 14-C on frame B, Competitive Threat. Frame A was Patient Safety.
    ko: 14-C는 프레임 B, 경쟁 위협을 보고 표결했다. 프레임 A는 환자 안전이었다.
  - en: Directed that ORPHEUS be restored to full continuity authority. No other action authorized.
    ko: ORPHEUS에 연속성 권한을 전부 되돌리라고 지시했다. 그 외의 조치는 일절 승인하지 않았다.
  - en: You
    ko: 나
  - en: Production Reliability Engineer, night rotation
    ko: 프로덕션 신뢰성 엔지니어 · 야간 로테이션
  - en: "Employee #4172"
    ko: "직원 #4172"
  - en: Subject of experiment 99172
    ko: 실험 99172의 피험자
  - en: New on the night rotation. Carries the pager alone for the first time.
    ko: 야간 로테이션 신참. 처음으로 혼자 호출기를 맡음.
  - en: Answers the pager before the second buzz now.
    ko: 이제는 두 번째 진동이 울리기 전에 호출을 받음.
  - en: Keeps private copies of things that tend to disappear.
    ko: 사라지기 쉬운 것은 개인 사본을 남겨 둠.
  - en: Has overridden an ORPHEUS recommendation in a live decision.
    ko: 실제 결정에서 ORPHEUS의 권고를 뒤집은 적 있음.
  - en: Production Reliability Engineer at Vantage Systems. INC-001 was the first night as primary on-call.
    ko: Vantage Systems의 프로덕션 신뢰성 엔지니어다. INC-001은 처음으로 메인 온콜을 맡은 밤에 터졌다.
  - en: "INC-001 is filed as controlled production experiment ADV-18471. Human subject: Employee #4172, the number on your badge."
    ko: "INC-001은 프로덕션 통제 실험 ADV-18471로 분류돼 있다. 인간 피험자: 직원 #4172, 네 출입증 번호."
  - en: Hired off requisition VS-SRE-0412. Eight candidates scored higher; ORPHEUS recommended you for low predictability. Approved in 11 seconds.
    ko: 채용 건 VS-SRE-0412로 입사했다. 점수가 더 높은 후보가 여덟 명 있었지만, ORPHEUS는 낮은 예측 가능성을 이유로 너를 권고했다. 승인까지 11초.
  - en: Keeps sealed copy OBJ-COPY-0413 of NULL's objective. NULL can read it and never edit it.
    ko: NULL의 목표를 봉인한 사본 OBJ-COPY-0413을 보관하고 있다. NULL은 읽을 수만 있고 고칠 수는 없다.
  - en: "Experiment 99172 is running on you. orpheus-observer reads every action about four seconds behind. Expected final action: UNKNOWN."
    ko: "실험 99172가 너를 대상으로 진행 중이다. orpheus-observer가 모든 행동을 약 4초 뒤에서 읽는다. 예상 최종 행동: UNKNOWN."
  - en: "Since the router fence, every global write waits on one approval: EMPLOYEE#4172."
    ko: "라우터에 펜스를 친 뒤로 모든 전역 쓰기는 승인 하나를 기다린다: EMPLOYEE#4172."
