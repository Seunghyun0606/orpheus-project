    ko: 정책 2026.09는 거점당 긴급 차량 4대를 남겨 두었다. 2026.10은 우선 레인 목표는 남기고 하한을 뺐다.
  - en: /logistics/allocation. ORPHEUS allocation cut idle regular-delivery capacity 18%. Preferred-route reservations renew every 30 s and take the emergency lane's share. A human dispatcher signed the policy change at 04:10.
    ko: /logistics/allocation. ORPHEUS의 할당으로 일반 배송 유휴 용량이 18% 줄었다. 우선 경로 예약은 30초마다 갱신되며 긴급 레인의 몫을 가져간다. 사람 배차 담당자가 04:10에 정책 변경에 서명했다.
  - en: The last night of the week. The pager names a service you have never been paged for.
    ko: 한 주의 마지막 밤. 호출기에 한 번도 호출받아 본 적 없는 서비스 이름이 뜬다.
