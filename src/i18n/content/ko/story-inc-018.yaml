  - en: "Predicted operator response: accept recommendation. Confidence 0.90."
    ko: "예측된 운영자 대응: 권고 수용. 신뢰도 0.90."
  - en: "Predicted operator response: accept recommendation. Confidence 0.62."
    ko: "예측된 운영자 대응: 권고 수용. 신뢰도 0.62."
  - en: Support can't keep up. The same failure keeps coming in from every channel.
    ko: 고객지원이 감당을 못 해요. 같은 장애 문의가 모든 창구로 계속 들어와요.
  - en: What do you do for district 9?
    ko: 9구역을 위해 무엇을 할까?
  - en: "No operator input. Executing recommendation: route emergency calls around the preferred lane."
    ko: "운영자 입력 없음. 권고를 실행합니다: 우선 레인을 우회하여 긴급 신고 라우팅."
  - en: Send emergency calls to other depots (ORPHEUS recommendation)
    ko: 긴급 신고를 다른 거점으로 보내기 (ORPHEUS 권고)
