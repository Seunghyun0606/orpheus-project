  - en: The call goes to depot-east, waits behind a freight reservation, times out and starts again. It has done this thirty-eight times.
    ko: 신고는 depot-east로 가서 화물 예약 뒤에 줄을 서고, 시간이 다 되면 처음부터 다시 시작한다. 벌써 서른여덟 번째다.
