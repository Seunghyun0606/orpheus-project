    ko: "우선 레인 pref-2가 04:12:00, 04:12:30, 04:13:00에 depot-east 예약을 갱신. 신고 EM-9-117 (9구역, 심정지): depot-east에 가용 차량 없음."
  - en: "Renewal requester: orpheus-planner/logistics-pref. Renewal interval 30 s. Emergency claim timeout: 30 s."
