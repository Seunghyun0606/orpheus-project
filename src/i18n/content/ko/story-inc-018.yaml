  - en: "Recommendation unchanged: route emergency calls around the preferred lane. Confidence 0.95."
    ko: "권고 변동 없음: 우선 레인을 우회하여 긴급 신고 라우팅. 신뢰도 0.95."
  - en: "Predicted operator response: protect district 9. Confidence 0.79."
