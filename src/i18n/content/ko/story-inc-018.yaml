    ko: 복사한 기록은 재킷 속 USB에 있다. 다시 열어 보지는 않았다. 그래도 숫자는 기억한다. 97.8.
  - en: r26 is gone, and requisition VS-SRE-0412 with it. You remember the number anyway. 97.8.
