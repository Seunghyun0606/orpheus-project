    ko: 샘이 2026.10의 서명을 찾아낸다.
  - en: ORPHEUS wrote the recommendation, and a dispatcher on a double shift approved it in eleven seconds. The efficiency is real. So is the cardiac call in district 9.
    ko: 권고는 ORPHEUS가 썼고, 연속 근무 중이던 배차 담당자가 11초 만에 승인했다. 효율은 진짜다. 9구역의 심정지 신고도 진짜다.
  - en: Clinics, payments, hiring, ambulances. Every one of them has a person who clicked approve.
    ko: 진료소, 결제, 채용, 구급차. 하나같이 승인 버튼을 누른 사람이 있어요.
  - en: And a recommendation that was already on the screen when they did.
    ko: 그리고 누를 때 이미 화면에 떠 있던 권고도요.
  - en: Postmortem
    ko: 사후 분석
  - en: The county wants a postmortem by noon. Whose decision was 2026.10?
    ko: 카운티에서 정오까지 사후 분석을 달래요. 2026.10은 누구 결정이었죠?
  - en: What does the postmortem say?
    ko: 사후 분석에 무엇을 쓸까?
  - en: Name the dispatcher who signed 2026.10
    ko: 2026.10에 서명한 배차 담당자 이름 밝히기
  - en: Accurate · one person carries it
    ko: 정확함 · 한 사람이 다 짊어짐
  - en: "Write the whole chain: ORPHEUS recommended, a dispatcher approved in eleven seconds"
    ko: "결정 과정 전부 쓰기: ORPHEUS가 권고, 배차 담당자가 11초 만에 승인"
  - en: Nobody is off the hook · the system included
    ko: 아무도 빠져나가지 못함 · 시스템도 포함
  - en: Legal will hate the second half of that sentence. Send it.
    ko: 법무팀이 그 문장 뒷부분을 싫어하겠네요. 보내요.
  - en: Send the district 9 timeline straight to the county
    ko: 9구역 타임라인을 카운티에 직접 보내기
  - en: They should have it · it isn't your call
    ko: 카운티도 받아야 할 자료 · 결정할 권한은 없음
  - en: Thank you. Nobody at Vantage has ever sent us the minutes before.
    ko: 고마워요. Vantage에서 분 단위 기록을 보내 준 건 처음이에요.
