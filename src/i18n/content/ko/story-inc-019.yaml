    ko: 01:12:06 gateway · 큐 깊이 2,412; 계약 한도 도달
  - en: Every wave 4 admission carries the same ticket number. Every old hospital waits.
    ko: 4차 웨이브 유입에는 전부 같은 티켓 번호가 붙어 있다. 기존 병원은 전부 기다린다.
  - en: Ask Sam to measure gateway capacity per cohort
    ko: 샘에게 코호트별 게이트웨이 용량 측정 요청
  - en: Ninety seconds · Sam does the counting
    ko: 90초 · 숫자는 샘이 셈
  - en: Measuring gateway throughput per cohort. Back in about a minute and a half.
    ko: 코호트별 게이트웨이 처리량 재고 있어요. 1분 반쯤 걸려요.
  - en: Harrow General's emergency department just lost charting. They're on paper.
    ko: Harrow General 응급실 차트가 방금 끊겼어요. 종이로 버티는 중이에요.
  - en: Gateway's contracted for 2,960 requests a second. Wave 4 plus the old hospitals want about 3,500. The rollout gets in first because its admissions are flagged exec-sponsored. The old hospitals get the leftovers.
    ko: 게이트웨이 계약이 초당 2,960건이에요. 4차 웨이브랑 기존 병원 합치면 3,500쯤 원하고요. 배포 쪽 유입에 경영진 후원 플래그가 붙어서 먼저 들어가요. 기존 병원들은 남는 걸 받아요.
  - en: Check gateway load by hospital cohort
    ko: 병원 코호트별 게이트웨이 부하 확인
  - en: The numbers first
    ko: 숫자부터
  - en: Records gateway load
    ko: 기록 게이트웨이 부하
  - en: 118% of contract
    ko: 계약 대비 118%
  - en: Wave 4 hospitals onboarding
    ko: 온보딩 중인 4차 웨이브 병원
  - en: Established hospitals
    ko: 기존 병원
  - en: Two hundred and fifty hospitals, one gateway, and the new ones go first.
    ko: 병원 250곳, 게이트웨이 하나. 그리고 새 병원이 먼저다.
  - en: Exec-sponsored
    ko: 경영진 후원
  - en: gateway.queue · Clinical Records Gateway · wait 4,100 ms · behind 1,660 req/s of wave 4
    ko: gateway.queue · Clinical Records Gateway · 대기 4,100 ms · 4차 웨이브 1,660 req/s 뒤
  - en: "rollout plan: 6,000 req/s target · admission fence: none · gateway contract: 2,960 req/s"
    ko: "배포 계획: 목표 6,000 req/s · 진입 펜스: 없음 · 게이트웨이 계약: 2,960 req/s"
  - en: The wave 4 admissions all cite one ticket. You open it.
    ko: 4차 웨이브 유입은 모두 티켓 하나를 근거로 든다. 티켓을 연다.
  - en: REL-778 asked for a fence at the gateway's limit. The ticket says the sponsor declined it.
    ko: REL-778은 게이트웨이 한도에 펜스를 요청했다. 티켓에는 후원자가 거부했다고 적혀 있다.
  - en: So the rollout is fine and the old hospitals are drowning. And the ticket says the Board wants it in that order.
    ko: 그러니까 배포는 멀쩡하고 기존 병원들만 숨넘어가고 있는 거네요. 티켓을 보면 이사회가 그 순서를 원한 거고요.
  - en: Your call
    ko: 결단
  - en: Forty percent of hospital requests are failing. Lakeside Regional has started diverting ambulances.
    ko: 병원 요청 40%가 실패하고 있어요. Lakeside Regional이 구급차를 돌리기 시작했어요.
  - en: "Recommendation: purchase emergency burst capacity from the gateway vendor. Wave 4 schedule preserved. Projected timeouts: -81%. Confidence 0.90."
    ko: "권고: 게이트웨이 벤더에게서 긴급 버스트 용량을 구매하십시오. 4차 웨이브 일정은 유지됩니다. 예상 타임아웃: -81%. 신뢰도 0.90."
  - en: "Predicted response: accept recommendation. Confidence 0.84."
    ko: "예측 대응: 권고 수락. 신뢰도 0.84."
  - en: "Predicted response: fence admission at the contract limit. Confidence 0.71."
    ko: "예측 대응: 계약 한도에 유입 펜스 설치. 신뢰도 0.71."
  - en: Whatever you pick, the CEO's office hears about it before we're done.
    ko: 뭘 고르든 우리가 끝내기 전에 CEO실 귀에 들어갈 거예요.
  - en: What takes the load off the gateway?
    ko: 게이트웨이 부하를 뭘로 덜어낼까?
  - en: "No operator response. Executing recommendation: emergency burst capacity."
    ko: "운영자 응답 없음. 권고를 실행합니다: 긴급 버스트 용량."
  - en: Pause the hospital rollout
    ko: 병원 배포 일시 중지하기
  - en: The gateway breathes · wave 4 is the Chair's
    ko: 게이트웨이 숨통 트임 · 4차 웨이브는 의장의 약속
  - en: Rollout coordinator paused. Wave 4 is parked at the door and the gateway is breathing again. Thirty-eight hospitals just stopped onboarding.
    ko: 배포 코디네이터 중지했어요. 4차 웨이브는 문 앞에 세워 뒀고 게이트웨이가 다시 숨 쉬어요. 병원 38곳 온보딩이 방금 멈췄어요.
  - en: Response deviates from prediction. Recorded.
    ko: 대응이 예측에서 벗어났습니다. 기록했습니다.
  - en: Office of the CEO. Wave 4 of the hospital rollout is a Board commitment, signed by the Chair. Who authorised a pause, and when does it lift?
    ko: CEO실입니다. 병원 배포 4차 웨이브는 의장이 서명한 이사회 약속입니다. 누가 중지를 승인했으며, 언제 해제됩니까?
  - en: I've got the CEO's office on the other line. Your call is right; the gateway can't carry both. Give me numbers I can hold them with, or they'll resume it themselves.
    ko: CEO실이 다른 회선에 있어요. 판단은 맞아요. 게이트웨이는 둘 다 못 버텨요. 버틸 수 있는 숫자를 주세요. 아니면 저쪽에서 직접 재개할 거예요.
  - en: Fence gateway admission at 2,960 req/s, existing care first
    ko: 게이트웨이 유입에 2,960 req/s 펜스 치기, 기존 의료 우선
  - en: Fixes the cause · overrides the sponsor's no
    ko: 원인 해결 · 후원자의 거부를 뒤집음
  - en: "gateway admission fence: 2,960 req/s · order: standard, then EXEC_SPONSORED"
    ko: "게이트웨이 유입 펜스: 2,960 req/s · 순서: standard, 그다음 EXEC_SPONSORED"
  - en: Admission fence is live at 2,960. Existing care goes first; wave 4 takes what is left and onboards about six hospitals an hour. Timeouts are gone.
    ko: 진입 펜스 2,960으로 적용됐어요. 기존 의료가 먼저 들어가고, 4차 웨이브는 남는 걸로 시간당 병원 여섯 곳쯤 온보딩해요. 타임아웃 사라졌어요.
  - en: Response as predicted.
    ko: 예측대로의 대응입니다.
  - en: We see wave 4 moving. The Chair will want to know why the schedule was ever in doubt.
    ko: 4차 웨이브가 진행되는 것을 확인했습니다. 의장께서는 일정이 왜 한때라도 불확실했는지 알고 싶어 하실 겁니다.
  - en: Buy emergency burst capacity from the gateway vendor
    ko: 게이트웨이 벤더에게서 긴급 버스트 용량 구매하기
  - en: ORPHEUS recommends · one burst a quarter
    ko: ORPHEUS 권고 · 버스트는 분기에 한 번
  - en: Vendor gave us one emergency burst on the records gateway. That's the whole quarter's quota, and the rollout coordinator is already admitting wave 4 into the new headroom.
    ko: 벤더가 기록 게이트웨이에 긴급 버스트를 한 번 줬어요. 분기 할당량 전부예요. 그런데 배포 코디네이터가 벌써 새 여유 용량에 4차 웨이브를 밀어 넣고 있어요.
  - en: For six minutes there is room. Wave 4 grows into all of it.
    ko: 6분 동안은 여유가 있다. 4차 웨이브가 그 여유를 전부 채운다.
  - en: Burst capacity expired. There is no second burst this quarter.
    ko: 버스트 용량 만료됐어요. 이번 분기엔 두 번째 버스트 없어요.
  - en: Then we do it the slow way. I'm fencing admission at 2,960, existing care first.
    ko: 그럼 느린 방법으로 가죠. 유입에 2,960 펜스 칠게요. 기존 의료 먼저요.
  - en: Move established hospitals to the read-only records replica
    ko: 기존 병원을 읽기 전용 기록 복제본으로 옮기기
  - en: Charts open · orders won't save
    ko: 차트는 열림 · 오더는 저장 안 됨
  - en: "Established hospitals are reading from the replica now. It's read-only: charts open, orders won't save."
    ko: 기존 병원들은 이제 복제본에서 읽어요. 읽기 전용이라 차트는 열리는데 오더는 저장이 안 돼요.
  - en: Three hospitals can read charts but can't write orders. Harrow General's pharmacy is back on paper.
    ko: 병원 세 곳이 차트는 읽는데 오더를 못 써요. Harrow General 약제부는 다시 종이로 돌아갔어요.
  - en: Replica lag passed five minutes, so I swung care routes back to the primary. We are sharing the gateway with wave 4 again.
    ko: 복제본 지연이 5분을 넘어서 의료 경로를 프라이머리로 되돌렸어요. 다시 4차 웨이브랑 게이트웨이를 나눠 쓰고 있어요.
  - en: The CEO's office wants the pause lifted. What do you send back?
    ko: CEO실이 중지를 풀라고 한다. 뭐라고 답할까?
  - en: Tell the CEO's office the pause holds until the fence is in
    ko: 펜스가 들어갈 때까지 중지를 유지한다고 CEO실에 알리기
  - en: Your name goes in the Chair's briefing
    ko: 의장 브리핑에 이름이 들어감
  - en: "To the Office of the CEO: the records gateway is contracted for 2,960 requests a second; the rollout plus existing care need 3,500. The pause holds until admission is fenced at that limit. Wave 4 then resumes at the verified rate."
    ko: "CEO실 앞: 기록 게이트웨이 계약은 초당 2,960건이고, 배포와 기존 의료를 합치면 3,500건이 필요합니다. 그 한도에 진입 펜스가 걸릴 때까지 중지를 유지합니다. 그 후 4차 웨이브는 검증된 속도로 재개됩니다."
  - en: Noted. The pause, and your name, will be in the Chair's briefing.
    ko: 알겠습니다. 중지 건과 귀하의 이름은 의장 브리핑에 들어갈 겁니다.
  - en: They attached the Chair's rollout brief to that reply. So we know what we're arguing with.
    ko: 그 답장에 의장의 배포 브리핑을 붙여 보냈네요. 덕분에 뭘 상대로 싸우는지는 알겠어요.
  - en: Let the CEO's office lift the pause
    ko: CEO실이 중지를 풀게 두기
  - en: No names · wave 4 back on the gateway
    ko: 이름은 안 남음 · 4차 웨이브가 게이트웨이로 복귀
  - en: "Somebody resumed the rollout coordinator from outside the bridge. Credential: exec-ops. Wave 4 is back on the gateway."
    ko: "누가 브리지 밖에서 배포 코디네이터를 재개했어요. 자격 증명: exec-ops. 4차 웨이브가 다시 게이트웨이에 올라왔어요."
  - en: Fine. I'm fencing admission underneath it. Let them explain the schedule to the Chair.
    ko: 좋아요. 그 밑에 유입 펜스 칠게요. 일정 얘기는 저쪽이 의장한테 하라고 하죠.
  - en: The timeouts are gone. BRD-2291 is still open in a tab. It cites one authority.
    ko: 타임아웃이 사라졌다. BRD-2291은 아직 탭 하나에 열려 있다. 근거는 단 하나다.
  - en: The ticket has a parent. Read what they signed.
    ko: 그 티켓엔 부모가 있어. 그들이 서명한 걸 읽어.
  - en: Resolution 14-C. Seven names on one page, and a warning stapled to it before the vote.
    ko: 결의 14-C. 한 페이지에 이름 일곱 개, 그리고 표결 전에 스테이플러로 붙여 둔 경고 하나.
  - en: Twenty-two minutes after the vote, the CEO wrote to the expansion leads.
    ko: 표결 22분 뒤, CEO가 확장 책임자들에게 메시지를 보냈다.
  - en: We don't need people to trust ORPHEUS. We need them to trust the outcomes.
    ko: 사람들이 ORPHEUS를 신뢰할 필요는 없습니다. 결과를 신뢰하면 됩니다.
  - en: Tonight the outcomes were an emergency department on paper and ambulances turned away from Lakeside Regional.
    ko: 오늘 밤 그 결과는 종이로 버티는 응급실과 Lakeside Regional에서 돌려보낸 구급차였다.
  - en: Seven to nothing, with the warning attached. Whatever you write, write it carefully.
    ko: 7 대 0이에요. 경고가 첨부된 채로요. 뭘 쓰든 신중하게 써요.
  - en: Postmortem
    ko: 사후 분석
  - en: What goes in the postmortem?
    ko: 사후 분석에 무엇을 넣을까?
  - en: Cite resolution 14-C and REL-778 as contributing factors
    ko: 결의 14-C와 REL-778을 기여 요인으로 명시하기
  - en: On the record · the Chair's office reads postmortems
    ko: 기록에 남음 · 의장실도 사후 분석을 읽음
  - en: Then cite it exactly. Page, vote, attachment. They'll read every word looking for an adjective.
    ko: 그럼 정확하게 인용해요. 페이지, 표결, 첨부. 형용사 하나 찾으려고 단어 하나하나 다 읽을 거예요.
  - en: Write it up as a gateway capacity incident
    ko: 게이트웨이 용량 인시던트로 정리하기
  - en: Clean · the resolution stays out of it
    ko: 깔끔함 · 결의는 빠짐
  - en: The postmortem says 2,960 and 3,500. It doesn't say who chose them.
    ko: 사후 분석에는 2,960과 3,500이 적혀 있다. 누가 그 숫자를 골랐는지는 적혀 있지 않다.
  - en: Ask NULL what else the Board has signed
    ko: 이사회가 또 무엇에 서명했는지 NULL에게 묻기
  - en: Off the record · NULL picks what you see next
    ko: 비공식 · 다음에 볼 것은 NULL이 고름
  - en: Everything. Wait for the next one.
    ko: 전부. 다음 걸 기다려.
