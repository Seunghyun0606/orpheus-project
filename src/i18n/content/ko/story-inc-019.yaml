  - en: Established hospitals time out
    ko: 타임아웃 나는 기존 병원들
  - en: 24% of hospital requests fail and 240 wait at the records gateway. Wave 4 of the rollout went live an hour ago.
    ko: 병원 요청의 24%가 실패하고 240건이 기록 게이트웨이에서 대기 중이다. 배포 4차 웨이브는 한 시간 전에 나갔다.
  - en: Wave 4 and existing care share one gateway
    ko: 4차 웨이브와 기존 의료가 게이트웨이 하나를 공유
  - en: Wave 4 onboarding and 212 established hospitals call the same clinical records gateway. Wave 4 is admitted first; existing care times out behind it.
    ko: 4차 웨이브 온보딩과 기존 병원 212곳이 같은 진료 기록 게이트웨이를 호출한다. 4차 웨이브가 먼저 들어가고, 기존 의료는 그 뒤에서 타임아웃된다.
  - en: No admission fence at the gateway limit
    ko: 게이트웨이 한도에 진입 펜스 없음
  - en: The rollout targets 6,000 req/s against a 2,960 req/s gateway contract. The fence requested in REL-778 was never configured.
    ko: 배포는 2,960 req/s짜리 게이트웨이 계약에 6,000 req/s를 목표로 잡았다. REL-778에서 요청한 펜스는 끝내 설정되지 않았다.
  - en: Sam's gateway capacity check
    ko: 샘의 게이트웨이 용량 점검
  - en: Gateway contracted for 2,960 req/s; rollout plus existing care want about 3,500. Exec-sponsored wave 4 traffic is admitted first.
    ko: 게이트웨이 계약 2,960 req/s. 배포와 기존 의료를 합치면 약 3,500이 필요하다. 경영진 후원 4차 웨이브 트래픽이 먼저 유입된다.
  - en: Ticket BRD-2291
    ko: 티켓 BRD-2291
  - en: "BRD-2291: admission priority override for the hospital wave plan. Authority: Board resolution 14-C. Linked request REL-778, admission fence: DECLINED BY SPONSOR."
    ko: "BRD-2291: 병원 웨이브 계획의 유입 우선순위 재정의. 근거: 이사회 결의 14-C. 연결 요청 REL-778, 진입 펜스: 후원자가 거부함."
  - en: Executive rollout brief
    ko: 경영진 배포 브리핑
  - en: 'Executive rollout brief, hospital wave plan. Benefits: wider access, lower shared cost. Risk: REL-778, records gateway ceiling, admission fence requested. Decision line: "Retain wave schedule. Fence deferred to wave 6." Signed by the Chair. Tonight is wave 4.'
    ko: '경영진 배포 브리핑, 병원 웨이브 계획. 효과: 접근성 확대, 공유 비용 절감. 리스크: REL-778, 기록 게이트웨이 상한, 진입 펜스 요청됨. 결정 문구: "웨이브 일정 유지. 펜스는 6차 웨이브로 연기." 의장 서명. 오늘 밤이 4차 웨이브다.'
  - en: Board resolution 14-C
    ko: 이사회 결의 14-C
  - en: "Board resolution 14-C: expand ORPHEUS into hospital networks. APPROVED, 7-0. Attached before the vote: dependency-capacity warning REL-778, requesting a rollout admission fence. Fence: not funded. Stated benefit: wider access, lower operating cost. The care routes that timed out sat behind that missing fence."
    ko: "이사회 결의 14-C: ORPHEUS를 병원 네트워크로 확장. 승인, 7-0. 표결 전 첨부: 의존성 용량 경고 REL-778, 배포 진입 펜스 요청. 펜스: 예산 미배정. 명시된 효과: 접근성 확대, 운영비 절감. 타임아웃된 의료 경로는 바로 그 없는 펜스 뒤에 있었다."
  - en: "CEO message: trust the outcomes"
    ko: "CEO 메시지: 결과를 신뢰하라"
  - en: "CEO internal message, distribution: executive operations, hospital expansion leads. \"We don't need people to trust ORPHEUS. We need them to trust the outcomes.\" Sent the evening resolution 14-C was signed."
    ko: 'CEO 내부 메시지, 수신: 경영 운영, 병원 확장 책임자. "사람들이 ORPHEUS를 신뢰할 필요는 없습니다. 결과를 신뢰하면 됩니다." 결의 14-C가 서명된 날 저녁 발송.'
  - en: The service on the pager is one you have never been paged for. Its name has the word hospital in it.
    ko: 호출기에 뜬 서비스는 한 번도 호출받아 본 적 없는 이름이다. 이름에 병원이라는 단어가 들어 있다.
  - en: SEV1 · Hospital Network API · request failure rate above 20%
    ko: SEV1 · 병원 네트워크 API · 요청 실패율 20% 초과
  - en: Hospital request failures
    ko: 병원 요청 실패율
  - en: Requests waiting at the records gateway
    ko: 기록 게이트웨이 대기 요청
  - en: Hospital Network API is paging. Wave 4 of the hospital rollout went live an hour ago and the timeouts started twenty minutes later. Find out what they share.
    ko: 병원 네트워크 API 호출 떴어요. 병원 배포 4차 웨이브가 한 시간 전에 나갔고, 타임아웃은 20분 뒤부터 시작됐어요. 둘이 뭘 공유하는지 찾아 주세요.
  - en: Established hospitals are timing out on chart lookups. St. Aldric's emergency department is re-keying orders by hand.
    ko: 기존 병원들 차트 조회가 타임아웃 나요. St. Aldric 응급실은 오더를 손으로 다시 입력하고 있어요.
  - en: Wave 4 onboarding is on schedule. 38 hospitals connecting. I will advise when a decision is required.
    ko: 4차 웨이브 온보딩은 일정대로 진행 중입니다. 병원 38곳 연결 중. 결정이 필요해지면 권고하겠습니다.
  - en: First look
    ko: 첫 확인
