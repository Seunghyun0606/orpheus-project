    ko: 01:12:04 wave4/Lakeview Clinic · priority=EXEC_SPONSORED · 환자 동기화 유입 허용 (BRD-2291)
  - en: 01:12:05 Harrow General · priority=standard · order write queued 3.8 s; timeout
    ko: 01:12:05 Harrow General · priority=standard · 오더 쓰기 3.8 s 대기; 타임아웃
