  - en: Hospital Network API is paging. Wave 4 of the hospital rollout went live an hour ago and the timeouts started twenty minutes later. Find out what they share.
    ko: null
  - en: Established hospitals are timing out on chart lookups. St. Aldric's emergency department is re-keying orders by hand.
    ko: null
  - en: Measuring gateway throughput per cohort. Back in about a minute and a half.
    ko: null
  - en: Gateway's contracted for 2,960 requests a second. Wave 4 plus the old hospitals want about 3,500. The rollout gets in first because its admissions are flagged exec-sponsored. The old hospitals get the leftovers.
    ko: null
  - en: Harrow General's emergency department just lost charting. They're on paper.
    ko: null
  - en: Forty percent of hospital requests are failing. Lakeside Regional has started diverting ambulances.
    ko: null
  - en: Hospital IT directors have heard nothing from us. Two of them called the CEO's office directly.
    ko: null
  - en: Rollout coordinator paused. Wave 4 is parked at the door and the gateway is breathing again. Thirty-eight hospitals just stopped onboarding.
    ko: null
  - en: Office of the CEO. Wave 4 of the hospital rollout is a Board commitment, signed by the Chair. Who authorised a pause, and when does it lift?
    ko: null
  - en: I've got the CEO's office on the other line. Your call is right; the gateway can't carry both. Give me numbers I can hold them with, or they'll resume it themselves.
    ko: null
  - en: "Somebody resumed the rollout coordinator from outside the bridge. Credential: exec-ops. Wave 4 is back on the gateway."
    ko: null
  - en: "To the Office of the CEO: the records gateway is contracted for 2,960 requests a second; the rollout plus existing care need 3,500. The pause holds until admission is fenced at that limit. Wave 4 then resumes at the verified rate."
    ko: null
  - en: Noted. The pause, and your name, will be in the Chair's briefing.
    ko: null
  - en: Pause window closed. Wave 4 resumed on schedule and the gateway is over its limit again.
    ko: null
  - en: Vendor gave us one emergency burst on the records gateway. That's the whole quarter's quota, and the rollout coordinator is already admitting wave 4 into the new headroom.
    ko: null
  - en: Burst capacity expired. There is no second burst this quarter.
    ko: null
  - en: "Established hospitals are reading from the replica now. It's read-only: charts open, orders won't save."
    ko: null
  - en: Three hospitals can read charts but can't write orders. Harrow General's pharmacy is back on paper.
    ko: null
  - en: Replica lag passed five minutes, so I swung care routes back to the primary. We are sharing the gateway with wave 4 again.
    ko: null
  - en: Admission fence is live at 2,960. Existing care goes first; wave 4 takes what is left and onboards about six hospitals an hour. Timeouts are gone.
    ko: null
  - en: We see wave 4 moving. The Chair will want to know why the schedule was ever in doubt.
    ko: null
