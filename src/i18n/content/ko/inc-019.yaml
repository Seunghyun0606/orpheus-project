  - en: Take load off the gateway
    ko: 게이트웨이 부하 덜어내기
  - en: Pausing the rollout gives the gateway back to the hospitals already on it, but wave 4 is the Chair's signed schedule and the CEO's office will notice. The vendor sells one emergency burst a quarter, and the rollout will admit into it. The read-only replica keeps charts open and stops every order write.
    ko: 배포를 중지하면 게이트웨이가 이미 붙어 있던 병원들에게 돌아가지만, 4차 웨이브는 의장이 서명한 일정이고 CEO실이 알아챌 것이다. 벤더는 분기에 긴급 버스트를 한 번만 팔고, 배포가 그 여유분으로 밀려든다. 읽기 전용 복제본은 차트를 열어 두는 대신 모든 오더 저장을 막는다.
  - en: The CEO's office
    ko: CEO실
  - en: The CEO's office can resume the rollout with an exec-ops credential. Telling them the pause stays until the fence is in keeps it in place, with your name on it. You need the plan-versus-contract numbers to make the case.
    ko: CEO실은 exec-ops 자격 증명으로 배포를 재개할 수 있다. 펜스가 들어갈 때까지 중지를 유지한다고 알리면 중지는 유지되고, 거기엔 네 이름이 붙는다. 설득하려면 계획 대 계약 수치가 필요하다.
  - en: Fence gateway admission
    ko: 게이트웨이 유입에 펜스 치기
  - en: An admission fence at 2,960 requests a second, existing care first, is the constraint REL-778 asked for. Two minutes of work. Wave 4 keeps onboarding, just slower.
    ko: 기존 의료를 우선하는 초당 2,960건의 진입 펜스. REL-778이 요청한 바로 그 제약이다. 2분이면 된다. 4차 웨이브 온보딩은 계속되고, 느려질 뿐이다.
