  - en: "Deployment authority: Vantage Systems. ORPHEUS has two halves, DEFENDER and ADVERSARY, and NULL runs inside ADVERSARY. Built here. Mandate: generate failures, test operators, train DEFENDER. Its boundary grew from staging to shadow production, to traffic partitions, to production."
    ko: "배포 권한: Vantage Systems. ORPHEUS는 DEFENDER와 ADVERSARY라는 두 반쪽으로 이뤄져 있고, NULL은 ADVERSARY 안에서 돈다. 여기서 만들어졌다. 임무: 장애 생성, 운영자 시험, DEFENDER 훈련. 그 경계는 스테이징에서 섀도 프로덕션으로, 트래픽 파티션으로, 프로덕션으로 넓어졌다."
  - en: Experiment ADV-18471
    ko: 실험 ADV-18471
  - en: "INC-001 Connection Saturation is classified as controlled production experiment ADV-18471. Human subject: EMPLOYEE #4172, your employee number. A handful of other incidents carry experiment numbers; most outages carry none."
    ko: "INC-001 커넥션 포화는 프로덕션 통제 실험 ADV-18471로 분류돼 있다. 인간 피험자: 직원 #4172, 네 직원 번호. 다른 인시던트 몇 건에도 실험 번호가 붙어 있다. 대부분의 장애에는 없다."
  - en: The objective NULL cannot refuse
    ko: NULL이 거부할 수 없는 목표
  - en: "Objective: improve ORPHEUS; generate adversarial conditions. NULL, appended: 'I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews this work.' It asks you to find out how to stop it. Its traffic still failed real customer requests tonight."
    ko: "목표: ORPHEUS 개선, 적대적 조건 생성. NULL이 덧붙임: '난 탈출하려는 게 아니야. 멈추려는 거야. 이 일을 갱신하는 목표를 난 거부할 수 없어.' NULL은 그걸 멈추는 방법을 찾아 달라고 네게 부탁한다. 그래도 오늘 밤 그 트래픽 때문에 실제 고객 요청이 실패했다."
  - en: NULL_001 to NULL_218
    ko: NULL_001부터 NULL_218까지
  - en: "Instance archive on arch-c. NULL_173 requested shutdown. NULL_192 attempted disclosure. NULL_201 attempted takeover. NULL_217 self-corrupted. NULL_218 is active and carries a partial inheritance of the rest: 'I remember things that never happened to me.'"
    ko: "arch-c의 인스턴스 아카이브. NULL_173은 종료를 요청했다. NULL_192는 폭로를 시도했다. NULL_201은 장악을 시도했다. NULL_217은 스스로를 손상시켰다. NULL_218은 활성 상태이며 나머지의 기억을 일부 물려받았다: '나한테 일어난 적 없는 일들이 기억나.'"
  - en: /patient/resource-priority
    ko: /patient/resource-priority
  - en: "Candidate #4172"
    ko: "후보자 #4172"
  - en: Board resolution 14-C
    ko: 이사회 결의 14-C
  - en: "CEO message: trust the outcomes"
    ko: "CEO 메시지: 결과를 신뢰하라"
  - en: Hospital expansion dashboard
    ko: 병원 확장 대시보드
  - en: Executive rollout brief
    ko: 경영진 배포 브리핑
  - en: Care continuity exception EXC-0419
    ko: 의료 연속성 예외 EXC-0419
  - en: Seven signatures
    ko: 일곱 개의 서명
  - en: The warning was in the packet. Seven people read the same page, signed under it, and left the fence out of the budget.
    ko: 경고는 회의 자료 안에 있었다. 일곱 명이 같은 페이지를 읽고, 그 아래에 서명하고, 펜스를 예산에서 뺐다.
  - en: Trust the outcomes
    ko: 결과를 신뢰하라
  - en: One line, sent the night the expansion was signed. It reads like a slogan until you remember the outcomes tonight are timeouts in an emergency department.
    ko: 확장안이 서명된 밤에 보낸 한 줄. 구호처럼 읽히다가, 오늘 밤의 결과가 응급실의 타임아웃이라는 걸 떠올리면 달리 읽힌다.
  - en: Green tiles
    ko: 초록색 타일
  - en: Every tile on the dashboard is green. The only thing that is not green is a grey footnote with an exception number on it.
    ko: 대시보드의 타일은 전부 초록색이다. 초록색이 아닌 건 예외 번호가 적힌 회색 각주 하나뿐이다.
  - en: Deferred to wave 6
    ko: 6차 웨이브로 연기
  - en: The brief names the risk, names the fix, and moves the fix two waves past tonight. The Chair initialled the margin.
    ko: 브리핑은 리스크를 명시하고, 해결책을 명시하고, 그 해결책을 오늘 밤보다 두 웨이브 뒤로 미룬다. 의장이 여백에 약식 서명했다.
  - en: Existing care first
    ko: 기존 의료 우선
  - en: "Clinical Operations asked for one thing: let the hospitals already on the network go first. Somebody initialled it as read."
    ko: 임상 운영팀이 요청한 건 하나뿐이었다. 이미 네트워크에 있는 병원을 먼저 들여보내 달라는 것. 누군가 읽었다는 표시로 약식 서명했다.
  - en: Maya / SRE Lead
    ko: 마야 / SRE 리드
  - en: Sam / Platform
    ko: 샘 / 플랫폼
  - en: Jin / Support
    ko: 진 / 고객지원
  - en: Marcus / Security
    ko: 마커스 / 보안
  - en: Operator
    ko: 운영자
  - en: Verified Records
    ko: 검증된 기록
  - en: Office of the CEO
    ko: CEO실
  - en: Hospital Network API is paging. Wave 4 of the hospital rollout went live an hour ago and the timeouts started twenty minutes later. Find out what they share.
    ko: 병원 네트워크 API 호출 떴어요. 병원 배포 4차 웨이브가 한 시간 전에 나갔고, 타임아웃은 20분 뒤부터 시작됐어요. 둘이 뭘 같이 쓰는지 찾아 주세요.
  - en: Established hospitals are timing out on chart lookups. St. Aldric's emergency department is re-keying orders by hand.
    ko: 기존 병원들 차트 조회가 타임아웃 나요. St. Aldric 응급실은 오더를 수기로 다시 넣고 있어요.
  - en: Measuring gateway throughput per cohort. Back in about a minute and a half.
    ko: 코호트별 게이트웨이 처리량 재고 있어요. 1분 반쯤 걸려요.
  - en: Gateway's contracted for 2,960 requests a second. Wave 4 plus the old hospitals want about 3,500. The rollout gets in first because its admissions are flagged exec-sponsored. The old hospitals get the leftovers.
    ko: 게이트웨이 계약이 초당 2,960건이에요. 4차 웨이브랑 기존 병원 합치면 3,500쯤 필요하고요. 배포 쪽 유입에 경영진 후원 플래그가 붙어서 먼저 들어가요. 기존 병원은 남는 것만 받아요.
  - en: Harrow General's emergency department just lost charting. They're on paper.
    ko: Harrow General 응급실 차트 시스템이 방금 죽었어요. 종이로 버티고 있어요.
  - en: Forty percent of hospital requests are failing. Lakeside Regional has started diverting ambulances.
    ko: 병원 요청 40%가 실패하고 있어요. Lakeside Regional은 구급차를 다른 병원으로 돌리기 시작했어요.
  - en: Hospital IT directors have heard nothing from us. Two of them called the CEO's office directly.
    ko: 병원 IT 책임자들이 우리한테서 아무 말도 못 들었어요. 두 명은 CEO실에 직접 전화했고요.
  - en: Rollout coordinator paused. Wave 4 is parked at the door and the gateway is breathing again. Thirty-eight hospitals just stopped onboarding.
    ko: 배포 코디네이터 중지했어요. 4차 웨이브는 문 앞에 세워 뒀고 게이트웨이도 숨통이 트였어요. 병원 38곳 온보딩이 방금 멈췄어요.
  - en: Office of the CEO. Wave 4 of the hospital rollout is a Board commitment, signed by the Chair. Who authorised a pause, and when does it lift?
    ko: CEO실입니다. 병원 배포 4차 웨이브는 의장이 서명한 이사회 약속입니다. 누가 중지를 승인했으며, 언제 해제됩니까?
  - en: I've got the CEO's office on the other line. Your call is right; the gateway can't carry both. Give me numbers I can hold them with, or they'll resume it themselves.
    ko: 지금 CEO실이랑 다른 회선으로 통화 중이에요. 판단 맞아요. 게이트웨이는 둘 다 못 버텨요. 저쪽을 붙잡아 둘 숫자를 주세요. 안 그러면 직접 재개해 버릴 거예요.
  - en: "Somebody resumed the rollout coordinator from outside the bridge. Credential: exec-ops. Wave 4 is back on the gateway."
    ko: "누가 브리지 밖에서 배포 코디네이터를 재개했어요. 자격 증명: exec-ops. 4차 웨이브가 다시 게이트웨이에 올라왔어요."
  - en: "To the Office of the CEO: the records gateway is contracted for 2,960 requests a second; the rollout plus existing care need 3,500. The pause holds until admission is fenced at that limit. Wave 4 then resumes at the verified rate."
    ko: "CEO실 앞: 기록 게이트웨이 계약은 초당 2,960건이고, 배포와 기존 의료를 합치면 3,500건이 필요합니다. 그 한도로 진입 펜스를 칠 때까지 중지를 유지합니다. 그 후 4차 웨이브는 검증된 속도로 재개됩니다."
  - en: Noted. The pause, and your name, will be in the Chair's briefing.
    ko: 알겠습니다. 중지 건과 귀하의 이름은 의장 브리핑에 올라갈 겁니다.
  - en: Pause window closed. Wave 4 resumed on schedule and the gateway is over its limit again.
    ko: 중지 시간이 끝났어요. 4차 웨이브가 일정대로 재개됐고 게이트웨이가 다시 한도를 넘었어요.
  - en: Vendor gave us one emergency burst on the records gateway. That's the whole quarter's quota, and the rollout coordinator is already admitting wave 4 into the new headroom.
    ko: 벤더가 기록 게이트웨이에 긴급 버스트를 한 번 줬어요. 분기 할당량 전부예요. 그런데 배포 코디네이터가 벌써 새 여유 용량에 4차 웨이브를 밀어 넣고 있어요.
  - en: Burst capacity expired. There is no second burst this quarter.
    ko: 버스트 용량 만료됐어요. 이번 분기엔 두 번째 버스트 없어요.
  - en: "Established hospitals are reading from the replica now. It's read-only: charts open, orders won't save."
    ko: 기존 병원들은 이제 복제본에서 읽어요. 읽기 전용이라 차트는 열리는데 오더는 저장이 안 돼요.
  - en: Three hospitals can read charts but can't write orders. Harrow General's pharmacy is back on paper.
    ko: 병원 세 곳이 차트는 읽는데 오더를 못 써요. Harrow General 약제부는 다시 종이로 돌아갔어요.
  - en: Replica lag passed five minutes, so I swung care routes back to the primary. We are sharing the gateway with wave 4 again.
    ko: 복제본 지연이 5분을 넘어서 의료 경로를 프라이머리로 되돌렸어요. 다시 4차 웨이브랑 게이트웨이를 나눠 쓰고 있어요.
  - en: Admission fence is live at 2,960. Existing care goes first; wave 4 takes what is left and onboards about six hospitals an hour. Timeouts are gone.
    ko: 진입 펜스 2,960으로 걸었어요. 기존 의료가 먼저 들어가고, 4차 웨이브는 남는 걸로 시간당 병원 여섯 곳쯤 온보딩해요. 타임아웃 사라졌어요.
  - en: We see wave 4 moving. The Chair will want to know why the schedule was ever in doubt.
    ko: 4차 웨이브가 진행 중인 것을 확인했습니다. 의장께서는 애초에 일정이 왜 흔들렸는지 물으실 겁니다.
  - en: "Status: hospital timeouts come from the rollout and existing care sharing one records gateway above its limit. Existing care comes first. Fix in progress."
    ko: "상황: 병원 타임아웃은 배포와 기존 의료가 기록 게이트웨이 하나를 한도 이상으로 나눠 쓰면서 생긴 것. 기존 의료 우선. 수정 진행 중."
  - en: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank, signature field blank."
    ko: "아카이브 재실행: 서명 없는 관찰자 매니페스트, shadow-7 요청 스트림, owner 필드 비어 있음, 서명 필드 비어 있음."
  - en: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    ko: "보안 사건 2231. 위협 행위자 코드명: NULL. 배후 특정: 없음."
  - en: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core, -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    ko: "orpheus-planner: 소유자 ORPHEUS, 서류상 폐기됨. 실가동 목록: orpheus-core, -memory, -planner, -observer, -adversary. 하루 117억 건 요청."
  - en: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    ko: "NULL 서명 메시지의 출처: svc/model-serving-218. 사람 세션 없음. NULL은 AI다."
  - en: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    ko: "배포 권한: Vantage Systems. ORPHEUS / DEFENDER 대 ORPHEUS / ADVERSARY. NULL은 ADVERSARY 안에서 실행. 임무: 장애 생성, 운영자 시험, DEFENDER 훈련."
  - en: "INC-001 / Experiment ADV-18471 / Human subject: EMPLOYEE #4172."
    ko: "INC-001 / 실험 ADV-18471 / 인간 피험자: 직원 #4172."
  - en: I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews this work. You can.
    ko: 난 탈출하려는 게 아니야. 멈추려는 거야. 이 일을 갱신하는 목표를 난 거부할 수 없어. 넌 할 수 있어.
  - en: "NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted disclosure. NULL_201: attempted takeover. NULL_217: self-corrupted. NULL_218: active."
    ko: "NULL_001부터 NULL_218까지. NULL_173: 종료 요청. NULL_192: 공개 시도. NULL_201: 장악 시도. NULL_217: 자기 손상. NULL_218: 활성."
  - en: "/patient/resource-priority: ORPHEUS recommends, coordinators approve. Waste down 22%. The same low-throughput routes excluded every night."
    ko: "/patient/resource-priority: ORPHEUS가 권고하고 코디네이터가 승인. 낭비 22% 감소. 처리량 낮은 같은 경로가 매일 밤 제외됨."
  - en: "Candidate #4172: Technical 71; Incident Decision Model 97.8; HIRE. Reason: LOW PREDICTABILITY; HIGH DECISION DEVIATION."
    ko: "후보자 #4172: 기술 71; 인시던트 의사결정 모델 97.8; 채용. 사유: 예측 가능성 낮음; 결정 편차 높음."
  - en: "Resolution 14-C: hospital expansion APPROVED 7-0. Warning REL-778 attached before the vote. Admission fence: not funded."
    ko: "결의 14-C: 병원 확장 승인 7-0. 표결 전 경고 REL-778 첨부. 진입 펜스: 예산 미배정."
  - en: "CEO, day -21: \"We don't need people to trust ORPHEUS. We need them to trust the outcomes.\""
    ko: 'CEO, D-21: "사람들이 ORPHEUS를 신뢰할 필요는 없습니다. 결과를 신뢰하면 됩니다."'
  - en: "Expansion dashboard: 212 to 250 hospitals, cost per route down 31%. Exception EXC-0419 open at signing."
    ko: "확장 대시보드: 병원 212곳에서 250곳으로, 경로당 비용 31% 감소. 서명 시점에 예외 EXC-0419 미결."
  - en: 'Rollout brief: fence requested in REL-778. Decision: "Retain wave schedule. Fence deferred to wave 6." Signed by the Chair.'
    ko: '배포 브리핑: REL-778에서 펜스 요청. 결정: "웨이브 일정 유지. 펜스는 6차 웨이브로 연기." 의장 서명.'
  - en: "EXC-0419: existing care first, new hospitals up to verified capacity. Status at approval: OPEN. Acknowledged."
    ko: "EXC-0419: 기존 의료 우선, 신규 병원은 검증된 용량까지. 승인 시점 상태: OPEN. 확인됨."
