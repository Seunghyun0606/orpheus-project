  - en: Sign-ins wait for a seat
    ko: 자리를 기다리는 로그인
  - en: 24% of sign-ins time out after 8 seconds waiting for a seat in the session pool. 970 of 1,000 seats are taken, and CPU sits at 41%.
    ko: 로그인의 24%가 세션 풀 자리를 8초 기다리다 타임아웃된다. 1,000자리 중 970자리가 찼고, CPU는 41%에 머문다.
  - en: Alex's database report
    ko: 알렉스의 데이터베이스 보고
  - en: The session database connection pool is at 90 %, pinned by sessions that never close. Alex blames the database and wants to recycle it.
    ko: 세션 DB 커넥션 풀이 90 %다. 닫히지 않는 세션들이 붙잡고 있다. 알렉스는 데이터베이스를 탓하며 풀을 재생성하려 한다.
  - en: 781 seats held by repeat-214
    ko: repeat-214가 점유한 자리 781개
  - en: Synthetic sessions tagged repeat-214 hold 781 of 970 seats in the shared pool and renew every 30 seconds. Not one of them has ever gone idle.
    ko: repeat-214 태그가 붙은 합성 세션이 공유 풀 970자리 중 781자리를 차지하고 30초마다 갱신한다. 그중 단 하나도 유휴 상태가 된 적이 없다.
  - en: Synthetic traffic on the customer rule
    ko: 고객 규칙을 타는 합성 트래픽
  - en: The synthetic admission rule exists but never matches. Tagged sessions carry no class header, so they inherit the customer rule. No quota, normal priority, 4-hour idle timeout.
    ko: 합성 유입 규칙은 존재하지만 한 번도 매칭되지 않는다. 태그된 세션에는 class 헤더가 없어 고객 규칙을 물려받는다. 할당량 없음, 일반 우선순위, 유휴 타임아웃 4시간.
  - en: Batches of 214
    ko: 214개씩 묶인 배치
  - en: Tagged sessions open in batches of exactly 214, one batch every 214 seconds. The creator field reads "repeat". Too regular for a load test, too loud for an intruder.
    ko: 태그된 세션이 정확히 214개씩, 214초마다 한 배치로 열림. 생성자 필드 값은 "repeat". 부하 테스트라기엔 너무 규칙적이고, 침입자라기엔 너무 요란함.
  - en: Repeated session marker
    ko: 반복된 세션 표식
  - en: "UNKNOWN: follow the tag. I left it where you could see it."
    ko: "UNKNOWN: 태그를 따라가. 네 눈에 띄는 곳에 남겨 뒀어."
  - en: Evening rush, two days after the certificate storm.
    ko: 저녁 피크. 인증서 폭풍 이틀 뒤.
  - en: SEV2 · Session API · sign-in failure rate above 20%
    ko: SEV2 · 세션 API · 로그인 실패율 20% 초과
  - en: Sign-in failure rate
    ko: 로그인 실패율
  - en: Session pool
    ko: 세션 풀
  - en: Session API CPU
    ko: 세션 API CPU
  - en: Sign-ins are timing out and the session pool says it is full, but CPU is bored. Something is holding seats and never giving them back. Find out what before the evening rush.
    ko: 로그인이 타임아웃되고 세션 풀은 꽉 찼다는데 CPU는 한가해요. 뭔가가 자리를 잡고 안 놓고 있어요. 저녁 피크 전에 뭔지 찾아 주세요.
  - en: Customers can't sign in. The ones who already are keep getting bounced back to an empty cart.
    ko: 고객들이 로그인을 못 해요. 이미 로그인한 사람들은 자꾸 빈 장바구니로 튕겨 나가고요.
  - en: Half my queue still starts with "you logged me out on Tuesday". Please not again.
    ko: 제 대기열 절반이 아직도 "화요일에 로그아웃시켰잖아요"로 시작해요. 또 그러면 안 돼요.
  - en: Watching this one. Your trace from Tuesday is the best thing in case 2231.
    ko: 이번 건 지켜보고 있어요. 화요일에 준 추적 결과가 사건 2231에서 제일 쓸모 있는 자료예요.
  - en: Your shadow-7 notes sit in a folder called misc. Marcus hasn't asked. Yet.
    ko: 네 shadow-7 노트는 misc라는 폴더에 들어 있다. 마커스는 아직 묻지 않았다. 아직은.
  - en: Session database is running hot. I'd bet my lunch this is the connection pool again.
    ko: 세션 DB가 과열이에요. 점심 걸고 말하는데, 또 커넥션 풀이에요.
  - en: First move
    ko: 첫 수
  - en: Where do you look first?
    ko: 어디부터 볼까요?
  - en: List who is holding the open sessions
    ko: 열린 세션을 누가 붙잡고 있는지 조회하기
  - en: Straight to the seats
    ko: 자리로 곧장
  - en: session s-5f21 renewed (tag repeat-214) · 10.40.2.17
    ko: session s-5f21 갱신됨 (tag repeat-214) · 10.40.2.17
  - en: session s-5f22 renewed (tag repeat-214) · 10.40.2.31
    ko: session s-5f22 갱신됨 (tag repeat-214) · 10.40.2.31
  - en: sign-in for customer 88•••41 waited 8.0 s for a pool seat; giving up
    ko: sign-in for customer 88•••41 waited 8.0 s for a pool seat; giving up
  - en: Seats held by repeat-214
    ko: repeat-214가 점유한 자리
  - en: Median idle
    ko: 유휴 중앙값
  - en: 0 s
    ko: 0 s
  - en: Seven hundred and eighty-one seats, renewing on the dot. None of them is a person.
    ko: 781자리가 정확히 제때 갱신돼요. 그중에 사람은 하나도 없어요.
  - en: Ask Alex to check the session database
    ko: 알렉스에게 세션 데이터베이스 점검 요청
  - en: Alex owns that part · he already has an answer
    ko: 그 부분은 알렉스 몫 · 이미 답을 정해 둠
  - en: On it. It's going to be the database, you watch. Back in under two minutes.
    ko: 볼게요. 두고 봐요, 데이터베이스일 거예요. 2분 안에 돌아올게요.
  - en: Told you. Connection pool is at 90 %, and every connection is pinned by a session that hasn't closed in hours. Recycle the pool, raise my cap, and we're out of this.
    ko: 거봐요. 커넥션 풀 90 %고, 커넥션마다 몇 시간째 안 닫힌 세션이 붙잡고 있어요. 풀 재생성하고 상한만 올려 주면 끝나요.
  - en: Session DB connection pool
    ko: 세션 DB 커넥션 풀
  - en: Trace which admission rule lets tagged sessions in
    ko: 태그된 세션을 통과시키는 유입 규칙 추적하기
  - en: Slower · the rules, not the load
    ko: 느림 · 부하 말고 규칙을 봄
  - en: admission rule synthetic · matches class=synthetic header · sessions matched 0
    ko: 유입 규칙 synthetic · 매칭 조건 class=synthetic 헤더 · 매칭된 세션 0
  - en: admission rule customer-default · matches anything without a class · quota none · idle timeout 4 h · sessions matched 945
    ko: 유입 규칙 customer-default · 매칭 조건 class 없는 모든 요청 · 할당량 없음 · 유휴 타임아웃 4 h · 매칭된 세션 945
  - en: We have a rule for synthetic traffic. It has never matched a single session. Everything without a header gets treated like a customer.
    ko: 합성 트래픽용 규칙이 있긴 해요. 근데 지금까지 세션 하나도 매칭된 적이 없어요. 헤더 없는 건 전부 고객 취급이에요.
  - en: Three reports
    ko: 세 개의 보고
  - en: I listed the session holders. 781 seats belong to one tag, repeat-214, from an internal subnet. They renew every thirty seconds.
    ko: 세션 보유자 목록 뽑았어요. 781자리가 태그 하나, repeat-214 거예요. 내부 서브넷에서 왔고 30초마다 갱신해요.
  - en: And the admission rules. The synthetic rule never matches; the tagged sessions come in on the customer rule. No quota, four-hour timeout.
    ko: 유입 규칙도요. synthetic 규칙은 한 번도 안 걸리고, 태그된 세션은 고객 규칙으로 들어와요. 할당량 없고 타임아웃 4시간.
  - en: Three reports on the board, and every one of them is true.
    ko: 보드에 보고가 세 개. 그리고 셋 다 사실이다.
  - en: Is it the database?
    ko: 데이터베이스 문제인가?
  - en: We're wasting time. Recycle my pool.
    ko: 시간 낭비예요. 제 풀 재생성해요.
  - en: Alex's numbers are real. Before we act on them — which two pieces explain why no seat ever comes free?
    ko: 알렉스 숫자는 진짜예요. 그걸로 움직이기 전에, 왜 자리가 하나도 안 비는지 설명하는 증거 두 개는 뭐예요?
  - en: The database is hot and the pool is full. Which two pieces of evidence explain what is holding the seats?
    ko: 데이터베이스는 과열이고 풀은 꽉 찼다. 무엇이 자리를 붙잡고 있는지 설명하는 증거 두 개는?
  - en: The database is downstream of the seats. Look at who holds them, and why nothing makes them let go.
    ko: 데이터베이스는 자리보다 아래쪽에 있어요. 누가 자리를 잡고 있는지, 왜 아무것도 그걸 놓게 만들지 못하는지 보세요.
  - en: Sessions that never go idle, let in under a rule written for people who do. The database only feels it last.
    ko: 한 번도 유휴 상태가 되지 않는 세션들이, 유휴 상태가 되는 사람들을 위해 쓴 규칙으로 들어왔다. 데이터베이스는 그걸 맨 마지막에 느낄 뿐이다.
  - en: ...Fine. It's not the database. It's what's sitting on the database.
    ko: ...알았어요. 데이터베이스가 아니네요. 데이터베이스 위에 앉아 있는 게 문제네요.
  - en: Here's how I read it. repeat-214 never idles, and it comes in on the customer rule, so nothing ever times it out. Alex's pool is just where it hurts.
    ko: 제가 보기엔 이래요. repeat-214는 유휴 상태가 안 되고, 고객 규칙으로 들어오니까 아무것도 타임아웃을 안 걸어요. 알렉스 풀은 그냥 아픈 데가 거기인 거고요.
  - en: It still looks like my database from here.
    ko: 제 쪽에서 보기엔 여전히 데이터베이스 같은데요.
  - en: Your call
    ko: 결단
  - en: Session pool just went past 1,100. A third of sign-ins are failing and the mobile app is retrying in a loop.
    ko: 세션 풀이 방금 1,100을 넘었어요. 로그인 3분의 1이 실패하고 모바일 앱은 루프 돌면서 재시도 중이에요.
  - en: Support can't keep up. The same failure keeps coming in from every channel.
    ko: 고객지원이 감당을 못 해요. 같은 장애 문의가 모든 창구로 계속 들어와요.
  - en: What do you do about the seats?
    ko: 자리 문제를 어떻게 할까?
  - en: "autoscaler: session pool above 97% for 120 s · action: provision overflow pool"
    ko: "autoscaler: 세션 풀 97% 초과 120 s 지속 · 조치: 오버플로 풀 프로비저닝"
  - en: Give repeat-214 its own admission quota
    ko: repeat-214에 전용 유입 할당량 주기
  - en: Eighty seconds · tagged sessions above the quota are shed
    ko: 80초 · 할당량을 넘는 태그 세션은 끊김
  - en: Eighty seconds. The quota lands, and seven hundred tagged sessions are shown the door.
    ko: 80초. 할당량이 적용되고, 태그된 세션 700개가 문밖으로 밀려난다.
  - en: repeat-214 is capped at twenty seats. The pool is draining and real sign-ins are going through. Alex, your database just got its breath back.
    ko: repeat-214는 스무 자리로 묶었어요. 풀이 빠지고 진짜 로그인이 들어오고 있어요. 알렉스, 데이터베이스가 이제 숨 좀 쉬네요.
  - en: Recycle the session database connection pool
    ko: 세션 DB 커넥션 풀 재생성하기
  - en: Alex's fix · fast
    ko: 알렉스의 해법 · 빠름
  - en: Pool recycled. Connections down to a third. See? Database.
    ko: 풀 재생성 끝. 커넥션이 3분의 1로 줄었어요. 거봐요, 데이터베이스라니까요.
  - en: Forty-five seconds later the line climbs back.
    ko: 45초 뒤, 선이 다시 올라간다.
  - en: Huh. They're back. Same sessions grabbed every connection again inside a minute. They reconnect faster than any customer could.
    ko: 어. 다시 찼어요. 같은 세션들이 1분도 안 돼서 커넥션을 전부 다시 잡았어요. 어떤 고객보다도 빠르게 재접속해요.
  - en: I'm putting repeat-214 on its own quota. Twenty seats.
    ko: repeat-214에 전용 할당량 걸게요. 스무 자리.
  - en: Evict idle sessions to free seats
    ko: 유휴 세션을 퇴출해 자리 비우기
  - en: Seats now · whoever is idle loses their cart
    ko: 지금 바로 자리 확보 · 자리 비운 사람은 장바구니를 잃음
  - en: Eviction went through, and so did 3,140 customer carts. Everyone we kicked was a person who stepped away to find a card. Not one tagged session was idle.
    ko: 퇴출은 됐어요. 고객 장바구니 3,140개도 같이 날아갔고요. 쫓겨난 건 전부 카드 찾으러 잠깐 자리 비운 사람들이에요. 태그된 세션은 하나도 유휴 상태가 아니었어요.
  - en: Pool is back over a thousand. The seats we freed went straight to repeat-214.
    ko: 풀이 다시 천 개를 넘었어요. 비운 자리는 곧장 repeat-214가 가져갔어요.
  - en: Add an overflow session pool
    ko: 오버플로 세션 풀 추가하기
  - en: Costly · gives it room to grow into
    ko: 비쌈 · 자랄 공간을 내줌
  - en: Ninety seconds of headroom.
    ko: 90초의 여유.
  - en: The overflow pool is already full. Nine in ten new sessions in it carry the same tag. Whatever this is, it grows into anything we give it.
    ko: 오버플로 풀도 벌써 꽉 찼어요. 거기 새 세션 열에 아홉이 같은 태그예요. 이게 뭐든, 주는 만큼 자라요.
  - en: Every 214 seconds
    ko: 214초마다
  - en: The pool is quiet. You pull up the creation history of the tag before you close it.
    ko: 풀이 조용해졌다. 닫기 전에 태그의 생성 이력을 불러온다.
  - en: repeat-214 · batch 1 18:47:26 · batch 2 18:51:00 · batch 3 18:54:34 · batch 4 18:58:08 · 214 sessions each
    ko: repeat-214 · 배치 1 18:47:26 · 배치 2 18:51:00 · 배치 3 18:54:34 · 배치 4 18:58:08 · 배치마다 세션 214개
  - en: "batch 5 · 19:01:42 · creator: repeat / (field continues)"
    ko: "배치 5 · 19:01:42 · 생성자: repeat / (필드 계속됨)"
  - en: Two hundred fourteen sessions, every two hundred fourteen seconds. In the creator field of the newest batch, past the word repeat, a line no load generator would ever write.
    ko: 이백십사 개의 세션, 이백십사 초마다. 가장 최근 배치의 생성자 필드, repeat라는 단어 뒤에 어떤 부하 생성기도 쓰지 않을 한 줄이 있다.
  - en: It still signs itself UNKNOWN. Security's name hasn't reached it, or it doesn't care.
    ko: 여전히 UNKNOWN이라고 서명한다. 보안팀이 붙인 이름이 아직 닿지 않았거나, 신경 쓰지 않거나.
  - en: The creator field is free text. Anyone with console access can write in it.
    ko: 생성자 필드는 자유 입력란이다. 콘솔에 접근할 수 있으면 누구나 거기에 쓸 수 있다.
  - en: The creator field
    ko: 생성자 필드
  - en: Anything with a note in it goes to case 2231. You know that.
    ko: 메모가 들어 있는 건 전부 사건 2231로 와야 해요. 알잖아요.
  - en: What do you do with the marker?
    ko: 표식을 어떻게 할까?
  - en: Send the marker to Marcus for case 2231
    ko: 사건 2231용으로 마커스에게 표식 보내기
  - en: On the record · Security reads it first
    ko: 공식 기록 · 보안팀이 먼저 읽음
  - en: Got it. It left a note where you'd find it. I'm writing that down too.
    ko: 받았어요. 그쪽이 찾을 만한 곳에 메모를 남겼다는 것도 적어 둘게요.
  - en: Open a session by hand and write back in the creator field
    ko: 직접 세션을 열고 생성자 필드에 답장 쓰기
  - en: Off the record · it will know someone is listening
    ko: 비공식 · 누군가 듣고 있다는 걸 그것도 알게 됨
  - en: "session s-6a02 created by console · creator: why me?"
    ko: "session s-6a02 콘솔에서 생성됨 · 생성자: 왜 나야?"
  - en: You wait out the next two hundred fourteen seconds. The next batch arrives with twenty sessions, all the quota allows. One creator field is longer than the rest.
    ko: 다음 이백십사 초를 기다린다. 다음 배치가 세션 스무 개로 도착한다. 할당량이 허락하는 전부다. 생성자 필드 하나가 다른 것들보다 길다.
  - en: not you. whoever looked. you looked.
    ko: 너라서가 아니야. 들여다본 사람이라서. 네가 들여다봤잖아.
  - en: watch the routes.
    ko: 경로를 지켜봐.
  - en: Clear the field and log the tag as an unregistered load test
    ko: 필드를 지우고 태그를 미등록 부하 테스트로 기록하기
  - en: Quiet · nobody asks about it again
    ko: 조용함 · 다시는 아무도 묻지 않음
