entries:
  - en: Bad Deployment
    ko: 잘못된 배포
  - en: build 1847
    ko: 빌드 1847
  - en: key set
    ko: 키 세트
  - en: change notice
    ko: 변경 공지
  - en: Pager
    ko: 호출기
  - en: Maya / SRE Lead
    ko: 마야 / SRE 리드
  - en: Jin / Support
    ko: 진 / 고객지원
  - en: Sam / Platform
    ko: 샘 / 플랫폼
  - en: Authorization errors over the line
    ko: 호출 기준을 넘은 승인 오류
  - en: 27% of payment authorizations fail. The pager fires at 20%.
    ko: 결제 승인의 27%가 실패한다. 호출 기준은 20%다.
  - en: Retries pile on
    ko: 쌓여 가는 재시도
  - en: Rejected sessions retry on their own — 140 retries a second hit the gateway.
    ko: 거부된 세션이 알아서 재시도한다. 초당 140건의 재시도가 게이트웨이를 두드린다.
  - en: The verifier rejects new sessions
    ko: 새 세션을 거부하는 검증기
  - en: "token verifier: unknown key identifier on newly issued sessions"
    ko: "token verifier: 신규 발급 세션의 키 식별자를 알 수 없음"
  - en: Failed authorization trace
    ko: 실패한 승인 추적
  - en: The issuer emits K72 while the verifier still accepts K71.
    ko: 발급자는 K72를 내보내는데 검증기는 아직 K71만 받는다.
  - en: Platform key-set comparison
    ko: 플랫폼 키 세트 비교
  - en: Sam's War Room report confirms that the verifier still accepts K71.
    ko: 샘이 워룸에 보고한 대로, 검증기는 아직 K71을 받는다.
  - en: Deployment comparison
    ko: 배포 비교
  - en: Build 1847 switched issuer keys before the verifier key set was ready.
    ko: 빌드 1847은 검증기 키 세트가 준비되기 전에 발급자 키를 바꿨다.
  - en: Unattributed deployment annotation
    ko: 출처 불명의 배포 주석
  - en: A transient UNKNOWN annotation links build 1847 to an unexplained change notice.
    ko: 일시적인 UNKNOWN 주석이 빌드 1847을 정체불명의 변경 공지와 연결한다.
  - en: Two nights later. The pager is louder than you remember.
    ko: 이틀 뒤. 호출기 소리가 기억보다 크다.
  - en: SEV1 · Payment Gateway · authorization errors above 20%
    ko: SEV1 · Payment Gateway · 승인 오류 20% 초과
  - en: Authorization error rate
    ko: 승인 오류율
  - en: Identity API CPU
    ko: Identity API CPU
  - en: The checkout alert is real. We still need to separate issuer failures from gateway load.
    ko: 체크아웃 경보는 진짜예요. 발급자 장애인지 게이트웨이 부하인지는 아직 가려 봐야 해요.
  - en: By the way — your 02:23 line. I grepped every test harness we own. None of them writes "Good."
    ko: 참, 그 02:23 로그 줄 말인데요. 우리 테스트 하네스를 전부 grep해 봤는데, "좋아"라고 쓰는 건 하나도 없어요.
  - en: Security closed your log-line ticket, by the way. "No owner found." That was the whole reply.
    ko: 참, 보안팀이 그 로그 줄 티켓을 닫았어요. "소유자 없음." 답은 그게 다였어요.
  - en: The 02:23 line is still in a text file on your desktop. You haven't told anyone.
    ko: 02:23 로그 줄은 아직 바탕화면 텍스트 파일에 있다. 아무에게도 말하지 않았다.
  - en: Customers report failed payments. We can't tell yet whether retries also succeed.
    ko: 고객들이 결제 실패를 신고하고 있어요. 재시도가 성공하는지는 아직 몰라요.
  - en: Identity build 1847 went out an hour ago. Everyone will want to roll it back. Let's know why first.
    ko: 신원 서비스 (Identity) 빌드 1847이 한 시간 전에 나갔어요. 다들 롤백하자고 할 거예요. 이유부터 알고 가요.
  - en: Sam from Platform is on the bridge tonight. You can hand him work.
    ko: 오늘 밤엔 플랫폼팀 샘도 장애 대응 통화(브리지)에 들어와 있어요. 일을 넘겨도 돼요.
  - en: First move
    ko: 첫 수
  - en: How do you start?
    ko: 어떻게 시작할까?
  - en: Trace one failed authorization end to end
    ko: 실패한 승인 하나를 처음부터 끝까지 추적하기
  - en: Slow · you see it yourself
    ko: 느림 · 직접 확인함
  - en: "trace auth-7731: issuer kid=K72 → verifier accepts [K71] → reject"
    ko: "trace auth-7731: issuer kid=K72 → verifier accepts [K71] → reject"
  - en: Issuer key
    ko: 발급자 키
  - en: Verifier key
    ko: 검증기 키
  - en: The issuer and the verifier disagree about the key. That's not load.
    ko: 발급자랑 검증기가 키를 두고 엇갈려요. 부하 문제가 아니에요.
  - en: Ask Sam to check the verifier's key set while you watch the metrics
    ko: 지표를 보는 동안 샘에게 검증기 키 세트 확인 맡기기
  - en: Shares the load · Sam owns that part
    ko: 일을 나눔 · 그 부분은 샘이 맡음
  - en: On it. I'll compare the verifier key set with the active issuer. Two minutes.
    ko: 맡을게요. 검증기 키 세트를 지금 발급자 키랑 비교해 볼게요. 2분이요.
  - en: Authorization retries
    ko: 승인 재시도
  - en: Two minutes of watching a retry graph climb.
    ko: 재시도 그래프가 오르는 걸 2분 동안 지켜본다.
  - en: Verifier still accepts K71. The issuer is already signing with K72.
    ko: 검증기는 아직 K71만 받아요. 발급자는 벌써 K72로 서명하고 있고요.
  - en: Good hand-off. That's two people's worth of work in one.
    ko: 잘 넘겼어요. 두 사람 몫을 한 번에 한 셈이에요.
  - en: Route new authorizations to the stable region first
    ko: 새 승인 요청부터 안정 리전으로 돌리기
  - en: Buys about three minutes · not a fix
    ko: 3분쯤 벎 · 해결은 아님
  - en: The stable region takes the traffic. For three minutes the graph looks almost normal.
    ko: 안정 리전이 트래픽을 받는다. 3분 동안 그래프는 거의 정상처럼 보인다.
  - en: The window's closing and we still don't know why. Sam?
    ko: 시간은 없는데 아직 이유를 몰라요. 샘?
  - en: Already looking. Verifier still accepts K71. The issuer is signing with K72.
    ko: 이미 보고 있어요. 검증기는 아직 K71만 받아요. 발급자는 K72로 서명하고요.
  - en: Build 1847
    ko: 빌드 1847
  - en: The deployment diff loads. Build 1846 on the left, 1847 on the right.
    ko: 배포 비교 화면이 열린다. 왼쪽은 빌드 1846, 오른쪽은 1847.
  - en: "1847: issuer.signing_key K71 → K72 · verifier.keyset unchanged (rollout pending)"
    ko: "1847: issuer.signing_key K71 → K72 · verifier.keyset 변경 없음 (배포 대기 중)"
  - en: There it is. 1847 switched the issuer to the new key before the verifier had it. Wrong order, not a bad build.
    ko: 여기 있네요. 1847이 검증기가 새 키를 받기도 전에 발급자 키부터 바꿨어요. 빌드가 나쁜 게 아니라 순서가 틀린 거예요.
  - en: Two ways out. Undo the release, or finish what it started.
    ko: 방법은 두 가지예요. 릴리스를 되돌리거나, 하다 만 걸 마저 끝내거나.
  - en: Your call
    ko: 결단
  - en: Support queue just doubled. People are retrying their cards over and over.
    ko: 고객지원 대기열이 방금 두 배가 됐어요. 다들 카드 결제를 몇 번이고 다시 하고 있어요.
  - en: An all-night pharmacy says one card in four bounces at the till. I can't tell them when it'll stop.
    ko: 24시간 약국 한 곳에서 카드 넷 중 하나가 계산대에서 튕긴대요. 언제 괜찮아지냐는데 말해 줄 수가 없어요.
  - en: How do you fix it?
    ko: 어떻게 고칠까?
  - en: Out of time. I'm rolling 1847 back.
    ko: 시간 다 됐어요. 1847 롤백할게요.
  - en: Roll back Identity build 1847
    ko: 신원 서비스 빌드 1847 롤백하기
  - en: Familiar · tonight's release is undone
    ko: 익숙한 방법 · 오늘 밤 릴리스가 취소됨
  - en: Issuer's back on K71. The release team will have questions in the morning, but checkout works.
    ko: 발급자가 K71로 돌아왔어요. 아침에 릴리스팀이 따지러 오겠지만, 결제는 돼요.
  - en: Have Sam push key K72 to every verifier
    ko: 샘에게 모든 검증기에 K72 키 배포 맡기기
  - en: Keeps the release · touches every verifier at once
    ko: 릴리스 유지 · 모든 검증기를 한 번에 건드림
  - en: Pushing the new key set. Verifiers are picking it up… all green.
    ko: 새 키 세트 배포 중이에요. 검증기들이 받아 가고 있어요… 전부 정상.
  - en: Release survives. If one verifier had missed that push, we'd be chasing ghosts till sunrise.
    ko: 릴리스는 살았네요. 검증기 하나라도 그 배포를 놓쳤으면 해 뜰 때까지 유령을 쫓았을 거예요.
  - en: Page the release owner and wait for their call
    ko: 릴리스 담당자를 호출하고 답을 기다리기
  - en: By the book · slow
    ko: 절차대로 · 느림
  - en: The release owner's phone rings out. Twice.
    ko: 릴리스 담당자는 전화를 받지 않는다. 두 번이나.
  - en: Nobody's coming. I'm rolling it back.
    ko: 아무도 안 와요. 롤백할게요.
  - en: You open the deployment record to write up the timeline. Under build 1847 there is an annotation nobody on the bridge wrote.
    ko: 타임라인을 정리하려고 배포 기록을 연다. 빌드 1847 아래에 브리지의 누구도 쓴 적 없는 주석이 달려 있다.
  - en: "UNKNOWN: deployment 1847 isn't what they told you."
    ko: "UNKNOWN: 1847 배포는 네가 들은 그런 게 아니야."
  - en: It links to a change notice. The link goes nowhere.
    ko: 주석에는 변경 공지 링크가 걸려 있다. 눌러도 아무 데로도 가지 않는다.
  - en: That's twice now. Next time it happens, show me while it's still on screen.
    ko: 이걸로 두 번째예요. 다음에 또 나오면 화면에 떠 있을 때 바로 보여 줘요.
  - en: Release tooling leaves junk like that sometimes. File it with the rest.
    ko: 릴리스 도구가 가끔 그런 찌꺼기를 남겨요. 다른 것들이랑 같이 정리해 둬요.
  - en: Write-up
    ko: 정리
  - en: The War Room wants a summary before handover.
    ko: 워룸에서 인계 전에 요약해 달래요.
  - en: What do you send?
    ko: 뭘 보낼까?
  - en: Post the full timeline to the War Room, annotation included
    ko: 주석까지 포함한 전체 타임라인을 워룸에 올리기
  - en: Everyone on the bridge sees it
    ko: 브리지의 모두가 보게 됨
  - en: Huh. Who has write access to release annotations at three in the morning?
    ko: 어? 새벽 3시에 릴리스 주석 쓰기 권한이 있는 사람이 누구죠?
  - en: Send the deploy-order finding to the release team and leave the annotation out
    ko: 배포 순서 문제만 릴리스팀에 보내고 주석은 빼기
  - en: Clean and useful · the annotation stays unexplained
    ko: 깔끔하고 쓸모 있음 · 주석은 수수께끼로 남음
  - en: Post the timeline, then chase the dead change-notice link yourself
    ko: 타임라인을 올리고, 끊긴 변경 공지 링크는 직접 쫓아 보기
  - en: Off the clock · your curiosity
    ko: 근무 외 시간 · 네 호기심
  - en: The change-notice system says the notice was never filed. Its audit log says someone viewed it at 03:39.
    ko: 변경 공지 시스템에는 그 공지가 등록된 적이 없다고 나온다. 그런데 감사 로그에는 누군가 03:39에 그 공지를 열람했다고 남아 있다.
