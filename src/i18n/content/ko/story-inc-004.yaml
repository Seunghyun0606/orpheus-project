  - en: Capacity Advisor
    ko: 용량 어드바이저
  - en: Every heap climbing
    ko: 모든 힙이 차오름
  - en: Checkout heap averages 78% on all twelve instances, up from 49% ten minutes ago. GC pauses reach 880 ms.
    ko: 체크아웃 힙이 인스턴스 12대 전부에서 평균 78%다. 10분 전에는 49%였다. GC 일시정지는 880 ms까지 늘었다.
  - en: Checkout handler log
    ko: 체크아웃 핸들러 로그
  - en: Every checkout logs "response sent" and then, minutes later, its request object is still being walked by the garbage collector. Nothing is being let go.
    ko: 체크아웃마다 "response sent"가 찍히는데, 몇 분 뒤에도 그 요청 객체를 가비지 컬렉터가 계속 훑고 있다. 놓아주는 게 하나도 없다.
  - en: Completed requests held by their callbacks
    ko: 콜백에 붙잡힌 완료 요청
  - en: "Heap dump: checkout-handler / completionCallbacks / completed-request. 1.9 million requests kept alive after their responses were sent."
    ko: "힙 덤프: checkout-handler / completionCallbacks / completed-request. 응답을 보낸 뒤에도 살아 있는 요청 190만 건."
  - en: Sam's heap snapshots
    ko: 샘의 힙 스냅샷
  - en: Completed requests pile up under completionCallbacks. A restart empties the pile and it refills at the same slope. Rolling back to 4.11 brings back the large-cart crash.
    ko: 완료된 요청이 completionCallbacks 아래에 쌓인다. 재시작하면 비워지지만 같은 기울기로 다시 찬다. 4.11로 롤백하면 대형 장바구니 크래시가 돌아온다.
  - en: Tonight's big carts
    ko: 오늘 밤의 대형 장바구니
  - en: 6% of tonight's carts have more than 50 items, almost all of them wholesale reorders.
    ko: 오늘 밤 장바구니의 6%가 상품 50개를 넘는다. 거의 전부 도매 재주문이다.
  - en: Release 4.12 never lets go
    ko: 놓아주지 않는 릴리스 4.12
  - en: 4.12 registers a completion callback per request behind checkout.completion_callbacks and never removes it. 4.11 has no callback, and still has the large-cart crash 4.12 fixed.
    ko: 4.12는 checkout.completion_callbacks 뒤에서 요청마다 완료 콜백을 등록하고 끝내 제거하지 않는다. 4.11에는 콜백이 없지만, 4.12가 고친 대형 장바구니 크래시가 그대로 있다.
  - en: Deleted allocation log fragment
    ko: 삭제된 할당 로그 조각
  - en: "UNKNOWN: the objects are gone. the references are not."
    ko: "UNKNOWN: 객체는 사라졌어. 참조는 남았어."
  - en: An evening shift, for once. The storefront has been counting down to the evening sale all afternoon.
    ko: 웬일로 저녁 근무다. 쇼핑몰 첫 화면은 오후 내내 저녁 세일까지 남은 시간을 세고 있었다.
  - en: SEV2 · Checkout API · heap above 75% on 3 or more instances
    ko: SEV2 · Checkout API · 인스턴스 3대 이상에서 힙 75% 초과
  - en: Checkout heap (pool average)
    ko: 체크아웃 힙 (풀 평균)
  - en: GC pause (p99)
    ko: GC 일시정지 (p99)
  - en: 590 ms
    ko: 590 ms
  - en: Checkout error rate
    ko: 체크아웃 오류율
  - en: Checkout heap is climbing on every instance, not just one. The evening sale opens in about four minutes. I want this understood before then.
    ko: 체크아웃 힙이 인스턴스 하나가 아니라 전부에서 올라가고 있어요. 저녁 세일이 4분쯤 뒤에 열려요. 그 전에 원인을 파악하고 싶어요.
  - en: A handful of customers say the payment screen spins and never finishes. Not many yet.
    ko: 결제 화면이 계속 돌기만 하고 안 끝난다는 고객이 몇 명 있어요. 아직 많진 않아요.
  - en: "Recommended action: scale checkout pool from 12 to 20 instances. Projected heap per instance: 61%. Confidence 0.88."
    ko: "권고 조치: 체크아웃 풀을 인스턴스 12대에서 20대로 확장하십시오. 인스턴스당 예상 힙: 61%. 신뢰도 0.88."
  - en: Your ticket about the redacted request came back this afternoon. "Redaction performed by system account." It doesn't say which one.
    ko: 가려진 요청에 대해 열었던 티켓이 오늘 오후에 돌아왔다. "시스템 계정이 가림 처리함." 어느 계정인지는 적혀 있지 않다.
  - en: The timestamp from before batch 781 is still on a sticky note under your monitor. Nobody has claimed that request.
    ko: 배치 781 직전의 타임스탬프는 아직 모니터 아래 포스트잇에 적혀 있다. 그 요청의 주인은 여태 나서지 않았다.
  - en: About the marker. I asked around without asking. Nobody admits redacting anything. Keep it off the tickets.
    ko: 그 마커 말인데요. 티 안 나게 여기저기 물어봤어요. 뭘 가렸다고 인정하는 사람이 없어요. 티켓에는 계속 올리지 마요.
  - en: I'm on the bridge. Hand me whatever you don't want to do yourself.
    ko: 저 브리지에 있어요. 직접 하기 싫은 건 저한테 넘겨요.
  - en: Four minutes
    ko: 4분
  - en: Where do you start?
    ko: 어디서부터 시작할까?
  - en: Read the handler log, then take a heap dump
    ko: 핸들러 로그를 읽고 힙 덤프 뜨기
  - en: Thorough · you do it yourself
    ko: 꼼꼼함 · 직접 해야 함
  - en: "checkout-handler: order 88114 response sent (201, 212 ms)"
    ko: "checkout-handler: order 88114 response sent (201, 212 ms)"
  - en: "completionCallbacks: registered callback cb-88114 (registry size 1,903,226)"
    ko: "completionCallbacks: registered callback cb-88114 (registry size 1,903,226)"
  - en: "completionCallbacks: unregister requested for 0 callbacks"
    ko: "completionCallbacks: unregister requested for 0 callbacks"
  - en: "heap dump checkout-07: completionCallbacks → CompletedCheckoutRequest ×1,903,227 · 2.31 GB"
    ko: "heap dump checkout-07: completionCallbacks → CompletedCheckoutRequest ×1,903,227 · 2.31 GB"
  - en: Nearly two million checkouts that finished long ago, each one still held by the callback that fired when it did.
    ko: 끝난 지 한참 된 체크아웃이 200만 건 가까이. 하나하나가 끝날 때 실행된 콜백에 아직 붙잡혀 있다.
  - en: The last row of the dump is a single 4 KB block. Its owner is listed as a deleted process. Later.
    ko: 덤프 마지막 줄은 4 KB짜리 블록 하나다. 소유자는 삭제된 프로세스로 나와 있다. 나중에 보자.
  - en: Ask Sam to compare two heap snapshots
    ko: 샘에게 힙 스냅샷 두 개 비교 요청하기
  - en: A minute and a half · Sam owns that part
    ko: 1분 반 · 그 부분은 샘이 맡음
  - en: On it. Two heap snapshots a minute apart will tell us what's growing.
    ko: 맡을게요. 1분 간격으로 힙 스냅샷 두 개 뜨면 뭐가 늘어나는지 보일 거예요.
  - en: GC pause (checkout-07)
    ko: GC 일시정지 (checkout-07)
  - en: 900 ms
    ko: 900 ms
  - en: GC is running back to back on checkout-07. Pauses are at 900 ms and climbing.
    ko: checkout-07에서 GC가 쉴 새 없이 돌고 있어요. 일시정지가 900 ms인데 계속 늘어나요.
  - en: Snapshots agree. Completed requests pile up under completionCallbacks. A restart empties the pile and it refills at the same slope. And please don't roll back to 4.11. That's the release that crashes on big carts.
    ko: 스냅샷 결과가 일치해요. 완료된 요청이 completionCallbacks 아래에 쌓여요. 재시작하면 비워졌다가 같은 기울기로 다시 차요. 그리고 4.11로 롤백은 제발 하지 마세요. 대형 장바구니에서 크래시 나는 릴리스예요.
  - en: Ask Jin who is actually failing
    ko: 진에게 실제로 누가 실패하는지 물어보기
  - en: Slower · you'll know who gets hurt
    ko: 더 느림 · 누가 피해를 보는지 알게 됨
  - en: Spinners everywhere, no pattern by region. One thing — six percent of tonight's carts are wholesale reorders, fifty items and up. Those customers call.
    ko: 어디서나 로딩만 돌아요. 지역별 패턴은 없어요. 하나 있다면, 오늘 밤 장바구니의 6%가 상품 50개 넘는 도매 재주문이에요. 전화하는 건 그분들이에요.
  - en: Took a heap dump while you two talked. 1.9 million finished checkouts, all held under completionCallbacks.
    ko: 두 분 얘기하는 동안 힙 덤프 떴어요. 끝난 체크아웃 190만 건이 전부 completionCallbacks 아래에 잡혀 있어요.
  - en: The release diff loads. Last week's 4.11 on the left, tonight's 4.12 on the right.
    ko: 릴리스 비교 화면이 뜬다. 왼쪽은 지난주의 4.11, 오른쪽은 오늘 밤의 4.12.
  - en: "4.12 (today 18:40): completion callbacks one per request · flag checkout.completion_callbacks = on"
    ko: "4.12 (오늘 18:40): 요청당 완료 콜백 1개 · 플래그 checkout.completion_callbacks = on"
  - en: "4.12: callback removal not implemented (ticket CHK-2207, open)"
    ko: "4.12: 콜백 제거 미구현 (티켓 CHK-2207, 열림)"
  - en: "4.11: carts over 50 items crash at pricing (CHK-2181) · fixed in 4.12"
    ko: "4.11: 50개 넘는 장바구니가 가격 계산에서 크래시 (CHK-2181) · 4.12에서 수정됨"
  - en: Tonight's release registers a callback for every checkout and never takes it back. And the release before it can't price a big cart.
    ko: 오늘 밤 릴리스는 체크아웃마다 콜백을 등록하고 끝내 회수하지 않아요. 그리고 그 전 릴리스는 큰 장바구니 가격을 못 매기고요.
  - en: The callbacks sit behind a flag. Turning it off is a redeploy. Ninety seconds.
    ko: 콜백은 플래그 뒤에 있어요. 끄려면 재배포해야 해요. 90초요.
  - en: Your call
    ko: 결단
  - en: The sale opens in a minute. Support still has nothing to tell anyone.
    ko: 1분 뒤면 세일 열려요. 고객지원은 아직 누구한테도 해 줄 말이 없어요.
  - en: Support can't keep up. The same failure keeps coming in from every channel.
    ko: 고객지원이 감당을 못 해요. 같은 장애 문의가 모든 창구로 계속 들어와요.
  - en: What do you do about the leak?
    ko: 누수를 어떻게 할까?
  - en: No call? I'm taking the advisor's eight instances. It's a number, at least.
    ko: 결정 없어요? 어드바이저가 말한 인스턴스 8대 넣을게요. 적어도 숫자는 있잖아요.
  - en: Turn off the completion-callback flag on tonight's release
    ko: 오늘 밤 릴리스의 완료 콜백 플래그 끄기
  - en: Ninety seconds of redeploy · the sale opens halfway through
    ko: 90초 재배포 · 도중에 세일이 열림
  - en: checkout.completion_callbacks = off · redeploying 12 instances
    ko: checkout.completion_callbacks = off · 인스턴스 12대 재배포 중
  - en: The sale opens halfway through the redeploy. For thirty seconds, checkouts stall on the instances still waiting their turn.
    ko: 재배포가 절반쯤 됐을 때 세일이 열린다. 30초 동안, 아직 차례를 기다리는 인스턴스에서 체크아웃이 멈춘다.
  - en: Flag is off. The callback registry drained on the next collection and heap is flat at 39%. Big carts are pricing fine.
    ko: 플래그 껐어요. 다음 컬렉션에서 콜백 레지스트리가 비워졌고 힙은 39%에서 평평해요. 대형 장바구니 가격 계산도 정상이에요.
  - en: Restart the checkout instances to empty the heap
    ko: 체크아웃 인스턴스를 재시작해 힙 비우기
  - en: Fast · the same handler fills them again
    ko: 빠름 · 같은 핸들러가 다시 채움
  - en: Rolling restart finished. Heap is down to 41% on every instance. Same build, same handler.
    ko: 롤링 재시작 끝났어요. 모든 인스턴스에서 힙이 41%로 내려갔어요. 빌드도 핸들러도 그대로예요.
  - en: The evening sale is live. Traffic doubled, and so did the complaints.
    ko: 저녁 세일 시작됐어요. 트래픽이 두 배가 됐고, 불만도 두 배예요.
  - en: With the sale running, the restarted instances filled up in just over a minute.
    ko: 세일이 돌고 있어서, 재시작한 인스턴스가 1분 남짓 만에 다 찼어요.
  - en: checkout-03 and checkout-09 just got killed for running out of memory. Every cart in flight on them is gone.
    ko: checkout-03이랑 checkout-09가 방금 메모리 부족으로 죽었어요. 거기서 처리 중이던 장바구니는 전부 날아갔어요.
  - en: Enough. Turn the callbacks off.
    ko: 그만. 콜백 꺼요.
  - en: Roll checkout back to last week's release (4.11)
    ko: 체크아웃을 지난주 릴리스(4.11)로 롤백하기
  - en: Stops the leak · brings back last week's bug
    ko: 누수는 멈춤 · 지난주 버그가 돌아옴
  - en: 4.11 is live and the heap is flat. And every cart over fifty items is crashing at pricing again. That's the bug 4.12 was shipped to fix.
    ko: 4.11 올라갔고 힙은 평평해요. 그런데 50개 넘는 장바구니가 전부 가격 계산에서 다시 크래시 나요. 4.12가 고치려고 나간 바로 그 버그예요.
  - en: Large-cart failures
    ko: 대형 장바구니 실패
  - en: Our wholesale accounts can't place orders. Anything over fifty lines dies at pricing. Those are our biggest customers.
    ko: 도매 고객들이 주문을 못 넣고 있어요. 50줄 넘는 주문은 전부 가격 계산에서 죽어요. 우리 최대 고객들이에요.
  - en: Roll forward. 4.12, flag off.
    ko: 다시 올려요. 4.12로, 플래그는 끄고.
  - en: Add eight checkout instances (Capacity Advisor)
    ko: 체크아웃 인스턴스 8대 추가하기 (용량 어드바이저)
  - en: Costly · the advisor is 0.88 sure
    ko: 비쌈 · 어드바이저의 확신은 0.88
  - en: Checkout instances
    ko: 체크아웃 인스턴스
  - en: For two minutes the advisor's number holds. Then the new instances start to look like the old ones.
    ko: 2분 동안은 어드바이저의 숫자가 맞는다. 그러다 새 인스턴스들이 기존 인스턴스를 닮아 가기 시작한다.
  - en: All twenty instances are leaking now. We nearly doubled the bill and bought two minutes.
    ko: 이제 인스턴스 20대가 전부 새고 있어요. 비용은 거의 두 배로 늘었는데 번 시간은 2분이에요.
  - en: Turn the callbacks off. Then scale us back down.
    ko: 콜백 꺼요. 그다음에 인스턴스 다시 줄이고요.
  - en: The heap is quiet. Sam takes one last dump to close the incident, and one row refuses to drain.
    ko: 힙이 잠잠해졌다. 인시던트를 닫으려고 샘이 마지막 덤프를 뜨는데, 한 줄이 끝내 비워지지 않는다.
  - en: completionCallbacks · (unnamed block) · 1 · 4 KB · owner pid 3318 (process deleted)
    ko: completionCallbacks · (이름 없는 블록) · 1 · 4 KB · 소유자 pid 3318 (프로세스 삭제됨)
  - en: You look up pid 3318. The scheduler says it ran for two minutes, nine days ago, from an image with no deploy record. Then its entry was deleted.
    ko: pid 3318을 조회한다. 스케줄러에 따르면 9일 전에 2분 동안 돌았다. 배포 기록이 없는 이미지였다. 그 뒤 항목이 삭제됐다.
  - en: "9 days ago 03:15 · cold log store · pid 3318: UNKNOWN: the objects are gone. the references are not."
    ko: "9일 전 03:15 · 콜드 로그 저장소 · pid 3318: UNKNOWN: 객체는 사라졌어. 참조는 남았어."
  - en: The line was written a minute after the process stopped existing.
    ko: 프로세스가 존재하지 않게 된 지 1분 뒤에 쓰인 줄이다.
  - en: I checked pid 3318 three times. It was deleted nine days ago. I don't know how a process that doesn't exist is holding memory in tonight's build.
    ko: pid 3318 세 번 확인했어요. 9일 전에 삭제된 프로세스예요. 존재하지도 않는 프로세스가 어떻게 오늘 밤 빌드에서 메모리를 잡고 있는지 모르겠어요.
  - en: Write down the date. I want to know what else happened that night.
    ko: 날짜 적어 둬요. 그날 밤에 또 무슨 일이 있었는지 알고 싶어요.
  - en: Postmortem
    ko: 사후 분석
  - en: The leak writes itself. What about the block?
    ko: 누수 건은 쓸 게 뻔해요. 그 블록은 어떡할래요?
  - en: What do you do with pid 3318?
    ko: pid 3318을 어떻게 할까?
  - en: Put pid 3318 and the cold-store line in the postmortem
    ko: pid 3318과 콜드 로그 저장소의 그 줄을 사후 분석에 넣기
  - en: On the record · Security will read it
    ko: 공식 기록 · 보안팀이 읽게 됨
  - en: Then it's on the record. Good luck finding an owner for a process that doesn't exist.
    ko: 그럼 공식 기록이네요. 존재하지도 않는 프로세스의 소유자, 잘 찾아보시라고 해요.
  - en: Ask Sam to quietly pull everything pid 3318 ever touched
    ko: 샘에게 pid 3318이 건드린 걸 전부 조용히 뽑아 달라고 하기
  - en: Off the books · Sam's name on it too
    ko: 비공식 · 샘의 이름도 걸림
  - en: Quietly. Sure. Give me a few days.
    ko: 조용히요. 좋아요. 며칠만 줘요.
  - en: Report the leak only; copy the cold-store line for yourself
    ko: 누수만 보고하고, 콜드 로그 저장소의 그 줄은 따로 복사해 두기
  - en: A clean report · the line stays yours
    ko: 깔끔한 보고서 · 그 줄은 너만 앎
