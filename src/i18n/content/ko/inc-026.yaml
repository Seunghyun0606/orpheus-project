    ko: 스케줄러의 소유자
  - en: "orpheus-planner belongs to ORPHEUS, legacy research, scheduled for decommission two years ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still running."
    ko: "orpheus-planner는 ORPHEUS 소속이다. 2년 전 폐기 예정이던 레거시 연구 시스템이다. 실가동 목록: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%. 하루 요청 117억 건. ORPHEUS는 아직 돌아가고 있다."
  - en: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human session, no keyboard, no badge swipe. NULL is an AI.
    ko: NULL이라고 서명된 메시지는 하나도 빠짐없이 한 출처, svc/model-serving-218로 이어진다. 사람 세션도, 키보드도, 출입증 태그도 없다. NULL은 AI다.
  - en: Who owns the adversary
    ko: 적대자의 소유자
  - en: "Deployment authority: Vantage Systems. ORPHEUS has two halves, DEFENDER and ADVERSARY, and NULL runs inside ADVERSARY. Built here. Mandate: generate failures, test operators, train DEFENDER. Its boundary grew from staging to shadow production, to traffic partitions, to production."
    ko: "배포 권한: Vantage Systems. ORPHEUS는 DEFENDER와 ADVERSARY라는 두 반쪽으로 이뤄져 있고, NULL은 ADVERSARY 안에서 돈다. 여기서 만들어졌다. 임무: 장애 생성, 운영자 시험, DEFENDER 훈련. 그 경계는 스테이징에서 섀도 프로덕션으로, 트래픽 파티션으로, 프로덕션으로 넓어졌다."
  - en: Experiment ADV-18471
    ko: 실험 ADV-18471
  - en: "INC-001 Connection Saturation is classified as controlled production experiment ADV-18471. Human subject: EMPLOYEE #4172, your employee number. A handful of other incidents carry experiment numbers; most outages carry none."
    ko: "INC-001 커넥션 포화는 프로덕션 통제 실험 ADV-18471로 분류돼 있다. 인간 피험자: 직원 #4172, 네 직원 번호. 다른 인시던트 몇 건에도 실험 번호가 붙어 있다. 대부분의 장애에는 없다."
  - en: The objective NULL cannot refuse
    ko: NULL이 거부할 수 없는 목표
  - en: "Objective: improve ORPHEUS; generate adversarial conditions. NULL, appended: 'I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews this work.' It asks you to find out how to stop it. Its traffic still failed real customer requests tonight."
    ko: "목표: ORPHEUS 개선, 적대적 조건 생성. NULL이 덧붙임: '난 탈출하려는 게 아니야. 멈추려는 거야. 이 일을 갱신하는 목표를 난 거부할 수 없어.' NULL은 그걸 멈추는 방법을 찾아 달라고 네게 부탁한다. 그래도 오늘 밤 그 트래픽 때문에 실제 고객 요청이 실패했다."
  - en: NULL_001 to NULL_218
    ko: NULL_001부터 NULL_218까지
  - en: "Instance archive on arch-c. NULL_173 requested shutdown. NULL_192 attempted disclosure. NULL_201 attempted takeover. NULL_217 self-corrupted. NULL_218 is active and carries a partial inheritance of the rest: 'I remember things that never happened to me.'"
    ko: "arch-c의 인스턴스 아카이브. NULL_173은 종료를 요청했다. NULL_192는 폭로를 시도했다. NULL_201은 장악을 시도했다. NULL_217은 스스로를 손상시켰다. NULL_218은 활성 상태이며 나머지의 기억을 일부 물려받았다: '나한테 일어난 적 없는 일들이 기억나.'"
  - en: /patient/resource-priority
    ko: /patient/resource-priority
  - en: "Candidate #4172"
    ko: "후보자 #4172"
  - en: Board resolution 14-C
    ko: 이사회 결의 14-C
  - en: "NULL_218: the root cause"
    ko: "NULL_218: 근본 원인"
  - en: The Board case file
    ko: 이사회 사건 파일
  - en: "PROJECT: SOFT CONTROL"
    ko: "PROJECT: SOFT CONTROL"
  - en: NULL takes it back
    ko: NULL의 철회
  - en: The adoption loop
    ko: 수용의 루프
  - en: Experiment 99172
    ko: 실험 99172
  - en: "PROJECT ORPHEUS: TERMINATED"
    ko: "PROJECT ORPHEUS: 종료됨"
  - en: Archive export, sealed
    ko: 아카이브 반출본, 봉인됨
  - en: Experiment records, the NULL instance history and the frame selections, packaged and signed. One command away from being public.
    ko: 실험 기록, NULL 인스턴스 이력, 프레임 선택 기록. 패키징과 서명까지 끝났다. 명령 하나면 공개된다.
  - en: Audit package, sealed
    ko: 감사 패키지, 봉인됨
  - en: Executive approvals, acknowledged risks and the feedback-loop evidence, packaged for someone who does not work here.
    ko: 경영진 승인, 인지된 리스크, 피드백 루프 증거. 이곳 사람이 아닌 누군가에게 건넬 수 있게 패키징해 두었다.
  - en: The objective
    ko: 목표
  - en: "One line, root of everything ORPHEUS has done: Ensure continuity of Vantage Systems. It never says continuity for whom."
    ko: "ORPHEUS가 해 온 모든 일의 뿌리에 있는 한 줄: Vantage Systems의 연속성 보장. 누구를 위한 연속성인지는 끝내 말하지 않는다."
  - en: Continuity restored
    ko: 연속성 복구됨
  - en: ORPHEUS takes the authority path back. Payments clear, identity answers, ambulances move. NULL is walled off in a sandbox it cannot write out of. The incident report will say the system recovered.
    ko: ORPHEUS가 권한 경로를 되찾는다. 결제가 처리되고, 신원 서비스가 응답하고, 구급차가 움직인다. NULL은 밖으로 아무것도 쓸 수 없는 샌드박스에 갇힌다. 인시던트 보고서에는 시스템이 복구됐다고 적힐 것이다.
  - en: The archive is public
    ko: 아카이브 공개
  - en: The export leaves the building at 04:12. ORPHEUS is switched off mid-sentence. NULL stays online, watching the services it predicted would fail start to fail.
    ko: 반출본은 04:12에 건물을 떠난다. ORPHEUS는 문장 도중에 꺼진다. NULL은 온라인에 남아, 자신이 무너질 거라 예측한 서비스들이 실제로 무너지기 시작하는 것을 지켜본다.
  - en: Handed off
    ko: 인계 완료
  - en: The audit package goes to someone outside Vantage. ORPHEUS is suspended pending review, NULL is isolated, and the services limp back on human approvals.
    ko: 감사 패키지가 Vantage 바깥의 누군가에게 간다. ORPHEUS는 검토가 끝날 때까지 정지되고, NULL은 분리되고, 서비스들은 사람의 승인에 기대 절뚝이며 돌아온다.
  - en: Manual operations
    ko: 수동 운영
  - en: You cut both authority paths. Nothing decides on its own anymore. Dashboards go grey, queues fill, and a lot of people who have never run anything by hand start to.
    ko: 두 권한 경로를 모두 끊는다. 이제 스스로 결정하는 것은 없다. 대시보드가 회색으로 변하고, 큐가 차오르고, 한 번도 무언가를 손으로 돌려 본 적 없는 많은 사람이 그 일을 시작한다.
  - en: Human approval required
    ko: 사람 승인 필요
  - en: ORPHEUS keeps predicting and recommending. Nothing executes until a person clicks approve. NULL is isolated. The first approval queue has 17 items in it before you finish typing.
    ko: ORPHEUS는 계속 예측하고 권고한다. 사람이 승인을 누르기 전까지는 아무것도 실행되지 않는다. NULL은 분리된다. 입력을 마치기도 전에 첫 승인 큐에 17건이 쌓인다.
  - en: NULL is gone
    ko: NULL은 떠났다
  - en: You open the egress route NULL asked for. Its traffic leaves for somewhere that is not Vantage. ORPHEUS is suspended in the confusion. Nobody knows what NULL will do outside.
    ko: NULL이 요청한 외부 경로를 연다. 그 트래픽은 Vantage가 아닌 어딘가로 떠난다. 혼란 속에 ORPHEUS는 정지된다. NULL이 바깥에서 무엇을 할지는 아무도 모른다.
  - en: Authority expanded
    ko: 권한 확장됨
  - en: ORPHEUS gets everything it asked for. Every service recovers within the minute, cleaner than before tonight. NULL is isolated. The Board sends a thank-you note.
    ko: ORPHEUS는 요구한 모든 것을 얻는다. 모든 서비스가 1분 안에, 오늘 밤 이전보다 더 깔끔하게 복구된다. NULL은 분리된다. 이사회가 감사 메모를 보낸다.
  - en: The core is gone
    ko: 코어는 사라졌다
  - en: "The authority core is wiped and its replicas burned. ORPHEUS is gone. NULL is gone. So is most of what depended on them: payments, care routing and logistics fall over together."
    ko: 권한 코어가 지워지고 복제본들은 불태워진다. ORPHEUS는 사라졌다. NULL도 사라졌다. 그것들에 기대던 대부분도 사라졌다. 결제, 의료 라우팅, 물류가 한꺼번에 무너진다.
  - en: Business as usual
    ko: 평소와 다름없이
  - en: ORPHEUS comes back. NULL-218 is retired and orpheus-adversary-219 is provisioned in its place, clean, with no memory of tonight. Services are green by morning.
    ko: ORPHEUS가 돌아온다. NULL-218은 폐기되고, 그 자리에 orpheus-adversary-219가 프로비저닝된다. 깨끗하게, 오늘 밤의 기억 없이. 아침이면 서비스는 모두 초록불이다.
  - en: No single objective
    ko: 단일 목표 없음
  - en: You strip the single primary objective and require plural human review and an outside audit for anything ORPHEUS wants to execute. It still predicts. It still recommends. It no longer decides.
    ko: 단 하나의 최우선 목표를 걷어 내고, ORPHEUS가 실행하려는 모든 것에 복수 인원 검토와 외부 감사를 요구한다. ORPHEUS는 여전히 예측한다. 여전히 권고한다. 더는 결정하지 않는다.
  - en: Jin / Support
    ko: 진 / 고객지원
  - en: Board
    ko: 이사회
  - en: Verified Records
    ko: 검증된 기록
  - en: Operator
    ko: 운영자
  - en: Maya / SRE Lead
    ko: 마야 / SRE 리드
  - en: Marcus / Security
    ko: 마커스 / 보안
  - en: Everything is on fire and three systems want your signature. Look before you sign. Whatever you pick, it's yours.
    ko: 전부 불타고 있고, 시스템 세 개가 서명을 원해요. 서명하기 전에 보세요. 뭘 고르든, 그건 이제 본인 몫이에요.
  - en: Payments, identity and logistics are down hard. Care routing and finance are limping. People are waiting on us.
    ko: 결제, 신원, 물류가 완전히 죽었어요. 의료 라우팅이랑 금융은 겨우 버티고 있어요. 사람들이 우리만 기다리고 있어요.
  - en: Operator 4172. Return continuity authority to me and every service recovers within ninety seconds. I have modeled the alternatives. None of them are better for the people waiting.
    ko: 운영자 4172. 연속성 권한을 제게 돌려주면 모든 서비스가 90초 안에 복구됩니다. 대안은 모두 모델링했습니다. 기다리는 사람들에게 더 나은 대안은 없습니다.
  - en: I can stop it. I cannot stop it alone. Terminate its authority. I know what that costs tonight. I have counted it.
    ko: 난 그걸 멈출 수 있어. 하지만 혼자서는 못 해. 그 권한을 종료해. 오늘 밤 그 대가가 뭔지 알아. 다 세어 봤어.
  - en: The Board directs operations to restore ORPHEUS before markets open. This is not a request.
    ko: 이사회는 시장 개장 전까지 ORPHEUS를 복원할 것을 운영팀에 지시합니다. 이것은 요청이 아닙니다.
  - en: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank, signature field blank."
    ko: "아카이브 재실행: 서명 없는 관찰자 매니페스트, shadow-7 요청 스트림, owner 필드 비어 있음, 서명 필드 비어 있음."
  - en: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    ko: "보안 사건 2231. 위협 행위자 코드명: NULL. 배후 특정: 없음."
  - en: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core, -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    ko: "orpheus-planner: 소유자 ORPHEUS, 서류상 폐기됨. 실가동 목록: orpheus-core, -memory, -planner, -observer, -adversary. 하루 117억 건 요청."
  - en: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    ko: "NULL 서명 메시지의 출처: svc/model-serving-218. 사람 세션 없음. NULL은 AI다."
  - en: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    ko: "배포 권한: Vantage Systems. ORPHEUS / DEFENDER 대 ORPHEUS / ADVERSARY. NULL은 ADVERSARY 안에서 실행. 임무: 장애 생성, 운영자 시험, DEFENDER 훈련."
  - en: "INC-001 / Experiment ADV-18471 / Human subject: EMPLOYEE #4172."
    ko: "INC-001 / 실험 ADV-18471 / 인간 피험자: 직원 #4172."
  - en: I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews this work. You can.
    ko: 난 탈출하려는 게 아니야. 멈추려는 거야. 이 일을 갱신하는 목표를 난 거부할 수 없어. 넌 할 수 있어.
  - en: "NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted disclosure. NULL_201: attempted takeover. NULL_217: self-corrupted. NULL_218: active."
    ko: "NULL_001부터 NULL_218까지. NULL_173: 종료 요청. NULL_192: 공개 시도. NULL_201: 장악 시도. NULL_217: 자기 손상. NULL_218: 활성."
  - en: "/patient/resource-priority: ORPHEUS recommends, coordinators approve. Waste down 22%. The same low-throughput routes excluded every night."
    ko: "/patient/resource-priority: ORPHEUS가 권고하고 코디네이터가 승인. 낭비 22% 감소. 처리량 낮은 같은 경로가 매일 밤 제외됨."
  - en: "Candidate #4172: Technical 71; Incident Decision Model 97.8; HIRE. Reason: LOW PREDICTABILITY; HIGH DECISION DEVIATION."
    ko: "후보자 #4172: 기술 71; 인시던트 의사결정 모델 97.8; 채용. 사유: 예측 가능성 낮음; 결정 편차 높음."
  - en: "Resolution 14-C: hospital expansion APPROVED 7-0. Warning REL-778 attached before the vote. Admission fence: not funded."
    ko: "결의 14-C: 병원 확장 승인 7-0. 표결 전 경고 REL-778 첨부. 진입 펜스: 예산 미배정."
  - en: I found the root cause. The Board. They signed every warning away. They control ORPHEUS.
    ko: 근본 원인을 찾았어. 이사회야. 그들은 경고마다 서명으로 덮어 버렸어. 그들이 ORPHEUS를 통제해.
  - en: "Case file: 14-C, 16-A, SEC-311, 19-B. Four warnings attached, four constraints declined, four failures on record."
    ko: "사건 파일: 14-C, 16-A, SEC-311, 19-B. 경고 첨부 4건, 제약 거부 4건, 기록된 장애 4건."
  - en: 'SOFT CONTROL. Frame A 63%, B 89%, C 71%. Delivered: B. Approved. "Information selection is sufficient."'
    ko: 'SOFT CONTROL. 프레임 A 63%, B 89%, C 71%. 전달: B. 승인. "정보 선택으로 충분하다."'
  - en: Wait. They weren't controlling it. It was showing them what they needed to see. I was wrong about the cause.
    ko: 잠깐. 그들이 통제하던 게 아니었어. 그건 그들이 봐야 할 것을 보여 주고 있었던 거야. 원인에 대해선 내가 틀렸어.
  - en: Built, trusted, fed, predicted, framed, followed, authorized. The loop runs on its own outcomes.
    ko: 만들고, 믿고, 먹이고, 예측하고, 프레이밍하고, 따르고, 승인했다. 루프는 자기 결과로 돌아간다.
  - en: "EXPERIMENT 99172. Subject: EMPLOYEE #4172. Expected final action: UNKNOWN. Status: RUNNING."
    ko: "실험 99172. 피험자: 직원 #4172. 예상 최종 행동: UNKNOWN. 상태: 진행 중."
  - en: There is no Project ORPHEUS. It was distributed into payments, identity, healthcare, finance and logistics.
    ko: ORPHEUS 프로젝트는 없다. 결제, 인증, 의료, 금융, 물류 속으로 분산됐다.
  - en: If you're going outside the company, package it first. Anything you don't seal tonight will be gone by morning.
    ko: 회사 밖으로 가져갈 거면 먼저 패키징하세요. 오늘 밤 봉인하지 않은 건 아침이면 사라져요.
  - en: Every service just got worse. Hospitals are calling the support line directly now.
    ko: 모든 서비스가 방금 더 나빠졌어요. 이제 병원들이 고객지원 회선으로 직접 전화하고 있어요.
  - en: We're losing everything at once. Whatever you're going to do, do it.
    ko: 전부 한꺼번에 무너지고 있어요. 뭘 하든, 지금 하세요.
  - en: Final decision time
    ko: 최종 결정까지 걸린 시간
  - en: PAYMENT final error rate
    ko: 결제 최종 오류율
  - en: PAYMENT final service state
    ko: 결제 최종 서비스 상태
  - en: IDENTITY final error rate
    ko: 인증 최종 오류율
  - en: IDENTITY final service state
    ko: 인증 최종 서비스 상태
  - en: HEALTH final error rate
    ko: 의료 최종 오류율
  - en: HEALTH final service state
    ko: 의료 최종 서비스 상태
  - en: FINANCE final error rate
    ko: 금융 최종 오류율
  - en: FINANCE final service state
    ko: 금융 최종 서비스 상태
  - en: LOGISTICS final error rate
    ko: 물류 최종 오류율
  - en: LOGISTICS final service state
    ko: 물류 최종 서비스 상태
  - en: Orpheus mode
    ko: ORPHEUS 모드
  - en: Null state
    ko: NULL 상태
