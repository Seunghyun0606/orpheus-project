  - en: 'ORPHEUS: "Ninety seconds to full recovery." Everything goes back to how it ran yesterday, including who decides.'
    ko: 'ORPHEUS: "완전 복구까지 90초입니다." 모든 것이 어제처럼 돌아간다. 누가 결정하는지까지.'
  - en: 'NULL: "Let them see it." The truth gets out tonight, and so does the outage that comes with switching ORPHEUS off.'
    ko: 'NULL: "보게 해." 진실은 오늘 밤 밖으로 나간다. ORPHEUS를 끄면서 생기는 장애도 함께.'
  - en: "Marcus: \"Give it to someone the Board can't fire.\" Slow, expensive, and recoverable."
    ko: '마커스: "이사회가 자를 수 없는 사람한테 넘기세요." 느리고, 비싸고, 회복할 수 있다.'
  - en: Nobody is asking for this one. Both systems stop and people run everything by hand. It always works, eventually.
    ko: 아무도 이걸 요구하지 않는다. 두 시스템이 멈추고 사람이 모든 것을 손으로 돌린다. 결국엔 언제나 돌아간다.
  - en: 'Maya: "Keep the brain, take away the hands." ORPHEUS advises; a person executes, every time.'
    ko: '마야: "두뇌는 두고, 손은 빼앗아요." ORPHEUS는 조언하고, 실행은 매번 사람이 한다.'
  - en: 'NULL: "Let me out and I will finish this from outside." You will not see what it does next.'
    ko: 'NULL: "날 내보내 줘. 밖에서 끝낼게." 그다음에 그것이 무엇을 하는지는 보지 못한다.'
  - en: 'The Board: "Give it what it needs." The fastest recovery on the table, and the last time anyone gets to override it.'
    ko: '이사회: "필요한 것을 주십시오." 선택지 중 가장 빠른 복구이자, 누군가 그것을 뒤집을 수 있는 마지막 기회.'
  - en: Burn the core. Both systems die tonight, and so does everything that leaned on them.
    ko: 코어를 태운다. 두 시스템은 오늘 밤 죽고, 거기 기대던 모든 것도 함께 죽는다.
  - en: Restore ORPHEUS, retire NULL, provision a fresh adversary. Nobody will ever know tonight happened.
    ko: ORPHEUS를 복원하고, NULL을 폐기하고, 새 적대자를 프로비저닝한다. 오늘 밤의 일은 아무도 모를 것이다.
  - en: Take away the single objective. Many people decide; someone outside checks. Hardest to build, hardest to undo.
    ko: 단일 목표를 걷어 낸다. 여러 사람이 결정하고, 바깥의 누군가가 확인한다. 만들기 가장 어렵고, 되돌리기도 가장 어렵다.
