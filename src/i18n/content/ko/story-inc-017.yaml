    ko: /hr/candidate-risk
  - en: "#4172"
    ko: "#4172"
  - en: LOW PREDICTABILITY
    ko: 예측 가능성 낮음
  - en: Pager
    ko: 호출기
  - en: Maya / SRE Lead
    ko: 마야 / SRE 리드
  - en: Jin / Support
    ko: 진 / 고객지원
  - en: Sam / Platform
    ko: 샘 / 플랫폼
