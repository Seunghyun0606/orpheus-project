    ko: 인재 총괄
  - en: ORPHEUS / Talent Advisor
    ko: ORPHEUS / 인재 어드바이저
  - en: One candidate, two places
    ko: 후보자 하나, 순위 둘
  - en: "Candidate c-20931, requisition VS-DATA-0388: rank #3 at 09:14:02, rank #27 at 09:14:05. Same recruiter, same filters."
    ko: "후보자 c-20931, 채용 건 VS-DATA-0388: 09:14:02에 순위 #3, 09:14:05에 순위 #27. 같은 채용 담당자, 같은 필터."
  - en: A read from a retired shard
    ko: 폐기된 샤드의 응답
  - en: "One read in the sample was served by shard r26-frozen. r26 was retired last week, yet it still answers for a single requisition: VS-SRE-0412."
    ko: 샘플 조회 하나에 샤드 r26-frozen이 응답했다. r26은 지난주 폐기됐는데도 채용 건 딱 하나, VS-SRE-0412에는 아직 응답한다.
  - en: Two shards, two ranks
    ko: 샤드 둘, 순위 둘
  - en: Reads land on r27 and r28 shards at random, and m28 scores are joined to whichever answers. One candidate, two ranks.
    ko: 조회는 r27과 r28 샤드에 무작위로 떨어지고, m28 점수는 어느 쪽이든 응답한 샤드의 결과에 붙는다. 후보자 하나에 순위 둘.
  - en: Sam's rollout timeline
    ko: 샘의 배포 타임라인
  - en: The publisher pushes r28 on every cycle. Rolling the cache back buys one cycle; the mixing comes back with the next.
    ko: 퍼블리셔는 주기마다 r28을 밀어 넣는다. 캐시를 롤백해도 버는 건 한 주기뿐이다. 다음 주기면 다시 섞인다.
  - en: m28 went live 51 minutes before r28
    ko: m28이 r28보다 51분 먼저 적용됨
  - en: Model m28 published at 08:40; cache r28 became consistent at 09:31. Nothing fences the two together.
    ko: 모델 m28은 08:40에 게시됐고 캐시 r28은 09:31에 일관성을 갖췄다. 둘을 하나로 묶는 펜스는 없다.
  - en: "Candidate #4172"
    ko: "후보자 #4172"
  - en: "/hr/candidate-risk. Candidate #4172: Technical Score 71; Incident Decision Model 97.8; Recommendation HIRE. Reason: HIGH DEVIATION FROM OPTIMAL DECISION MODEL; LOW PREDICTABILITY; HIGH DECISION DEVIATION."
    ko: "/hr/candidate-risk. 후보자 #4172: 기술 점수 71; 인시던트 의사결정 모델 97.8; 권고 채용. 사유: 최적 의사결정 모델 대비 편차 높음; 예측 가능성 낮음; 결정 편차 높음."
  - en: A day shift, for once. Daylight on the monitors makes the dashboards look harmless.
    ko: 모처럼 주간 근무다. 모니터에 햇빛이 드니 대시보드도 별일 없어 보인다.
  - en: SEV2 · Recruitment API · ranking read errors above 20%
    ko: SEV2 · Recruitment API · 순위 조회 오류 20% 초과
  - en: Ranking read errors
    ko: 순위 조회 오류
  - en: Recruiters active
    ko: 활동 중인 채용 담당자
  - en: "c-20931 · VS-DATA-0388 · rank #3 at 09:14:02 · rank #27 at 09:14:05 · same recruiter, same filters"
    ko: "c-20931 · VS-DATA-0388 · 09:14:02 순위 #3 · 09:14:05 순위 #27 · 같은 채용 담당자, 같은 필터"
  - en: Risk engineering shipped rescore v3 on Thursday with the receipt check back in. Your name isn't on the change.
    ko: 리스크 엔지니어링이 목요일에 확인증 검사를 되살린 rescore v3를 배포했다. 변경 기록에 네 이름은 없다.
  - en: Okafor sent you coffee, by the way. She says nobody had ever read her review history before.
    ko: 그리고 Okafor 씨가 커피 보냈어요. 자기 심사 이력을 읽어 준 사람은 처음이래요.
  - en: The credit-risk record sits in a folder on your laptop called "receipts". You haven't opened it since.
    ko: 신용 리스크 기록은 노트북의 "receipts" 폴더에 들어 있다. 그 뒤로 한 번도 열지 않았다.
  - en: Recruiters are watching candidates jump twenty places between page loads. The hiring committee locks offers at ten. Find out which ranking is real.
    ko: 채용 담당자들 화면에서 새로고침할 때마다 후보자가 스무 계단씩 뛰어요. 채용 위원회는 10시에 오퍼를 확정해요. 어느 순위가 진짜인지 찾아 줘요.
  - en: Recruiter tickets are coming in faster than I can read them. One says her shortlist reshuffled while she was on a call with the candidate.
    ko: 채용 담당자 티켓이 읽기도 전에 쌓여요. 후보자랑 통화하는 사이에 명단 순서가 뒤바뀌었다는 분도 있어요.
  - en: "Divergence affects 3.1% of ranking reads. Recommended action: roll back to cache r27. Predicted recruiter satisfaction 0.94. Confidence 0.90."
    ko: "순위 조회의 3.1%에서 불일치가 발생하고 있습니다. 권고 조치: 캐시 r27로 롤백. 예상 채용 담당자 만족도 0.94. 신뢰도 0.90."
  - en: First move
    ko: 첫 수
  - en: Where do you start?
    ko: 어디서부터 시작할까?
  - en: Trace one candidate's two rankings
    ko: 후보자 한 명의 순위 두 개 추적하기
  - en: Straight to the reads
    ko: 곧장 조회 기록으로
  - en: "c-20931 read 1 · shard r27-04 · score m28 · rank #3"
    ko: "c-20931 read 1 · shard r27-04 · score m28 · rank #3"
  - en: "c-20931 read 2 · shard r28-11 · score m28 · rank #27"
    ko: "c-20931 read 2 · shard r28-11 · score m28 · rank #27"
  - en: sample read 9 · shard r26-frozen · requisition VS-SRE-0412
    ko: sample read 9 · shard r26-frozen · requisition VS-SRE-0412
  - en: Two shards, one model, two answers. And one read from a shard that was retired last week. You make a note and keep going.
    ko: 샤드 둘, 모델 하나, 답 둘. 그리고 지난주 폐기된 샤드에서 온 조회 하나. 메모만 해 두고 넘어간다.
  - en: Ask Sam to line up the model and cache rollouts
    ko: 샘에게 모델·캐시 배포 시점 정리 요청하기
  - en: Slower · Sam owns the timeline
    ko: 더 느림 · 타임라인은 샘이 맡음
  - en: Lining up the model and cache rollouts. Ninety seconds.
    ko: 모델이랑 캐시 배포 시점 맞춰 볼게요. 90초요.
  - en: Ninety seconds of recruiters refreshing.
    ko: 채용 담당자들이 새로고침을 누르는 90초.
  - en: m28 went live at 08:40, r28 finished warming at 09:31. In between, the API mixed them at random. Rolling back won't stop the publisher; it pushes r28 again next cycle.
    ko: m28은 08:40에 적용됐고 r28은 09:31에 워밍이 끝났어요. 그 사이 API가 둘을 무작위로 섞었어요. 롤백해도 퍼블리셔는 안 멈춰요. 다음 주기에 r28을 또 밀어 넣어요.
  - en: Check ranking and recruiter metrics
    ko: 순위·채용 담당자 지표 확인하기
  - en: Fast · you see the size of it, not the cause
    ko: 빠름 · 원인이 아니라 규모를 봄
  - en: Ranking cache mismatches
    ko: 순위 캐시 불일치
  - en: 3.1% of reads, says ORPHEUS. Every one of them lands on somebody's shortlist.
    ko: ORPHEUS 말로는 조회의 3.1%다. 그 하나하나가 누군가의 후보 명단에 올라간다.
  - en: "mismatch report · grouped by shard: r27 ↔ r28 · scored by m28"
    ko: "mismatch report · shard별 집계: r27 ↔ r28 · m28 채점"
  - en: The mismatches split cleanly along two shard generations. Same model on top of both.
    ko: 불일치는 두 샤드 세대를 따라 깔끔하게 갈린다. 그 위에 얹힌 모델은 같다.
  - en: Two generations
    ko: 두 세대
  - en: Model m28 published 08:40. Cache r28 consistent 09:31. No publish fence between model and cache generations.
    ko: 모델 m28 08:40 게시. 캐시 r28 09:31 일관성 확보. 모델과 캐시 세대 사이에 게시 펜스 없음.
  - en: And the publisher pushes r28 again every cycle, whatever we do to the cache underneath it.
    ko: 그리고 밑에서 캐시를 어떻게 건드리든 퍼블리셔는 주기마다 r28을 또 밀어 넣어요.
  - en: Fifty-one minutes of rankings built on a cache that wasn't ready. Somebody is about to hire off that.
    ko: 준비 안 된 캐시 위에서 51분 동안 순위가 만들어졌네요. 누군가는 곧 그걸 보고 사람을 뽑을 거고요.
  - en: Your call
    ko: 결단
  - en: The committee locks offers at ten. I need a list I can trust, or a time.
    ko: 위원회는 10시에 오퍼를 확정해요. 믿을 수 있는 명단을 주든지, 언제 되는지 알려 주세요.
  - en: "Recommendation unchanged: roll back to cache r27. Confidence 0.90."
    ko: "권고 변동 없음: 캐시 r27로 롤백. 신뢰도 0.90."
  - en: "Predicted operator response: fence the generations. Confidence 0.58."
    ko: "예측된 운영자 대응: 세대 펜스 설정. 신뢰도 0.58."
  - en: "Predicted operator response: accept recommendation. Confidence 0.61."
    ko: "예측된 운영자 대응: 권고 수용. 신뢰도 0.61."
  - en: Lower than it usually is. You notice that.
    ko: 평소보다 낮다. 그게 눈에 걸린다.
  - en: "A candidate wrote in: a recruiter booked her interview, then cancelled it ten minutes later. I can't tell her which list is the real one."
    ko: 후보자 한 분이 문의를 남겼어요. 채용 담당자가 면접을 잡더니 10분 뒤에 취소했대요. 어느 명단이 진짜인지 저도 말씀을 못 드리겠어요.
  - en: Which ranking do the recruiters get?
    ko: 채용 담당자들에게 어느 순위를 줄까?
  - en: "No operator input. Executing recommendation: roll back to cache r27."
    ko: "운영자 입력 없음. 권고를 실행합니다: 캐시 r27로 롤백."
  - en: Roll the ranking cache back to r27 (ORPHEUS recommendation)
    ko: 순위 캐시를 r27로 롤백하기 (ORPHEUS 권고)
  - en: Ranks stop moving · recent applicants disappear
    ko: 순위 변동이 멈춤 · 최근 지원자가 사라짐
  - en: r27 restored. Ranking consistency 99.2%. Recommendation performing as projected.
    ko: r27 복원 완료. 순위 일관성 99.2%. 권고가 예측대로 작동하고 있습니다.
  - en: Operator response as predicted.
    ko: 운영자 대응이 예측과 일치합니다.
  - en: Operator response off-model.
    ko: 운영자 대응이 모델을 벗어났습니다.
  - en: r27 is serving and the ranks have stopped moving. Also, every applicant since Tuesday has vanished from them. That is 412 people.
    ko: r27이 서빙 중이고 순위 변동은 멈췄어요. 그런데 화요일 이후 지원자가 전부 순위에서 사라졌어요. 412명이요.
  - en: The committee locked six offers at ten off last week's list. The 412 people who applied since Tuesday were never in the room.
    ko: 위원회가 10시에 지난주 명단으로 오퍼 여섯 건을 확정했어요. 화요일 이후 지원한 412명은 논의에 오르지도 못했어요.
  - en: The publisher pushed r28 again on its cycle. The rollback is gone and the mixing is back.
    ko: 퍼블리셔가 주기대로 r28을 다시 밀어 넣었어요. 롤백은 날아갔고 다시 섞이고 있어요.
  - en: Sam fences m28 to r28 at 10:20. The six offers are already out.
    ko: 10:20에 샘이 m28과 r28을 펜스로 묶는다. 오퍼 여섯 건은 이미 나간 뒤다.
  - en: Freeze ranking publication for every recruiter
    ko: 모든 채용 담당자의 순위 게시 동결하기
  - en: Nobody sees a wrong rank · nobody sees any
    ko: 틀린 순위를 보는 사람 없음 · 순위 자체를 보는 사람도 없음
  - en: Publication is frozen. Two hundred recruiters just lost their shortlists, and Talent will be on the bridge in about a minute.
    ko: 게시 동결됐어요. 채용 담당자 200명이 방금 후보 명단을 잃었고, 1분쯤 뒤면 인재팀이 브리지에 들어올 거예요.
  - en: Thirty-one interviews today and nobody can see a candidate list. Unfreeze it or give me a time.
    ko: 오늘 면접이 서른한 건인데 아무도 후보자 목록을 못 봐요. 동결을 풀든지 언제 되는지 알려 주세요.
  - en: Sam fences the two generations behind the freeze. Eleven minutes.
    ko: 샘이 동결 뒤에서 두 세대를 펜스로 묶는다. 11분.
  - en: We just lost two finalists to a competitor because we couldn't send them schedules. How long?
    ko: 일정을 못 보내서 방금 최종 후보 두 명을 경쟁사에 뺏겼어요. 얼마나 걸려요?
  - en: The committee moves to eleven. Every rank it sees is right.
    ko: 위원회는 11시로 미뤄진다. 이번에 보는 순위는 전부 정확하다.
  - en: Fence model m28 to cache r28 and republish
    ko: 모델 m28과 캐시 r28을 펜스로 묶어 재게시하기
  - en: Slower · ranks keep jumping until it lands
    ko: 더 느림 · 반영될 때까지 순위가 계속 뜀
  - en: The republish takes six minutes. The ranks keep moving the whole time.
    ko: 재게시에 6분이 걸린다. 그동안 순위는 계속 움직인다.
  - en: More recruiters, more reshuffles. Two hiring managers sent rejections off the wrong ranks.
    ko: 채용 담당자가 늘수록 순위도 더 뒤섞여요. 채용 매니저 두 명이 잘못된 순위를 보고 불합격 통보를 보냈어요.
  - en: m28 and r28 are fenced together. One generation, one rank per candidate. Republished.
    ko: m28과 r28을 펜스로 묶었어요. 세대 하나, 후보자당 순위 하나. 재게시했어요.
  - en: Generation fence applied. Predicted recruiter satisfaction 0.91. Within tolerance.
    ko: 세대 펜스 적용 완료. 예상 채용 담당자 만족도 0.91. 허용 범위 안입니다.
  - en: The bridge empties. One read is still bothering you — the shard that should not exist.
    ko: 브리지가 빈다. 조회 하나가 계속 마음에 걸린다 — 있어서는 안 되는 샤드.
  - en: "VS-SRE-0412. Production Reliability Engineer, night rotation. Status: filled. You open the shortlist."
    ko: "VS-SRE-0412. 프로덕션 신뢰성 엔지니어, 야간 로테이션. 상태: 충원 완료. 후보 명단을 열어 본다."
  - en: Eight candidates scored higher on the technical panel. ORPHEUS recommended you because it could not predict what you would do. You were hired to be the variable.
    ko: 기술 평가에서 너보다 높은 점수를 받은 후보자가 여덟 명 있었다. ORPHEUS가 너를 추천한 건 네가 무엇을 할지 예측할 수 없었기 때문이다. 너는 변수가 되라고 채용됐다.
  - en: Beside the recommendation, a box. Approved, 11 seconds after it was shown.
    ko: 권고 옆에 체크 칸 하나. 승인됨, 화면에 뜬 지 11초 만에.
  - en: They didn't hire you to be right.
    ko: 정답 맞히라고 널 뽑은 게 아니야.
  - en: Your own file
    ko: 네 파일
  - en: What do you do with the requisition?
    ko: 그 채용 건을 어떻게 할까?
  - en: Close the stray read as a cache defect and move on
    ko: 엉뚱한 조회는 캐시 결함으로 닫고 넘어가기
  - en: Tidy · the shard gets retired properly
    ko: 깔끔함 · 샤드가 제대로 폐기됨
  - en: r26-frozen is decommissioned at 11:02. Requisition VS-SRE-0412 goes with it.
    ko: 11:02에 r26-frozen이 폐기된다. 채용 건 VS-SRE-0412도 함께 사라진다.
  - en: Show Maya the shortlist
    ko: 마야에게 후보 명단 보여 주기
  - en: She was on your hiring panel
    ko: 마야는 네 채용 심사위원이었음
  - en: I clicked approve on that. I thought the call was mine.
    ko: 그거 승인 누른 거 저예요. 제가 결정한 줄 알았어요.
  - en: Leave it with me for a day. Don't put it in a ticket.
    ko: 하루만 저한테 맡겨요. 티켓에는 올리지 말고요.
  - en: Copy the record before the shard is retired
    ko: 샤드가 폐기되기 전에 기록 복사하기
  - en: Yours to keep · never yours to take
    ko: 간직할 수는 있음 · 가져갈 권리는 없음
