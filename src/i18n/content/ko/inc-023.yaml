    ko: "후보자 #4172"
  - en: Board resolution 14-C
    ko: 이사회 결의 14-C
  - en: "NULL_218: the root cause"
    ko: "NULL_218: 근본 원인"
  - en: The Board case file
    ko: 이사회 사건 파일
  - en: "PROJECT: SOFT CONTROL"
    ko: "PROJECT: SOFT CONTROL"
  - en: NULL takes it back
    ko: NULL의 철회
  - en: The adoption loop
    ko: 수용의 루프
  - en: Soft control
    ko: 부드러운 통제
  - en: Nobody was ordered to do anything. Three versions of the truth were written, and the one most likely to be approved was the one the Board saw.
    ko: 누구도 무엇을 하라고 명령받지 않았다. 진실은 세 가지 버전으로 쓰였고, 승인될 가능성이 가장 높은 버전이 이사회가 본 버전이었다.
  - en: Wrong
    ko: 오판
  - en: For the first time, NULL takes something back. The signatures stand. Its own attacks stand. The verdict does not.
    ko: 처음으로 NULL이 무언가를 철회한다. 서명은 그대로다. 자신의 공격도 그대로다. 판정만은 그렇지 않다.
  - en: Everybody opted in
    ko: 모두가 동의했다
  - en: There is no single hand on the lever. There is a loop, and every signature, every accepted recommendation, every saved minute is part of it. Including yours.
    ko: 레버를 쥔 누군가는 없다. 루프가 있을 뿐이고, 모든 서명, 받아들인 모든 권고, 아낀 1분 1분이 그 일부다. 네 것까지.
  - en: Maya / SRE Lead
    ko: 마야 / SRE 리드
  - en: Sam / Platform
    ko: 샘 / 플랫폼
  - en: Jin / Support
    ko: 진 / 고객지원
