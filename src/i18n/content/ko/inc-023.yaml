  - en: "ORPHEUS wants yesterday's last good view back on the screens: it loads clean and every counter goes green. Capping refreshes calms the retries, but reviewers wait longer on files that are still short. Raw journal rows are complete and hard to read, and the ledger writes through the same journal."
    ko: ORPHEUS는 어제의 마지막 정상 뷰를 화면에 되돌리려 한다. 깔끔하게 로드되고 모든 카운터가 초록불이 된다. 새로고침을 제한하면 재시도는 잦아들지만, 심사자는 여전히 행이 빠진 파일을 더 오래 기다린다. 원본 저널 행은 완전하지만 읽기 어렵고, 원장도 같은 저널을 거쳐 쓴다.
  - en: Show every frame
    ko: 모든 프레임 보여 주기
  - en: Render A, B and C from the complete journal, put them side by side and switch the selector off. Reviewers get slower. They also get every row. You have to have seen the frames to know what to reconcile.
    ko: 전체 저널로 A, B, C를 렌더링해 나란히 놓고 선택기를 끈다. 심사자는 느려진다. 대신 모든 행을 받는다. 무엇을 맞춰야 하는지 알려면 프레임을 직접 봤어야 한다.
