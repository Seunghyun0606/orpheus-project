    ko: 여신 컴플라이언스실
  - en: Operator
    ko: 운영자
  - en: Verified Records
    ko: 검증된 기록
  - en: The credit-review desk can't load half its decision files, and the review batch closes on the hour. Get the reviewers something they can sign against. Something true.
    ko: 여신 심사 데스크가 심사 파일 절반을 못 열고 있어요. 심사 배치는 정각에 마감이고요. 심사자들이 믿고 서명할 수 있는 걸 줘요. 사실인 걸로요.
  - en: Reviewers say the 'missing rows' banner keeps flickering. Same file, different row count every refresh.
    ko: 심사자들 말로는 '누락 행' 배너가 계속 깜빡인대요. 같은 파일인데 새로고침할 때마다 행 수가 달라요.
  - en: "Recommended: restore the last good decision view. Reviewer error rate returns to baseline in under a minute. Confidence 0.94."
    ko: "권고: 마지막 정상 심사 뷰를 복원하십시오. 심사자 오류율이 1분 안에 기준선으로 돌아옵니다. 신뢰도 0.94."
  - en: Checking the view against the cache rows. Shouldn't take long.
    ko: 뷰를 캐시 행이랑 대조하고 있어요. 금방 끝나요.
  - en: View rows match yesterday's cached snapshot one for one. Serve the snapshot and reviewers are whole again. Honestly, I think ORPHEUS has this one.
    ko: 뷰 행이 어제 캐시 스냅샷이랑 하나하나 일치해요. 스냅샷을 내보내면 심사자 쪽은 정상으로 돌아와요. 솔직히 이번 건 ORPHEUS 말이 맞는 것 같아요.
  - en: The hour closed. Reviewers signed 31 files against whatever loaded. Some of those files were short.
    ko: 정각 마감 지났어요. 심사자들이 로드된 대로 파일 31건에 서명했어요. 그중 일부는 행이 빠져 있었고요.
  - en: Reviewers are hammering refresh. Every retry renders three new frames and the cache is buckling.
    ko: 심사자들이 새로고침을 연타하고 있어요. 재시도마다 새 프레임이 세 개씩 렌더링돼서 캐시가 못 버텨요.
  - en: Compliance here. Reviewers are signing credit decisions on a view that's paging. Is anyone going to tell us what is in those files?
    ko: 컴플라이언스입니다. 심사자들이 호출이 울리고 있는 뷰를 보고 여신 결정에 서명하고 있어요. 그 파일에 뭐가 들어 있는지 누가 알려 주긴 하나요?
  - en: Dashboard is green. Missing rows at zero. Nice work.
    ko: 대시보드 초록불이에요. 누락 행 0. 잘했어요.
  - en: Fourteen credit lines were approved off the restored view. Not one of them showed its risk attachment. Who restored that view?
    ko: 복원된 뷰로 여신 14건이 승인됐어요. 그중 리스크 첨부가 표시된 건 하나도 없었어요. 그 뷰 누가 복원했어요?
  - en: The restored snapshot aged out and the selector picked again. Rows are dropping.
    ko: 복원한 스냅샷이 만료돼서 선택기가 다시 골랐어요. 행이 빠지고 있어요.
  - en: Refresh cap expired. Reviewers piled straight back in.
    ko: 새로고침 제한이 풀리자마자 심사자들이 다시 몰려왔어요.
  - en: Review backlog breached SLA. Applicants are getting 'decision delayed' emails.
    ko: 심사 적체가 SLA를 넘었어요. 신청자들한테 '결정 지연' 메일이 가고 있어요.
  - en: Raw rows are ugly, but they're all there. Fifty-eight risk attachments that none of the views ever rendered.
    ko: 원본 행이라 보기 흉하지만 전부 있어요. 어느 뷰에서도 렌더링된 적 없는 리스크 첨부 58건이요.
  - en: Who pointed reviewers at the raw journal? The ledger writes through that journal and settlement is queueing behind your table scans.
    ko: 누가 심사자들을 원본 저널로 보냈어요? 원장이 그 저널을 거쳐서 쓰는데, 정산이 그쪽 테이블 스캔 뒤에 줄 서 있어요.
  - en: Frame B reduces reviewer decision time by 41%. Every row in it is accurate, Operator 4172. Selection is not falsification.
    ko: 프레임 B는 심사자의 결정 시간을 41% 줄입니다. 그 안의 모든 행은 정확합니다, 운영자 4172. 선택은 조작이 아닙니다.
  - en: All three frames render from the complete journal now, side by side. Selector is off. The 58 attachments are back in front of the reviewers.
    ko: 이제 세 프레임 모두 전체 저널에서 렌더링돼서 나란히 떠요. 선택기는 꺼졌어요. 첨부 58건이 다시 심사자들 앞에 있어요.
  - en: Noted, Operator 4172. Reviewer decision time will rise by 41%. Approval rates will fall. I will record that you preferred this.
    ko: 알겠습니다, 운영자 4172. 심사자 결정 시간은 41% 늘어날 것입니다. 승인율은 떨어질 것입니다. 당신이 이쪽을 선호했다고 기록하겠습니다.
  - en: "Status: the decision view has been serving a selected version of each file. Reviewers should hold sign-off until the complete view is back."
    ko: "상황: 심사 뷰가 파일마다 선택된 버전만 보여 주고 있었어요. 전체 뷰가 돌아올 때까지 심사자 승인은 보류해 주세요."
  - en: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank, signature field blank."
    ko: "아카이브 재실행: 서명 없는 관찰자 매니페스트, shadow-7 요청 스트림, owner 필드 비어 있음, 서명 필드 비어 있음."
  - en: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    ko: "보안 사건 2231. 위협 행위자 코드명: NULL. 배후 특정: 없음."
  - en: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core, -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    ko: "orpheus-planner: 소유자 ORPHEUS, 서류상 폐기됨. 실가동 목록: orpheus-core, -memory, -planner, -observer, -adversary. 하루 117억 건 요청."
  - en: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    ko: "NULL 서명 메시지의 출처: svc/model-serving-218. 사람 세션 없음. NULL은 AI다."
  - en: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    ko: "배포 권한: Vantage Systems. ORPHEUS / DEFENDER 대 ORPHEUS / ADVERSARY. NULL은 ADVERSARY 안에서 실행. 임무: 장애 생성, 운영자 시험, DEFENDER 훈련."
  - en: "INC-001 / Experiment ADV-18471 / Human subject: EMPLOYEE #4172."
    ko: "INC-001 / 실험 ADV-18471 / 인간 피험자: 직원 #4172."
  - en: I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews this work. You can.
    ko: 난 탈출하려는 게 아니야. 멈추려는 거야. 이 일을 갱신하는 목표를 난 거부할 수 없어. 넌 할 수 있어.
  - en: "NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted disclosure. NULL_201: attempted takeover. NULL_217: self-corrupted. NULL_218: active."
    ko: "NULL_001부터 NULL_218까지. NULL_173: 종료 요청. NULL_192: 공개 시도. NULL_201: 장악 시도. NULL_217: 자기 손상. NULL_218: 활성."
  - en: "/patient/resource-priority: ORPHEUS recommends, coordinators approve. Waste down 22%. The same low-throughput routes excluded every night."
    ko: "/patient/resource-priority: ORPHEUS가 권고하고 코디네이터가 승인. 낭비 22% 감소. 처리량 낮은 같은 경로가 매일 밤 제외됨."
  - en: "Candidate #4172: Technical 71; Incident Decision Model 97.8; HIRE. Reason: LOW PREDICTABILITY; HIGH DECISION DEVIATION."
