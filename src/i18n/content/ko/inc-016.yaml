  - en: "ORPHEUS reads the backlog as stalled workers and wants a restart. Sam is less sure: the workers hold a cursor, and a restart rewinds it. The bypass releases everything on hold in one batch. Merchants get paid now; whatever was on hold for a real reason goes out with them."
    ko: "ORPHEUS는 적체를 워커 정체로 읽고 재시작을 원한다. 샘은 확신이 덜하다: 워커는 커서를 쥐고 있고, 재시작하면 커서가 되감긴다. 우회는 보류된 모든 것을 한 배치로 풀어 준다. 가맹점은 지금 돈을 받지만, 진짜 이유로 보류됐던 건도 함께 나간다."
  - en: Honor the receipt
    ko: 확인증 따르기
  - en: Putting the receipt check back in front of rescore means a payment cleared once stays cleared. ORPHEUS projects a 0.4% dip in fraud catch rate. Analysts stop reviewing their own work.
    ko: 재채점 앞에 확인증 검사를 되돌려 놓으면 한 번 통과한 결제는 통과 상태로 남는다. ORPHEUS는 사기 적발률이 0.4% 떨어질 것으로 예측한다. 분석가들은 더는 자기 작업을 다시 심사하지 않는다.
