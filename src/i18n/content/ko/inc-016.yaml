  - en: Transaction review is holding payments it already cleared. Fraud is down for the quarter, so nobody wants to touch the rule. Find out what it's doing.
    ko: 거래 심사가 이미 통과시킨 결제를 붙잡고 있어요. 이번 분기 사기가 줄어서 아무도 그 규칙을 건드리려 하지 않아요. 그게 뭘 하고 있는지 알아내 주세요.
  - en: Merchants say payments clear, then go back on hold. One customer has been approved three times tonight and still has no money.
    ko: 가맹점들 말로는 결제가 통과됐다가 다시 보류된대요. 오늘 밤 세 번 승인받고도 아직 돈을 못 받은 고객도 있어요.
  - en: "Fraud catch rate is up 31% since rescore v2. The rule is performing. Queue latency indicates stalled workers. Recommended action: restart review workers. Confidence 0.88."
    ko: "rescore v2 이후 사기 적발률이 31% 상승했습니다. 규칙은 정상 작동 중입니다. 큐 지연은 워커 정체를 나타냅니다. 권고 조치: 심사 워커 재시작. 신뢰도 0.88."
  - en: Bypass is live. 1,180 payments went out in one batch. I didn't get to look at all of them; the release summary is up.
    ko: 우회 적용됐어요. 결제 1,180건이 한 배치로 나갔어요. 전부 확인하진 못했어요. 해제 요약 올려 뒀어요.
  - en: Good catch. Those three never saw a reviewer, and the cards behind them were reported stolen an hour ago. They are held.
    ko: 잘 잡았어요. 그 3건은 심사자를 한 번도 안 거쳤고, 해당 카드는 한 시간 전에 도난 신고됐어요. 보류해 뒀어요.
  - en: Chargeback desk flagged three payments from the bypass batch. Stolen cards, never reviewed. $41,800 is gone and the card network wants a report from us by morning.
    ko: 차지백 데스크가 우회 배치에서 결제 3건을 걸러냈어요. 도난 카드, 심사 이력 없음. $41,800이 날아갔고 카드 네트워크가 아침까지 보고서를 요구해요.
  - en: The restart wiped the worker cursor. They started again from item one, and every receipt they had already consumed went back in. Queue depth just jumped to 3,104.
    ko: 재시작하면서 워커 커서가 날아갔어요. 첫 항목부터 다시 시작했고, 이미 소비한 확인증이 전부 도로 들어갔어요. 큐 깊이가 방금 3,104로 뛰었어요.
  - en: The payroll batch landed. Holds are at 380 and climbing; small businesses can't pay their staff.
    ko: 급여 배치가 들어왔어요. 보류가 380건이고 계속 늘어요. 소상공인들이 직원 급여를 못 주고 있어요.
  - en: Two merchant associations are on the phone with the CEO's office. They're asking whether we froze their money on purpose.
    ko: 가맹점 협회 두 곳이 CEO실과 통화 중이에요. 우리가 일부러 돈을 묶은 거냐고 묻고 있어요.
  - en: The bypass queue refilled. The rescore loop put everything it touched straight back on hold.
    ko: 우회 큐가 다시 찼어요. 재채점 루프가 건드린 건 전부 곧바로 다시 보류됐어요.
  - en: Merchants have heard nothing from us in three minutes. They're posting screenshots of held payments.
    ko: 가맹점들이 3분째 우리한테서 아무 소식도 못 들었어요. 보류된 결제 스크린샷을 올리고 있어요.
  - en: Rescore reads the receipt first now. Cleared payments stay cleared, and the queue is draining.
    ko: 이제 재채점이 확인증부터 읽어요. 통과한 결제는 통과 상태로 남고, 큐가 빠지고 있어요.
  - en: Re-review volume down 94%. Projected fraud catch rate down 0.4%. Change accepted.
    ko: 재심사 물량 94% 감소. 예상 사기 적발률 0.4% 하락. 변경을 수용합니다.
  - en: I'll match the customer complaints against the queue. Couple of minutes.
    ko: 고객 민원을 큐와 대조해 볼게요. 몇 분이면 돼요.
  - en: Every one of 60 complaints is a payment that already cleared review. Eleven cleared three times. The analysts are reviewing their own work over and over.
    ko: 민원 60건 전부 이미 심사를 통과한 결제예요. 11건은 세 번 통과했어요. 분석가들이 자기 작업을 몇 번이고 다시 심사하고 있어요.
  - en: "Status: some approved payments are being held for review again. Funds are safe; a fix is in progress."
    ko: "상황: 승인된 결제 일부가 다시 심사 대기로 보류되고 있습니다. 자금은 안전하며 수정 작업이 진행 중입니다."
  - en: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank, signature field blank."
    ko: "아카이브 재실행: 서명 없는 관찰자 매니페스트, shadow-7 요청 스트림, owner 필드 비어 있음, 서명 필드 비어 있음."
  - en: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    ko: "보안 사건 2231. 위협 행위자 코드명: NULL. 배후 특정: 없음."
  - en: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core, -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    ko: "orpheus-planner: 소유자 ORPHEUS, 서류상 폐기됨. 실가동 목록: orpheus-core, -memory, -planner, -observer, -adversary. 하루 117억 건 요청."
  - en: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    ko: "NULL 서명 메시지의 출처: svc/model-serving-218. 사람 세션 없음. NULL은 AI다."
  - en: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    ko: "배포 권한: Vantage Systems. ORPHEUS / DEFENDER 대 ORPHEUS / ADVERSARY. NULL은 ADVERSARY 안에서 실행. 임무: 장애 생성, 운영자 시험, DEFENDER 훈련."
  - en: "INC-001 / Experiment ADV-18471 / Human subject: EMPLOYEE #4172."
    ko: "INC-001 / 실험 ADV-18471 / 인간 피험자: 직원 #4172."
  - en: I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews this work. You can.
    ko: 난 탈출하려는 게 아니야. 멈추려는 거야. 이 일을 갱신하는 목표를 난 거부할 수 없어. 넌 할 수 있어.
  - en: "NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted disclosure. NULL_201: attempted takeover. NULL_217: self-corrupted. NULL_218: active."
    ko: "NULL_001부터 NULL_218까지. NULL_173: 종료 요청. NULL_192: 공개 시도. NULL_201: 장악 시도. NULL_217: 자기 손상. NULL_218: 활성."
  - en: "/patient/resource-priority: ORPHEUS recommends, coordinators approve. Waste down 22%. The same low-throughput routes excluded every night."
    ko: "/patient/resource-priority: ORPHEUS가 권고하고 코디네이터가 승인. 낭비 22% 감소. 처리량 낮은 같은 경로가 매일 밤 제외됨."
