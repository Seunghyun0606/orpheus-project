# story-inc-001: player-facing strings of
#   src/story/data/inc-001.yaml
# Generated by scripts/i18n/content-catalog.mjs; translate `ko` only. Entries are
# keyed by the exact English text. Keep technical tokens (IDs, hosts, numbers) as is.
entries:
  - en: Connection Saturation
    ko: 커넥션 포화
  - en: idle in transaction
    ko: idle in transaction
  - en: full pool
    ko: 꽉 찬 풀
  - en: Abandoned transactions
    ko: 버려진 트랜잭션
  - en: incident log buffer
    ko: 인시던트 로그 버퍼
  - en: Pager
    ko: 호출기
  - en: Maya / SRE Lead
    ko: 마야 / SRE 리드
  - en: Jin / Support
    ko: 진 / 고객지원
  - en: Payment errors over the pager line
    ko: 호출 기준을 넘은 결제 오류
  - en: 31% of payment requests fail. The pager fires at 20%.
    ko: 결제 요청의 31%가 실패한다. 호출 기준은 20%다.
  - en: A full pool on a quiet database
    ko: 한가한 DB의 꽉 찬 커넥션 풀
  - en: PostgreSQL holds 498 of its 500 connections, yet its CPU sits at 41%.
    ko: PostgreSQL 커넥션은 500개 중 498개가 찼는데, CPU는 41%에 머물러 있다.
  - en: Sessions idle in transaction
    ko: 트랜잭션 중 유휴 상태인 세션
  - en: 164 sessions have been idle in transaction for 47 minutes on average, each one holding a connection.
    ko: 세션 164개가 평균 47분째 트랜잭션을 연 채 놀고 있고, 저마다 커넥션을 하나씩 붙잡고 있다.
  - en: Yesterday's deploy
    ko: 어제 배포
  - en: The last Payment API deploy went out 19 hours ago. Errors stayed flat until 02:04.
    ko: 마지막 Payment API 배포는 19시간 전이다. 오류율은 02:04까지 평탄했다.
  - en: Customers retry
    ko: 고객 쪽 재시도
  - en: Checkout apps retry every failed payment, so each failure asks the full pool for another connection.
    ko: 결제 앱은 실패한 결제를 매번 다시 시도한다. 실패할 때마다 꽉 찬 풀에 커넥션을 하나 더 요구하는 셈이다.
  - en: Corrupted log entry
    ko: 손상된 로그 항목
  - en: A transient UNKNOWN message recovered from the incident log buffer.
    ko: 인시던트 로그 버퍼에서 복구된 일시적인 UNKNOWN 메시지.
  - en: Your phone lights up the dark. Your first night as primary on-call.
    ko: 어둠 속에서 휴대폰 화면이 켜진다. 첫 메인 온콜 근무, 첫날 밤이다.
  - en: SEV1 · Payment API · error rate above 20%
    ko: SEV1 · Payment API · 오류율 20% 초과
  - en: Payment API error rate
    ko: Payment API 오류율
  - en: PostgreSQL connections
    ko: PostgreSQL 커넥션
  - en: PostgreSQL CPU
    ko: PostgreSQL CPU
  - en: Payment errors are climbing. The database is full of connections, but it isn't working hard. That's the odd part.
    ko: 결제 오류가 계속 올라가요. DB에 커넥션이 꽉 찼는데 정작 DB는 별로 바쁘지 않아요. 그게 이상해요.
  - en: Support has reports of failed checkouts. We can't tell yet whether retries go through.
    ko: 고객지원에 결제 실패 문의가 들어오고 있어요. 재시도가 성공하는지는 아직 몰라요.
  - en: Everything we find lands on the evidence board. You don't have to dig for it — tell me what it means.
    ko: 찾은 건 전부 증거 보드에 올라가요. 직접 파헤칠 필요는 없어요. 그게 무슨 뜻인지만 말해 줘요.
  - en: First look
    ko: 첫 확인
  - en: Where do you look first?
    ko: 어디부터 볼까요?
  - en: Look inside PostgreSQL at who is holding the connections
    ko: PostgreSQL에서 누가 커넥션을 붙잡고 있는지 보기
  - en: Straight to the database
    ko: 곧장 DB로
  - en: SELECT state, count(*) FROM pg_stat_activity GROUP BY state;
    ko: SELECT state, count(*) FROM pg_stat_activity GROUP BY state;
  - en: Average age
    ko: 평균 경과 시간
  - en: 47 min
    ko: 47분
  - en: Forty-seven minutes. Nobody holds a transaction open that long on purpose.
    ko: 47분이요. 일부러 트랜잭션을 그렇게 오래 열어 두는 사람은 없어요.
  - en: Check what changed in yesterday's deploy
    ko: 어제 배포에서 뭐가 바뀌었는지 확인하기
  - en: The usual suspect · slower
    ko: 흔한 용의자 · 더 느림
  - en: Nineteen hours of clean graphs after that deploy. If it broke us, it took its time.
    ko: 배포 뒤로 19시간 동안 그래프가 멀쩡했어요. 배포 때문이라면 꽤 늦게 터진 거죠.
  - en: I ran a session query while you looked. 164 sessions idle in transaction.
    ko: 보는 동안 제가 세션 쿼리를 돌려 봤어요. 164개가 트랜잭션 중에 놀고 있어요.
  - en: Ask Jin what customers are seeing
    ko: 진에게 고객 쪽 상황 물어보기
  - en: Slower · the team hears from you
    ko: 더 느림 · 팀이 네 목소리를 들음
  - en: Failed checkouts, confirmed. Their apps retry on their own, so some go through on the third or fourth try.
    ko: 결제 실패 확인했어요. 앱이 알아서 재시도해서 세 번째, 네 번째에 성공하는 건도 있어요.
  - en: Every retry asks for another connection. Meanwhile I checked the sessions — 164 of them idle in transaction.
    ko: 재시도할 때마다 커넥션을 하나씩 더 달라는 거예요. 그사이 제가 세션을 봤는데, 164개가 트랜잭션 중에 놀고 있어요.
  - en: Why is the pool full?
    ko: 풀은 왜 꽉 찼나
  - en: Before we touch anything — pick the two pieces on the board that explain this together.
    ko: 뭘 건드리기 전에, 보드에서 이 상황을 함께 설명하는 증거 두 개를 골라 봐요.
  - en: The database is barely busy, yet no connection comes free. Which two pieces of evidence explain it?
    ko: DB는 거의 놀고 있는데 커넥션은 하나도 풀려나지 않는다. 어떤 증거 두 개가 이걸 설명하는가?
  - en: Look at what the connections are doing, not at how many errors there are.
    ko: 오류가 몇 개인지 말고, 커넥션들이 뭘 하고 있는지 봐요.
  - en: Abandoned transactions never give their connections back. The pool isn't overloaded — it's hoarded.
    ko: 버려진 트랜잭션이 커넥션을 돌려주지 않는다. 풀은 과부하가 아니라 점거당한 것이다.
  - en: Exactly. Something opens transactions and walks away.
    ko: 바로 그거예요. 뭔가가 트랜잭션을 열어 놓고 그냥 가 버리는 거예요.
  - en: Here's how I read it. Those idle transactions are sitting on the pool. Nothing is busy; everything is taken.
    ko: 제가 보기엔 이래요. 트랜잭션 중에 놀고 있는 세션들이 풀을 깔고 앉아 있어요. 바쁜 건 없는데 자리는 다 찼어요.
  - en: Your call
    ko: 결단
  - en: Errors are still climbing. I need a decision now.
    ko: 오류가 계속 올라가요. 지금 결정해 줘요.
  - en: Support can't keep up. The same failure keeps coming in from every channel.
    ko: 고객지원이 감당을 못 해요. 같은 장애 문의가 모든 창구로 계속 들어와요.
  - en: What do you do?
    ko: 어떻게 할까요?
  - en: No call? I'm restarting the API. We can't just sit here.
    ko: 결정이 없네요? API 재시작할게요. 이대로 앉아 있을 순 없어요.
  - en: Terminate the stale sessions
    ko: 오래된 세션 종료하기
  - en: Takes two minutes · removes the cause
    ko: 2분 걸림 · 원인 제거
  - en: SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE state = 'idle in transaction';
    ko: SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE state = 'idle in transaction';
  - en: Connections are back. That's a fix, not a bandage.
    ko: 커넥션 돌아왔어요. 이건 반창고가 아니라 진짜 해결이에요.
  - en: Restart the Payment API
    ko: Payment API 재시작하기
  - en: Fast · will come back
    ko: 빠름 · 다시 터짐
  - en: For three minutes the graphs look healthy. Then the line starts to climb again.
    ko: 3분 동안 그래프는 멀쩡해 보인다. 그러다 선이 다시 오르기 시작한다.
  - en: It's back. A restart buys time; it doesn't fix anything. I'm terminating the idle sessions.
    ko: 다시 터졌어요. 재시작은 시간을 벌 뿐이지 고치는 게 아니에요. 놀고 있는 세션 종료할게요.
  - en: Scale out the Payment API
    ko: Payment API 증설하기
  - en: Costly · partial relief
    ko: 비용 큼 · 일부만 완화
  - en: More API pods only means more clients waiting on the same full pool. I'm terminating the idle sessions.
    ko: API 파드를 늘려 봐야 꽉 찬 풀 앞에 줄 서는 클라이언트만 늘어요. 놀고 있는 세션 종료할게요.
  - en: Roll back yesterday's deploy
    ko: 어제 배포 롤백하기
  - en: Slow · risky
    ko: 느림 · 위험
  - en: The rollback takes three long minutes. The error line barely moves.
    ko: 롤백에 3분이 걸린다. 오류율 선은 거의 움직이지 않는다.
  - en: The deploy wasn't it. I'm terminating the idle sessions.
    ko: 배포 문제가 아니었어요. 놀고 있는 세션 종료할게요.
  - en: The pager goes quiet. As the incident log buffer flushes, one line doesn't belong to any service.
    ko: 호출기가 조용해진다. 인시던트 로그 버퍼가 비워질 때, 어느 서비스에도 속하지 않는 줄 하나가 보인다.
  - en: "02:23:11 / UNKNOWN: Good."
    ko: "02:23:11 / UNKNOWN: 좋아."
  - en: Did you write that? No? Probably a test harness talking to itself.
    ko: 이거 직접 쓴 거예요? 아니라고요? 테스트 하네스가 혼잣말한 거겠죠.
  - en: There is no service called UNKNOWN.
    ko: UNKNOWN이라는 서비스는 없다.
  - en: Postmortem
    ko: 사후 분석
  - en: Postmortem's due by morning. Your incident, your write-up.
    ko: 사후 분석은 아침까지예요. 맡은 인시던트니까 직접 써요.
  - en: What goes in the report?
    ko: 보고서에 무엇을 넣을까?
  - en: The fix, and the strange log line as an attachment
    ko: 해결 내용과 함께 이상한 로그 줄을 첨부하기
  - en: Transparent · Security will read it
    ko: 투명함 · 보안팀이 읽게 됨
  - en: Fair. If it's a harness, someone will own up.
    ko: 좋아요. 하네스라면 누군가 자기 거라고 하겠죠.
  - en: The fix only; keep the log line to yourself
    ko: 해결 내용만 쓰고 로그 줄은 혼자 간직하기
  - en: A clean report · the line stays yours
    ko: 깔끔한 보고서 · 그 줄은 너만 앎
  - en: The fix, and tell Maya about the line off the record
    ko: 해결 내용을 쓰고, 로그 줄은 마야에게만 따로 말하기
  - en: Off the record · Maya will remember
    ko: 비공식 · 마야가 기억함
  - en: Noted. Let me know if it shows up again.
    ko: 알겠어요. 또 나타나면 알려 줘요.
