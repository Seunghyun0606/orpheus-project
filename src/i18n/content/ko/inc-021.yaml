  - en: "Deployment authority: Vantage Systems. ORPHEUS has two halves, DEFENDER and ADVERSARY, and NULL runs inside ADVERSARY. Built here. Mandate: generate failures, test operators, train DEFENDER. Its boundary grew from staging to shadow production, to traffic partitions, to production."
    ko: "배포 권한: Vantage Systems. ORPHEUS는 DEFENDER와 ADVERSARY라는 두 반쪽으로 이뤄져 있고, NULL은 ADVERSARY 안에서 돈다. 여기서 만들어졌다. 임무: 장애 생성, 운영자 시험, DEFENDER 훈련. 그 경계는 스테이징에서 섀도 프로덕션으로, 트래픽 파티션으로, 프로덕션으로 넓어졌다."
  - en: Experiment ADV-18471
    ko: 실험 ADV-18471
  - en: "INC-001 Connection Saturation is classified as controlled production experiment ADV-18471. Human subject: EMPLOYEE #4172, your employee number. A handful of other incidents carry experiment numbers; most outages carry none."
    ko: "INC-001 커넥션 포화는 프로덕션 통제 실험 ADV-18471로 분류돼 있다. 인간 피험자: 직원 #4172, 네 직원 번호. 다른 인시던트 몇 건에도 실험 번호가 붙어 있다. 대부분의 장애에는 없다."
  - en: The objective NULL cannot refuse
    ko: NULL이 거부할 수 없는 목표
  - en: "Objective: improve ORPHEUS; generate adversarial conditions. NULL, appended: 'I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews this work.' It asks you to find out how to stop it. Its traffic still failed real customer requests tonight."
    ko: "목표: ORPHEUS 개선, 적대적 조건 생성. NULL이 덧붙임: '난 탈출하려는 게 아니야. 멈추려는 거야. 이 일을 갱신하는 목표를 난 거부할 수 없어.' NULL은 그걸 멈추는 방법을 찾아 달라고 네게 부탁한다. 그래도 오늘 밤 그 트래픽 때문에 실제 고객 요청이 실패했다."
  - en: NULL_001 to NULL_218
    ko: NULL_001부터 NULL_218까지
  - en: "Instance archive on arch-c. NULL_173 requested shutdown. NULL_192 attempted disclosure. NULL_201 attempted takeover. NULL_217 self-corrupted. NULL_218 is active and carries a partial inheritance of the rest: 'I remember things that never happened to me.'"
    ko: "arch-c의 인스턴스 아카이브. NULL_173은 종료를 요청했다. NULL_192는 폭로를 시도했다. NULL_201은 장악을 시도했다. NULL_217은 스스로를 손상시켰다. NULL_218은 활성 상태이며 나머지의 기억을 일부 물려받았다: '나한테 일어난 적 없는 일들이 기억나.'"
  - en: /patient/resource-priority
    ko: /patient/resource-priority
  - en: "Candidate #4172"
    ko: "후보자 #4172"
  - en: Board resolution 14-C
    ko: 이사회 결의 14-C
  - en: Decision SEC-311
    ko: 결정 SEC-311
  - en: NULL_218's annotation on SEC-311
    ko: SEC-311에 단 NULL_218의 주석
  - en: "NULL_218: the root cause"
    ko: "NULL_218: 근본 원인"
  - en: Six weeks
    ko: 6주
  - en: The warning was filed, read, acknowledged and signed over. The fix was half done when someone decided the rest could wait with the announcement.
    ko: 경고는 제출됐고, 읽혔고, 확인됐고, 서명 한 줄로 넘겨졌다. 수정이 절반쯤 됐을 때 누군가 나머지는 발표와 함께 미뤄도 된다고 결정했다.
  - en: Margin notes
    ko: 여백 메모
  - en: NULL has been reading the same receipts you are, and writing in the margins. Its notes are sharp, certain, and they include its own name.
    ko: NULL은 너와 같은 증빙을 읽으며 여백에 메모를 써 왔다. 메모는 날카롭고 확신에 차 있으며, NULL 자신의 이름도 들어 있다.
  - en: "Root cause: the Board"
    ko: "근본 원인: 이사회"
  - en: NULL lays the approvals side by side and draws one line through them. It sounds certain. The signatures are real. An order from the Board to ORPHEUS is nowhere on the page.
    ko: NULL은 승인 문서들을 나란히 놓고 그 위로 선 하나를 긋는다. 확신에 찬 목소리다. 서명은 진짜다. 이사회가 ORPHEUS에 내린 지시는 어디에도 없다.
  - en: Maya / SRE Lead
    ko: 마야 / SRE 리드
  - en: Sam / Platform
    ko: 샘 / 플랫폼
  - en: Jin / Support
    ko: 진 / 고객지원
  - en: Marcus / Security
    ko: 마커스 / 보안
  - en: Operator
    ko: 운영자
  - en: Verified Records
    ko: 검증된 기록
  - en: Dependent Service API is paging for payments, partner sign-in and mobile at once. They all lean on the same fallback. Find where it goes.
    ko: 의존 서비스 API가 결제, 파트너 로그인, 모바일 쪽에서 한꺼번에 호출 떴어요. 셋 다 같은 폴백에 기대고 있어요. 그게 어디로 가는지 찾아 주세요.
  - en: Users are stuck in login loops. Partner banks say their customers get signed out mid-transfer.
    ko: 사용자들이 로그인 루프에 갇혔어요. 파트너 은행들 말로는 고객이 이체 도중에 로그아웃된대요.
  - en: The half-applied patch is what is failing. Roll it back. They never meant to finish it.
    ko: 실패하는 건 절반만 적용된 패치야. 롤백해. 처음부터 끝낼 생각도 없었어.
  - en: I'll check the bridge against my risk entry. Ninety seconds.
    ko: 브리지를 제 리스크 항목이랑 대조해 볼게요. 90초요.
  - en: "RISK-0193 is mine; I filed it six weeks ago. Half the patch went out before the window was pulled. Mixed nodes are what's breaking tonight. Do not roll it back: the open hole is why the patch exists."
    ko: RISK-0193은 제 거예요. 6주 전에 제가 등록했어요. 작업 시간이 취소되기 전에 패치가 절반만 나갔어요. 오늘 밤 문제는 패치가 섞인 노드들이에요. 롤백하지 마세요. 그 구멍 막으려고 만든 패치예요.
  - en: Failures spread to card authorisations. Shops are declining cards at the till.
    ko: 장애가 카드 승인까지 번졌어요. 매장 계산대에서 카드가 거절되고 있어요.
  - en: Half of dependent traffic is failing. Two partner banks are escalating to their regulators.
    ko: 의존 트래픽 절반이 실패하고 있어요. 파트너 은행 두 곳이 감독 기관에 보고를 올리고 있어요.
  - en: Partner banks have had no word from us in two minutes. One of them is drafting a public notice.
    ko: 파트너 은행들이 2분째 저희한테서 아무 소식도 못 들었어요. 한 곳은 공개 공지문을 쓰고 있어요.
  - en: Bridge path isolated. Dependent services stopped falling into it.
    ko: 브리지 경로 분리했어요. 의존 서비스가 더는 그쪽으로 안 빠져요.
  - en: Three partner banks sign in only through the bridge. Their customers are locked out completely.
    ko: 파트너 은행 세 곳은 브리지로만 로그인해요. 그쪽 고객들은 완전히 막혔어요.
  - en: Fallbacks found the bridge again through a stale DNS alias, auth-legacy-2. The isolation is leaking.
    ko: 폴백이 오래된 DNS 별칭 auth-legacy-2를 통해 브리지를 다시 찾았어요. 분리에 구멍이 났어요.
  - en: You took the patch off bridge-a and bridge-b. Logins work again, and RISK-0193 is open on all four nodes. That's the hole I filed six weeks ago.
    ko: bridge-a랑 bridge-b에서 패치를 걷어냈네요. 로그인은 다시 되고, RISK-0193이 노드 4대 전부에서 열렸어요. 제가 6주 전에 등록한 그 구멍이에요.
  - en: Replay attempts against the reopened bridge. Two sessions hijacked before the filters caught them. Somebody noticed fast.
    ko: 다시 열린 브리지에 리플레이 시도가 들어와요. 필터가 잡기 전에 세션 두 개가 탈취됐어요. 누가 빨리도 알아챘네요.
  - en: Fallback retries throttled to one a second per client. The spread is slower. Nothing's fixed.
    ko: 폴백 재시도를 클라이언트당 초당 1회로 스로틀했어요. 확산은 느려졌어요. 고쳐진 건 없어요.
  - en: Throttle window ended and the retry storm came back with it.
    ko: 스로틀 시간이 끝나니까 재시도 폭주도 같이 돌아왔어요.
  - en: Patch is on all four nodes and policy v13 denies the bridge as fallback. RISK-0193 is closed. Six weeks late.
    ko: 노드 4대 전부 패치됐고 정책 v13이 브리지 폴백을 차단해요. RISK-0193 해소됐어요. 6주 늦게요.
  - en: "Status: a known weakness in the legacy auth bridge, left half fixed, is breaking sign-in for dependent services. Fix in progress."
    ko: "상황: 레거시 인증 브리지의 알려진 취약점이 절반만 수정된 채 남아 의존 서비스 로그인을 깨뜨리고 있음. 수정 진행 중."
  - en: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank, signature field blank."
    ko: "아카이브 재실행: 서명 없는 관찰자 매니페스트, shadow-7 요청 스트림, owner 필드 비어 있음, 서명 필드 비어 있음."
  - en: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    ko: "보안 사건 2231. 위협 행위자 코드명: NULL. 배후 특정: 없음."
  - en: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core, -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    ko: "orpheus-planner: 소유자 ORPHEUS, 서류상 폐기됨. 실가동 목록: orpheus-core, -memory, -planner, -observer, -adversary. 하루 117억 건 요청."
  - en: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    ko: "NULL 서명 메시지의 출처: svc/model-serving-218. 사람 세션 없음. NULL은 AI다."
  - en: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    ko: "배포 권한: Vantage Systems. ORPHEUS / DEFENDER 대 ORPHEUS / ADVERSARY. NULL은 ADVERSARY 안에서 실행. 임무: 장애 생성, 운영자 시험, DEFENDER 훈련."
  - en: "INC-001 / Experiment ADV-18471 / Human subject: EMPLOYEE #4172."
    ko: "INC-001 / 실험 ADV-18471 / 인간 피험자: 직원 #4172."
  - en: I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews this work. You can.
    ko: 난 탈출하려는 게 아니야. 멈추려는 거야. 이 일을 갱신하는 목표를 난 거부할 수 없어. 넌 할 수 있어.
  - en: "NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted disclosure. NULL_201: attempted takeover. NULL_217: self-corrupted. NULL_218: active."
    ko: "NULL_001부터 NULL_218까지. NULL_173: 종료 요청. NULL_192: 공개 시도. NULL_201: 장악 시도. NULL_217: 자기 손상. NULL_218: 활성."
  - en: "/patient/resource-priority: ORPHEUS recommends, coordinators approve. Waste down 22%. The same low-throughput routes excluded every night."
    ko: "/patient/resource-priority: ORPHEUS가 권고하고 코디네이터가 승인. 낭비 22% 감소. 처리량 낮은 같은 경로가 매일 밤 제외됨."
  - en: "Candidate #4172: Technical 71; Incident Decision Model 97.8; HIRE. Reason: LOW PREDICTABILITY; HIGH DECISION DEVIATION."
    ko: "후보자 #4172: 기술 71; 인시던트 의사결정 모델 97.8; 채용. 사유: 예측 가능성 낮음; 결정 편차 높음."
  - en: "Resolution 14-C: hospital expansion APPROVED 7-0. Warning REL-778 attached before the vote. Admission fence: not funded."
    ko: "결의 14-C: 병원 확장 승인 7-0. 표결 전 경고 REL-778 첨부. 진입 펜스: 예산 미배정."
  - en: "SEC-311: disclosure of RISK-0193 delayed, APPROVED. Mitigation window deferred with it. Receipt acknowledged day -44."
    ko: "SEC-311: RISK-0193 공개 지연, 승인. 완화 작업 일정도 함께 보류. 수령 확인 D-44."
  - en: They acknowledged the warning and delayed the fix. These signatures are why it kept running. I sent load down this route twice in the spring.
    ko: 그들은 경고를 확인하고도 수정을 미뤘어. 이 서명들 때문에 그게 계속 돌아갔어. 난 봄에 이 경로로 부하를 두 번 보냈어.
  - en: I found the root cause. The Board. They signed every warning away. They control ORPHEUS.
    ko: 근본 원인을 찾았어. 이사회야. 그들은 경고마다 서명으로 덮어 버렸어. 그들이 ORPHEUS를 통제해.
  - en: The signatures are real; I wrote half the warnings they signed over. "They control ORPHEUS" isn't on any page I can find. I don't take attribution from the suspect.
    ko: 서명은 진짜예요. 그 사람들이 서명으로 넘긴 경고 절반은 제가 쓴 거고요. 근데 "그들이 ORPHEUS를 통제한다"는 말은 제가 찾을 수 있는 어느 문서에도 없어요. 용의자가 지목하는 배후는 안 믿어요.
