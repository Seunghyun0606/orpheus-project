  - en: "CEO internal message, reply to recovery leads who asked for staffed queue owners before the cuts: \"The public doesn't need to understand the system. They need the system to work.\" The consolidation schedule stayed as signed. The savings line has no entry for the uncovered queue."
    ko: null
