    ko: 인력 건 연대기
  - en: Exposure accepted
    ko: 리스크 수용
  - en: Two words in the margin of REC-55. The review said exactly which queues would go dark. The answer was to accept it and keep the schedule.
    ko: REC-55 여백에 적힌 두 단어. 검토서는 어느 큐가 꺼질지 정확히 짚었다. 답은 그걸 감수하고 일정을 지키는 것이었다.
  - en: They need the system to work
    ko: 시스템이 작동하기만 하면 된다
  - en: The recovery leads asked for one thing before the cuts. The reply did not mention it, and the system is not working.
    ko: 복구 리드들은 감축 전에 딱 하나를 요청했다. 답장은 그 얘기를 하지 않았고, 시스템은 작동하지 않고 있다.
  - en: Ten days of warning
    ko: 열흘 전의 경고
  - en: The warning arrived ten days before tonight and three days before the vote. Every date lines up. Nobody was surprised; they were busy.
    ko: 경고는 오늘 밤보다 열흘 전, 표결보다 사흘 전에 도착했다. 날짜가 전부 맞아떨어진다. 아무도 놀라지 않았다. 다들 바빴을 뿐이다.
