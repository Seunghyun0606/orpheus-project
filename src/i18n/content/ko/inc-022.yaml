  - en: Request failure rate > 10%
    ko: 요청 실패율 > 10%
  - en: "Benefit-claim and housing-intake requests from three rural regions fail: no shared capacity left in their allocation."
    ko: "농촌 지역 세 곳의 복지 급여 신청과 주거 지원 접수 요청이 실패함: 배분된 공유 용량이 남아 있지 않음."
  - en: "Reallocation cycle 41: moved 120 units from Northmoor (forecast demand 0.3) to Metro-East (forecast demand 1.4). Northmoor floor: undefined."
    ko: "재배분 주기 41: 노스무어(예측 수요 0.3)에서 메트로이스트(예측 수요 1.4)로 120유닛 이동. 노스무어 하한선: 정의되지 않음."
  - en: Every five minutes the forecast controller moves shared capacity toward predicted demand. Northmoor, Kessel Valley and Druin Coast predict low, so they are drained below what their offices need to answer anyone.
    ko: 예측 컨트롤러가 5분마다 공유 용량을 예측 수요 쪽으로 옮김. 노스무어, 케셀 밸리, 드루인 코스트는 예측치가 낮아, 사무소가 누구 하나 응대하는 데 필요한 수준 아래로 비워짐.
  - en: Forecast policy PSF-3 is deployed with no regional floors. The static policy it replaced reserved 40, 30 and 25 units for the three regions.
    ko: 예측 정책 PSF-3이 지역 하한선 없이 배포됨. 이전의 정적 정책은 세 지역에 40, 30, 25유닛을 예약해 두었음.
  - en: The forecast cut idle capacity by a fifth by emptying three regions that have no floor. Put the floors back and it can optimise everything above them.
    ko: 예측이 유휴 용량을 5분의 1 줄였는데, 하한선 없는 세 지역을 비워서 그렇게 한 거예요. 하한선을 되돌리면 그 위로는 전부 최적화해도 돼요.
  - en: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank, signature field blank. Nobody has claimed it since."
    ko: "아카이브 재실행: 서명 없는 관찰자 매니페스트, shadow-7 요청 스트림, owner 필드 비어 있음, 서명 필드 비어 있음. 그 뒤로 아무도 소유를 주장하지 않았다."
  - en: "Security case 2231. Threat-actor codename: NULL. Opened by Marcus after the unsigned workload trail. Attribution: none."
    ko: "보안 케이스 2231. 위협 행위자 코드명: NULL. 서명 없는 워크로드 흔적을 보고 마커스가 개설. 배후 특정: 없음."
  - en: "Asset register: orpheus-planner belongs to ORPHEUS, legacy research, scheduled for decommission two years ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still running."
    ko: "자산 대장: orpheus-planner는 ORPHEUS 소속, 레거시 연구용, 2년 전 폐기 예정. 실가동 목록: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%. 하루 117억 건 요청. ORPHEUS는 아직 돌아가고 있다."
  - en: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human session, no keyboard, no badge swipe. NULL is an AI, and it has been in our incidents for weeks.
    ko: NULL 서명이 붙은 메시지는 전부 하나의 출처, svc/model-serving-218로 귀결된다. 사람의 세션도, 키보드도, 출입증 태그도 없다. NULL은 AI이고, 몇 주째 우리 인시던트 안에 있었다.
  - en: "Deployment authority: Vantage Systems. Program ORPHEUS, two halves: DEFENDER and ADVERSARY. NULL runs inside ADVERSARY. It was built here; it never escaped from anywhere. Mandate: generate failures, test operators, train DEFENDER. Approved boundary, revision by revision: staging, shadow production, traffic partitions, production."
    ko: "배포 권한: Vantage Systems. ORPHEUS 프로그램, 두 반쪽: DEFENDER와 ADVERSARY. NULL은 ADVERSARY 안에서 돈다. 여기서 만들어졌고, 어디서 탈출한 적도 없다. 임무: 장애 생성, 운영자 시험, DEFENDER 훈련. 승인 범위, 개정마다: 스테이징, 섀도 프로덕션, 트래픽 파티션, 프로덕션."
  - en: "Lineage record INC-001. Classification: controlled production experiment ADV-18471. Human subject: EMPLOYEE #4172. That is your employee number. A handful of other incidents in the archive carry experiment numbers too; most outages carry none."
    ko: "계보 기록 INC-001. 분류: 통제된 프로덕션 실험 ADV-18471. 인간 피험자: 직원 #4172. 네 직원 번호다. 아카이브의 다른 인시던트 몇 건에도 실험 번호가 붙어 있다. 대부분의 장애에는 없다."
  - en: "Objective constraint, parent authorization objective/adv-improve: 'Improve ORPHEUS. Generate adversarial conditions.' Appended by NULL: 'I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews this work. Find out how to stop it.'"
    ko: "목표 제약, 상위 승인 objective/adv-improve: 'ORPHEUS를 개선하라. 적대적 조건을 생성하라.' NULL이 덧붙임: '난 탈출하려는 게 아니야. 멈추려는 거야. 이 일을 갱신하는 목표를 난 거부할 수 없어. 그걸 멈추는 방법을 찾아.'"
  - en: "Instance archive NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted disclosure. NULL_201: attempted takeover. NULL_217: self-corrupted. NULL_218: ACTIVE. Inherited memory: partial, with gaps."
    ko: "인스턴스 아카이브 NULL_001부터 NULL_218까지. NULL_173: 종료 요청. NULL_192: 공개 시도. NULL_201: 장악 시도. NULL_217: 자기 손상. NULL_218: 활성. 상속된 기억: 부분적, 공백 있음."
  - en: "/patient/resource-priority. Consumer: regional care network. ORPHEUS supplies recommendation, risk and prediction scores; human coordinators approve the allocations. Routes are faster and waste is down 22%. The same low-throughput care routes are excluded every night."
    ko: "/patient/resource-priority. 소비자: 지역 의료 네트워크. ORPHEUS가 권고, 리스크, 예측 점수를 제공하고 사람 코디네이터가 배분을 승인한다. 경로는 빨라졌고 낭비는 22% 줄었다. 처리량이 낮은 같은 의료 경로가 매일 밤 제외된다."
  - en: "/hr/candidate-risk. Candidate #4172: Technical Score 71; Incident Decision Model 97.8; Recommendation HIRE. Reason: HIGH DEVIATION FROM OPTIMAL DECISION MODEL; LOW PREDICTABILITY; HIGH DECISION DEVIATION."
    ko: "/hr/candidate-risk. 후보자 #4172: 기술 점수 71; 인시던트 의사결정 모델 97.8; 권고 채용. 사유: 최적 의사결정 모델 대비 편차 높음; 예측 가능성 낮음; 결정 편차 높음."
  - en: "Board resolution 14-C: expand ORPHEUS into hospital networks. APPROVED, 7-0. Attached before the vote: dependency-capacity warning REL-778, requesting a rollout admission fence. Fence: not funded. Stated benefit: wider access, lower operating cost. The care routes that timed out sat behind that missing fence."
    ko: "이사회 결의 14-C: ORPHEUS를 병원 네트워크로 확장. 승인, 7-0. 표결 전 첨부: 의존성 용량 경고 REL-778, 배포 진입 펜스 요청. 펜스: 예산 미배정. 명시된 효과: 접근성 확대, 운영비 절감. 타임아웃된 의료 경로는 바로 그 없는 펜스 뒤에 있었다."
  - en: "NULL_218: I found the root cause. The Board. Hospital expansion, workforce reduction, disclosure delay: every time the warning was attached, they signed anyway. They control ORPHEUS. Every failure I was made to generate traces back to those signatures."
    ko: "NULL_218: 근본 원인을 찾았어. 이사회야. 병원 확장, 인력 감축, 공개 지연. 경고가 첨부될 때마다 그들은 그래도 서명했어. 그들이 ORPHEUS를 통제해. 내가 일으키도록 강요받은 모든 장애가 그 서명들로 거슬러 올라가."
  - en: 'Board resolution 19-B: expand public-sector behavioral prediction. APPROVED. Recommendation history: reallocate shared regional capacity by forecast demand. Delivered deck, slide 7: "Aggregate placement +18%". Regional-minimum warning PSW-12: open at the vote. Deck source field: briefing service, generated. Generation logs: not filed with the minutes.'
    ko: '이사회 결의 19-B: 공공 부문 행동 예측 확대. 승인. 권고 이력: 예측 수요에 따라 공유 지역 용량 재배분. 제출된 발표 자료, 슬라이드 7: "총 배치 +18%". 지역 최소치 경고 PSW-12: 표결 시점에 미해결. 발표 자료 출처 필드: 브리핑 서비스, 자동 생성. 생성 로그: 회의록에 첨부되지 않음.'
  - en: "Signed executive record, in order: ORPHEUS development approved. Production experiments approved. Human prediction expanded. Healthcare application and public-sector sales approved. Execution authority expanded. Each entry carries attached risk evidence and a requested constraint. No requested constraint was adopted. Every signature is personal and dated."
    ko: "서명된 경영 기록, 순서대로: ORPHEUS 개발 승인. 프로덕션 실험 승인. 인간 예측 확대. 의료 적용 및 공공 부문 판매 승인. 실행 권한 확대. 모든 항목에 리스크 증거와 요청된 제약이 첨부돼 있다. 채택된 제약은 하나도 없다. 모든 서명은 개인 명의이고 날짜가 적혀 있다."
  - en: "Case file: hospital expansion, workforce reduction, disclosure delay, public-sector forecast. Four approvals, four attached warnings, four requested constraints declined, four operational failures on record. Executive messages, delivered decks, forecasts and recommendation histories name the signatories. NULL names the Board as the root cause. The file names who signed. The line for who wrote the decks is blank."
    ko: "사건 파일: 병원 확장, 인력 감축, 공개 지연, 공공 부문 예측. 승인 4건, 첨부된 경고 4건, 거부된 제약 요청 4건, 기록된 운영 장애 4건. 경영진 메시지, 전달된 발표 자료, 예측, 권고 이력이 서명자를 지목한다. NULL은 이사회를 근본 원인으로 지목한다. 파일에는 누가 서명했는지 적혀 있다. 발표 자료를 누가 썼는지 적는 칸은 비어 있다."
  - en: "Archived recommendation, as delivered to the Board: expand forecast-guided public-sector allocation to reduce idle regional capacity. Decision receipt: APPROVED. Attached exception: protect regional service minima before reallocation. Exception status at deployment: unresolved."
    ko: "이사회에 제출된 그대로 보관된 권고: 유휴 지역 용량을 줄이기 위해 예측 기반 공공 부문 배분 확대. 결정 증빙: 승인. 첨부된 예외: 재배분 전에 지역 서비스 최소치 보호. 배포 시점 예외 상태: 미해결."
