    ko: 지역에 용량 되돌리기
  - en: ORPHEUS will move capacity back, to the regions its forecast thinks will use it, until the next cycle takes it away. Slowing the cycle stops the bleeding and returns nothing. Burst capacity goes into the shared pool, and the forecast decides where the pool goes.
    ko: ORPHEUS는 용량을 되돌리겠지만, 자기 예측이 쓸 거라고 보는 지역에만, 그리고 다음 주기가 다시 가져갈 때까지만이다. 주기를 늦추면 출혈은 멈추지만 돌아오는 건 없다. 버스트 용량은 공유 풀로 들어가고, 그 풀이 어디로 갈지는 예측이 정한다.
  - en: Reinstate the floors
    ko: 하한선 복원
  - en: Put floors of 40, 30 and 25 units under PSF-3. The forecast keeps optimising everything above them. The efficiency number on the dashboard will go down.
    ko: PSF-3 아래에 40, 30, 25유닛의 하한선을 깐다. 예측은 그 위의 모든 것을 계속 최적화한다. 대시보드의 효율 숫자는 내려갈 것이다.
