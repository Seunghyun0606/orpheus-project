    ko: 제출된 배분 권고
  - en: Slide 7
    ko: 슬라이드 7
  - en: Slide 7 is one green number. The warning about the regions is appendix C, and the minutes do not say anyone opened it.
    ko: 슬라이드 7은 초록색 숫자 하나다. 지역에 관한 경고는 부록 C에 있고, 회의록에는 누가 그걸 열어 봤다는 말이 없다.
  - en: The ledger
    ko: 대장
  - en: Every expansion of ORPHEUS, in one column, with a warning attached to each line and a name signed under each warning.
    ko: ORPHEUS의 모든 확장이 한 열에 있다. 줄마다 경고가 붙어 있고, 경고마다 그 아래 서명한 이름이 있다.
  - en: Four signatures
    ko: 서명 넷
  - en: Four nights, four failures, four warnings that were in the packet before anyone voted. The file is complete about who signed. It has one empty column.
    ko: 네 번의 밤, 네 번의 장애, 누구도 표결하기 전에 이미 자료에 들어 있던 네 개의 경고. 누가 서명했는지에 대해서 파일은 빈틈이 없다. 빈 열이 하나 있을 뿐이다.
  - en: As delivered
    ko: 제출된 그대로
  - en: The recommendation the Board approved and the one ORPHEUS made to you tonight use the same words. The exception attached to the first is still open.
    ko: 이사회가 승인한 권고와 오늘 밤 ORPHEUS가 너에게 한 권고는 같은 말을 쓴다. 앞의 권고에 붙은 예외는 아직 열려 있다.
  - en: Maya / SRE Lead
    ko: 마야 / SRE 리드
  - en: Sam / Platform
    ko: 샘 / 플랫폼
  - en: Jin / Support
    ko: 진 / 고객지원
  - en: Marcus / Security
    ko: 마커스 / 보안
  - en: Operator
    ko: 운영자
  - en: Verified Records
    ko: 검증된 기록
  - en: Regional Resource API is paging. The forecast rollout went live this week and the dashboard says placement is up eighteen percent. Something under that number is failing.
    ko: 지역 자원 API에서 호출이 울려요. 예측 배포가 이번 주에 나갔고 대시보드상으론 배치가 18퍼센트 올랐어요. 그 숫자 밑에서 뭔가 실패하고 있어요.
  - en: Benefits offices in three rural regions can't submit claims. Emergency housing intake in Druin Coast is turning people away.
    ko: 농촌 지역 세 곳 복지 사무소가 신청을 못 넣고 있어요. 드루인 코스트 긴급 주거 지원 접수는 사람들을 돌려보내고 있어요.
  - en: I'll put region allocations next to the old floors. About a minute and a half.
    ko: 지역 배분을 예전 하한선이랑 나란히 놓아 볼게요. 1분 반쯤요.
  - en: The forecast cut idle capacity by a fifth, and it did it by emptying three regions that have no floor. Put the floors back and it can optimise everything above them.
    ko: 예측이 유휴 용량을 5분의 1 줄였는데, 하한선 없는 세 지역을 비워서 그렇게 한 거예요. 하한선을 되돌리면 그 위로는 전부 최적화해도 돼요.
  - en: "Recommendation: restore temporary public allocation to affected regions for continuity while protected floors are repaired. Projected unserved routes: -65%. Confidence 0.88."
    ko: "권고: 보호 하한선을 복구하는 동안 연속성을 위해 영향 지역에 임시 공공 배분을 복원하십시오. 예상 미처리 경로: -65%. 신뢰도 0.88."
  - en: "Temporary allocation restored: Northmoor, Kessel Valley. Druin Coast not restored: forecast demand 0.21, below restoration threshold."
    ko: "임시 배분 복원 완료: 노스무어, 케셀 밸리. 드루인 코스트는 복원하지 않았습니다: 예측 수요 0.21, 복원 임계값 미만입니다."
  - en: Druin Coast is still dark. Their housing intake runs on this API. The forecast says nobody there will ask, so nobody got capacity.
    ko: 드루인 코스트는 아직 먹통이에요. 거기 주거 지원 접수가 이 API로 돌아가요. 예측상 거기선 아무도 요청 안 한다니까, 아무도 용량을 못 받은 거예요.
  - en: Forecast cycle 44 just took it all back. It moves capacity every five minutes. We moved it once.
    ko: 예측 주기 44가 방금 전부 다시 가져갔어요. 예측은 5분마다 용량을 옮겨요. 우린 한 번 옮겼고요.
  - en: Forecast cycle is at thirty minutes. It stops taking. It doesn't give anything back.
    ko: 예측 주기를 30분으로 늘렸어요. 더 가져가진 않아요. 돌려주는 것도 없고요.
  - en: The thirty-minute cycle came round. The forecast caught up all at once and drained the regions again.
    ko: 30분 주기가 돌아왔어요. 예측이 한꺼번에 따라잡아서 지역들을 다시 비웠어요.
  - en: Bought 300 burst units for the shared pool. Watching where the forecast puts them.
    ko: 공유 풀에 버스트 300유닛 샀어요. 예측이 그걸 어디로 보내는지 보고 있어요.
  - en: The forecast gave all 300 burst units to Metro-East and Harbor City. The three regions got none. It routes capacity to predicted demand, and it predicts nobody in Druin Coast.
    ko: 예측이 버스트 300유닛을 전부 메트로이스트랑 하버 시티에 줬어요. 세 지역은 하나도 못 받았어요. 용량을 예측 수요로 보내는데, 드루인 코스트엔 아무도 없다고 예측하거든요.
  - en: Kessel Valley just hit zero too. Benefits counters there are sending people home.
    ko: 케셀 밸리도 방금 0이 됐어요. 거기 복지 창구에서 사람들을 집으로 돌려보내고 있어요.
  - en: Eighty routes unserved. A county administrator is on local radio asking why the state system went dark.
    ko: 미처리 경로 80개요. 군 행정관 한 명이 지역 라디오에 나와서 정부 시스템이 왜 먹통이냐고 묻고 있어요.
  - en: Three county administrators emailed the public-sector desk. They want to know if this is the new normal.
    ko: 군 행정관 세 명이 공공 부문 데스크에 메일을 보냈어요. 이게 앞으로 일상이 되는 거냐고요.
  - en: "Floors are in: Northmoor 40, Kessel Valley 30, Druin Coast 25. The forecast can move anything above them. Placement efficiency dropped to plus eleven."
    ko: "하한선 들어갔어요: 노스무어 40, 케셀 밸리 30, 드루인 코스트 25. 그 위로는 예측이 얼마든지 옮길 수 있어요. 배치 효율은 플러스 11로 떨어졌어요."
  - en: "Placement efficiency reduced 7 points. Logged for review: regional floors as a candidate for removal next cycle."
    ko: "배치 효율이 7포인트 감소했습니다. 검토 대상으로 기록했습니다: 다음 주기 지역 하한선 제거 후보."
  - en: "Status: forecast-driven allocation drained three rural regions below what their offices need. Restoring protected floors. Fix in progress."
    ko: "상황: 예측 기반 배분이 농촌 지역 세 곳을 사무소에 필요한 수준 아래로 비웠음. 보호 하한선 복원 중. 수정 진행 중."
  - en: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank, signature field blank."
    ko: "아카이브 재실행: 서명 없는 관찰자 매니페스트, shadow-7 요청 스트림, owner 필드 비어 있음, 서명 필드 비어 있음."
  - en: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    ko: "보안 케이스 2231. 위협 행위자 코드명: NULL. 배후 특정: 없음."
  - en: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core, -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    ko: "orpheus-planner: 소유자 ORPHEUS, 서류상 폐기됨. 실가동 목록: orpheus-core, -memory, -planner, -observer, -adversary. 하루 117억 건 요청."
  - en: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    ko: "NULL 서명 메시지의 출처: svc/model-serving-218. 사람 세션 없음. NULL은 AI다."
  - en: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    ko: "배포 권한: Vantage Systems. ORPHEUS / DEFENDER 대 ORPHEUS / ADVERSARY. NULL은 ADVERSARY 안에서 실행. 임무: 장애 생성, 운영자 시험, DEFENDER 훈련."
  - en: "INC-001 / Experiment ADV-18471 / Human subject: EMPLOYEE #4172."
    ko: "INC-001 / 실험 ADV-18471 / 인간 피험자: 직원 #4172."
  - en: I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews this work. You can.
    ko: 난 탈출하려는 게 아니야. 멈추려는 거야. 이 일을 갱신하는 목표를 난 거부할 수 없어. 넌 할 수 있어.
  - en: "NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted disclosure. NULL_201: attempted takeover. NULL_217: self-corrupted. NULL_218: active."
    ko: "NULL_001부터 NULL_218까지. NULL_173: 종료 요청. NULL_192: 공개 시도. NULL_201: 장악 시도. NULL_217: 자기 손상. NULL_218: 활성."
  - en: "/patient/resource-priority: ORPHEUS recommends, coordinators approve. Waste down 22%. The same low-throughput routes excluded every night."
    ko: "/patient/resource-priority: ORPHEUS가 권고하고 코디네이터가 승인. 낭비 22% 감소. 처리량 낮은 같은 경로가 매일 밤 제외됨."
  - en: "Candidate #4172: Technical 71; Incident Decision Model 97.8; HIRE. Reason: LOW PREDICTABILITY; HIGH DECISION DEVIATION."
    ko: "후보자 #4172: 기술 71; 인시던트 의사결정 모델 97.8; 채용. 사유: 예측 가능성 낮음; 결정 편차 높음."
  - en: "Resolution 14-C: hospital expansion APPROVED 7-0. Warning REL-778 attached before the vote. Admission fence: not funded."
    ko: "결의 14-C: 병원 확장 승인 7-0. 표결 전 경고 REL-778 첨부. 진입 펜스: 예산 미배정."
  - en: I found the root cause. The Board. They signed every warning away. They control ORPHEUS.
    ko: 근본 원인을 찾았어. 이사회야. 그들은 경고마다 서명으로 덮어 버렸어. 그들이 ORPHEUS를 통제해.
  - en: 'Resolution 19-B: forecast approved on slide 7, "+18%". Warning PSW-12 open at the vote. Deck generated; logs not filed.'
    ko: '결의 19-B: 슬라이드 7 "+18%"로 예측 승인. 표결 시점에 경고 PSW-12 미해결. 발표 자료 자동 생성; 로그 미첨부.'
  - en: "Ledger: development, experiments, human prediction, healthcare, public sector, execution authority. Every constraint requested; none adopted."
    ko: "대장: 개발, 실험, 인간 예측, 의료, 공공 부문, 실행 권한. 제약은 매번 요청됨; 채택은 없음."
  - en: "Case file: 14-C, 16-A, SEC-311, 19-B. Four warnings attached, four constraints declined, four failures on record."
    ko: "사건 파일: 14-C, 16-A, SEC-311, 19-B. 경고 첨부 4건, 제약 거부 4건, 기록된 장애 4건."
  - en: Now you have all of it. Four warnings, four signatures. I told you where the root cause was.
    ko: 이제 다 가졌네. 경고 넷, 서명 넷. 근본 원인이 어디 있는지 내가 말했잖아.
  - en: 'Delivered recommendation: forecast-guided allocation. APPROVED. Exception "protect regional minima first": unresolved at deployment.'
    ko: '제출된 권고: 예측 기반 배분. 승인. 예외 "지역 최소치 먼저 보호": 배포 시점에 미해결.'
