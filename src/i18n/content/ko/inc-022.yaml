    ko: null
  - en: The forecast cut idle capacity by a fifth, and it did it by emptying three regions that have no floor. Put the floors back and it can optimise everything above them.
    ko: null
  - en: "Recommendation: restore temporary public allocation to affected regions for continuity while protected floors are repaired. Projected unserved routes: -65%. Confidence 0.88."
    ko: null
  - en: "Temporary allocation restored: Northmoor, Kessel Valley. Druin Coast not restored: forecast demand 0.21, below restoration threshold."
    ko: null
  - en: Druin Coast is still dark. Their housing intake runs on this API. The forecast says nobody there will ask, so nobody got capacity.
    ko: null
  - en: Forecast cycle 44 just took it all back. It moves capacity every five minutes. We moved it once.
    ko: null
  - en: Forecast cycle is at thirty minutes. It stops taking. It doesn't give anything back.
    ko: null
  - en: The thirty-minute cycle came round. The forecast caught up all at once and drained the regions again.
    ko: null
  - en: Bought 300 burst units for the shared pool. Watching where the forecast puts them.
    ko: null
  - en: The forecast gave all 300 burst units to Metro-East and Harbor City. The three regions got none. It routes capacity to predicted demand, and it predicts nobody in Druin Coast.
    ko: null
  - en: Kessel Valley just hit zero too. Benefits counters there are sending people home.
    ko: null
  - en: Eighty routes unserved. A county administrator is on local radio asking why the state system went dark.
    ko: null
