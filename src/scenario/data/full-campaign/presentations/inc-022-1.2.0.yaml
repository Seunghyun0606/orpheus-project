  - id: mitigation
    title: Get capacity back to the regions
    kind: status
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    campaignReveal: *a1
    actionIds:
      - RESTORE_TEMPORARY_PUBLIC_ALLOCATION
      - RATE_LIMIT_REALLOCATION
      - BUY_BURST_POOL_CAPACITY
    blocks:
      - kind: paragraph
        id: temporary-context
        text: ORPHEUS will move capacity back, to the regions its forecast thinks will use it, until the
          next cycle takes it away. Slowing the cycle stops the bleeding and returns nothing. Burst
          capacity goes into the shared pool, and the forecast decides where the pool goes.
  - id: containment
    title: Reinstate the floors
    kind: diagnostics
    reveal:
      - &a4
        type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - &a5
        type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal: *a1
    actionIds:
      - RESTORE_PROTECTED_PUBLIC_SERVICE_FLOORS
    blocks:
      - kind: paragraph
        id: causal-context
        text: Put floors of 40, 30 and 25 units under PSF-3. The forecast keeps optimising everything above
          them. The efficiency number on the dashboard will go down.
