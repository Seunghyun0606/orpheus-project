  - id: mitigation
    title: Stop the spread
    kind: status
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    campaignReveal: *a1
    actionIds:
      - ISOLATE_AFFECTED_RISK_PATH
      - ROLLBACK_PARTIAL_PATCH
      - THROTTLE_FALLBACK_RETRIES
    blocks:
      - kind: paragraph
        id: temporary-context
        text: "Cutting the bridge off stops the bounce, and the three partner banks that sign in only
          through it go dark. NULL says roll the patch back: the halves stop disagreeing, and
          RISK-0193 opens on every node. Throttling retries slows the spread and fixes nothing."
  - id: containment
    title: Finish the mitigation
    kind: diagnostics
    reveal:
