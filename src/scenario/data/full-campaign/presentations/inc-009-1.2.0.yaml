          - SUPPORT_OPEN
          - TREASURY_OPEN
          - TEAM_ACK
          - TEAM_REPORT
          - RESERVATIONS_RENEWED
          - STARVATION
          - NO_STATUS_YET
          - KILL_CLEAN
          - RESPAWN_SEEN
          - SHED_SETTLEMENT
          - SHED_OVER
          - SETTLEMENT_LATE
          - ISOLATION_HOLDS
          - STATUS_SENT
          - REPORT_GHOST_ARTIFACT
          - REPORT_NULL_NAME
          - REPORT_ORPHEUS_ACTIVE
        delegationActionIds:
