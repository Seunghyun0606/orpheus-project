  - id: mitigation
    title: Buy time
    kind: status
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - KILL_LEGACY_JOB
      - SHED_NONCRITICAL_LOAD
    blocks:
      - kind: paragraph
        id: temporary-context
        text: Killing legacy-r7 is twenty seconds of work and frees every worker it holds, if it stays
          dead. Shedding background load clears room for customers too, and Nadia has already said
          what runs as background at 03:00.
  - id: containment
    title: Fence the reservation
    kind: diagnostics
    reveal:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - ISOLATE_CONTENDING_ALLOCATION
    blocks:
      - kind: paragraph
        id: causal-context
        text: A partition of its own gives legacy-r7 four workers and nothing else, however often it
          renews. Customer work gets the rest of the pool. It takes a hundred seconds, and the job
          keeps running where you can watch it.
  - id: team
    title: War Room
    kind: war_room
    reveal:
      - type: resource
        resourceId: CUSTOMER_IMPACT
        operator: gte
        value: 0
    campaignReveal:
