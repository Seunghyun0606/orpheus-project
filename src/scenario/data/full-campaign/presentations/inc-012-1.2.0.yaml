  - id: mitigation
    title: Slow it down or stop it
    kind: status
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 5
    actionIds:
      - THROTTLE_ARCHIVE_JOBS
      - PAUSE_ARCHIVE_RECONSTRUCTION
    blocks:
      - kind: paragraph
        id: temporary-context
        text: Throttling keeps the job alive at a trickle for up to five minutes. The writes recover
          most of the way and Legal has no complaint. Pausing frees the pool almost completely, but
          the job sits under a legal hold, and Legal will not leave a stopped job alone for long.
  - id: containment
    title: Give the archive its own pool
    kind: diagnostics
    reveal:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 5
    actionIds:
      - SEPARATE_ARCHIVE_IO
    blocks:
      - kind: paragraph
        id: causal-context
        text: The cutover moves every archive reservation to a pool of its own. It takes two and a half
          minutes, and it copies whatever is outstanding when it finishes. If the queue is still deep
          at that point, it fails and drops the writes caught in the copy window.
