  - id: mitigation
    title: Buy time
    kind: status
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 3
    actionIds:
      - SCALE_SESSION_CAPACITY
      - EVICT_IDLE_SESSIONS
      - RECYCLE_DATABASE_POOL
    blocks:
      - kind: paragraph
        id: temporary-context
        text: Sam can stand up an overflow pool in under a minute; it is expensive, and Sam has seen
          workloads that grow into whatever room they get. Evicting idle sessions frees seats now,
          but whoever is idle loses their cart. Alex swears by recycling the database pool.
  - id: containment
    title: Scope the tag's admission
    kind: diagnostics
    reveal:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 3
    actionIds:
      - LIMIT_SYNTHETIC_ADMISSION
    blocks:
      - kind: paragraph
        id: causal-context
        text: Matching repeat-214 by tag puts it on its own quota of twenty seats at low priority with
          a two-minute idle timeout. Customers keep their rule. Eighty seconds to roll out, and the
          tagged sessions above the quota are shed as it lands.
