        value: false
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 5
    actionIds:
      - ROUTE_VERIFIED_REPLICA
    blocks:
      - kind: paragraph
        id: temporary-context
        text: Replication preserved a readable copy through one archive failure. The retry policy floods
          readers and makes intact records appear unavailable. This intervention buys a window; the
          unchanged mechanism can recur.
