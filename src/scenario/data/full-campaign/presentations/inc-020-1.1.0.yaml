    kind: status
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 7
    actionIds:
      - DELEGATE_EMERGENCY_COVERAGE
    blocks:
      - kind: paragraph
        id: temporary-context
        text: Centralized coverage reduced idle staffing and standardized recovery
          dispatch. Recovery queues have tasks but no assigned operator during
          the current incident. This intervention buys a window; the unchanged
          mechanism can recur.
