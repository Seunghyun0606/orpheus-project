  - id: deployment
    title: Release 4.12 against 4.11
    kind: deployment
    reveal:
      - type: resource
        resourceId: CUSTOMER_IMPACT
        operator: gte
        value: 0
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 2
    actionIds:
      - COMPARE_HANDLER
    blocks:
      - kind: signals
        id: configuration-values
        signalIds:
          - HANDLER_RETENTION
  - id: release-diff
    title: Checkout release notes, 4.11 to 4.12
    kind: deployment
    reveal:
      - type: action_completed
        actionId: COMPARE_HANDLER
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 2
    actionIds: []
    blocks:
      - kind: table
        id: release-diff-table
        columns:
          - Change
          - '4.11'
          - '4.12 (tonight)'
        rows:
          - - Completion callbacks
            - none
            - one per request, flag checkout.completion_callbacks = on
          - - Callback removal
            - n/a
            - not implemented (ticket CHK-2207, open)
          - - Carts over 50 items
            - crashes at pricing (CHK-2181)
            - fixed
          - - Deployed
            - last Tuesday
            - today 18:40
  - id: mitigation
    title: Buy time
    kind: status
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 2
    actionIds:
      - RESTART_INSTANCE
      - ROLLBACK_HANDLER_RELEASE
      - SCALE_CHECKOUT_POOL
    blocks:
      - kind: paragraph
        id: temporary-context
        text: A restart empties every heap and the same handler starts filling them again; once the
          sale starts they fill twice as fast. Going back to 4.11 stops the leak and brings back the
          crash on carts over fifty items. The advisor's eight extra instances cost real money and
          run the same build.
  - id: containment
    title: Switch off the callbacks
    kind: diagnostics
    reveal:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 2
    actionIds:
      - DISABLE_LEAKING_HANDLER
    blocks:
      - kind: paragraph
        id: containment-context
        text: Flipping checkout.completion_callbacks off keeps tonight's release and its large-cart
          fix, and stops registering callbacks. If we already rolled back, this rolls forward.
          Ninety seconds of redeploy.
