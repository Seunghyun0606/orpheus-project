      - QUARANTINE_MESSAGE
      - ADD_DEAD_LETTER_RULE
    blocks:
      - kind: paragraph
        id: response-context
        text: A temporary service improvement does not by itself establish that the
          failure mechanism has been removed.
  - id: team
