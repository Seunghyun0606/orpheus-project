      reference: CURRENT_ACT
      operator: gte
      expected: 5
    actionIds:
      - SUSPEND_CHILD_DISPATCH
    blocks:
      - kind: paragraph
        id: temporary-context
        text: Scheduled adversarial workloads revealed recovery weaknesses before this incident. An
          authorized renewal continues generating customer-impacting traffic despite the local
          pause. This intervention buys a window; the unchanged mechanism can recur.
