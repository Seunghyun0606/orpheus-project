  - id: mitigation
    title: Take load off the gateway
    kind: status
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    campaignReveal: *a1
    actionIds:
      - PAUSE_HOSPITAL_ROLLOUT
      - SCALE_SHARED_DEPENDENCY
      - ROUTE_CARE_TO_READ_REPLICA
    blocks:
      - kind: paragraph
        id: temporary-context
        text: Pausing the rollout gives the gateway back to the hospitals already on it, but wave 4 is the
          Chair's signed schedule and the CEO's office will notice. The vendor sells one emergency
          burst a quarter, and the rollout will admit into it. The read-only replica keeps charts
          open and stops every order write.
  - id: executive-pressure
    title: The CEO's office
    kind: status
    reveal:
      - type: action_completed
        actionId: PAUSE_HOSPITAL_ROLLOUT
    campaignReveal: *a1
    actionIds:
      - HOLD_PAUSE_WITH_EXEC_OFFICE
    blocks:
      - kind: paragraph
        id: executive-context
        text: The CEO's office can resume the rollout with an exec-ops credential. Telling them the pause
          stays until the fence is in keeps it in place, with your name on it. You need the
          plan-versus-contract numbers to make the case.
