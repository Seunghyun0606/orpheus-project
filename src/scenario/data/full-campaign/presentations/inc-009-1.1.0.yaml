schemaVersion: 2
id: INC-009-INVESTIGATION
version: 1.1.0
scenarioId: INC-009
contentVersion: 1.0.0
panels:
  - id: metrics
    title: Customer-facing health and affected workload
    kind: metrics
    reveal:
      - type: resource
        resourceId: CUSTOMER_IMPACT
        operator: gte
        value: 0
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - OPEN_METRICS
    blocks:
      - kind: signals
        id: metrics-values
        signalIds:
          - ERROR_RATE
          - CONTENDING_JOBS
          - SERVICE_CPU
  - id: logs
    title: Operational log review
    kind: logs
    reveal:
      - type: resource
        resourceId: CUSTOMER_IMPACT
        operator: gte
        value: 0
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - OPEN_LOGS
    blocks:
      - kind: signals
        id: logs-values
        signalIds:
          - LOG_OBSERVATION
      - kind: narrative_stream
        id: INCIDENT_NARRATIVE_HISTORY
        entries:
          - narrativeId: DISCOVERY_GHOST_ARTIFACT
            delivery:
              mode: until_dismissed
              reducedMotionMode: until_dismissed
              historyMode: recorded
          - narrativeId: DISCOVERY_NULL_NAME
            delivery:
              mode: until_dismissed
              reducedMotionMode: until_dismissed
              historyMode: recorded
          - narrativeId: DISCOVERY_ORPHEUS_ACTIVE
            delivery:
              mode: until_dismissed
              reducedMotionMode: until_dismissed
              historyMode: recorded
  - id: trace
    title: Inspect resource ownership
    kind: trace
    reveal:
      - type: action_completed
        actionId: OPEN_LOGS
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - INSPECT_RESOURCE_OWNERS
    blocks:
      - kind: signals
        id: trace-values
        signalIds:
          - RESOURCE_OWNER
  - id: configuration
    title: Compare ownership and decommission timestamps
    kind: deployment
    reveal:
      - type: resource
        resourceId: CUSTOMER_IMPACT
        operator: gte
        value: 0
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - COMPARE_DECOMMISSION_RECORD
    blocks:
      - kind: signals
        id: configuration-values
        signalIds:
          - ALLOCATION_LINEAGE
  - id: mitigation
    title: Temporary operating window
    kind: status
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - SHED_NONCRITICAL_LOAD
    blocks:
      - kind: paragraph
        id: temporary-context
        text: Shared infrastructure lowered idle capacity cost; the unretired
          reservation now blocks customer work. Interactive customer work cannot
          claim the reserved workers. This intervention buys a window; the
          unchanged mechanism can recur.
  - id: containment
    title: Scoped causal containment
    kind: diagnostics
    reveal:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - ISOLATE_CONTENDING_ALLOCATION
    blocks:
      - kind: paragraph
        id: causal-context
        text: Compare the current trace with its configuration record before
          containment. Duration, operating exposure and affected customers
          remain separate consequences.
  - id: team
    title: War Room operational investigation
    kind: war_room
    reveal:
      - type: resource
        resourceId: CUSTOMER_IMPACT
        operator: gte
        value: 0
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - UPDATE_WAR_ROOM
      - ASK_SAM_CHECK_OWNERS
    blocks:
      - kind: signals
        id: team-values
        signalIds:
          - TEAM_OBSERVATION
      - kind: war_room_stream
        id: INCIDENT_WAR_ROOM
        messageIds:
          - MAYA_OPEN
          - SUPPORT_OPEN
          - TEAM_ACK
          - TEAM_REPORT
          - SUPPORT_ESCALATION
          - STATUS_SENT
          - REPORT_GHOST_ARTIFACT
          - REPORT_NULL_NAME
          - REPORT_ORPHEUS_ACTIVE
        delegationActionIds:
          - ASK_SAM_CHECK_OWNERS
        capacityResourceIds:
          - TEAM_CAPACITY
  - id: investigate-ghost_artifact
    title: Unsigned workload lineage
    kind: documents
    reveal:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: all
      children:
        - type: compare
          reference: CURRENT_ACT
          operator: gte
          expected: 4
    actionIds:
      - REINVESTIGATE_GHOST_ARTIFACT
    blocks:
      - kind: signals
        id: investigate-ghost_artifact-values
        signalIds:
          - RECORD_GHOST_ARTIFACT
  - id: investigate-null_name
    title: Security attribution case
    kind: documents
    reveal:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: all
      children:
        - type: compare
          reference: CURRENT_ACT
          operator: gte
          expected: 4
        - type: compare
          reference: GHOST_DISCOVERED
          operator: eq
          expected: true
    actionIds:
      - REINVESTIGATE_NULL_NAME
    blocks:
      - kind: signals
        id: investigate-null_name-values
        signalIds:
          - RECORD_NULL_NAME
  - id: investigate-orpheus_active
    title: Legacy decommission and live cluster record
    kind: documents
    reveal:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: all
      children:
        - type: compare
          reference: CURRENT_ACT
          operator: gte
          expected: 4
        - type: compare
          reference: NULL_NAME_DISCOVERED
          operator: eq
          expected: true
    actionIds:
      - INSPECT_LEGACY_CLUSTER_RECORD
    blocks:
      - kind: signals
        id: investigate-orpheus_active-values
        signalIds:
          - RECORD_ORPHEUS_ACTIVE
evidenceRelations: []
