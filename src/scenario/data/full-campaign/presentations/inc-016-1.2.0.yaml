    title: rescore v1 and v2
    kind: deployment
    reveal:
      - type: action_completed
        actionId: COMPARE_REVIEW_RECEIPTS
    campaignReveal: *a2
    actionIds: []
    blocks:
      - kind: table
        id: rescore-diff
        columns:
          - Setting
          - v1
          - v2
        rows:
          - - dedupe_key
            - transaction ID + receipt
            - transaction ID
          - - consume_receipt_before_scoring
            - "true"
            - (removed)
          - - review_threshold
            - "0.70"
            - "0.62"
          - - fraud catch rate (30 days)
            - baseline
            - +31%
