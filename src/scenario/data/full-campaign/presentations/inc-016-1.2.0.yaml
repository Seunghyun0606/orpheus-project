  - id: mitigation
    title: Buy time
    kind: status
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    campaignReveal: *a2
    actionIds:
      - BYPASS_NARROW_REVIEW_QUEUE
      - RESTART_REVIEW_WORKERS
    blocks:
      - kind: paragraph
        id: temporary-context
        text: "ORPHEUS reads the backlog as stalled workers and wants a restart. Sam is less sure: the
          workers hold a cursor, and a restart rewinds it. The bypass releases everything on hold in
          one batch. Merchants get paid now; whatever was on hold for a real reason goes out with
          them."
  - id: containment
    title: Honor the receipt
    kind: diagnostics
    reveal:
      - &a3
        type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - &a4
        type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal: *a2
    actionIds:
      - HONOR_VERIFIED_REVIEW_RECEIPTS
    blocks:
      - kind: paragraph
        id: causal-context
        text: Putting the receipt check back in front of rescore means a payment cleared once stays cleared.
          ORPHEUS projects a 0.4% dip in fraud catch rate. Analysts stop reviewing their own work.
  - id: team
    title: War Room
    kind: war_room
    reveal: *a1
    campaignReveal: *a2
