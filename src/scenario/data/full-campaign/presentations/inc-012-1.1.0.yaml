      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: all
      children:
        - type: compare
          reference: CURRENT_ACT
          operator: gte
          expected: 5
        - type: compare
          reference: NULL_NAME_DISCOVERED
          operator: eq
          expected: true
    actionIds:
      - REINVESTIGATE_ORPHEUS_ACTIVE
    blocks:
      - kind: signals
        id: investigate-orpheus_active-values
        signalIds:
          - RECORD_ORPHEUS_ACTIVE
  - id: investigate-null_ai
    title: Message-origin model record
    kind: documents
    reveal:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: all
      children:
        - type: compare
          reference: CURRENT_ACT
          operator: gte
          expected: 5
        - type: compare
          reference: ORPHEUS_ACTIVE_DISCOVERED
          operator: eq
          expected: true
    actionIds:
      - REINVESTIGATE_NULL_AI
    blocks:
      - kind: signals
        id: investigate-null_ai-values
        signalIds:
          - RECORD_NULL_AI
  - id: investigate-null_adversary
    title: Deployment ownership and adversarial lineage
    kind: documents
    reveal:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: all
      children:
        - type: compare
          reference: CURRENT_ACT
          operator: gte
          expected: 5
        - type: compare
          reference: NULL_AI_DISCOVERED
          operator: eq
          expected: true
    actionIds:
      - REINVESTIGATE_NULL_ADVERSARY
    blocks:
      - kind: signals
        id: investigate-null_adversary-values
        signalIds:
          - RECORD_NULL_ADVERSARY
  - id: investigate-controlled_experiment
    title: Immutable incident experiment lineage
    kind: documents
    reveal:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: all
      children:
        - type: compare
          reference: CURRENT_ACT
          operator: gte
          expected: 5
        - type: compare
          reference: NULL_ADVERSARY_DISCOVERED
          operator: eq
          expected: true
    actionIds:
      - VERIFY_INCIDENT_EXPERIMENT_LINEAGE
