  - id: mitigation
    title: Buy time
    kind: status
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    campaignReveal: *a2
    actionIds:
      - ROLLBACK_RANKING_CACHE
      - FREEZE_RANKING_PUBLICATION
    blocks:
      - kind: paragraph
        id: temporary-context
        text: "ORPHEUS wants r27 back. r27 is consistent, and it ends on Tuesday: everyone who applied since
          then drops off every shortlist until the publisher overwrites it. Freezing publication
          stops the reshuffling outright and takes the shortlists away from every recruiter in the
          building."
  - id: containment
    title: Fence the generations
    kind: diagnostics
    reveal:
      - &a3
        type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - &a4
        type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal: *a2
    actionIds:
      - RECONCILE_RANKING_GENERATIONS
    blocks:
      - kind: paragraph
        id: causal-context
        text: Fencing m28 to r28 makes the API serve one generation or wait for it. Two minutes of
          republishing, then one rank per candidate, including the ones who applied this week.
