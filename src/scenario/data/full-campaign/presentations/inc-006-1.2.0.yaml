  - id: mitigation
    title: Keep people signing in
    kind: status
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 3
    actionIds:
      - ROUTE_TRUSTED_IDENTITY_POOL
      - RESTART_VERIFIERS
    blocks:
      - kind: paragraph
        id: temporary-context
        text: The old ca-17 pool can take new sign-ins for a few minutes. It was sized for a quarter
          of our traffic, and the partner banks share it. A restart makes every verifier load
          whatever bundle is on its disk, which helps exactly as many verifiers as have the new one.
  - id: containment
    title: Fix the trust gap
    kind: diagnostics
    reveal:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 3
    actionIds:
      - ROLLBACK_CERTIFICATE_ROLLOVER
      - REPAIR_TRUST_DISTRIBUTION
    blocks:
      - kind: paragraph
        id: containment-context
        text: Withdrawing ca-18 fixes sign-ins in a minute and signs out the 31,240 customers it has
          already signed, all at once. Finishing the stalled bundle copy takes two and a half
          minutes, needs to know which verifiers are missing it, and logs out nobody.
