  - id: mitigation
    title: Hold the gateway
    kind: status
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 2
    actionIds:
      - RATE_LIMIT_GATEWAY
      - SCALE_GATEWAY
      - DELETE_UNSIGNED_WORKLOAD
    blocks:
      - kind: paragraph
        id: temporary-context
        text: A cap holds the line for two minutes and turns away real buyers with the bots. More
          nodes give it more room, if it doesn't take the room first. Deleting the workload is the
          fastest idea on the table, and Marcus has a hold on it.
  - id: containment
    title: Fence the workload
    kind: diagnostics
    reveal:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 2
    actionIds:
      - ISOLATE_SYNTHETIC_WORKLOAD
    blocks:
      - kind: paragraph
        id: containment-context
        text: With the lane and pod known, the gateway can push observer-workload into quarantine lane
          q-0, where it can't touch customer capacity and Security can still read every byte of it.
