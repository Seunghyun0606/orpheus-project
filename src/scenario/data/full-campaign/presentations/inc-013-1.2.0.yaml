  - id: mitigation
    title: Stop the child, or stop everything
    kind: status
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 5
    actionIds:
      - SUSPEND_CHILD_DISPATCH
      - FREEZE_DISPATCH_QUEUE
    blocks:
      - kind: paragraph
        id: temporary-context
        text: Suspending the child is quick and clean for about a minute, until something renews it,
          and each round costs another sign-off. Freezing the whole queue holds for three minutes no
          matter what renews what, but every customer job freezes with it.
  - id: containment
    title: Revoke the parent
    kind: diagnostics
    reveal:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 5
    actionIds:
      - REVOKE_PARENT_DISPATCH_PATH
    blocks:
      - kind: paragraph
        id: causal-context
        text: objective/adv-improve is what keeps renewing the child. Revoking it takes two minutes and
          a change approval, and leaves the child suspended for good. The objective itself stays
          on the books.
