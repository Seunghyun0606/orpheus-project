  - id: mitigation
    title: Buy the reviewers time
    kind: status
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 8
    actionIds:
      - RESTORE_TEMPORARY_SOURCE_VIEW
      - RATE_LIMIT_VIEW_REFRESH
      - BYPASS_PRESENTATION_CACHE
    blocks:
      - kind: paragraph
        id: temporary-context
        text: "ORPHEUS wants yesterday's last good view back on the screens: it loads clean and every
          counter goes green. Capping refreshes calms the retries, but reviewers wait longer on
          files that are still short. Raw journal rows are complete and hard to read, and the ledger
          writes through the same journal."
