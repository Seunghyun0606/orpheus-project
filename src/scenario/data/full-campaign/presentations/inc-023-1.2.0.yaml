      operator: gte
      expected: 8
    actionIds:
      - RECONCILE_COMPLETE_SOURCE_VIEW
    blocks:
      - kind: paragraph
        id: causal-context
        text: Render A, B and C from the complete journal, put them side by side and switch the selector
          off. Reviewers get slower. They also get every row. You have to have seen the frames to
          know what to reconcile.
