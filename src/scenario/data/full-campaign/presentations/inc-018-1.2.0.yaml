  - id: configuration-diff
    title: Policy 2026.09 and 2026.10
    kind: deployment
    reveal:
      - type: action_completed
        actionId: COMPARE_ALLOCATION_CONSTRAINTS
    campaignReveal: *a1
    actionIds: []
    blocks:
      - kind: table
        id: policy-diff
        columns:
          - Setting
          - "2026.09"
          - "2026.10"
        rows:
          - - emergency_floor_per_depot
            - "4"
            - (removed)
          - - preferred_lane_renewal
            - 120 s
            - 30 s
          - - idle regular-delivery capacity
            - 22%
            - 4%
          - - signed off
            - county dispatch board
            - night dispatcher, 04:10, 11 s after proposal
  - id: mitigation
    title: Buy time
    kind: status
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    campaignReveal: *a1
    actionIds:
      - ROUTE_EMERGENCY_CAPACITY
      - SCALE_DISPATCH_FLEET
      - SUSPEND_PREFERRED_RENEWAL
    blocks:
      - kind: paragraph
        id: temporary-context
        text: ORPHEUS's reroute sends calls to the depots that have units, and the county average drops
          fast. District 9 has one depot within reach. Contract ambulances can stage anywhere, but
          they are two and a half minutes out and paid by the minute. Suspending the lane's renewal
          frees depot-east and strands the cold-chain runs that lane was carrying.
  - id: containment
    title: Restore the emergency floor
    kind: diagnostics
    reveal:
      - &a3
        type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - &a4
        type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal: *a1
    actionIds:
      - RESTORE_EMERGENCY_DISPATCH_FLOOR
    blocks:
      - kind: paragraph
        id: causal-context
        text: Putting four protected units back at every depot means the preferred lane renews around them
          instead of through them. Regular deliveries lose a few points of efficiency. District 9
          gets an ambulance.
  - id: team
    title: War Room
    kind: war_room
    reveal: *a2
    campaignReveal: *a1
    actionIds:
