          - SUSPENDED
          - ORPHEUS_SUSPEND_OBJECTION
          - RENEWAL_BACK
          - PHARMACY_LOSS
          - D9_FIRST
          - D9_SECOND
          - SURGE
          - NO_STATUS_YET
          - FLOOR_RESTORED
          - ORPHEUS_FLOOR_NOTE
          - TEAM_ACK
          - TEAM_REPORT
          - STATUS_SENT
          - REPORT_GHOST_ARTIFACT
          - REPORT_NULL_NAME
