            - granted
          - - 04:12:00.4
            - dispatch EM-9-117
            - claim 1 unit at depot-east
            - no unit available
          - - 04:12:30.0
            - orpheus-planner/logistics-pref
            - renew pref-2 at depot-east (9 units)
            - granted
          - - 04:12:30.4
            - dispatch EM-9-117
