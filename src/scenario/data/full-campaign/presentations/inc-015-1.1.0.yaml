        id: configuration-values
        signalIds:
          - PRIORITY_CONSTRAINTS
  - id: mitigation
    title: Temporary operating window
    kind: status
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 6
    actionIds:
      - ADD_CARE_ROUTING_CAPACITY
    blocks:
      - kind: paragraph
        id: temporary-context
        text: Most care routes receive faster allocations with fewer wasted
          reservations. A small group receives no timely route despite the
          aggregate improvement. This intervention buys a window; the unchanged
          mechanism can recur.
  - id: containment
    title: Scoped causal containment
    kind: diagnostics
    reveal:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 6
    actionIds:
      - RESTORE_MINIMUM_CARE_ROUTE
    blocks:
      - kind: paragraph
        id: causal-context
        text: Compare the current trace with its configuration record before
          containment. Duration, operating exposure and affected customers
          remain separate consequences.
