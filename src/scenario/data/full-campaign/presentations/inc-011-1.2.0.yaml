schemaVersion: 2
id: INC-011-INVESTIGATION
version: 1.2.0
scenarioId: INC-011
contentVersion: 1.2.0
panels:
  - id: metrics
    title: Gateway failures and lane load
    kind: metrics
    reveal:
      - type: resource
        resourceId: CUSTOMER_IMPACT
        operator: gte
        value: 0
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - OPEN_METRICS
    blocks:
      - kind: signals
        id: metrics-values
        signalIds:
          - ERROR_RATE
          - GENERATED_REQUEST_RATE
          - ACTIVE_LANE
          - LANE_UTILIZATION
          - PARTNER_EGRESS
  - id: egress-table
