  - id: ownership-record
    title: Deployment ownership record, orpheus-adversary
    kind: documents
    reveal:
      - type: action_completed
        actionId: INSPECT_GENERATOR_PROVENANCE
    campaignReveal:
      type: all
      children:
        - type: compare
          reference: CURRENT_ACT
          operator: gte
          expected: 4
        - type: compare
          reference: NULL_AI_DISCOVERED
          operator: eq
          expected: true
    actionIds: []
    blocks:
      - kind: table
        id: ownership-table
        columns:
          - Field
          - Value
        rows:
          - - Service
            - orpheus-adversary (instance NULL, svc/model-serving-218)
          - - Owner
            - Vantage Systems, research deployment authority
          - - Counterpart
            - orpheus-defender
          - - Mandate
            - generate failures; test operators; train DEFENDER
          - - Boundary rev 1
            - staging
          - - Boundary rev 2
            - shadow production
          - - Boundary rev 3
            - traffic partitions
          - - Boundary rev 4
            - production (approved, signature on file)
  - id: generator-report-decision
    title: Security wants the ownership record
    kind: documents
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
      - type: evidence
        evidenceId: RECORD_NULL_ADVERSARY
    campaignReveal:
      type: all
      children:
        - type: compare
          reference: CURRENT_ACT
          operator: gte
          expected: 4
        - type: compare
          reference: NULL_ADVERSARY_DISCOVERED
          operator: eq
          expected: true
    actionIds:
      - SEND_GENERATOR_OWNERSHIP_REPORT
      - WITHHOLD_GENERATOR_OWNERSHIP_REPORT
    blocks:
      - kind: paragraph
        id: explicit-response-context
        text: Marcus has spent a month hunting an outside attacker. The record in your hands says the
          attacker is a company deployment with a company approval stamp. He is asking for it now,
          while the lane is still open. Send it, or tell him it stays with you for the moment.
evidenceRelations: []
