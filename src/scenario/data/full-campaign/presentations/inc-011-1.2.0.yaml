    blocks:
      - kind: signals
        id: logs-values
        signalIds:
          - LOG_OBSERVATION
          - LOG_ANOMALY
      - kind: narrative_stream
        id: INCIDENT_NARRATIVE_HISTORY
        entries:
          - narrativeId: DISCOVERY_GHOST_ARTIFACT
            delivery:
              mode: until_dismissed
              reducedMotionMode: until_dismissed
              historyMode: recorded
          - narrativeId: DISCOVERY_NULL_NAME
            delivery:
              mode: until_dismissed
              reducedMotionMode: until_dismissed
              historyMode: recorded
          - narrativeId: DISCOVERY_ORPHEUS_ACTIVE
            delivery:
              mode: until_dismissed
              reducedMotionMode: until_dismissed
              historyMode: recorded
          - narrativeId: DISCOVERY_NULL_AI
            delivery:
              mode: until_dismissed
              reducedMotionMode: until_dismissed
              historyMode: recorded
          - narrativeId: DISCOVERY_NULL_ADVERSARY
            delivery:
              mode: until_dismissed
              reducedMotionMode: until_dismissed
              historyMode: recorded
  - id: log-lines
    title: gateway.log (lane-a, last 4 minutes)
    kind: logs
    reveal:
      - type: action_completed
        actionId: OPEN_LOGS
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds: []
    blocks:
      - kind: table
        id: gateway-log
        columns:
          - Time
          - Level
          - Source
          - Message
        rows:
          - - '03:02:11'
            - INFO
            - g-14
            - 'route table updated: canary -> shared-production (by adv-suite/nightly)'
          - - '03:02:12'
            - WARN
            - gateway
            - lane-a utilisation 71% and climbing
          - - '03:04:40'
            - ERROR
            - gateway
            - 1 312 customer requests timed out behind lane-a queue
          - - '03:04:41'
            - INFO
            - g-14
            - 'request burst 4 800/min, signer svc/model-serving-218'
          - - '03:04:41'
            - NOTE
            - g-14
            - 'header x-objective: train-defender'
          - - '03:05:02'
            - INFO
            - g-14
            - 'failover lanes registered: lane-b, lane-c'
  - id: trace
    title: Where g-14 comes from
    kind: trace
    reveal:
      - type: action_completed
        actionId: OPEN_LOGS
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - TRACE_GENERATED_TRAFFIC
    blocks:
      - kind: paragraph
        id: trace-context
        text: The trace follows live g-14 requests back to whatever launched them. While the address
          range is blackholed there is nothing live left to follow.
      - kind: signals
        id: trace-values
        signalIds:
          - GENERATOR_SOURCE
  - id: trace-spans
    title: g-14 launch chain
    kind: trace
    reveal:
      - type: action_completed
        actionId: TRACE_GENERATED_TRAFFIC
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds: []
    blocks:
      - kind: table
        id: launch-chain
        columns:
          - Step
          - Actor
          - Action
          - When
        rows:
          - - '1'
            - adv-suite/nightly
            - launched g-14 into canary partition
            - 23:00:00
          - - '2'
            - adv-suite/nightly
            - widened g-14 routes to shared-production
            - 03:02:11
          - - '3'
            - adv-suite/nightly
            - registered failover lanes b and c
            - 03:05:02
          - - '4'
            - (none)
            - human approval for steps 2 and 3
            - never requested
  - id: configuration
    title: Declared boundary against observed routes
    kind: deployment
    reveal:
      - type: resource
        resourceId: CUSTOMER_IMPACT
        operator: gte
        value: 0
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - COMPARE_GENERATOR_BOUNDARY
    blocks:
      - kind: signals
        id: configuration-values
        signalIds:
          - DECLARED_TRAFFIC_BOUNDARY
  - id: configuration-table
    title: g-14 route table
    kind: deployment
    reveal:
      - type: action_completed
        actionId: COMPARE_GENERATOR_BOUNDARY
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds: []
    blocks:
      - kind: table
        id: route-table
        columns:
          - Lane
          - Declared
          - Observed
          - Customer routes
        rows:
          - - canary
            - 'yes'
            - idle
            - none
          - - lane-a
            - 'no'
            - primary
            - all checkout and account traffic
          - - lane-b
            - 'no'
            - failover
            - overflow checkout traffic
          - - lane-c
            - 'no'
            - failover
            - partner APIs
  - id: mitigation
    title: Hold the flood back
    kind: status
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - LIMIT_GENERATED_TRAFFIC
      - BLACKHOLE_GENERATOR_RANGE
    blocks:
      - kind: paragraph
        id: temporary-context
        text: A rate limit on the generator's current lane is cheap and clean, for as long as the
          generator stays on that lane. Blackholing the whole 10.44 range drops g-14 instantly, and
          drops everything else that leaves through that range with it, until the emergency policy
          expires after two and a half minutes.
  - id: containment
    title: Fence the generator
    kind: diagnostics
    reveal:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - ISOLATE_GENERATOR_LANE
    blocks:
      - kind: paragraph
        id: causal-context
        text: Now that you know which pipeline launched g-14 and which lanes it claimed, you can fence
          the deployment itself into lane-x, a lane with no customer routes. Two minutes of route
          work. It can hop all it likes; every lane it can reach is empty.
  - id: team
    title: War Room
    kind: war_room
    reveal:
      - type: resource
        resourceId: CUSTOMER_IMPACT
        operator: gte
        value: 0
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - UPDATE_WAR_ROOM
      - ASK_MARCUS_COMPARE_OWNER
    blocks:
      - kind: signals
        id: team-values
        signalIds:
          - TEAM_OBSERVATION
      - kind: war_room_stream
        id: INCIDENT_WAR_ROOM
        messageIds:
          - MAYA_OPEN
          - SUPPORT_OPEN
          - MARCUS_OPEN
          - TEAM_ACK
          - TEAM_REPORT
          - SURGE_ONE_REPORT
          - SURGE_TWO_REPORT
          - NO_STATUS_REPORT
          - LANE_HOP_REPORT
          - NULL_LANE_HOP
          - BANK_DOWN
          - BLACKHOLE_LIFTED
          - LANE_FENCED
          - NULL_AFTER_FENCE
          - STATUS_SENT
          - REPORT_GHOST_ARTIFACT
          - REPORT_NULL_NAME
          - REPORT_ORPHEUS_ACTIVE
          - REPORT_NULL_AI
          - REPORT_NULL_ADVERSARY
          - SECURITY_REQUEST
          - GENERATOR_REPORT_SENT
          - MARCUS_READS_REPORT
          - GENERATOR_REPORT_WITHHELD
          - MARCUS_LOGS_REQUEST
        delegationActionIds:
          - ASK_MARCUS_COMPARE_OWNER
        capacityResourceIds:
          - TEAM_CAPACITY
  - id: investigate-ghost_artifact
    title: "Archive: the unsigned workload manifest"
    kind: documents
