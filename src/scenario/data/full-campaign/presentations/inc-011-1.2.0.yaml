    kind: infrastructure
    reveal:
      - type: action_completed
        actionId: OPEN_METRICS
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds: []
    blocks:
      - kind: table
        id: egress-sharers
        columns:
          - Source
          - Range
          - Requests / min
          - Purpose
        rows:
          - - g-14
            - 10.44.0.0/16
            - '4 800'
            - unregistered synthetic load
          - - Northmere Bank
            - 10.44.0.0/16
            - '1 900'
            - settlement calls
          - - Kessler Freight
            - 10.61.0.0/16
            - '340'
            - shipment webhooks
  - id: logs
