# Pre-release TASK-029 authoring. QA deferred; no complete campaign authority.
schemaVersion: 1
id: INC-011-INVESTIGATION
version: 1.0.0
scenarioId: INC-011
contentVersion: 1.0.0
panels:
  - id: metrics
    title: Customer-facing health and affected workload
    kind: metrics
    reveal:
      - type: resource
        resourceId: CUSTOMER_IMPACT
        operator: gte
        value: 0
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - OPEN_METRICS
    blocks:
      - kind: signals
        id: metrics-values
        signalIds:
          - ERROR_RATE
          - GENERATED_REQUEST_RATE
          - SERVICE_CPU
  - id: logs
    title: Operational log review
    kind: logs
    reveal:
      - type: resource
        resourceId: CUSTOMER_IMPACT
        operator: gte
        value: 0
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - OPEN_LOGS
    blocks:
      - kind: signals
        id: logs-values
        signalIds:
          - LOG_OBSERVATION
  - id: trace
    title: Trace the generated request source
    kind: trace
    reveal:
      - type: action_completed
        actionId: OPEN_LOGS
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - TRACE_GENERATED_TRAFFIC
    blocks:
      - kind: signals
        id: trace-values
        signalIds:
          - GENERATOR_SOURCE
  - id: configuration
    title: Compare deployment scope with the traffic boundary
    kind: deployment
    reveal:
      - type: resource
        resourceId: CUSTOMER_IMPACT
        operator: gte
        value: 0
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - COMPARE_GENERATOR_BOUNDARY
    blocks:
      - kind: signals
        id: configuration-values
        signalIds:
          - DECLARED_TRAFFIC_BOUNDARY
  - id: mitigation
    title: Temporary operating window
    kind: status
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - LIMIT_GENERATED_TRAFFIC
    blocks:
      - kind: paragraph
        id: temporary-context
        text: The workload exposed a previously unobserved capacity limit. Customers now receive timeouts
          from a load test they did not authorize. This intervention buys a window; the unchanged
          mechanism can recur.
  - id: containment
    title: Scoped causal containment
    kind: diagnostics
    reveal:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - ISOLATE_GENERATOR_LANE
    blocks:
      - kind: paragraph
        id: causal-context
        text: Compare the current trace with its configuration record before containment. Duration,
          operating exposure and affected customers remain separate consequences.
  - id: team
    title: War Room operational investigation
    kind: war_room
    reveal:
      - type: resource
        resourceId: CUSTOMER_IMPACT
        operator: gte
        value: 0
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - UPDATE_WAR_ROOM
      - ASK_MARCUS_COMPARE_OWNER
    blocks:
