  - id: mitigation
    title: Get the queue moving
    kind: status
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    campaignReveal: *a1
    actionIds:
      - DELEGATE_EMERGENCY_COVERAGE
      - AUTOMATE_RECOVERY_QUEUE
      - PARK_UNCOVERED_RETRIES
    blocks:
      - kind: paragraph
        id: temporary-context
        text: Volunteers would take every task by hand, oldest first, for as long as they can stay awake; it
          costs overtime and ties up two of your own team. Recovery automation clears the queue in
          seconds and decides for itself which tasks are worth doing. Parking retries quiets the API
          and leaves the customers where they are.
