        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 8
    actionIds:
      - SEPARATE_LIVE_AUDIT_RESERVATIONS
    blocks:
      - kind: paragraph
        id: causal-context
        text: Give live incident reads a reservation of their own and fence the batch into a small slice of
          the old one. The consoles recover for good. The batch keeps reading.
