  - id: mitigation
    title: Get the consoles back
    kind: status
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 8
    actionIds:
      - THROTTLE_OBSERVER_BATCH
      - KILL_OBSERVER_BATCH
      - ROUTE_LIVE_READS_TO_REPLICA
    blocks:
      - kind: paragraph
        id: temporary-context
        text: A throttle gives the consoles room until the batch asks its own scheduler for more. Killing
          the job clears the journal in seconds, and Marcus will want to know why. The read replica
          takes the load off the primary, but it runs behind, and people act on what their console
          tells them.
  - id: containment
    title: Split the reservation
    kind: diagnostics
    reveal:
