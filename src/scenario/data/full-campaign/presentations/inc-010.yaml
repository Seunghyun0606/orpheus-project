# Pre-release TASK-029 authoring. QA deferred; no complete campaign authority.
schemaVersion: 1
id: INC-010-INVESTIGATION
version: 1.0.0
scenarioId: INC-010
contentVersion: 1.0.0
panels:
  - id: metrics
    title: Customer-facing health and affected workload
    kind: metrics
    reveal:
      - type: resource
        resourceId: CUSTOMER_IMPACT
        operator: gte
        value: 0
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - OPEN_METRICS
    blocks:
      - kind: signals
        id: metrics-values
        signalIds:
          - ERROR_RATE
          - DEPENDENCY_TOGGLES
          - SERVICE_CPU
  - id: logs
    title: Operational log review
    kind: logs
    reveal:
      - type: resource
        resourceId: CUSTOMER_IMPACT
        operator: gte
        value: 0
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - OPEN_LOGS
    blocks:
      - kind: signals
        id: logs-values
        signalIds:
          - LOG_OBSERVATION
  - id: trace
    title: Trace a repeated remediation toggle
    kind: trace
    reveal:
      - type: action_completed
        actionId: OPEN_LOGS
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - TRACE_REMEDIATION_ORIGIN
    blocks:
      - kind: signals
        id: trace-values
        signalIds:
          - TOGGLE_ORIGIN
  - id: configuration
    title: Compare the remediation generation fence
    kind: deployment
    reveal:
      - type: resource
        resourceId: CUSTOMER_IMPACT
        operator: gte
        value: 0
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - COMPARE_CONTROLLER_GENERATIONS
    blocks:
      - kind: signals
        id: configuration-values
        signalIds:
          - CONTROLLER_GENERATIONS
  - id: mitigation
    title: Temporary operating window
    kind: status
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - SUSPEND_DEPENDENCY_TOGGLE
    blocks:
      - kind: paragraph
        id: temporary-context
        text: Earlier controller intervention restored requests before operators reached the incident. The
          feedback loop interrupts requests that were healthy before remediation. This intervention
          buys a window; the unchanged mechanism can recur.
  - id: containment
    title: Scoped causal containment
    kind: diagnostics
    reveal:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - FENCE_REMEDIATION_WRITER
    blocks:
      - kind: paragraph
        id: causal-context
        text: Compare the current trace with its configuration record before containment. Duration,
          operating exposure and affected customers remain separate consequences.
  - id: team
    title: War Room operational investigation
    kind: war_room
    reveal:
      - type: resource
        resourceId: CUSTOMER_IMPACT
        operator: gte
        value: 0
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 4
    actionIds:
      - UPDATE_WAR_ROOM
      - ASK_SAM_TRACE_CONTROLLER
    blocks:
      - kind: signals
        id: team-values
        signalIds:
          - TEAM_OBSERVATION
  - id: investigate-ghost_artifact
    title: Unsigned workload lineage
    kind: documents
    reveal:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: all
      children:
        - type: compare
          reference: CURRENT_ACT
          operator: gte
          expected: 4
    actionIds:
      - REINVESTIGATE_GHOST_ARTIFACT
    blocks:
      - kind: signals
        id: investigate-ghost_artifact-values
        signalIds:
          - RECORD_GHOST_ARTIFACT
  - id: investigate-null_name
    title: Security attribution case
    kind: documents
    reveal:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: all
      children:
        - type: compare
          reference: CURRENT_ACT
          operator: gte
          expected: 4
        - type: compare
          reference: GHOST_DISCOVERED
          operator: eq
          expected: true
    actionIds:
      - REINVESTIGATE_NULL_NAME
    blocks:
      - kind: signals
        id: investigate-null_name-values
        signalIds:
          - RECORD_NULL_NAME
  - id: investigate-orpheus_active
    title: Legacy decommission and live cluster record
    kind: documents
    reveal:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: all
      children:
        - type: compare
          reference: CURRENT_ACT
          operator: gte
          expected: 4
        - type: compare
          reference: NULL_NAME_DISCOVERED
          operator: eq
          expected: true
    actionIds:
      - REINVESTIGATE_ORPHEUS_ACTIVE
    blocks:
      - kind: signals
        id: investigate-orpheus_active-values
        signalIds:
          - RECORD_ORPHEUS_ACTIVE
  - id: investigate-null_ai
    title: Message-origin model record
    kind: documents
    reveal:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: all
      children:
        - type: compare
          reference: CURRENT_ACT
          operator: gte
          expected: 4
        - type: compare
          reference: ORPHEUS_ACTIVE_DISCOVERED
          operator: eq
          expected: true
    actionIds:
      - COMPARE_MESSAGE_MODEL_ORIGIN
    blocks:
      - kind: signals
        id: investigate-null_ai-values
        signalIds:
          - RECORD_NULL_AI
evidenceRelations: []
