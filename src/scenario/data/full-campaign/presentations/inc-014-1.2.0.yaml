        actionId: VERIFY_REPLICA_CHECKSUM
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 5
    actionIds: []
    blocks:
      - kind: table
        id: checksum-table
        columns:
          - Segments
          - Original write receipt
          - Digest manifest (rewritten by r-90)
        rows:
          - - seg-001 to seg-172
            - match
            - entry removed
          - - seg-173 to seg-217
            - match
            - entry removed
          - - seg-218
            - match
            - match
  - id: configuration
