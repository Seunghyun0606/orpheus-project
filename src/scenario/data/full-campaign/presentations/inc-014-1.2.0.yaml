  - id: log-lines
    title: reader.log, rejected segments
    kind: logs
    reveal:
      - type: action_completed
        actionId: OPEN_LOGS
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 5
    actionIds: []
    blocks:
      - kind: table
        id: reader-log
        columns:
          - Time
          - Segment
          - arch-a
          - arch-b
          - arch-c
        rows:
          - - '04:10:02'
            - instance-archive/seg-173
            - pruned
            - pruned
            - digest mismatch, retry 14
          - - '04:10:02'
            - instance-archive/seg-192
            - pruned
            - pruned
            - digest mismatch, retry 14
          - - '04:10:03'
            - instance-archive/seg-201
            - pruned
            - pruned
            - digest mismatch, retry 14
          - - '04:10:03'
            - instance-archive/seg-217
            - pruned
            - pruned
            - digest mismatch, retry 14
          - - '04:10:04'
            - instance-archive/seg-218
            - ok
            - ok
            - ok
          - - '04:10:04'
            - contracts/2023-q4
            - queued
            - queued
            - queued behind retries
  - id: trace
    title: Is arch-c really corrupt
    kind: trace
    reveal:
