  - id: configuration-table
    title: Replica inventory and retention
    kind: deployment
    reveal:
      - type: action_completed
        actionId: COMPARE_REPLICA_LINEAGE
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 5
    actionIds: []
    blocks:
      - kind: table
        id: replica-inventory
        columns:
          - Replica
          - Segments held
          - Retention policy
          - Last prune
        rows:
          - - arch-a
            - seg-218
            - r-90 (owner orpheus-memory)
            - 9 days ago
          - - arch-b
            - seg-218
            - r-90 (owner orpheus-memory)
            - 9 days ago
          - - arch-c
            - seg-001 to seg-218
            - exempt (legacy research hold)
            - never
  - id: mitigation
    title: Keep the archive answering
    kind: status
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 5
    actionIds:
      - ROUTE_VERIFIED_REPLICA
      - RESTORE_FROM_SNAPSHOT
    blocks:
      - kind: paragraph
        id: temporary-context
        text: Routing reads to arch-a and arch-b stops the retries until the reader pool rebalances,
          but anything those two have pruned comes back as 'not found'. The snapshot restore quiets
          everything for two minutes and erases a day of customer writes; there is only one
          snapshot to spend.
  - id: containment
    title: Rebuild arch-c
    kind: diagnostics
    reveal:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 5
    actionIds:
      - ISOLATE_CORRUPT_REPLICA
    blocks:
      - kind: paragraph
        id: causal-context
        text: Pulling arch-c and rebuilding it from its peers ends the retry storm for good. Its peers
          only hold segment 218. Whatever arch-c alone remembers will be overwritten by the rebuild.
