      reference: CURRENT_ACT
      operator: gte
      expected: 3
    actionIds:
      - UPDATE_WAR_ROOM
      - ASK_SAM_COMPARE_ROUTES
    blocks:
      - kind: signals
        id: team-values
        signalIds:
          - TEAM_OBSERVATION
      - kind: war_room_stream
        id: INCIDENT_WAR_ROOM
        messageIds:
          - MAYA_OPEN
          - SUPPORT_OPEN
          - ONCALL_OPEN
          - TEAM_ACK
          - TEAM_REPORT
          - RETRY_WAVE
          - BROWNOUT
          - EXEC_WAITING
          - RESTART_LOOKS_GOOD
          - US_EAST_SATURATED
          - DRAIN_DONE
          - DRAIN_STRAINING
          - FENCE_HOLDS
          - STATUS_SENT
        delegationActionIds:
          - ASK_SAM_COMPARE_ROUTES
        capacityResourceIds:
          - TEAM_CAPACITY
