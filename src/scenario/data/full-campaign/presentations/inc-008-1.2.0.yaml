  - id: mitigation
    title: Buy time
    kind: status
    reveal:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 3
    actionIds:
      - RESTART_ROUTE_CONTROLLER
      - DRAIN_EDGE_B
    blocks:
      - kind: paragraph
        id: temporary-context
        text: Priya's restart cleared the March flapping in two minutes, and it is ready to go. A
          restarted controller has to boot from something, though. Draining edge-b breaks the loop
          for sure, but every EU customer then waits on edge-a alone.
  - id: containment
    title: Fence the route generations
    kind: diagnostics
    reveal:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    campaignReveal:
      type: compare
      reference: CURRENT_ACT
      operator: gte
      expected: 3
    actionIds:
      - RECONCILE_ROUTE_GENERATIONS
    blocks:
      - kind: paragraph
        id: causal-context
        text: Edges stop accepting any generation without a commit record and fall back to r81.
          Two minutes of careful rollout across the fleet, and controller-b can publish all it
          likes.
  - id: team
    title: War Room
    kind: war_room
    reveal:
      - type: resource
        resourceId: CUSTOMER_IMPACT
        operator: gte
        value: 0
    campaignReveal:
