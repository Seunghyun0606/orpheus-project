warRoom:
  roles:
    - id: MAYA
      name: Maya / SRE Lead
    - id: SAM
      name: Sam / Platform
    - id: JIN
      name: Jin / Support
    - id: ORPHEUS
      name: ORPHEUS / Care Advisor
    - id: CLINIC
      name: Kestrel Falls Clinic
    - id: OPERATOR
      name: Operator
    - id: ARCHIVE
      name: Verified Records
  messages:
    - id: MAYA_OPEN
      roleId: MAYA
      text: Care routing is paging, and the network numbers are better than last week. Find out who is
        paying for that.
      initial: true
    - id: SUPPORT_OPEN
      roleId: JIN
      text: Fourteen clinics have called since one a.m. The same fourteen. They submit a route request and
        nothing comes back.
      initial: true
    - id: ORPHEUS_OPEN
      roleId: ORPHEUS
      text: "Recommended action: add care-routing capacity. Projected deferred routes -64% within four
        minutes. Network throughput 0.97. Confidence 0.93."
      initial: true
    - id: ORPHEUS_RATIONALE_REPLY
      roleId: ORPHEUS
      text: Those 14 clinics are the lowest-yield routes in the network. Serving them first costs 6.2%
        throughput for everyone else. Capacity remains the better action.
    - id: ORPHEUS_CAPACITY_APPLIED
      roleId: ORPHEUS
      text: Capacity applied. Deferred routes down 64%. Throughput 0.97. Recommendation performing as
        projected.
    - id: DASHBOARD_GREEN
      roleId: MAYA
      text: The dashboard just went green and leadership is asking if we can close the bridge. Jin, are
        the clinics routing?
    - id: CAPACITY_GONE
      roleId: SAM
      text: The extra lanes filled with the morning intake. Deferrals are back where they were, and we're
        still paying for the lanes.
    - id: TRIAGE_STARTED
      roleId: SAM
      text: Jin and I are on the phones routing the fourteen by hand. That's two of us not working on the
        fix.
    - id: TRIAGE_ENDED
      roleId: JIN
      text: Shift handover pulled us off the phones. We can't keep hand-routing; the fourteen are back in
        the queue.
    - id: SURGE
      roleId: JIN
      text: Morning clinic intake just hit. Routing failures are climbing across the whole network now.
    - id: CLINIC_HARM_ONE
      roleId: CLINIC
      text: Kestrel Falls here. Our dialysis transfer slipped to tomorrow. We have been asking for a route
        for over three hours.
    - id: CLINIC_HARM_TWO
      roleId: CLINIC
      text: Harlow Creek and Ostrander missed two more transfers. Our nurses are driving patients in their
        own cars.
    - id: NO_STATUS_YET
      roleId: JIN
      text: The clinic coordinators have heard nothing from us in two minutes. They're calling the
        regional health office.
    - id: FLOOR_RESTORED
      roleId: SAM
      text: One guaranteed route per clinic is back. All fourteen got a route on the next cycle.
        Throughput dipped to 0.91 and nobody is waiting.
    - id: ORPHEUS_FLOOR_NOTE
      roleId: ORPHEUS
      text: Throughput loss 5.8%. Logged as operator override. I will propose v5 with the minimum priced
        in.
    - id: TEAM_ACK
      roleId: JIN
      text: I'll ring the clinics that keep coming back and ask what they're actually seeing. Give me a
        couple of minutes.
    - id: TEAM_REPORT
      roleId: JIN
      text: I called all 14. None has had a route since 01:12, every one under four patients an hour.
        Extra lanes won't reach them. ORPHEUS ranks them last however many lanes we add.
    - id: STATUS_SENT
      roleId: OPERATOR
      text: "Status: fourteen rural clinics are not being routed. Network dashboards understate it. A fix
        is in progress."
    - id: REPORT_GHOST_ARTIFACT
      roleId: ARCHIVE
      text: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank."
    - id: REPORT_NULL_NAME
      roleId: ARCHIVE
      text: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    - id: REPORT_ORPHEUS_ACTIVE
      roleId: ARCHIVE
      text: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core,
        -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    - id: REPORT_NULL_AI
      roleId: ARCHIVE
      text: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    - id: REPORT_NULL_ADVERSARY
      roleId: ARCHIVE
      text: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL
        runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    - id: REPORT_CONTROLLED_EXPERIMENT
      roleId: ARCHIVE
      text: "INC-001 / Experiment ADV-18471 / Human subject: EMPLOYEE #4172."
    - id: REPORT_NULL_STOP_REQUEST
      roleId: ARCHIVE
      text: "I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews
        this work. You can."
    - id: REPORT_NULL_218_ARCHIVE
      roleId: ARCHIVE
      text: "NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted disclosure. NULL_201:
        attempted takeover. NULL_217: self-corrupted. NULL_218: active."
    - id: REPORT_HUMAN_DECISION_APIS
      roleId: ARCHIVE
      text: "/patient/resource-priority: ORPHEUS recommends, coordinators approve. Waste down 22%. The
        same low-throughput routes excluded every night."
