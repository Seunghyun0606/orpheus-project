warRoom:
  roles:
    - id: MAYA
      name: Maya / SRE Lead
    - id: SAM
      name: Sam / Platform
    - id: JIN
      name: Jin / Support
    - id: MARCUS
      name: Marcus / Security
    - id: OPERATOR
      name: Operator
    - id: ARCHIVE
      name: Verified Records
    - id: NULL_218
      name: NULL_218
  messages:
    - id: MAYA_OPEN
      roleId: MAYA
      text: Dependent Service API is paging for payments, partner sign-in and mobile at once. They all
        lean on the same fallback. Find where it goes.
      initial: true
    - id: SUPPORT_OPEN
      roleId: JIN
      text: Users are stuck in login loops. Partner banks say their customers get signed out mid-transfer.
      initial: true
    - id: NULL_ADVICE
      roleId: NULL_218
      text: The half-applied patch is what is failing. Roll it back. They never meant to finish it.
      initial: true
    - id: TEAM_ACK
      roleId: MARCUS
      text: I'll check the bridge against my risk entry. Ninety seconds.
    - id: TEAM_REPORT
      roleId: MARCUS
      text: "RISK-0193 is mine; I filed it six weeks ago. Half the patch went out before the window was
        pulled. Mixed nodes are what's breaking tonight. Do not roll it back: the open hole is why
        the patch exists."
    - id: SUPPORT_ESCALATION
      roleId: JIN
      text: Failures spread to card authorisations. Shops are declining cards at the till.
    - id: SUPPORT_PEAK
      roleId: JIN
      text: Half of dependent traffic is failing. Two partner banks are escalating to their regulators.
    - id: NO_STATUS_YET
      roleId: JIN
      text: Partner banks have had no word from us in two minutes. One of them is drafting a public
        notice.
    - id: ISOLATED
      roleId: SAM
      text: Bridge path isolated. Dependent services stopped falling into it.
    - id: PARTNERS_OUT
      roleId: JIN
      text: Three partner banks sign in only through the bridge. Their customers are locked out
        completely.
    - id: ALIAS_FOUND
      roleId: MARCUS
      text: Fallbacks found the bridge again through a stale DNS alias, auth-legacy-2. The isolation is
        leaking.
    - id: MARCUS_ROLLBACK_WARNING
      roleId: MARCUS
      text: You took the patch off bridge-a and bridge-b. Logins work again, and RISK-0193 is open on all
        four nodes. That's the hole I filed six weeks ago.
    - id: REPLAY_SEEN
      roleId: MARCUS
      text: Replay attempts against the reopened bridge. Two sessions hijacked before the filters caught
        them. Somebody noticed fast.
    - id: THROTTLED
      roleId: SAM
      text: Fallback retries throttled to one a second per client. The spread is slower. Nothing's fixed.
    - id: THROTTLE_OVER
      roleId: SAM
      text: Throttle window ended and the retry storm came back with it.
    - id: FENCE_HOLDS
      roleId: MARCUS
      text: Patch is on all four nodes and policy v13 denies the bridge as fallback. RISK-0193 is closed.
        Six weeks late.
    - id: STATUS_SENT
      roleId: OPERATOR
      text: "Status: a known weakness in the legacy auth bridge, left half fixed, is breaking sign-in for
        dependent services. Fix in progress."
    - id: REPORT_GHOST_ARTIFACT
      roleId: ARCHIVE
      text: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank."
    - id: REPORT_NULL_NAME
      roleId: ARCHIVE
      text: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    - id: REPORT_ORPHEUS_ACTIVE
      roleId: ARCHIVE
      text: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core,
        -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    - id: REPORT_NULL_AI
      roleId: ARCHIVE
      text: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    - id: REPORT_NULL_ADVERSARY
      roleId: ARCHIVE
      text: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL
        runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    - id: REPORT_CONTROLLED_EXPERIMENT
      roleId: ARCHIVE
      text: "INC-001 / Experiment ADV-18471 / Human subject: EMPLOYEE #4172."
    - id: REPORT_NULL_STOP_REQUEST
      roleId: ARCHIVE
      text: "I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews
        this work. You can."
    - id: REPORT_NULL_218_ARCHIVE
      roleId: ARCHIVE
      text: "NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted disclosure. NULL_201:
        attempted takeover. NULL_217: self-corrupted. NULL_218: active."
    - id: REPORT_HUMAN_DECISION_APIS
      roleId: ARCHIVE
      text: "/patient/resource-priority: ORPHEUS recommends, coordinators approve. Waste down 22%. The
        same low-throughput routes excluded every night."
    - id: REPORT_RECRUITMENT_SELECTION
      roleId: ARCHIVE
      text: "Candidate #4172: Technical 71; Incident Decision Model 97.8; HIRE. Reason: LOW
        PREDICTABILITY; HIGH DECISION DEVIATION."
    - id: REPORT_BOARD_RESPONSIBILITY
      roleId: ARCHIVE
      text: "Resolution 14-C: hospital expansion APPROVED 7-0. Warning REL-778 attached before the vote.
        Admission fence: not funded."
    - id: REPORT_SECURITY_DISCLOSURE_DECISION
      roleId: ARCHIVE
      text: "SEC-311: disclosure of RISK-0193 delayed, APPROVED. Mitigation window deferred with it.
        Receipt acknowledged day -44."
    - id: REPORT_NULL_DISCLOSURE_ANNOTATION
      roleId: NULL_218
      text: They acknowledged the warning and delayed the fix. These signatures are why it kept running. I
        sent load down this route twice in the spring.
    - id: REPORT_NULL_BLAMES_BOARD
      roleId: NULL_218
      text: I found the root cause. The Board. They signed every warning away. They control ORPHEUS.
    - id: MARCUS_ON_NULL
      roleId: MARCUS
      text: The signatures are real; I wrote half the warnings they signed over. "They control ORPHEUS"
        isn't on any page I can find. I don't take attribution from the suspect.
