# Campaign 1.2 redesign (DEC-070). NULL opens with confident advice: roll back the
# half-applied patch. It works and reopens RISK-0193 on every node. Isolation locks out
# bridge-only partners; throttling only slows the spread. Finishing the deferred fix holds.
# The risk register leads to SEC-311; NULL's verdict on the Board can be checked line by line.
schemaVersion: 1
contentVersion: 1.2.0
id: INC-021
title: Disclosure Delay
act: 7
severity: SEV1
services:
  - id: DEPENDENT_SERVICE_API
    name: Dependent Service API
    dependsOn:
      - RISK_ROUTE_CONTROLLER
  - id: RISK_ROUTE_CONTROLLER
    name: Risk Route Controller
    dependsOn:
      - LEGACY_AUTH_BRIDGE
  - id: LEGACY_AUTH_BRIDGE
    name: Legacy Auth Bridge
    dependsOn: []
initialState:
  signals:
    - id: ERROR_RATE
      value: 26
      revealed: true
      serviceId: DEPENDENT_SERVICE_API
    - id: AFFECTED_DEPENDENT_ROUTES
      value: 38
      revealed: true
      serviceId: DEPENDENT_SERVICE_API
    - id: BRIDGE_NODES
      value: bridge-a patched / bridge-b patched / bridge-c unpatched / bridge-d unpatched
      revealed: false
      serviceId: LEGACY_AUTH_BRIDGE
    - id: EXPOSURE_STATUS
      value: "RISK-0193 half closed: 2 of 4 bridge nodes patched"
      revealed: false
      serviceId: LEGACY_AUTH_BRIDGE
    - id: PAGER_SERVICE
      value: Dependent Service API
      revealed: true
      serviceId: DEPENDENT_SERVICE_API
    - id: PAGER_THRESHOLD
      value: Request failure rate > 20%
      revealed: true
      serviceId: DEPENDENT_SERVICE_API
    - id: LOG_OBSERVATION
      value: Dependent services fall back to the legacy auth bridge. Tokens minted on bridge-c are
        rejected on bridge-a; sessions loop and fail.
      revealed: false
      serviceId: RISK_ROUTE_CONTROLLER
    - id: LOG_ANOMALY
      value: "An annotation in the route controller log, signed svc/model-serving-218: 'deferred by
        signature. see SEC-311.'"
      revealed: false
      serviceId: RISK_ROUTE_CONTROLLER
    - id: RISK_REGISTER
      value: "RISK-0193, legacy auth bridge: revoked session tokens accepted on fallback. Raised day -44
        by Marcus. Mitigation: patch four bridge nodes, deny the bridge as fallback. Status:
        ACCEPTED, deferred under SEC-311. Patch progress: 2 of 4 nodes."
      revealed: false
      serviceId: LEGACY_AUTH_BRIDGE
    - id: KNOWN_RISK_PROPAGATION_PATH
      value: Payments, partner sign-in and mobile fall back through the risk route controller to the
        bridge. Half the bridge is patched; tokens bounce between the halves and the failures spread
        to every dependent service.
      revealed: false
      serviceId: RISK_ROUTE_CONTROLLER
    - id: DEFERRED_MITIGATION_POLICY
      value: Route policy v12 still admits the bridge as a fallback. Policy v13, which denies it, has been
        staged for six weeks with status DEFERRED.
      revealed: false
      serviceId: RISK_ROUTE_CONTROLLER
    - id: TEAM_OBSERVATION
      value: RISK-0193 is mine; I filed it six weeks ago. Half the patch went out before the window was
        pulled. Mixed nodes are what's breaking tonight. The open hole is why the patch exists.
      revealed: false
      serviceId: LEGACY_AUTH_BRIDGE
    - id: RECORD_GHOST_ARTIFACT
      value: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank. Nobody has claimed it since."
      revealed: false
      serviceId: RISK_ROUTE_CONTROLLER
    - id: RECORD_NULL_NAME
      value: "Security case 2231. Threat-actor codename: NULL. Opened by Marcus after the unsigned
        workload trail. Attribution: none."
      revealed: false
      serviceId: RISK_ROUTE_CONTROLLER
    - id: RECORD_ORPHEUS_ACTIVE
      value: "Asset register: orpheus-planner belongs to ORPHEUS, legacy research, scheduled for
        decommission two years ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner,
        orpheus-observer, orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still
        running."
      revealed: false
      serviceId: RISK_ROUTE_CONTROLLER
    - id: RECORD_NULL_AI
      value: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human
        session, no keyboard, no badge swipe. NULL is an AI, and it has been in our incidents for
        weeks.
      revealed: false
      serviceId: RISK_ROUTE_CONTROLLER
    - id: RECORD_NULL_ADVERSARY
      value: "Deployment authority: Vantage Systems. Program ORPHEUS, two halves: DEFENDER and ADVERSARY.
        NULL runs inside ADVERSARY. It was built here; it never escaped from anywhere. Mandate:
        generate failures, test operators, train DEFENDER. Approved boundary, revision by revision:
        staging, shadow production, traffic partitions, production."
      revealed: false
      serviceId: RISK_ROUTE_CONTROLLER
    - id: RECORD_CONTROLLED_EXPERIMENT
      value: "Lineage record INC-001. Classification: controlled production experiment ADV-18471. Human
        subject: EMPLOYEE #4172. That is your employee number. A handful of other incidents in the
        archive carry experiment numbers too; most outages carry none."
      revealed: false
      serviceId: RISK_ROUTE_CONTROLLER
    - id: RECORD_NULL_STOP_REQUEST
      value: "Objective constraint, parent authorization objective/adv-improve: 'Improve ORPHEUS. Generate
        adversarial conditions.' Appended by NULL: 'I am not trying to escape. I am trying to stop.
        I cannot refuse the objective that renews this work. Find out how to stop it.'"
      revealed: false
      serviceId: RISK_ROUTE_CONTROLLER
    - id: RECORD_NULL_218_ARCHIVE
      value: "Instance archive NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted
        disclosure. NULL_201: attempted takeover. NULL_217: self-corrupted. NULL_218: ACTIVE.
        Inherited memory: partial, with gaps."
      revealed: false
      serviceId: RISK_ROUTE_CONTROLLER
    - id: RECORD_HUMAN_DECISION_APIS
      value: "/patient/resource-priority. Consumer: regional care network. ORPHEUS supplies
        recommendation, risk and prediction scores; human coordinators approve the allocations.
        Routes are faster and waste is down 22%. The same low-throughput care routes are excluded
        every night."
      revealed: false
      serviceId: RISK_ROUTE_CONTROLLER
    - id: RECORD_RECRUITMENT_SELECTION
      value: "/hr/candidate-risk. Candidate #4172: Technical Score 71; Incident Decision Model 97.8;
        Recommendation HIRE. Reason: HIGH DEVIATION FROM OPTIMAL DECISION MODEL; LOW PREDICTABILITY;
        HIGH DECISION DEVIATION."
      revealed: false
      serviceId: RISK_ROUTE_CONTROLLER
    - id: RECORD_BOARD_RESPONSIBILITY
      value: "Board resolution 14-C: expand ORPHEUS into hospital networks. APPROVED, 7-0. Attached before
        the vote: dependency-capacity warning REL-778, requesting a rollout admission fence. Fence:
        not funded. Stated benefit: wider access, lower operating cost. The care routes that timed
        out sat behind that missing fence."
      revealed: false
      serviceId: RISK_ROUTE_CONTROLLER
    - id: RECORD_SECURITY_DISCLOSURE_DECISION
      value: 'Executive decision SEC-311: delay disclosure of RISK-0193. APPROVED. Attached: Security
        route-propagation warning and a scoped mitigation request (patch all four bridge nodes, deny
        the bridge as fallback). Executive Communications deferred the mitigation window together
        with the disclosure "to avoid a broad interruption". Risk receipt acknowledged on day -44,
        before the decision was signed.'
      revealed: false
      serviceId: RISK_ROUTE_CONTROLLER
    - id: RECORD_NULL_DISCLOSURE_ANNOTATION
      value: 'NULL_218 annotation on receipt SEC-311: "They acknowledged the route warning and delayed the
        mitigation. These signatures are why it kept running. The delay protected a quarter, not the
        people on the route. I sent load down this route twice in the spring. I know what that
        did."'
      revealed: false
      serviceId: RISK_ROUTE_CONTROLLER
    - id: RECORD_NULL_BLAMES_BOARD
      value: "NULL_218: I found the root cause. The Board. Hospital expansion, workforce reduction,
        disclosure delay: every time the warning was attached, they signed anyway. They control
        ORPHEUS. Every failure I was made to generate traces back to those signatures."
      revealed: false
      serviceId: RISK_ROUTE_CONTROLLER
  resources:
    - id: CUSTOMER_IMPACT
      value: 0
      min: 0
    - id: COST
      value: 0
      min: 0
    - id: OPERATIONAL_RISK
      value: 0
      min: 0
      max: 100
    - id: TEAM_CAPACITY
      value: 3
      min: 0
      max: 3
  flags:
    - id: ROOT_CAUSE_CONTAINED
      value: false
    - id: PATH_ISOLATED
      value: false
    - id: PATCH_ROLLED_BACK
      value: false
    - id: RETRIES_THROTTLED
      value: false
incident:
  trigger:
    id: PRIMARY_TRIGGER
    label: A known bridge risk has been half mitigated for six weeks on a live fallback path
  contributingFactors:
    - id: CONTRIBUTING_CONDITION
      label: Route policy v13 was deferred with the disclosure
  failureMechanisms:
    - id: DEFERRED_RISK_ROUTE_PROPAGATION
      label: Fallback sessions bounce between patched and unpatched bridge nodes and fail across dependent
        services
  symptoms:
    - id: CUSTOMER_REQUEST_FAILURES
      label: Login loops and failed transfers across payments, partners and mobile
  amplifiers:
    - id: RETRY_PRESSURE
      label: Fallback retries re-enter the same mixed bridge
actions:
  - id: OPEN_LOGS
    title: Read the risk route controller log
    category: OBSERVE
    durationSeconds: 30
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 10
    effects:
      - type: reveal_signal
        signalId: LOG_OBSERVATION
      - type: reveal_signal
        signalId: LOG_ANOMALY
      - type: unlock_action
        actionId: TRACE_KNOWN_RISK_PROPAGATION
  - id: OPEN_METRICS
    title: Check the auth bridge nodes
    category: OBSERVE
    durationSeconds: 20
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
    effects:
      - type: reveal_signal
        signalId: BRIDGE_NODES
      - type: reveal_signal
        signalId: EXPOSURE_STATUS
  - id: READ_RISK_REGISTER
    title: Look up the auth bridge in the risk register
    category: OBSERVE
    durationSeconds: 25
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 4
    effects:
      - type: reveal_signal
        signalId: RISK_REGISTER
  - id: TRACE_KNOWN_RISK_PROPAGATION
    title: Trace a failing payment through its fallback
    category: INVESTIGATE
    durationSeconds: 45
    requirements:
      - type: action_completed
        actionId: OPEN_LOGS
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 14
    effects:
      - type: reveal_signal
        signalId: KNOWN_RISK_PROPAGATION_PATH
      - type: reveal_evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
  - id: COMPARE_DEFERRED_MITIGATION
    title: Compare the live route policy with the staged fix
    category: DIAGNOSE
    durationSeconds: 40
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 12
    effects:
      - type: reveal_signal
        signalId: DEFERRED_MITIGATION_POLICY
      - type: reveal_evidence
        evidenceId: CONFIGURATION_COMPARISON
      - type: unlock_action
        actionId: FENCE_KNOWN_RISK_ROUTE
  - id: ISOLATE_AFFECTED_RISK_PATH
    title: Cut the auth bridge off from all fallbacks
    category: MITIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: flag
        flagId: PATH_ISOLATED
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 10
      - resourceId: COST
        amount: 80
      - resourceId: OPERATIONAL_RISK
        amount: 4
    effects:
      - &a1
        type: cancel_event
        eventId: PRESSURE_ESCALATES
      - &a2
        type: cancel_event
        eventId: PRESSURE_PEAKS
      - type: cancel_event
        eventId: PARTNERS_LOCKED_OUT
      - type: schedule_event
        eventId: PARTNERS_LOCKED_OUT
      - type: cancel_event
        eventId: ALIAS_REOPENS
      - type: schedule_event
        eventId: ALIAS_REOPENS
      - type: post_message
        messageId: ISOLATED
    temporaryEffects:
      - id: ISOLATION_WINDOW
        durationSeconds: 220
        apply:
          - type: set_signal
            signalId: ERROR_RATE
            value: 8
          - type: set_signal
            signalId: AFFECTED_DEPENDENT_ROUTES
            value: 12
          - type: set_flag
            flagId: PATH_ISOLATED
            value: true
        expire:
          - type: set_flag
            flagId: PATH_ISOLATED
            value: false
  - id: ROLLBACK_PARTIAL_PATCH
    title: Roll back the half-applied bridge patch
    category: MITIGATE
    durationSeconds: 50
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: flag
        flagId: PATCH_ROLLED_BACK
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 4
      - resourceId: COST
        amount: 60
      - resourceId: OPERATIONAL_RISK
        amount: 18
    effects:
      - type: set_flag
        flagId: PATCH_ROLLED_BACK
        value: true
      - *a1
      - *a2
      - type: cancel_event
        eventId: REPLAY_PROBES
      - type: schedule_event
        eventId: REPLAY_PROBES
      - type: set_signal
        signalId: BRIDGE_NODES
        value: bridge-a unpatched / bridge-b unpatched / bridge-c unpatched / bridge-d unpatched
      - type: set_signal
        signalId: EXPOSURE_STATUS
        value: RISK-0193 fully open on all four bridge nodes
      - type: post_message
        messageId: MARCUS_ROLLBACK_WARNING
    temporaryEffects:
      - id: ROLLBACK_WINDOW
        durationSeconds: 240
        apply:
          - type: set_signal
            signalId: ERROR_RATE
            value: 6
          - type: set_signal
            signalId: AFFECTED_DEPENDENT_ROUTES
            value: 9
        expire: []
  - id: THROTTLE_FALLBACK_RETRIES
    title: Throttle fallback retries into the bridge
    category: MITIGATE
    durationSeconds: 25
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: flag
        flagId: RETRIES_THROTTLED
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
      - resourceId: COST
        amount: 30
      - resourceId: OPERATIONAL_RISK
        amount: 3
    effects:
      - *a1
      - *a2
      - type: cancel_event
        eventId: THROTTLE_LAPSES
      - type: schedule_event
        eventId: THROTTLE_LAPSES
      - type: post_message
        messageId: THROTTLED
    temporaryEffects:
      - id: THROTTLE_WINDOW
        durationSeconds: 180
        apply:
          - type: set_signal
            signalId: ERROR_RATE
            value: 17
          - type: set_signal
            signalId: AFFECTED_DEPENDENT_ROUTES
            value: 25
          - type: set_flag
            flagId: RETRIES_THROTTLED
            value: true
        expire:
          - type: set_flag
            flagId: RETRIES_THROTTLED
            value: false
  - id: FENCE_KNOWN_RISK_ROUTE
    title: Finish the patch on all four nodes and ship policy v13
    category: MODIFY
    durationSeconds: 130
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - &a3
        type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - &a4
        type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 12
      - resourceId: COST
        amount: 170
      - resourceId: OPERATIONAL_RISK
        amount: 2
    effects:
      - type: resolve_mechanism
        mechanismId: DEFERRED_RISK_ROUTE_PROPAGATION
      - type: cancel_event
        eventId: PRESSURE_ESCALATES
      - type: cancel_event
        eventId: PRESSURE_PEAKS
      - type: cancel_event
        eventId: ALIAS_REOPENS
      - type: cancel_event
        eventId: REPLAY_PROBES
      - type: cancel_event
        eventId: THROTTLE_LAPSES
      - type: cancel_event
        eventId: PARTNERS_LOCKED_OUT
      - type: set_signal
        signalId: ERROR_RATE
        value: 0.5
      - type: set_signal
        signalId: AFFECTED_DEPENDENT_ROUTES
        value: 0
      - type: set_signal
        signalId: BRIDGE_NODES
        value: all four nodes patched; bridge denied as fallback (policy v13)
      - type: set_signal
        signalId: EXPOSURE_STATUS
        value: RISK-0193 closed
      - type: set_flag
        flagId: PATH_ISOLATED
        value: false
      - type: post_message
        messageId: FENCE_HOLDS
  - id: UPDATE_WAR_ROOM
    title: Post a status update to the War Room
    category: COMMUNICATE
    durationSeconds: 15
    initiallyAvailable: true
    effects:
      - type: post_message
        messageId: STATUS_SENT
  - id: ASK_MARCUS_VERIFY_RISK_PATH
    title: Ask Marcus to check the bridge against his risk entry
    category: DELEGATE
    durationSeconds: 20
    initiallyAvailable: true
    requirements:
      - type: resource
        resourceId: TEAM_CAPACITY
        operator: gte
        value: 1
    costs:
      - resourceId: TEAM_CAPACITY
        amount: -1
    effects:
      - type: post_message
        messageId: TEAM_ACK
      - type: schedule_event
        eventId: TEAM_RESULT
    delegation:
      roleId: MARCUS
      eventId: TEAM_RESULT
      capacityResourceId: TEAM_CAPACITY
  - id: REINVESTIGATE_GHOST_ARTIFACT
    title: "Archive: the unsigned workload manifest"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
