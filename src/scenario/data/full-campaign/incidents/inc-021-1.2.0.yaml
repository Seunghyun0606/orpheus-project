events:
  - id: ARM_PRESSURE_TIMELINE
    type: conditional
    conditions:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    once: true
    effects:
      - type: schedule_event
        eventId: PRESSURE_ESCALATES
      - type: schedule_event
        eventId: PARTNERS_UNINFORMED
  - id: PRESSURE_ESCALATES
    type: timer
    delaySeconds: 60
    targetServiceId: DEPENDENT_SERVICE_API
    cancellationConditions:
