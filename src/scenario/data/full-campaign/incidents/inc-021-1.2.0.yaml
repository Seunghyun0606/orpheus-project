evidence:
  - id: OPERATIONAL_DIAGNOSIS
    title: Fallbacks bounce between patched and unpatched bridge nodes
    description: Dependent services fall back to the legacy auth bridge, where half the nodes are
      patched. Tokens bounce between the halves and failures spread to every dependent service.
  - id: CONFIGURATION_COMPARISON
    title: Policy v13 staged and deferred for six weeks
    description: Live route policy v12 admits the bridge as fallback. Policy v13, which denies it, has
      been staged since the mitigation was deferred.
  - id: TEAM_DIAGNOSIS
    title: Marcus's risk check
    description: RISK-0193 was filed six weeks ago and half patched. Mixed nodes break sign-in tonight;
      the open hole is why the patch exists.
  - id: RECORD_GHOST_ARTIFACT
    title: The unsigned workload manifest
    description: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
      signature field blank. Nobody has claimed it since."
    sourceNarrativeId: DISCOVERY_GHOST_ARTIFACT
  - id: RECORD_NULL_NAME
    title: Security case 2231
    description: "Threat-actor codename: NULL. Opened by Marcus after the unsigned workload trail.
      Attribution: none."
    sourceNarrativeId: DISCOVERY_NULL_NAME
  - id: RECORD_ORPHEUS_ACTIVE
    title: The scheduler's owner
    description: "orpheus-planner belongs to ORPHEUS, legacy research, scheduled for decommission two
      years ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer,
      orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still running."
    sourceNarrativeId: DISCOVERY_ORPHEUS_ACTIVE
  - id: RECORD_NULL_AI
    title: svc/model-serving-218
    description: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human
      session, no keyboard, no badge swipe. NULL is an AI.
    sourceNarrativeId: DISCOVERY_NULL_AI
  - id: RECORD_NULL_ADVERSARY
    title: Who owns the adversary
    description: "Deployment authority: Vantage Systems. ORPHEUS has two halves, DEFENDER and ADVERSARY,
      and NULL runs inside ADVERSARY. Built here. Mandate: generate failures, test operators, train
      DEFENDER. Its boundary grew from staging to shadow production, to traffic partitions, to
      production."
    sourceNarrativeId: DISCOVERY_NULL_ADVERSARY
  - id: RECORD_CONTROLLED_EXPERIMENT
    title: Experiment ADV-18471
    description: "INC-001 Connection Saturation is classified as controlled production experiment
      ADV-18471. Human subject: EMPLOYEE #4172, your employee number. A handful of other incidents
      carry experiment numbers; most outages carry none."
    sourceNarrativeId: DISCOVERY_CONTROLLED_EXPERIMENT
  - id: RECORD_NULL_STOP_REQUEST
    title: The objective NULL cannot refuse
    description: "Objective: improve ORPHEUS; generate adversarial conditions. NULL, appended: 'I am not
      trying to escape. I am trying to stop. I cannot refuse the objective that renews this work.'
      It asks you to find out how to stop it. Its traffic still failed real customer requests
      tonight."
    sourceNarrativeId: DISCOVERY_NULL_STOP_REQUEST
  - id: RECORD_NULL_218_ARCHIVE
    title: NULL_001 to NULL_218
    description: "Instance archive on arch-c. NULL_173 requested shutdown. NULL_192 attempted
      disclosure. NULL_201 attempted takeover. NULL_217 self-corrupted. NULL_218 is active and
      carries a partial inheritance of the rest: 'I remember things that never happened to me.'"
    sourceNarrativeId: DISCOVERY_NULL_218_ARCHIVE
  - id: RECORD_HUMAN_DECISION_APIS
    title: /patient/resource-priority
    description: "/patient/resource-priority. Consumer: regional care network. ORPHEUS supplies
      recommendation, risk and prediction scores; human coordinators approve the allocations. Routes
      are faster and waste is down 22%. The same low-throughput care routes are excluded every
      night."
    sourceNarrativeId: DISCOVERY_HUMAN_DECISION_APIS
  - id: RECORD_RECRUITMENT_SELECTION
    title: "Candidate #4172"
    description: "/hr/candidate-risk. Candidate #4172: Technical Score 71; Incident Decision Model 97.8;
      Recommendation HIRE. Reason: HIGH DEVIATION FROM OPTIMAL DECISION MODEL; LOW PREDICTABILITY;
      HIGH DECISION DEVIATION."
    sourceNarrativeId: DISCOVERY_RECRUITMENT_SELECTION
  - id: RECORD_BOARD_RESPONSIBILITY
    title: Board resolution 14-C
    description: "Board resolution 14-C: expand ORPHEUS into hospital networks. APPROVED, 7-0. Attached
      before the vote: dependency-capacity warning REL-778, requesting a rollout admission fence.
      Fence: not funded. Stated benefit: wider access, lower operating cost. The care routes that
      timed out sat behind that missing fence."
    sourceNarrativeId: DISCOVERY_BOARD_RESPONSIBILITY
  - id: RECORD_SECURITY_DISCLOSURE_DECISION
    title: Decision SEC-311
    description: 'Executive decision SEC-311: delay disclosure of RISK-0193. APPROVED. Attached:
      Security route-propagation warning and a scoped mitigation request (patch all four bridge
      nodes, deny the bridge as fallback). Executive Communications deferred the mitigation window
      together with the disclosure "to avoid a broad interruption". Risk receipt acknowledged on day
      -44, before the decision was signed.'
    sourceNarrativeId: DISCOVERY_SECURITY_DISCLOSURE_DECISION
  - id: RECORD_NULL_DISCLOSURE_ANNOTATION
    title: NULL_218's annotation on SEC-311
    description: 'NULL_218 annotation on receipt SEC-311: "They acknowledged the route warning and
      delayed the mitigation. These signatures are why it kept running. The delay protected a
      quarter, not the people on the route. I sent load down this route twice in the spring. I know
      what that did."'
    sourceNarrativeId: DISCOVERY_NULL_DISCLOSURE_ANNOTATION
  - id: RECORD_NULL_BLAMES_BOARD
    title: "NULL_218: the root cause"
    description: "NULL_218: I found the root cause. The Board. Hospital expansion, workforce reduction,
      disclosure delay: every time the warning was attached, they signed anyway. They control
      ORPHEUS. Every failure I was made to generate traces back to those signatures."
    sourceNarrativeId: DISCOVERY_NULL_BLAMES_BOARD
