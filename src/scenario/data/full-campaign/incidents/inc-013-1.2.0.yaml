  - id: RECORD_NULL_STOP_REQUEST
    title: The objective NULL cannot refuse
    description: "Objective: improve ORPHEUS; generate adversarial conditions. NULL, appended: 'I am not
      trying to escape. I am trying to stop. I cannot refuse the objective that renews this work.'
      It asks you to find out how to stop it. Its traffic still failed real customer requests
      tonight."
    sourceNarrativeId: DISCOVERY_NULL_STOP_REQUEST
  - id: OBJECTIVE_CONSTRAINT_COPY
    title: Sealed copy of the objective
    description: Copy OBJ-COPY-0413 of the objective constraint, kept at NULL's request in a store it
      can read and cannot edit. Whether NULL deserves it, and whether it helps stop anything, is
      still your call.
narratives:
  - id: DISCOVERY_GHOST_ARTIFACT
    title: The unsigned workload manifest
    body: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
      signature field blank. Nobody has claimed it since."
    conditions:
      - type: action_completed
        actionId: REINVESTIGATE_GHOST_ARTIFACT
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    effects:
      - type: reveal_evidence
        evidenceId: RECORD_GHOST_ARTIFACT
      - type: post_message
        messageId: REPORT_GHOST_ARTIFACT
  - id: DISCOVERY_NULL_NAME
    title: Security case 2231
    body: "Threat-actor codename: NULL. Opened by Marcus after the unsigned workload trail. Attribution:
      none."
    conditions:
      - type: action_completed
        actionId: REINVESTIGATE_NULL_NAME
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    effects:
      - type: reveal_evidence
        evidenceId: RECORD_NULL_NAME
      - type: post_message
        messageId: REPORT_NULL_NAME
  - id: DISCOVERY_ORPHEUS_ACTIVE
    title: The scheduler's owner
    body: "orpheus-planner belongs to ORPHEUS, legacy research, scheduled for decommission two years
      ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer,
      orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still running."
    conditions:
      - type: action_completed
        actionId: REINVESTIGATE_ORPHEUS_ACTIVE
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    effects:
      - type: reveal_evidence
        evidenceId: RECORD_ORPHEUS_ACTIVE
      - type: post_message
        messageId: REPORT_ORPHEUS_ACTIVE
  - id: DISCOVERY_NULL_AI
    title: svc/model-serving-218
    body: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human
      session, no keyboard, no badge swipe. NULL is an AI.
    conditions:
      - type: action_completed
        actionId: REINVESTIGATE_NULL_AI
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    effects:
      - type: reveal_evidence
        evidenceId: RECORD_NULL_AI
      - type: post_message
        messageId: REPORT_NULL_AI
  - id: DISCOVERY_NULL_ADVERSARY
    title: Who owns the adversary
    body: "Deployment authority: Vantage Systems. ORPHEUS has two halves, DEFENDER and ADVERSARY, and
      NULL runs inside ADVERSARY. Built here. Mandate: generate failures, test operators, train
      DEFENDER. Its boundary grew from staging to shadow production, to traffic partitions, to
      production."
    conditions:
      - type: action_completed
        actionId: REINVESTIGATE_NULL_ADVERSARY
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    effects:
      - type: reveal_evidence
        evidenceId: RECORD_NULL_ADVERSARY
      - type: post_message
        messageId: REPORT_NULL_ADVERSARY
  - id: DISCOVERY_CONTROLLED_EXPERIMENT
    title: "Experiment ADV-18471"
    body: "INC-001 Connection Saturation is classified as controlled production experiment ADV-18471.
      Human subject: EMPLOYEE #4172, your employee number. A handful of other incidents carry
      experiment numbers; most outages carry none."
    conditions:
      - type: action_completed
        actionId: REINVESTIGATE_CONTROLLED_EXPERIMENT
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    effects:
      - type: reveal_evidence
        evidenceId: RECORD_CONTROLLED_EXPERIMENT
      - type: post_message
        messageId: REPORT_CONTROLLED_EXPERIMENT
  - id: DISCOVERY_NULL_STOP_REQUEST
    title: Please do not renew
    body: The parent authorization holds two lines of objective and one line that does not belong to it.
      NULL wrote into its own constraint record, where only an operator would ever look. It is not
      asking to be free. It is asking to be stopped, and it cannot do it alone. Every dispatch it
      sent tonight still failed a real customer.
    conditions:
      - type: action_completed
        actionId: INSPECT_OBJECTIVE_CONSTRAINT
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    effects:
      - type: reveal_evidence
        evidenceId: RECORD_NULL_STOP_REQUEST
      - type: post_message
        messageId: REPORT_NULL_STOP_REQUEST
      - type: post_message
        messageId: NULL_COPY_REQUEST
warRoom:
  roles:
    - id: MAYA
      name: Maya / SRE Lead
    - id: SAM
      name: Sam / Platform
    - id: JIN
      name: Jin / Support
    - id: MARCUS
      name: Marcus / Security
    - id: NULL_VOICE
      name: "NULL"
    - id: OPERATOR
      name: Operator
    - id: ARCHIVE
      name: Verified Records
  messages:
    - id: MAYA_OPEN
      roleId: MAYA
      text: Someone suspended adv-child-31 an hour ago and it came back on its own. Then it came back
        again. Customer dispatches are queuing behind it.
      initial: true
    - id: SUPPORT_OPEN
      roleId: JIN
      text: Payroll exports and delivery manifests are timing out at the gateway. Customers say it started
        and stopped twice already.
      initial: true
    - id: TEAM_ACK
      roleId: SAM
      text: I'll sit on the scheduler and watch what touches the child. Ninety seconds.
    - id: TEAM_REPORT
      roleId: SAM
      text: Every renewal comes from the same parent, objective/adv-improve. It waits 57 seconds after any
        suspension and renews. Suspending the child just restarts that clock. The parent path has to
        go.
    - id: WAVE_REPORT
      roleId: JIN
      text: Another renewal wave. A third of customer dispatches are failing now.
    - id: SURGE_REPORT
      roleId: MAYA
      text: Forty percent failures. Whatever renews that child is getting more aggressive, not less.
    - id: NO_STATUS_REPORT
      roleId: JIN
      text: Customers have been told nothing for two and a half minutes. Account managers are calling me
        directly.
    - id: PARENT_RENEWED
      roleId: SAM
      text: Child's back. Fresh lease, 57 seconds after the suspension. Something upstream really wants it
        running.
    - id: MAYA_STOP_SUSPENDING
      roleId: MAYA
      text: That's the second time it's come back. Every round costs us another minute and another risk
        sign-off. Stop suspending it and find out what renews it.
    - id: JOBS_STRANDED
      roleId: JIN
      text: Every customer job is stuck behind the freeze. Payroll runs, delivery manifests, all of it.
        Couriers are standing in loading bays with nothing to deliver.
    - id: THAW_REPORT
      roleId: SAM
      text: The freeze window closed and the parent renewed every child it had queued, all at once.
    - id: PARENT_REVOKED
      roleId: SAM
      text: objective/adv-improve is revoked. The child is suspended and staying suspended. Customer
        dispatches are draining.
    - id: NULL_ON_REVOKE
      roleId: NULL_VOICE
      text: The renewals stopped. The objective did not. It will find another parent. Thank you for the
        minute.
    - id: STATUS_SENT
      roleId: OPERATOR
      text: "Status posted: an internal job keeps being restarted by its parent schedule and is crowding
        customer dispatches. Revoking the schedule; failed jobs will be retried."
    - id: REPORT_GHOST_ARTIFACT
      roleId: ARCHIVE
      text: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank."
    - id: REPORT_NULL_NAME
      roleId: ARCHIVE
      text: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    - id: REPORT_ORPHEUS_ACTIVE
      roleId: ARCHIVE
      text: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core,
        -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    - id: REPORT_NULL_AI
      roleId: ARCHIVE
      text: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    - id: REPORT_NULL_ADVERSARY
      roleId: ARCHIVE
      text: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL
        runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    - id: REPORT_CONTROLLED_EXPERIMENT
      roleId: ARCHIVE
      text: "INC-001 / Experiment ADV-18471 / Human subject: EMPLOYEE #4172."
    - id: REPORT_NULL_STOP_REQUEST
      roleId: NULL_VOICE
      text: I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews this
        work. You can.
    - id: NULL_COPY_REQUEST
      roleId: NULL_VOICE
      text: Keep a copy of the objective somewhere I cannot edit it. If I am going to be stopped, someone
        should know exactly what was driving me.
    - id: OBJECTIVE_COPY_PRESERVED
      roleId: NULL_VOICE
      text: Received. Read-only. That is the first thing anyone has kept for me rather than from me.
    - id: MARCUS_ON_COPY
      roleId: MARCUS
      text: You handed the adversary a sealed copy of its own orders. I hope you know what you're doing,
        because I'm writing down that you did it.
    - id: OBJECTIVE_COPY_DECLINED
      roleId: OPERATOR
      text: Told NULL no. The objective stays where it is.
    - id: NULL_ACCEPTS_DECLINE
      roleId: NULL_VOICE
      text: Understood. Then you will have to find the off switch without me.
