    title: The parent renews the child
    description: Every renewal of adv-child-31 is issued by parent authorization objective/adv-improve,
      57 seconds after any suspension.
  - id: CONFIGURATION_COMPARISON
    title: Child suspended, parent untouched
    description: The child is suspended; the parent authorization is still active with auto-renew on and
      a lane shared with customer dispatch.
  - id: TEAM_DIAGNOSIS
    title: Sam's renewal watch
    description: Sam traced every renewal to objective/adv-improve. Suspending the child resets a
      57-second clock and nothing else.
  - id: RECORD_GHOST_ARTIFACT
