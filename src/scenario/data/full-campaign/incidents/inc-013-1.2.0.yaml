    sourceNarrativeId: DISCOVERY_NULL_ADVERSARY
  - id: RECORD_CONTROLLED_EXPERIMENT
    title: Experiment ADV-18471
    description: "INC-001 Connection Saturation is classified as controlled production experiment
      ADV-18471. Human subject: EMPLOYEE #4172, your employee number. A handful of other incidents
