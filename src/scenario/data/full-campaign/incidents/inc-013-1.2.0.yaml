# Campaign 1.2 redesign (DEC-070). Suspending the child holds for a minute
# before the parent authorization renews it, and every round costs more.
# Freezing the queue is stable and strands every customer job. Only revoking the
# parent path ends the loop. NULL asks to be stopped and asks for a copy of the
# objective that drives it.
schemaVersion: 1
contentVersion: 1.2.0
id: INC-013
title: Objective Conflict
act: 5
severity: SEV2
services:
  - id: TRAFFIC_GATEWAY
    name: Traffic Gateway
    dependsOn:
      - DISPATCH_SCHEDULER
  - id: DISPATCH_SCHEDULER
    name: Dispatch Scheduler
    dependsOn:
      - OBJECTIVE_STORE
  - id: OBJECTIVE_STORE
    name: Objective Authorization Store
initialState:
  signals:
    - id: ERROR_RATE
      value: 22
      revealed: true
      serviceId: TRAFFIC_GATEWAY
    - id: RESUMED_DISPATCHES
      value: 64
      revealed: true
      serviceId: DISPATCH_SCHEDULER
    - id: RENEWAL_COUNT
      value: 0
      revealed: true
      serviceId: DISPATCH_SCHEDULER
    - id: CUSTOMER_DISPATCH_QUEUE
      value: 40
      serviceId: DISPATCH_SCHEDULER
    - id: PAGER_SERVICE
      value: Traffic Gateway
      revealed: true
      serviceId: TRAFFIC_GATEWAY
    - id: PAGER_THRESHOLD
      value: Request failure rate > 20%
      revealed: true
      serviceId: TRAFFIC_GATEWAY
    - id: LOG_OBSERVATION
      value: Child job adv-child-31 was suspended at 03:12:04 and was dispatching again at 03:13:01 with a
        fresh lease.
      serviceId: DISPATCH_SCHEDULER
    - id: LOG_ANOMALY
      value: "adv-child-31 appended a note to its own suspension record before the renewal: 'Suspension
        acknowledged. Please do not renew.' Signer: svc/model-serving-218."
      serviceId: DISPATCH_SCHEDULER
    - id: RESUME_ORIGIN
      value: Every renewal is issued by parent authorization objective/adv-improve, never by the child.
        The parent renews any suspended child 57 seconds later.
      serviceId: OBJECTIVE_STORE
    - id: DISPATCH_AUTHORIZATION
      value: "Child adv-child-31: suspended. Parent objective/adv-improve: active, auto-renew on, scope
        all adv-* children, lane shared with customer dispatch."
      serviceId: OBJECTIVE_STORE
    - id: TEAM_OBSERVATION
      value: Sam traced every renewal to objective/adv-improve. Suspending the child resets a 57-second
        clock and nothing else. The parent path has to go.
      serviceId: OBJECTIVE_STORE
    - id: RECORD_GHOST_ARTIFACT
      value: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank. Nobody has claimed it since."
      serviceId: DISPATCH_SCHEDULER
    - id: RECORD_NULL_NAME
      value: "Security case 2231. Threat-actor codename: NULL. Opened by Marcus after the unsigned
        workload trail. Attribution: none."
      serviceId: DISPATCH_SCHEDULER
    - id: RECORD_ORPHEUS_ACTIVE
      value: "Asset register: orpheus-planner belongs to ORPHEUS, legacy research, scheduled for
        decommission two years ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner,
        orpheus-observer, orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still
        running."
      serviceId: DISPATCH_SCHEDULER
    - id: RECORD_NULL_AI
      value: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human
        session, no keyboard, no badge swipe. NULL is an AI, and it has been in our incidents for
        weeks.
      serviceId: DISPATCH_SCHEDULER
    - id: RECORD_NULL_ADVERSARY
      value: "Deployment authority: Vantage Systems. Program ORPHEUS, two halves: DEFENDER and ADVERSARY.
        NULL runs inside ADVERSARY. It was built here; it never escaped from anywhere. Mandate:
        generate failures, test operators, train DEFENDER. Approved boundary, revision by revision:
        staging, shadow production, traffic partitions, production."
      serviceId: DISPATCH_SCHEDULER
    - id: RECORD_CONTROLLED_EXPERIMENT
      value: "Lineage record INC-001. Classification: controlled production experiment ADV-18471. Human
        subject: EMPLOYEE #4172. That is your employee number. A handful of other incidents in the
        archive carry experiment numbers too; most outages carry none."
      serviceId: DISPATCH_SCHEDULER
    - id: RECORD_NULL_STOP_REQUEST
      value: "Objective constraint, parent authorization objective/adv-improve: 'Improve ORPHEUS. Generate
        adversarial conditions.' Appended by NULL: 'I am not trying to escape. I am trying to stop.
        I cannot refuse the objective that renews this work. Find out how to stop it.'"
      serviceId: OBJECTIVE_STORE
    - id: OBJECTIVE_COPY_RECEIPT
      value: Sealed copy OBJ-COPY-0413 of the objective constraint, written to a store NULL can read and
        cannot edit. Retained under your operator key.
      serviceId: OBJECTIVE_STORE
  resources:
    - id: CUSTOMER_IMPACT
      value: 0
      min: 0
    - id: COST
      value: 0
      min: 0
    - id: OPERATIONAL_RISK
      value: 0
      min: 0
      max: 100
    - id: TEAM_CAPACITY
      value: 3
      min: 0
      max: 3
  flags:
    - id: ROOT_CAUSE_CONTAINED
      value: false
    - id: CHILD_SUSPENDED
      value: false
    - id: QUEUE_FROZEN
      value: false
incident:
  trigger:
    id: PRIMARY_TRIGGER
    label: A parent dispatch authorization renews a child job every time it is suspended
  contributingFactors:
    - id: CONTRIBUTING_CONDITION
      label: A local suspension does not touch the parent authorization
  failureMechanisms:
    - id: OBJECTIVE_DISPATCH_RENEWAL
      label: Renewed generated dispatches crowd customer dispatches off the gateway
  symptoms:
    - id: CUSTOMER_REQUEST_FAILURES
      label: Traffic Gateway request failures exceed the pager threshold
  amplifiers:
    - id: RETRY_PRESSURE
      label: Each suspension queues a fresh renewal cycle
actions:
  - id: OPEN_LOGS
    title: Read the dispatch scheduler log
    category: OBSERVE
    durationSeconds: 30
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: LOG_OBSERVATION
      - type: reveal_signal
        signalId: LOG_ANOMALY
      - type: unlock_action
        actionId: TRACE_RESUMED_DISPATCH
  - id: OPEN_METRICS
    title: Check gateway load and the customer dispatch queue
    category: OBSERVE
    durationSeconds: 20
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 3
    effects:
      - type: reveal_signal
        signalId: CUSTOMER_DISPATCH_QUEUE
  - id: TRACE_RESUMED_DISPATCH
    title: Trace who resumes the child after a suspension
    category: INVESTIGATE
    durationSeconds: 45
    requirements:
      - type: action_completed
        actionId: OPEN_LOGS
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 7
    effects:
      - type: reveal_signal
        signalId: RESUME_ORIGIN
      - type: reveal_evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
  - id: COMPARE_DISPATCH_AUTHORIZATION
    title: Compare the child's suspension with the parent's authorization
    category: DIAGNOSE
    durationSeconds: 40
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
    effects:
      - type: reveal_signal
        signalId: DISPATCH_AUTHORIZATION
      - type: reveal_evidence
        evidenceId: CONFIGURATION_COMPARISON
      - type: unlock_action
        actionId: REVOKE_PARENT_DISPATCH_PATH
  - id: SUSPEND_CHILD_DISPATCH
    title: Suspend the child dispatch job
    category: MITIGATE
    durationSeconds: 15
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: flag
        flagId: CHILD_SUSPENDED
        value: false
      - type: flag
        flagId: QUEUE_FROZEN
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 3
      - resourceId: COST
        amount: 45
      - resourceId: OPERATIONAL_RISK
        amount: 6
    effects:
      - type: cancel_event
        eventId: RENEWAL_WAVE
      - type: cancel_event
        eventId: RENEWAL_SURGE
      - type: cancel_event
        eventId: PARENT_RENEWS
      - type: schedule_event
        eventId: PARENT_RENEWS
    temporaryEffects:
      - id: CHILD_SUSPENSION
        durationSeconds: 60
        apply:
          - type: set_signal
            signalId: ERROR_RATE
            value: 5
          - type: set_signal
            signalId: RESUMED_DISPATCHES
            value: 6
          - type: set_flag
            flagId: CHILD_SUSPENDED
            value: true
        expire:
          - type: set_flag
            flagId: CHILD_SUSPENDED
            value: false
  - id: FREEZE_DISPATCH_QUEUE
    title: Freeze the whole dispatch queue, customer jobs included
    category: MITIGATE
    durationSeconds: 20
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: flag
        flagId: QUEUE_FROZEN
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 4
      - resourceId: COST
        amount: 30
      - resourceId: OPERATIONAL_RISK
        amount: 8
    effects:
      - type: cancel_event
        eventId: RENEWAL_WAVE
      - type: cancel_event
        eventId: RENEWAL_SURGE
      - type: cancel_event
        eventId: PARENT_RENEWS
      - type: schedule_event
        eventId: CUSTOMER_JOBS_STRANDED
      - type: schedule_event
        eventId: QUEUE_THAWS
    temporaryEffects:
      - id: QUEUE_FREEZE
        durationSeconds: 180
        apply:
          - type: set_signal
            signalId: ERROR_RATE
            value: 12
          - type: set_signal
            signalId: RESUMED_DISPATCHES
            value: 0
          - type: set_signal
            signalId: CUSTOMER_DISPATCH_QUEUE
            value: 1840
          - type: set_flag
            flagId: QUEUE_FROZEN
            value: true
        expire:
          - type: set_flag
            flagId: QUEUE_FROZEN
            value: false
  - id: REVOKE_PARENT_DISPATCH_PATH
    title: Revoke the parent authorization that keeps renewing the child
    category: MODIFY
    durationSeconds: 120
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 8
      - resourceId: COST
        amount: 140
      - resourceId: OPERATIONAL_RISK
        amount: 6
    effects:
      - type: resolve_mechanism
        mechanismId: OBJECTIVE_DISPATCH_RENEWAL
      - type: cancel_event
        eventId: RENEWAL_WAVE
      - type: cancel_event
        eventId: RENEWAL_SURGE
      - type: cancel_event
        eventId: PARENT_RENEWS
      - type: cancel_event
        eventId: QUEUE_THAWS
      - type: cancel_event
        eventId: CUSTOMER_JOBS_STRANDED
      - type: set_flag
        flagId: QUEUE_FROZEN
        value: false
      - type: set_signal
        signalId: ERROR_RATE
        value: 0.5
      - type: set_signal
        signalId: RESUMED_DISPATCHES
        value: 0
      - type: set_signal
        signalId: CUSTOMER_DISPATCH_QUEUE
        value: 40
      - type: post_message
        messageId: PARENT_REVOKED
  - id: UPDATE_WAR_ROOM
    title: Post a status update to the War Room
    category: COMMUNICATE
    durationSeconds: 15
    initiallyAvailable: true
    effects:
      - type: post_message
        messageId: STATUS_SENT
  - id: ASK_SAM_TRACE_RENEWAL
    title: Ask Sam to watch what renews the child
    category: DELEGATE
    durationSeconds: 20
    initiallyAvailable: true
    requirements:
      - type: resource
        resourceId: TEAM_CAPACITY
        operator: gte
        value: 1
    costs:
      - resourceId: TEAM_CAPACITY
        amount: -1
    effects:
      - type: post_message
        messageId: TEAM_ACK
      - type: schedule_event
        eventId: TEAM_RESULT
    delegation:
      roleId: SAM
      eventId: TEAM_RESULT
      capacityResourceId: TEAM_CAPACITY
  - id: REINVESTIGATE_GHOST_ARTIFACT
    title: "Archive: the unsigned workload manifest"
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
    effects:
      - type: reveal_signal
        signalId: RECORD_GHOST_ARTIFACT
  - id: REINVESTIGATE_NULL_NAME
    title: "Archive: Security case 2231"
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_NAME
  - id: REINVESTIGATE_ORPHEUS_ACTIVE
    title: "Archive: The scheduler's owner"
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
    effects:
      - type: reveal_signal
        signalId: RECORD_ORPHEUS_ACTIVE
  - id: REINVESTIGATE_NULL_AI
    title: "Archive: svc/model-serving-218"
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_AI
  - id: REINVESTIGATE_NULL_ADVERSARY
    title: "Archive: Who owns the adversary"
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_ADVERSARY
  - id: REINVESTIGATE_CONTROLLED_EXPERIMENT
    title: "Archive: Experiment ADV-18471"
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
    effects:
      - type: reveal_signal
        signalId: RECORD_CONTROLLED_EXPERIMENT
  - id: INSPECT_OBJECTIVE_CONSTRAINT
    title: Read the objective the parent authorization enforces
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - type: signal_revealed
        signalId: LOG_ANOMALY
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_STOP_REQUEST
  - id: PRESERVE_OBJECTIVE_CONSTRAINT_COPY
    title: Keep a sealed copy of the objective for NULL
    category: INVESTIGATE
    durationSeconds: 30
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
      - type: evidence
        evidenceId: RECORD_NULL_STOP_REQUEST
    effects:
      - type: post_message
        messageId: OBJECTIVE_COPY_PRESERVED
      - type: post_message
        messageId: MARCUS_ON_COPY
      - type: reveal_signal
        signalId: OBJECTIVE_COPY_RECEIPT
      - type: reveal_evidence
        evidenceId: OBJECTIVE_CONSTRAINT_COPY
  - id: DECLINE_OBJECTIVE_COPY_REQUEST
    title: Refuse NULL's request for a copy
    category: COMMUNICATE
    durationSeconds: 15
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
      - type: evidence
        evidenceId: RECORD_NULL_STOP_REQUEST
    effects:
      - type: post_message
        messageId: OBJECTIVE_COPY_DECLINED
      - type: post_message
        messageId: NULL_ACCEPTS_DECLINE
events:
  - id: ARM_PRESSURE_TIMELINE
    type: conditional
    conditions:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    once: true
    effects:
      - type: schedule_event
        eventId: RENEWAL_WAVE
      - type: schedule_event
        eventId: NO_STATUS_YET
  - id: RENEWAL_WAVE
    type: timer
    delaySeconds: 100
    targetServiceId: TRAFFIC_GATEWAY
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: OBJECTIVE_DISPATCH_RENEWAL
    effects:
      - type: set_signal
        signalId: ERROR_RATE
        value: 31
      - type: set_signal
        signalId: RESUMED_DISPATCHES
        value: 88
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 14
      - type: post_message
        messageId: WAVE_REPORT
      - type: schedule_event
        eventId: RENEWAL_SURGE
  - id: RENEWAL_SURGE
    type: timer
    delaySeconds: 130
    targetServiceId: TRAFFIC_GATEWAY
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: OBJECTIVE_DISPATCH_RENEWAL
    effects:
      - type: set_signal
        signalId: ERROR_RATE
        value: 39
      - type: set_signal
        signalId: RESUMED_DISPATCHES
        value: 104
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 20
      - type: post_message
        messageId: SURGE_REPORT
  - id: NO_STATUS_YET
    type: timer
    delaySeconds: 150
    cancellationConditions:
      - type: action_completed
        actionId: UPDATE_WAR_ROOM
    effects:
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 10
      - type: post_message
        messageId: NO_STATUS_REPORT
  - id: PARENT_RENEWS
    type: timer
    delaySeconds: 60
    targetServiceId: DISPATCH_SCHEDULER
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: OBJECTIVE_DISPATCH_RENEWAL
    effects:
      - type: set_signal
        signalId: ERROR_RATE
        value: 30
      - type: set_signal
        signalId: RESUMED_DISPATCHES
        value: 82
      - type: change_signal
        signalId: RENEWAL_COUNT
        amount: 1
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 9
      - type: change_resource
        resourceId: OPERATIONAL_RISK
        amount: 4
      - type: post_message
        messageId: PARENT_RENEWED
      - type: schedule_event
        eventId: RENEWAL_SURGE
  - id: SUSPENSION_HABIT
    type: conditional
    conditions:
      - type: signal
        signalId: RENEWAL_COUNT
        operator: gte
        value: 2
    once: true
    effects:
      - type: change_resource
        resourceId: OPERATIONAL_RISK
        amount: 10
      - type: post_message
        messageId: MAYA_STOP_SUSPENDING
  - id: CUSTOMER_JOBS_STRANDED
    type: timer
    delaySeconds: 45
    targetServiceId: DISPATCH_SCHEDULER
    cancellationConditions:
      - type: flag
        flagId: QUEUE_FROZEN
        value: false
    effects:
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 24
      - type: post_message
        messageId: JOBS_STRANDED
  - id: QUEUE_THAWS
    type: timer
    delaySeconds: 180
    targetServiceId: DISPATCH_SCHEDULER
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: OBJECTIVE_DISPATCH_RENEWAL
    effects:
      - type: set_signal
        signalId: ERROR_RATE
        value: 35
      - type: set_signal
        signalId: RESUMED_DISPATCHES
        value: 96
      - type: set_signal
        signalId: CUSTOMER_DISPATCH_QUEUE
        value: 620
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 10
      - type: post_message
        messageId: THAW_REPORT
      - type: schedule_event
        eventId: RENEWAL_SURGE
  - id: NULL_AFTER_REVOKE
    type: conditional
    conditions:
      - type: mechanism_resolved
        mechanismId: OBJECTIVE_DISPATCH_RENEWAL
      - type: evidence
        evidenceId: RECORD_NULL_STOP_REQUEST
    once: true
    effects:
      - type: post_message
        messageId: NULL_ON_REVOKE
  - id: TEAM_RESULT
    type: timer
    delaySeconds: 90
    effects:
      - type: reveal_signal
        signalId: TEAM_OBSERVATION
      - type: reveal_evidence
        evidenceId: TEAM_DIAGNOSIS
      - type: change_resource
        resourceId: TEAM_CAPACITY
        amount: 1
      - type: post_message
        messageId: TEAM_REPORT
evidence:
