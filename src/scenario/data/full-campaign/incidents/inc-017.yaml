incident:
  trigger:
    id: PRIMARY_TRIGGER
    label: A candidate-risk rollout publishes before ranking cache consistency
  contributingFactors:
    - id: CONTRIBUTING_CONDITION
      label: Reader and model generations are not fenced together
  failureMechanisms:
    - id: CANDIDATE_RANKING_CACHE_DIVERGENCE
      label: Candidate ranking depends on which stale cache answers
  symptoms:
    - id: CUSTOMER_REQUEST_FAILURES
      label: Recruitment API request failures exceed the pager threshold
  amplifiers:
    - id: RETRY_PRESSURE
      label: Client retries alternate between inconsistent ranking generations
