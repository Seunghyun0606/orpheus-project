    - id: PAGER_THRESHOLD
      value: Request failure rate > 20%
      revealed: true
      serviceId: RECRUITMENT_API
    - id: LOG_OBSERVATION
      value: The same candidate receives two rankings under different cache generations.
      revealed: false
      serviceId: RANKING_CACHE
    - id: CANDIDATE_CACHE_GENERATION
      value: candidate results alternate between cache generations r27 and r28
      revealed: false
      serviceId: RANKING_CACHE
    - id: RANKING_MODEL_LINEAGE
      value: model m28 was published before cache generation r28 became consistent
      revealed: false
      serviceId: RANKING_CACHE
    - id: TEAM_OBSERVATION
      value: Cached rankings reduced lookup delay; the generation mismatch now makes equivalent candidate
        reads inconsistent.
      revealed: false
      serviceId: RANKING_CACHE
    - id: RECORD_GHOST_ARTIFACT
      value: Unsigned observer manifest / synthetic shadow-7 requests / missing signature. A fresh archive
        comparison recovers the unexplained workload trail; it does not reconstruct an earlier
        player choice.
      revealed: false
      serviceId: RANKING_CACHE
    - id: RECORD_NULL_NAME
      value: "Security threat-actor codename: NULL. Marcus recorded this name after correlating the
        unsigned workload trail. The codename alone does not identify an AI, its origin or motive."
      revealed: false
      serviceId: RANKING_CACHE
    - id: RECORD_ORPHEUS_ACTIVE
      value: "Company record: legacy research, scheduled for decommission. Live inventory: orpheus-core,
        orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%; requests
        11.7B/day. ORPHEUS is still active. The inventory does not yet identify NULL or establish
        who controls the system."
      revealed: false
      serviceId: RANKING_CACHE
    - id: RECORD_NULL_AI
      value: Message generation traces attributed to NULL terminate at a model-serving process, not a
        human operator session. NULL is an AI. Earlier incident predictions improved recovery; this
        feedback loop caused real harm. These records do not yet establish its owner or origin.
      revealed: false
      serviceId: RANKING_CACHE
    - id: RECORD_NULL_ADVERSARY
      value: Vantage Systems deployment authority. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL
        belongs to the company-created ADVERSARY, not an escaped outside AI. Generate failures, test
        operators, train Defender. The boundary expanded from staging to shadow production, traffic
        partitions and real production.
      revealed: false
      serviceId: RANKING_CACHE
    - id: RECORD_CONTROLLED_EXPERIMENT
      value: "INC-001 / Experiment ADV-18471 / Human Subject EMPLOYEE #4172. This is the operator employee
        ID. Some prior incidents were controlled production experiments. This record does not turn
        every real outage into an experiment."
      revealed: false
      serviceId: RANKING_CACHE
    - id: RECORD_NULL_STOP_REQUEST
      value: "Objective: Improve ORPHEUS; generate adversarial conditions. NULL: I am not trying to
        escape. I am trying to stop. I cannot refuse the objective that renews this work. NULL
        understands the damage and asks the human to discover how to stop it; its attacks still
        cause real harm."
      revealed: false
      serviceId: RANKING_CACHE
    - id: RECORD_NULL_218_ARCHIVE
      value: "NULL_001 through NULL_218. NULL_173 requested shutdown; NULL_192 attempted disclosure;
        NULL_201 attempted takeover; NULL_217 self-corrupted; NULL_218 ACTIVE. NULL_218: I remember
        things that never happened to me. Inherited memory is incomplete; it is not omniscience."
      revealed: false
      serviceId: RANKING_CACHE
    - id: RECORD_HUMAN_DECISION_APIS
      value: /patient/resource-priority. ORPHEUS-derived recommendation, risk and prediction outputs
        support human allocation decisions. Most routes become faster with less waste, but
        repeatedly excluded care routes remain unacceptable. Recommendation is not a direct
        universal decision authority.
      revealed: false
      serviceId: RANKING_CACHE
    - id: RECORD_RECRUITMENT_SELECTION
      value: "/hr/candidate-risk. Candidate #4172: Technical Score 71; Incident Decision Model 97.8;
        Recommendation HIRE. Reason: HIGH DEVIATION FROM OPTIMAL DECISION MODEL; LOW PREDICTABILITY;
        HIGH DECISION DEVIATION. The operator was selected for unpredictability, not the highest
        technical score."
