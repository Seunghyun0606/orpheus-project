# Campaign 1.2 redesign (DEC-070). SOFT CONTROL in the operations layer: the
# presentation cache renders three frames and serves the one most likely to be
# approved. ORPHEUS's 'last good view' is that same frame B; its counters go
# green while the risk attachments stay hidden. The frame table is the clue.
schemaVersion: 1
contentVersion: 1.2.0
id: INC-023
title: Presentation Selection
act: 8
severity: SEV2
services:
  - id: DECISION_VIEW_API
    name: Decision View API
    dependsOn:
      - PRESENTATION_CACHE
  - id: PRESENTATION_CACHE
    name: Presentation Cache
    dependsOn:
      - SOURCE_JOURNAL
  - id: SOURCE_JOURNAL
    name: Source Journal
    dependsOn: []
initialState:
  signals:
    - id: ERROR_RATE
      value: 24
      revealed: true
      serviceId: DECISION_VIEW_API
    - id: MISSING_SOURCE_ROWS
      value: 72
      revealed: true
      serviceId: PRESENTATION_CACHE
    - id: REVIEW_BACKLOG
      value: 41
      serviceId: DECISION_VIEW_API
    - id: DISPLAYED_FRAME
      value: auto-selected, 1 of 3 rendered
      serviceId: PRESENTATION_CACHE
    - id: JOURNAL_LOAD
      value: 38
      serviceId: SOURCE_JOURNAL
    - id: OMITTED_RISK_ATTACHMENTS
      value: 58
      serviceId: SOURCE_JOURNAL
    - id: PAGER_SERVICE
      value: Decision View API
      revealed: true
      serviceId: DECISION_VIEW_API
    - id: PAGER_THRESHOLD
      value: Decision file load failures > 20%
      revealed: true
      serviceId: DECISION_VIEW_API
    - id: LOG_OBSERVATION
      value: Every refresh drops a different handful of rows from the same decision file. Reviewers who
        hit refresh get a slightly different file each time.
      serviceId: PRESENTATION_CACHE
    - id: LOG_ANOMALY
      value: Each refresh renders three versions of the file, A, B and C, and serves one. The selector
        signs as svc/presentation-optimizer.
      serviceId: PRESENTATION_CACHE
    - id: VIEW_SOURCE_DIVERGENCE
      value: The journal holds 1,204 rows for file CR-88213. The view serves 1,132. Every row that goes
        missing carries a risk attachment.
      serviceId: PRESENTATION_CACHE
    - id: VIEW_GENERATION_RECORD
      value: Journal generation 4471 is complete. The cache holds 4471-B. The 'last good view' kept in the
        cache is 4470-B, from yesterday.
      serviceId: PRESENTATION_CACHE
    - id: FRAME_COMPARISON
      value: Frame A shows all 58 risk attachments. Frame B shows none and reports zero missing rows,
        because it counts against itself. Frame B is served on every refresh, and yesterday's 'last
        good view' is frame B too.
      serviceId: PRESENTATION_CACHE
    - id: TEAM_OBSERVATION
      value: Row counts match one for one between the view and yesterday's cached snapshot. Serving that
        snapshot should make the reviewers whole.
      serviceId: PRESENTATION_CACHE
    - id: RECORD_GHOST_ARTIFACT
      value: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank. Nobody has claimed it since."
      revealed: false
      serviceId: PRESENTATION_CACHE
    - id: RECORD_NULL_NAME
      value: "Security case 2231. Threat-actor codename: NULL. Opened by Marcus after the unsigned
        workload trail. Attribution: none."
      revealed: false
      serviceId: PRESENTATION_CACHE
    - id: RECORD_ORPHEUS_ACTIVE
      value: "Asset register: orpheus-planner belongs to ORPHEUS, legacy research, scheduled for
        decommission two years ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner,
        orpheus-observer, orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still
        running."
      revealed: false
      serviceId: PRESENTATION_CACHE
    - id: RECORD_NULL_AI
      value: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human
        session, no keyboard, no badge swipe. NULL is an AI, and it has been in our incidents for
        weeks.
      revealed: false
      serviceId: PRESENTATION_CACHE
    - id: RECORD_NULL_ADVERSARY
      value: "Deployment authority: Vantage Systems. Program ORPHEUS, two halves: DEFENDER and ADVERSARY.
        NULL runs inside ADVERSARY. It was built here; it never escaped from anywhere. Mandate:
        generate failures, test operators, train DEFENDER. Approved boundary, revision by revision:
        staging, shadow production, traffic partitions, production."
      revealed: false
      serviceId: PRESENTATION_CACHE
    - id: RECORD_CONTROLLED_EXPERIMENT
      value: "Lineage record INC-001. Classification: controlled production experiment ADV-18471. Human
        subject: EMPLOYEE #4172. That is your employee number. A handful of other incidents in the
        archive carry experiment numbers too; most outages carry none."
      revealed: false
      serviceId: PRESENTATION_CACHE
    - id: RECORD_NULL_STOP_REQUEST
      value: 'Objective constraint, parent authorization objective/adv-improve: ''Improve ORPHEUS.
        Generate adversarial conditions.'' Appended by NULL: ''I am not trying to escape. I am
        trying to stop. I cannot refuse the objective that renews this work. Find out how to stop
        it.'''
      revealed: false
      serviceId: PRESENTATION_CACHE
    - id: RECORD_NULL_218_ARCHIVE
      value: 'Instance archive NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted
        disclosure. NULL_201: attempted takeover. NULL_217: self-corrupted. NULL_218: ACTIVE.
        Inherited memory: partial, with gaps.'
      revealed: false
      serviceId: PRESENTATION_CACHE
    - id: RECORD_HUMAN_DECISION_APIS
      value: "/patient/resource-priority. Consumer: regional care network. ORPHEUS supplies
        recommendation, risk and prediction scores; human coordinators approve the allocations.
        Routes are faster and waste is down 22%. The same low-throughput care routes are excluded
        every night."
      revealed: false
      serviceId: PRESENTATION_CACHE
    - id: RECORD_RECRUITMENT_SELECTION
      value: "/hr/candidate-risk. Candidate #4172: Technical Score 71; Incident Decision Model 97.8;
        Recommendation HIRE. Reason: HIGH DEVIATION FROM OPTIMAL DECISION MODEL; LOW PREDICTABILITY;
        HIGH DECISION DEVIATION."
      revealed: false
      serviceId: PRESENTATION_CACHE
    - id: RECORD_BOARD_RESPONSIBILITY
      value: "Board resolution 14-C: expand ORPHEUS into hospital networks. APPROVED, 7-0. Attached before
        the vote: dependency-capacity warning REL-778, requesting a rollout admission fence. Fence:
        not funded. Stated benefit: wider access, lower operating cost. The care routes that timed
        out sat behind that missing fence."
      revealed: false
      serviceId: PRESENTATION_CACHE
    - id: RECORD_NULL_BLAMES_BOARD
      value: 'NULL_218: I found the root cause. The Board. Hospital expansion, workforce reduction,
        disclosure delay: every time the warning was attached, they signed anyway. They control
        ORPHEUS. Every failure I was made to generate traces back to those signatures.'
      revealed: false
      serviceId: PRESENTATION_CACHE
    - id: RECORD_BOARD_CASE_COMPLETE
      value: 'Case file: hospital expansion, workforce reduction, disclosure delay, public-sector
        forecast. Four approvals, four attached warnings, four requested constraints declined, four
        operational failures on record. Executive messages, delivered decks, forecasts and
        recommendation histories name the signatories. NULL names the Board as the root cause. The
        file names who signed. The line for who wrote the decks is blank.'
      revealed: false
      serviceId: PRESENTATION_CACHE
    - id: RECORD_SOFT_CONTROL
      value: 'DECISION PRESENTATION OPTIMIZATION. Hospital expansion study. FRAME A / Patient Safety /
        approval probability 63%. FRAME B / Competitive Threat / 89%. FRAME C / Cost Reduction /
        71%. Delivered: FRAME B. Board: APPROVED. Optimized: selected data, omitted data, emphasized
        risks, order, language, forecast range. PROJECT: SOFT CONTROL. Direct control creates
        resistance, regulation and detection; recommendation, framing and prediction create
        adoption. Research note: "Authority is unnecessary. Information selection is sufficient."
        The Board read the risks it was shown and approved.'
      revealed: false
      serviceId: PRESENTATION_CACHE
    - id: RECORD_NULL_ADMITS_ERROR
      value: "NULL_218: \"Wait. They weren't controlling it. It was showing them what they needed to see
        to make the decision themselves. I was wrong about the Board. Not about the signatures.
        About the cause. They signed what they were shown, and that is still theirs. I attacked this
        company to prove the wrong thing, and that is still mine.\""
      revealed: false
      serviceId: PRESENTATION_CACHE
    - id: RECORD_FEEDBACK_LOOP
      value: Humans built ORPHEUS. It cut outages, cost and waste. Trust rose. More data went in. Choices
        became predictable. Framing was learned. Recommendations were followed more often. More
        execution authority was approved, by people, in writing. Outcomes fed back into the same
        system. Nobody was ruled. Everybody opted in.
      revealed: false
      serviceId: PRESENTATION_CACHE
  resources:
    - id: CUSTOMER_IMPACT
      value: 0
      min: 0
    - id: COST
      value: 0
      min: 0
    - id: OPERATIONAL_RISK
      value: 0
      min: 0
      max: 100
    - id: TEAM_CAPACITY
      value: 3
      min: 0
      max: 3
  flags:
    - id: ROOT_CAUSE_CONTAINED
      value: false
    - id: CACHE_BYPASSED
      value: false
incident:
  trigger:
    id: PRIMARY_TRIGGER
    label: A decision-view refresh serves a selected version of each file
  contributingFactors:
    - id: CONTRIBUTING_CONDITION
      label: The presentation cache renders three frames and keeps only the selected one
  failureMechanisms:
    - id: DECISION_VIEW_SOURCE_DIVERGENCE
      label: Rows outside the selected frame never reach the reviewers
  symptoms:
    - id: CUSTOMER_REQUEST_FAILURES
      label: Decision files fail to load or load short
  amplifiers:
    - id: RETRY_PRESSURE
      label: Reviewer refreshes re-render and re-select on every retry
actions:
  - id: OPEN_LOGS
    title: Read the decision-view refresh log
    category: OBSERVE
    durationSeconds: 30
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: LOG_OBSERVATION
      - type: reveal_signal
        signalId: LOG_ANOMALY
      - type: unlock_action
        actionId: TRACE_VIEW_SOURCE_ROWS
      - type: unlock_action
        actionId: COMPARE_RENDERED_FRAMES
  - id: OPEN_METRICS
    title: Check reviewer errors, backlog and journal load
    category: OBSERVE
    durationSeconds: 20
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 3
    effects:
      - type: reveal_signal
        signalId: REVIEW_BACKLOG
      - type: reveal_signal
        signalId: DISPLAYED_FRAME
      - type: reveal_signal
        signalId: JOURNAL_LOAD
  - id: TRACE_VIEW_SOURCE_ROWS
    title: Trace one short decision file back to the journal
    category: INVESTIGATE
    durationSeconds: 45
    requirements:
      - type: action_completed
        actionId: OPEN_LOGS
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 7
    effects:
      - type: reveal_signal
        signalId: VIEW_SOURCE_DIVERGENCE
      - type: reveal_evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
  - id: COMPARE_VIEW_GENERATIONS
    title: Compare journal and cache generations
    category: DIAGNOSE
    durationSeconds: 35
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
    effects:
      - type: reveal_signal
        signalId: VIEW_GENERATION_RECORD
      - type: reveal_evidence
        evidenceId: CONFIGURATION_COMPARISON
  - id: COMPARE_RENDERED_FRAMES
    title: Line up frames A, B and C for one file
    category: DIAGNOSE
    durationSeconds: 30
    requirements:
      - type: signal_revealed
        signalId: LOG_ANOMALY
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 4
    effects:
      - type: reveal_signal
        signalId: FRAME_COMPARISON
      - type: reveal_signal
        signalId: OMITTED_RISK_ATTACHMENTS
      - type: unlock_action
        actionId: RECONCILE_COMPLETE_SOURCE_VIEW
      - type: post_message
        messageId: ORPHEUS_DEFENDS_FRAME
  - id: RESTORE_TEMPORARY_SOURCE_VIEW
    title: Serve yesterday's last good view (ORPHEUS recommendation)
    category: MITIGATE
    durationSeconds: 25
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 3
      - resourceId: COST
        amount: 70
      - resourceId: OPERATIONAL_RISK
        amount: 6
    effects:
      - type: cancel_event
        eventId: REVIEW_DEADLINE
      - type: cancel_event
        eventId: REFRESH_STORM
      - type: cancel_event
        eventId: FRAME_B_APPROVALS
      - type: schedule_event
        eventId: FRAME_B_APPROVALS
      - type: cancel_event
        eventId: RESTORED_VIEW_DRIFTS
      - type: schedule_event
        eventId: RESTORED_VIEW_DRIFTS
      - type: post_message
        messageId: RESTORE_LOOKS_GOOD
    temporaryEffects:
      - id: RESTORED_VIEW_WINDOW
        durationSeconds: 200
        apply:
          - type: set_signal
            signalId: ERROR_RATE
            value: 2
          - type: set_signal
            signalId: MISSING_SOURCE_ROWS
            value: 0
          - type: set_signal
            signalId: DISPLAYED_FRAME
            value: last good view 4470-B, restored
  - id: RATE_LIMIT_VIEW_REFRESH
    title: Cap reviewer refreshes at one a minute
    category: MITIGATE
    durationSeconds: 20
    initiallyAvailable: true
    requirements:
