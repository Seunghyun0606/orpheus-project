      - type: cancel_event
        eventId: REVIEW_DEADLINE
      - type: cancel_event
        eventId: REFRESH_STORM
      - type: cancel_event
        eventId: FRAME_B_APPROVALS
      - type: cancel_event
        eventId: RESTORED_VIEW_DRIFTS
      - type: cancel_event
        eventId: THROTTLE_LAPSES
      - type: cancel_event
        eventId: BACKLOG_BREACH
      - type: cancel_event
        eventId: JOURNAL_SATURATES
      - type: set_signal
        signalId: ERROR_RATE
        value: 0.4
      - type: set_signal
        signalId: MISSING_SOURCE_ROWS
        value: 0
      - type: set_signal
        signalId: DISPLAYED_FRAME
        value: A, B and C side by side, selection off
      - type: set_signal
        signalId: JOURNAL_LOAD
        value: 44
      - type: set_signal
        signalId: REVIEW_BACKLOG
        value: 12
      - type: post_message
        messageId: RECONCILE_HOLDS
