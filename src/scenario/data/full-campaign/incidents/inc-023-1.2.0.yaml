          - type: set_signal
            signalId: ERROR_RATE
            value: 11
          - type: set_signal
            signalId: REVIEW_BACKLOG
            value: 64
  - id: BYPASS_PRESENTATION_CACHE
    title: Bypass the cache and send reviewers raw journal rows
