    durationSeconds: 35
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: flag
        flagId: CACHE_BYPASSED
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 4
      - resourceId: COST
        amount: 120
      - resourceId: OPERATIONAL_RISK
        amount: 9
    effects:
      - type: set_flag
        flagId: CACHE_BYPASSED
        value: true
      - type: cancel_event
        eventId: REVIEW_DEADLINE
      - type: cancel_event
        eventId: REFRESH_STORM
      - type: reveal_signal
        signalId: OMITTED_RISK_ATTACHMENTS
      - type: set_signal
        signalId: MISSING_SOURCE_ROWS
        value: 0
      - type: set_signal
        signalId: ERROR_RATE
        value: 13
      - type: set_signal
        signalId: JOURNAL_LOAD
        value: 91
      - type: cancel_event
        eventId: JOURNAL_SATURATES
      - type: schedule_event
        eventId: JOURNAL_SATURATES
      - type: post_message
        messageId: BYPASS_RAW_ROWS
  - id: RECONCILE_COMPLETE_SOURCE_VIEW
    title: Render every frame from the complete journal and switch off selection
    category: MODIFY
    durationSeconds: 100
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
