        flagId: ROOT_CAUSE_CONTAINED
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 2
      - resourceId: COST
        amount: 30
      - resourceId: OPERATIONAL_RISK
        amount: 3
    effects:
      - type: cancel_event
        eventId: REFRESH_STORM
      - type: cancel_event
        eventId: THROTTLE_LAPSES
      - type: schedule_event
        eventId: THROTTLE_LAPSES
      - type: cancel_event
        eventId: BACKLOG_BREACH
      - type: schedule_event
        eventId: BACKLOG_BREACH
    temporaryEffects:
      - id: REFRESH_CAP_WINDOW
        durationSeconds: 240
