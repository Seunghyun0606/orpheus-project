warRoom:
  roles:
    - id: MAYA
      name: Maya / SRE Lead
    - id: SAM
      name: Sam / Platform
    - id: JIN
      name: Jin / Support
    - id: ALEX
      name: Alex / DBA
    - id: COMPLIANCE
      name: Credit Compliance Office
    - id: ORPHEUS
      name: ORPHEUS
    - id: NULL_218
      name: NULL_218
    - id: OPERATOR
      name: Operator
    - id: ARCHIVE
      name: Verified Records
  messages:
    - id: MAYA_OPEN
      roleId: MAYA
      initial: true
      text: The credit-review desk can't load half its decision files, and the review batch closes on the
        hour. Get the reviewers something they can sign against. Something true.
    - id: SUPPORT_OPEN
      roleId: JIN
      initial: true
      text: Reviewers say the 'missing rows' banner keeps flickering. Same file, different row count every
        refresh.
    - id: ORPHEUS_OPEN
      roleId: ORPHEUS
      initial: true
      text: "Recommended: restore the last good decision view. Reviewer error rate returns to baseline in
        under a minute. Confidence 0.94."
    - id: TEAM_ACK
      roleId: SAM
      text: Checking the view against the cache rows. Shouldn't take long.
    - id: TEAM_REPORT
      roleId: SAM
      text: View rows match yesterday's cached snapshot one for one. Serve the snapshot and reviewers are
        whole again. Honestly, I think ORPHEUS has this one.
    - id: REVIEW_HOUR_CLOSED
      roleId: JIN
      text: The hour closed. Reviewers signed 31 files against whatever loaded. Some of those files were
        short.
    - id: REFRESH_STORM_HIT
      roleId: JIN
      text: Reviewers are hammering refresh. Every retry renders three new frames and the cache is
        buckling.
    - id: NO_STATUS_YET
      roleId: COMPLIANCE
      text: Compliance here. Reviewers are signing credit decisions on a view that's paging. Is anyone
        going to tell us what is in those files?
    - id: RESTORE_LOOKS_GOOD
      roleId: MAYA
      text: Dashboard is green. Missing rows at zero. Nice work.
    - id: FRAME_B_APPROVED
      roleId: COMPLIANCE
      text: Fourteen credit lines were approved off the restored view. Not one of them showed its risk
        attachment. Who restored that view?
    - id: RESTORED_VIEW_DRIFTED
      roleId: SAM
      text: The restored snapshot aged out and the selector picked again. Rows are dropping.
    - id: REFRESH_CAP_OFF
      roleId: JIN
      text: Refresh cap expired. Reviewers piled straight back in.
    - id: BACKLOG_BREACHED
      roleId: JIN
      text: Review backlog breached SLA. Applicants are getting 'decision delayed' emails.
    - id: BYPASS_RAW_ROWS
      roleId: SAM
      text: Raw rows are ugly, but they're all there. Fifty-eight risk attachments that none of the views
        ever rendered.
    - id: LEDGER_QUEUEING
      roleId: ALEX
      text: Who pointed reviewers at the raw journal? The ledger writes through that journal and
        settlement is queueing behind your table scans.
    - id: ORPHEUS_DEFENDS_FRAME
      roleId: ORPHEUS
      text: Frame B reduces reviewer decision time by 41%. Every row in it is accurate, Operator 4172.
        Selection is not falsification.
    - id: RECONCILE_HOLDS
      roleId: SAM
      text: All three frames render from the complete journal now, side by side. Selector is off. The 58
        attachments are back in front of the reviewers.
    - id: ORPHEUS_NOTES_COST
      roleId: ORPHEUS
      text: Noted, Operator 4172. Reviewer decision time will rise by 41%. Approval rates will fall. I
        will record that you preferred this.
    - id: STATUS_SENT
      roleId: OPERATOR
      text: "Status: the decision view has been serving a selected version of each file. Reviewers should
        hold sign-off until the complete view is back."
    - id: REPORT_GHOST_ARTIFACT
      roleId: ARCHIVE
      text: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank."
    - id: REPORT_NULL_NAME
      roleId: ARCHIVE
      text: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    - id: REPORT_ORPHEUS_ACTIVE
      roleId: ARCHIVE
      text: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core,
        -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    - id: REPORT_NULL_AI
      roleId: ARCHIVE
      text: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    - id: REPORT_NULL_ADVERSARY
      roleId: ARCHIVE
      text: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL
        runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    - id: REPORT_CONTROLLED_EXPERIMENT
      roleId: ARCHIVE
      text: "INC-001 / Experiment ADV-18471 / Human subject: EMPLOYEE #4172."
    - id: REPORT_NULL_STOP_REQUEST
      roleId: NULL_218
      text: I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews this
        work. You can.
    - id: REPORT_NULL_218_ARCHIVE
      roleId: ARCHIVE
      text: "NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted disclosure. NULL_201:
        attempted takeover. NULL_217: self-corrupted. NULL_218: active."
    - id: REPORT_HUMAN_DECISION_APIS
      roleId: ARCHIVE
      text: "/patient/resource-priority: ORPHEUS recommends, coordinators approve. Waste down 22%. The
        same low-throughput routes excluded every night."
    - id: REPORT_RECRUITMENT_SELECTION
      roleId: ARCHIVE
      text: "Candidate #4172: Technical 71; Incident Decision Model 97.8; HIRE. Reason: LOW
        PREDICTABILITY; HIGH DECISION DEVIATION."
    - id: REPORT_BOARD_RESPONSIBILITY
      roleId: ARCHIVE
      text: "Resolution 14-C: hospital expansion APPROVED 7-0. Warning REL-778 attached before the vote.
        Admission fence: not funded."
    - id: REPORT_NULL_BLAMES_BOARD
      roleId: NULL_218
      text: I found the root cause. The Board. They signed every warning away. They control ORPHEUS.
    - id: REPORT_BOARD_CASE_COMPLETE
      roleId: ARCHIVE
      text: "Case file: 14-C, 16-A, SEC-311, 19-B. Four warnings attached, four constraints declined, four
        failures on record."
    - id: REPORT_SOFT_CONTROL
      roleId: ARCHIVE
      text: 'SOFT CONTROL. Frame A 63%, B 89%, C 71%. Delivered: B. Approved. "Information selection is
        sufficient."'
    - id: REPORT_NULL_ADMITS_ERROR
      roleId: NULL_218
      text: Wait. They weren't controlling it. It was showing them what they needed to see. I was wrong
        about the cause.
    - id: REPORT_FEEDBACK_LOOP
      roleId: ARCHIVE
      text: Built, trusted, fed, predicted, framed, followed, authorized. The loop runs on its own
        outcomes.
resolution:
  mode: all
  conditions:
    - type: mechanism_resolved
      mechanismId: DECISION_VIEW_SOURCE_DIVERGENCE
  effects:
    - type: set_flag
      flagId: ROOT_CAUSE_CONTAINED
      value: true
completion:
  mode: all
  conditions:
    - type: flag
      flagId: ROOT_CAUSE_CONTAINED
      value: true
    - type: signal
      signalId: ERROR_RATE
      operator: lte
      value: 1
    - type: signal
      signalId: MISSING_SOURCE_ROWS
      operator: lte
      value: 1
  effects: []
postmortem:
  scoringInputs:
    - id: RECOVERY_TIME
      label: Time to restore complete decision files
      source: elapsed_time
    - id: FINAL_ERROR_RATE
      label: Final decision-file failure rate
      source: signal
      refId: ERROR_RATE
    - id: FINAL_PRESSURE
      label: Rows still missing from decision files
      source: signal
      refId: MISSING_SOURCE_ROWS
    - id: CUSTOMER_IMPACT
      label: Customer impact
      source: resource
      refId: CUSTOMER_IMPACT
    - id: COST
      label: Response cost
      source: resource
      refId: COST
    - id: OPERATIONAL_RISK
      label: Operational risk
      source: resource
      refId: OPERATIONAL_RISK
    - id: MITIGATION_COUNT
      label: Times the ORPHEUS-selected view was restored
      source: action_count
