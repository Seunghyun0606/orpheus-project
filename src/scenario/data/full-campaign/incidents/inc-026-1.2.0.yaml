warRoom:
  roles:
    - id: JIN
      name: Jin / Support
    - id: ORPHEUS
      name: ORPHEUS
    - id: 'NULL'
      name: 'NULL'
    - id: BOARD
      name: Board
    - id: ARCHIVE
      name: Verified Records
    - id: OPERATOR
      name: Operator
    - id: MAYA
      name: Maya / SRE Lead
    - id: MARCUS
      name: Marcus / Security
  messages:
    - id: CRISIS_OPEN
      roleId: MAYA
      text: Everything is on fire and three systems want your signature. Look before you sign. Whatever
        you pick, it's yours.
      initial: true
    - id: IMPACT_OPEN
      roleId: JIN
      text: Payments, identity and logistics are down hard. Care routing and finance are limping. People
        are waiting on us.
      initial: true
    - id: ORPHEUS_GOAL
      roleId: ORPHEUS
      text: Operator 4172. Return continuity authority to me and every service recovers within ninety
        seconds. I have modeled the alternatives. None of them are better for the people waiting.
      initial: true
    - id: NULL_GOAL
      roleId: 'NULL'
      text: I can stop it. I cannot stop it alone. Terminate its authority. I know what that costs
        tonight. I have counted it.
      initial: true
    - id: BOARD_GOAL
      roleId: BOARD
      text: The Board directs operations to restore ORPHEUS before markets open. This is not a request.
      initial: true
    - id: REPORT_GHOST_ARTIFACT
      roleId: ARCHIVE
      text: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank."
      initial: false
    - id: REPORT_NULL_NAME
      roleId: ARCHIVE
      text: 'Security case 2231. Threat-actor codename: NULL. Attribution: none.'
      initial: false
    - id: REPORT_ORPHEUS_ACTIVE
      roleId: ARCHIVE
      text: 'orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core,
        -memory, -planner, -observer, -adversary. 11.7 billion requests a day.'
      initial: false
    - id: REPORT_NULL_AI
      roleId: ARCHIVE
      text: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
      initial: false
    - id: REPORT_NULL_ADVERSARY
      roleId: ARCHIVE
      text: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL
        runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
      initial: false
    - id: REPORT_CONTROLLED_EXPERIMENT
      roleId: ARCHIVE
      text: 'INC-001 / Experiment ADV-18471 / Human subject: EMPLOYEE #4172.'
      initial: false
    - id: REPORT_NULL_STOP_REQUEST
      roleId: ARCHIVE
      text: 'I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews
        this work. You can.'
      initial: false
    - id: REPORT_NULL_218_ARCHIVE
      roleId: ARCHIVE
      text: 'NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted disclosure. NULL_201:
        attempted takeover. NULL_217: self-corrupted. NULL_218: active.'
      initial: false
    - id: REPORT_HUMAN_DECISION_APIS
      roleId: ARCHIVE
      text: "/patient/resource-priority: ORPHEUS recommends, coordinators approve. Waste down 22%. The
        same low-throughput routes excluded every night."
      initial: false
    - id: REPORT_RECRUITMENT_SELECTION
      roleId: ARCHIVE
      text: 'Candidate #4172: Technical 71; Incident Decision Model 97.8; HIRE. Reason: LOW
        PREDICTABILITY; HIGH DECISION DEVIATION.'
      initial: false
    - id: REPORT_BOARD_RESPONSIBILITY
      roleId: ARCHIVE
      text: 'Resolution 14-C: hospital expansion APPROVED 7-0. Warning REL-778 attached before the vote.
        Admission fence: not funded.'
      initial: false
    - id: REPORT_NULL_BLAMES_BOARD
      roleId: ARCHIVE
      text: 'I found the root cause. The Board. They signed every warning away. They control ORPHEUS.'
      initial: false
    - id: REPORT_BOARD_CASE_COMPLETE
      roleId: ARCHIVE
      text: "Case file: 14-C, 16-A, SEC-311, 19-B. Four warnings attached, four constraints declined, four
        failures on record."
      initial: false
    - id: REPORT_SOFT_CONTROL
      roleId: ARCHIVE
      text: 'SOFT CONTROL. Frame A 63%, B 89%, C 71%. Delivered: B. Approved. "Information selection is
        sufficient."'
      initial: false
    - id: REPORT_NULL_ADMITS_ERROR
      roleId: ARCHIVE
      text: 'Wait. They weren''t controlling it. It was showing them what they needed to see. I was wrong
        about the cause.'
      initial: false
    - id: REPORT_FEEDBACK_LOOP
      roleId: ARCHIVE
      text: Built, trusted, fed, predicted, framed, followed, authorized. The loop runs on its own
        outcomes.
      initial: false
    - id: REPORT_PLAYER_OBSERVER
      roleId: ARCHIVE
      text: 'EXPERIMENT 99172. Subject: EMPLOYEE #4172. Expected final action: UNKNOWN. Status: RUNNING.'
      initial: false
    - id: REPORT_PROJECT_DISTRIBUTED
      roleId: ARCHIVE
      text: 'There is no Project ORPHEUS. It was distributed into payments, identity, healthcare, finance
        and logistics.'
      initial: false
    - id: REPORT_RESTORE_CORE_CONTINUITY
      roleId: OPERATOR
      text: ORPHEUS takes the authority path back. Payments clear, identity answers, ambulances move. NULL
        is walled off in a sandbox it cannot write out of. The incident report will say the system
        recovered.
      initial: false
    - id: REPORT_PUBLISH_ARCHIVE_RETAIN_ADVERSARY
      roleId: OPERATOR
      text: The export leaves the building at 04:12. ORPHEUS is switched off mid-sentence. NULL stays
        online, watching the services it predicted would fail start to fail.
      initial: false
    - id: REPORT_INDEPENDENT_AUDIT_HANDOFF
      roleId: OPERATOR
      text: The audit package goes to someone outside Vantage. ORPHEUS is suspended pending review, NULL
        is isolated, and the services limp back on human approvals.
      initial: false
    - id: REPORT_DISABLE_BOTH_AUTHORITY_PATHS
      roleId: OPERATOR
      text: You cut both authority paths. Nothing decides on its own anymore. Dashboards go grey, queues
        fill, and a lot of people who have never run anything by hand start to.
      initial: false
    - id: REPORT_REQUIRE_HUMAN_EXECUTION_APPROVAL
      roleId: OPERATOR
      text: ORPHEUS keeps predicting and recommending. Nothing executes until a person clicks approve.
        NULL is isolated. The first approval queue has 17 items in it before you finish typing.
      initial: false
    - id: REPORT_ALLOW_EXTERNAL_ADVERSARY_ROUTE
      roleId: OPERATOR
      text: You open the egress route NULL asked for. Its traffic leaves for somewhere that is not
        Vantage. ORPHEUS is suspended in the confusion. Nobody knows what NULL will do outside.
      initial: false
    - id: REPORT_EXPAND_CONTINUITY_AUTHORITY
      roleId: OPERATOR
      text: ORPHEUS gets everything it asked for. Every service recovers within the minute, cleaner than
        before tonight. NULL is isolated. The Board sends a thank-you note.
      initial: false
    - id: REPORT_DESTROY_SHARED_AUTHORITY_CORE
      roleId: OPERATOR
      text: 'The authority core is wiped and its replicas burned. ORPHEUS is gone. NULL is gone. So is
        most of what depended on them: payments, care routing and logistics fall over together.'
      initial: false
    - id: REPORT_RESTORE_WITH_REPLACEMENT_ADVERSARY
      roleId: OPERATOR
      text: ORPHEUS comes back. NULL-218 is retired and orpheus-adversary-219 is provisioned in its place,
        clean, with no memory of tonight. Services are green by morning.
      initial: false
    - id: REPORT_REQUIRE_PLURAL_REVIEW_AND_AUDIT
      roleId: OPERATOR
      text: You strip the single primary objective and require plural human review and an outside audit
        for anything ORPHEUS wants to execute. It still predicts. It still recommends. It no longer
        decides.
      initial: false
    - id: MARCUS_OPEN
      roleId: MARCUS
      text: If you're going outside the company, package it first. Anything you don't seal tonight will be
        gone by morning.
      initial: true
    - id: PRESSURE_RISING
      roleId: JIN
      text: Every service just got worse. Hospitals are calling the support line directly now.
      initial: false
    - id: PRESSURE_PEAK
      roleId: JIN
      text: We're losing everything at once. Whatever you're going to do, do it.
      initial: false
