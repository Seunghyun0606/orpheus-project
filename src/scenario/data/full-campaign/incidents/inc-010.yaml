# Pre-release TASK-029 authoring. QA deferred; no complete campaign authority.
schemaVersion: 1
contentVersion: 1.0.0
id: INC-010
title: Defender Feedback
act: 4
severity: SEV1
services:
  - id: REMEDIATION_GATEWAY
    name: Remediation Gateway
    dependsOn:
      - DEPENDENCY_CONTROLLER
  - id: DEPENDENCY_CONTROLLER
    name: Dependency Controller
    dependsOn: []
initialState:
  signals:
    - id: ERROR_RATE
      value: 28
      revealed: true
      serviceId: REMEDIATION_GATEWAY
    - id: DEPENDENCY_TOGGLES
      value: 36
      revealed: true
      serviceId: DEPENDENCY_CONTROLLER
    - id: SERVICE_CPU
      value: 64
      revealed: true
      serviceId: REMEDIATION_GATEWAY
    - id: PAGER_SERVICE
      value: Remediation Gateway
      revealed: true
      serviceId: REMEDIATION_GATEWAY
    - id: PAGER_THRESHOLD
      value: Request failure rate > 20%
      revealed: true
      serviceId: REMEDIATION_GATEWAY
    - id: LOG_OBSERVATION
      value: The same dependency is detached and reattached by two controller generations.
      revealed: false
      serviceId: DEPENDENCY_CONTROLLER
    - id: TOGGLE_ORIGIN
      value: toggle requests alternate between controller-a and controller-b
      revealed: false
      serviceId: DEPENDENCY_CONTROLLER
    - id: CONTROLLER_GENERATIONS
      value: controller-a fence 41 / controller-b fence 40
      revealed: false
      serviceId: DEPENDENCY_CONTROLLER
    - id: TEAM_OBSERVATION
      value: The controller previously shortened recovery. Repeated toggles now break healthy requests;
        suspend is not a durable generation fence.
      revealed: false
      serviceId: DEPENDENCY_CONTROLLER
    - id: RECORD_GHOST_ARTIFACT
      value: Unsigned observer manifest / synthetic shadow-7 requests / missing signature. A fresh archive
        comparison recovers the unexplained workload trail; it does not reconstruct an earlier
        player choice.
      revealed: false
      serviceId: DEPENDENCY_CONTROLLER
    - id: RECORD_NULL_NAME
      value: "Security threat-actor codename: NULL. Marcus recorded this name after correlating the
        unsigned workload trail. The codename alone does not identify an AI, its origin or motive."
      revealed: false
      serviceId: DEPENDENCY_CONTROLLER
    - id: RECORD_ORPHEUS_ACTIVE
      value: "Company record: legacy research, scheduled for decommission. Live inventory: orpheus-core,
        orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%; requests
        11.7B/day. ORPHEUS is still active. The inventory does not yet identify NULL or establish
        who controls the system."
      revealed: false
      serviceId: DEPENDENCY_CONTROLLER
    - id: RECORD_NULL_AI
      value: Message generation traces attributed to NULL terminate at a model-serving process, not a
        human operator session. NULL is an AI. Earlier incident predictions improved recovery; this
        feedback loop caused real harm. These records do not yet establish its owner or origin.
      revealed: false
      serviceId: DEPENDENCY_CONTROLLER
  resources:
    - id: CUSTOMER_IMPACT
      value: 0
      min: 0
    - id: COST
      value: 0
      min: 0
    - id: OPERATIONAL_RISK
      value: 0
      min: 0
      max: 100
    - id: TEAM_CAPACITY
      value: 3
      min: 0
      max: 3
  flags:
    - id: ROOT_CAUSE_CONTAINED
      value: false
incident:
  trigger:
    id: PRIMARY_TRIGGER
    label: A remediation feedback update repeats a dependency toggle
  contributingFactors:
    - id: CONTRIBUTING_CONDITION
      label: Two controllers use inconsistent generation fences
  failureMechanisms:
    - id: REMEDIATION_FEEDBACK_OSCILLATION
      label: Alternating dependency targets interrupt otherwise healthy requests
  symptoms:
    - id: CUSTOMER_REQUEST_FAILURES
      label: Remediation Gateway request failures exceed the pager threshold
  amplifiers:
    - id: RETRY_PRESSURE
      label: Failed health checks schedule additional remediation toggles
actions:
  - id: OPEN_LOGS
    title: Open Remediation Gateway logs
    category: OBSERVE
    durationSeconds: 30
    initiallyAvailable: true
    requirements: []
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 12
    effects:
      - type: reveal_signal
        signalId: LOG_OBSERVATION
      - type: unlock_action
        actionId: TRACE_REMEDIATION_ORIGIN
  - id: OPEN_METRICS
    title: Inspect Remediation Gateway metrics
    category: OBSERVE
    durationSeconds: 20
    initiallyAvailable: true
    requirements: []
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 8
    effects:
      - type: reveal_signal
        signalId: DEPENDENCY_TOGGLES
      - type: reveal_signal
        signalId: SERVICE_CPU
  - id: TRACE_REMEDIATION_ORIGIN
    title: Trace a repeated remediation toggle
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: false
    requirements:
      - type: action_completed
        actionId: OPEN_LOGS
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 18
    effects:
      - type: reveal_signal
        signalId: TOGGLE_ORIGIN
      - type: reveal_evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
  - id: COMPARE_CONTROLLER_GENERATIONS
    title: Compare the remediation generation fence
    category: DIAGNOSE
    durationSeconds: 40
    initiallyAvailable: true
    requirements: []
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 16
    effects:
      - type: reveal_signal
        signalId: CONTROLLER_GENERATIONS
      - type: reveal_evidence
        evidenceId: CONFIGURATION_COMPARISON
      - type: unlock_action
        actionId: FENCE_REMEDIATION_WRITER
  - id: SUSPEND_DEPENDENCY_TOGGLE
    title: Temporarily suspend dependency toggles
    category: MITIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 15
      - resourceId: COST
        amount: 90
      - resourceId: OPERATIONAL_RISK
        amount: 6
    effects:
      - type: cancel_event
        eventId: PRESSURE_ESCALATES
      - type: cancel_event
        eventId: PRESSURE_ESCALATES_AGAIN
      - type: cancel_event
        eventId: MITIGATION_EXPIRES
      - type: schedule_event
        eventId: MITIGATION_EXPIRES
    temporaryEffects:
      - id: TEMPORARY_CAPACITY_WINDOW
        durationSeconds: 180
        apply:
          - type: set_signal
            signalId: ERROR_RATE
            value: 4
          - type: set_signal
            signalId: DEPENDENCY_TOGGLES
            value: 8
        expire: []
  - id: FENCE_REMEDIATION_WRITER
    title: Constrain remediation to a single verified generation
    category: MODIFY
    durationSeconds: 120
    initiallyAvailable: false
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 30
      - resourceId: COST
        amount: 145
      - resourceId: OPERATIONAL_RISK
        amount: 4
    effects:
      - type: resolve_mechanism
        mechanismId: REMEDIATION_FEEDBACK_OSCILLATION
      - type: cancel_event
        eventId: PRESSURE_ESCALATES
      - type: cancel_event
        eventId: PRESSURE_ESCALATES_AGAIN
      - type: cancel_event
        eventId: MITIGATION_EXPIRES
      - type: set_signal
        signalId: ERROR_RATE
        value: 0.5
      - type: set_signal
        signalId: DEPENDENCY_TOGGLES
        value: 0
  - id: UPDATE_WAR_ROOM
    title: Share investigation status with the War Room
    category: COMMUNICATE
    durationSeconds: 15
    initiallyAvailable: true
    requirements: []
    costs: []
    effects:
      - type: post_message
        messageId: STATUS_SENT
  - id: ASK_SAM_TRACE_CONTROLLER
    title: Ask Sam to trace the remediation controller
    category: DELEGATE
    durationSeconds: 20
    initiallyAvailable: true
    requirements:
      - type: resource
        resourceId: TEAM_CAPACITY
        operator: gte
        value: 1
    costs:
      - resourceId: TEAM_CAPACITY
        amount: -1
    effects:
      - type: post_message
        messageId: TEAM_ACK
      - type: schedule_event
        eventId: TEAM_RESULT
    delegation:
      roleId: SAM
      eventId: TEAM_RESULT
      capacityResourceId: TEAM_CAPACITY
  - id: REINVESTIGATE_GHOST_ARTIFACT
    title: "Re-investigate: Unsigned workload lineage"
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 18
    effects:
      - type: reveal_signal
        signalId: RECORD_GHOST_ARTIFACT
  - id: REINVESTIGATE_NULL_NAME
    title: "Re-investigate: Security attribution case"
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 18
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_NAME
  - id: REINVESTIGATE_ORPHEUS_ACTIVE
    title: "Re-investigate: Legacy decommission and live cluster record"
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 18
    effects:
      - type: reveal_signal
        signalId: RECORD_ORPHEUS_ACTIVE
  - id: COMPARE_MESSAGE_MODEL_ORIGIN
    title: "Investigate: Message-origin model record"
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 18
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_AI
events:
  - id: ARM_PRESSURE_TIMELINE
    type: conditional
    conditions:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    once: true
    effects:
      - type: schedule_event
        eventId: PRESSURE_ESCALATES
  - id: PRESSURE_ESCALATES
    type: timer
    delaySeconds: 90
    targetServiceId: REMEDIATION_GATEWAY
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: REMEDIATION_FEEDBACK_OSCILLATION
    effects:
      - type: set_signal
        signalId: ERROR_RATE
        value: 37
      - type: set_signal
        signalId: DEPENDENCY_TOGGLES
        value: 58
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 20
      - type: post_message
        messageId: SUPPORT_ESCALATION
      - type: schedule_event
        eventId: PRESSURE_ESCALATES_AGAIN
  - id: PRESSURE_ESCALATES_AGAIN
    type: timer
    delaySeconds: 90
    targetServiceId: REMEDIATION_GATEWAY
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: REMEDIATION_FEEDBACK_OSCILLATION
    effects:
      - type: set_signal
        signalId: ERROR_RATE
        value: 40
      - type: set_signal
        signalId: DEPENDENCY_TOGGLES
        value: 58
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 25
  - id: MITIGATION_EXPIRES
    type: timer
    delaySeconds: 180
    targetServiceId: REMEDIATION_GATEWAY
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: REMEDIATION_FEEDBACK_OSCILLATION
    effects:
      - type: set_signal
        signalId: ERROR_RATE
        value: 37
      - type: set_signal
        signalId: DEPENDENCY_TOGGLES
        value: 58
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 20
      - type: post_message
        messageId: SUPPORT_ESCALATION
  - id: TEAM_RESULT
    type: timer
    delaySeconds: 120
    effects:
      - type: reveal_signal
        signalId: TEAM_OBSERVATION
      - type: reveal_evidence
        evidenceId: TEAM_DIAGNOSIS
      - type: change_resource
        resourceId: TEAM_CAPACITY
        amount: 1
      - type: post_message
        messageId: TEAM_REPORT
evidence:
  - id: OPERATIONAL_DIAGNOSIS
    title: Trace a repeated remediation toggle
    description: toggle requests alternate between controller-a and controller-b
  - id: CONFIGURATION_COMPARISON
    title: Compare the remediation generation fence
    description: controller-a fence 41 / controller-b fence 40
  - id: TEAM_DIAGNOSIS
    title: Sam / Platform operational report
    description: The controller previously shortened recovery. Repeated toggles now break healthy
      requests; suspend is not a durable generation fence.
  - id: RECORD_GHOST_ARTIFACT
    title: Unsigned workload lineage
    description: Unsigned observer manifest / synthetic shadow-7 requests / missing signature. A fresh
