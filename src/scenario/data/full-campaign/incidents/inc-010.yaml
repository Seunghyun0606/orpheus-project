        evidenceId: RECORD_ORPHEUS_ACTIVE
      - type: post_message
        messageId: REPORT_ORPHEUS_ACTIVE
  - id: DISCOVERY_NULL_AI
    title: Message-origin model record
    body: Message generation traces attributed to NULL terminate at a model-serving process, not a human
