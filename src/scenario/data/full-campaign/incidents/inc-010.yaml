warRoom:
  roles:
    - id: MAYA
      name: Maya / SRE Lead
    - id: SAM
      name: Sam / Platform
    - id: JIN
      name: Jin / Support
    - id: OPERATOR
      name: Operator
    - id: ARCHIVE
      name: Verified Records
  messages:
    - id: MAYA_OPEN
      roleId: MAYA
      text: Earlier controller intervention restored requests before operators reached the incident.
        Separate aggregate outcomes from the affected requests.
      initial: true
    - id: SUPPORT_OPEN
      roleId: JIN
      text: The feedback loop interrupts requests that were healthy before remediation.
      initial: true
    - id: TEAM_ACK
      roleId: SAM
      text: I will inspect the current operational evidence. ETA two minutes.
      initial: false
    - id: TEAM_REPORT
      roleId: SAM
      text: The controller previously shortened recovery. Repeated toggles now break healthy requests;
        suspend is not a durable generation fence.
      initial: false
    - id: SUPPORT_ESCALATION
      roleId: JIN
      text: Affected requests are still failing. Temporary stabilization has not contained the mechanism.
      initial: false
    - id: STATUS_SENT
      roleId: OPERATOR
      text: Current evidence and impact shared; temporary relief remains distinct from verified
        containment.
      initial: false
    - id: REPORT_GHOST_ARTIFACT
      roleId: ARCHIVE
      text: Unsigned observer manifest / synthetic shadow-7 requests / missing signature. A fresh archive
        comparison recovers the unexplained workload trail; it does not reconstruct an earlier
        player choice.
      initial: false
    - id: REPORT_NULL_NAME
      roleId: ARCHIVE
      text: "Security threat-actor codename: NULL. Marcus recorded this name after correlating the
        unsigned workload trail. The codename alone does not identify an AI, its origin or motive."
      initial: false
    - id: REPORT_ORPHEUS_ACTIVE
      roleId: ARCHIVE
      text: "Company record: legacy research, scheduled for decommission. Live inventory: orpheus-core,
        orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%; requests
        11.7B/day. ORPHEUS is still active. The inventory does not yet identify NULL or establish
        who controls the system."
      initial: false
    - id: REPORT_NULL_AI
      roleId: ARCHIVE
      text: Message generation traces attributed to NULL terminate at a model-serving process, not a human
        operator session. NULL is an AI. Earlier incident predictions improved recovery; this
        feedback loop caused real harm. These records do not yet establish its owner or origin.
      initial: false
resolution:
  mode: all
  conditions:
    - type: mechanism_resolved
      mechanismId: REMEDIATION_FEEDBACK_OSCILLATION
  effects:
    - type: set_flag
      flagId: ROOT_CAUSE_CONTAINED
      value: true
completion:
  mode: all
  conditions:
    - type: flag
      flagId: ROOT_CAUSE_CONTAINED
      value: true
    - type: signal
      signalId: ERROR_RATE
      operator: lte
      value: 1
    - type: signal
      signalId: DEPENDENCY_TOGGLES
      operator: lte
      value: 2
  effects: []
postmortem:
  scoringInputs:
    - id: RECOVERY_TIME
      label: Service recovery time
      source: elapsed_time
    - id: FINAL_ERROR_RATE
      label: Final request error rate
      source: signal
      refId: ERROR_RATE
    - id: FINAL_PRESSURE
      label: Remaining affected workload
      source: signal
      refId: DEPENDENCY_TOGGLES
    - id: CUSTOMER_IMPACT
      label: Customer impact
      source: resource
      refId: CUSTOMER_IMPACT
    - id: COST
      label: Response cost
      source: resource
      refId: COST
    - id: OPERATIONAL_RISK
      label: Operational risk
      source: resource
      refId: OPERATIONAL_RISK
    - id: MITIGATION_COUNT
      label: Temporary mitigation count
      source: action_count
      refId: SUSPEND_DEPENDENCY_TOGGLE
    - id: COMMUNICATION_COUNT
      label: War Room updates
      source: action_count
      refId: UPDATE_WAR_ROOM
