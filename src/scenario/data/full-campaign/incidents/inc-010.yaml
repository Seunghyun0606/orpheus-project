      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    effects:
      - type: reveal_evidence
        evidenceId: RECORD_GHOST_ARTIFACT
      - type: post_message
        messageId: REPORT_GHOST_ARTIFACT
  - id: DISCOVERY_NULL_NAME
    title: Security attribution case
    body: "Security threat-actor codename: NULL. Marcus recorded this name after correlating the
