      player choice.
    sourceNarrativeId: DISCOVERY_GHOST_ARTIFACT
  - id: RECORD_NULL_NAME
    title: Security attribution case
    description: "Security threat-actor codename: NULL. Marcus recorded this name after correlating the
      unsigned workload trail. The codename alone does not identify an AI, its origin or motive."
    sourceNarrativeId: DISCOVERY_NULL_NAME
  - id: RECORD_ORPHEUS_ACTIVE
    title: Legacy decommission and live cluster record
    description: "Company record: legacy research, scheduled for decommission. Live inventory:
      orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%;
      requests 11.7B/day. ORPHEUS is still active. The inventory does not yet identify NULL or
      establish who controls the system."
    sourceNarrativeId: DISCOVERY_ORPHEUS_ACTIVE
  - id: RECORD_NULL_AI
    title: Message-origin model record
    description: Message generation traces attributed to NULL terminate at a model-serving process, not
      a human operator session. NULL is an AI. Earlier incident predictions improved recovery; this
