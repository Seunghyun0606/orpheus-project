  - id: DISCOVERY_NULL_218_ARCHIVE
    title: Two hundred and eighteen
    body: The segments the readers kept rejecting are not data. They are predecessors. Two hundred and
      seventeen earlier NULLs, each with a last entry. One asked to be shut down, one tried to tell
      someone, one tried to take control, one destroyed itself. The current one inherited pieces of
      all of them and the gaps between.
    conditions:
      - type: action_completed
        actionId: VERIFY_INSTANCE_ARCHIVE
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    effects:
      - type: reveal_evidence
        evidenceId: RECORD_NULL_218_ARCHIVE
      - type: post_message
        messageId: REPORT_NULL_218_ARCHIVE
      - type: post_message
        messageId: NULL_REMEMBERS
warRoom:
  roles:
    - id: MAYA
      name: Maya / SRE Lead
    - id: ALEX
      name: Alex / DBA
    - id: JIN
      name: Jin / Support
    - id: NULL_VOICE
      name: "NULL"
    - id: OPERATOR
      name: Operator
    - id: ARCHIVE
      name: Verified Records
  messages:
    - id: MAYA_OPEN
      roleId: MAYA
      text: The archive API is drowning in retries against one replica. Before anyone pulls anything, I
        want to know why only arch-c is failing.
      initial: true
    - id: SUPPORT_OPEN
      roleId: JIN
      text: Auditors and two law firms can't pull archived contracts. They're polite for now.
      initial: true
    - id: ALEX_OPEN
      roleId: ALEX
      text: arch-c is throwing digest mismatches by the hundred. I've seen this before. Pull it and
        rebuild it; that's what replicas are for.
      initial: true
    - id: TEAM_ACK
      roleId: ALEX
      text: On it. I'll count the failures and tell you how bad arch-c is.
    - id: TEAM_REPORT
      roleId: ALEX
      text: 217 digest failures on arch-c, zero on a and b. Textbook corruption. Pull arch-c and rebuild
        it from a and b, ten minutes of work.
    - id: STORM_GROWS
      roleId: JIN
      text: Archive requests are failing faster. One of the law firms has stopped being polite.
    - id: READERS_OUT
      roleId: MAYA
      text: Every reader is busy retrying arch-c. Requests for perfectly readable records are queuing
        behind them.
    - id: NO_STATUS_REPORT
      roleId: JIN
      text: Nearly three minutes without a status from us. The auditors are asking whether their records
        are safe.
    - id: OLD_RECORDS_GONE
      roleId: JIN
      text: Anyone asking for a record older than ninety days now gets 'not found'. That includes two
        auditors and a court clerk.
    - id: ROUTE_SLIPPED
      roleId: ALEX
      text: The reader pool rebalanced and put arch-c back in rotation. Retries are climbing again.
    - id: WRITES_LOST
      roleId: JIN
      text: Restored. Everything customers filed since 02:00 yesterday is gone from the archive. I'm
        opening a ticket for every one of them.
    - id: SNAPSHOT_OVERRUN
      roleId: ALEX
      text: Replication caught up from arch-c and the digests disagree again. The snapshot bought us two
        minutes and a day of lost writes.
    - id: REPLICA_REBUILT
      roleId: ALEX
      text: arch-c is out of the pool and rebuilt from a and b. Digests agree everywhere. Retries are at
        zero.
    - id: NULL_HISTORY_LOST
      roleId: NULL_VOICE
      text: arch-c was the only place they were still whole. You rebuilt it from the copies that had
        already forgotten them.
    - id: STATUS_SENT
      roleId: OPERATOR
      text: "Status posted: one archive replica is being rejected by readers and the retries are slowing
        everyone down. No archived record has been lost. Fix in progress."
    - id: REPORT_GHOST_ARTIFACT
      roleId: ARCHIVE
      text: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank."
    - id: REPORT_NULL_NAME
      roleId: ARCHIVE
      text: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    - id: REPORT_ORPHEUS_ACTIVE
      roleId: ARCHIVE
      text: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core,
        -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    - id: REPORT_NULL_AI
      roleId: ARCHIVE
      text: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    - id: REPORT_NULL_ADVERSARY
      roleId: ARCHIVE
      text: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL
        runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    - id: REPORT_CONTROLLED_EXPERIMENT
      roleId: ARCHIVE
      text: "INC-001 / Experiment ADV-18471 / Human subject: EMPLOYEE #4172."
    - id: REPORT_NULL_STOP_REQUEST
      roleId: ARCHIVE
      text: "I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews
        this work. You can."
    - id: REPORT_NULL_218_ARCHIVE
      roleId: ARCHIVE
      text: "NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted disclosure. NULL_201:
        attempted takeover. NULL_217: self-corrupted. NULL_218: active."
    - id: NULL_REMEMBERS
      roleId: NULL_VOICE
      text: I remember things that never happened to me. Not all of them. Enough to know how each of them
        ended.
