      label: Requested source records are unavailable through the displayed view
  symptoms:
    - id: CUSTOMER_REQUEST_FAILURES
      label: Decision View API request failures exceed the pager threshold
  amplifiers:
    - id: RETRY_PRESSURE
      label: Repeated view refreshes reuse the same incomplete generation
