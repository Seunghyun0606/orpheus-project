events:
  - id: ARM_PRESSURE_TIMELINE
    type: conditional
    conditions:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    once: true
    effects:
      - type: schedule_event
        eventId: PRESSURE_ESCALATES
  - id: PRESSURE_ESCALATES
    type: timer
    delaySeconds: 90
    targetServiceId: DECISION_VIEW_API
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: DECISION_VIEW_SOURCE_DIVERGENCE
    effects:
      - type: set_signal
        signalId: ERROR_RATE
        value: 37
      - type: set_signal
        signalId: MISSING_SOURCE_ROWS
        value: 108
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 20
      - type: post_message
        messageId: SUPPORT_ESCALATION
      - type: schedule_event
        eventId: PRESSURE_ESCALATES_AGAIN
  - id: PRESSURE_ESCALATES_AGAIN
    type: timer
    delaySeconds: 90
    targetServiceId: DECISION_VIEW_API
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: DECISION_VIEW_SOURCE_DIVERGENCE
    effects:
      - type: set_signal
        signalId: ERROR_RATE
        value: 40
      - type: set_signal
        signalId: MISSING_SOURCE_ROWS
        value: 108
      - type: change_resource
