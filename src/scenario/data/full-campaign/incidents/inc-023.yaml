        eventId: PRESSURE_ESCALATES
      - type: cancel_event
        eventId: PRESSURE_ESCALATES_AGAIN
      - type: cancel_event
        eventId: MITIGATION_EXPIRES
      - type: schedule_event
        eventId: MITIGATION_EXPIRES
    temporaryEffects:
      - id: TEMPORARY_CAPACITY_WINDOW
        durationSeconds: 180
        apply:
          - type: set_signal
            signalId: ERROR_RATE
            value: 4
          - type: set_signal
            signalId: MISSING_SOURCE_ROWS
            value: 16
        expire: []
  - id: RECONCILE_COMPLETE_SOURCE_VIEW
