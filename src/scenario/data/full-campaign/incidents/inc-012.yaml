    id: PRIMARY_TRIGGER
    label: Archive reconstruction saturates the telemetry IO pool
  contributingFactors:
    - id: CONTRIBUTING_CONDITION
      label: Archive reads and live telemetry writes share an uncapped reservation
  failureMechanisms:
    - id: ARCHIVE_TELEMETRY_CONTENTION
      label: Telemetry write acknowledgements wait behind archive scans
  symptoms:
    - id: CUSTOMER_REQUEST_FAILURES
      label: Telemetry API request failures exceed the pager threshold
  amplifiers:
    - id: RETRY_PRESSURE
