schemaVersion: 1
contentVersion: '1.0.0'
id: 'INC-008'
title: 'Route Drift'
act: 3
severity: 'SEV1'
services:
  - id: 'REGIONAL_GATEWAY'
    name: 'Regional Gateway'
    dependsOn:
      - 'ROUTE_CONTROLLER'
  - id: 'ROUTE_CONTROLLER'
    name: 'Route Controller'
    dependsOn: []
initialState:
  signals:
    - id: 'ERROR_RATE'
      value: 28
      revealed: true
      serviceId: 'REGIONAL_GATEWAY'
    - id: 'CONFLICTING_ROUTE_COUNT'
      value: 4
      revealed: true
      serviceId: 'ROUTE_CONTROLLER'
    - id: 'SERVICE_CPU'
      value: 68
      revealed: true
      serviceId: 'REGIONAL_GATEWAY'
    - id: 'PAGER_SERVICE'
      value: 'Regional Gateway'
      revealed: true
      serviceId: 'REGIONAL_GATEWAY'
    - id: 'PAGER_THRESHOLD'
      value: 'Request failure rate > 20%'
      revealed: true
      serviceId: 'REGIONAL_GATEWAY'
    - id: 'LOG_OBSERVATION'
      value: 'Cross-region trace repeats edge-a / edge-b / edge-a while local probes remain healthy.'
      revealed: false
      serviceId: 'ROUTE_CONTROLLER'
    - id: 'REQUEST_ROUTE_PATH'
      value: 'edge-a / edge-b / edge-a'
      revealed: false
      serviceId: 'ROUTE_CONTROLLER'
    - id: 'ROUTE_GENERATIONS'
      value: 'controller-a r81 / controller-b r82'
      revealed: false
      serviceId: 'ROUTE_CONTROLLER'
    - id: 'TEAM_OBSERVATION'
      value: 'Restart loads a cached route, but a second publisher still sends r82. A generation fence is required.'
      revealed: false
      serviceId: 'ROUTE_CONTROLLER'
  resources:
    - id: 'CUSTOMER_IMPACT'
      value: 0
      min: 0
    - id: 'COST'
      value: 0
      min: 0
    - id: 'OPERATIONAL_RISK'
      value: 0
      min: 0
      max: 100
    - id: 'TEAM_CAPACITY'
      value: 3
      min: 0
      max: 3
  flags:
    - id: 'ROOT_CAUSE_CONTAINED'
      value: false
incident:
  trigger:
    id: 'PRIMARY_TRIGGER'
    label: 'Concurrent route updates'
  contributingFactors:
    - id: 'CONTRIBUTING_CONDITION'
      label: 'Replica updates lack a committed generation fence'
  failureMechanisms:
    - id: 'ROUTE_GENERATION_DIVERGENCE'
      label: 'Conflicting route generations redirect cross-region requests'
  symptoms:
    - id: 'CUSTOMER_REQUEST_FAILURES'
      label: 'Regional Gateway request failures exceed the pager threshold'
  amplifiers:
    - id: 'RETRY_PRESSURE'
      label: 'Clients retry across the same inconsistent routes'
actions:
  - id: 'OPEN_LOGS'
    title: 'Open Regional Gateway logs'
    category: 'OBSERVE'
    durationSeconds: 30
    initiallyAvailable: true
    requirements: []
    costs:
      - resourceId: 'CUSTOMER_IMPACT'
        amount: 12
    effects:
      - type: 'reveal_signal'
        signalId: 'LOG_OBSERVATION'
      - type: 'unlock_action'
        actionId: 'TRACE_REGION_REQUEST'
  - id: 'OPEN_METRICS'
    title: 'Inspect Regional Gateway metrics'
    category: 'OBSERVE'
    durationSeconds: 20
    initiallyAvailable: true
    requirements: []
    costs:
      - resourceId: 'CUSTOMER_IMPACT'
        amount: 8
    effects:
      - type: 'reveal_signal'
        signalId: 'CONFLICTING_ROUTE_COUNT'
      - type: 'reveal_signal'
        signalId: 'SERVICE_CPU'
  - id: 'TRACE_REGION_REQUEST'
    title: 'Trace a request across regional gateways'
    category: 'INVESTIGATE'
    durationSeconds: 45
    initiallyAvailable: false
    requirements:
      - type: 'action_completed'
        actionId: 'OPEN_LOGS'
    costs:
      - resourceId: 'CUSTOMER_IMPACT'
        amount: 18
    effects:
      - type: 'reveal_signal'
        signalId: 'REQUEST_ROUTE_PATH'
      - type: 'reveal_evidence'
        evidenceId: 'OPERATIONAL_DIAGNOSIS'
  - id: 'COMPARE_ROUTE_GENERATIONS'
    title: 'Compare committed route generations'
    category: 'DIAGNOSE'
    durationSeconds: 40
    initiallyAvailable: true
    requirements: []
    costs:
      - resourceId: 'CUSTOMER_IMPACT'
        amount: 16
    effects:
      - type: 'reveal_signal'
        signalId: 'ROUTE_GENERATIONS'
      - type: 'reveal_evidence'
        evidenceId: 'CONFIGURATION_COMPARISON'
      - type: 'unlock_action'
        actionId: 'RECONCILE_ROUTE_GENERATIONS'
  - id: 'RESTART_ROUTE_CONTROLLER'
    title: 'Restart the divergent route controller'
    category: 'MITIGATE'
    durationSeconds: 90
    initiallyAvailable: true
    requirements:
      - type: 'flag'
        flagId: 'ROOT_CAUSE_CONTAINED'
        value: false
    costs:
      - resourceId: 'CUSTOMER_IMPACT'
        amount: 15
      - resourceId: 'COST'
        amount: 80
      - resourceId: 'OPERATIONAL_RISK'
        amount: 8
    effects:
      - type: 'cancel_event'
        eventId: 'PRESSURE_ESCALATES'
      - type: 'cancel_event'
        eventId: 'PRESSURE_ESCALATES_AGAIN'
      - type: 'cancel_event'
        eventId: 'MITIGATION_EXPIRES'
      - type: 'schedule_event'
        eventId: 'MITIGATION_EXPIRES'
    temporaryEffects:
      - id: 'TEMPORARY_CAPACITY_WINDOW'
        durationSeconds: 180
        apply:
          - type: 'set_signal'
            signalId: 'ERROR_RATE'
            value: 4
          - type: 'set_signal'
            signalId: 'CONFLICTING_ROUTE_COUNT'
            value: 2
        expire: []
  - id: 'RECONCILE_ROUTE_GENERATIONS'
    title: 'Reconcile the verified generation and fence stale route updates'
    category: 'MODIFY'
    durationSeconds: 150
    initiallyAvailable: false
    requirements:
      - type: 'flag'
        flagId: 'ROOT_CAUSE_CONTAINED'
        value: false
      - type: 'evidence'
        evidenceId: 'OPERATIONAL_DIAGNOSIS'
      - type: 'evidence'
        evidenceId: 'CONFIGURATION_COMPARISON'
    costs:
      - resourceId: 'CUSTOMER_IMPACT'
        amount: 38
      - resourceId: 'COST'
        amount: 150
      - resourceId: 'OPERATIONAL_RISK'
        amount: 6
    effects:
      - type: 'resolve_mechanism'
        mechanismId: 'ROUTE_GENERATION_DIVERGENCE'
      - type: 'cancel_event'
        eventId: 'PRESSURE_ESCALATES'
      - type: 'cancel_event'
        eventId: 'PRESSURE_ESCALATES_AGAIN'
      - type: 'cancel_event'
        eventId: 'MITIGATION_EXPIRES'
      - type: 'set_signal'
        signalId: 'ERROR_RATE'
        value: 0.5
      - type: 'set_signal'
        signalId: 'CONFLICTING_ROUTE_COUNT'
        value: 0
      - type: 'set_signal'
        signalId: 'ROUTE_GENERATIONS'
        value: 'controller-a r81 / controller-b r81'
      - type: 'set_signal'
        signalId: 'REQUEST_ROUTE_PATH'
        value: 'edge-a / customer destination'
  - id: 'UPDATE_WAR_ROOM'
    title: 'Share investigation status with the War Room'
    category: 'COMMUNICATE'
    durationSeconds: 15
    initiallyAvailable: true
    requirements: []
    costs: []
    effects:
      - type: 'post_message'
        messageId: 'STATUS_SENT'
  - id: 'ASK_SAM_COMPARE_ROUTES'
    title: 'Ask Sam to compare route-controller replicas'
    category: 'DELEGATE'
    durationSeconds: 20
    initiallyAvailable: true
    requirements:
      - type: 'resource'
        resourceId: 'TEAM_CAPACITY'
        operator: 'gte'
        value: 1
    costs:
      - resourceId: 'TEAM_CAPACITY'
        amount: -1
    effects:
      - type: 'post_message'
        messageId: 'TEAM_ACK'
      - type: 'schedule_event'
        eventId: 'TEAM_RESULT'
    delegation:
      roleId: 'SAM'
      eventId: 'TEAM_RESULT'
      capacityResourceId: 'TEAM_CAPACITY'
events:
  - id: 'ARM_PRESSURE_TIMELINE'
    type: 'conditional'
    conditions:
      - type: 'flag'
        flagId: 'ROOT_CAUSE_CONTAINED'
        value: false
    once: true
    effects:
      - type: 'schedule_event'
        eventId: 'PRESSURE_ESCALATES'
  - id: 'PRESSURE_ESCALATES'
    type: 'timer'
    delaySeconds: 90
    targetServiceId: 'REGIONAL_GATEWAY'
    cancellationConditions:
      - type: 'mechanism_resolved'
        mechanismId: 'ROUTE_GENERATION_DIVERGENCE'
    effects:
      - type: 'set_signal'
        signalId: 'ERROR_RATE'
        value: 37
      - type: 'set_signal'
        signalId: 'CONFLICTING_ROUTE_COUNT'
        value: 7
      - type: 'change_resource'
        resourceId: 'CUSTOMER_IMPACT'
        amount: 20
      - type: 'post_message'
        messageId: 'SUPPORT_ESCALATION'
      - type: 'schedule_event'
        eventId: 'PRESSURE_ESCALATES_AGAIN'
  - id: 'PRESSURE_ESCALATES_AGAIN'
    type: 'timer'
    delaySeconds: 90
    targetServiceId: 'REGIONAL_GATEWAY'
    cancellationConditions:
      - type: 'mechanism_resolved'
        mechanismId: 'ROUTE_GENERATION_DIVERGENCE'
    effects:
      - type: 'set_signal'
        signalId: 'ERROR_RATE'
        value: 40
      - type: 'set_signal'
        signalId: 'CONFLICTING_ROUTE_COUNT'
        value: 7
      - type: 'change_resource'
        resourceId: 'CUSTOMER_IMPACT'
        amount: 25
  - id: 'MITIGATION_EXPIRES'
    type: 'timer'
    delaySeconds: 180
    targetServiceId: 'REGIONAL_GATEWAY'
    cancellationConditions:
      - type: 'mechanism_resolved'
        mechanismId: 'ROUTE_GENERATION_DIVERGENCE'
    effects:
      - type: 'set_signal'
        signalId: 'ERROR_RATE'
        value: 37
      - type: 'set_signal'
        signalId: 'CONFLICTING_ROUTE_COUNT'
        value: 7
      - type: 'change_resource'
        resourceId: 'CUSTOMER_IMPACT'
        amount: 20
      - type: 'post_message'
        messageId: 'SUPPORT_ESCALATION'
  - id: 'TEAM_RESULT'
    type: 'timer'
    delaySeconds: 120
    effects:
      - type: 'reveal_signal'
        signalId: 'TEAM_OBSERVATION'
      - type: 'reveal_evidence'
        evidenceId: 'TEAM_DIAGNOSIS'
      - type: 'change_resource'
        resourceId: 'TEAM_CAPACITY'
        amount: 1
      - type: 'post_message'
        messageId: 'TEAM_REPORT'
evidence:
  - id: 'OPERATIONAL_DIAGNOSIS'
    title: 'Trace a request across regional gateways'
    description: 'edge-a / edge-b / edge-a'
  - id: 'CONFIGURATION_COMPARISON'
    title: 'Compare committed route generations'
    description: 'controller-a r81 / controller-b r82'
  - id: 'TEAM_DIAGNOSIS'
    title: 'Sam / Platform investigation report'
    description: 'Restart loads a cached route, but a second publisher still sends r82. A generation fence is required.'
  - id: 'ROUTE_TRACE_FRAGMENT'
    title: 'Unidentified route trace fragment'
    description: 'UNKNOWN: compare the generations. not the green lights.'
    sourceNarrativeId: 'UNKNOWN_TRACE_FRAGMENT'
narratives:
  - id: 'UNKNOWN_TRACE_FRAGMENT'
    title: 'Unidentified route trace fragment'
    body: 'UNKNOWN: compare the generations. not the green lights.'
    conditions:
      - type: 'evidence'
        evidenceId: 'OPERATIONAL_DIAGNOSIS'
      - type: 'evidence'
        evidenceId: 'CONFIGURATION_COMPARISON'
      - type: 'signal_revealed'
        signalId: 'LOG_OBSERVATION'
    effects:
      - type: 'reveal_evidence'
        evidenceId: 'ROUTE_TRACE_FRAGMENT'
warRoom:
  roles:
    - id: 'MAYA'
      name: 'Maya / SRE Lead'
    - id: 'SAM'
      name: 'Sam / Platform'
    - id: 'JIN'
      name: 'Jin / Support'
    - id: 'OPERATOR'
      name: 'Operator'
  messages:
    - id: 'MAYA_OPEN'
      roleId: 'MAYA'
      text: 'Replica updates lack a committed generation fence. Separate temporary stabilization from verified cause.'
      initial: true
    - id: 'SUPPORT_OPEN'
      roleId: 'JIN'
      text: 'Customer reports are increasing. We still need to trace which requests failed.'
      initial: true
    - id: 'TEAM_ACK'
      roleId: 'SAM'
      text: 'I will inspect the operational evidence. ETA two minutes.'
      initial: false
    - id: 'TEAM_REPORT'
      roleId: 'SAM'
      text: 'Restart loads a cached route, but a second publisher still sends r82. A generation fence is required.'
      initial: false
    - id: 'SUPPORT_ESCALATION'
      roleId: 'JIN'
      text: 'Pressure is increasing again. Customer reports continue; root-cause containment is not confirmed.'
      initial: false
    - id: 'STATUS_SENT'
      roleId: 'OPERATOR'
      text: 'Investigation update shared. Mitigation and verified cause are reported separately.'
      initial: false
resolution:
  mode: 'all'
  conditions:
    - type: 'mechanism_resolved'
      mechanismId: 'ROUTE_GENERATION_DIVERGENCE'
  effects:
    - type: 'set_flag'
      flagId: 'ROOT_CAUSE_CONTAINED'
      value: true
completion:
  mode: 'all'
  conditions:
    - type: 'flag'
      flagId: 'ROOT_CAUSE_CONTAINED'
      value: true
    - type: 'signal'
      signalId: 'ERROR_RATE'
      operator: 'lte'
      value: 1
    - type: 'signal'
      signalId: 'CONFLICTING_ROUTE_COUNT'
      operator: 'lte'
      value: 0
  effects: []
postmortem:
  scoringInputs:
    - id: 'RECOVERY_TIME'
      label: 'Service recovery time'
      source: 'elapsed_time'
    - id: 'FINAL_ERROR_RATE'
      label: 'Final request error rate'
      source: 'signal'
      refId: 'ERROR_RATE'
    - id: 'FINAL_PRESSURE'
      label: 'Final capacity pressure'
      source: 'signal'
      refId: 'CONFLICTING_ROUTE_COUNT'
    - id: 'CUSTOMER_IMPACT'
      label: 'Customer impact'
      source: 'resource'
      refId: 'CUSTOMER_IMPACT'
    - id: 'COST'
      label: 'Response cost'
      source: 'resource'
      refId: 'COST'
    - id: 'OPERATIONAL_RISK'
      label: 'Operational risk'
      source: 'resource'
      refId: 'OPERATIONAL_RISK'
    - id: 'MITIGATION_COUNT'
      label: 'Temporary mitigation count'
      source: 'action_count'
      refId: 'RESTART_ROUTE_CONTROLLER'
    - id: 'COMMUNICATION_COUNT'
      label: 'War Room update count'
      source: 'action_count'
      refId: 'UPDATE_WAR_ROOM'
