incident:
  trigger:
    id: PRIMARY_TRIGGER
    label: A resource-priority rule repeatedly renews the same exclusions
  contributingFactors:
    - id: CONTRIBUTING_CONDITION
      label: Throughput optimization has no minimum care-service allocation
  failureMechanisms:
    - id: CARE_PRIORITY_STARVATION
      label: Low-throughput care routes wait behind continuously renewed allocations
  symptoms:
    - id: CUSTOMER_REQUEST_FAILURES
      label: Care Routing API request failures exceed the pager threshold
  amplifiers:
    - id: RETRY_PRESSURE
      label: Retries re-enter the same priority rule without changing eligibility
