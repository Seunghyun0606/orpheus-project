      roleId: ARCHIVE
      text: Message generation traces attributed to NULL terminate at a model-serving process, not a human
        operator session. NULL is an AI. Earlier incident predictions improved recovery; this
        feedback loop caused real harm. These records do not yet establish its owner or origin.
      initial: false
    - id: REPORT_NULL_ADVERSARY
      roleId: ARCHIVE
      text: Vantage Systems deployment authority. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL
        belongs to the company-created ADVERSARY, not an escaped outside AI. Generate failures, test
        operators, train Defender. The boundary expanded from staging to shadow production, traffic
        partitions and real production.
      initial: false
    - id: REPORT_CONTROLLED_EXPERIMENT
      roleId: ARCHIVE
      text: "INC-001 / Experiment ADV-18471 / Human Subject EMPLOYEE #4172. This is the operator employee
        ID. Some prior incidents were controlled production experiments. This record does not turn
        every real outage into an experiment."
