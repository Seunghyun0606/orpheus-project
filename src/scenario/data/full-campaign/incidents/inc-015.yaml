warRoom:
  roles:
    - id: MAYA
      name: Maya / SRE Lead
    - id: JIN
      name: Jin / Support
    - id: OPERATOR
      name: Operator
    - id: ARCHIVE
      name: Verified Records
  messages:
    - id: MAYA_OPEN
      roleId: MAYA
      text: Most care routes receive faster allocations with fewer wasted reservations. Separate aggregate
        outcomes from the affected requests.
      initial: true
    - id: SUPPORT_OPEN
      roleId: JIN
      text: A small group receives no timely route despite the aggregate improvement.
      initial: true
    - id: TEAM_ACK
      roleId: JIN
      text: I will inspect the current operational evidence. ETA two minutes.
      initial: false
    - id: TEAM_REPORT
      roleId: JIN
      text: Average routing throughput improved, but the same care routes are still waiting; an aggregate
        improvement does not restore their service.
      initial: false
    - id: SUPPORT_ESCALATION
      roleId: JIN
      text: Affected requests are still failing. Temporary stabilization has not contained the mechanism.
      initial: false
    - id: STATUS_SENT
      roleId: OPERATOR
      text: Current evidence and impact shared; temporary relief remains distinct from verified
        containment.
      initial: false
    - id: REPORT_GHOST_ARTIFACT
      roleId: ARCHIVE
      text: Unsigned observer manifest / synthetic shadow-7 requests / missing signature. A fresh archive
        comparison recovers the unexplained workload trail; it does not reconstruct an earlier
        player choice.
      initial: false
