incident:
  trigger:
    id: PRIMARY_TRIGGER
    label: An approved rollout adds hospital traffic above the shared dependency limit
  contributingFactors:
    - id: CONTRIBUTING_CONDITION
      label: Rollout concurrency is uncapped while existing hospitals share the same dependency
  failureMechanisms:
    - id: HOSPITAL_DEPENDENCY_SATURATION
      label: Hospital requests accumulate at the overloaded shared dependency
  symptoms:
    - id: CUSTOMER_REQUEST_FAILURES
      label: Hospital Network API request failures exceed the pager threshold
  amplifiers:
    - id: RETRY_PRESSURE
      label: Timed-out hospital requests retry through the same admission path
actions:
  - id: OPEN_LOGS
    title: Open Hospital Network API logs
    category: OBSERVE
    durationSeconds: 30
    initiallyAvailable: true
    requirements: []
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 12
    effects:
      - type: reveal_signal
        signalId: LOG_OBSERVATION
      - type: unlock_action
        actionId: TRACE_HOSPITAL_DEPENDENCY
  - id: OPEN_METRICS
    title: Inspect Hospital Network API metrics
    category: OBSERVE
    durationSeconds: 20
    initiallyAvailable: true
    requirements: []
    costs:
