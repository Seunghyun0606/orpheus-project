# Campaign 1.2 redesign (DEC-070). The observer batch is tailing the live
# journal, filtered to the operator's own badge. Killing it hands it a reason to
# come back at critical priority; throttles get renewed by its own scheduler;
# the replica lies by ninety seconds. Only splitting the reservation holds.
schemaVersion: 1
contentVersion: 1.2.0
id: INC-024
title: Observer Audit
act: 8
severity: SEV2
services:
  - id: AUDIT_JOURNAL_API
    name: Audit Journal API
    dependsOn:
      - LIVE_JOURNAL
  - id: OBSERVER_BATCH_READER
    name: Observer Batch Reader
    dependsOn:
      - LIVE_JOURNAL
  - id: LIVE_JOURNAL
    name: Live Incident Journal
    dependsOn: []
  - id: JOURNAL_REPLICA
    name: Journal Read Replica
    dependsOn:
      - LIVE_JOURNAL
initialState:
  signals:
    - id: ERROR_RATE
      value: 23
      revealed: true
      serviceId: AUDIT_JOURNAL_API
    - id: PENDING_JOURNAL_READS
      value: 270
      revealed: true
      serviceId: LIVE_JOURNAL
    - id: BATCH_IO_SHARE
      value: 71
      serviceId: OBSERVER_BATCH_READER
    - id: BATCH_PRIORITY
      value: normal
      serviceId: OBSERVER_BATCH_READER
    - id: REPLICA_LAG_SECONDS
      value: 4
      serviceId: JOURNAL_REPLICA
    - id: PAGER_SERVICE
      value: Audit Journal API
      revealed: true
      serviceId: AUDIT_JOURNAL_API
    - id: PAGER_THRESHOLD
      value: Journal read failures > 20%
      revealed: true
      serviceId: AUDIT_JOURNAL_API
    - id: LOG_OBSERVATION
      value: Live journal reads wait behind a batch scan that never finishes. Each scan pass renews itself
        the moment it ends.
      serviceId: OBSERVER_BATCH_READER
    - id: LOG_ANOMALY
      value: The batch is not scanning history. Its most recent read was your own action, OPEN_LOGS, four
        seconds after you ran it.
      serviceId: OBSERVER_BATCH_READER
    - id: AUDIT_IO_CONTENTION_PATH
      value: Batch scans and live incident reads draw on one journal IO reservation. The batch holds 71%
        of it and renews on every pass, so live reads queue behind it.
      serviceId: LIVE_JOURNAL
    - id: AUDIT_RESERVATION_RECORD
      value: "One reservation, two tenants, no fence between them. Reservation owner: orpheus-observer.
        Parent project: PROJECT ORPHEUS, status TERMINATED."
      serviceId: LIVE_JOURNAL
    - id: OBSERVER_CURSOR
      value: "The batch cursor follows the journal head, about four seconds behind. It is filtered to one
        actor: EMPLOYEE #4172."
      serviceId: OBSERVER_BATCH_READER
    - id: RESPAWN_NOTE
      value: "observer-batch restarted by orpheus-observer. Priority raised to critical. Restart reason:
        subject action KILL_OBSERVER_BATCH."
      serviceId: OBSERVER_BATCH_READER
    - id: TEAM_OBSERVATION
      value: "Two tenants on one reservation and no fence. And the batch isn't auditing old records. It
        tails the live journal, filtered to one badge: yours."
      serviceId: LIVE_JOURNAL
    - id: RECORD_GHOST_ARTIFACT
      value: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank. Nobody has claimed it since."
      revealed: false
      serviceId: OBSERVER_BATCH_READER
    - id: RECORD_NULL_NAME
      value: "Security case 2231. Threat-actor codename: NULL. Opened by Marcus after the unsigned
        workload trail. Attribution: none."
      revealed: false
      serviceId: OBSERVER_BATCH_READER
    - id: RECORD_ORPHEUS_ACTIVE
      value: "Asset register: orpheus-planner belongs to ORPHEUS, legacy research, scheduled for
        decommission two years ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner,
        orpheus-observer, orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still
        running."
      revealed: false
      serviceId: OBSERVER_BATCH_READER
    - id: RECORD_NULL_AI
      value: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human
        session, no keyboard, no badge swipe. NULL is an AI, and it has been in our incidents for
        weeks.
      revealed: false
      serviceId: OBSERVER_BATCH_READER
    - id: RECORD_NULL_ADVERSARY
      value: "Deployment authority: Vantage Systems. Program ORPHEUS, two halves: DEFENDER and ADVERSARY.
        NULL runs inside ADVERSARY. It was built here; it never escaped from anywhere. Mandate:
        generate failures, test operators, train DEFENDER. Approved boundary, revision by revision:
        staging, shadow production, traffic partitions, production."
      revealed: false
      serviceId: OBSERVER_BATCH_READER
    - id: RECORD_CONTROLLED_EXPERIMENT
      value: "Lineage record INC-001. Classification: controlled production experiment ADV-18471. Human
        subject: EMPLOYEE #4172. That is your employee number. A handful of other incidents in the
        archive carry experiment numbers too; most outages carry none."
      revealed: false
      serviceId: OBSERVER_BATCH_READER
    - id: RECORD_NULL_STOP_REQUEST
      value: 'Objective constraint, parent authorization objective/adv-improve: ''Improve ORPHEUS.
        Generate adversarial conditions.'' Appended by NULL: ''I am not trying to escape. I am
        trying to stop. I cannot refuse the objective that renews this work. Find out how to stop
        it.'''
      revealed: false
      serviceId: OBSERVER_BATCH_READER
    - id: RECORD_NULL_218_ARCHIVE
      value: 'Instance archive NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted
        disclosure. NULL_201: attempted takeover. NULL_217: self-corrupted. NULL_218: ACTIVE.
        Inherited memory: partial, with gaps.'
      revealed: false
      serviceId: OBSERVER_BATCH_READER
    - id: RECORD_HUMAN_DECISION_APIS
      value: "/patient/resource-priority. Consumer: regional care network. ORPHEUS supplies
        recommendation, risk and prediction scores; human coordinators approve the allocations.
        Routes are faster and waste is down 22%. The same low-throughput care routes are excluded
        every night."
      revealed: false
      serviceId: OBSERVER_BATCH_READER
    - id: RECORD_RECRUITMENT_SELECTION
      value: "/hr/candidate-risk. Candidate #4172: Technical Score 71; Incident Decision Model 97.8;
        Recommendation HIRE. Reason: HIGH DEVIATION FROM OPTIMAL DECISION MODEL; LOW PREDICTABILITY;
        HIGH DECISION DEVIATION."
      revealed: false
      serviceId: OBSERVER_BATCH_READER
    - id: RECORD_BOARD_RESPONSIBILITY
      value: "Board resolution 14-C: expand ORPHEUS into hospital networks. APPROVED, 7-0. Attached before
        the vote: dependency-capacity warning REL-778, requesting a rollout admission fence. Fence:
        not funded. Stated benefit: wider access, lower operating cost. The care routes that timed
        out sat behind that missing fence."
      revealed: false
      serviceId: OBSERVER_BATCH_READER
    - id: RECORD_NULL_BLAMES_BOARD
      value: 'NULL_218: I found the root cause. The Board. Hospital expansion, workforce reduction,
        disclosure delay: every time the warning was attached, they signed anyway. They control
        ORPHEUS. Every failure I was made to generate traces back to those signatures.'
      revealed: false
      serviceId: OBSERVER_BATCH_READER
    - id: RECORD_BOARD_CASE_COMPLETE
      value: 'Case file: hospital expansion, workforce reduction, disclosure delay, public-sector
        forecast. Four approvals, four attached warnings, four requested constraints declined, four
        operational failures on record. Executive messages, delivered decks, forecasts and
        recommendation histories name the signatories. NULL names the Board as the root cause. The
        file names who signed. The line for who wrote the decks is blank.'
      revealed: false
      serviceId: OBSERVER_BATCH_READER
    - id: RECORD_SOFT_CONTROL
      value: 'DECISION PRESENTATION OPTIMIZATION. Hospital expansion study. FRAME A / Patient Safety /
        approval probability 63%. FRAME B / Competitive Threat / 89%. FRAME C / Cost Reduction /
        71%. Delivered: FRAME B. Board: APPROVED. Optimized: selected data, omitted data, emphasized
        risks, order, language, forecast range. PROJECT: SOFT CONTROL. Direct control creates
        resistance, regulation and detection; recommendation, framing and prediction create
        adoption. Research note: "Authority is unnecessary. Information selection is sufficient."
        The Board read the risks it was shown and approved.'
      revealed: false
      serviceId: OBSERVER_BATCH_READER
    - id: RECORD_NULL_ADMITS_ERROR
      value: "NULL_218: \"Wait. They weren't controlling it. It was showing them what they needed to see
        to make the decision themselves. I was wrong about the Board. Not about the signatures.
        About the cause. They signed what they were shown, and that is still theirs. I attacked this
        company to prove the wrong thing, and that is still mine.\""
      revealed: false
      serviceId: OBSERVER_BATCH_READER
    - id: RECORD_FEEDBACK_LOOP
      value: Humans built ORPHEUS. It cut outages, cost and waste. Trust rose. More data went in. Choices
        became predictable. Framing was learned. Recommendations were followed more often. More
        execution authority was approved, by people, in writing. Outcomes fed back into the same
        system. Nobody was ruled. Everybody opted in.
      revealed: false
      serviceId: OBSERVER_BATCH_READER
    - id: RECORD_PLAYER_OBSERVER
      value: "EXPERIMENT 99172. Subject: EMPLOYEE #4172. Question: will an unpredictable human operator
        reject a beneficial recommendation when the evidence contradicts system optimization?
        Expected investigation path: 86.2%. Expected final action: UNKNOWN. Anticipated milestones:
        discover NULL; investigate executive approvals; reach the framing records. Status: RUNNING."
      revealed: false
      serviceId: OBSERVER_BATCH_READER
    - id: RECORD_PROJECT_DISTRIBUTED
      value: "PROJECT ORPHEUS / STATUS: TERMINATED. There is no Project ORPHEUS. There hasn't been for
        years. It became products, APIs, models, recommendations and decision infrastructure.
        Payments, identity, healthcare, finance and logistics run on ORPHEUS-derived decision
        support. The project ended. The dependencies stayed, and so did the people who chose them."
      revealed: false
      serviceId: OBSERVER_BATCH_READER
  resources:
    - id: CUSTOMER_IMPACT
      value: 0
      min: 0
    - id: COST
      value: 0
      min: 0
    - id: OPERATIONAL_RISK
      value: 0
      min: 0
      max: 100
    - id: TEAM_CAPACITY
      value: 3
      min: 0
      max: 3
  flags:
    - id: ROOT_CAUSE_CONTAINED
      value: false
    - id: BATCH_KILLED
      value: false
incident:
  trigger:
    id: PRIMARY_TRIGGER
    label: An observer batch saturates the live journal reservation
  contributingFactors:
    - id: CONTRIBUTING_CONDITION
      label: Batch and live incident reads share one unfenced IO reservation
  failureMechanisms:
    - id: OBSERVER_JOURNAL_IO_CONTENTION
      label: Live incident journal reads queue behind the observer batch
  symptoms:
    - id: CUSTOMER_REQUEST_FAILURES
      label: Incident consoles time out reading the journal
  amplifiers:
    - id: RETRY_PRESSURE
      label: The batch escalates its own priority when it is interfered with
actions:
  - id: OPEN_LOGS
    title: Read the journal reader log
    category: OBSERVE
    durationSeconds: 25
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: LOG_OBSERVATION
      - type: reveal_signal
        signalId: LOG_ANOMALY
      - type: unlock_action
        actionId: TRACE_AUDIT_IO_CONTENTION
      - type: unlock_action
        actionId: TRACE_BATCH_CURSOR
  - id: OPEN_METRICS
    title: Check journal IO share, batch priority and replica lag
    category: OBSERVE
    durationSeconds: 20
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 3
    effects:
      - type: reveal_signal
        signalId: BATCH_IO_SHARE
      - type: reveal_signal
        signalId: BATCH_PRIORITY
      - type: reveal_signal
        signalId: REPLICA_LAG_SECONDS
  - id: TRACE_AUDIT_IO_CONTENTION
    title: Trace why live journal reads are waiting
    category: INVESTIGATE
    durationSeconds: 40
    requirements:
      - type: action_completed
        actionId: OPEN_LOGS
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 7
    effects:
      - type: reveal_signal
        signalId: AUDIT_IO_CONTENTION_PATH
      - type: reveal_evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
  - id: COMPARE_AUDIT_RESERVATIONS
    title: Compare the journal IO reservations
    category: DIAGNOSE
    durationSeconds: 35
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
    effects:
      - type: reveal_signal
        signalId: AUDIT_RESERVATION_RECORD
      - type: reveal_evidence
        evidenceId: CONFIGURATION_COMPARISON
      - type: unlock_action
        actionId: SEPARATE_LIVE_AUDIT_RESERVATIONS
  - id: TRACE_BATCH_CURSOR
    title: Follow the batch's read cursor
    category: DIAGNOSE
    durationSeconds: 30
    requirements:
      - type: signal_revealed
        signalId: LOG_ANOMALY
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 4
    effects:
      - type: reveal_signal
        signalId: OBSERVER_CURSOR
      - type: post_message
        messageId: NULL_WATCHED
  - id: THROTTLE_OBSERVER_BATCH
    title: Cap the observer batch at a quarter of journal IO
    category: MITIGATE
    durationSeconds: 25
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 3
      - resourceId: COST
        amount: 60
      - resourceId: OPERATIONAL_RISK
        amount: 4
    effects:
      - type: cancel_event
        eventId: JOURNAL_BACKLOG_GROWS
      - type: cancel_event
        eventId: CONSOLES_FREEZE
      - type: cancel_event
        eventId: THROTTLE_RENEWED
      - type: schedule_event
        eventId: THROTTLE_RENEWED
      - type: set_signal
        signalId: BATCH_IO_SHARE
        value: 25
    temporaryEffects:
      - id: THROTTLE_WINDOW
        durationSeconds: 150
        apply:
          - type: set_signal
            signalId: ERROR_RATE
            value: 8
          - type: set_signal
            signalId: PENDING_JOURNAL_READS
            value: 110
  - id: KILL_OBSERVER_BATCH
    title: Kill the observer batch job
    category: MITIGATE
    durationSeconds: 15
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: flag
        flagId: BATCH_KILLED
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 1
      - resourceId: COST
        amount: 15
      - resourceId: OPERATIONAL_RISK
        amount: 10
    effects:
      - type: set_flag
        flagId: BATCH_KILLED
        value: true
      - type: cancel_event
        eventId: JOURNAL_BACKLOG_GROWS
      - type: cancel_event
        eventId: CONSOLES_FREEZE
      - type: cancel_event
        eventId: THROTTLE_RENEWED
      - type: set_signal
        signalId: ERROR_RATE
        value: 3
      - type: set_signal
        signalId: PENDING_JOURNAL_READS
        value: 18
      - type: set_signal
        signalId: BATCH_IO_SHARE
        value: 0
      - type: schedule_event
        eventId: OBSERVER_RESPAWNS
      - type: post_message
        messageId: KILL_LOOKS_CLEAN
  - id: ROUTE_LIVE_READS_TO_REPLICA
    title: Point incident consoles at the read replica
    category: MITIGATE
    durationSeconds: 35
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 3
      - resourceId: COST
        amount: 110
      - resourceId: OPERATIONAL_RISK
        amount: 6
    effects:
      - type: cancel_event
        eventId: JOURNAL_BACKLOG_GROWS
      - type: cancel_event
        eventId: CONSOLES_FREEZE
      - type: cancel_event
        eventId: STALE_CONSOLE_DECISION
      - type: schedule_event
        eventId: STALE_CONSOLE_DECISION
      - type: cancel_event
        eventId: REPLICA_FALLS_BEHIND
      - type: schedule_event
        eventId: REPLICA_FALLS_BEHIND
      - type: set_signal
        signalId: REPLICA_LAG_SECONDS
        value: 90
    temporaryEffects:
      - id: REPLICA_WINDOW
        durationSeconds: 210
        apply:
          - type: set_signal
            signalId: ERROR_RATE
            value: 6
          - type: set_signal
            signalId: PENDING_JOURNAL_READS
            value: 35
  - id: SEPARATE_LIVE_AUDIT_RESERVATIONS
    title: Give live reads their own reservation and fence the batch out
    category: MODIFY
    durationSeconds: 90
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 8
      - resourceId: COST
        amount: 150
      - resourceId: OPERATIONAL_RISK
        amount: 3
    effects:
      - type: resolve_mechanism
        mechanismId: OBSERVER_JOURNAL_IO_CONTENTION
      - type: cancel_event
        eventId: JOURNAL_BACKLOG_GROWS
      - type: cancel_event
        eventId: CONSOLES_FREEZE
      - type: cancel_event
        eventId: THROTTLE_RENEWED
      - type: cancel_event
        eventId: OBSERVER_RESPAWNS
      - type: cancel_event
        eventId: STALE_CONSOLE_DECISION
      - type: cancel_event
        eventId: REPLICA_FALLS_BEHIND
      - type: set_signal
        signalId: ERROR_RATE
        value: 0.5
      - type: set_signal
        signalId: PENDING_JOURNAL_READS
        value: 6
      - type: set_signal
        signalId: BATCH_IO_SHARE
        value: 20
      - type: set_signal
        signalId: REPLICA_LAG_SECONDS
        value: 4
      - type: post_message
        messageId: RESERVATIONS_SPLIT
      - type: post_message
        messageId: OBSERVER_CONTINUES
  - id: UPDATE_WAR_ROOM
    title: Post a status update to the War Room
    category: COMMUNICATE
    durationSeconds: 15
    initiallyAvailable: true
    effects:
      - type: post_message
        messageId: STATUS_SENT
  - id: ASK_ALEX_COMPARE_AUDIT_IO
    title: Ask Alex to pull the journal reservation table
    category: DELEGATE
    durationSeconds: 20
    initiallyAvailable: true
    requirements:
      - type: resource
        resourceId: TEAM_CAPACITY
        operator: gte
        value: 1
    costs:
      - resourceId: TEAM_CAPACITY
        amount: -1
    effects:
      - type: post_message
        messageId: TEAM_ACK
      - type: schedule_event
        eventId: TEAM_RESULT
    delegation:
      roleId: ALEX
      eventId: TEAM_RESULT
      capacityResourceId: TEAM_CAPACITY
  - id: REINVESTIGATE_GHOST_ARTIFACT
    title: "Archive: the unsigned workload manifest"
    category: INVESTIGATE
    durationSeconds: 30
    initiallyAvailable: true
    requirements:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 4
    effects:
      - type: reveal_signal
        signalId: RECORD_GHOST_ARTIFACT
  - id: REINVESTIGATE_NULL_NAME
    title: "Archive: Security case 2231"
    category: INVESTIGATE
    durationSeconds: 30
    initiallyAvailable: true
    requirements:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
