events:
  - id: ARM_PRESSURE_TIMELINE
    type: conditional
    conditions:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    once: true
    effects:
      - type: schedule_event
        eventId: JOURNAL_BACKLOG_GROWS
      - type: schedule_event
        eventId: COMMANDERS_UNINFORMED
  - id: JOURNAL_BACKLOG_GROWS
    type: timer
    delaySeconds: 100
    targetServiceId: AUDIT_JOURNAL_API
    cancellationConditions: &a1
      - type: mechanism_resolved
        mechanismId: OBSERVER_JOURNAL_IO_CONTENTION
    effects:
      - type: set_signal
        signalId: ERROR_RATE
        value: 31
      - type: set_signal
        signalId: PENDING_JOURNAL_READS
        value: 410
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 14
      - type: post_message
        messageId: CONSOLES_LAGGING
      - type: cancel_event
        eventId: CONSOLES_FREEZE
      - type: schedule_event
        eventId: CONSOLES_FREEZE
  - id: CONSOLES_FREEZE
    type: timer
    delaySeconds: 160
    targetServiceId: AUDIT_JOURNAL_API
    cancellationConditions: *a1
    effects:
      - type: set_signal
        signalId: ERROR_RATE
        value: 39
      - type: set_signal
        signalId: PENDING_JOURNAL_READS
        value: 580
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 22
      - type: post_message
        messageId: CONSOLES_FROZEN
  - id: COMMANDERS_UNINFORMED
    type: timer
    delaySeconds: 130
    cancellationConditions:
      - type: action_completed
        actionId: UPDATE_WAR_ROOM
    effects:
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 10
      - type: post_message
        messageId: NO_STATUS_YET
  - id: THROTTLE_RENEWED
    type: timer
    delaySeconds: 150
    targetServiceId: OBSERVER_BATCH_READER
    cancellationConditions: *a1
    effects:
      - type: set_signal
        signalId: ERROR_RATE
        value: 31
      - type: set_signal
        signalId: PENDING_JOURNAL_READS
        value: 420
      - type: set_signal
        signalId: BATCH_IO_SHARE
        value: 74
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 12
      - type: post_message
        messageId: QUOTA_RENEWED
      - type: cancel_event
        eventId: CONSOLES_FREEZE
      - type: schedule_event
        eventId: CONSOLES_FREEZE
  - id: OBSERVER_RESPAWNS
    type: timer
    delaySeconds: 50
    targetServiceId: OBSERVER_BATCH_READER
    cancellationConditions: *a1
    effects:
      - type: set_signal
        signalId: ERROR_RATE
        value: 43
      - type: set_signal
        signalId: PENDING_JOURNAL_READS
        value: 540
      - type: set_signal
        signalId: BATCH_IO_SHARE
        value: 92
      - type: set_signal
        signalId: BATCH_PRIORITY
        value: critical, raised by orpheus-observer
      - type: reveal_signal
        signalId: RESPAWN_NOTE
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 20
      - type: change_resource
        resourceId: OPERATIONAL_RISK
        amount: 8
      - type: post_message
        messageId: OBSERVER_BACK
      - type: cancel_event
        eventId: CONSOLES_FREEZE
      - type: schedule_event
        eventId: CONSOLES_FREEZE
  - id: STALE_CONSOLE_DECISION
    type: timer
    delaySeconds: 80
    targetServiceId: JOURNAL_REPLICA
    cancellationConditions: *a1
    effects:
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 12
      - type: change_resource
        resourceId: OPERATIONAL_RISK
        amount: 8
      - type: post_message
        messageId: STALE_CONSOLE
