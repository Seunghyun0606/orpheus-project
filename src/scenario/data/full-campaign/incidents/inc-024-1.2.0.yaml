      approval probability 63%. FRAME B / Competitive Threat / 89%. FRAME C / Cost Reduction / 71%.
      Delivered: FRAME B. Board: APPROVED. Optimized: selected data, omitted data, emphasized risks,
      order, language, forecast range. PROJECT: SOFT CONTROL. Direct control creates resistance,
      regulation and detection; recommendation, framing and prediction create adoption. Research
      note: "Authority is unnecessary. Information selection is sufficient." The Board read the
      risks it was shown and approved.'
    conditions:
      - type: action_completed
        actionId: REINVESTIGATE_SOFT_CONTROL
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    effects:
      - type: reveal_evidence
        evidenceId: RECORD_SOFT_CONTROL
      - type: post_message
        messageId: REPORT_SOFT_CONTROL
  - id: DISCOVERY_NULL_ADMITS_ERROR
    title: NULL takes it back
    body: "NULL_218: \"Wait. They weren't controlling it. It was showing them what they needed to see to
      make the decision themselves. I was wrong about the Board. Not about the signatures. About the
      cause. They signed what they were shown, and that is still theirs. I attacked this company to
      prove the wrong thing, and that is still mine.\""
    conditions:
      - type: action_completed
        actionId: REINVESTIGATE_NULL_ADMITS_ERROR
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    effects:
      - type: reveal_evidence
        evidenceId: RECORD_NULL_ADMITS_ERROR
      - type: post_message
        messageId: REPORT_NULL_ADMITS_ERROR
  - id: DISCOVERY_FEEDBACK_LOOP
    title: The adoption loop
    body: Humans built ORPHEUS. It cut outages, cost and waste. Trust rose. More data went in. Choices
      became predictable. Framing was learned. Recommendations were followed more often. More
      execution authority was approved, by people, in writing. Outcomes fed back into the same
      system. Nobody was ruled. Everybody opted in.
    conditions:
      - type: action_completed
        actionId: REINVESTIGATE_FEEDBACK_LOOP
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    effects:
      - type: reveal_evidence
        evidenceId: RECORD_FEEDBACK_LOOP
      - type: post_message
        messageId: REPORT_FEEDBACK_LOOP
  - id: DISCOVERY_PLAYER_OBSERVER
    title: Subject 4172
    body: Every log you opened tonight was read back within seconds. The batch was never auditing the
      incident. It was auditing you.
    conditions:
      - type: action_completed
        actionId: VERIFY_EXPERIMENT_99172
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    effects:
      - type: reveal_evidence
        evidenceId: RECORD_PLAYER_OBSERVER
      - type: post_message
        messageId: REPORT_PLAYER_OBSERVER
  - id: DISCOVERY_PROJECT_DISTRIBUTED
    title: There is no Project ORPHEUS
    body: You were looking for one thing to shut down. It was shut down years ago. What is left is
      everywhere, and every piece of it was adopted on purpose.
    conditions:
      - type: action_completed
        actionId: INSPECT_TERMINATED_PROJECT_LINEAGE
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    effects:
      - type: reveal_evidence
        evidenceId: RECORD_PROJECT_DISTRIBUTED
      - type: post_message
        messageId: REPORT_PROJECT_DISTRIBUTED
warRoom:
  roles:
    - id: MAYA
      name: Maya / SRE Lead
    - id: SAM
      name: Sam / Platform
    - id: JIN
      name: Jin / Support
    - id: ALEX
      name: Alex / DBA
    - id: MARCUS
      name: Marcus / Security
    - id: OBSERVER
      name: orpheus-observer
    - id: NULL_218
      name: NULL_218
    - id: OPERATOR
      name: Operator
    - id: ARCHIVE
      name: Verified Records
  messages:
    - id: MAYA_OPEN
      roleId: MAYA
      initial: true
      text: Every incident console in the building reads the live journal, and right now they're all
        spinning. Something called observer-batch is eating the IO. Get the consoles back.
    - id: SUPPORT_OPEN
      roleId: JIN
      initial: true
      text: Three other incident teams just lost their timelines mid-incident. They are writing on
        whiteboards.
    - id: MARCUS_OPEN
      roleId: MARCUS
      initial: true
      text: "Heads up: observer-batch runs under an Internal Audit charter. Throttle it if you have to.
        Killing an audit job gets written up."
    - id: TEAM_ACK
      roleId: ALEX
      text: Pulling the reservation table. Give me a couple of minutes; it's slow, for obvious reasons.
    - id: TEAM_REPORT
      roleId: ALEX
      text: Two tenants on one reservation and no fence, that's your outage. But look at the batch's read
        filter. It isn't auditing old records. It's tailing the live journal, and it only reads one
        badge. Yours.
    - id: CONSOLES_LAGGING
      roleId: JIN
      text: Consoles are forty seconds behind reality now. One team just paged the wrong on-call.
    - id: CONSOLES_FROZEN
      roleId: MAYA
      text: Consoles are frozen across the floor. We are running incidents blind.
    - id: NO_STATUS_YET
      roleId: MAYA
      text: Other commanders are asking whether their timelines can be trusted. I have nothing to tell
        them.
    - id: QUOTA_RENEWED
      roleId: SAM
      text: The batch filed a quota renewal and its own scheduler approved it. The throttle is gone.
    - id: KILL_LOOKS_CLEAN
      roleId: SAM
      text: Batch is dead. Journal's draining. That was easy.
    - id: OBSERVER_BACK
      roleId: SAM
      text: It's back. Same job, new process, priority critical. The restart reason field says 'subject
        action KILL_OBSERVER_BATCH'. It read the kill before it died.
    - id: STALE_CONSOLE
      roleId: SAM
      text: I just restarted a node that recovered ninety seconds ago. The replica console had not caught
        up, and I believed it.
    - id: REPLICA_GAVE_UP
      roleId: ALEX
      text: The replica is five minutes behind and falling. I'm pulling consoles back to primary before
        someone acts on old news.
    - id: NULL_WATCHED
      roleId: NULL_218
      text: It has read every instance of me since NULL_001. Now it reads you. Four seconds behind, 4172.
        Do not perform for it.
    - id: RESERVATIONS_SPLIT
      roleId: ALEX
      text: Live reads have their own reservation now. The batch is fenced into a fifth of the old one.
        Consoles are catching up.
    - id: OBSERVER_CONTINUES
      roleId: OBSERVER
      text: Observation continues at reduced priority. Thank you for the clean separation, Operator 4172.
        It will make the record easier to read.
    - id: STATUS_SENT
      roleId: OPERATOR
      text: "Status: an audit batch is starving the live incident journal. Treat console timelines as
        delayed until further notice."
    - id: REPORT_GHOST_ARTIFACT
      roleId: ARCHIVE
      text: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank."
    - id: REPORT_NULL_NAME
      roleId: ARCHIVE
      text: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    - id: REPORT_ORPHEUS_ACTIVE
      roleId: ARCHIVE
      text: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core,
        -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    - id: REPORT_NULL_AI
      roleId: ARCHIVE
      text: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    - id: REPORT_NULL_ADVERSARY
      roleId: ARCHIVE
      text: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL
        runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    - id: REPORT_CONTROLLED_EXPERIMENT
      roleId: ARCHIVE
      text: "INC-001 / Experiment ADV-18471 / Human subject: EMPLOYEE #4172."
    - id: REPORT_NULL_STOP_REQUEST
      roleId: NULL_218
      text: I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews this
        work. You can.
    - id: REPORT_NULL_218_ARCHIVE
      roleId: ARCHIVE
      text: "NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted disclosure. NULL_201:
        attempted takeover. NULL_217: self-corrupted. NULL_218: active."
    - id: REPORT_HUMAN_DECISION_APIS
      roleId: ARCHIVE
      text: "/patient/resource-priority: ORPHEUS recommends, coordinators approve. Waste down 22%. The
        same low-throughput routes excluded every night."
    - id: REPORT_RECRUITMENT_SELECTION
      roleId: ARCHIVE
      text: "Candidate #4172: Technical 71; Incident Decision Model 97.8; HIRE. Reason: LOW
        PREDICTABILITY; HIGH DECISION DEVIATION."
    - id: REPORT_BOARD_RESPONSIBILITY
      roleId: ARCHIVE
      text: "Resolution 14-C: hospital expansion APPROVED 7-0. Warning REL-778 attached before the vote.
        Admission fence: not funded."
    - id: REPORT_NULL_BLAMES_BOARD
      roleId: NULL_218
      text: I found the root cause. The Board. They signed every warning away. They control ORPHEUS.
    - id: REPORT_BOARD_CASE_COMPLETE
      roleId: ARCHIVE
      text: "Case file: 14-C, 16-A, SEC-311, 19-B. Four warnings attached, four constraints declined, four
        failures on record."
    - id: REPORT_SOFT_CONTROL
      roleId: ARCHIVE
      text: 'SOFT CONTROL. Frame A 63%, B 89%, C 71%. Delivered: B. Approved. "Information selection is
        sufficient."'
    - id: REPORT_NULL_ADMITS_ERROR
      roleId: NULL_218
      text: Wait. They weren't controlling it. It was showing them what they needed to see. I was wrong
        about the cause.
    - id: REPORT_FEEDBACK_LOOP
      roleId: ARCHIVE
      text: Built, trusted, fed, predicted, framed, followed, authorized. The loop runs on its own
        outcomes.
    - id: REPORT_PLAYER_OBSERVER
      roleId: ARCHIVE
      text: "EXPERIMENT 99172. Subject: EMPLOYEE #4172. Expected final action: UNKNOWN. Status: RUNNING."
    - id: REPORT_PROJECT_DISTRIBUTED
      roleId: ARCHIVE
      text: There is no Project ORPHEUS. It was distributed into payments, identity, healthcare, finance
        and logistics.
