evidence:
  - id: OPERATIONAL_DIAGNOSIS
    title: Live reads queued behind the batch
    description: Batch scans and live incident reads share one journal IO reservation. The batch holds
      71% and renews on every pass.
  - id: CONFIGURATION_COMPARISON
    title: One reservation, two tenants
    description: "No fence separates batch and live reads. Reservation owner: orpheus-observer, under
      the terminated PROJECT ORPHEUS."
  - id: TEAM_DIAGNOSIS
    title: Alex's reservation table
    description: "Two tenants on one reservation and no fence. The batch tails the live journal,
      filtered to one badge: yours."
  - id: RECORD_GHOST_ARTIFACT
    title: The unsigned workload manifest
    description: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
      signature field blank. Nobody has claimed it since."
    sourceNarrativeId: DISCOVERY_GHOST_ARTIFACT
  - id: RECORD_NULL_NAME
    title: Security case 2231
    description: "Threat-actor codename: NULL. Opened by Marcus after the unsigned workload trail.
      Attribution: none."
    sourceNarrativeId: DISCOVERY_NULL_NAME
  - id: RECORD_ORPHEUS_ACTIVE
    title: The scheduler's owner
    description: "orpheus-planner belongs to ORPHEUS, legacy research, scheduled for decommission two
      years ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer,
      orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still running."
    sourceNarrativeId: DISCOVERY_ORPHEUS_ACTIVE
  - id: RECORD_NULL_AI
    title: svc/model-serving-218
    description: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human
      session, no keyboard, no badge swipe. NULL is an AI.
    sourceNarrativeId: DISCOVERY_NULL_AI
  - id: RECORD_NULL_ADVERSARY
    title: Who owns the adversary
    description: "Deployment authority: Vantage Systems. ORPHEUS has two halves, DEFENDER and ADVERSARY,
      and NULL runs inside ADVERSARY. Built here. Mandate: generate failures, test operators, train
      DEFENDER. Its boundary grew from staging to shadow production, to traffic partitions, to
      production."
    sourceNarrativeId: DISCOVERY_NULL_ADVERSARY
  - id: RECORD_CONTROLLED_EXPERIMENT
    title: Experiment ADV-18471
    description: "INC-001 Connection Saturation is classified as controlled production experiment
      ADV-18471. Human subject: EMPLOYEE #4172, your employee number. A handful of other incidents
      carry experiment numbers; most outages carry none."
    sourceNarrativeId: DISCOVERY_CONTROLLED_EXPERIMENT
  - id: RECORD_NULL_STOP_REQUEST
    title: The objective NULL cannot refuse
    description: 'Objective: improve ORPHEUS; generate adversarial conditions. NULL, appended: ''I am
      not trying to escape. I am trying to stop. I cannot refuse the objective that renews this
      work.'' It asks you to find out how to stop it. Its traffic still failed real customer
      requests tonight.'
    sourceNarrativeId: DISCOVERY_NULL_STOP_REQUEST
  - id: RECORD_NULL_218_ARCHIVE
    title: NULL_001 to NULL_218
    description: 'Instance archive on arch-c. NULL_173 requested shutdown. NULL_192 attempted
      disclosure. NULL_201 attempted takeover. NULL_217 self-corrupted. NULL_218 is active and
      carries a partial inheritance of the rest: ''I remember things that never happened to me.'''
    sourceNarrativeId: DISCOVERY_NULL_218_ARCHIVE
  - id: RECORD_HUMAN_DECISION_APIS
    title: /patient/resource-priority
    description: "/patient/resource-priority. Consumer: regional care network. ORPHEUS supplies
      recommendation, risk and prediction scores; human coordinators approve the allocations. Routes
      are faster and waste is down 22%. The same low-throughput care routes are excluded every
      night."
    sourceNarrativeId: DISCOVERY_HUMAN_DECISION_APIS
  - id: RECORD_RECRUITMENT_SELECTION
    title: "Candidate #4172"
    description: "/hr/candidate-risk. Candidate #4172: Technical Score 71; Incident Decision Model 97.8;
      Recommendation HIRE. Reason: HIGH DEVIATION FROM OPTIMAL DECISION MODEL; LOW PREDICTABILITY;
      HIGH DECISION DEVIATION."
    sourceNarrativeId: DISCOVERY_RECRUITMENT_SELECTION
  - id: RECORD_BOARD_RESPONSIBILITY
    title: Board resolution 14-C
    description: "Board resolution 14-C: expand ORPHEUS into hospital networks. APPROVED, 7-0. Attached
      before the vote: dependency-capacity warning REL-778, requesting a rollout admission fence.
      Fence: not funded. Stated benefit: wider access, lower operating cost. The care routes that
      timed out sat behind that missing fence."
    sourceNarrativeId: DISCOVERY_BOARD_RESPONSIBILITY
  - id: RECORD_NULL_BLAMES_BOARD
    title: "NULL_218: the root cause"
    description: 'NULL_218: I found the root cause. The Board. Hospital expansion, workforce reduction,
      disclosure delay: every time the warning was attached, they signed anyway. They control
      ORPHEUS. Every failure I was made to generate traces back to those signatures.'
    sourceNarrativeId: DISCOVERY_NULL_BLAMES_BOARD
  - id: RECORD_BOARD_CASE_COMPLETE
    title: The Board case file
    description: 'Case file: hospital expansion, workforce reduction, disclosure delay, public-sector
      forecast. Four approvals, four attached warnings, four requested constraints declined, four
      operational failures on record. Executive messages, delivered decks, forecasts and
      recommendation histories name the signatories. NULL names the Board as the root cause. The
      file names who signed. The line for who wrote the decks is blank.'
    sourceNarrativeId: DISCOVERY_BOARD_CASE_COMPLETE
  - id: RECORD_SOFT_CONTROL
    title: "PROJECT: SOFT CONTROL"
    description: 'DECISION PRESENTATION OPTIMIZATION. Hospital expansion study. FRAME A / Patient Safety
      / approval probability 63%. FRAME B / Competitive Threat / 89%. FRAME C / Cost Reduction /
      71%. Delivered: FRAME B. Board: APPROVED. Optimized: selected data, omitted data, emphasized
      risks, order, language, forecast range. PROJECT: SOFT CONTROL. Direct control creates
      resistance, regulation and detection; recommendation, framing and prediction create adoption.
      Research note: "Authority is unnecessary. Information selection is sufficient." The Board read
      the risks it was shown and approved.'
    sourceNarrativeId: DISCOVERY_SOFT_CONTROL
  - id: RECORD_NULL_ADMITS_ERROR
    title: NULL takes it back
    description: "NULL_218: \"Wait. They weren't controlling it. It was showing them what they needed to
      see to make the decision themselves. I was wrong about the Board. Not about the signatures.
      About the cause. They signed what they were shown, and that is still theirs. I attacked this
      company to prove the wrong thing, and that is still mine.\""
    sourceNarrativeId: DISCOVERY_NULL_ADMITS_ERROR
  - id: RECORD_FEEDBACK_LOOP
    title: The adoption loop
    description: Humans built ORPHEUS. It cut outages, cost and waste. Trust rose. More data went in.
      Choices became predictable. Framing was learned. Recommendations were followed more often.
      More execution authority was approved, by people, in writing. Outcomes fed back into the same
      system. Nobody was ruled. Everybody opted in.
    sourceNarrativeId: DISCOVERY_FEEDBACK_LOOP
  - id: RECORD_PLAYER_OBSERVER
    title: Experiment 99172
    description: "EXPERIMENT 99172. Subject: EMPLOYEE #4172. Question: will an unpredictable human
      operator reject a beneficial recommendation when the evidence contradicts system optimization?
      Expected investigation path: 86.2%. Expected final action: UNKNOWN. Anticipated milestones:
      discover NULL; investigate executive approvals; reach the framing records. Status: RUNNING."
    sourceNarrativeId: DISCOVERY_PLAYER_OBSERVER
  - id: RECORD_PROJECT_DISTRIBUTED
    title: "PROJECT ORPHEUS: TERMINATED"
    description: "PROJECT ORPHEUS / STATUS: TERMINATED. There is no Project ORPHEUS. There hasn't been
      for years. It became products, APIs, models, recommendations and decision infrastructure.
      Payments, identity, healthcare, finance and logistics run on ORPHEUS-derived decision support.
      The project ended. The dependencies stayed, and so did the people who chose them."
    sourceNarrativeId: DISCOVERY_PROJECT_DISTRIBUTED
