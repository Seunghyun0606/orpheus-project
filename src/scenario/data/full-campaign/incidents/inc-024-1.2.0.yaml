      - type: set_signal
        signalId: PENDING_JOURNAL_READS
        value: 450
      - type: set_signal
        signalId: REPLICA_LAG_SECONDS
        value: 310
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 10
      - type: post_message
        messageId: REPLICA_GAVE_UP
