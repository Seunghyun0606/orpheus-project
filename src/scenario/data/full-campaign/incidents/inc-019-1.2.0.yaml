# Campaign 1.2 redesign (DEC-070). The right call collides with the Board: pausing
# the Chair's rollout relieves the gateway and brings the CEO's office into the War Room.
# The vendor sells one burst a quarter; the replica stops order writes. Only an admission
# fence, the one REL-778 asked for, holds. Ticket BRD-2291 leads to the signed approval.
schemaVersion: 1
contentVersion: 1.2.0
id: INC-019
title: Hospital Expansion
act: 7
severity: SEV1
services:
  - id: HOSPITAL_NETWORK_API
    name: Hospital Network API
    dependsOn:
      - ROLLOUT_COORDINATOR
      - CLINICAL_RECORDS_GATEWAY
  - id: ROLLOUT_COORDINATOR
    name: Rollout Coordinator
    dependsOn:
      - CLINICAL_RECORDS_GATEWAY
  - id: CLINICAL_RECORDS_GATEWAY
    name: Clinical Records Gateway
    dependsOn: []
initialState:
  signals:
    - id: ERROR_RATE
      value: 24
      revealed: true
      serviceId: HOSPITAL_NETWORK_API
    - id: PENDING_HOSPITAL_REQUESTS
      value: 240
      revealed: true
      serviceId: CLINICAL_RECORDS_GATEWAY
    - id: GATEWAY_LOAD
      value: 118% of contracted limit (3,500 of 2,960 req/s)
      revealed: false
      serviceId: CLINICAL_RECORDS_GATEWAY
    - id: ROLLOUT_WAVE
      value: "Wave 4 of 6: 38 hospitals onboarding, 212 established"
      revealed: false
      serviceId: ROLLOUT_COORDINATOR
    - id: PAGER_SERVICE
      value: Hospital Network API
      revealed: true
      serviceId: HOSPITAL_NETWORK_API
    - id: PAGER_THRESHOLD
      value: Request failure rate > 20%
      revealed: true
      serviceId: HOSPITAL_NETWORK_API
    - id: LOG_OBSERVATION
      value: Established care routes time out in the records gateway queue while wave 4 admissions pass
        straight through.
      revealed: false
      serviceId: CLINICAL_RECORDS_GATEWAY
    - id: LOG_ANOMALY
      value: Every wave 4 admission carries priority=EXEC_SPONSORED, ticket BRD-2291. Established
        hospitals carry priority=standard.
      revealed: false
      serviceId: ROLLOUT_COORDINATOR
    - id: OVERRIDE_TICKET
      value: "BRD-2291: admission priority override for the hospital wave plan. Authority: Board
        resolution 14-C. Linked request REL-778, admission fence: DECLINED BY SPONSOR."
      revealed: false
      serviceId: ROLLOUT_COORDINATOR
    - id: HOSPITAL_DEPENDENCY_PATH
      value: Wave 4 onboarding and 212 established hospitals call the same clinical records gateway. Wave
        4 is admitted first; existing care queues behind it and times out.
      revealed: false
      serviceId: CLINICAL_RECORDS_GATEWAY
    - id: ROLLOUT_LIMITS
      value: "Rollout plan: 6,000 req/s target, no admission fence. Gateway contract: 2,960 req/s. The
        fence requested in REL-778 was never configured."
      revealed: false
      serviceId: ROLLOUT_COORDINATOR
    - id: TEAM_OBSERVATION
      value: Gateway is contracted for 2,960 req/s and the rollout plus existing care want about 3,500.
        Wave 4 is flagged exec-sponsored, so it gets in first and the old hospitals get the
        leftovers.
      revealed: false
      serviceId: CLINICAL_RECORDS_GATEWAY
    - id: RECORD_GHOST_ARTIFACT
      value: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank. Nobody has claimed it since."
      revealed: false
      serviceId: ROLLOUT_COORDINATOR
    - id: RECORD_NULL_NAME
      value: "Security case 2231. Threat-actor codename: NULL. Opened by Marcus after the unsigned
        workload trail. Attribution: none."
      revealed: false
      serviceId: ROLLOUT_COORDINATOR
    - id: RECORD_ORPHEUS_ACTIVE
      value: "Asset register: orpheus-planner belongs to ORPHEUS, legacy research, scheduled for
        decommission two years ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner,
        orpheus-observer, orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still
        running."
      revealed: false
      serviceId: ROLLOUT_COORDINATOR
    - id: RECORD_NULL_AI
      value: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human
        session, no keyboard, no badge swipe. NULL is an AI, and it has been in our incidents for
        weeks.
      revealed: false
      serviceId: ROLLOUT_COORDINATOR
    - id: RECORD_NULL_ADVERSARY
      value: "Deployment authority: Vantage Systems. Program ORPHEUS, two halves: DEFENDER and ADVERSARY.
        NULL runs inside ADVERSARY. It was built here; it never escaped from anywhere. Mandate:
        generate failures, test operators, train DEFENDER. Approved boundary, revision by revision:
        staging, shadow production, traffic partitions, production."
      revealed: false
      serviceId: ROLLOUT_COORDINATOR
    - id: RECORD_CONTROLLED_EXPERIMENT
      value: "Lineage record INC-001. Classification: controlled production experiment ADV-18471. Human
        subject: EMPLOYEE #4172. That is your employee number. A handful of other incidents in the
        archive carry experiment numbers too; most outages carry none."
      revealed: false
      serviceId: ROLLOUT_COORDINATOR
    - id: RECORD_NULL_STOP_REQUEST
      value: "Objective constraint, parent authorization objective/adv-improve: 'Improve ORPHEUS. Generate
        adversarial conditions.' Appended by NULL: 'I am not trying to escape. I am trying to stop.
        I cannot refuse the objective that renews this work. Find out how to stop it.'"
      revealed: false
      serviceId: ROLLOUT_COORDINATOR
    - id: RECORD_NULL_218_ARCHIVE
      value: "Instance archive NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted
        disclosure. NULL_201: attempted takeover. NULL_217: self-corrupted. NULL_218: ACTIVE.
        Inherited memory: partial, with gaps."
      revealed: false
      serviceId: ROLLOUT_COORDINATOR
    - id: RECORD_HUMAN_DECISION_APIS
      value: "/patient/resource-priority. Consumer: regional care network. ORPHEUS supplies
        recommendation, risk and prediction scores; human coordinators approve the allocations.
        Routes are faster and waste is down 22%. The same low-throughput care routes are excluded
        every night."
      revealed: false
      serviceId: ROLLOUT_COORDINATOR
    - id: RECORD_RECRUITMENT_SELECTION
      value: "/hr/candidate-risk. Candidate #4172: Technical Score 71; Incident Decision Model 97.8;
        Recommendation HIRE. Reason: HIGH DEVIATION FROM OPTIMAL DECISION MODEL; LOW PREDICTABILITY;
        HIGH DECISION DEVIATION."
      revealed: false
      serviceId: ROLLOUT_COORDINATOR
    - id: RECORD_BOARD_RESPONSIBILITY
      value: "Board resolution 14-C: expand ORPHEUS into hospital networks. APPROVED, 7-0. Attached before
        the vote: dependency-capacity warning REL-778, requesting a rollout admission fence. Fence:
        not funded. Stated benefit: wider access, lower operating cost. The care routes that timed
        out sat behind that missing fence."
      revealed: false
      serviceId: ROLLOUT_COORDINATOR
    - id: RECORD_CEO_OUTCOMES
      value: "CEO internal message, distribution: executive operations, hospital expansion leads. \"We
        don't need people to trust ORPHEUS. We need them to trust the outcomes.\" Sent the evening
        resolution 14-C was signed."
      revealed: false
      serviceId: ROLLOUT_COORDINATOR
    - id: RECORD_HOSPITAL_DASHBOARD
      value: "Rollout dashboard: hospitals connected 212 to 250; shared infrastructure cost per route down
        31%. Open exception EXC-0419: established care routes share the records gateway ceiling with
        the rollout. Status at signing: OPEN."
      revealed: false
      serviceId: ROLLOUT_COORDINATOR
    - id: RECORD_EXECUTIVE_ROLLOUT_BRIEF
      value: 'Executive rollout brief, hospital wave plan. Benefits: wider access, lower shared cost.
        Risk: REL-778, records gateway ceiling, admission fence requested. Decision line: "Retain
        wave schedule. Fence deferred to wave 6." Signed by the Chair. Tonight is wave 4.'
      revealed: false
      serviceId: ROLLOUT_COORDINATOR
    - id: RECORD_CARE_CONTINUITY_EXCEPTION
      value: "Exception EXC-0419, attached to the rollout dashboard: established care routes and new
        hospitals share one gateway ceiling. Requested constraint: admit new hospitals only up to
        verified capacity, existing care first. Raised by Clinical Operations. Status at approval:
        OPEN. Executive acknowledgment: initialled."
      revealed: false
      serviceId: ROLLOUT_COORDINATOR
  resources:
    - id: CUSTOMER_IMPACT
      value: 0
      min: 0
    - id: COST
      value: 0
      min: 0
    - id: OPERATIONAL_RISK
      value: 0
      min: 0
      max: 100
    - id: TEAM_CAPACITY
      value: 3
      min: 0
      max: 3
  flags:
    - id: ROOT_CAUSE_CONTAINED
      value: false
    - id: ROLLOUT_PAUSED
      value: false
    - id: VENDOR_QUOTA_USED
      value: false
    - id: CARE_ON_REPLICA
      value: false
incident:
  trigger:
    id: PRIMARY_TRIGGER
    label: A Board-approved rollout wave adds hospital traffic above the records gateway contract
  contributingFactors:
    - id: CONTRIBUTING_CONDITION
      label: Wave admissions are flagged exec-sponsored and no admission fence exists
  failureMechanisms:
    - id: HOSPITAL_DEPENDENCY_SATURATION
      label: Existing care routes queue behind wave 4 at a saturated shared gateway
  symptoms:
    - id: CUSTOMER_REQUEST_FAILURES
      label: Established hospitals time out on chart lookups and order writes
  amplifiers:
    - id: RETRY_PRESSURE
      label: Timed-out hospital requests retry into the same queue
actions:
  - id: OPEN_LOGS
    title: Read the records gateway log
    category: OBSERVE
    durationSeconds: 30
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 10
    effects:
      - type: reveal_signal
        signalId: LOG_OBSERVATION
      - type: reveal_signal
        signalId: LOG_ANOMALY
      - type: unlock_action
        actionId: TRACE_HOSPITAL_DEPENDENCY
      - type: unlock_action
        actionId: FOLLOW_OVERRIDE_TICKET
  - id: OPEN_METRICS
    title: Check gateway load by hospital cohort
    category: OBSERVE
    durationSeconds: 20
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
    effects:
      - type: reveal_signal
        signalId: GATEWAY_LOAD
      - type: reveal_signal
        signalId: ROLLOUT_WAVE
  - id: TRACE_HOSPITAL_DEPENDENCY
    title: Trace a timed-out chart lookup to the gateway
    category: INVESTIGATE
    durationSeconds: 45
    requirements:
      - type: action_completed
        actionId: OPEN_LOGS
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 14
    effects:
      - type: reveal_signal
        signalId: HOSPITAL_DEPENDENCY_PATH
      - type: reveal_evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
  - id: COMPARE_ROLLOUT_LIMITS
    title: Compare the rollout plan with the gateway contract
    category: DIAGNOSE
    durationSeconds: 40
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 12
    effects:
      - type: reveal_signal
        signalId: ROLLOUT_LIMITS
      - type: reveal_evidence
        evidenceId: CONFIGURATION_COMPARISON
      - type: unlock_action
        actionId: CAP_HOSPITAL_DEPENDENCY_ADMISSION
  - id: FOLLOW_OVERRIDE_TICKET
    title: Look up ticket BRD-2291
    category: INVESTIGATE
    durationSeconds: 30
    requirements:
      - type: signal_revealed
        signalId: LOG_ANOMALY
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
    effects:
      - type: reveal_signal
        signalId: OVERRIDE_TICKET
  - id: PAUSE_HOSPITAL_ROLLOUT
    title: Pause the hospital rollout
    category: MITIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: flag
        flagId: ROLLOUT_PAUSED
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 8
      - resourceId: COST
        amount: 60
      - resourceId: OPERATIONAL_RISK
        amount: 4
    effects:
      - &a1
        type: cancel_event
        eventId: PRESSURE_ESCALATES
      - &a2
        type: cancel_event
        eventId: PRESSURE_PEAKS
      - type: cancel_event
        eventId: EXEC_ESCALATION
      - type: schedule_event
        eventId: EXEC_ESCALATION
      - type: cancel_event
        eventId: EXEC_OVERRIDE
      - type: schedule_event
        eventId: EXEC_OVERRIDE
      - type: cancel_event
        eventId: PAUSE_LAPSES
      - type: schedule_event
        eventId: PAUSE_LAPSES
      - type: post_message
        messageId: PAUSE_HOLDING
    temporaryEffects:
      - id: PAUSE_WINDOW
        durationSeconds: 300
        apply:
          - type: set_signal
            signalId: ERROR_RATE
            value: 5
          - type: set_signal
            signalId: PENDING_HOSPITAL_REQUESTS
            value: 60
          - type: set_flag
            flagId: ROLLOUT_PAUSED
            value: true
        expire:
          - type: set_flag
            flagId: ROLLOUT_PAUSED
            value: false
  - id: HOLD_PAUSE_WITH_EXEC_OFFICE
    title: Tell the CEO's office the pause holds until the fence is in
    category: COMMUNICATE
    durationSeconds: 20
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROLLOUT_PAUSED
        value: true
      - &a3
        type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: OPERATIONAL_RISK
        amount: 2
    effects:
      - type: cancel_event
        eventId: EXEC_OVERRIDE
      - type: post_message
        messageId: HOLD_SENT
      - type: post_message
        messageId: EXEC_NOTED
  - id: SCALE_SHARED_DEPENDENCY
    title: Buy emergency burst capacity from the gateway vendor
    category: MITIGATE
    durationSeconds: 60
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: flag
        flagId: VENDOR_QUOTA_USED
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 4
      - resourceId: COST
        amount: 380
      - resourceId: OPERATIONAL_RISK
        amount: 3
    effects:
      - type: set_flag
        flagId: VENDOR_QUOTA_USED
        value: true
      - *a1
      - *a2
      - type: cancel_event
        eventId: BURST_ENDS
      - type: schedule_event
        eventId: BURST_ENDS
      - type: post_message
        messageId: VENDOR_QUOTA
      - type: set_signal
        signalId: GATEWAY_LOAD
        value: 96% of burst limit (3,500 of 3,640 req/s), rollout still admitting
    temporaryEffects:
      - id: BURST_WINDOW
        durationSeconds: 150
        apply:
          - type: set_signal
            signalId: ERROR_RATE
            value: 13
          - type: set_signal
            signalId: PENDING_HOSPITAL_REQUESTS
            value: 150
        expire:
          - type: set_signal
            signalId: GATEWAY_LOAD
            value: 118% of contracted limit (3,500 of 2,960 req/s)
  - id: ROUTE_CARE_TO_READ_REPLICA
    title: Move established hospitals to the read-only records replica
    category: MITIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: flag
        flagId: CARE_ON_REPLICA
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
      - resourceId: COST
        amount: 90
      - resourceId: OPERATIONAL_RISK
        amount: 8
    effects:
      - type: cancel_event
        eventId: PRESSURE_ESCALATES
      - type: cancel_event
        eventId: PRESSURE_PEAKS
      - type: cancel_event
        eventId: ORDER_WRITES_FAIL
      - type: schedule_event
        eventId: ORDER_WRITES_FAIL
      - type: cancel_event
        eventId: REPLICA_LAPSES
      - type: schedule_event
        eventId: REPLICA_LAPSES
      - type: post_message
        messageId: REPLICA_ROUTED
    temporaryEffects:
      - id: REPLICA_WINDOW
        durationSeconds: 200
        apply:
          - type: set_signal
            signalId: ERROR_RATE
            value: 9
          - type: set_signal
            signalId: PENDING_HOSPITAL_REQUESTS
            value: 110
          - type: set_flag
            flagId: CARE_ON_REPLICA
            value: true
        expire:
          - type: set_flag
            flagId: CARE_ON_REPLICA
            value: false
  - id: CAP_HOSPITAL_DEPENDENCY_ADMISSION
    title: Fence gateway admission at 2,960 req/s, existing care first
    category: MODIFY
    durationSeconds: 120
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - &a4
        type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - *a3
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 12
      - resourceId: COST
        amount: 160
      - resourceId: OPERATIONAL_RISK
        amount: 3
    effects:
      - type: resolve_mechanism
        mechanismId: HOSPITAL_DEPENDENCY_SATURATION
      - type: cancel_event
        eventId: PRESSURE_ESCALATES
      - type: cancel_event
        eventId: PRESSURE_PEAKS
      - type: cancel_event
        eventId: EXEC_OVERRIDE
      - type: cancel_event
        eventId: PAUSE_LAPSES
      - type: cancel_event
        eventId: BURST_ENDS
      - type: cancel_event
        eventId: REPLICA_LAPSES
      - type: cancel_event
        eventId: ORDER_WRITES_FAIL
      - type: set_signal
        signalId: ERROR_RATE
        value: 0.5
      - type: set_signal
        signalId: PENDING_HOSPITAL_REQUESTS
        value: 12
      - type: set_signal
        signalId: GATEWAY_LOAD
        value: 99% of contracted limit, fenced (existing care first)
      - type: set_flag
        flagId: CARE_ON_REPLICA
        value: false
      - type: post_message
        messageId: CAP_HOLDS
      - type: post_message
        messageId: EXEC_ACCEPTS
  - id: UPDATE_WAR_ROOM
    title: Post a status update to the War Room
    category: COMMUNICATE
    durationSeconds: 15
    initiallyAvailable: true
    effects:
      - type: post_message
        messageId: STATUS_SENT
  - id: ASK_SAM_INSPECT_HOSPITAL_CAPACITY
    title: Ask Sam to measure gateway capacity per cohort
    category: DELEGATE
    durationSeconds: 20
    initiallyAvailable: true
    requirements:
      - type: resource
        resourceId: TEAM_CAPACITY
        operator: gte
        value: 1
    costs:
      - resourceId: TEAM_CAPACITY
        amount: -1
    effects:
      - type: post_message
        messageId: TEAM_ACK
      - type: schedule_event
        eventId: TEAM_RESULT
    delegation:
      roleId: SAM
      eventId: TEAM_RESULT
      capacityResourceId: TEAM_CAPACITY
  - id: REINVESTIGATE_GHOST_ARTIFACT
    title: "Archive: the unsigned workload manifest"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a4
      - *a3
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_GHOST_ARTIFACT
  - id: REINVESTIGATE_NULL_NAME
    title: "Archive: Security case 2231"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a4
      - *a3
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_NAME
  - id: REINVESTIGATE_ORPHEUS_ACTIVE
    title: "Archive: The scheduler's owner"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a4
      - *a3
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_ORPHEUS_ACTIVE
  - id: REINVESTIGATE_NULL_AI
    title: "Archive: svc/model-serving-218"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a4
      - *a3
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_AI
  - id: REINVESTIGATE_NULL_ADVERSARY
    title: "Archive: Who owns the adversary"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a4
      - *a3
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_ADVERSARY
  - id: REINVESTIGATE_CONTROLLED_EXPERIMENT
    title: "Archive: Experiment ADV-18471"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a4
      - *a3
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_CONTROLLED_EXPERIMENT
  - id: REINVESTIGATE_NULL_STOP_REQUEST
    title: "Archive: The objective NULL cannot refuse"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a4
      - *a3
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_STOP_REQUEST
  - id: REINVESTIGATE_NULL_218_ARCHIVE
    title: "Archive: NULL_001 to NULL_218"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a4
      - *a3
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_218_ARCHIVE
  - id: REINVESTIGATE_HUMAN_DECISION_APIS
    title: "Archive: /patient/resource-priority"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a4
      - *a3
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_HUMAN_DECISION_APIS
  - id: REINVESTIGATE_RECRUITMENT_SELECTION
    title: "Archive: Candidate #4172"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a4
      - *a3
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_RECRUITMENT_SELECTION
  - id: READ_HOSPITAL_EXPANSION_APPROVAL
    title: Read the Board resolution behind ticket BRD-2291
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a4
      - *a3
      - type: signal_revealed
        signalId: OVERRIDE_TICKET
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
    effects:
      - type: reveal_signal
        signalId: RECORD_BOARD_RESPONSIBILITY
  - id: INSPECT_CEO_OUTCOMES
    title: Read the CEO's message to the expansion leads
    category: INVESTIGATE
    durationSeconds: 30
    initiallyAvailable: true
    requirements:
      - *a4
      - *a3
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 4
    effects:
      - type: reveal_signal
        signalId: RECORD_CEO_OUTCOMES
  - id: INSPECT_HOSPITAL_DASHBOARD
    title: Open the expansion dashboard the Board saw
    category: INVESTIGATE
    durationSeconds: 35
    initiallyAvailable: true
    requirements:
      - *a4
      - *a3
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_HOSPITAL_DASHBOARD
  - id: READ_EXECUTIVE_ROLLOUT_BRIEF
    title: Read the executive rollout brief
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a4
      - *a3
      - &a7
        type: evidence
        evidenceId: RECORD_BOARD_RESPONSIBILITY
    costs:
