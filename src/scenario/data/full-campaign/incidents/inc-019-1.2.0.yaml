warRoom:
  roles:
    - id: MAYA
      name: Maya / SRE Lead
    - id: SAM
      name: Sam / Platform
    - id: JIN
      name: Jin / Support
    - id: MARCUS
      name: Marcus / Security
    - id: OPERATOR
      name: Operator
    - id: ARCHIVE
      name: Verified Records
    - id: NULL_218
      name: NULL_218
    - id: EXEC_OFFICE
      name: Office of the CEO
  messages:
    - id: MAYA_OPEN
      roleId: MAYA
      text: Hospital Network API is paging. Wave 4 of the hospital rollout went live an hour ago and the
        timeouts started twenty minutes later. Find out what they share.
      initial: true
    - id: SUPPORT_OPEN
      roleId: JIN
      text: Established hospitals are timing out on chart lookups. St. Aldric's emergency department is
        re-keying orders by hand.
      initial: true
    - id: TEAM_ACK
      roleId: SAM
      text: Measuring gateway throughput per cohort. Back in about a minute and a half.
    - id: TEAM_REPORT
      roleId: SAM
      text: Gateway's contracted for 2,960 requests a second. Wave 4 plus the old hospitals want about
        3,500. The rollout gets in first because its admissions are flagged exec-sponsored. The old
        hospitals get the leftovers.
    - id: SUPPORT_ESCALATION
      roleId: JIN
      text: Harrow General's emergency department just lost charting. They're on paper.
    - id: SUPPORT_PEAK
      roleId: JIN
      text: Forty percent of hospital requests are failing. Lakeside Regional has started diverting
        ambulances.
    - id: NO_STATUS_YET
      roleId: JIN
      text: Hospital IT directors have heard nothing from us. Two of them called the CEO's office
        directly.
    - id: PAUSE_HOLDING
      roleId: SAM
      text: Rollout coordinator paused. Wave 4 is parked at the door and the gateway is breathing again.
        Thirty-eight hospitals just stopped onboarding.
    - id: EXEC_DEMAND
      roleId: EXEC_OFFICE
      text: Office of the CEO. Wave 4 of the hospital rollout is a Board commitment, signed by the Chair.
        Who authorised a pause, and when does it lift?
    - id: MAYA_SHIELD
      roleId: MAYA
      text: I've got the CEO's office on the other line. Your call is right; the gateway can't carry both.
        Give me numbers I can hold them with, or they'll resume it themselves.
    - id: EXEC_RESUMED
      roleId: SAM
      text: "Somebody resumed the rollout coordinator from outside the bridge. Credential: exec-ops. Wave
        4 is back on the gateway."
    - id: HOLD_SENT
      roleId: OPERATOR
      text: "To the Office of the CEO: the records gateway is contracted for 2,960 requests a second; the
        rollout plus existing care need 3,500. The pause holds until admission is fenced at that
        limit. Wave 4 then resumes at the verified rate."
    - id: EXEC_NOTED
      roleId: EXEC_OFFICE
      text: Noted. The pause, and your name, will be in the Chair's briefing.
    - id: PAUSE_OVER
      roleId: SAM
      text: Pause window closed. Wave 4 resumed on schedule and the gateway is over its limit again.
    - id: VENDOR_QUOTA
      roleId: SAM
      text: Vendor gave us one emergency burst on the records gateway. That's the whole quarter's quota,
        and the rollout coordinator is already admitting wave 4 into the new headroom.
    - id: BURST_OVER
      roleId: SAM
      text: Burst capacity expired. There is no second burst this quarter.
    - id: REPLICA_ROUTED
      roleId: SAM
      text: "Established hospitals are reading from the replica now. It's read-only: charts open, orders
        won't save."
    - id: ORDERS_FAILING
      roleId: JIN
      text: Three hospitals can read charts but can't write orders. Harrow General's pharmacy is back on
        paper.
    - id: REPLICA_OVER
      roleId: SAM
      text: Replica lag passed five minutes, so I swung care routes back to the primary. We are sharing
        the gateway with wave 4 again.
    - id: CAP_HOLDS
      roleId: SAM
      text: Admission fence is live at 2,960. Existing care goes first; wave 4 takes what is left and
        onboards about six hospitals an hour. Timeouts are gone.
    - id: EXEC_ACCEPTS
