    - id: CONTRIBUTING_CONDITION
      label: The reader retries the same replica without checksum-based exclusion
  failureMechanisms:
    - id: CORRUPT_REPLICA_RETRY_LOOP
      label: Repeated corrupt responses saturate archive reader capacity
  symptoms:
    - id: CUSTOMER_REQUEST_FAILURES
      label: Archive API request failures exceed the pager threshold
  amplifiers:
