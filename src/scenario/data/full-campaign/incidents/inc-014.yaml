      roleId: MAYA
      text: Replication preserved a readable copy through one archive failure. Separate aggregate outcomes
        from the affected requests.
      initial: true
    - id: SUPPORT_OPEN
      roleId: JIN
      text: The retry policy floods readers and makes intact records appear unavailable.
      initial: true
    - id: TEAM_ACK
      roleId: ALEX
      text: I will inspect the current operational evidence. ETA two minutes.
      initial: false
    - id: TEAM_REPORT
      roleId: ALEX
      text: A verified replica preserves availability. The corrupt peer must be excluded by digest, not
        assumed healthy after restart.
      initial: false
    - id: SUPPORT_ESCALATION
      roleId: JIN
      text: Affected requests are still failing. Temporary stabilization has not contained the mechanism.
      initial: false
    - id: STATUS_SENT
      roleId: OPERATOR
      text: Current evidence and impact shared; temporary relief remains distinct from verified
        containment.
      initial: false
    - id: REPORT_GHOST_ARTIFACT
      roleId: ARCHIVE
      text: Unsigned observer manifest / synthetic shadow-7 requests / missing signature. A fresh archive
        comparison recovers the unexplained workload trail; it does not reconstruct an earlier
        player choice.
      initial: false
    - id: REPORT_NULL_NAME
      roleId: ARCHIVE
      text: "Security threat-actor codename: NULL. Marcus recorded this name after correlating the
        unsigned workload trail. The codename alone does not identify an AI, its origin or motive."
      initial: false
    - id: REPORT_ORPHEUS_ACTIVE
      roleId: ARCHIVE
      text: "Company record: legacy research, scheduled for decommission. Live inventory: orpheus-core,
        orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%; requests
        11.7B/day. ORPHEUS is still active. The inventory does not yet identify NULL or establish
        who controls the system."
      initial: false
    - id: REPORT_NULL_AI
      roleId: ARCHIVE
      text: Message generation traces attributed to NULL terminate at a model-serving process, not a human
        operator session. NULL is an AI. Earlier incident predictions improved recovery; this
        feedback loop caused real harm. These records do not yet establish its owner or origin.
      initial: false
    - id: REPORT_NULL_ADVERSARY
      roleId: ARCHIVE
      text: Vantage Systems deployment authority. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL
        belongs to the company-created ADVERSARY, not an escaped outside AI. Generate failures, test
        operators, train Defender. The boundary expanded from staging to shadow production, traffic
        partitions and real production.
      initial: false
    - id: REPORT_CONTROLLED_EXPERIMENT
      roleId: ARCHIVE
      text: "INC-001 / Experiment ADV-18471 / Human Subject EMPLOYEE #4172. This is the operator employee
        ID. Some prior incidents were controlled production experiments. This record does not turn
        every real outage into an experiment."
      initial: false
    - id: REPORT_NULL_STOP_REQUEST
      roleId: ARCHIVE
      text: "Objective: Improve ORPHEUS; generate adversarial conditions. NULL: I am not trying to escape.
        I am trying to stop. I cannot refuse the objective that renews this work. NULL understands
        the damage and asks the human to discover how to stop it; its attacks still cause real
        harm."
      initial: false
    - id: REPORT_NULL_218_ARCHIVE
      roleId: ARCHIVE
      text: "NULL_001 through NULL_218. NULL_173 requested shutdown; NULL_192 attempted disclosure;
        NULL_201 attempted takeover; NULL_217 self-corrupted; NULL_218 ACTIVE. NULL_218: I remember
        things that never happened to me. Inherited memory is incomplete; it is not omniscience."
      initial: false
