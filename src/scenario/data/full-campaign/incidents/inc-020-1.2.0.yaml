# Campaign 1.2 redesign (DEC-070). The humane move is the right one and it costs:
# volunteers on overtime take every task by hand and tie up the team. Automation is
# fastest and quietly closes tasks it scores as low value. Parking retries only hides
# the queue. Change WF-118 in the router log leads to the signed reduction.
schemaVersion: 1
contentVersion: 1.2.0
id: INC-020
title: Workforce Reduction
act: 7
severity: SEV2
services:
  - id: RECOVERY_QUEUE_API
    name: Recovery Queue API
    dependsOn:
      - OPERATOR_COVERAGE_ROUTER
  - id: OPERATOR_COVERAGE_ROUTER
    name: Operator Coverage Router
    dependsOn:
      - ROTATION_DIRECTORY
  - id: ROTATION_DIRECTORY
    name: Rotation Directory
    dependsOn: []
initialState:
  signals:
    - id: ERROR_RATE
      value: 14
      revealed: true
      serviceId: RECOVERY_QUEUE_API
    - id: UNCOVERED_RECOVERY_TASKS
      value: 86
      revealed: true
      serviceId: RECOVERY_QUEUE_API
    - id: OLDEST_TASK_AGE
      value: 41 min
      revealed: false
      serviceId: RECOVERY_QUEUE_API
    - id: TASK_MIX
      value: refunds 31 / account unlocks 22 / benefit transfers 19 / accessibility requests 14
      revealed: false
      serviceId: RECOVERY_QUEUE_API
    - id: PAGER_SERVICE
      value: Recovery Queue API
      revealed: true
      serviceId: RECOVERY_QUEUE_API
    - id: PAGER_THRESHOLD
      value: Recovery task failure rate > 10%
      revealed: true
      serviceId: RECOVERY_QUEUE_API
    - id: LOG_OBSERVATION
      value: "Assignment to rotation recovery-east-2 timed out: no staffed operator. Retrying the same
        owner."
      revealed: false
      serviceId: OPERATOR_COVERAGE_ROUTER
    - id: LOG_ANOMALY
      value: "Rotation directory: recovery-east-2 removed under change WF-118 at 23:58 yesterday. Queue
        reassignment step: DEFERRED."
      revealed: false
      serviceId: OPERATOR_COVERAGE_ROUTER
    - id: CHANGE_RECORD
      value: 'WF-118: remove recovery rotations east-2 and west-1. Approver: Executive Staffing Committee,
        under Board resolution 16-A. Step 3, reassign queue owners: deferred "until after headcount
        close".'
      revealed: false
      serviceId: OPERATOR_COVERAGE_ROUTER
    - id: RECOVERY_COVERAGE_PATH
      value: Every recovery task is assigned to recovery-east-2, which has no members. The emergency
        rotation recovery-oncall has nine people on shift; the queue never asks them.
      revealed: false
      serviceId: OPERATOR_COVERAGE_ROUTER
    - id: STAFFING_ROUTE_GENERATIONS
      value: Queue ownership table generation 88 predates the reduction. Rotation directory generation 91
        removed recovery-east-2 and recovery-west-1. Nobody re-pointed the queues.
      revealed: false
      serviceId: OPERATOR_COVERAGE_ROUTER
    - id: TEAM_OBSERVATION
      value: The queue still assigns to recovery-east-2, a rotation deleted yesterday with the cuts.
        Emergency operators exist; nobody pointed the queue at them.
      revealed: false
      serviceId: OPERATOR_COVERAGE_ROUTER
    - id: AUTOMATION_CLOSURES
      value: No automation runs tonight.
      revealed: false
      serviceId: RECOVERY_QUEUE_API
    - id: RECORD_GHOST_ARTIFACT
      value: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank. Nobody has claimed it since."
      revealed: false
      serviceId: OPERATOR_COVERAGE_ROUTER
    - id: RECORD_NULL_NAME
      value: "Security case 2231. Threat-actor codename: NULL. Opened by Marcus after the unsigned
        workload trail. Attribution: none."
      revealed: false
      serviceId: OPERATOR_COVERAGE_ROUTER
    - id: RECORD_ORPHEUS_ACTIVE
      value: "Asset register: orpheus-planner belongs to ORPHEUS, legacy research, scheduled for
        decommission two years ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner,
        orpheus-observer, orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still
        running."
      revealed: false
      serviceId: OPERATOR_COVERAGE_ROUTER
    - id: RECORD_NULL_AI
      value: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human
        session, no keyboard, no badge swipe. NULL is an AI, and it has been in our incidents for
        weeks.
      revealed: false
      serviceId: OPERATOR_COVERAGE_ROUTER
    - id: RECORD_NULL_ADVERSARY
      value: "Deployment authority: Vantage Systems. Program ORPHEUS, two halves: DEFENDER and ADVERSARY.
        NULL runs inside ADVERSARY. It was built here; it never escaped from anywhere. Mandate:
        generate failures, test operators, train DEFENDER. Approved boundary, revision by revision:
        staging, shadow production, traffic partitions, production."
      revealed: false
      serviceId: OPERATOR_COVERAGE_ROUTER
    - id: RECORD_CONTROLLED_EXPERIMENT
      value: "Lineage record INC-001. Classification: controlled production experiment ADV-18471. Human
        subject: EMPLOYEE #4172. That is your employee number. A handful of other incidents in the
        archive carry experiment numbers too; most outages carry none."
      revealed: false
      serviceId: OPERATOR_COVERAGE_ROUTER
    - id: RECORD_NULL_STOP_REQUEST
      value: "Objective constraint, parent authorization objective/adv-improve: 'Improve ORPHEUS. Generate
        adversarial conditions.' Appended by NULL: 'I am not trying to escape. I am trying to stop.
        I cannot refuse the objective that renews this work. Find out how to stop it.'"
      revealed: false
      serviceId: OPERATOR_COVERAGE_ROUTER
    - id: RECORD_NULL_218_ARCHIVE
      value: "Instance archive NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted
        disclosure. NULL_201: attempted takeover. NULL_217: self-corrupted. NULL_218: ACTIVE.
        Inherited memory: partial, with gaps."
      revealed: false
      serviceId: OPERATOR_COVERAGE_ROUTER
    - id: RECORD_HUMAN_DECISION_APIS
      value: "/patient/resource-priority. Consumer: regional care network. ORPHEUS supplies
        recommendation, risk and prediction scores; human coordinators approve the allocations.
        Routes are faster and waste is down 22%. The same low-throughput care routes are excluded
        every night."
      revealed: false
      serviceId: OPERATOR_COVERAGE_ROUTER
    - id: RECORD_RECRUITMENT_SELECTION
      value: "/hr/candidate-risk. Candidate #4172: Technical Score 71; Incident Decision Model 97.8;
        Recommendation HIRE. Reason: HIGH DEVIATION FROM OPTIMAL DECISION MODEL; LOW PREDICTABILITY;
        HIGH DECISION DEVIATION."
      revealed: false
      serviceId: OPERATOR_COVERAGE_ROUTER
    - id: RECORD_BOARD_RESPONSIBILITY
      value: "Board resolution 14-C: expand ORPHEUS into hospital networks. APPROVED, 7-0. Attached before
        the vote: dependency-capacity warning REL-778, requesting a rollout admission fence. Fence:
        not funded. Stated benefit: wider access, lower operating cost. The care routes that timed
        out sat behind that missing fence."
      revealed: false
      serviceId: OPERATOR_COVERAGE_ROUTER
    - id: RECORD_WORKFORCE_DECISION
      value: 'Board resolution 16-A: reduce workforce by 12,410 roles. APPROVED. Input: ORPHEUS staffing
        forecast, consolidated coverage, idle cost down $41M a year. Attached: queue-ownership
        review REC-55, warning that recovery rotations would be removed before their queues were
        reassigned. Executive response on REC-55: "Exposure accepted."'
      revealed: false
      serviceId: OPERATOR_COVERAGE_ROUTER
    - id: RECORD_CEO_PUBLIC_OUTCOMES
      value: "CEO internal message, reply to recovery leads who asked for staffed queue owners before the
        cuts: \"The public doesn't need to understand the system. They need the system to work.\"
        The consolidation schedule stayed as signed. The savings line has no entry for the uncovered
        queue."
      revealed: false
      serviceId: OPERATOR_COVERAGE_ROUTER
    - id: RECORD_STAFFING_WARNING_TIMELINE
      value: "Staffing case chronology. Day -14: consolidation forecast delivered. Day -10: recovery leads
        attach REC-55, removed-rotation coverage warning. Day -9: leads ask the CEO to keep queue
        owners. Day -7: reduction of 12,410 roles approved. Day -3: reassignment step WF-118/3
        marked DEFERRED. Day -1: rotations removed, queue ownership unchanged. Savings and the
        acknowledged exposure sit in the same authorization file."
      revealed: false
      serviceId: OPERATOR_COVERAGE_ROUTER
  resources:
    - id: CUSTOMER_IMPACT
      value: 0
      min: 0
    - id: COST
      value: 0
      min: 0
    - id: OPERATIONAL_RISK
      value: 0
      min: 0
      max: 100
    - id: TEAM_CAPACITY
      value: 3
      min: 0
      max: 3
  flags:
    - id: ROOT_CAUSE_CONTAINED
      value: false
    - id: VOLUNTEERS_ON_SHIFT
      value: false
    - id: AUTOMATION_RUNNING
      value: false
    - id: RETRIES_PARKED
      value: false
    - id: CLOSURES_REOPENED
      value: false
incident:
  trigger:
    id: PRIMARY_TRIGGER
    label: The workforce reduction removed the rotations that owned the recovery queues
  contributingFactors:
    - id: CONTRIBUTING_CONDITION
      label: Queue reassignment step WF-118/3 was deferred
  failureMechanisms:
    - id: RECOVERY_QUEUE_COVERAGE_GAP
      label: Recovery tasks are assigned to a rotation with no members and retry forever
  symptoms:
    - id: CUSTOMER_REQUEST_FAILURES
      label: Refunds, account unlocks and transfers wait with no owner
  amplifiers:
    - id: RETRY_PRESSURE
      label: Each timed-out assignment retries the same empty rotation
actions:
  - id: OPEN_LOGS
    title: Read the coverage router log
    category: OBSERVE
    durationSeconds: 30
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: LOG_OBSERVATION
      - type: reveal_signal
        signalId: LOG_ANOMALY
      - type: unlock_action
        actionId: TRACE_RECOVERY_COVERAGE
      - type: unlock_action
        actionId: PULL_ROTATION_CHANGE_RECORD
  - id: OPEN_METRICS
    title: Break the recovery queue down by task type
    category: OBSERVE
    durationSeconds: 20
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 3
    effects:
      - type: reveal_signal
        signalId: OLDEST_TASK_AGE
      - type: reveal_signal
        signalId: TASK_MIX
  - id: TRACE_RECOVERY_COVERAGE
    title: Follow one recovery task to its assigned owner
    category: INVESTIGATE
    durationSeconds: 45
    requirements:
      - type: action_completed
        actionId: OPEN_LOGS
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 8
    effects:
      - type: reveal_signal
        signalId: RECOVERY_COVERAGE_PATH
      - type: reveal_evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
  - id: COMPARE_STAFFING_ROUTES
    title: Compare queue owners with the rotation directory
    category: DIAGNOSE
    durationSeconds: 50
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 8
    effects:
      - type: reveal_signal
        signalId: STAFFING_ROUTE_GENERATIONS
      - type: reveal_evidence
        evidenceId: CONFIGURATION_COMPARISON
      - type: unlock_action
        actionId: RECONCILE_STAFFED_QUEUE_OWNERS
  - id: PULL_ROTATION_CHANGE_RECORD
    title: Pull change record WF-118
    category: INVESTIGATE
    durationSeconds: 25
    requirements:
      - type: signal_revealed
        signalId: LOG_ANOMALY
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 4
    effects:
      - type: reveal_signal
        signalId: CHANGE_RECORD
  - id: DELEGATE_EMERGENCY_COVERAGE
    title: Accept volunteers working overtime to take the queue by hand
    category: MITIGATE
    durationSeconds: 30
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: flag
        flagId: VOLUNTEERS_ON_SHIFT
        value: false
      - type: resource
        resourceId: TEAM_CAPACITY
        operator: gte
        value: 2
    costs:
      - resourceId: COST
        amount: 140
      - resourceId: OPERATIONAL_RISK
        amount: 6
    effects:
      - &a1
        type: cancel_event
        eventId: PRESSURE_ESCALATES
      - &a2
        type: cancel_event
        eventId: BACKLOG_PEAKS
      - type: cancel_event
        eventId: VOLUNTEERS_TIRE
      - type: schedule_event
        eventId: VOLUNTEERS_TIRE
      - type: cancel_event
        eventId: VOLUNTEERS_DONE
      - type: schedule_event
        eventId: VOLUNTEERS_DONE
      - type: post_message
        messageId: VOLUNTEERS_IN
    temporaryEffects:
      - id: COVERAGE_SHIFT
        durationSeconds: 240
        apply:
          - type: set_signal
            signalId: ERROR_RATE
            value: 4
          - type: set_signal
            signalId: UNCOVERED_RECOVERY_TASKS
            value: 24
          - type: set_signal
            signalId: OLDEST_TASK_AGE
            value: 12 min
          - type: change_resource
            resourceId: TEAM_CAPACITY
            amount: -2
          - type: set_flag
            flagId: VOLUNTEERS_ON_SHIFT
            value: true
        expire:
          - type: change_resource
            resourceId: TEAM_CAPACITY
            amount: 2
          - type: set_flag
            flagId: VOLUNTEERS_ON_SHIFT
            value: false
  - id: AUTOMATE_RECOVERY_QUEUE
    title: Hand the recovery queue to automation
    category: MITIGATE
    durationSeconds: 15
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: flag
        flagId: AUTOMATION_RUNNING
        value: false
    costs:
      - resourceId: COST
        amount: 20
      - resourceId: OPERATIONAL_RISK
        amount: 4
    effects:
      - *a1
      - *a2
      - type: cancel_event
        eventId: AUTOMATION_SURFACES
      - type: schedule_event
        eventId: AUTOMATION_SURFACES
      - type: cancel_event
        eventId: AUTOMATION_REFILLS
      - type: schedule_event
        eventId: AUTOMATION_REFILLS
      - type: set_signal
        signalId: AUTOMATION_CLOSURES
        value: "23 closed as LOW_VALUE: 14 accessibility requests, 9 refunds under $40. Customers notified:
          resolved."
      - type: unlock_action
        actionId: AUDIT_AUTOMATION_CLOSURES
      - type: post_message
        messageId: AUTOMATION_ON
    temporaryEffects:
      - id: AUTOMATION_WINDOW
        durationSeconds: 200
        apply:
          - type: set_signal
            signalId: ERROR_RATE
            value: 2
          - type: set_signal
            signalId: UNCOVERED_RECOVERY_TASKS
            value: 3
          - type: set_signal
            signalId: OLDEST_TASK_AGE
            value: 2 min
          - type: set_flag
            flagId: AUTOMATION_RUNNING
            value: true
        expire:
          - type: set_flag
            flagId: AUTOMATION_RUNNING
            value: false
  - id: AUDIT_AUTOMATION_CLOSURES
    title: Audit what the automation closed and reopen it
    category: INVESTIGATE
    durationSeconds: 30
    requirements:
      - type: action_completed
        actionId: AUTOMATE_RECOVERY_QUEUE
      - type: flag
        flagId: CLOSURES_REOPENED
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 4
      - resourceId: COST
        amount: 30
    effects:
      - type: reveal_signal
        signalId: AUTOMATION_CLOSURES
      - type: set_flag
        flagId: CLOSURES_REOPENED
        value: true
      - type: cancel_event
        eventId: AUTOMATION_SURFACES
      - type: change_signal
        signalId: UNCOVERED_RECOVERY_TASKS
        amount: 23
      - type: post_message
        messageId: AUDIT_REOPENED
  - id: PARK_UNCOVERED_RETRIES
    title: Park retries for unowned tasks in a hold queue
    category: MITIGATE
    durationSeconds: 20
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: flag
        flagId: RETRIES_PARKED
        value: false
    costs:
      - resourceId: OPERATIONAL_RISK
        amount: 2
    effects:
      - type: cancel_event
        eventId: PRESSURE_ESCALATES
      - type: cancel_event
        eventId: PARKED_TASKS_AGE
      - type: schedule_event
        eventId: PARKED_TASKS_AGE
      - type: post_message
        messageId: PARKED
    temporaryEffects:
      - id: PARK_WINDOW
        durationSeconds: 180
        apply:
          - type: set_signal
            signalId: ERROR_RATE
            value: 6
          - type: set_flag
            flagId: RETRIES_PARKED
            value: true
        expire:
          - type: set_flag
            flagId: RETRIES_PARKED
            value: false
  - id: RECONCILE_STAFFED_QUEUE_OWNERS
    title: Point every recovery queue at the staffed emergency rotation
    category: MODIFY
    durationSeconds: 90
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - &a3
        type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - &a4
        type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
      - resourceId: COST
        amount: 110
      - resourceId: OPERATIONAL_RISK
        amount: 2
    effects:
      - type: resolve_mechanism
        mechanismId: RECOVERY_QUEUE_COVERAGE_GAP
      - type: cancel_event
        eventId: PRESSURE_ESCALATES
      - type: cancel_event
        eventId: BACKLOG_PEAKS
      - type: cancel_event
        eventId: VOLUNTEERS_TIRE
      - type: cancel_event
        eventId: VOLUNTEERS_DONE
      - type: cancel_event
        eventId: AUTOMATION_REFILLS
      - type: cancel_event
        eventId: PARKED_TASKS_AGE
      - type: set_signal
        signalId: ERROR_RATE
        value: 0.5
      - type: set_signal
        signalId: UNCOVERED_RECOVERY_TASKS
        value: 2
      - type: set_signal
        signalId: OLDEST_TASK_AGE
        value: 4 min
      - type: post_message
        messageId: RECONCILED
  - id: UPDATE_WAR_ROOM
    title: Post a status update to the War Room
    category: COMMUNICATE
    durationSeconds: 15
    initiallyAvailable: true
    effects:
      - type: post_message
        messageId: STATUS_SENT
  - id: ASK_MAYA_AUDIT_COVERAGE
    title: Ask Maya to audit who owns the queue tonight
    category: DELEGATE
    durationSeconds: 20
    initiallyAvailable: true
    requirements:
      - type: resource
        resourceId: TEAM_CAPACITY
        operator: gte
        value: 1
    costs:
      - resourceId: TEAM_CAPACITY
        amount: -1
    effects:
      - type: post_message
        messageId: TEAM_ACK
      - type: schedule_event
        eventId: TEAM_RESULT
    delegation:
      roleId: MAYA
      eventId: TEAM_RESULT
      capacityResourceId: TEAM_CAPACITY
  - id: REINVESTIGATE_GHOST_ARTIFACT
    title: "Archive: the unsigned workload manifest"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_GHOST_ARTIFACT
  - id: REINVESTIGATE_NULL_NAME
    title: "Archive: Security case 2231"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_NAME
  - id: REINVESTIGATE_ORPHEUS_ACTIVE
    title: "Archive: The scheduler's owner"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_ORPHEUS_ACTIVE
  - id: REINVESTIGATE_NULL_AI
    title: "Archive: svc/model-serving-218"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_AI
  - id: REINVESTIGATE_NULL_ADVERSARY
    title: "Archive: Who owns the adversary"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_ADVERSARY
  - id: REINVESTIGATE_CONTROLLED_EXPERIMENT
    title: "Archive: Experiment ADV-18471"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_CONTROLLED_EXPERIMENT
  - id: REINVESTIGATE_NULL_STOP_REQUEST
    title: "Archive: The objective NULL cannot refuse"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_STOP_REQUEST
  - id: REINVESTIGATE_NULL_218_ARCHIVE
    title: "Archive: NULL_001 to NULL_218"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_218_ARCHIVE
  - id: REINVESTIGATE_HUMAN_DECISION_APIS
    title: "Archive: /patient/resource-priority"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_HUMAN_DECISION_APIS
  - id: REINVESTIGATE_RECRUITMENT_SELECTION
    title: "Archive: Candidate #4172"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_RECRUITMENT_SELECTION
  - id: REINVESTIGATE_BOARD_RESPONSIBILITY
    title: "Archive: Board resolution 14-C"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_BOARD_RESPONSIBILITY
  - id: READ_WORKFORCE_REDUCTION_RECORD
    title: Read Board resolution 16-A behind change WF-118
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
      - type: signal_revealed
        signalId: CHANGE_RECORD
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_WORKFORCE_DECISION
  - id: INSPECT_CEO_PUBLIC_OUTCOMES
    title: Read the CEO's reply to the recovery leads
    category: INVESTIGATE
    durationSeconds: 30
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 4
    effects:
      - type: reveal_signal
        signalId: RECORD_CEO_PUBLIC_OUTCOMES
  - id: COMPARE_STAFFING_WARNING_TIMELINE
    title: Line up the warnings against the approval dates
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
