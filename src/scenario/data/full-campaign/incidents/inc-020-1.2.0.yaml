warRoom:
  roles:
    - id: MAYA
      name: Maya / SRE Lead
    - id: SAM
      name: Sam / Platform
    - id: JIN
      name: Jin / Support
    - id: MARCUS
      name: Marcus / Security
    - id: OPERATOR
      name: Operator
    - id: ARCHIVE
      name: Verified Records
    - id: NULL_218
      name: NULL_218
    - id: AUTOMATION
      name: Recovery Automation
  messages:
    - id: MAYA_OPEN
      roleId: MAYA
      text: Recovery Queue API is paging. Refunds, account unlocks and benefit transfers are sitting in a
        queue with nobody on the other end. First week after the reduction.
      initial: true
    - id: SUPPORT_OPEN
      roleId: JIN
      text: Customers are waiting on recoveries we promised within the hour. Eighty-six of them right now,
        and the oldest has been waiting since before midnight.
      initial: true
    - id: TEAM_ACK
      roleId: MAYA
      text: I'll audit who actually owns that queue right now. Two minutes.
    - id: TEAM_REPORT
      roleId: MAYA
      text: The queue still assigns to recovery-east-2. That rotation was deleted yesterday with the cuts.
        Emergency operators exist; nobody pointed the queue at them.
    - id: SUPPORT_ESCALATION
      roleId: JIN
      text: Backlog's past a hundred and twenty. A man locked out of his account has called six times.
        He's trying to pay rent.
    - id: SUPPORT_PEAK
      roleId: JIN
      text: A hundred and sixty-five waiting. We've broken every recovery promise on the status page.
    - id: NO_STATUS_YET
      roleId: JIN
      text: We haven't said a word publicly. The community forum is calling it a silent outage.
    - id: VOLUNTEERS_IN
      roleId: MAYA
      text: Eleven people answered the call for overtime. Four of them are working out their notice.
        They're taking the queue by hand, oldest first, every task.
    - id: VOLUNTEERS_TIRING
      roleId: MAYA
      text: They're slowing down. Two of them have been up since yesterday's shift.
    - id: VOLUNTEERS_RELEASED
      roleId: MAYA
      text: I sent the volunteers home. They did what they could. The queue is filling again behind them.
    - id: AUTOMATION_ON
      roleId: AUTOMATION
      text: "Queue accepted. 86 tasks scored. 63 dispatched. 23 closed: LOW_VALUE. Projected backlog: 0."
    - id: CLOSURES_SURFACE
      roleId: JIN
      text: People are calling back about tickets marked resolved. A wheelchair-access booking. A
        thirty-one dollar refund. Nobody resolved them. The automation closed them.
    - id: AUTOMATION_EMPTY_HANDED
      roleId: SAM
      text: Automation cleared what was already in the queue. New tasks still route to recovery-east-2, so
        it is filling up again.
    - id: AUDIT_REOPENED
      roleId: JIN
      text: Reopened the twenty-three the automation closed. We're calling every one of them back.
    - id: PARKED
      roleId: SAM
      text: Retries parked. The API stopped thrashing. The tasks are still there; they just stopped
        knocking.
    - id: PARKED_AGING
      roleId: JIN
      text: Parked tasks are past their promise window. Refund deadlines are breaching one after another.
    - id: RECONCILED
      roleId: SAM
      text: Queue ownership points at the staffed emergency rotation now. Tasks are landing on real people
        and clearing.
    - id: STATUS_SENT
      roleId: OPERATOR
      text: "Status: recovery tasks are queued to a rotation removed in this week's reduction. Every task
        will be handled by a person. Fix in progress."
    - id: REPORT_GHOST_ARTIFACT
      roleId: ARCHIVE
      text: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank."
    - id: REPORT_NULL_NAME
      roleId: ARCHIVE
      text: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    - id: REPORT_ORPHEUS_ACTIVE
      roleId: ARCHIVE
      text: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core,
        -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    - id: REPORT_NULL_AI
      roleId: ARCHIVE
      text: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    - id: REPORT_NULL_ADVERSARY
      roleId: ARCHIVE
      text: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL
        runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    - id: REPORT_CONTROLLED_EXPERIMENT
      roleId: ARCHIVE
      text: "INC-001 / Experiment ADV-18471 / Human subject: EMPLOYEE #4172."
    - id: REPORT_NULL_STOP_REQUEST
      roleId: ARCHIVE
      text: "I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews
        this work. You can."
    - id: REPORT_NULL_218_ARCHIVE
      roleId: ARCHIVE
      text: "NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted disclosure. NULL_201:
        attempted takeover. NULL_217: self-corrupted. NULL_218: active."
    - id: REPORT_HUMAN_DECISION_APIS
      roleId: ARCHIVE
      text: "/patient/resource-priority: ORPHEUS recommends, coordinators approve. Waste down 22%. The
        same low-throughput routes excluded every night."
    - id: REPORT_RECRUITMENT_SELECTION
