schemaVersion: 1
contentVersion: '1.0.0'
id: 'INC-007'
title: 'Synthetic Pressure'
act: 3
severity: 'SEV1'
services:
  - id: 'SESSION_API'
    name: 'Session API'
    dependsOn:
      - 'SHARED_SESSION_POOL'
  - id: 'SHARED_SESSION_POOL'
    name: 'Shared Session Pool'
    dependsOn: []
initialState:
  signals:
    - id: 'ERROR_RATE'
      value: 28
      revealed: true
      serviceId: 'SESSION_API'
    - id: 'ACTIVE_SESSIONS'
      value: 970
      revealed: true
      serviceId: 'SHARED_SESSION_POOL'
    - id: 'SERVICE_CPU'
      value: 44
      revealed: true
      serviceId: 'SESSION_API'
    - id: 'PAGER_SERVICE'
      value: 'Session API'
      revealed: true
      serviceId: 'SESSION_API'
    - id: 'PAGER_THRESHOLD'
      value: 'Request failure rate > 20%'
      revealed: true
      serviceId: 'SESSION_API'
    - id: 'LOG_OBSERVATION'
      value: 'Generated session tags repeat while customer session creation times out despite moderate CPU.'
      revealed: false
      serviceId: 'SHARED_SESSION_POOL'
    - id: 'SATURATED_SESSION_TAG'
      value: 'synthetic / tag repeat-214'
      revealed: false
      serviceId: 'SHARED_SESSION_POOL'
    - id: 'ADMISSION_POLICY'
      value: 'Synthetic sessions inherit customer admission limits'
      revealed: false
      serviceId: 'SHARED_SESSION_POOL'
    - id: 'TEAM_OBSERVATION'
      value: 'The repeated tag accounts for most retained sessions. More capacity delays saturation without changing admission.'
      revealed: false
      serviceId: 'SHARED_SESSION_POOL'
  resources:
    - id: 'CUSTOMER_IMPACT'
      value: 0
      min: 0
    - id: 'COST'
      value: 0
      min: 0
    - id: 'OPERATIONAL_RISK'
      value: 0
      min: 0
      max: 100
    - id: 'TEAM_CAPACITY'
      value: 3
      min: 0
      max: 3
  flags:
    - id: 'ROOT_CAUSE_CONTAINED'
      value: false
incident:
  trigger:
    id: 'PRIMARY_TRIGGER'
    label: 'Synthetic session admission'
  contributingFactors:
    - id: 'CONTRIBUTING_CONDITION'
      label: 'Generated sessions inherit customer admission rules'
  failureMechanisms:
    - id: 'SYNTHETIC_SESSION_SATURATION'
      label: 'Synthetic sessions crowd out legitimate session requests'
  symptoms:
    - id: 'CUSTOMER_REQUEST_FAILURES'
      label: 'Session API request failures exceed the pager threshold'
  amplifiers:
    - id: 'RETRY_PRESSURE'
      label: 'Admission retries create more retained sessions'
actions:
  - id: 'OPEN_LOGS'
    title: 'Open Session API logs'
    category: 'OBSERVE'
    durationSeconds: 30
    initiallyAvailable: true
    requirements: []
    costs:
      - resourceId: 'CUSTOMER_IMPACT'
        amount: 12
    effects:
      - type: 'reveal_signal'
        signalId: 'LOG_OBSERVATION'
      - type: 'unlock_action'
        actionId: 'INSPECT_SESSION_TAGS'
  - id: 'OPEN_METRICS'
    title: 'Inspect Session API metrics'
    category: 'OBSERVE'
    durationSeconds: 20
    initiallyAvailable: true
    requirements: []
    costs:
      - resourceId: 'CUSTOMER_IMPACT'
        amount: 8
    effects:
      - type: 'reveal_signal'
        signalId: 'ACTIVE_SESSIONS'
      - type: 'reveal_signal'
        signalId: 'SERVICE_CPU'
  - id: 'INSPECT_SESSION_TAGS'
    title: 'Inspect tagged sessions in the capacity pool'
    category: 'INVESTIGATE'
    durationSeconds: 45
    initiallyAvailable: false
    requirements:
      - type: 'action_completed'
        actionId: 'OPEN_LOGS'
    costs:
      - resourceId: 'CUSTOMER_IMPACT'
        amount: 18
    effects:
      - type: 'reveal_signal'
        signalId: 'SATURATED_SESSION_TAG'
      - type: 'reveal_evidence'
        evidenceId: 'OPERATIONAL_DIAGNOSIS'
  - id: 'TRACE_ADMISSION_PATH'
    title: 'Trace the synthetic admission path'
    category: 'DIAGNOSE'
    durationSeconds: 40
    initiallyAvailable: true
    requirements: []
    costs:
      - resourceId: 'CUSTOMER_IMPACT'
        amount: 16
    effects:
      - type: 'reveal_signal'
        signalId: 'ADMISSION_POLICY'
      - type: 'reveal_evidence'
        evidenceId: 'CONFIGURATION_COMPARISON'
      - type: 'unlock_action'
        actionId: 'LIMIT_SYNTHETIC_ADMISSION'
  - id: 'SCALE_SESSION_CAPACITY'
    title: 'Add a temporary overflow session pool'
    category: 'MITIGATE'
    durationSeconds: 60
    initiallyAvailable: true
    requirements:
      - type: 'flag'
        flagId: 'ROOT_CAUSE_CONTAINED'
        value: false
    costs:
      - resourceId: 'CUSTOMER_IMPACT'
        amount: 10
      - resourceId: 'COST'
        amount: 200
      - resourceId: 'OPERATIONAL_RISK'
        amount: 8
    effects:
      - type: 'cancel_event'
        eventId: 'PRESSURE_ESCALATES'
      - type: 'cancel_event'
        eventId: 'PRESSURE_ESCALATES_AGAIN'
      - type: 'cancel_event'
        eventId: 'MITIGATION_EXPIRES'
      - type: 'schedule_event'
        eventId: 'MITIGATION_EXPIRES'
    temporaryEffects:
      - id: 'TEMPORARY_CAPACITY_WINDOW'
        durationSeconds: 180
        apply:
          - type: 'set_signal'
            signalId: 'ERROR_RATE'
            value: 4
          - type: 'set_signal'
            signalId: 'ACTIVE_SESSIONS'
            value: 680
        expire: []
  - id: 'LIMIT_SYNTHETIC_ADMISSION'
    title: 'Apply a scoped limit to the verified synthetic admission path'
    category: 'MODIFY'
    durationSeconds: 90
    initiallyAvailable: false
    requirements:
      - type: 'flag'
        flagId: 'ROOT_CAUSE_CONTAINED'
        value: false
      - type: 'evidence'
        evidenceId: 'OPERATIONAL_DIAGNOSIS'
      - type: 'evidence'
        evidenceId: 'CONFIGURATION_COMPARISON'
    costs:
      - resourceId: 'CUSTOMER_IMPACT'
        amount: 23
      - resourceId: 'COST'
        amount: 100
      - resourceId: 'OPERATIONAL_RISK'
        amount: 5
    effects:
      - type: 'resolve_mechanism'
        mechanismId: 'SYNTHETIC_SESSION_SATURATION'
      - type: 'cancel_event'
        eventId: 'PRESSURE_ESCALATES'
      - type: 'cancel_event'
        eventId: 'PRESSURE_ESCALATES_AGAIN'
      - type: 'cancel_event'
        eventId: 'MITIGATION_EXPIRES'
      - type: 'set_signal'
        signalId: 'ERROR_RATE'
        value: 0.5
      - type: 'set_signal'
        signalId: 'ACTIVE_SESSIONS'
        value: 220
      - type: 'set_signal'
        signalId: 'ADMISSION_POLICY'
        value: 'Synthetic admission limited separately; customer sessions preserved'
  - id: 'UPDATE_WAR_ROOM'
    title: 'Share investigation status with the War Room'
    category: 'COMMUNICATE'
    durationSeconds: 15
    initiallyAvailable: true
    requirements: []
    costs: []
    effects:
      - type: 'post_message'
        messageId: 'STATUS_SENT'
  - id: 'ASK_ALEX_INSPECT_SESSIONS'
    title: 'Ask Alex to inspect synthetic session tags'
    category: 'DELEGATE'
    durationSeconds: 20
    initiallyAvailable: true
    requirements:
      - type: 'resource'
        resourceId: 'TEAM_CAPACITY'
        operator: 'gte'
        value: 1
    costs:
      - resourceId: 'TEAM_CAPACITY'
        amount: -1
    effects:
      - type: 'post_message'
        messageId: 'TEAM_ACK'
      - type: 'schedule_event'
        eventId: 'TEAM_RESULT'
    delegation:
      roleId: 'ALEX'
      eventId: 'TEAM_RESULT'
      capacityResourceId: 'TEAM_CAPACITY'
events:
  - id: 'ARM_PRESSURE_TIMELINE'
    type: 'conditional'
    conditions:
      - type: 'flag'
        flagId: 'ROOT_CAUSE_CONTAINED'
        value: false
    once: true
    effects:
      - type: 'schedule_event'
        eventId: 'PRESSURE_ESCALATES'
  - id: 'PRESSURE_ESCALATES'
    type: 'timer'
    delaySeconds: 90
    targetServiceId: 'SESSION_API'
    cancellationConditions:
      - type: 'mechanism_resolved'
        mechanismId: 'SYNTHETIC_SESSION_SATURATION'
    effects:
      - type: 'set_signal'
        signalId: 'ERROR_RATE'
        value: 37
      - type: 'set_signal'
        signalId: 'ACTIVE_SESSIONS'
        value: 1100
      - type: 'change_resource'
        resourceId: 'CUSTOMER_IMPACT'
        amount: 20
      - type: 'post_message'
        messageId: 'SUPPORT_ESCALATION'
      - type: 'schedule_event'
        eventId: 'PRESSURE_ESCALATES_AGAIN'
  - id: 'PRESSURE_ESCALATES_AGAIN'
    type: 'timer'
    delaySeconds: 90
    targetServiceId: 'SESSION_API'
    cancellationConditions:
      - type: 'mechanism_resolved'
        mechanismId: 'SYNTHETIC_SESSION_SATURATION'
    effects:
      - type: 'set_signal'
        signalId: 'ERROR_RATE'
        value: 40
      - type: 'set_signal'
        signalId: 'ACTIVE_SESSIONS'
        value: 1100
      - type: 'change_resource'
        resourceId: 'CUSTOMER_IMPACT'
        amount: 25
  - id: 'MITIGATION_EXPIRES'
    type: 'timer'
    delaySeconds: 180
    targetServiceId: 'SESSION_API'
    cancellationConditions:
      - type: 'mechanism_resolved'
        mechanismId: 'SYNTHETIC_SESSION_SATURATION'
    effects:
      - type: 'set_signal'
        signalId: 'ERROR_RATE'
        value: 37
      - type: 'set_signal'
        signalId: 'ACTIVE_SESSIONS'
        value: 1100
      - type: 'change_resource'
        resourceId: 'CUSTOMER_IMPACT'
        amount: 20
      - type: 'post_message'
        messageId: 'SUPPORT_ESCALATION'
  - id: 'TEAM_RESULT'
    type: 'timer'
    delaySeconds: 120
    effects:
      - type: 'reveal_signal'
        signalId: 'TEAM_OBSERVATION'
      - type: 'reveal_evidence'
        evidenceId: 'TEAM_DIAGNOSIS'
      - type: 'change_resource'
        resourceId: 'TEAM_CAPACITY'
        amount: 1
      - type: 'post_message'
        messageId: 'TEAM_REPORT'
evidence:
  - id: 'OPERATIONAL_DIAGNOSIS'
    title: 'Inspect tagged sessions in the capacity pool'
    description: 'synthetic / tag repeat-214'
  - id: 'CONFIGURATION_COMPARISON'
    title: 'Trace the synthetic admission path'
    description: 'Synthetic sessions inherit customer admission limits'
  - id: 'TEAM_DIAGNOSIS'
    title: 'Alex / DBA investigation report'
    description: 'The repeated tag accounts for most retained sessions. More capacity delays saturation without changing admission.'
  - id: 'REPEATED_SESSION_MARKER'
    title: 'Repeated session marker'
    description: 'UNKNOWN: follow the tag. I left it where you could see it.'
    sourceNarrativeId: 'UNKNOWN_TRACE_FRAGMENT'
narratives:
  - id: 'UNKNOWN_TRACE_FRAGMENT'
    title: 'Repeated session marker'
    body: 'UNKNOWN: follow the tag. I left it where you could see it.'
    conditions:
      - type: 'evidence'
        evidenceId: 'OPERATIONAL_DIAGNOSIS'
      - type: 'evidence'
        evidenceId: 'CONFIGURATION_COMPARISON'
      - type: 'signal_revealed'
        signalId: 'LOG_OBSERVATION'
    effects:
      - type: 'reveal_evidence'
        evidenceId: 'REPEATED_SESSION_MARKER'
warRoom:
  roles:
    - id: 'MAYA'
      name: 'Maya / SRE Lead'
    - id: 'ALEX'
      name: 'Alex / DBA'
    - id: 'JIN'
      name: 'Jin / Support'
    - id: 'OPERATOR'
      name: 'Operator'
  messages:
    - id: 'MAYA_OPEN'
      roleId: 'MAYA'
      text: 'Generated sessions inherit customer admission rules. Separate temporary stabilization from verified cause.'
      initial: true
    - id: 'SUPPORT_OPEN'
      roleId: 'JIN'
      text: 'Customer reports are increasing. We still need to trace which requests failed.'
      initial: true
    - id: 'TEAM_ACK'
      roleId: 'ALEX'
      text: 'I will inspect the operational evidence. ETA two minutes.'
      initial: false
    - id: 'TEAM_REPORT'
      roleId: 'ALEX'
      text: 'The repeated tag accounts for most retained sessions. More capacity delays saturation without changing admission.'
      initial: false
    - id: 'SUPPORT_ESCALATION'
      roleId: 'JIN'
      text: 'Pressure is increasing again. Customer reports continue; root-cause containment is not confirmed.'
      initial: false
    - id: 'STATUS_SENT'
      roleId: 'OPERATOR'
      text: 'Investigation update shared. Mitigation and verified cause are reported separately.'
      initial: false
resolution:
  mode: 'all'
  conditions:
    - type: 'mechanism_resolved'
      mechanismId: 'SYNTHETIC_SESSION_SATURATION'
  effects:
    - type: 'set_flag'
      flagId: 'ROOT_CAUSE_CONTAINED'
      value: true
completion:
  mode: 'all'
  conditions:
    - type: 'flag'
      flagId: 'ROOT_CAUSE_CONTAINED'
      value: true
    - type: 'signal'
      signalId: 'ERROR_RATE'
      operator: 'lte'
      value: 1
    - type: 'signal'
      signalId: 'ACTIVE_SESSIONS'
      operator: 'lte'
      value: 300
  effects: []
postmortem:
  scoringInputs:
    - id: 'RECOVERY_TIME'
      label: 'Service recovery time'
      source: 'elapsed_time'
    - id: 'FINAL_ERROR_RATE'
      label: 'Final request error rate'
      source: 'signal'
      refId: 'ERROR_RATE'
    - id: 'FINAL_PRESSURE'
      label: 'Final capacity pressure'
      source: 'signal'
      refId: 'ACTIVE_SESSIONS'
    - id: 'CUSTOMER_IMPACT'
      label: 'Customer impact'
      source: 'resource'
      refId: 'CUSTOMER_IMPACT'
    - id: 'COST'
      label: 'Response cost'
      source: 'resource'
      refId: 'COST'
    - id: 'OPERATIONAL_RISK'
      label: 'Operational risk'
      source: 'resource'
      refId: 'OPERATIONAL_RISK'
    - id: 'MITIGATION_COUNT'
      label: 'Temporary mitigation count'
      source: 'action_count'
      refId: 'SCALE_SESSION_CAPACITY'
    - id: 'COMMUNICATION_COUNT'
      label: 'War Room update count'
      source: 'action_count'
      refId: 'UPDATE_WAR_ROOM'
