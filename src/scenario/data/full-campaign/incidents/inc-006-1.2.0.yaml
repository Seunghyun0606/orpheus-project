# Campaign 1.2 redesign (DEC-070). Issuer ca-18 went live six hours before
# every verifier trusted it. The old trusted pool absorbs new sessions until it
# saturates; restarting verifiers only helps the three that already have the
# new bundle on disk ("3 of 6"). Two real fixes: a fast rollback that signs out
# everyone issued under ca-18, or a slower, clean repair of the distribution.
# The ca-18 promotion carries the shadow-7 tag; Marcus's notice names NULL.
schemaVersion: 1
contentVersion: 1.2.0
id: INC-006
title: Certificate Storm
act: 3
severity: SEV1
services:
  - id: IDENTITY_GATEWAY
    name: Identity Gateway
    dependsOn:
      - TRUST_VERIFIER
      - TRUSTED_POOL
  - id: TRUST_VERIFIER
    name: Trust Verifier
  - id: TRUSTED_POOL
    name: Legacy Identity Pool (ca-17)
initialState:
  signals:
    - id: ERROR_RATE
      value: 31
      revealed: true
      serviceId: IDENTITY_GATEWAY
    - id: IDENTITY_RETRY_RATE
      value: 520
      revealed: true
      serviceId: TRUST_VERIFIER
    - id: SERVICE_CPU
      value: 77
      revealed: true
      serviceId: IDENTITY_GATEWAY
    - id: POOL_LOAD
      value: 22
      serviceId: TRUSTED_POOL
    - id: VERIFIER_BUNDLES
      value: "Accepting ca-18: 0 of 6. verifier-1, -3, -5 have bundle 2025-11 on disk but still run
        2025-10. verifier-2, -4, -6 only have 2025-10."
      serviceId: TRUST_VERIFIER
    - id: PAGER_SERVICE
      value: Identity Gateway
      revealed: true
      serviceId: IDENTITY_GATEWAY
    - id: PAGER_THRESHOLD
      value: New-session failure rate > 20%
      revealed: true
      serviceId: IDENTITY_GATEWAY
    - id: LOG_OBSERVATION
      value: "Handshake rejected: issuer ca-18 is absent from the verifier trust bundle. Every
        rejection is a brand-new session; existing sessions are untouched."
      serviceId: TRUST_VERIFIER
    - id: CURRENT_ISSUER
      value: ca-18
      serviceId: TRUST_VERIFIER
    - id: ROLLOVER_REQUESTER
      value: "ca-18 promotion at 01:12, six hours ahead of schedule. Requested by
        svc/edge-canary-observer. Change ticket: none. Request header: x-session-tag: shadow-7."
      serviceId: TRUST_VERIFIER
    - id: SESSIONS_ON_CA18
      value: 31,240 customer sessions signed by ca-18 in the last 40 minutes
      serviceId: IDENTITY_GATEWAY
    - id: TRUSTED_ISSUER
      value: ca-17
      serviceId: TRUST_VERIFIER
    - id: TEAM_OBSERVATION
      value: ca-18 reached production six hours ahead of its trust bundle, on a request with no
        change ticket. Marcus wants it rolled back.
      serviceId: TRUST_VERIFIER
    - id: WORKLOAD_ARCHIVE_LINEAGE
      value: "Archive: observer-7f4c manifest, owner blank, signature blank, shadow-7 request stream.
        The deleted log sequence from the leaking checkout build and the ca-18 promotion carry the
        same tag."
      serviceId: TRUST_VERIFIER
    - id: SECURITY_ATTRIBUTION
      value: "Security case 2231. Threat actor codename: NULL. Linked activity: unsigned observer
        workload (shadow-7), ca-18 early promotion. Identity: unknown. Motive: unknown."
      serviceId: IDENTITY_GATEWAY
  resources:
    - id: CUSTOMER_IMPACT
      value: 0
      min: 0
    - id: COST
      value: 0
      min: 0
    - id: OPERATIONAL_RISK
      value: 0
      min: 0
      max: 100
    - id: TEAM_CAPACITY
      value: 3
      min: 0
      max: 3
  flags:
    - id: ROOT_CAUSE_CONTAINED
      value: false
    - id: POOL_ROUTED
      value: false
    - id: POOL_SATURATED
      value: false
    - id: VERIFIERS_RESTARTED
      value: false
incident:
  trigger:
    id: PRIMARY_TRIGGER
    label: Issuer ca-18 was promoted six hours early
  contributingFactors:
    - id: CONTRIBUTING_CONDITION
      label: Trust bundle distribution stalled after three of six verifiers
  failureMechanisms:
    - id: ISSUER_CHAIN_MISMATCH
      label: New identity sessions signed by ca-18 fail the verifier trust check
  symptoms:
    - id: CUSTOMER_REQUEST_FAILURES
      label: Customers cannot sign in
  amplifiers:
    - id: RETRY_PRESSURE
      label: Rejected sign-ins retry and consume handshake capacity
actions:
  - id: OPEN_LOGS
    title: Read the identity gateway log
    category: OBSERVE
    durationSeconds: 30
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
    effects:
      - type: reveal_signal
        signalId: LOG_OBSERVATION
      - type: unlock_action
        actionId: TRACE_CERTIFICATE_CHAIN
  - id: OPEN_METRICS
    title: Check the verifier fleet and the old identity pool
    category: OBSERVE
    durationSeconds: 20
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 4
    effects:
      - type: reveal_signal
        signalId: VERIFIER_BUNDLES
      - type: reveal_signal
        signalId: POOL_LOAD
  - id: TRACE_CERTIFICATE_CHAIN
    title: Trace a rejected certificate chain to its issuer
    category: INVESTIGATE
    durationSeconds: 40
    requirements:
      - type: action_completed
        actionId: OPEN_LOGS
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 8
    effects:
      - type: reveal_signal
        signalId: CURRENT_ISSUER
      - type: reveal_signal
        signalId: ROLLOVER_REQUESTER
      - type: reveal_signal
        signalId: SESSIONS_ON_CA18
      - type: reveal_evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
  - id: COMPARE_TRUST_HISTORY
    title: Compare when ca-18 went live with when verifiers got it
    category: DIAGNOSE
    durationSeconds: 40
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 7
    effects:
      - type: reveal_signal
        signalId: TRUSTED_ISSUER
      - type: reveal_evidence
        evidenceId: CONFIGURATION_COMPARISON
      - type: unlock_action
        actionId: REPAIR_TRUST_DISTRIBUTION
      - type: unlock_action
        actionId: ROLLBACK_CERTIFICATE_ROLLOVER
  - id: RETRACE_WORKLOAD_ARCHIVE
    title: Pull the archived record of the shadow-7 workload
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - type: signal_revealed
        signalId: ROLLOVER_REQUESTER
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
    effects:
      - type: reveal_signal
        signalId: WORKLOAD_ARCHIVE_LINEAGE
  - id: READ_SECURITY_ATTRIBUTION
    title: Read Marcus's Security notice
    category: INVESTIGATE
    durationSeconds: 30
    initiallyAvailable: true
    requirements:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 3
    effects:
      - type: reveal_signal
        signalId: SECURITY_ATTRIBUTION
  - id: ROUTE_TRUSTED_IDENTITY_POOL
    title: Send new sign-ins to the old ca-17 identity pool
    category: MITIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: flag
        flagId: POOL_ROUTED
        value: false
      - type: flag
        flagId: POOL_SATURATED
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
      - resourceId: COST
        amount: 120
      - resourceId: OPERATIONAL_RISK
        amount: 8
    effects:
      - type: cancel_event
        eventId: STORM_BUILDS
      - type: cancel_event
        eventId: STORM_PEAKS
      - type: schedule_event
        eventId: POOL_STRAIN
      - type: schedule_event
        eventId: POOL_SATURATES
    temporaryEffects:
      - id: POOL_WINDOW
        durationSeconds: 200
        apply:
          - type: set_flag
            flagId: POOL_ROUTED
            value: true
          - type: set_signal
            signalId: ERROR_RATE
            value: 5
          - type: set_signal
            signalId: IDENTITY_RETRY_RATE
            value: 70
          - type: set_signal
            signalId: POOL_LOAD
            value: 78
          - type: reveal_signal
            signalId: POOL_LOAD
        expire:
          - type: set_flag
            flagId: POOL_ROUTED
            value: false
  - id: RESTART_VERIFIERS
    title: Restart all six trust verifiers
    category: MITIGATE
    durationSeconds: 50
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: flag
        flagId: POOL_ROUTED
        value: false
      - type: flag
        flagId: VERIFIERS_RESTARTED
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 9
      - resourceId: COST
        amount: 30
      - resourceId: OPERATIONAL_RISK
        amount: 6
    effects:
      - type: set_flag
        flagId: VERIFIERS_RESTARTED
        value: true
      - type: set_signal
        signalId: ERROR_RATE
        value: 15
      - type: set_signal
        signalId: IDENTITY_RETRY_RATE
        value: 250
      - type: set_signal
        signalId: VERIFIER_BUNDLES
        value: "Accepting ca-18: 3 of 6. verifier-1, -3, -5 reloaded bundle 2025-11. verifier-2, -4,
          -6 restarted into 2025-10; there is nothing newer on their disks."
      - type: reveal_signal
        signalId: VERIFIER_BUNDLES
      - type: post_message
        messageId: RESTART_HALF
  - id: ROLLBACK_CERTIFICATE_ROLLOVER
    title: Withdraw ca-18 and sign with ca-17 again (signs out 31,000 customers)
    category: MODIFY
    durationSeconds: 60
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 10
      - resourceId: COST
        amount: 40
      - resourceId: OPERATIONAL_RISK
        amount: 12
    effects:
      - type: resolve_mechanism
        mechanismId: ISSUER_CHAIN_MISMATCH
      - type: cancel_event
        eventId: POOL_STRAIN
      - type: cancel_event
        eventId: POOL_SATURATES
      - type: set_signal
        signalId: ERROR_RATE
        value: 0.5
      - type: set_signal
        signalId: IDENTITY_RETRY_RATE
        value: 14
      - type: set_signal
        signalId: POOL_LOAD
        value: 22
      - type: set_signal
        signalId: CURRENT_ISSUER
        value: ca-17 (ca-18 withdrawn, 31,240 sessions revoked)
      - type: post_message
        messageId: ROLLBACK_DONE
      - type: schedule_event
        eventId: RELOGIN_WAVE
  - id: REPAIR_TRUST_DISTRIBUTION
    title: Push the ca-18 trust bundle to the three verifiers missing it
    category: MODIFY
    durationSeconds: 150
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
      - type: signal_revealed
        signalId: VERIFIER_BUNDLES
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 14
      - resourceId: COST
        amount: 130
      - resourceId: OPERATIONAL_RISK
        amount: 3
    effects:
      - type: resolve_mechanism
        mechanismId: ISSUER_CHAIN_MISMATCH
      - type: cancel_event
        eventId: POOL_STRAIN
      - type: cancel_event
        eventId: POOL_SATURATES
      - type: set_signal
        signalId: ERROR_RATE
        value: 0.5
      - type: set_signal
        signalId: IDENTITY_RETRY_RATE
        value: 16
      - type: set_signal
        signalId: POOL_LOAD
        value: 22
      - type: set_signal
        signalId: TRUSTED_ISSUER
        value: ca-17 and ca-18
      - type: set_signal
        signalId: VERIFIER_BUNDLES
        value: "Accepting ca-18: 6 of 6. All verifiers running bundle 2025-11."
      - type: post_message
        messageId: REPAIR_DONE
  - id: UPDATE_WAR_ROOM
    title: Post a status update to the War Room
    category: COMMUNICATE
    durationSeconds: 15
    initiallyAvailable: true
    effects:
      - type: post_message
        messageId: STATUS_SENT
  - id: ASK_MARCUS_INSPECT_TRUST
    title: Ask Marcus to pull the issuance and bundle history
    category: DELEGATE
    durationSeconds: 20
    initiallyAvailable: true
    requirements:
      - type: resource
        resourceId: TEAM_CAPACITY
        operator: gte
        value: 1
    costs:
      - resourceId: TEAM_CAPACITY
        amount: -1
    effects:
      - type: post_message
        messageId: TEAM_ACK
      - type: schedule_event
        eventId: TEAM_RESULT
    delegation:
      roleId: MARCUS
      eventId: TEAM_RESULT
      capacityResourceId: TEAM_CAPACITY
events:
  - id: ARM_PRESSURE_TIMELINE
    type: conditional
    conditions:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    once: true
    effects:
      - type: schedule_event
        eventId: STORM_BUILDS
  - id: STORM_BUILDS
    type: timer
    delaySeconds: 75
    targetServiceId: IDENTITY_GATEWAY
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: ISSUER_CHAIN_MISMATCH
    effects:
      - type: change_signal
        signalId: ERROR_RATE
        amount: 8
      - type: change_signal
        signalId: IDENTITY_RETRY_RATE
        amount: 260
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 16
      - type: post_message
        messageId: LOCKOUT_GROWS
      - type: schedule_event
        eventId: STORM_PEAKS
  - id: STORM_PEAKS
    type: timer
    delaySeconds: 110
    targetServiceId: IDENTITY_GATEWAY
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: ISSUER_CHAIN_MISMATCH
    effects:
      - type: change_signal
        signalId: ERROR_RATE
        amount: 9
      - type: change_signal
        signalId: IDENTITY_RETRY_RATE
        amount: 300
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 24
      - type: post_message
        messageId: STORM_PEAK
  - id: POOL_STRAIN
    type: timer
    delaySeconds: 130
    targetServiceId: TRUSTED_POOL
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: ISSUER_CHAIN_MISMATCH
    effects:
      - type: set_signal
        signalId: POOL_LOAD
        value: 91
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 6
      - type: post_message
        messageId: PARTNER_SLOW
  - id: POOL_SATURATES
    type: timer
    delaySeconds: 200
    targetServiceId: TRUSTED_POOL
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: ISSUER_CHAIN_MISMATCH
    effects:
      - type: set_flag
        flagId: POOL_SATURATED
        value: true
      - type: set_signal
        signalId: POOL_LOAD
        value: 100
      - type: set_signal
        signalId: ERROR_RATE
        value: 42
      - type: set_signal
        signalId: IDENTITY_RETRY_RATE
        value: 840
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 20
      - type: post_message
        messageId: POOL_FULL
      - type: schedule_event
        eventId: STORM_PEAKS
  - id: RELOGIN_WAVE
    type: timer
    delaySeconds: 40
    effects:
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 22
      - type: post_message
        messageId: RELOGIN
  - id: TEAM_RESULT
    type: timer
    delaySeconds: 110
    effects:
      - type: reveal_signal
        signalId: TEAM_OBSERVATION
      - type: reveal_evidence
        evidenceId: TEAM_DIAGNOSIS
      - type: change_resource
        resourceId: TEAM_CAPACITY
        amount: 1
      - type: post_message
        messageId: TEAM_REPORT
evidence:
  - id: OPERATIONAL_DIAGNOSIS
    title: Sessions signed by ca-18
    description: Every rejected sign-in carries a chain issued by ca-18, promoted at 01:12 without a
      change ticket. 31,240 sessions have been signed by it in the last 40 minutes.
  - id: CONFIGURATION_COMPARISON
    title: Issuer ahead of its trust bundle
    description: Verifiers trust ca-17 only. The bundle that adds ca-18 reached three of six verifiers
      and none has loaded it.
  - id: TEAM_DIAGNOSIS
    title: Marcus's issuance history
    description: ca-18 went live six hours ahead of its trust bundle, on a request with no change
      ticket. Marcus recommends withdrawing it.
  - id: GHOST_ARCHIVE_FRAGMENT
    title: Unsigned workload archive fragment
    description: "Archive record: observer manifest, no owner, no signature, shadow-7 request
      stream. The ca-18 promotion request carries the same tag."
    sourceNarrativeId: GHOST_ARCHIVE_RECONSTRUCTION
  - id: NULL_NAME
    title: Security attribution notice
    description: Marcus has opened case 2231 and given whoever is behind the shadow-7 trail a
      codename. NULL. Nobody knows yet who, or what, it is.
    sourceNarrativeId: SECURITY_THREAT_NAME
narratives:
  - id: GHOST_ARCHIVE_RECONSTRUCTION
    title: Correlated workload archive
    body: The archive returns the observer manifest from the night the gateway drowned. Owner blank,
      signature blank, shadow-7 in every request. The request that promoted ca-18 at 01:12 carries
      the same tag. Whatever launched the observer has been in your certificates too.
    conditions:
      - type: action_completed
        actionId: RETRACE_WORKLOAD_ARCHIVE
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    effects:
      - type: reveal_evidence
        evidenceId: GHOST_ARCHIVE_FRAGMENT
  - id: SECURITY_THREAT_NAME
    title: A name for it
    body: Marcus pins the notice to the bridge without a word. Case 2231. Threat actor. One line
      where a name should be, and Security has finally written one in. NULL. It is the first time
      the thing in your logs has had a name, and the name tells you nothing at all.
    conditions:
      - type: action_completed
        actionId: READ_SECURITY_ATTRIBUTION
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    effects:
      - type: reveal_evidence
        evidenceId: NULL_NAME
      - type: post_message
        messageId: SECURITY_NAME_REPORT
warRoom:
  roles:
    - id: MAYA
      name: Maya / SRE Lead
    - id: MARCUS
      name: Marcus / Security
    - id: SAM
      name: Sam / Platform
    - id: JIN
      name: Jin / Support
    - id: OPERATOR
      name: Operator
  messages:
    - id: MAYA_OPEN
      roleId: MAYA
      text: Identity is rejecting every new sign-in. Anyone already logged in is fine; anyone signing
        in fresh bounces. Morning peak is coming. Find out why.
      initial: true
    - id: SUPPORT_OPEN
      roleId: JIN
      text: Customers can't sign in. The app tells them their certificate can't be verified, which
        they're reading as "you've been hacked".
      initial: true
    - id: MARCUS_OPEN
      roleId: MARCUS
      text: Security here. An issuer we weren't expecting for another six hours is signing production
        sessions. I'm treating this as hostile until someone shows me otherwise.
      initial: true
    - id: TEAM_ACK
      roleId: MARCUS
      text: Pulling the issuance log and the bundle rollout history. Give me two minutes.
    - id: TEAM_REPORT
      roleId: MARCUS
      text: ca-18 went live six hours ahead of its trust bundle, and the promotion came from a request
        with no change ticket. An issuer that shows up early is an issuer I don't trust. I'd roll it
        back, whatever it costs.
    - id: LOCKOUT_GROWS
      roleId: JIN
      text: Retries are piling up. People who failed once are hammering the button and failing
        faster.
    - id: STORM_PEAK
      roleId: MAYA
      text: Half of sign-ins are failing and the morning peak has started. I need a decision, not another
        graph.
    - id: PARTNER_SLOW
      roleId: JIN
      text: The partner banks share the old identity pool. Their API sign-ins just went from 200 ms to
        four seconds.
    - id: POOL_FULL
      roleId: SAM
      text: The old pool is at 100%. It was sized for a quarter of our traffic. Everything we sent
        there is bouncing back.
    - id: RESTART_HALF
      roleId: SAM
      text: Restart's done. Three of six came back accepting ca-18. The other three rebooted into the
        same old bundle. Nothing newer ever reached them.
    - id: ROLLBACK_DONE
      roleId: SAM
      text: ca-18 is withdrawn and we're signing with ca-17 again. New sign-ins work. Everyone who
        signed in under ca-18 just got logged out.
    - id: RELOGIN
      roleId: JIN
      text: 31,000 customers just got signed out mid-session. The sign-in queue is eleven minutes long
        and the phones haven't stopped.
    - id: REPAIR_DONE
      roleId: SAM
      text: Bundle 2025-11 is on all six verifiers and loaded. ca-18 verifies everywhere. Nobody got
        logged out.
    - id: STATUS_SENT
      roleId: OPERATOR
      text: "Status posted: customers cannot sign in because a new certificate issuer went live before
        our verifiers trusted it. Existing sessions are unaffected. A fix is in progress."
    - id: SECURITY_NAME_REPORT
      roleId: MARCUS
      text: Case 2231 is open. Codename NULL. Same tag as the unsigned workload, same no-ticket
        habit. I don't know who it is. I know it's been here before.
resolution:
  mode: all
  conditions:
    - type: mechanism_resolved
      mechanismId: ISSUER_CHAIN_MISMATCH
  effects:
    - type: set_flag
      flagId: ROOT_CAUSE_CONTAINED
      value: true
completion:
  mode: all
  conditions:
    - type: flag
      flagId: ROOT_CAUSE_CONTAINED
      value: true
    - type: signal
      signalId: ERROR_RATE
      operator: lte
      value: 1
    - type: signal
      signalId: IDENTITY_RETRY_RATE
      operator: lte
      value: 25
  effects: []
postmortem:
  scoringInputs:
    - id: RECOVERY_TIME
      label: Time to restore sign-ins
      source: elapsed_time
    - id: FINAL_ERROR_RATE
      label: Final sign-in failure rate
      source: signal
      refId: ERROR_RATE
    - id: FINAL_PRESSURE
      label: Final handshake retry rate
      source: signal
      refId: IDENTITY_RETRY_RATE
    - id: CUSTOMER_IMPACT
      label: Customer impact
      source: resource
      refId: CUSTOMER_IMPACT
    - id: COST
      label: Response cost
      source: resource
      refId: COST
    - id: OPERATIONAL_RISK
      label: Operational risk
      source: resource
      refId: OPERATIONAL_RISK
    - id: MITIGATION_COUNT
      label: Sign-ins routed to the old pool
      source: action_count
      refId: ROUTE_TRUSTED_IDENTITY_POOL
    - id: ROLLBACK_COUNT
      label: Issuer rollbacks
      source: action_count
      refId: ROLLBACK_CERTIFICATE_ROLLOVER
    - id: COMMUNICATION_COUNT
      label: War Room updates
      source: action_count
      refId: UPDATE_WAR_ROOM
