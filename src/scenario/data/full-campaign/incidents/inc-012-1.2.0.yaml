warRoom:
  roles:
    - id: MAYA
      name: Maya / SRE Lead
    - id: ALEX
      name: Alex / DBA
    - id: JIN
      name: Jin / Support
    - id: LEGAL
      name: Dana / Legal
    - id: OPERATOR
      name: Operator
    - id: ARCHIVE
      name: Verified Records
  messages:
    - id: MAYA_OPEN
      roleId: MAYA
      text: Nothing is down yet. Telemetry writes are failing in ones and twos and the dashboards are a
        little behind. That is how quiet nights turn into blind ones. Take your time, but take it.
      initial: true
    - id: SUPPORT_OPEN
      roleId: JIN
      text: A few teams are asking why their graphs stopped at 02:50. Nobody customer-facing yet.
      initial: true
    - id: LEGAL_OPEN
      roleId: LEGAL
      text: Heads up. The reconstruction job on the archive pool is under legal hold LH-0931. Slow it if
        you must. Do not stop it without talking to me.
      initial: true
    - id: TEAM_ACK
      roleId: ALEX
      text: Let me look at the reservation tables before anyone moves anything. Couple of minutes.
    - id: TEAM_REPORT
      roleId: ALEX
      text: A cutover copies every outstanding read. At 212 it will never catch up. Get the queue under 40
        first. Throttle it, don't pause it; a paused job freezes its reservations mid-flight and the
        copy cannot take them.
    - id: DASHBOARDS_BEHIND
      roleId: JIN
      text: On-call dashboards are three minutes behind now. Two teams just asked me whether their
        services are down. I don't know what to tell them.
    - id: ALERTS_DROPPED
      roleId: MAYA
      text: Alerting dropped two pages because telemetry acknowledgements timed out. We are starting to
        fly blind on everything else in the building.
    - id: NO_STATUS_REPORT
      roleId: JIN
      text: Four minutes and no status from us. People are filing duplicate tickets to get our attention.
    - id: LEGAL_ON_THROTTLE
      roleId: LEGAL
      text: Throttled is fine. The hold requires the job to run, not to run fast.
    - id: THROTTLE_EXPIRED
      roleId: ALEX
      text: The throttle hit its five-minute ceiling and the scheduler gave the job its full share back.
        It is making up for lost time.
    - id: LEGAL_ESCALATION
      roleId: LEGAL
      text: A paused job under hold LH-0931 is a preservation gap. I have escalated to the General
        Counsel. I need it running again.
    - id: LEGAL_RESUMED
      roleId: LEGAL
      text: Counsel ordered the job resumed. It is back, and it is replaying the gap at full speed.
    - id: MIGRATION_STARTED
      roleId: ALEX
      text: Cutover started. It copies every outstanding reservation to the new pool. Two and a half
        minutes if the queue stays small.
    - id: CUTOVER_DONE
      roleId: ALEX
      text: Cutover converged. Archive reads have their own pool now; telemetry writes are acknowledging
        in four milliseconds.
    - id: CUTOVER_FAILED
      roleId: ALEX
      text: Cutover aborted at 61 percent. The job opened reservations faster than we could copy them, and
        every write in the copy window was dropped.
    - id: STATUS_SENT
      roleId: OPERATOR
      text: "Status posted: an archive reconstruction job is crowding live telemetry writes. Dashboards
        lag; no customer data is affected. Moving the archive reads to their own pool."
    - id: REPORT_GHOST_ARTIFACT
      roleId: ARCHIVE
      text: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank."
    - id: REPORT_NULL_NAME
      roleId: ARCHIVE
      text: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    - id: REPORT_ORPHEUS_ACTIVE
      roleId: ARCHIVE
      text: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core,
        -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    - id: REPORT_NULL_AI
      roleId: ARCHIVE
      text: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    - id: REPORT_NULL_ADVERSARY
      roleId: ARCHIVE
      text: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL
        runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    - id: REPORT_CONTROLLED_EXPERIMENT
      roleId: ARCHIVE
      text: "INC-001 / Experiment ADV-18471 / Human subject: EMPLOYEE #4172."
    - id: MAYA_READS_LINEAGE
      roleId: MAYA
      text: "#4172. That's your badge number. I signed off on that night's postmortem. Nobody told me it
        had an experiment ID."
