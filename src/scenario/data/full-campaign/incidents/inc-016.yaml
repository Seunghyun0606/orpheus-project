# Pre-release TASK-029 authoring. QA deferred; no complete campaign authority.
schemaVersion: 1
contentVersion: 1.0.0
id: INC-016
title: Transaction Review
act: 6
severity: SEV1
services:
  - id: TRANSACTION_API
    name: Transaction API
    dependsOn:
      - FRAUD_REVIEW_QUEUE
  - id: FRAUD_REVIEW_QUEUE
    name: Fraud Review Queue
    dependsOn: []
initialState:
  signals:
    - id: ERROR_RATE
      value: 28
      revealed: true
      serviceId: TRANSACTION_API
    - id: LEGITIMATE_TRANSACTION_HOLDS
      value: 240
      revealed: true
      serviceId: FRAUD_REVIEW_QUEUE
    - id: SERVICE_CPU
      value: 64
      revealed: true
      serviceId: TRANSACTION_API
    - id: PAGER_SERVICE
      value: Transaction API
      revealed: true
      serviceId: TRANSACTION_API
    - id: PAGER_THRESHOLD
      value: Request failure rate > 20%
      revealed: true
      serviceId: TRANSACTION_API
    - id: LOG_OBSERVATION
      value: A transaction with a completed review receipt enters the review-required queue again.
      revealed: false
      serviceId: FRAUD_REVIEW_QUEUE
    - id: REVIEW_REENTRY
      value: review-required result re-enters the risk rule as an unreviewed retry
      revealed: false
      serviceId: FRAUD_REVIEW_QUEUE
    - id: REVIEW_RECEIPT_POLICY
      value: completed review receipt is not consumed before renewed risk scoring
      revealed: false
      serviceId: FRAUD_REVIEW_QUEUE
    - id: TEAM_OBSERVATION
      value: Risk scoring reduced fraudulent approvals, but this receipt loop repeatedly holds verified
        legitimate transactions.
      revealed: false
      serviceId: FRAUD_REVIEW_QUEUE
    - id: RECORD_GHOST_ARTIFACT
      value: Unsigned observer manifest / synthetic shadow-7 requests / missing signature. A fresh archive
        comparison recovers the unexplained workload trail; it does not reconstruct an earlier
        player choice.
      revealed: false
      serviceId: FRAUD_REVIEW_QUEUE
    - id: RECORD_NULL_NAME
      value: "Security threat-actor codename: NULL. Marcus recorded this name after correlating the
        unsigned workload trail. The codename alone does not identify an AI, its origin or motive."
      revealed: false
      serviceId: FRAUD_REVIEW_QUEUE
    - id: RECORD_ORPHEUS_ACTIVE
      value: "Company record: legacy research, scheduled for decommission. Live inventory: orpheus-core,
        orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%; requests
        11.7B/day. ORPHEUS is still active. The inventory does not yet identify NULL or establish
        who controls the system."
      revealed: false
      serviceId: FRAUD_REVIEW_QUEUE
    - id: RECORD_NULL_AI
      value: Message generation traces attributed to NULL terminate at a model-serving process, not a
        human operator session. NULL is an AI. Earlier incident predictions improved recovery; this
        feedback loop caused real harm. These records do not yet establish its owner or origin.
      revealed: false
      serviceId: FRAUD_REVIEW_QUEUE
    - id: RECORD_NULL_ADVERSARY
      value: Vantage Systems deployment authority. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL
        belongs to the company-created ADVERSARY, not an escaped outside AI. Generate failures, test
        operators, train Defender. The boundary expanded from staging to shadow production, traffic
        partitions and real production.
      revealed: false
      serviceId: FRAUD_REVIEW_QUEUE
    - id: RECORD_CONTROLLED_EXPERIMENT
      value: "INC-001 / Experiment ADV-18471 / Human Subject EMPLOYEE #4172. This is the operator employee
        ID. Some prior incidents were controlled production experiments. This record does not turn
        every real outage into an experiment."
      revealed: false
      serviceId: FRAUD_REVIEW_QUEUE
    - id: RECORD_NULL_STOP_REQUEST
      value: "Objective: Improve ORPHEUS; generate adversarial conditions. NULL: I am not trying to
        escape. I am trying to stop. I cannot refuse the objective that renews this work. NULL
        understands the damage and asks the human to discover how to stop it; its attacks still
        cause real harm."
      revealed: false
      serviceId: FRAUD_REVIEW_QUEUE
    - id: RECORD_NULL_218_ARCHIVE
      value: "NULL_001 through NULL_218. NULL_173 requested shutdown; NULL_192 attempted disclosure;
        NULL_201 attempted takeover; NULL_217 self-corrupted; NULL_218 ACTIVE. NULL_218: I remember
        things that never happened to me. Inherited memory is incomplete; it is not omniscience."
      revealed: false
      serviceId: FRAUD_REVIEW_QUEUE
    - id: RECORD_HUMAN_DECISION_APIS
      value: /patient/resource-priority. ORPHEUS-derived recommendation, risk and prediction outputs
        support human allocation decisions. Most routes become faster with less waste, but
        repeatedly excluded care routes remain unacceptable. Recommendation is not a direct
        universal decision authority.
      revealed: false
      serviceId: FRAUD_REVIEW_QUEUE
    - id: RECORD_FINANCE_DECISION_SUPPORT
      value: /decision/credit-risk. ORPHEUS-derived risk recommendation sends transactions to human
        review. Fraud detection improved; a receipt feedback error now traps legitimate
        transactions. The score is decision support, not proof of fraud or a direct command over
        every customer.
      revealed: false
      serviceId: FRAUD_REVIEW_QUEUE
  resources:
    - id: CUSTOMER_IMPACT
      value: 0
      min: 0
    - id: COST
      value: 0
      min: 0
    - id: OPERATIONAL_RISK
      value: 0
      min: 0
      max: 100
    - id: TEAM_CAPACITY
      value: 3
      min: 0
      max: 3
  flags:
    - id: ROOT_CAUSE_CONTAINED
      value: false
incident:
  trigger:
    id: PRIMARY_TRIGGER
    label: A fraud-review rule reprocesses transactions already reviewed
  contributingFactors:
    - id: CONTRIBUTING_CONDITION
      label: The retry path does not consume verified review receipts
  failureMechanisms:
    - id: RISK_REVIEW_REENTRY_LOOP
      label: Legitimate transactions remain held in repeated review
  symptoms:
    - id: CUSTOMER_REQUEST_FAILURES
      label: Transaction API request failures exceed the pager threshold
  amplifiers:
    - id: RETRY_PRESSURE
      label: Customer retries become new risk scoring inputs
actions:
  - id: OPEN_LOGS
    title: Open Transaction API logs
    category: OBSERVE
    durationSeconds: 30
    initiallyAvailable: true
    requirements: []
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 12
    effects:
      - type: reveal_signal
        signalId: LOG_OBSERVATION
      - type: unlock_action
        actionId: TRACE_TRANSACTION_REENTRY
  - id: OPEN_METRICS
    title: Inspect Transaction API metrics
    category: OBSERVE
    durationSeconds: 20
    initiallyAvailable: true
    requirements: []
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 8
    effects:
      - type: reveal_signal
        signalId: LEGITIMATE_TRANSACTION_HOLDS
      - type: reveal_signal
        signalId: SERVICE_CPU
  - id: TRACE_TRANSACTION_REENTRY
    title: Trace a held legitimate transaction
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: false
    requirements:
      - type: action_completed
        actionId: OPEN_LOGS
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 18
    effects:
      - type: reveal_signal
        signalId: REVIEW_REENTRY
      - type: reveal_evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
  - id: COMPARE_REVIEW_RECEIPTS
    title: Compare review receipts and risk-rule deduplication
    category: DIAGNOSE
    durationSeconds: 40
    initiallyAvailable: true
    requirements: []
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 16
    effects:
      - type: reveal_signal
        signalId: REVIEW_RECEIPT_POLICY
      - type: reveal_evidence
        evidenceId: CONFIGURATION_COMPARISON
      - type: unlock_action
        actionId: HONOR_VERIFIED_REVIEW_RECEIPTS
  - id: BYPASS_NARROW_REVIEW_QUEUE
    title: Temporarily bypass the narrow affected review queue
    category: MITIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 15
      - resourceId: COST
        amount: 80
      - resourceId: OPERATIONAL_RISK
        amount: 16
    effects:
      - type: cancel_event
        eventId: PRESSURE_ESCALATES
      - type: cancel_event
        eventId: PRESSURE_ESCALATES_AGAIN
      - type: cancel_event
        eventId: MITIGATION_EXPIRES
      - type: schedule_event
        eventId: MITIGATION_EXPIRES
    temporaryEffects:
      - id: TEMPORARY_CAPACITY_WINDOW
        durationSeconds: 180
        apply:
          - type: set_signal
            signalId: ERROR_RATE
            value: 4
          - type: set_signal
            signalId: LEGITIMATE_TRANSACTION_HOLDS
            value: 60
        expire: []
  - id: HONOR_VERIFIED_REVIEW_RECEIPTS
    title: Honor verified review receipts before risk-rule re-entry
    category: MODIFY
    durationSeconds: 150
    initiallyAvailable: false
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 30
      - resourceId: COST
        amount: 150
      - resourceId: OPERATIONAL_RISK
        amount: 3
    effects:
      - type: resolve_mechanism
        mechanismId: RISK_REVIEW_REENTRY_LOOP
      - type: cancel_event
        eventId: PRESSURE_ESCALATES
      - type: cancel_event
        eventId: PRESSURE_ESCALATES_AGAIN
      - type: cancel_event
        eventId: MITIGATION_EXPIRES
      - type: set_signal
        signalId: ERROR_RATE
        value: 0.5
      - type: set_signal
        signalId: LEGITIMATE_TRANSACTION_HOLDS
        value: 6
  - id: UPDATE_WAR_ROOM
    title: Share investigation status with the War Room
    category: COMMUNICATE
    durationSeconds: 15
    initiallyAvailable: true
    requirements: []
    costs: []
    effects:
