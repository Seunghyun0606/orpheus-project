    type: conditional
    conditions:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    once: true
    effects:
      - type: schedule_event
        eventId: PRESSURE_ESCALATES
  - id: PRESSURE_ESCALATES
    type: timer
    delaySeconds: 90
    targetServiceId: TRANSACTION_API
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: RISK_REVIEW_REENTRY_LOOP
    effects:
      - type: set_signal
        signalId: ERROR_RATE
        value: 37
      - type: set_signal
        signalId: LEGITIMATE_TRANSACTION_HOLDS
        value: 360
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 20
      - type: post_message
        messageId: SUPPORT_ESCALATION
      - type: schedule_event
        eventId: PRESSURE_ESCALATES_AGAIN
  - id: PRESSURE_ESCALATES_AGAIN
