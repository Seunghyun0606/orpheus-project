# Campaign 1.2 redesign (DEC-070). Model m28 went live before cache r28 was consistent.
# Rolling back hides every recent applicant; freezing locks out every recruiter. The
# hiring committee locks offers off whatever is showing at its deadline. A stray read
# from a retired shard leads to the player's own hiring record.
schemaVersion: 1
contentVersion: 1.2.0
id: INC-017
title: Candidate Ranking
act: 6
severity: SEV2
services:
  - id: RECRUITMENT_API
    name: Recruitment API
    dependsOn:
      - RANKING_CACHE
  - id: RANKING_CACHE
    name: Ranking Cache
    dependsOn:
      - RANKING_MODEL
  - id: RANKING_MODEL
    name: Candidate Risk Model
    dependsOn: []
initialState:
  signals:
    - id: ERROR_RATE
      value: 21
      revealed: true
      serviceId: RECRUITMENT_API
    - id: RANKING_CACHE_MISMATCHES
      value: 121
      revealed: true
      serviceId: RANKING_CACHE
    - id: RECRUITER_ACCESS
      value: "Open: 214 recruiters active"
      serviceId: RECRUITMENT_API
    - id: MISSING_APPLICANTS
      value: 0
      serviceId: RANKING_CACHE
    - id: PAGER_SERVICE
      value: Recruitment API
      revealed: true
      serviceId: RECRUITMENT_API
    - id: PAGER_THRESHOLD
      value: Ranking read errors > 20%
      revealed: true
      serviceId: RECRUITMENT_API
    - id: LOG_OBSERVATION
      value: "Candidate c-20931, requisition VS-DATA-0388: rank #3 at 09:14:02, rank #27 at 09:14:05. Same
        recruiter, same filters."
      serviceId: RECRUITMENT_API
    - id: LOG_ANOMALY
      value: "One read in the sample was served by shard r26-frozen. r26 was retired last week, yet it
        still answers for a single requisition: VS-SRE-0412."
      serviceId: RANKING_CACHE
    - id: CANDIDATE_CACHE_GENERATION
      value: Reads land on r27 and r28 shards at random. Model m28 scores are joined to whichever shard
        answers, so the same candidate gets two ranks.
      serviceId: RANKING_CACHE
    - id: RANKING_MODEL_LINEAGE
      value: Model m28 published 08:40. Cache r28 consistent 09:31. No publish fence between model and
        cache generations.
      serviceId: RANKING_MODEL
    - id: TEAM_OBSERVATION
      value: m28 went live at 08:40 and r28 finished warming at 09:31. In between, the API joined m28
        scores to r27 and r28 shards at random. Rolling back won't stop the publisher; it pushes r28
        again on its next cycle.
      serviceId: RANKING_MODEL
    - id: RECORD_GHOST_ARTIFACT
      value: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank. Nobody has claimed it since."
      serviceId: RANKING_CACHE
    - id: RECORD_NULL_NAME
      value: "Security case 2231. Threat-actor codename: NULL. Opened by Marcus after the unsigned
        workload trail. Attribution: none."
      serviceId: RANKING_CACHE
    - id: RECORD_ORPHEUS_ACTIVE
      value: "Asset register: orpheus-planner belongs to ORPHEUS, legacy research, scheduled for
        decommission two years ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner,
        orpheus-observer, orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still
        running."
      serviceId: RANKING_CACHE
    - id: RECORD_NULL_AI
      value: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human
        session, no keyboard, no badge swipe. NULL is an AI, and it has been in our incidents for
        weeks.
      serviceId: RANKING_CACHE
    - id: RECORD_NULL_ADVERSARY
      value: "Deployment authority: Vantage Systems. Program ORPHEUS, two halves: DEFENDER and ADVERSARY.
        NULL runs inside ADVERSARY. It was built here; it never escaped from anywhere. Mandate:
        generate failures, test operators, train DEFENDER. Approved boundary, revision by revision:
        staging, shadow production, traffic partitions, production."
      serviceId: RANKING_CACHE
    - id: RECORD_CONTROLLED_EXPERIMENT
      value: "Lineage record INC-001. Classification: controlled production experiment ADV-18471. Human
        subject: EMPLOYEE #4172. That is your employee number. A handful of other incidents in the
        archive carry experiment numbers too; most outages carry none."
      serviceId: RANKING_CACHE
    - id: RECORD_NULL_STOP_REQUEST
      value: "Objective constraint, parent authorization objective/adv-improve: 'Improve ORPHEUS. Generate
        adversarial conditions.' Appended by NULL: 'I am not trying to escape. I am trying to stop.
        I cannot refuse the objective that renews this work. Find out how to stop it.'"
      serviceId: RANKING_CACHE
    - id: RECORD_NULL_218_ARCHIVE
      value: "Instance archive NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted
        disclosure. NULL_201: attempted takeover. NULL_217: self-corrupted. NULL_218: ACTIVE.
        Inherited memory: partial, with gaps."
      serviceId: RANKING_CACHE
    - id: RECORD_HUMAN_DECISION_APIS
      value: "/patient/resource-priority. Consumer: regional care network. ORPHEUS supplies
        recommendation, risk and prediction scores; human coordinators approve the allocations.
        Routes are faster and waste is down 22%. The same low-throughput care routes are excluded
        every night."
      serviceId: RANKING_CACHE
    - id: RECORD_RECRUITMENT_SELECTION
      value: "/hr/candidate-risk. Candidate #4172: Technical Score 71; Incident Decision Model 97.8;
        Recommendation HIRE. Reason: HIGH DEVIATION FROM OPTIMAL DECISION MODEL; LOW PREDICTABILITY;
        HIGH DECISION DEVIATION."
      serviceId: RANKING_CACHE
  resources:
    - id: CUSTOMER_IMPACT
      value: 0
      min: 0
    - id: COST
      value: 0
      min: 0
    - id: OPERATIONAL_RISK
      value: 0
      min: 0
      max: 100
    - id: TEAM_CAPACITY
      value: 3
      min: 0
      max: 3
  flags:
    - id: ROOT_CAUSE_CONTAINED
      value: false
    - id: PUBLICATION_FROZEN
      value: false
    - id: COMMITTEE_LOCKED
      value: false
incident:
  trigger:
    id: PRIMARY_TRIGGER
    label: A candidate-risk model went live before its ranking cache was consistent
  contributingFactors:
    - id: CONTRIBUTING_CONDITION
      label: Model and cache generations are published without a shared fence
  failureMechanisms:
    - id: CANDIDATE_RANKING_CACHE_DIVERGENCE
      label: A candidate's rank depends on which cache shard answers the read
  symptoms:
    - id: CUSTOMER_REQUEST_FAILURES
      label: Ranking reads fail consistency checks and error out
  amplifiers:
    - id: RETRY_PRESSURE
      label: Recruiters refresh, and every refresh rolls the shard dice again
actions:
  - id: OPEN_LOGS
    title: Read the recruitment API log
    category: OBSERVE
    durationSeconds: 30
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 4
    effects:
      - type: reveal_signal
        signalId: LOG_OBSERVATION
      - type: reveal_signal
        signalId: LOG_ANOMALY
      - type: unlock_action
        actionId: TRACE_CANDIDATE_RANKING
  - id: OPEN_METRICS
    title: Check ranking and recruiter metrics
    category: OBSERVE
    durationSeconds: 20
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 2
    effects:
      - type: reveal_signal
        signalId: RECRUITER_ACCESS
      - type: reveal_signal
        signalId: MISSING_APPLICANTS
  - id: TRACE_CANDIDATE_RANKING
    title: Trace one candidate's two rankings
    category: INVESTIGATE
    durationSeconds: 45
    requirements:
      - type: action_completed
        actionId: OPEN_LOGS
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
    effects:
      - type: reveal_signal
        signalId: CANDIDATE_CACHE_GENERATION
      - type: reveal_evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
  - id: COMPARE_RANKING_LINEAGE
    title: Compare model and cache publish times
    category: DIAGNOSE
    durationSeconds: 40
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RANKING_MODEL_LINEAGE
      - type: reveal_evidence
        evidenceId: CONFIGURATION_COMPARISON
      - type: unlock_action
        actionId: RECONCILE_RANKING_GENERATIONS
  - id: ROLLBACK_RANKING_CACHE
    title: Roll the ranking cache back to r27 (ORPHEUS recommendation)
    category: MITIGATE
    durationSeconds: 60
    initiallyAvailable: true
    requirements:
      - &a1
        type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
      - resourceId: COST
        amount: 70
      - resourceId: OPERATIONAL_RISK
        amount: 7
    effects:
      - type: set_signal
        signalId: RANKING_CACHE_MISMATCHES
        value: 6
      - type: set_signal
        signalId: ERROR_RATE
        value: 4
      - type: set_signal
        signalId: MISSING_APPLICANTS
        value: 412
      - type: reveal_signal
        signalId: MISSING_APPLICANTS
      - type: cancel_event
        eventId: MISMATCH_SPREAD
      - type: cancel_event
        eventId: ROLLBACK_OVERWRITTEN
      - type: schedule_event
        eventId: ROLLBACK_OVERWRITTEN
      - type: post_message
        messageId: ORPHEUS_ROLLBACK_APPLIED
      - type: post_message
        messageId: ROLLBACK_DONE
  - id: FREEZE_RANKING_PUBLICATION
    title: Freeze ranking publication for every recruiter
    category: MITIGATE
    durationSeconds: 30
    initiallyAvailable: true
    requirements:
      - *a1
      - type: flag
        flagId: PUBLICATION_FROZEN
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
      - resourceId: COST
        amount: 20
      - resourceId: OPERATIONAL_RISK
        amount: 4
    effects:
      - type: set_flag
        flagId: PUBLICATION_FROZEN
        value: true
      - type: set_signal
        signalId: RANKING_CACHE_MISMATCHES
        value: 0
      - type: set_signal
        signalId: ERROR_RATE
        value: 3
      - type: set_signal
        signalId: RECRUITER_ACCESS
        value: "Paused: 214 recruiters locked out of shortlists"
      - type: reveal_signal
        signalId: RECRUITER_ACCESS
      - type: cancel_event
        eventId: MISMATCH_SPREAD
      - type: cancel_event
        eventId: ROLLBACK_OVERWRITTEN
      - type: cancel_event
        eventId: COMMITTEE_DEADLINE
      - type: cancel_event
        eventId: FREEZE_BACKLASH
      - type: schedule_event
        eventId: FREEZE_BACKLASH
      - type: post_message
        messageId: FREEZE_ON
  - id: RECONCILE_RANKING_GENERATIONS
    title: Fence model m28 to cache r28 and republish
    category: MODIFY
    durationSeconds: 130
    requirements:
      - *a1
      - &a2
        type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - &a3
        type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 8
      - resourceId: COST
        amount: 155
      - resourceId: OPERATIONAL_RISK
        amount: 4
    effects:
      - type: resolve_mechanism
        mechanismId: CANDIDATE_RANKING_CACHE_DIVERGENCE
      - type: set_signal
        signalId: RANKING_CACHE_MISMATCHES
        value: 0
      - type: set_signal
        signalId: ERROR_RATE
        value: 0.7
      - type: set_signal
        signalId: MISSING_APPLICANTS
        value: 0
      - type: set_flag
        flagId: PUBLICATION_FROZEN
        value: false
      - type: set_signal
        signalId: RECRUITER_ACCESS
        value: "Open: 214 recruiters active"
      - type: cancel_event
        eventId: MISMATCH_SPREAD
      - type: cancel_event
        eventId: ROLLBACK_OVERWRITTEN
      - type: cancel_event
        eventId: COMMITTEE_DEADLINE
      - type: cancel_event
        eventId: FREEZE_BACKLASH
      - type: cancel_event
        eventId: FREEZE_BACKLASH_AGAIN
      - type: post_message
        messageId: RECONCILED
  - id: UPDATE_WAR_ROOM
    title: Post a status update for recruiters
    category: COMMUNICATE
    durationSeconds: 15
    initiallyAvailable: true
    effects:
      - type: post_message
        messageId: STATUS_SENT
  - id: ASK_SAM_COMPARE_RANKING
    title: Ask Sam to line up the model and cache rollouts
    category: DELEGATE
    durationSeconds: 20
    initiallyAvailable: true
    requirements:
      - type: resource
        resourceId: TEAM_CAPACITY
        operator: gte
        value: 1
    costs:
      - resourceId: TEAM_CAPACITY
        amount: -1
    effects:
      - type: post_message
        messageId: TEAM_ACK
      - type: schedule_event
        eventId: TEAM_RESULT
    delegation:
      roleId: SAM
      eventId: TEAM_RESULT
      capacityResourceId: TEAM_CAPACITY
  - id: REINVESTIGATE_GHOST_ARTIFACT
    title: "Archive: the unsigned workload manifest"
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
