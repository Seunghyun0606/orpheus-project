warRoom:
  roles:
    - id: MAYA
      name: Maya / SRE Lead
    - id: SAM
      name: Sam / Platform
    - id: JIN
      name: Jin / Support
    - id: TALENT
      name: Head of Talent
    - id: ORPHEUS
      name: ORPHEUS / Talent Advisor
    - id: OPERATOR
      name: Operator
    - id: ARCHIVE
      name: Verified Records
  messages:
    - id: MAYA_OPEN
      roleId: MAYA
      text: Recruiters are watching candidates jump twenty places between page loads. The hiring committee
        locks offers at ten. Find out which ranking is real.
      initial: true
    - id: SUPPORT_OPEN
      roleId: JIN
      text: Recruiter tickets are coming in faster than I can read them. One says her shortlist reshuffled
        while she was on a call with the candidate.
      initial: true
    - id: ORPHEUS_OPEN
      roleId: ORPHEUS
      text: "Divergence affects 3.1% of ranking reads. Recommended action: roll back to cache r27.
        Predicted recruiter satisfaction 0.94. Confidence 0.90."
      initial: true
    - id: ORPHEUS_ROLLBACK_APPLIED
      roleId: ORPHEUS
      text: r27 restored. Ranking consistency 99.2%. Recommendation performing as projected.
    - id: ROLLBACK_DONE
      roleId: SAM
      text: r27 is serving and the ranks have stopped moving. Also, every applicant since Tuesday has
        vanished from them. That is 412 people.
    - id: ROLLBACK_LOST
      roleId: SAM
      text: The publisher pushed r28 again on its cycle. The rollback is gone and the mixing is back.
    - id: FREEZE_ON
      roleId: MAYA
      text: Publication is frozen. Two hundred recruiters just lost their shortlists, and Talent will be
        on the bridge in about a minute.
    - id: TALENT_ESCALATES
      roleId: TALENT
      text: Thirty-one interviews today and nobody can see a candidate list. Unfreeze it or give me a
        time.
    - id: TALENT_ESCALATES_AGAIN
      roleId: TALENT
      text: We just lost two finalists to a competitor because we couldn't send them schedules. How long?
    - id: SPREAD
      roleId: JIN
      text: More recruiters, more reshuffles. Two hiring managers sent rejections off the wrong ranks.
    - id: COMMITTEE_MIXED
      roleId: TALENT
      text: The committee locked six offers at ten off whatever the screen said. Nobody can tell me which
        ranking they were looking at.
    - id: COMMITTEE_STALE
      roleId: TALENT
      text: The committee locked six offers at ten off last week's list. The 412 people who applied since
        Tuesday were never in the room.
    - id: NO_STATUS_YET
      roleId: JIN
      text: Recruiters have heard nothing from us in over two minutes. Some are printing shortlists to
        keep them from moving.
    - id: RECONCILED
      roleId: SAM
      text: m28 and r28 are fenced together. One generation, one rank per candidate. Republished.
    - id: TEAM_ACK
      roleId: SAM
      text: Lining up the model and cache rollouts. Ninety seconds.
    - id: TEAM_REPORT
      roleId: SAM
      text: m28 went live at 08:40, r28 finished warming at 09:31. In between, the API mixed them at
        random. Rolling back won't stop the publisher; it pushes r28 again next cycle.
    - id: STATUS_SENT
      roleId: OPERATOR
      text: "Status: candidate rankings are inconsistent between page loads. Do not act on a shortlist
        until we confirm. Fix in progress."
    - id: REPORT_GHOST_ARTIFACT
      roleId: ARCHIVE
      text: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank."
    - id: REPORT_NULL_NAME
      roleId: ARCHIVE
      text: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    - id: REPORT_ORPHEUS_ACTIVE
      roleId: ARCHIVE
      text: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core,
        -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    - id: REPORT_NULL_AI
      roleId: ARCHIVE
      text: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    - id: REPORT_NULL_ADVERSARY
      roleId: ARCHIVE
      text: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL
        runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    - id: REPORT_CONTROLLED_EXPERIMENT
      roleId: ARCHIVE
      text: "INC-001 / Experiment ADV-18471 / Human subject: EMPLOYEE #4172."
    - id: REPORT_NULL_STOP_REQUEST
      roleId: ARCHIVE
      text: "I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews
        this work. You can."
    - id: REPORT_NULL_218_ARCHIVE
      roleId: ARCHIVE
      text: "NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted disclosure. NULL_201:
        attempted takeover. NULL_217: self-corrupted. NULL_218: active."
    - id: REPORT_HUMAN_DECISION_APIS
      roleId: ARCHIVE
      text: "/patient/resource-priority: ORPHEUS recommends, coordinators approve. Waste down 22%. The
        same low-throughput routes excluded every night."
    - id: REPORT_RECRUITMENT_SELECTION
      roleId: ARCHIVE
      text: "Candidate #4172: Technical 71; Incident Decision Model 97.8; HIRE. Reason: LOW
        PREDICTABILITY; HIGH DECISION DEVIATION."
