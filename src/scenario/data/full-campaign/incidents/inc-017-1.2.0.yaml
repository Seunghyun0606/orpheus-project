events:
  - id: ARM_PRESSURE_TIMELINE
    type: conditional
    conditions:
      - *a1
    once: true
    effects:
      - type: schedule_event
        eventId: MISMATCH_SPREAD
      - type: schedule_event
        eventId: COMMITTEE_DEADLINE
      - type: schedule_event
        eventId: RECRUITERS_UNINFORMED
  - id: MISMATCH_SPREAD
    type: timer
    delaySeconds: 110
    targetServiceId: RANKING_CACHE
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: CANDIDATE_RANKING_CACHE_DIVERGENCE
    effects:
      - type: set_signal
        signalId: RANKING_CACHE_MISMATCHES
        value: 190
      - type: set_signal
        signalId: ERROR_RATE
        value: 28
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 10
      - type: post_message
        messageId: SPREAD
  - id: ROLLBACK_OVERWRITTEN
    type: timer
    delaySeconds: 150
    targetServiceId: RANKING_CACHE
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: CANDIDATE_RANKING_CACHE_DIVERGENCE
    effects:
      - type: set_signal
        signalId: RANKING_CACHE_MISMATCHES
        value: 140
      - type: set_signal
        signalId: ERROR_RATE
        value: 23
      - type: set_signal
        signalId: MISSING_APPLICANTS
        value: 0
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 8
      - type: post_message
        messageId: ROLLBACK_LOST
  - id: COMMITTEE_DEADLINE
    type: timer
    delaySeconds: 260
    targetServiceId: RECRUITMENT_API
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: CANDIDATE_RANKING_CACHE_DIVERGENCE
    effects:
      - type: set_flag
        flagId: COMMITTEE_LOCKED
        value: true
  - id: COMMITTEE_LOCKS_STALE_RANKS
    type: conditional
    conditions:
      - type: flag
        flagId: COMMITTEE_LOCKED
        value: true
      - type: signal
        signalId: MISSING_APPLICANTS
        operator: gt
        value: 0
    once: true
    effects:
      - type: set_flag
        flagId: COMMITTEE_LOCKED
        value: false
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 12
      - type: post_message
        messageId: COMMITTEE_STALE
  - id: COMMITTEE_LOCKS_MIXED_RANKS
    type: conditional
    conditions:
      - type: flag
        flagId: COMMITTEE_LOCKED
        value: true
      - type: signal
        signalId: MISSING_APPLICANTS
        operator: lte
        value: 0
    once: true
    effects:
      - type: set_flag
        flagId: COMMITTEE_LOCKED
        value: false
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 20
      - type: post_message
        messageId: COMMITTEE_MIXED
  - id: FREEZE_BACKLASH
    type: timer
    delaySeconds: 90
    targetServiceId: RECRUITMENT_API
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: CANDIDATE_RANKING_CACHE_DIVERGENCE
    effects:
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 14
      - type: post_message
        messageId: TALENT_ESCALATES
      - type: schedule_event
        eventId: FREEZE_BACKLASH_AGAIN
  - id: FREEZE_BACKLASH_AGAIN
    type: timer
    delaySeconds: 120
    targetServiceId: RECRUITMENT_API
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: CANDIDATE_RANKING_CACHE_DIVERGENCE
    effects:
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 18
      - type: post_message
        messageId: TALENT_ESCALATES_AGAIN
  - id: RECRUITERS_UNINFORMED
    type: timer
    delaySeconds: 150
    cancellationConditions:
      - type: action_completed
        actionId: UPDATE_WAR_ROOM
    effects:
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 8
      - type: post_message
        messageId: NO_STATUS_YET
  - id: TEAM_RESULT
    type: timer
    delaySeconds: 95
    effects:
      - type: reveal_signal
        signalId: TEAM_OBSERVATION
      - type: reveal_evidence
        evidenceId: TEAM_DIAGNOSIS
      - type: change_resource
        resourceId: TEAM_CAPACITY
        amount: 1
      - type: post_message
        messageId: TEAM_REPORT
evidence:
  - id: OPERATIONAL_DIAGNOSIS
    title: Two shards, two ranks
    description: Reads land on r27 and r28 shards at random, and m28 scores are joined to whichever
      answers. One candidate, two ranks.
  - id: CONFIGURATION_COMPARISON
    title: m28 went live 51 minutes before r28
    description: Model m28 published at 08:40; cache r28 became consistent at 09:31. Nothing fences the
      two together.
  - id: TEAM_DIAGNOSIS
    title: Sam's rollout timeline
    description: The publisher pushes r28 on every cycle. Rolling the cache back buys one cycle; the
      mixing comes back with the next.
  - id: RECORD_GHOST_ARTIFACT
    title: The unsigned workload manifest
