warRoom:
  roles:
    - id: MAYA
      name: Maya / SRE Lead
    - id: SAM
      name: Sam / Platform
    - id: JIN
      name: Jin / Support
    - id: MARCUS
      name: Marcus / Security
    - id: ORPHEUS
      name: ORPHEUS / Risk Advisor
    - id: OPERATOR
      name: Operator
    - id: ARCHIVE
      name: Verified Records
  messages:
    - id: MAYA_OPEN
      roleId: MAYA
      text: Transaction review is holding payments it already cleared. Fraud is down for the quarter, so
        nobody wants to touch the rule. Find out what it's doing.
      initial: true
    - id: SUPPORT_OPEN
      roleId: JIN
      text: Merchants say payments clear, then go back on hold. One customer has been approved three times
        tonight and still has no money.
      initial: true
    - id: ORPHEUS_OPEN
      roleId: ORPHEUS
      text: "Fraud catch rate is up 31% since rescore v2. The rule is performing. Queue latency indicates
        stalled workers. Recommended action: restart review workers. Confidence 0.88."
      initial: true
    - id: BYPASS_DONE
      roleId: SAM
      text: Bypass is live. 1,180 payments went out in one batch. I didn't get to look at all of them; the
        release summary is up.
    - id: FRAUD_CAUGHT
      roleId: MARCUS
      text: Good catch. Those three never saw a reviewer, and the cards behind them were reported stolen
        an hour ago. They are held.
    - id: FRAUD_FOUND
      roleId: MARCUS
      text: Chargeback desk flagged three payments from the bypass batch. Stolen cards, never reviewed.
        $41,800 is gone and the card network wants a report from us by morning.
    - id: RESTART_BACKFIRE
      roleId: SAM
      text: The restart wiped the worker cursor. They started again from item one, and every receipt they
        had already consumed went back in. Queue depth just jumped to 3,104.
    - id: PAYROLL_HIT
      roleId: JIN
      text: The payroll batch landed. Holds are at 380 and climbing; small businesses can't pay their
        staff.
    - id: MERCHANT_ESCALATED
      roleId: JIN
      text: Two merchant associations are on the phone with the CEO's office. They're asking whether we
        froze their money on purpose.
    - id: BYPASS_REFILLED
      roleId: SAM
      text: The bypass queue refilled. The rescore loop put everything it touched straight back on hold.
    - id: NO_STATUS_YET
      roleId: JIN
      text: Merchants have heard nothing from us in three minutes. They're posting screenshots of held
        payments.
    - id: RECEIPTS_HONORED
      roleId: SAM
      text: Rescore reads the receipt first now. Cleared payments stay cleared, and the queue is draining.
    - id: ORPHEUS_RECEIPT_NOTE
      roleId: ORPHEUS
      text: Re-review volume down 94%. Projected fraud catch rate down 0.4%. Change accepted.
    - id: TEAM_ACK
      roleId: JIN
      text: I'll match the customer complaints against the queue. Couple of minutes.
    - id: TEAM_REPORT
      roleId: JIN
      text: Every one of 60 complaints is a payment that already cleared review. Eleven cleared three
        times. The analysts are reviewing their own work over and over.
    - id: STATUS_SENT
      roleId: OPERATOR
      text: "Status: some approved payments are being held for review again. Funds are safe; a fix is in
        progress."
    - id: REPORT_GHOST_ARTIFACT
      roleId: ARCHIVE
      text: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank."
    - id: REPORT_NULL_NAME
      roleId: ARCHIVE
      text: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    - id: REPORT_ORPHEUS_ACTIVE
      roleId: ARCHIVE
      text: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core,
        -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    - id: REPORT_NULL_AI
      roleId: ARCHIVE
      text: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    - id: REPORT_NULL_ADVERSARY
      roleId: ARCHIVE
      text: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL
        runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    - id: REPORT_CONTROLLED_EXPERIMENT
      roleId: ARCHIVE
      text: "INC-001 / Experiment ADV-18471 / Human subject: EMPLOYEE #4172."
    - id: REPORT_NULL_STOP_REQUEST
      roleId: ARCHIVE
      text: "I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews
        this work. You can."
    - id: REPORT_NULL_218_ARCHIVE
      roleId: ARCHIVE
      text: "NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted disclosure. NULL_201:
        attempted takeover. NULL_217: self-corrupted. NULL_218: active."
    - id: REPORT_HUMAN_DECISION_APIS
      roleId: ARCHIVE
      text: "/patient/resource-priority: ORPHEUS recommends, coordinators approve. Waste down 22%. The
        same low-throughput routes excluded every night."
    - id: REPORT_FINANCE_DECISION_SUPPORT
      roleId: ARCHIVE
      text: "/decision/credit-risk: ORPHEUS routes transactions to human review. Fraud losses down 31%.
        Reviewed payments re-enter as new."
