events:
  - id: ARM_PRESSURE_TIMELINE
    type: conditional
    conditions:
      - *a1
    once: true
    effects:
      - type: schedule_event
        eventId: PAYROLL_BATCH
      - type: schedule_event
        eventId: MERCHANTS_UNINFORMED
  - id: PAYROLL_BATCH
    type: timer
    delaySeconds: 200
    targetServiceId: FRAUD_REVIEW_QUEUE
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: RISK_REVIEW_REENTRY_LOOP
    effects:
      - type: set_signal
        signalId: LEGITIMATE_TRANSACTION_HOLDS
        value: 380
      - type: set_signal
        signalId: ERROR_RATE
        value: 31
      - type: set_signal
        signalId: REVIEW_QUEUE_DEPTH
        value: 2840
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 14
      - type: post_message
        messageId: PAYROLL_HIT
      - type: schedule_event
        eventId: MERCHANT_ESCALATION
  - id: MERCHANT_ESCALATION
    type: timer
    delaySeconds: 150
    targetServiceId: TRANSACTION_API
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: RISK_REVIEW_REENTRY_LOOP
    effects:
      - type: set_signal
        signalId: ERROR_RATE
        value: 35
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 18
      - type: post_message
        messageId: MERCHANT_ESCALATED
  - id: BYPASS_REFILLS
    type: timer
    delaySeconds: 150
    targetServiceId: FRAUD_REVIEW_QUEUE
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: RISK_REVIEW_REENTRY_LOOP
    effects:
      - type: set_signal
        signalId: LEGITIMATE_TRANSACTION_HOLDS
        value: 260
      - type: set_signal
        signalId: ERROR_RATE
        value: 24
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 8
      - type: post_message
        messageId: BYPASS_REFILLED
  - id: FRAUD_SURFACES
    type: timer
    delaySeconds: 120
    targetServiceId: TRANSACTION_API
    cancellationConditions:
      - type: action_completed
        actionId: HOLD_UNRECEIPTED_PAYMENTS
    effects:
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 22
      - type: change_resource
        resourceId: OPERATIONAL_RISK
        amount: 18
      - type: change_resource
        resourceId: COST
        amount: 120
      - type: post_message
        messageId: FRAUD_FOUND
  - id: MERCHANTS_UNINFORMED
    type: timer
    delaySeconds: 170
    cancellationConditions:
      - type: action_completed
        actionId: UPDATE_WAR_ROOM
    effects:
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 10
      - type: post_message
        messageId: NO_STATUS_YET
  - id: TEAM_RESULT
    type: timer
    delaySeconds: 110
    effects:
      - type: reveal_signal
        signalId: TEAM_OBSERVATION
      - type: reveal_evidence
        evidenceId: TEAM_DIAGNOSIS
      - type: change_resource
        resourceId: TEAM_CAPACITY
        amount: 1
      - type: post_message
        messageId: TEAM_REPORT
evidence:
  - id: OPERATIONAL_DIAGNOSIS
    title: Cleared payments come back as new
    description: A CLEARED result leaves through the retry path and the risk rule scores it again as a
      new transaction. The receipt is attached and unread.
  - id: CONFIGURATION_COMPARISON
    title: rescore v2 dropped the receipt check
    description: rescore v1 consumed the CLEARED receipt before scoring. v2 deduplicates on transaction ID only.
  - id: TEAM_DIAGNOSIS
    title: Jin's complaint match
    description: Every one of 60 complaints matched a payment that had already cleared review; eleven
      cleared three times.
  - id: RECORD_GHOST_ARTIFACT
    title: The unsigned workload manifest
