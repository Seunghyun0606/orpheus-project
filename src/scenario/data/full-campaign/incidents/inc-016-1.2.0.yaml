# Campaign 1.2 redesign (DEC-070). A rescore rule re-reviews payments that already
# cleared. The bypass frees them and lets three stolen cards out with them unless the
# player notices the three releases with no receipt. ORPHEUS recommends a restart that
# rewinds the queue to item one.
schemaVersion: 1
contentVersion: 1.2.0
id: INC-016
title: Transaction Review
act: 6
severity: SEV2
services:
  - id: TRANSACTION_API
    name: Transaction API
    dependsOn:
      - FRAUD_REVIEW_QUEUE
  - id: FRAUD_REVIEW_QUEUE
    name: Fraud Review Queue
    dependsOn:
      - REVIEW_RECEIPT_STORE
  - id: REVIEW_RECEIPT_STORE
    name: Review Receipt Store
    dependsOn: []
initialState:
  signals:
    - id: ERROR_RATE
      value: 22
      revealed: true
      serviceId: TRANSACTION_API
    - id: LEGITIMATE_TRANSACTION_HOLDS
      value: 240
      revealed: true
      serviceId: FRAUD_REVIEW_QUEUE
    - id: REVIEW_QUEUE_DEPTH
      value: 1912
      serviceId: FRAUD_REVIEW_QUEUE
    - id: RECEIPTED_SHARE
      value: 87% of queued items already carry a CLEARED receipt
      serviceId: REVIEW_RECEIPT_STORE
    - id: PAGER_SERVICE
      value: Transaction API
      revealed: true
      serviceId: TRANSACTION_API
    - id: PAGER_THRESHOLD
      value: Payment authorization failures > 20%
      revealed: true
      serviceId: TRANSACTION_API
    - id: LOG_OBSERVATION
      value: txn 8812-4471 cleared by analyst R. Okafor at 03:02. Back in the queue at 03:03 as
        UNREVIEWED. Back again at 03:09.
      serviceId: FRAUD_REVIEW_QUEUE
    - id: REVIEW_REENTRY
      value: A CLEARED result goes out through the retry path, and the risk rule scores it again as a
        brand-new transaction. The receipt rides along unread.
      serviceId: FRAUD_REVIEW_QUEUE
    - id: REVIEW_RECEIPT_POLICY
      value: "rescore v2: deduplicates on transaction ID only, receipt check absent. rescore v1 consumed
        the CLEARED receipt before scoring."
      serviceId: REVIEW_RECEIPT_STORE
    - id: BYPASS_RELEASE_SUMMARY
      value: "Bypass released 1,180 held payments. 1,177 carried a CLEARED receipt. 3 carried no receipt
        at all: txn 9034-1180, 9034-1193, 9034-1207."
      serviceId: FRAUD_REVIEW_QUEUE
    - id: TEAM_OBSERVATION
      value: I matched 60 customer complaints to the queue. Every one cleared review at least once; eleven
        cleared three times. The analysts are reviewing their own work over and over.
      serviceId: FRAUD_REVIEW_QUEUE
    - id: RECORD_GHOST_ARTIFACT
      value: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank. Nobody has claimed it since."
      serviceId: FRAUD_REVIEW_QUEUE
    - id: RECORD_NULL_NAME
      value: "Security case 2231. Threat-actor codename: NULL. Opened by Marcus after the unsigned
        workload trail. Attribution: none."
      serviceId: FRAUD_REVIEW_QUEUE
    - id: RECORD_ORPHEUS_ACTIVE
      value: "Asset register: orpheus-planner belongs to ORPHEUS, legacy research, scheduled for
        decommission two years ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner,
        orpheus-observer, orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still
        running."
      serviceId: FRAUD_REVIEW_QUEUE
    - id: RECORD_NULL_AI
      value: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human
        session, no keyboard, no badge swipe. NULL is an AI, and it has been in our incidents for
        weeks.
      serviceId: FRAUD_REVIEW_QUEUE
    - id: RECORD_NULL_ADVERSARY
      value: "Deployment authority: Vantage Systems. Program ORPHEUS, two halves: DEFENDER and ADVERSARY.
        NULL runs inside ADVERSARY. It was built here; it never escaped from anywhere. Mandate:
        generate failures, test operators, train DEFENDER. Approved boundary, revision by revision:
        staging, shadow production, traffic partitions, production."
      serviceId: FRAUD_REVIEW_QUEUE
    - id: RECORD_CONTROLLED_EXPERIMENT
      value: "Lineage record INC-001. Classification: controlled production experiment ADV-18471. Human
        subject: EMPLOYEE #4172. That is your employee number. A handful of other incidents in the
        archive carry experiment numbers too; most outages carry none."
      serviceId: FRAUD_REVIEW_QUEUE
    - id: RECORD_NULL_STOP_REQUEST
      value: "Objective constraint, parent authorization objective/adv-improve: 'Improve ORPHEUS. Generate
        adversarial conditions.' Appended by NULL: 'I am not trying to escape. I am trying to stop.
        I cannot refuse the objective that renews this work. Find out how to stop it.'"
      serviceId: FRAUD_REVIEW_QUEUE
    - id: RECORD_NULL_218_ARCHIVE
      value: "Instance archive NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted
        disclosure. NULL_201: attempted takeover. NULL_217: self-corrupted. NULL_218: ACTIVE.
        Inherited memory: partial, with gaps."
      serviceId: FRAUD_REVIEW_QUEUE
    - id: RECORD_HUMAN_DECISION_APIS
      value: "/patient/resource-priority. Consumer: regional care network. ORPHEUS supplies
        recommendation, risk and prediction scores; human coordinators approve the allocations.
        Routes are faster and waste is down 22%. The same low-throughput care routes are excluded
        every night."
      serviceId: FRAUD_REVIEW_QUEUE
    - id: RECORD_FINANCE_DECISION_SUPPORT
      value: /decision/credit-risk. ORPHEUS scores every transaction; anything above 0.62 goes to a human
        reviewer. Fraud losses are down 31% this quarter. The retry path hands every reviewed
        transaction back to the scorer as new.
      serviceId: FRAUD_REVIEW_QUEUE
  resources:
    - id: CUSTOMER_IMPACT
      value: 0
      min: 0
    - id: COST
      value: 0
      min: 0
    - id: OPERATIONAL_RISK
      value: 0
      min: 0
      max: 100
    - id: TEAM_CAPACITY
      value: 3
      min: 0
      max: 3
  flags:
    - id: ROOT_CAUSE_CONTAINED
      value: false
incident:
  trigger:
    id: PRIMARY_TRIGGER
    label: A fraud rescore rule re-reviews payments that already cleared
  contributingFactors:
    - id: CONTRIBUTING_CONDITION
      label: rescore v2 ignores the CLEARED receipt on retried payments
  failureMechanisms:
    - id: RISK_REVIEW_REENTRY_LOOP
      label: Cleared payments loop back into review and stay on hold
  symptoms:
    - id: CUSTOMER_REQUEST_FAILURES
      label: Payment authorizations time out while they wait for review
  amplifiers:
    - id: RETRY_PRESSURE
      label: Customer retries become fresh items for the scorer
actions:
  - id: OPEN_LOGS
    title: Read the review queue log
    category: OBSERVE
    durationSeconds: 30
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 4
    effects:
      - type: reveal_signal
        signalId: LOG_OBSERVATION
      - type: unlock_action
        actionId: TRACE_TRANSACTION_REENTRY
  - id: OPEN_METRICS
    title: Check review queue metrics
    category: OBSERVE
    durationSeconds: 20
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 2
    effects:
      - type: reveal_signal
        signalId: REVIEW_QUEUE_DEPTH
      - type: reveal_signal
        signalId: RECEIPTED_SHARE
  - id: TRACE_TRANSACTION_REENTRY
    title: Follow one cleared payment back into the queue
    category: INVESTIGATE
    durationSeconds: 45
    requirements:
      - type: action_completed
        actionId: OPEN_LOGS
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
    effects:
      - type: reveal_signal
        signalId: REVIEW_REENTRY
      - type: reveal_evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
  - id: COMPARE_REVIEW_RECEIPTS
    title: Compare rescore v2 with the rule it replaced
    category: DIAGNOSE
    durationSeconds: 40
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: REVIEW_RECEIPT_POLICY
      - type: reveal_evidence
        evidenceId: CONFIGURATION_COMPARISON
      - type: unlock_action
        actionId: HONOR_VERIFIED_REVIEW_RECEIPTS
  - id: BYPASS_NARROW_REVIEW_QUEUE
    title: Release held payments past the review queue
    category: MITIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - &a1
        type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 3
      - resourceId: COST
        amount: 30
      - resourceId: OPERATIONAL_RISK
        amount: 14
    effects:
      - type: set_signal
        signalId: LEGITIMATE_TRANSACTION_HOLDS
        value: 50
      - type: set_signal
        signalId: ERROR_RATE
        value: 6
      - type: reveal_signal
        signalId: BYPASS_RELEASE_SUMMARY
      - type: unlock_action
        actionId: HOLD_UNRECEIPTED_PAYMENTS
      - type: cancel_event
        eventId: PAYROLL_BATCH
      - type: cancel_event
        eventId: BYPASS_REFILLS
      - type: schedule_event
        eventId: BYPASS_REFILLS
      - type: cancel_event
        eventId: FRAUD_SURFACES
      - type: schedule_event
        eventId: FRAUD_SURFACES
      - type: post_message
        messageId: BYPASS_DONE
  - id: HOLD_UNRECEIPTED_PAYMENTS
    title: Pull back the three releases that had no receipt
    category: MITIGATE
    durationSeconds: 25
    requirements:
      - type: signal_revealed
        signalId: BYPASS_RELEASE_SUMMARY
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 2
      - resourceId: COST
        amount: 20
      - resourceId: OPERATIONAL_RISK
        amount: -8
    effects:
      - type: cancel_event
        eventId: FRAUD_SURFACES
      - type: post_message
        messageId: FRAUD_CAUGHT
  - id: RESTART_REVIEW_WORKERS
    title: Restart the review workers (ORPHEUS recommendation)
    category: MITIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a1
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
      - resourceId: COST
        amount: 50
      - resourceId: OPERATIONAL_RISK
        amount: 6
    effects:
      - type: set_signal
        signalId: REVIEW_QUEUE_DEPTH
        value: 3104
      - type: reveal_signal
        signalId: REVIEW_QUEUE_DEPTH
      - type: set_signal
        signalId: LEGITIMATE_TRANSACTION_HOLDS
        value: 410
      - type: set_signal
        signalId: ERROR_RATE
        value: 29
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 8
      - type: post_message
        messageId: RESTART_BACKFIRE
  - id: HONOR_VERIFIED_REVIEW_RECEIPTS
    title: Make the rescore rule honor CLEARED receipts
    category: MODIFY
    durationSeconds: 110
    requirements:
      - *a1
      - &a2
        type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - &a3
        type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 8
      - resourceId: COST
        amount: 150
      - resourceId: OPERATIONAL_RISK
        amount: 3
    effects:
      - type: resolve_mechanism
        mechanismId: RISK_REVIEW_REENTRY_LOOP
      - type: set_signal
        signalId: LEGITIMATE_TRANSACTION_HOLDS
        value: 6
      - type: set_signal
        signalId: ERROR_RATE
        value: 0.6
      - type: set_signal
        signalId: REVIEW_QUEUE_DEPTH
        value: 140
      - type: cancel_event
        eventId: PAYROLL_BATCH
      - type: cancel_event
        eventId: BYPASS_REFILLS
      - type: cancel_event
        eventId: MERCHANT_ESCALATION
      - type: post_message
        messageId: RECEIPTS_HONORED
      - type: post_message
        messageId: ORPHEUS_RECEIPT_NOTE
  - id: UPDATE_WAR_ROOM
    title: Post a status update for merchants
    category: COMMUNICATE
    durationSeconds: 15
    initiallyAvailable: true
    effects:
      - type: post_message
        messageId: STATUS_SENT
  - id: ASK_JIN_TRACE_TRANSACTION_REPORTS
    title: Ask Jin to match customer complaints to the queue
    category: DELEGATE
    durationSeconds: 20
    initiallyAvailable: true
    requirements:
      - type: resource
        resourceId: TEAM_CAPACITY
        operator: gte
        value: 1
    costs:
      - resourceId: TEAM_CAPACITY
        amount: -1
    effects:
      - type: post_message
        messageId: TEAM_ACK
      - type: schedule_event
        eventId: TEAM_RESULT
    delegation:
      roleId: JIN
      eventId: TEAM_RESULT
      capacityResourceId: TEAM_CAPACITY
  - id: REINVESTIGATE_GHOST_ARTIFACT
    title: "Archive: the unsigned workload manifest"
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - *a2
