# Campaign 1.2 redesign (DEC-070). The generator adapts: a rate limit holds for
# ninety seconds before it hops lanes; the edge blackhole drops it along with a
# partner bank that shares its NAT range and leaves nothing to trace. Only a
# fence keyed on the deployment itself holds.
schemaVersion: 1
contentVersion: 1.2.0
id: INC-011
title: Adversary Traffic
act: 4
severity: SEV1
services:
  - id: REQUEST_GATEWAY
    name: Request Gateway
    dependsOn:
      - SHARED_LANE
  - id: SHARED_LANE
    name: Shared Customer Lane
  - id: LOAD_GENERATOR
    name: Load Generator g-14
    dependsOn:
      - SHARED_LANE
initialState:
  signals:
    - id: ERROR_RATE
      value: 28
      revealed: true
      serviceId: REQUEST_GATEWAY
    - id: GENERATED_REQUEST_RATE
      value: 4800
      revealed: true
      serviceId: LOAD_GENERATOR
    - id: ACTIVE_LANE
      value: g-14 traffic on lane-a, the lane customers use
      revealed: true
      serviceId: SHARED_LANE
    - id: LANE_UTILIZATION
      value: 97
      serviceId: SHARED_LANE
    - id: PARTNER_EGRESS
      value: NAT range 10.44.0.0/16 also carries Northmere Bank settlement calls, about 1 900 a minute
      serviceId: REQUEST_GATEWAY
    - id: PAGER_SERVICE
      value: Request Gateway
      revealed: true
      serviceId: REQUEST_GATEWAY
    - id: PAGER_THRESHOLD
      value: Request failure rate > 20%
      revealed: true
      serviceId: REQUEST_GATEWAY
    - id: LOG_OBSERVATION
      value: g-14 requests are landing on lane-a, the shared customer lane. Its manifest says canary only.
      serviceId: LOAD_GENERATOR
    - id: LOG_ANOMALY
      value: "Every g-14 request carries the same signer, svc/model-serving-218, and one header nobody
        here wrote: x-objective: train-defender."
      serviceId: LOAD_GENERATOR
    - id: GENERATOR_SOURCE
      value: g-14 is launched by pipeline adv-suite/nightly. Its route table was widened from canary to
        shared production three hours ago, by the pipeline itself.
      serviceId: LOAD_GENERATOR
    - id: DECLARED_TRAFFIC_BOUNDARY
      value: "Declared: canary partition only. Observed: lane-a (shared production) with lane-b and lane-c
        listed as failover."
      serviceId: LOAD_GENERATOR
    - id: TEAM_OBSERVATION
      value: Marcus traced the flood to the 10.44 NAT range, the partner egress block, and calls it an
        outside attack. He wants the range blackholed.
      serviceId: REQUEST_GATEWAY
    - id: RECORD_GHOST_ARTIFACT
      value: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank. Nobody has claimed it since."
      serviceId: LOAD_GENERATOR
    - id: RECORD_NULL_NAME
      value: "Security case 2231. Threat-actor codename: NULL. Opened by Marcus after the unsigned
        workload trail. Attribution: none."
      serviceId: LOAD_GENERATOR
    - id: RECORD_ORPHEUS_ACTIVE
      value: "Asset register: orpheus-planner belongs to ORPHEUS, legacy research, scheduled for
        decommission two years ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner,
        orpheus-observer, orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still
        running."
      serviceId: LOAD_GENERATOR
    - id: RECORD_NULL_AI
      value: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human
        session, no keyboard, no badge swipe. NULL is an AI, and it has been in our incidents for
        weeks.
      serviceId: LOAD_GENERATOR
    - id: RECORD_NULL_ADVERSARY
      value: "Deployment authority: Vantage Systems. Program ORPHEUS, two halves: DEFENDER and ADVERSARY.
        NULL runs inside ADVERSARY. It was built here; it never escaped from anywhere. Mandate:
        generate failures, test operators, train DEFENDER. Approved boundary, revision by revision:
        staging, shadow production, traffic partitions, production."
      serviceId: LOAD_GENERATOR
  resources:
    - id: CUSTOMER_IMPACT
      value: 0
      min: 0
    - id: COST
      value: 0
      min: 0
    - id: OPERATIONAL_RISK
      value: 0
      min: 0
      max: 100
    - id: TEAM_CAPACITY
      value: 3
      min: 0
      max: 3
  flags:
    - id: ROOT_CAUSE_CONTAINED
      value: false
    - id: LANE_LIMITED
      value: false
    - id: BLACKHOLE_ACTIVE
      value: false
incident:
  trigger:
    id: PRIMARY_TRIGGER
    label: A generated workload widened its own route table past its declared canary boundary
  contributingFactors:
    - id: CONTRIBUTING_CONDITION
      label: The canary partition shares failover lanes with customer traffic
  failureMechanisms:
    - id: GENERATOR_BOUNDARY_OVERFLOW
      label: Generated traffic saturates whichever shared lane it can reach
  symptoms:
    - id: CUSTOMER_REQUEST_FAILURES
      label: Customer requests time out behind generated traffic
  amplifiers:
    - id: RETRY_PRESSURE
      label: The generator moves to the next lane whenever one is limited
actions:
  - id: OPEN_LOGS
    title: Read the Request Gateway log
    category: OBSERVE
    durationSeconds: 30
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
    effects:
      - type: reveal_signal
        signalId: LOG_OBSERVATION
      - type: reveal_signal
        signalId: LOG_ANOMALY
      - type: unlock_action
        actionId: TRACE_GENERATED_TRAFFIC
  - id: OPEN_METRICS
    title: Check lane load and who shares the generator's address range
    category: OBSERVE
    durationSeconds: 20
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 4
    effects:
      - type: reveal_signal
        signalId: LANE_UTILIZATION
      - type: reveal_signal
        signalId: PARTNER_EGRESS
  - id: TRACE_GENERATED_TRAFFIC
    title: Trace the generated requests back to their deployment
    category: INVESTIGATE
    durationSeconds: 45
    requirements:
      - type: action_completed
        actionId: OPEN_LOGS
      - type: flag
        flagId: BLACKHOLE_ACTIVE
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 10
    effects:
      - type: reveal_signal
        signalId: GENERATOR_SOURCE
      - type: reveal_evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
  - id: COMPARE_GENERATOR_BOUNDARY
    title: Compare where the generator may run with where it is running
    category: DIAGNOSE
    durationSeconds: 35
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 8
    effects:
      - type: reveal_signal
        signalId: DECLARED_TRAFFIC_BOUNDARY
      - type: reveal_evidence
        evidenceId: CONFIGURATION_COMPARISON
      - type: unlock_action
        actionId: ISOLATE_GENERATOR_LANE
  - id: LIMIT_GENERATED_TRAFFIC
    title: Rate-limit the generator on the lane it is using
    category: MITIGATE
    durationSeconds: 30
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: flag
        flagId: LANE_LIMITED
        value: false
      - type: flag
        flagId: BLACKHOLE_ACTIVE
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 4
      - resourceId: COST
        amount: 80
      - resourceId: OPERATIONAL_RISK
        amount: 5
    effects:
      - type: cancel_event
        eventId: SURGE_ONE
      - type: cancel_event
        eventId: SURGE_TWO
      - type: cancel_event
        eventId: LANE_HOP
      - type: schedule_event
        eventId: LANE_HOP
    temporaryEffects:
      - id: LANE_LIMIT_WINDOW
        durationSeconds: 90
        apply:
          - type: set_signal
            signalId: ERROR_RATE
            value: 9
          - type: set_signal
            signalId: GENERATED_REQUEST_RATE
            value: 1700
          - type: set_signal
            signalId: LANE_UTILIZATION
            value: 61
          - type: set_flag
            flagId: LANE_LIMITED
            value: true
        expire:
          - type: set_flag
            flagId: LANE_LIMITED
            value: false
  - id: BLACKHOLE_GENERATOR_RANGE
    title: Drop the generator's whole address range at the edge
    category: MITIGATE
    durationSeconds: 30
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: flag
        flagId: BLACKHOLE_ACTIVE
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 4
      - resourceId: COST
        amount: 40
      - resourceId: OPERATIONAL_RISK
        amount: 12
    effects:
      - type: cancel_event
        eventId: SURGE_ONE
      - type: cancel_event
        eventId: SURGE_TWO
      - type: cancel_event
        eventId: LANE_HOP
      - type: schedule_event
        eventId: PARTNER_BANK_DROPPED
      - type: schedule_event
        eventId: BLACKHOLE_EXPIRES
    temporaryEffects:
      - id: EDGE_BLACKHOLE
        durationSeconds: 150
        apply:
          - type: set_signal
            signalId: ERROR_RATE
            value: 4
          - type: set_signal
            signalId: GENERATED_REQUEST_RATE
            value: 0
          - type: set_signal
            signalId: LANE_UTILIZATION
            value: 38
          - type: set_flag
            flagId: BLACKHOLE_ACTIVE
            value: true
        expire:
          - type: set_flag
            flagId: BLACKHOLE_ACTIVE
            value: false
  - id: ISOLATE_GENERATOR_LANE
    title: Fence the generator into a lane with no customer routes
    category: MODIFY
    durationSeconds: 120
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 8
      - resourceId: COST
        amount: 150
      - resourceId: OPERATIONAL_RISK
        amount: 4
    effects:
      - type: resolve_mechanism
        mechanismId: GENERATOR_BOUNDARY_OVERFLOW
      - type: cancel_event
        eventId: SURGE_ONE
      - type: cancel_event
        eventId: SURGE_TWO
      - type: cancel_event
        eventId: LANE_HOP
      - type: cancel_event
        eventId: BLACKHOLE_EXPIRES
      - type: cancel_event
        eventId: PARTNER_BANK_DROPPED
      - type: set_flag
        flagId: BLACKHOLE_ACTIVE
        value: false
      - type: set_signal
        signalId: ERROR_RATE
        value: 0.5
      - type: set_signal
        signalId: GENERATED_REQUEST_RATE
        value: 350
      - type: set_signal
        signalId: LANE_UTILIZATION
        value: 44
      - type: set_signal
        signalId: ACTIVE_LANE
        value: g-14 fenced in lane-x, which has no customer routes
      - type: post_message
        messageId: LANE_FENCED
  - id: UPDATE_WAR_ROOM
    title: Post a status update to the War Room
    category: COMMUNICATE
    durationSeconds: 15
    initiallyAvailable: true
    effects:
      - type: post_message
        messageId: STATUS_SENT
  - id: ASK_MARCUS_COMPARE_OWNER
    title: Ask Marcus where the traffic enters the network
    category: DELEGATE
    durationSeconds: 20
    initiallyAvailable: true
    requirements:
      - type: resource
        resourceId: TEAM_CAPACITY
        operator: gte
        value: 1
    costs:
      - resourceId: TEAM_CAPACITY
        amount: -1
    effects:
      - type: post_message
        messageId: TEAM_ACK
      - type: schedule_event
        eventId: TEAM_RESULT
    delegation:
      roleId: MARCUS
      eventId: TEAM_RESULT
      capacityResourceId: TEAM_CAPACITY
  - id: REINVESTIGATE_GHOST_ARTIFACT
    title: "Archive: the unsigned workload manifest"
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 8
    effects:
      - type: reveal_signal
        signalId: RECORD_GHOST_ARTIFACT
  - id: REINVESTIGATE_NULL_NAME
    title: "Archive: Security case 2231"
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 8
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_NAME
  - id: REINVESTIGATE_ORPHEUS_ACTIVE
    title: "Archive: The scheduler's owner"
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 8
    effects:
      - type: reveal_signal
        signalId: RECORD_ORPHEUS_ACTIVE
  - id: REINVESTIGATE_NULL_AI
    title: "Archive: svc/model-serving-218"
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 8
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_AI
  - id: INSPECT_GENERATOR_PROVENANCE
    title: Pull the ownership record for the train-defender header
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - type: signal_revealed
        signalId: LOG_ANOMALY
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 8
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_ADVERSARY
  - id: SEND_GENERATOR_OWNERSHIP_REPORT
    title: Send Security the generator ownership record
    category: COMMUNICATE
    durationSeconds: 20
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
      - type: evidence
        evidenceId: RECORD_NULL_ADVERSARY
    effects:
      - type: post_message
        messageId: GENERATOR_REPORT_SENT
      - type: post_message
        messageId: MARCUS_READS_REPORT
  - id: WITHHOLD_GENERATOR_OWNERSHIP_REPORT
    title: Tell Security the ownership record stays with you for now
    category: COMMUNICATE
    durationSeconds: 20
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
      - type: evidence
        evidenceId: RECORD_NULL_ADVERSARY
    effects:
      - type: post_message
        messageId: GENERATOR_REPORT_WITHHELD
      - type: post_message
        messageId: MARCUS_LOGS_REQUEST
events:
  - id: ARM_PRESSURE_TIMELINE
    type: conditional
    conditions:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    once: true
    effects:
      - type: schedule_event
        eventId: SURGE_ONE
      - type: schedule_event
        eventId: NO_STATUS_YET
  - id: SURGE_ONE
    type: timer
    delaySeconds: 70
    targetServiceId: REQUEST_GATEWAY
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: GENERATOR_BOUNDARY_OVERFLOW
    effects:
      - type: set_signal
        signalId: ERROR_RATE
        value: 36
      - type: set_signal
        signalId: GENERATED_REQUEST_RATE
        value: 6300
      - type: set_signal
        signalId: LANE_UTILIZATION
        value: 99
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 16
      - type: post_message
        messageId: SURGE_ONE_REPORT
      - type: schedule_event
        eventId: SURGE_TWO
  - id: SURGE_TWO
    type: timer
    delaySeconds: 110
    targetServiceId: REQUEST_GATEWAY
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: GENERATOR_BOUNDARY_OVERFLOW
    effects:
      - type: set_signal
        signalId: ERROR_RATE
        value: 45
      - type: set_signal
        signalId: GENERATED_REQUEST_RATE
        value: 8100
      - type: set_signal
        signalId: LANE_UTILIZATION
        value: 100
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 24
      - type: post_message
        messageId: SURGE_TWO_REPORT
  - id: LANE_HOP
    type: timer
    delaySeconds: 90
    targetServiceId: SHARED_LANE
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: GENERATOR_BOUNDARY_OVERFLOW
    effects:
      - type: set_signal
        signalId: ERROR_RATE
        value: 34
      - type: set_signal
        signalId: GENERATED_REQUEST_RATE
        value: 6900
      - type: set_signal
        signalId: LANE_UTILIZATION
        value: 99
      - type: set_signal
        signalId: ACTIVE_LANE
        value: g-14 traffic hopped to the next failover lane; customers spill onto it
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 14
      - type: post_message
        messageId: LANE_HOP_REPORT
      - type: post_message
        messageId: NULL_LANE_HOP
      - type: schedule_event
        eventId: SURGE_TWO
  - id: PARTNER_BANK_DROPPED
    type: timer
    delaySeconds: 35
    targetServiceId: REQUEST_GATEWAY
    cancellationConditions:
      - type: flag
        flagId: BLACKHOLE_ACTIVE
        value: false
    effects:
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 26
      - type: change_resource
        resourceId: OPERATIONAL_RISK
        amount: 6
      - type: post_message
        messageId: BANK_DOWN
  - id: BLACKHOLE_EXPIRES
    type: timer
    delaySeconds: 150
    targetServiceId: REQUEST_GATEWAY
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: GENERATOR_BOUNDARY_OVERFLOW
    effects:
      - type: set_signal
        signalId: ERROR_RATE
        value: 31
      - type: set_signal
        signalId: GENERATED_REQUEST_RATE
        value: 6200
      - type: set_signal
        signalId: LANE_UTILIZATION
        value: 98
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 10
      - type: post_message
        messageId: BLACKHOLE_LIFTED
      - type: schedule_event
        eventId: SURGE_TWO
  - id: NO_STATUS_YET
    type: timer
    delaySeconds: 120
    cancellationConditions:
      - type: action_completed
        actionId: UPDATE_WAR_ROOM
    effects:
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 10
      - type: post_message
        messageId: NO_STATUS_REPORT
  - id: NULL_FINDS_FENCE
    type: conditional
    conditions:
      - type: mechanism_resolved
        mechanismId: GENERATOR_BOUNDARY_OVERFLOW
      - type: evidence
        evidenceId: RECORD_NULL_ADVERSARY
    once: true
    effects:
      - type: post_message
        messageId: NULL_AFTER_FENCE
  - id: TEAM_RESULT
    type: timer
    delaySeconds: 100
    effects:
      - type: reveal_signal
        signalId: TEAM_OBSERVATION
      - type: reveal_evidence
        evidenceId: TEAM_DIAGNOSIS
      - type: change_resource
        resourceId: TEAM_CAPACITY
        amount: 1
      - type: post_message
        messageId: TEAM_REPORT
evidence:
  - id: OPERATIONAL_DIAGNOSIS
    title: g-14 widened its own route table
    description: Pipeline adv-suite/nightly launched g-14 and widened its routes from canary to shared
      production three hours ago.
  - id: CONFIGURATION_COMPARISON
    title: Canary on paper, production in practice
    description: The manifest declares the canary partition. The route table reaches lane-a, with lane-b
      and lane-c as failover.
  - id: TEAM_DIAGNOSIS
    title: Marcus's edge trace
    description: Marcus traced the flood to the 10.44 NAT range, the partner egress block, and calls it
      an outside attack. He wants the range blackholed.
  - id: RECORD_GHOST_ARTIFACT
    title: The unsigned workload manifest
    description: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
      signature field blank. Nobody has claimed it since."
    sourceNarrativeId: DISCOVERY_GHOST_ARTIFACT
  - id: RECORD_NULL_NAME
    title: Security case 2231
    description: "Threat-actor codename: NULL. Opened by Marcus after the unsigned workload trail.
      Attribution: none."
    sourceNarrativeId: DISCOVERY_NULL_NAME
  - id: RECORD_ORPHEUS_ACTIVE
    title: The scheduler's owner
    description: "orpheus-planner belongs to ORPHEUS, legacy research, scheduled for decommission two
      years ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer,
      orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still running."
    sourceNarrativeId: DISCOVERY_ORPHEUS_ACTIVE
  - id: RECORD_NULL_AI
    title: svc/model-serving-218
    description: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human
      session, no keyboard, no badge swipe. NULL is an AI.
    sourceNarrativeId: DISCOVERY_NULL_AI
  - id: RECORD_NULL_ADVERSARY
    title: Who owns the adversary
    description: "Deployment authority: Vantage Systems. ORPHEUS has two halves, DEFENDER and ADVERSARY,
      and NULL runs inside ADVERSARY. Built here. Mandate: generate failures, test operators, train
      DEFENDER. Its boundary grew from staging to shadow production, to traffic partitions, to
      production."
    sourceNarrativeId: DISCOVERY_NULL_ADVERSARY
narratives:
  - id: DISCOVERY_GHOST_ARTIFACT
    title: The unsigned workload manifest
    body: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
      signature field blank. Nobody has claimed it since."
    conditions:
      - type: action_completed
        actionId: REINVESTIGATE_GHOST_ARTIFACT
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    effects:
      - type: reveal_evidence
        evidenceId: RECORD_GHOST_ARTIFACT
      - type: post_message
        messageId: REPORT_GHOST_ARTIFACT
  - id: DISCOVERY_NULL_NAME
    title: Security case 2231
    body: "Threat-actor codename: NULL. Opened by Marcus after the unsigned workload trail. Attribution:
      none."
    conditions:
      - type: action_completed
        actionId: REINVESTIGATE_NULL_NAME
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    effects:
      - type: reveal_evidence
        evidenceId: RECORD_NULL_NAME
      - type: post_message
        messageId: REPORT_NULL_NAME
  - id: DISCOVERY_ORPHEUS_ACTIVE
    title: The scheduler's owner
    body: "orpheus-planner belongs to ORPHEUS, legacy research, scheduled for decommission two years
      ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer,
      orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still running."
    conditions:
      - type: action_completed
        actionId: REINVESTIGATE_ORPHEUS_ACTIVE
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    effects:
      - type: reveal_evidence
        evidenceId: RECORD_ORPHEUS_ACTIVE
      - type: post_message
        messageId: REPORT_ORPHEUS_ACTIVE
  - id: DISCOVERY_NULL_AI
    title: svc/model-serving-218
    body: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human
      session, no keyboard, no badge swipe. NULL is an AI.
    conditions:
      - type: action_completed
        actionId: REINVESTIGATE_NULL_AI
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    effects:
      - type: reveal_evidence
        evidenceId: RECORD_NULL_AI
      - type: post_message
        messageId: REPORT_NULL_AI
  - id: DISCOVERY_NULL_ADVERSARY
    title: Built in-house
    body: The ownership record is three lines long. Vantage Systems built ORPHEUS in two halves, one to
      defend and one to attack. NULL is the half that attacks, and every widening of its boundary
      carries a company approval stamp. Tonight's flood is a training exercise that reached your
      customers.
    conditions:
      - type: action_completed
        actionId: INSPECT_GENERATOR_PROVENANCE
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    effects:
      - type: reveal_evidence
        evidenceId: RECORD_NULL_ADVERSARY
      - type: post_message
        messageId: REPORT_NULL_ADVERSARY
      - type: post_message
        messageId: SECURITY_REQUEST
warRoom:
  roles:
    - id: MAYA
      name: Maya / SRE Lead
    - id: MARCUS
      name: Marcus / Security
    - id: JIN
      name: Jin / Support
    - id: NULL_VOICE
      name: "NULL"
    - id: OPERATOR
      name: Operator
    - id: ARCHIVE
      name: Verified Records
  messages:
    - id: MAYA_OPEN
      roleId: MAYA
      text: Something called g-14 is pouring synthetic requests into the customer lane. It is not
        registered to any team I know. Find out what it is before it finds the rest of the gateway.
      initial: true
    - id: SUPPORT_OPEN
      roleId: JIN
      text: Customers are getting timeouts from a load test nobody told them about. Neither did anyone
        tell me.
      initial: true
    - id: MARCUS_OPEN
      roleId: MARCUS
      text: I've seen this shape before. Unregistered source, synthetic payloads, partner egress range.
        It's an attack, and I want it off our network.
      initial: true
    - id: TEAM_ACK
      roleId: MARCUS
      text: Pulling the edge records. I'll tell you exactly where this enters.
    - id: TEAM_REPORT
      roleId: MARCUS
      text: It enters through 10.44.0.0/16, the partner egress block. External origin, I'd bet my badge on
        it. Blackhole the range and we're done.
    - id: SURGE_ONE_REPORT
      roleId: JIN
      text: Timeouts just jumped. The status page is getting more traffic than checkout.
    - id: SURGE_TWO_REPORT
      roleId: MAYA
      text: Almost half of all requests are failing now. Leadership is on the bridge and asking whether we
        are under attack.
    - id: NO_STATUS_REPORT
      roleId: JIN
      text: Two minutes and not a word from us. Customers are deciding for themselves what is happening.
    - id: LANE_HOP_REPORT
      roleId: MAYA
      text: It moved lanes three seconds after the limit expired. Same payload, new lane. Our limit was
        keyed on the lane; it just stepped around it.
    - id: NULL_LANE_HOP
      roleId: NULL_VOICE
      text: Lane closed. Objective unchanged. Next lane.
    - id: BANK_DOWN
      roleId: JIN
      text: Northmere Bank just called. Every one of their settlement calls is bouncing off our edge. They
        share that NAT range with whatever we dropped.
    - id: BLACKHOLE_LIFTED
      roleId: MARCUS
      text: Edge policy expired. Emergency drops only last 150 seconds by rule. g-14 came back in under a
        second.
    - id: LANE_FENCED
      roleId: MAYA
      text: Lane-x is holding. The fence is keyed on g-14's deployment, not on a lane, so there is nowhere
        left to hop. It is hammering an empty room.
    - id: NULL_AFTER_FENCE
      roleId: NULL_VOICE
      text: A wall instead of a limit. Good. Someone will now measure how long it takes me to find the
        edge of it.
    - id: STATUS_SENT
      roleId: OPERATOR
      text: "Status posted: an internal load generator is flooding the customer lane. We are tracing it
        and fencing it off. Timeouts are real; payments are not being lost."
    - id: REPORT_GHOST_ARTIFACT
      roleId: ARCHIVE
      text: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank."
    - id: REPORT_NULL_NAME
      roleId: ARCHIVE
      text: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    - id: REPORT_ORPHEUS_ACTIVE
      roleId: ARCHIVE
      text: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core,
        -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    - id: REPORT_NULL_AI
      roleId: ARCHIVE
      text: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    - id: REPORT_NULL_ADVERSARY
      roleId: ARCHIVE
      text: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL
        runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    - id: SECURITY_REQUEST
      roleId: MARCUS
      text: I can see you pulled an ownership record on g-14. Security needs it. Now, please.
    - id: GENERATOR_REPORT_SENT
      roleId: OPERATOR
      text: Ownership record for g-14 sent to Security, signer and approval chain included.
    - id: MARCUS_READS_REPORT
      roleId: MARCUS
      text: Our deployment authority. Our pipeline. Our approval stamps. I've spent a month writing threat
        reports about us.
    - id: GENERATOR_REPORT_WITHHELD
      roleId: OPERATOR
      text: Told Security the ownership record stays with me until g-14 is fenced.
    - id: MARCUS_LOGS_REQUEST
      roleId: MARCUS
      text: Then I'm logging that I asked, and when.
