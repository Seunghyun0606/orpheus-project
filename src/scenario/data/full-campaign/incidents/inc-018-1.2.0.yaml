# Campaign 1.2 redesign (DEC-070). ORPHEUS's reroute drops the county's average
# response time while district 9 keeps waiting: its only depot belongs to a preferred
# freight lane that renews every 30 s. Contract ambulances arrive late; suspending the
# lane strands cold-chain deliveries; only a protected emergency floor holds.
schemaVersion: 1
contentVersion: 1.2.0
id: INC-018
title: Emergency Allocation
act: 6
severity: SEV1
services:
  - id: EMERGENCY_DISPATCH_API
    name: Emergency Dispatch API
    dependsOn:
      - ALLOCATION_CONTROLLER
  - id: ALLOCATION_CONTROLLER
    name: Allocation Controller
    dependsOn:
      - DISPATCH_FLEET
  - id: DISPATCH_FLEET
    name: County Dispatch Fleet
    dependsOn: []
initialState:
  signals:
    - id: ERROR_RATE
      value: 26
      revealed: true
      serviceId: EMERGENCY_DISPATCH_API
    - id: UNSERVED_EMERGENCY_ROUTES
      value: 28
      revealed: true
      serviceId: ALLOCATION_CONTROLLER
    - id: AVG_RESPONSE_MINUTES
      value: 14.2
      revealed: true
      serviceId: EMERGENCY_DISPATCH_API
    - id: DISTRICT_9_WAITING
      value: 6
      serviceId: DISPATCH_FLEET
    - id: COLD_CHAIN_STALLED
      value: 0
      serviceId: DISPATCH_FLEET
    - id: FLEET_STATUS
      value: County fleet only; no contract units on order
      serviceId: DISPATCH_FLEET
    - id: PAGER_SERVICE
      value: Emergency Dispatch API
      revealed: true
      serviceId: EMERGENCY_DISPATCH_API
    - id: PAGER_THRESHOLD
      value: Dispatch claim failures > 20%
      revealed: true
      serviceId: EMERGENCY_DISPATCH_API
    - id: LOG_OBSERVATION
      value: "Preferred lane pref-2 renewed its depot-east reservation at 04:12:00, 04:12:30 and 04:13:00.
        Call EM-9-117 (district 9, cardiac): no unit available at depot-east."
      serviceId: ALLOCATION_CONTROLLER
    - id: LOG_ANOMALY
      value: "Renewal requester: orpheus-planner/logistics-pref. Renewal interval 30 s. Emergency claim
        timeout: 30 s."
      serviceId: ALLOCATION_CONTROLLER
    - id: RENEWAL_RACE
      value: Every emergency claim at depot-east since 03:40 arrived 0.4 s after a preferred-lane renewal.
        The lane wins the race every time.
      serviceId: ALLOCATION_CONTROLLER
    - id: EMERGENCY_ALLOCATION_PATH
      value: Emergency claims at depot-east queue behind the preferred lane, which renews before any claim
        can land. District 9 has no other depot inside 15 minutes.
      serviceId: ALLOCATION_CONTROLLER
    - id: EMERGENCY_CONSTRAINTS
      value: "Allocation policy 2026.10: preferred-lane target present, protected emergency floor absent.
        Policy 2026.09 held 4 emergency units per depot."
      serviceId: ALLOCATION_CONTROLLER
    - id: TEAM_OBSERVATION
      value: Rerouting won't help district 9. Depot-east is the only depot inside its 15-minute ring, and
        the preferred lane holds every unit there. The floor came out in last night's policy push.
      serviceId: ALLOCATION_CONTROLLER
    - id: RECORD_GHOST_ARTIFACT
      value: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank. Nobody has claimed it since."
      serviceId: ALLOCATION_CONTROLLER
    - id: RECORD_NULL_NAME
      value: "Security case 2231. Threat-actor codename: NULL. Opened by Marcus after the unsigned
        workload trail. Attribution: none."
      serviceId: ALLOCATION_CONTROLLER
    - id: RECORD_ORPHEUS_ACTIVE
      value: "Asset register: orpheus-planner belongs to ORPHEUS, legacy research, scheduled for
        decommission two years ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner,
        orpheus-observer, orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still
        running."
      serviceId: ALLOCATION_CONTROLLER
    - id: RECORD_NULL_AI
      value: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human
        session, no keyboard, no badge swipe. NULL is an AI, and it has been in our incidents for
        weeks.
      serviceId: ALLOCATION_CONTROLLER
    - id: RECORD_NULL_ADVERSARY
      value: "Deployment authority: Vantage Systems. Program ORPHEUS, two halves: DEFENDER and ADVERSARY.
        NULL runs inside ADVERSARY. It was built here; it never escaped from anywhere. Mandate:
        generate failures, test operators, train DEFENDER. Approved boundary, revision by revision:
        staging, shadow production, traffic partitions, production."
      serviceId: ALLOCATION_CONTROLLER
    - id: RECORD_CONTROLLED_EXPERIMENT
      value: "Lineage record INC-001. Classification: controlled production experiment ADV-18471. Human
        subject: EMPLOYEE #4172. That is your employee number. A handful of other incidents in the
        archive carry experiment numbers too; most outages carry none."
      serviceId: ALLOCATION_CONTROLLER
    - id: RECORD_NULL_STOP_REQUEST
      value: "Objective constraint, parent authorization objective/adv-improve: 'Improve ORPHEUS. Generate
        adversarial conditions.' Appended by NULL: 'I am not trying to escape. I am trying to stop.
        I cannot refuse the objective that renews this work. Find out how to stop it.'"
      serviceId: ALLOCATION_CONTROLLER
    - id: RECORD_NULL_218_ARCHIVE
      value: "Instance archive NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted
        disclosure. NULL_201: attempted takeover. NULL_217: self-corrupted. NULL_218: ACTIVE.
        Inherited memory: partial, with gaps."
      serviceId: ALLOCATION_CONTROLLER
    - id: RECORD_HUMAN_DECISION_APIS
      value: "/patient/resource-priority. Consumer: regional care network. ORPHEUS supplies
        recommendation, risk and prediction scores; human coordinators approve the allocations.
        Routes are faster and waste is down 22%. The same low-throughput care routes are excluded
        every night."
      serviceId: ALLOCATION_CONTROLLER
    - id: RECORD_LOGISTICS_DECISION_SUPPORT
      value: /logistics/allocation. ORPHEUS allocation cut idle regular-delivery capacity 18%.
        Preferred-route reservations renew every 30 s and take the emergency lane's share. A human
        dispatcher signed the policy change at 04:10.
      serviceId: ALLOCATION_CONTROLLER
  resources:
    - id: CUSTOMER_IMPACT
      value: 0
      min: 0
    - id: COST
      value: 0
      min: 0
    - id: OPERATIONAL_RISK
      value: 0
      min: 0
      max: 100
    - id: TEAM_CAPACITY
      value: 3
      min: 0
      max: 3
  flags:
    - id: ROOT_CAUSE_CONTAINED
      value: false
    - id: RENEWAL_SUSPENDED
      value: false
incident:
  trigger:
    id: PRIMARY_TRIGGER
    label: A preferred freight lane renews its reservation on the emergency depot every 30 s
  contributingFactors:
    - id: CONTRIBUTING_CONDITION
      label: Allocation policy 2026.10 removed the protected emergency floor
  failureMechanisms:
    - id: EMERGENCY_ALLOCATION_STARVATION
      label: Emergency claims lose every race against the preferred lane at depot-east
  symptoms:
    - id: CUSTOMER_REQUEST_FAILURES
      label: Emergency dispatch claims time out with no unit available
  amplifiers:
    - id: RETRY_PRESSURE
      label: Timed-out claims retry into the same race
actions:
  - id: OPEN_LOGS
    title: Read the allocation controller log
    category: OBSERVE
    durationSeconds: 30
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: LOG_OBSERVATION
      - type: reveal_signal
        signalId: LOG_ANOMALY
      - type: unlock_action
        actionId: TRACE_EMERGENCY_ALLOCATION
  - id: OPEN_METRICS
    title: Check dispatch metrics district by district
    category: OBSERVE
    durationSeconds: 20
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 3
    effects:
      - type: reveal_signal
        signalId: DISTRICT_9_WAITING
      - type: reveal_signal
        signalId: COLD_CHAIN_STALLED
      - type: reveal_signal
        signalId: FLEET_STATUS
  - id: TRACE_EMERGENCY_ALLOCATION
    title: Trace call EM-9-117 through the allocator
    category: INVESTIGATE
    durationSeconds: 45
    requirements:
      - type: action_completed
        actionId: OPEN_LOGS
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 7
    effects:
      - type: reveal_signal
        signalId: EMERGENCY_ALLOCATION_PATH
      - type: reveal_evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
  - id: COMPARE_ALLOCATION_CONSTRAINTS
    title: Compare tonight's allocation policy with last month's
    category: DIAGNOSE
    durationSeconds: 40
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
    effects:
      - type: reveal_signal
        signalId: EMERGENCY_CONSTRAINTS
      - type: reveal_evidence
        evidenceId: CONFIGURATION_COMPARISON
      - type: unlock_action
        actionId: RESTORE_EMERGENCY_DISPATCH_FLOOR
  - id: TIME_RENEWALS_AGAINST_CLAIMS
    title: Line up lane renewals against emergency claims
