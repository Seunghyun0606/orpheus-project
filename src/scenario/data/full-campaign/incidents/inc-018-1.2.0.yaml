      - type: cancel_event
        eventId: RENEWAL_REASSERTED
      - type: schedule_event
        eventId: RENEWAL_REASSERTED
      - type: cancel_event
        eventId: COLD_CHAIN_SPOILS
      - type: schedule_event
        eventId: COLD_CHAIN_SPOILS
