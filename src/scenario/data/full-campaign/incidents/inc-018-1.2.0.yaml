        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 8
      - resourceId: COST
        amount: 190
      - resourceId: OPERATIONAL_RISK
        amount: 4
    effects:
      - type: resolve_mechanism
        mechanismId: EMERGENCY_ALLOCATION_STARVATION
      - type: set_flag
        flagId: RENEWAL_SUSPENDED
        value: false
      - type: set_signal
        signalId: UNSERVED_EMERGENCY_ROUTES
        value: 0
      - type: set_signal
        signalId: ERROR_RATE
        value: 0.6
      - type: set_signal
        signalId: AVG_RESPONSE_MINUTES
        value: 8.1
      - type: set_signal
        signalId: DISTRICT_9_WAITING
        value: 0
      - type: set_signal
        signalId: COLD_CHAIN_STALLED
        value: 0
      - type: cancel_event
