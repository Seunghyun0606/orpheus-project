    type: timer
    delaySeconds: 70
    targetServiceId: DISPATCH_FLEET
    cancellationConditions:
      - &a4
        type: signal
        signalId: DISTRICT_9_WAITING
        operator: lte
        value: 0
    effects:
      - type: change_resource
