      - type: set_signal
        signalId: ERROR_RATE
        value: 30
      - type: set_signal
        signalId: AVG_RESPONSE_MINUTES
        value: 16
      - type: set_signal
        signalId: DISTRICT_9_WAITING
        value: 6
