        flagId: RENEWAL_SUSPENDED
        value: true
      - type: set_signal
        signalId: DISTRICT_9_WAITING
        value: 0
      - type: set_signal
        signalId: UNSERVED_EMERGENCY_ROUTES
        value: 14
      - type: set_signal
        signalId: ERROR_RATE
        value: 15
      - type: set_signal
        signalId: COLD_CHAIN_STALLED
        value: 41
      - type: reveal_signal
