    category: MITIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - &a1
        type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 4
      - resourceId: COST
        amount: 160
      - resourceId: OPERATIONAL_RISK
        amount: 5
    effects:
      - type: set_signal
        signalId: UNSERVED_EMERGENCY_ROUTES
        value: 9
      - type: set_signal
        signalId: ERROR_RATE
        value: 8
      - type: set_signal
        signalId: AVG_RESPONSE_MINUTES
        value: 9.4
      - type: cancel_event
