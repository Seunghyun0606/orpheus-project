      - type: cancel_event
        eventId: ROUTE_RECLAIMED
      - type: schedule_event
        eventId: ROUTE_RECLAIMED
      - type: post_message
        messageId: ORPHEUS_ROUTE_APPLIED
      - type: post_message
        messageId: DISTRICT_9_STILL
  - id: SCALE_DISPATCH_FLEET
