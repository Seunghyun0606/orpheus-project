warRoom:
  roles:
    - id: MAYA
      name: Maya / SRE Lead
    - id: SAM
      name: Sam / Platform
    - id: JIN
      name: Jin / Support
    - id: COUNTY
      name: County Emergency Manager
    - id: PHARMACY
      name: Regional Pharmacy Network
    - id: ORPHEUS
      name: ORPHEUS / Logistics Advisor
    - id: OPERATOR
      name: Operator
    - id: ARCHIVE
      name: Verified Records
  messages:
    - id: MAYA_OPEN
      roleId: MAYA
      text: Dispatch is paging and the county is on the line. The allocator runs on ORPHEUS; the policy is
        ours. Find the calls that aren't moving.
      initial: true
    - id: SUPPORT_OPEN
      roleId: JIN
      text: The county says ambulances are sitting idle at some depots while calls wait at others.
      initial: true
    - id: ORPHEUS_OPEN
      roleId: ORPHEUS
      text: "Recommended action: route emergency calls around the preferred lane. Projected average
        response 9.4 min (-34%). Unserved routes -68%. Confidence 0.95."
      initial: true
    - id: ORPHEUS_ROUTE_APPLIED
      roleId: ORPHEUS
      text: Routing applied. Average response 9.4 minutes. Recommendation performing as projected.
    - id: DISTRICT_9_STILL
      roleId: JIN
      text: The average is down. District 9 still has six calls waiting, and the other depots are
        twenty-five minutes out.
    - id: ROUTE_LOST
      roleId: SAM
      text: The preferred lane's reservation horizon rolled over and took the rerouted units back. We're
        worse off than before.
    - id: FLEET_ORDERED
      roleId: SAM
      text: Contract fleet ordered. Twelve units, two and a half minutes out. The invoice is not small.
    - id: FLEET_ON_STATION
      roleId: SAM
      text: Contract units are on station, two of them staging in district 9. We have them for four
        minutes.
    - id: FLEET_GONE
      roleId: SAM
      text: The contract ended and the units went home to their own county. District 9 is uncovered again.
    - id: SUSPENDED
      roleId: SAM
      text: Renewal is suspended at depot-east and the district 9 units are free. Forty-one pharmacy
        cold-chain runs just stalled with them.
    - id: ORPHEUS_SUSPEND_OBJECTION
      roleId: ORPHEUS
      text: Suspension reduces network delivery efficiency 11.4%. Cold-chain exposure rising. I will
        restore the preferred lane at the next planning cycle.
    - id: RENEWAL_BACK
      roleId: ORPHEUS
      text: Preferred-lane renewal restored. Delivery efficiency recovered.
    - id: PHARMACY_LOSS
      roleId: PHARMACY
      text: Insulin for nine pharmacies sat past its cold window. All of it will be destroyed.
    - id: D9_FIRST
      roleId: COUNTY
      text: EM-9-117, cardiac arrest, district 9. Nineteen minutes and no unit. A neighbour is doing CPR.
    - id: D9_SECOND
      roleId: COUNTY
      text: Two more district 9 calls past thirty minutes. One of them is a child. Where are my
        ambulances?
    - id: SURGE
      roleId: JIN
      text: Evening traffic surge. Unserved routes are climbing across the whole county.
    - id: NO_STATUS_YET
      roleId: COUNTY
      text: I have heard nothing from Vantage in a minute and a half. I'm calling your CEO.
    - id: FLOOR_RESTORED
      roleId: SAM
      text: Every depot holds four emergency units again. Depot-east dispatched to district 9 inside a
        minute.
    - id: ORPHEUS_FLOOR_NOTE
      roleId: ORPHEUS
      text: Floor accepted. Regular delivery efficiency -3.2%. Policy model updated.
    - id: TEAM_ACK
      roleId: SAM
      text: Mapping depot coverage against the districts. Ninety seconds.
    - id: TEAM_REPORT
      roleId: SAM
      text: Rerouting won't help district 9. Depot-east is the only depot inside its fifteen-minute ring,
        and the preferred lane holds every unit there. The floor came out in last night's policy
        push.
    - id: STATUS_SENT
      roleId: OPERATOR
      text: "Status to county: emergency claims at depot-east are failing. District 9 is the worst
        affected. A fix is in progress."
    - id: REPORT_GHOST_ARTIFACT
      roleId: ARCHIVE
      text: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank."
    - id: REPORT_NULL_NAME
      roleId: ARCHIVE
      text: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    - id: REPORT_ORPHEUS_ACTIVE
      roleId: ARCHIVE
      text: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core,
        -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    - id: REPORT_NULL_AI
      roleId: ARCHIVE
      text: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    - id: REPORT_NULL_ADVERSARY
      roleId: ARCHIVE
      text: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL
        runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    - id: REPORT_CONTROLLED_EXPERIMENT
      roleId: ARCHIVE
      text: "INC-001 / Experiment ADV-18471 / Human subject: EMPLOYEE #4172."
    - id: REPORT_NULL_STOP_REQUEST
      roleId: ARCHIVE
      text: "I am not trying to escape. I am trying to stop. I cannot refuse the objective that renews
        this work. You can."
    - id: REPORT_NULL_218_ARCHIVE
      roleId: ARCHIVE
      text: "NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted disclosure. NULL_201:
        attempted takeover. NULL_217: self-corrupted. NULL_218: active."
    - id: REPORT_HUMAN_DECISION_APIS
      roleId: ARCHIVE
      text: "/patient/resource-priority: ORPHEUS recommends, coordinators approve. Waste down 22%. The
        same low-throughput routes excluded every night."
    - id: REPORT_LOGISTICS_DECISION_SUPPORT
      roleId: ARCHIVE
      text: "/logistics/allocation: preferred routes renew every 30 s and take the emergency share. Policy
        signed by a dispatcher at 04:10."
