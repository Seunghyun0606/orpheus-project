        signalId: UNSERVED_EMERGENCY_ROUTES
        value: 30
      - type: set_signal
        signalId: ERROR_RATE
        value: 27
      - type: set_signal
        signalId: COLD_CHAIN_STALLED
        value: 0
      - type: cancel_event
        eventId: COLD_CHAIN_SPOILS
