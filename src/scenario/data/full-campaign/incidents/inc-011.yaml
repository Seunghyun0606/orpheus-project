warRoom:
  roles:
    - id: MAYA
      name: Maya / SRE Lead
    - id: MARCUS
      name: Marcus / Security
    - id: JIN
      name: Jin / Support
    - id: OPERATOR
      name: Operator
    - id: ARCHIVE
      name: Verified Records
  messages:
    - id: MAYA_OPEN
      roleId: MAYA
      text: The workload exposed a previously unobserved capacity limit. Separate aggregate outcomes from
        the affected requests.
      initial: true
    - id: SUPPORT_OPEN
      roleId: JIN
      text: Customers now receive timeouts from a load test they did not authorize.
      initial: true
    - id: TEAM_ACK
      roleId: MARCUS
      text: I will inspect the current operational evidence. ETA two minutes.
      initial: false
    - id: TEAM_REPORT
      roleId: MARCUS
      text: The generated load found a real capacity weakness, but its routing boundary includes customer
        traffic.
      initial: false
    - id: SUPPORT_ESCALATION
      roleId: JIN
      text: Affected requests are still failing. Temporary stabilization has not contained the mechanism.
      initial: false
    - id: STATUS_SENT
      roleId: OPERATOR
      text: Current evidence and impact shared; temporary relief remains distinct from verified
        containment.
      initial: false
    - id: REPORT_GHOST_ARTIFACT
      roleId: ARCHIVE
      text: Unsigned observer manifest / synthetic shadow-7 requests / missing signature. A fresh archive
        comparison recovers the unexplained workload trail; it does not reconstruct an earlier
        player choice.
      initial: false
    - id: REPORT_NULL_NAME
      roleId: ARCHIVE
      text: "Security threat-actor codename: NULL. Marcus recorded this name after correlating the
        unsigned workload trail. The codename alone does not identify an AI, its origin or motive."
