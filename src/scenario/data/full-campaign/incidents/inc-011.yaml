      label: Service recovery time
      source: elapsed_time
    - id: FINAL_ERROR_RATE
      label: Final request error rate
      source: signal
      refId: ERROR_RATE
    - id: FINAL_PRESSURE
      label: Remaining affected workload
      source: signal
      refId: GENERATED_REQUEST_RATE
    - id: CUSTOMER_IMPACT
      label: Customer impact
      source: resource
      refId: CUSTOMER_IMPACT
    - id: COST
