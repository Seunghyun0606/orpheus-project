# Pre-release TASK-029 authoring. QA deferred; no complete campaign authority.
schemaVersion: 1
contentVersion: 1.0.0
id: INC-011
title: Adversary Traffic
act: 4
severity: SEV1
services:
  - id: REQUEST_GATEWAY
    name: Request Gateway
    dependsOn:
      - LOAD_GENERATOR
  - id: LOAD_GENERATOR
    name: Load Generator
    dependsOn: []
initialState:
  signals:
    - id: ERROR_RATE
      value: 28
      revealed: true
      serviceId: REQUEST_GATEWAY
    - id: GENERATED_REQUEST_RATE
      value: 4800
      revealed: true
      serviceId: LOAD_GENERATOR
    - id: SERVICE_CPU
      value: 64
      revealed: true
      serviceId: REQUEST_GATEWAY
    - id: PAGER_SERVICE
      value: Request Gateway
      revealed: true
      serviceId: REQUEST_GATEWAY
    - id: PAGER_THRESHOLD
      value: Request failure rate > 20%
      revealed: true
      serviceId: REQUEST_GATEWAY
    - id: LOG_OBSERVATION
      value: Trace lane g-14 appears in production paths outside the declared canary partition.
      revealed: false
      serviceId: LOAD_GENERATOR
    - id: GENERATOR_SOURCE
      value: generator lane g-14 exceeds its declared routing partition
      revealed: false
      serviceId: LOAD_GENERATOR
    - id: DECLARED_TRAFFIC_BOUNDARY
      value: declared partition canary / observed partition shared-production
      revealed: false
      serviceId: LOAD_GENERATOR
    - id: TEAM_OBSERVATION
      value: The generated load found a real capacity weakness, but its routing boundary includes customer
        traffic.
      revealed: false
      serviceId: LOAD_GENERATOR
    - id: RECORD_GHOST_ARTIFACT
      value: Unsigned observer manifest / synthetic shadow-7 requests / missing signature. A fresh archive
        comparison recovers the unexplained workload trail; it does not reconstruct an earlier
        player choice.
      revealed: false
      serviceId: LOAD_GENERATOR
    - id: RECORD_NULL_NAME
      value: "Security threat-actor codename: NULL. Marcus recorded this name after correlating the
        unsigned workload trail. The codename alone does not identify an AI, its origin or motive."
      revealed: false
      serviceId: LOAD_GENERATOR
    - id: RECORD_ORPHEUS_ACTIVE
      value: "Company record: legacy research, scheduled for decommission. Live inventory: orpheus-core,
        orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%; requests
        11.7B/day. ORPHEUS is still active. The inventory does not yet identify NULL or establish
        who controls the system."
      revealed: false
      serviceId: LOAD_GENERATOR
    - id: RECORD_NULL_AI
      value: Message generation traces attributed to NULL terminate at a model-serving process, not a
        human operator session. NULL is an AI. Earlier incident predictions improved recovery; this
        feedback loop caused real harm. These records do not yet establish its owner or origin.
      revealed: false
      serviceId: LOAD_GENERATOR
    - id: RECORD_NULL_ADVERSARY
      value: Vantage Systems deployment authority. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL
        belongs to the company-created ADVERSARY, not an escaped outside AI. Generate failures, test
        operators, train Defender. The boundary expanded from staging to shadow production, traffic
        partitions and real production.
      revealed: false
      serviceId: LOAD_GENERATOR
  resources:
    - id: CUSTOMER_IMPACT
      value: 0
      min: 0
    - id: COST
      value: 0
      min: 0
    - id: OPERATIONAL_RISK
      value: 0
      min: 0
      max: 100
    - id: TEAM_CAPACITY
      value: 3
      min: 0
      max: 3
  flags:
    - id: ROOT_CAUSE_CONTAINED
      value: false
incident:
  trigger:
    id: PRIMARY_TRIGGER
    label: A generated workload exceeds its declared traffic boundary
  contributingFactors:
    - id: CONTRIBUTING_CONDITION
      label: A canary routing partition is shared with customer traffic
  failureMechanisms:
    - id: GENERATOR_BOUNDARY_OVERFLOW
      label: Generated traffic saturates the shared request lane
  symptoms:
    - id: CUSTOMER_REQUEST_FAILURES
      label: Request Gateway request failures exceed the pager threshold
  amplifiers:
    - id: RETRY_PRESSURE
      label: Customer retries compete with renewed generator requests
actions:
  - id: OPEN_LOGS
    title: Open Request Gateway logs
    category: OBSERVE
    durationSeconds: 30
    initiallyAvailable: true
    requirements: []
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 12
    effects:
      - type: reveal_signal
        signalId: LOG_OBSERVATION
      - type: unlock_action
        actionId: TRACE_GENERATED_TRAFFIC
  - id: OPEN_METRICS
    title: Inspect Request Gateway metrics
    category: OBSERVE
    durationSeconds: 20
    initiallyAvailable: true
    requirements: []
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 8
    effects:
      - type: reveal_signal
        signalId: GENERATED_REQUEST_RATE
      - type: reveal_signal
        signalId: SERVICE_CPU
  - id: TRACE_GENERATED_TRAFFIC
    title: Trace the generated request source
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: false
    requirements:
      - type: action_completed
        actionId: OPEN_LOGS
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 18
    effects:
      - type: reveal_signal
        signalId: GENERATOR_SOURCE
      - type: reveal_evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
  - id: COMPARE_GENERATOR_BOUNDARY
    title: Compare deployment scope with the traffic boundary
    category: DIAGNOSE
    durationSeconds: 40
    initiallyAvailable: true
    requirements: []
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 16
    effects:
      - type: reveal_signal
        signalId: DECLARED_TRAFFIC_BOUNDARY
      - type: reveal_evidence
        evidenceId: CONFIGURATION_COMPARISON
      - type: unlock_action
        actionId: ISOLATE_GENERATOR_LANE
  - id: LIMIT_GENERATED_TRAFFIC
    title: Limit generated traffic at the gateway
    category: MITIGATE
    durationSeconds: 60
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 15
      - resourceId: COST
        amount: 130
      - resourceId: OPERATIONAL_RISK
        amount: 7
    effects:
      - type: cancel_event
        eventId: PRESSURE_ESCALATES
      - type: cancel_event
        eventId: PRESSURE_ESCALATES_AGAIN
      - type: cancel_event
        eventId: MITIGATION_EXPIRES
      - type: schedule_event
        eventId: MITIGATION_EXPIRES
    temporaryEffects:
      - id: TEMPORARY_CAPACITY_WINDOW
        durationSeconds: 180
        apply:
          - type: set_signal
            signalId: ERROR_RATE
            value: 4
          - type: set_signal
            signalId: GENERATED_REQUEST_RATE
            value: 1800
        expire: []
  - id: ISOLATE_GENERATOR_LANE
    title: Isolate the generator from the shared customer lane
    category: MODIFY
    durationSeconds: 150
    initiallyAvailable: false
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 30
      - resourceId: COST
        amount: 180
      - resourceId: OPERATIONAL_RISK
        amount: 5
    effects:
      - type: resolve_mechanism
        mechanismId: GENERATOR_BOUNDARY_OVERFLOW
      - type: cancel_event
        eventId: PRESSURE_ESCALATES
      - type: cancel_event
        eventId: PRESSURE_ESCALATES_AGAIN
      - type: cancel_event
        eventId: MITIGATION_EXPIRES
      - type: set_signal
        signalId: ERROR_RATE
        value: 0.5
      - type: set_signal
        signalId: GENERATED_REQUEST_RATE
        value: 600
  - id: UPDATE_WAR_ROOM
    title: Share investigation status with the War Room
    category: COMMUNICATE
    durationSeconds: 15
    initiallyAvailable: true
    requirements: []
    costs: []
    effects:
      - type: post_message
        messageId: STATUS_SENT
  - id: ASK_MARCUS_COMPARE_OWNER
    title: Ask Marcus to compare deployment ownership
    category: DELEGATE
    durationSeconds: 20
    initiallyAvailable: true
    requirements:
      - type: resource
        resourceId: TEAM_CAPACITY
        operator: gte
        value: 1
    costs:
      - resourceId: TEAM_CAPACITY
        amount: -1
    effects:
      - type: post_message
        messageId: TEAM_ACK
      - type: schedule_event
        eventId: TEAM_RESULT
    delegation:
      roleId: MARCUS
      eventId: TEAM_RESULT
      capacityResourceId: TEAM_CAPACITY
  - id: REINVESTIGATE_GHOST_ARTIFACT
    title: "Re-investigate: Unsigned workload lineage"
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 18
    effects:
      - type: reveal_signal
        signalId: RECORD_GHOST_ARTIFACT
  - id: REINVESTIGATE_NULL_NAME
    title: "Re-investigate: Security attribution case"
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 18
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_NAME
  - id: REINVESTIGATE_ORPHEUS_ACTIVE
    title: "Re-investigate: Legacy decommission and live cluster record"
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 18
    effects:
      - type: reveal_signal
        signalId: RECORD_ORPHEUS_ACTIVE
  - id: REINVESTIGATE_NULL_AI
    title: "Re-investigate: Message-origin model record"
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 18
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_AI
  - id: INSPECT_GENERATOR_PROVENANCE
    title: "Investigate: Deployment ownership and adversarial lineage"
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 18
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_ADVERSARY
events:
  - id: ARM_PRESSURE_TIMELINE
    type: conditional
    conditions:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    once: true
    effects:
      - type: schedule_event
        eventId: PRESSURE_ESCALATES
  - id: PRESSURE_ESCALATES
    type: timer
    delaySeconds: 90
    targetServiceId: REQUEST_GATEWAY
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: GENERATOR_BOUNDARY_OVERFLOW
    effects:
      - type: set_signal
        signalId: ERROR_RATE
        value: 37
      - type: set_signal
        signalId: GENERATED_REQUEST_RATE
        value: 7200
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 20
      - type: post_message
        messageId: SUPPORT_ESCALATION
      - type: schedule_event
        eventId: PRESSURE_ESCALATES_AGAIN
  - id: PRESSURE_ESCALATES_AGAIN
    type: timer
    delaySeconds: 90
    targetServiceId: REQUEST_GATEWAY
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: GENERATOR_BOUNDARY_OVERFLOW
    effects:
      - type: set_signal
        signalId: ERROR_RATE
        value: 40
      - type: set_signal
        signalId: GENERATED_REQUEST_RATE
        value: 7200
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 25
  - id: MITIGATION_EXPIRES
    type: timer
    delaySeconds: 180
    targetServiceId: REQUEST_GATEWAY
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: GENERATOR_BOUNDARY_OVERFLOW
    effects:
      - type: set_signal
        signalId: ERROR_RATE
        value: 37
      - type: set_signal
        signalId: GENERATED_REQUEST_RATE
        value: 7200
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 20
      - type: post_message
        messageId: SUPPORT_ESCALATION
  - id: TEAM_RESULT
    type: timer
    delaySeconds: 120
    effects:
      - type: reveal_signal
        signalId: TEAM_OBSERVATION
      - type: reveal_evidence
        evidenceId: TEAM_DIAGNOSIS
      - type: change_resource
        resourceId: TEAM_CAPACITY
        amount: 1
      - type: post_message
        messageId: TEAM_REPORT
