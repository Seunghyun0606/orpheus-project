      initial: false
    - id: REPORT_INDEPENDENT_AUDIT_HANDOFF
      roleId: OPERATOR
      text: "Accepted plan: Hand off evidence to independent audit. ORPHEUS SUSPENDED; NULL ISOLATED;
        disclosure INDEPENDENT. Final measured service errors: 1 / 1 / 2 / 2 / 3. This commits an
