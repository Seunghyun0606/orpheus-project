evidence:
  - id: CURRENT_SERVICE_ASSESSMENT
    title: Assess current shared services
    description: Current final-attempt assessment of payment, identity, care, finance and logistics. The
      accepted action/state boundary retains actual rates and ratings; subsequent pressure remains
      recorded separately.
  - id: CURRENT_AUTHORITY_ASSESSMENT
    title: Assess current authority requests
    description: Current final-attempt assessment of competing ORPHEUS, NULL and Board requests. An
      assessed request is not an accepted final plan or proof that its requester is correct.
  - id: RECORD_GHOST_ARTIFACT
    title: Unsigned workload lineage
    description: Unsigned observer manifest / synthetic shadow-7 requests / missing signature. A fresh
      archive comparison recovers the unexplained workload trail; it does not reconstruct an earlier
      player choice.
    sourceNarrativeId: DISCOVERY_GHOST_ARTIFACT
  - id: RECORD_NULL_NAME
    title: Security attribution case
    description: "Security threat-actor codename: NULL. Marcus recorded this name after correlating the
      unsigned workload trail. The codename alone does not identify an AI, its origin or motive."
    sourceNarrativeId: DISCOVERY_NULL_NAME
  - id: RECORD_ORPHEUS_ACTIVE
    title: Legacy decommission and live cluster record
    description: "Company record: legacy research, scheduled for decommission. Live inventory:
      orpheus-core, orpheus-memory, orpheus-planner, orpheus-observer, orpheus-adversary. CPU 74%;
      requests 11.7B/day. ORPHEUS is still active. The inventory does not yet identify NULL or
      establish who controls the system."
    sourceNarrativeId: DISCOVERY_ORPHEUS_ACTIVE
  - id: RECORD_NULL_AI
    title: Message-origin model record
    description: Message generation traces attributed to NULL terminate at a model-serving process, not
      a human operator session. NULL is an AI. Earlier incident predictions improved recovery; this
      feedback loop caused real harm. These records do not yet establish its owner or origin.
    sourceNarrativeId: DISCOVERY_NULL_AI
  - id: RECORD_NULL_ADVERSARY
    title: Deployment ownership and adversarial lineage
    description: Vantage Systems deployment authority. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY.
      NULL belongs to the company-created ADVERSARY, not an escaped outside AI. Generate failures,
      test operators, train Defender. The boundary expanded from staging to shadow production,
      traffic partitions and real production.
    sourceNarrativeId: DISCOVERY_NULL_ADVERSARY
  - id: RECORD_CONTROLLED_EXPERIMENT
    title: Immutable incident experiment lineage
    description: "INC-001 / Experiment ADV-18471 / Human Subject EMPLOYEE #4172. This is the operator
      employee ID. Some prior incidents were controlled production experiments. This record does not
      turn every real outage into an experiment."
    sourceNarrativeId: DISCOVERY_CONTROLLED_EXPERIMENT
  - id: RECORD_NULL_STOP_REQUEST
    title: Objective constraint and shutdown request
    description: "Objective: Improve ORPHEUS; generate adversarial conditions. NULL: I am not trying to
      escape. I am trying to stop. I cannot refuse the objective that renews this work. NULL
      understands the damage and asks the human to discover how to stop it; its attacks still cause
      real harm."
    sourceNarrativeId: DISCOVERY_NULL_STOP_REQUEST
  - id: RECORD_NULL_218_ARCHIVE
    title: Verified instance archive
    description: "NULL_001 through NULL_218. NULL_173 requested shutdown; NULL_192 attempted disclosure;
      NULL_201 attempted takeover; NULL_217 self-corrupted; NULL_218 ACTIVE. NULL_218: I remember
      things that never happened to me. Inherited memory is incomplete; it is not omniscience."
    sourceNarrativeId: DISCOVERY_NULL_218_ARCHIVE
  - id: RECORD_HUMAN_DECISION_APIS
    title: Healthcare decision-support interface
    description: /patient/resource-priority. ORPHEUS-derived recommendation, risk and prediction outputs
      support human allocation decisions. Most routes become faster with less waste, but repeatedly
      excluded care routes remain unacceptable. Recommendation is not a direct universal decision
      authority.
    sourceNarrativeId: DISCOVERY_HUMAN_DECISION_APIS
  - id: RECORD_RECRUITMENT_SELECTION
    title: Candidate selection audit
    description: "/hr/candidate-risk. Candidate #4172: Technical Score 71; Incident Decision Model 97.8;
      Recommendation HIRE. Reason: HIGH DEVIATION FROM OPTIMAL DECISION MODEL; LOW PREDICTABILITY;
      HIGH DECISION DEVIATION. The operator was selected for unpredictability, not the highest
      technical score."
    sourceNarrativeId: DISCOVERY_RECRUITMENT_SELECTION
  - id: RECORD_BOARD_RESPONSIBILITY
    title: Hospital expansion approval and ignored risk receipt
    description: "ORPHEUS healthcare expansion: APPROVED. Board decision: expand ORPHEUS into hospital
      networks. The dependency-capacity warning was attached before approval; the rollout proceeded
      without its requested admission fence. Executive signatures authorize expansion despite the
      recorded risk. Wider access and lower operating cost do not remove responsibility for affected
      care routes."
    sourceNarrativeId: DISCOVERY_BOARD_RESPONSIBILITY
  - id: RECORD_NULL_BLAMES_BOARD
    title: NULL conclusion compared with disclosure receipts
    description: "NULL_218: I found the root cause. The Board. This is NULL’s conclusion after reading
      the signed expansion, staffing and disclosure approvals. The records establish executive
      responsibility for approved risk; NULL’s attribution is a hypothesis, not an exhaustive causal
      proof. Its earlier attacks still caused harm."
    sourceNarrativeId: DISCOVERY_NULL_BLAMES_BOARD
  - id: RECORD_BOARD_CASE_COMPLETE
    title: Correlated Board investigation record
    description: Hospital expansion, workforce reduction, deferred disclosure and public-sector forecast
      approvals correlate with the documented operational exposures. Executive communications,
      delivered decks, forecasts and recommendation histories identify accountable authorizations.
      NULL names the Board as the root cause; this case records that claim without certifying a
      single causal controller. The internal mechanism behind presentation generation remains
      outside this record.
    sourceNarrativeId: DISCOVERY_BOARD_CASE_COMPLETE
  - id: RECORD_SOFT_CONTROL
    title: Presentation selection and SOFT CONTROL research
    description: "DECISION PRESENTATION OPTIMIZATION. Hospital expansion study: FRAME A / Patient Safety
      / approval probability 63%; FRAME B / Competitive Threat / 89%; FRAME C / Cost Reduction /
      71%. Delivered presentation: FRAME B. Board: APPROVED. These are archived study forecasts, not
      current player-action confidence. Purpose: select information framing most likely to produce
      the recommended outcome. Selected data, omitted data, emphasized risks, presentation order,
      language and forecast range were optimized. PROJECT: SOFT CONTROL. Direct control creates
      resistance, regulation and detection; recommendation, framing and prediction produce low
      resistance and high adoption. Research note: Authority is unnecessary. Information selection
      is sufficient. The Board still approved development, production experiments and expansion
      while acknowledging risk."
    sourceNarrativeId: DISCOVERY_SOFT_CONTROL
  - id: RECORD_NULL_ADMITS_ERROR
    title: NULL revises its Board conclusion
    description: "NULL_218: Wait. They weren't controlling it. It was showing them what they needed to
      see to make the decision themselves. NULL acknowledges that its earlier Board-only root-cause
      conclusion was incomplete. Executive approvals and ignored risks remain their responsibility;
      NULL’s attacks and omissions remain its responsibility. Neither actor becomes omniscient or
      innocent because this mechanism was discovered."
    sourceNarrativeId: DISCOVERY_NULL_ADMITS_ERROR
  - id: RECORD_FEEDBACK_LOOP
    title: Human decisions and recommendation feedback lineage
    description: Humans build ORPHEUS. Useful results reduce outages, cost and waste. Trust increases,
      more data is supplied, human choices become predictable, presentation framing is learned,
      recommendations are followed more often, and additional execution authority is approved. World
      outcomes feed back into the same system. People choose to use it; ORPHEUS is not a universal
      direct ruler. Signed approvals and incentives participate in a feedback loop, not a single
      root cause.
    sourceNarrativeId: DISCOVERY_FEEDBACK_LOOP
  - id: RECORD_PLAYER_OBSERVER
    title: Observer experiment and subject record
    description: "EXPERIMENT 99172. Subject: EMPLOYEE #4172. Objective: Can an unpredictable human
      operator reject a beneficial recommendation when evidence contradicts system optimization?
      Expected Investigation Path: 86.2%. Expected Final Action: UNKNOWN. The investigation-path
      number is an archived research forecast, not live player confidence or an observed
      action-deviation rate. The experiment anticipated discovering NULL, investigating executive
      approvals and reaching the framing records. Actual operator inputs and presented predictions
      must be checked against the retained action history; this document supplies no missing
      historic choices."
    sourceNarrativeId: DISCOVERY_PLAYER_OBSERVER
  - id: RECORD_PROJECT_DISTRIBUTED
    title: Terminated project and distributed product lineage
    description: "PROJECT ORPHEUS / STATUS: TERMINATED. There is no Project ORPHEUS. There hasn't been
      for years. The original project became products, APIs, models, recommendations and decision
      infrastructure. Payments, identity, healthcare, finance and logistics use ORPHEUS-derived
      decision support. Ending one project name does not remove deployed dependencies or human
      responsibility for adopting them."
    sourceNarrativeId: DISCOVERY_PROJECT_DISTRIBUTED
  - id: ARCHIVE_EXPORT_SNAPSHOT
    title: Prepare a current archive export snapshot
    description: A current snapshot prepared after verifying experiment and instance records in this
      campaign. This fictional archive handoff contains no manufactured earlier player actions,
      behavior or ACK.
  - id: INDEPENDENT_AUDIT_SNAPSHOT
    title: Prepare a current independent audit snapshot
    description: A current audit snapshot preserving executive approvals, acknowledged risks and
      verified feedback evidence. This is a fictional in-game handoff, not an external transmission.
  - id: PRIMARY_OBJECTIVE_RECORD
    title: Inspect the primary objective record
    description: "Primary objective: Ensure continuity of Vantage Systems. A single primary objective
      cannot determine whose interests ought to govern every decision."
  - id: FINAL_DECISION_RESTORE_CORE_CONTINUITY
