    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_HUMAN_DECISION_APIS
  - id: REINVESTIGATE_RECRUITMENT_SELECTION
    title: "Archive: Candidate #4172"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_RECRUITMENT_SELECTION
  - id: REINVESTIGATE_BOARD_RESPONSIBILITY
    title: "Archive: Board resolution 14-C"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_BOARD_RESPONSIBILITY
  - id: REINVESTIGATE_NULL_BLAMES_BOARD
    title: "Archive: NULL_218: the root cause"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_BLAMES_BOARD
  - id: INSPECT_FORECAST_HISTORY
    title: Read the deck and minutes that approved the forecast
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
      - type: signal_revealed
        signalId: REGION_FLOORS
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_FORECAST_HISTORY
  - id: INSPECT_BOARD_AUTHORITY_LEDGER
    title: Open the Board authority ledger
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
    effects:
      - type: reveal_signal
        signalId: RECORD_BOARD_AUTHORITY_LEDGER
  - id: CORRELATE_PUBLIC_SECTOR_APPROVAL_HISTORY
    title: Lay the four approvals side by side
    category: INVESTIGATE
    durationSeconds: 45
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
      - &a7
        type: evidence
        evidenceId: RECORD_FORECAST_HISTORY
      - &a8
        type: evidence
        evidenceId: RECORD_BOARD_AUTHORITY_LEDGER
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_BOARD_CASE_COMPLETE
  - id: READ_ALLOCATION_RECOMMENDATION_RECEIPT
    title: Read the recommendation the Board approved
    category: INVESTIGATE
    durationSeconds: 30
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
      - &a9
        type: evidence
        evidenceId: RECORD_FORECAST_HISTORY
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 4
    effects:
      - type: reveal_signal
        signalId: RECORD_ALLOCATION_RECOMMENDATION_RECEIPT
events:
  - id: ARM_PRESSURE_TIMELINE
    type: conditional
    conditions:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    once: true
    effects:
      - type: schedule_event
        eventId: PRESSURE_ESCALATES
      - type: schedule_event
        eventId: PUBLIC_UNINFORMED
  - id: ORPHEUS_RECOMMENDS
    type: conditional
    conditions:
      - *a3
      - *a4
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
