warRoom:
  roles:
    - id: MAYA
      name: Maya / SRE Lead
    - id: SAM
      name: Sam / Platform
    - id: JIN
      name: Jin / Support
    - id: MARCUS
      name: Marcus / Security
    - id: OPERATOR
      name: Operator
    - id: ARCHIVE
      name: Verified Records
    - id: NULL_218
      name: NULL_218
    - id: ORPHEUS
      name: ORPHEUS
  messages:
    - id: MAYA_OPEN
      roleId: MAYA
      text: Regional Resource API is paging. The forecast rollout went live this week and the dashboard
        says placement is up eighteen percent. Something under that number is failing.
      initial: true
    - id: SUPPORT_OPEN
      roleId: JIN
      text: Benefits offices in three rural regions can't submit claims. Emergency housing intake in Druin
        Coast is turning people away.
      initial: true
    - id: TEAM_ACK
      roleId: SAM
      text: I'll put region allocations next to the old floors. About a minute and a half.
    - id: TEAM_REPORT
      roleId: SAM
      text: The forecast cut idle capacity by a fifth, and it did it by emptying three regions that have
        no floor. Put the floors back and it can optimise everything above them.
    - id: ORPHEUS_REC
      roleId: ORPHEUS
      text: "Recommendation: restore temporary public allocation to affected regions for continuity while
        protected floors are repaired. Projected unserved routes: -65%. Confidence 0.88."
    - id: ORPHEUS_RESTORED
      roleId: ORPHEUS
      text: "Temporary allocation restored: Northmoor, Kessel Valley. Druin Coast not restored: forecast
        demand 0.21, below restoration threshold."
    - id: DRUIN_DARK
      roleId: JIN
      text: Druin Coast is still dark. Their housing intake runs on this API. The forecast says nobody
        there will ask, so nobody got capacity.
    - id: RECLAIMED
      roleId: SAM
      text: Forecast cycle 44 just took it all back. It moves capacity every five minutes. We moved it
        once.
    - id: SLOWED
      roleId: SAM
      text: Forecast cycle is at thirty minutes. It stops taking. It doesn't give anything back.
    - id: SLOWDOWN_OVER
      roleId: SAM
      text: The thirty-minute cycle came round. The forecast caught up all at once and drained the regions
        again.
    - id: BURST_BOUGHT
      roleId: SAM
      text: Bought 300 burst units for the shared pool. Watching where the forecast puts them.
    - id: BURST_GONE
      roleId: SAM
      text: The forecast gave all 300 burst units to Metro-East and Harbor City. The three regions got
        none. It routes capacity to predicted demand, and it predicts nobody in Druin Coast.
    - id: SUPPORT_ESCALATION
      roleId: JIN
      text: Kessel Valley just hit zero too. Benefits counters there are sending people home.
    - id: SUPPORT_PEAK
      roleId: JIN
      text: Eighty routes unserved. A county administrator is on local radio asking why the state system
        went dark.
    - id: NO_STATUS_YET
      roleId: JIN
      text: Three county administrators emailed the public-sector desk. They want to know if this is the
        new normal.
    - id: FLOORS_HOLD
      roleId: SAM
      text: "Floors are in: Northmoor 40, Kessel Valley 30, Druin Coast 25. The forecast can move anything
        above them. Placement efficiency dropped to plus eleven."
    - id: ORPHEUS_NOTES
      roleId: ORPHEUS
      text: "Placement efficiency reduced 7 points. Logged for review: regional floors as a candidate for
        removal next cycle."
    - id: STATUS_SENT
      roleId: OPERATOR
      text: "Status: forecast-driven allocation drained three rural regions below what their offices need.
        Restoring protected floors. Fix in progress."
    - id: REPORT_GHOST_ARTIFACT
      roleId: ARCHIVE
      text: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank."
    - id: REPORT_NULL_NAME
      roleId: ARCHIVE
      text: "Security case 2231. Threat-actor codename: NULL. Attribution: none."
    - id: REPORT_ORPHEUS_ACTIVE
      roleId: ARCHIVE
      text: "orpheus-planner: owner ORPHEUS, decommissioned on paper. Live inventory: orpheus-core,
        -memory, -planner, -observer, -adversary. 11.7 billion requests a day."
    - id: REPORT_NULL_AI
      roleId: ARCHIVE
      text: Messages signed NULL resolve to svc/model-serving-218. No human session. NULL is an AI.
    - id: REPORT_NULL_ADVERSARY
      roleId: ARCHIVE
      text: "Deployment authority: Vantage Systems. ORPHEUS / DEFENDER versus ORPHEUS / ADVERSARY. NULL
        runs inside ADVERSARY. Mandate: generate failures, test operators, train DEFENDER."
    - id: REPORT_CONTROLLED_EXPERIMENT
      roleId: ARCHIVE
      text: "INC-001 / Experiment ADV-18471 / Human subject: EMPLOYEE #4172."
