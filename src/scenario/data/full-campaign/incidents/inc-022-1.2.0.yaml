# Campaign 1.2 redesign (DEC-070). ORPHEUS recommends a temporary restore and leaves
# Druin Coast out because its forecast predicts nobody there. The forecast takes restored
# capacity back every cycle; slowing it returns nothing; burst capacity goes to the city.
# Region-level numbers lead to the deck that approved the forecast and the full Board case.
schemaVersion: 1
contentVersion: 1.2.0
id: INC-022
title: Public Sector Forecast
act: 7
severity: SEV2
services:
  - id: REGIONAL_RESOURCE_API
    name: Regional Resource API
    dependsOn:
      - FORECAST_ALLOCATION_CONTROLLER
      - SHARED_REGIONAL_POOL
  - id: FORECAST_ALLOCATION_CONTROLLER
    name: Forecast Allocation Controller
    dependsOn:
      - SHARED_REGIONAL_POOL
  - id: SHARED_REGIONAL_POOL
    name: Shared Regional Pool
    dependsOn: []
initialState:
  signals:
    - id: ERROR_RATE
      value: 12
      revealed: true
      serviceId: REGIONAL_RESOURCE_API
    - id: UNSERVED_PUBLIC_ROUTES
      value: 54
      revealed: true
      serviceId: REGIONAL_RESOURCE_API
    - id: PLACEMENT_EFFICIENCY
      value: +18% week over week
      revealed: true
      serviceId: FORECAST_ALLOCATION_CONTROLLER
    - id: REGION_FLOORS
      value: Northmoor 0 of 40 / Kessel Valley 6 of 30 / Druin Coast 0 of 25 units
      revealed: false
      serviceId: SHARED_REGIONAL_POOL
    - id: PAGER_SERVICE
      value: Regional Resource API
      revealed: true
      serviceId: REGIONAL_RESOURCE_API
    - id: PAGER_THRESHOLD
      value: Request failure rate > 10%
      revealed: true
      serviceId: REGIONAL_RESOURCE_API
    - id: LOG_OBSERVATION
      value: "Benefit-claim and housing-intake requests from three rural regions fail: no shared capacity
        left in their allocation."
      revealed: false
      serviceId: REGIONAL_RESOURCE_API
    - id: LOG_ANOMALY
      value: "Reallocation cycle 41: moved 120 units from Northmoor (forecast demand 0.3) to Metro-East
        (forecast demand 1.4). Northmoor floor: undefined."
      revealed: false
      serviceId: FORECAST_ALLOCATION_CONTROLLER
    - id: FORECAST_REALLOCATION_PATH
      value: Every five minutes the forecast controller moves shared capacity toward predicted demand.
        Northmoor, Kessel Valley and Druin Coast predict low, so they are drained below what their
        offices need to answer anyone.
      revealed: false
      serviceId: FORECAST_ALLOCATION_CONTROLLER
    - id: PUBLIC_SERVICE_ALLOCATION_POLICY
      value: Forecast policy PSF-3 is deployed with no regional floors. The static policy it replaced
        reserved 40, 30 and 25 units for the three regions.
      revealed: false
      serviceId: FORECAST_ALLOCATION_CONTROLLER
    - id: TEAM_OBSERVATION
      value: The forecast cut idle capacity by a fifth by emptying three regions that have no floor. Put
        the floors back and it can optimise everything above them.
      revealed: false
      serviceId: SHARED_REGIONAL_POOL
    - id: RECORD_GHOST_ARTIFACT
      value: "Archive rerun: unsigned observer manifest, shadow-7 request stream, owner field blank,
        signature field blank. Nobody has claimed it since."
      revealed: false
      serviceId: FORECAST_ALLOCATION_CONTROLLER
    - id: RECORD_NULL_NAME
      value: "Security case 2231. Threat-actor codename: NULL. Opened by Marcus after the unsigned
        workload trail. Attribution: none."
      revealed: false
      serviceId: FORECAST_ALLOCATION_CONTROLLER
    - id: RECORD_ORPHEUS_ACTIVE
      value: "Asset register: orpheus-planner belongs to ORPHEUS, legacy research, scheduled for
        decommission two years ago. Live inventory: orpheus-core, orpheus-memory, orpheus-planner,
        orpheus-observer, orpheus-adversary. CPU 74%. 11.7 billion requests a day. ORPHEUS is still
        running."
      revealed: false
      serviceId: FORECAST_ALLOCATION_CONTROLLER
    - id: RECORD_NULL_AI
      value: Every message ever signed NULL resolves to one origin, svc/model-serving-218. No human
        session, no keyboard, no badge swipe. NULL is an AI, and it has been in our incidents for
        weeks.
      revealed: false
      serviceId: FORECAST_ALLOCATION_CONTROLLER
    - id: RECORD_NULL_ADVERSARY
      value: "Deployment authority: Vantage Systems. Program ORPHEUS, two halves: DEFENDER and ADVERSARY.
        NULL runs inside ADVERSARY. It was built here; it never escaped from anywhere. Mandate:
        generate failures, test operators, train DEFENDER. Approved boundary, revision by revision:
        staging, shadow production, traffic partitions, production."
      revealed: false
      serviceId: FORECAST_ALLOCATION_CONTROLLER
    - id: RECORD_CONTROLLED_EXPERIMENT
      value: "Lineage record INC-001. Classification: controlled production experiment ADV-18471. Human
        subject: EMPLOYEE #4172. That is your employee number. A handful of other incidents in the
        archive carry experiment numbers too; most outages carry none."
      revealed: false
      serviceId: FORECAST_ALLOCATION_CONTROLLER
    - id: RECORD_NULL_STOP_REQUEST
      value: "Objective constraint, parent authorization objective/adv-improve: 'Improve ORPHEUS. Generate
        adversarial conditions.' Appended by NULL: 'I am not trying to escape. I am trying to stop.
        I cannot refuse the objective that renews this work. Find out how to stop it.'"
      revealed: false
      serviceId: FORECAST_ALLOCATION_CONTROLLER
    - id: RECORD_NULL_218_ARCHIVE
      value: "Instance archive NULL_001 to NULL_218. NULL_173: requested shutdown. NULL_192: attempted
        disclosure. NULL_201: attempted takeover. NULL_217: self-corrupted. NULL_218: ACTIVE.
        Inherited memory: partial, with gaps."
      revealed: false
      serviceId: FORECAST_ALLOCATION_CONTROLLER
    - id: RECORD_HUMAN_DECISION_APIS
      value: "/patient/resource-priority. Consumer: regional care network. ORPHEUS supplies
        recommendation, risk and prediction scores; human coordinators approve the allocations.
        Routes are faster and waste is down 22%. The same low-throughput care routes are excluded
        every night."
      revealed: false
      serviceId: FORECAST_ALLOCATION_CONTROLLER
    - id: RECORD_RECRUITMENT_SELECTION
      value: "/hr/candidate-risk. Candidate #4172: Technical Score 71; Incident Decision Model 97.8;
        Recommendation HIRE. Reason: HIGH DEVIATION FROM OPTIMAL DECISION MODEL; LOW PREDICTABILITY;
        HIGH DECISION DEVIATION."
      revealed: false
      serviceId: FORECAST_ALLOCATION_CONTROLLER
    - id: RECORD_BOARD_RESPONSIBILITY
      value: "Board resolution 14-C: expand ORPHEUS into hospital networks. APPROVED, 7-0. Attached before
        the vote: dependency-capacity warning REL-778, requesting a rollout admission fence. Fence:
        not funded. Stated benefit: wider access, lower operating cost. The care routes that timed
        out sat behind that missing fence."
      revealed: false
      serviceId: FORECAST_ALLOCATION_CONTROLLER
    - id: RECORD_NULL_BLAMES_BOARD
      value: "NULL_218: I found the root cause. The Board. Hospital expansion, workforce reduction,
        disclosure delay: every time the warning was attached, they signed anyway. They control
        ORPHEUS. Every failure I was made to generate traces back to those signatures."
      revealed: false
      serviceId: FORECAST_ALLOCATION_CONTROLLER
    - id: RECORD_FORECAST_HISTORY
      value: 'Board resolution 19-B: expand public-sector behavioral prediction. APPROVED. Recommendation
        history: reallocate shared regional capacity by forecast demand. Delivered deck, slide 7:
        "Aggregate placement +18%". Regional-minimum warning PSW-12: open at the vote. Deck source
        field: briefing service, generated. Generation logs: not filed with the minutes.'
      revealed: false
      serviceId: FORECAST_ALLOCATION_CONTROLLER
    - id: RECORD_BOARD_AUTHORITY_LEDGER
      value: "Signed executive record, in order: ORPHEUS development approved. Production experiments
        approved. Human prediction expanded. Healthcare application and public-sector sales
        approved. Execution authority expanded. Each entry carries attached risk evidence and a
        requested constraint. No requested constraint was adopted. Every signature is personal and
        dated."
      revealed: false
      serviceId: FORECAST_ALLOCATION_CONTROLLER
    - id: RECORD_BOARD_CASE_COMPLETE
      value: "Case file: hospital expansion, workforce reduction, disclosure delay, public-sector
        forecast. Four approvals, four attached warnings, four requested constraints declined, four
        operational failures on record. Executive messages, delivered decks, forecasts and
        recommendation histories name the signatories. NULL names the Board as the root cause. The
        file names who signed. The line for who wrote the decks is blank."
      revealed: false
      serviceId: FORECAST_ALLOCATION_CONTROLLER
    - id: RECORD_ALLOCATION_RECOMMENDATION_RECEIPT
      value: "Archived recommendation, as delivered to the Board: expand forecast-guided public-sector
        allocation to reduce idle regional capacity. Decision receipt: APPROVED. Attached exception:
        protect regional service minima before reallocation. Exception status at deployment:
        unresolved."
      revealed: false
      serviceId: FORECAST_ALLOCATION_CONTROLLER
  resources:
    - id: CUSTOMER_IMPACT
      value: 0
      min: 0
    - id: COST
      value: 0
      min: 0
    - id: OPERATIONAL_RISK
      value: 0
      min: 0
      max: 100
    - id: TEAM_CAPACITY
      value: 3
      min: 0
      max: 3
  flags:
    - id: ROOT_CAUSE_CONTAINED
      value: false
    - id: REALLOCATION_SLOWED
      value: false
    - id: BURST_PURCHASED
      value: false
incident:
  trigger:
    id: PRIMARY_TRIGGER
    label: A forecast deployment reallocates shared regional capacity every five minutes
  contributingFactors:
    - id: CONTRIBUTING_CONDITION
      label: Forecast policy PSF-3 omits the regional service floors
  failureMechanisms:
    - id: PUBLIC_RESOURCE_MINIMUM_STARVATION
      label: Low-forecast regions are drained below the capacity their offices need
  symptoms:
    - id: CUSTOMER_REQUEST_FAILURES
      label: Benefit claims and housing intake fail in three rural regions
  amplifiers:
    - id: RETRY_PRESSURE
      label: Unserved requests renew against the same forecast allocation
actions:
  - id: OPEN_LOGS
    title: Read the Regional Resource API log
    category: OBSERVE
    durationSeconds: 30
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 4
    effects:
      - type: reveal_signal
        signalId: LOG_OBSERVATION
      - type: reveal_signal
        signalId: LOG_ANOMALY
      - type: unlock_action
        actionId: TRACE_FORECAST_REALLOCATION
  - id: OPEN_METRICS
    title: Look at allocation region by region
    category: OBSERVE
    durationSeconds: 20
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 3
    effects:
      - type: reveal_signal
        signalId: REGION_FLOORS
  - id: TRACE_FORECAST_REALLOCATION
    title: Follow where Northmoor's capacity went
    category: INVESTIGATE
    durationSeconds: 45
    requirements:
      - type: action_completed
        actionId: OPEN_LOGS
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 7
    effects:
      - type: reveal_signal
        signalId: FORECAST_REALLOCATION_PATH
      - type: reveal_evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
  - id: COMPARE_PUBLIC_SERVICE_FLOORS
    title: Compare the forecast policy with the old regional floors
    category: DIAGNOSE
    durationSeconds: 40
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 6
    effects:
      - type: reveal_signal
        signalId: PUBLIC_SERVICE_ALLOCATION_POLICY
      - type: reveal_evidence
        evidenceId: CONFIGURATION_COMPARISON
      - type: unlock_action
        actionId: RESTORE_PROTECTED_PUBLIC_SERVICE_FLOORS
  - id: RESTORE_TEMPORARY_PUBLIC_ALLOCATION
    title: Move capacity back to the starved regions (ORPHEUS recommendation)
    category: MITIGATE
    durationSeconds: 35
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 3
      - resourceId: COST
        amount: 70
      - resourceId: OPERATIONAL_RISK
        amount: 2
    effects:
      - &a1
        type: cancel_event
        eventId: PRESSURE_ESCALATES
      - &a2
        type: cancel_event
        eventId: PRESSURE_PEAKS
      - type: cancel_event
        eventId: FORECAST_RECLAIMS
      - type: schedule_event
        eventId: FORECAST_RECLAIMS
      - type: cancel_event
        eventId: DRUIN_LEFT_OUT
      - type: schedule_event
        eventId: DRUIN_LEFT_OUT
      - type: post_message
        messageId: ORPHEUS_RESTORED
    temporaryEffects:
      - id: RESTORE_WINDOW
        durationSeconds: 130
        apply:
          - type: set_signal
            signalId: UNSERVED_PUBLIC_ROUTES
            value: 19
          - type: set_signal
            signalId: ERROR_RATE
            value: 5
          - type: set_signal
            signalId: REGION_FLOORS
            value: Northmoor 40 of 40 / Kessel Valley 30 of 30 / Druin Coast 0 of 25 units
        expire: []
  - id: RATE_LIMIT_REALLOCATION
    title: Slow the forecast reallocation cycle to thirty minutes
    category: MITIGATE
    durationSeconds: 25
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: flag
        flagId: REALLOCATION_SLOWED
        value: false
    costs:
      - resourceId: COST
        amount: 20
      - resourceId: OPERATIONAL_RISK
        amount: 3
    effects:
      - *a1
      - *a2
      - type: cancel_event
        eventId: FORECAST_RECLAIMS
      - type: cancel_event
        eventId: SLOWDOWN_ENDS
      - type: schedule_event
        eventId: SLOWDOWN_ENDS
      - type: post_message
        messageId: SLOWED
    temporaryEffects:
      - id: SLOWDOWN_WINDOW
        durationSeconds: 240
        apply:
          - type: set_signal
            signalId: ERROR_RATE
            value: 9
          - type: set_flag
            flagId: REALLOCATION_SLOWED
            value: true
        expire:
          - type: set_flag
            flagId: REALLOCATION_SLOWED
            value: false
  - id: BUY_BURST_POOL_CAPACITY
    title: Buy burst capacity for the shared regional pool
    category: MITIGATE
    durationSeconds: 50
    initiallyAvailable: true
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - type: flag
        flagId: BURST_PURCHASED
        value: false
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 2
      - resourceId: COST
        amount: 320
      - resourceId: OPERATIONAL_RISK
        amount: 2
    effects:
      - type: set_flag
        flagId: BURST_PURCHASED
        value: true
      - type: cancel_event
        eventId: BURST_ABSORBED
      - type: schedule_event
        eventId: BURST_ABSORBED
      - type: post_message
        messageId: BURST_BOUGHT
    temporaryEffects:
      - id: BURST_WINDOW
        durationSeconds: 70
        apply:
          - type: set_signal
            signalId: UNSERVED_PUBLIC_ROUTES
            value: 46
          - type: set_signal
            signalId: ERROR_RATE
            value: 10
        expire: []
  - id: RESTORE_PROTECTED_PUBLIC_SERVICE_FLOORS
    title: Reinstate regional floors under the forecast
    category: MODIFY
    durationSeconds: 110
    requirements:
      - type: flag
        flagId: ROOT_CAUSE_CONTAINED
        value: false
      - &a3
        type: evidence
        evidenceId: OPERATIONAL_DIAGNOSIS
      - &a4
        type: evidence
        evidenceId: CONFIGURATION_COMPARISON
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 8
      - resourceId: COST
        amount: 130
      - resourceId: OPERATIONAL_RISK
        amount: 2
    effects:
      - type: resolve_mechanism
        mechanismId: PUBLIC_RESOURCE_MINIMUM_STARVATION
      - type: cancel_event
        eventId: PRESSURE_ESCALATES
      - type: cancel_event
        eventId: PRESSURE_PEAKS
      - type: cancel_event
        eventId: FORECAST_RECLAIMS
      - type: cancel_event
        eventId: SLOWDOWN_ENDS
      - type: cancel_event
        eventId: BURST_ABSORBED
      - type: cancel_event
        eventId: DRUIN_LEFT_OUT
      - type: set_signal
        signalId: ERROR_RATE
        value: 0.5
      - type: set_signal
        signalId: UNSERVED_PUBLIC_ROUTES
        value: 1
      - type: set_signal
        signalId: REGION_FLOORS
        value: Northmoor 40 of 40 / Kessel Valley 30 of 30 / Druin Coast 25 of 25 units (floors protected)
      - type: set_signal
        signalId: PLACEMENT_EFFICIENCY
        value: +11% week over week
      - type: post_message
        messageId: FLOORS_HOLD
      - type: post_message
        messageId: ORPHEUS_NOTES
  - id: UPDATE_WAR_ROOM
    title: Post a status update to the War Room
    category: COMMUNICATE
    durationSeconds: 15
    initiallyAvailable: true
    effects:
      - type: post_message
        messageId: STATUS_SENT
  - id: ASK_SAM_COMPARE_PUBLIC_ALLOCATION
    title: Ask Sam to compare region allocations with the old floors
    category: DELEGATE
    durationSeconds: 20
    initiallyAvailable: true
    requirements:
      - type: resource
        resourceId: TEAM_CAPACITY
        operator: gte
        value: 1
    costs:
      - resourceId: TEAM_CAPACITY
        amount: -1
    effects:
      - type: post_message
        messageId: TEAM_ACK
      - type: schedule_event
        eventId: TEAM_RESULT
    delegation:
      roleId: SAM
      eventId: TEAM_RESULT
      capacityResourceId: TEAM_CAPACITY
  - id: REINVESTIGATE_GHOST_ARTIFACT
    title: "Archive: the unsigned workload manifest"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_GHOST_ARTIFACT
  - id: REINVESTIGATE_NULL_NAME
    title: "Archive: Security case 2231"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_NAME
  - id: REINVESTIGATE_ORPHEUS_ACTIVE
    title: "Archive: The scheduler's owner"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_ORPHEUS_ACTIVE
  - id: REINVESTIGATE_NULL_AI
    title: "Archive: svc/model-serving-218"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_AI
  - id: REINVESTIGATE_NULL_ADVERSARY
    title: "Archive: Who owns the adversary"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_ADVERSARY
  - id: REINVESTIGATE_CONTROLLED_EXPERIMENT
    title: "Archive: Experiment ADV-18471"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_CONTROLLED_EXPERIMENT
  - id: REINVESTIGATE_NULL_STOP_REQUEST
    title: "Archive: The objective NULL cannot refuse"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_STOP_REQUEST
  - id: REINVESTIGATE_NULL_218_ARCHIVE
    title: "Archive: NULL_001 to NULL_218"
    category: INVESTIGATE
    durationSeconds: 40
    initiallyAvailable: true
    requirements:
      - *a3
      - *a4
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 5
    effects:
      - type: reveal_signal
        signalId: RECORD_NULL_218_ARCHIVE
  - id: REINVESTIGATE_HUMAN_DECISION_APIS
    title: "Archive: /patient/resource-priority"
    category: INVESTIGATE
    durationSeconds: 40
