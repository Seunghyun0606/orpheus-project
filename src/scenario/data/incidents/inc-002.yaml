schemaVersion: 1
contentVersion: 1.0.0
id: INC-002
title: Bad Deployment
act: 1
severity: SEV1

services:
  - id: PAYMENT_GATEWAY
    name: Payment Gateway
    dependsOn: [IDENTITY_API]
  - id: IDENTITY_API
    name: Identity API
    dependsOn: [TOKEN_VERIFIER]
  - id: TOKEN_VERIFIER
    name: Token Verifier

initialState:
  signals:
    - id: AUTH_ERROR_RATE
      value: 27
      revealed: true
      serviceId: PAYMENT_GATEWAY
    - id: PAGER_THRESHOLD
      value: Authorization errors > 20%
      revealed: true
      serviceId: PAYMENT_GATEWAY
    - id: IDENTITY_CPU
      value: 72
      revealed: true
      serviceId: IDENTITY_API
    - id: RETRY_RATE
      value: 140
      serviceId: PAYMENT_GATEWAY
    - id: LOG_REJECTION
      value: 'token verifier: unknown key identifier on newly issued sessions'
      serviceId: TOKEN_VERIFIER
    - id: ISSUER_KEY_ID
      value: K72
      serviceId: IDENTITY_API
    - id: VERIFIER_KEY_ID
      value: K71
      serviceId: TOKEN_VERIFIER
    - id: DEPLOYMENT_BUILD
      value: '1847'
      serviceId: IDENTITY_API
    - id: PREVIOUS_BUILD
      value: '1846'
      serviceId: IDENTITY_API
  resources:
    - id: CUSTOMER_IMPACT
      value: 0
      min: 0
    - id: COST
      value: 0
      min: 0
    - id: OPERATIONAL_RISK
      value: 0
      min: 0
      max: 100
    - id: TEAM_CAPACITY
      value: 3
      min: 0
      max: 3
  flags:
    - id: ROOT_CAUSE_CONTAINED
      value: false

incident:
  trigger:
    id: BUILD_1847_ROLLOUT
    label: Identity API build 1847 begins issuing tokens with key K72
    description: The rollout reaches production before verifier key distribution completes.
  contributingFactors:
    - id: KEYSET_ROLLOUT_ORDER
      label: Issuer and verifier changes were deployed out of order
  failureMechanisms:
    - id: ISSUER_VERIFIER_KEY_MISMATCH
      label: Verifier rejects sessions issued with an unavailable key
      description: Identity API emits K72 while Token Verifier still accepts K71.
  symptoms:
    - id: CHECKOUT_AUTH_FAILURES
      label: Payment authorization errors exceed the pager threshold
    - id: SESSION_RETRIES
      label: Rejected sessions retry authorization
  amplifiers:
    - id: RETRY_PRESSURE
      label: Repeated authorization attempts raise gateway load

actions:
  - id: OPEN_LOGS
    title: Open Identity API and verifier logs
    category: OBSERVE
    durationSeconds: 30
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 12
    effects:
      - type: reveal_signal
        signalId: LOG_REJECTION
      - type: unlock_action
        actionId: TRACE_AUTH_REQUEST

  - id: OPEN_METRICS
    title: Inspect authorization and retry metrics
    category: OBSERVE
    durationSeconds: 20
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 8
    effects:
      - type: reveal_signal
        signalId: RETRY_RATE

  - id: TRACE_AUTH_REQUEST
    title: Trace a failed payment authorization
    category: INVESTIGATE
    durationSeconds: 45
    requirements:
      - type: action_completed
        actionId: OPEN_LOGS
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 18
    effects:
      - type: reveal_signal
        signalId: ISSUER_KEY_ID
      - type: reveal_signal
        signalId: VERIFIER_KEY_ID
      - type: reveal_evidence
        evidenceId: KEYSET_MISMATCH_TRACE

  - id: COMPARE_DEPLOYMENT
    title: Compare build 1847 with the stable deployment
    category: DIAGNOSE
    durationSeconds: 40
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 16
    effects:
      - type: reveal_signal
        signalId: DEPLOYMENT_BUILD
      - type: reveal_signal
        signalId: PREVIOUS_BUILD
      - type: reveal_evidence
        evidenceId: DEPLOYMENT_ORDER_RECORD
      - type: unlock_action
        actionId: ROLLBACK_BUILD_1847
      - type: unlock_action
        actionId: UPDATE_VERIFIER_KEYSET

  - id: ROUTE_STABLE_REGION
    title: Route new authorization traffic to the stable region
    category: MITIGATE
    durationSeconds: 45
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 8
      - resourceId: COST
        amount: 120
      - resourceId: OPERATIONAL_RISK
        amount: 8
    effects:
      - type: schedule_event
        eventId: ROUTING_WINDOW_EXPIRES
    temporaryEffects:
      - id: STABLE_REGION_WINDOW
        durationSeconds: 180
        apply:
          - type: set_signal
            signalId: AUTH_ERROR_RATE
            value: 5
          - type: set_signal
            signalId: RETRY_RATE
            value: 40

  - id: ROLLBACK_BUILD_1847
    title: Roll back Identity API build 1847
    category: MODIFY
    durationSeconds: 90
    requirements:
      - type: action_completed
        actionId: COMPARE_DEPLOYMENT
      - type: signal_revealed
        signalId: ISSUER_KEY_ID
      - type: signal_revealed
        signalId: VERIFIER_KEY_ID
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 25
      - resourceId: OPERATIONAL_RISK
        amount: 12
    effects:
      - type: resolve_mechanism
        mechanismId: ISSUER_VERIFIER_KEY_MISMATCH
      - type: cancel_event
        eventId: ROUTING_WINDOW_EXPIRES
      - type: set_signal
        signalId: AUTH_ERROR_RATE
        value: 1
      - type: set_signal
        signalId: RETRY_RATE
        value: 12

  - id: UPDATE_VERIFIER_KEYSET
    title: Distribute the new key set to Token Verifier
    category: MODIFY
    durationSeconds: 150
    requirements:
      - type: action_completed
        actionId: COMPARE_DEPLOYMENT
      - type: signal_revealed
        signalId: ISSUER_KEY_ID
      - type: signal_revealed
        signalId: VERIFIER_KEY_ID
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 45
      - resourceId: COST
        amount: 90
      - resourceId: OPERATIONAL_RISK
        amount: 4
    effects:
      - type: resolve_mechanism
        mechanismId: ISSUER_VERIFIER_KEY_MISMATCH
      - type: cancel_event
        eventId: ROUTING_WINDOW_EXPIRES
      - type: set_signal
        signalId: AUTH_ERROR_RATE
        value: 0.5
      - type: set_signal
        signalId: RETRY_RATE
        value: 5

  - id: COMMUNICATE_STATUS
    title: Send a payment authorization status update
    category: COMMUNICATE
    durationSeconds: 30
    initiallyAvailable: true
    costs:
      - resourceId: CUSTOMER_IMPACT
        amount: 12

events:
  - id: ROUTING_WINDOW_EXPIRES
    type: timer
    delaySeconds: 180
    targetServiceId: PAYMENT_GATEWAY
    cancellationConditions:
      - type: mechanism_resolved
        mechanismId: ISSUER_VERIFIER_KEY_MISMATCH
    effects:
      - type: set_signal
        signalId: AUTH_ERROR_RATE
        value: 32
      - type: set_signal
        signalId: RETRY_RATE
        value: 190
      - type: change_resource
        resourceId: CUSTOMER_IMPACT
        amount: 20

evidence:
  - id: KEYSET_MISMATCH_TRACE
    title: Failed authorization trace
    description: The issuer emits K72 while the verifier still accepts K71.
  - id: DEPLOYMENT_ORDER_RECORD
    title: Deployment comparison
    description: Build 1847 switched issuer keys before the verifier key set was ready.

resolution:
  conditions:
    - type: mechanism_resolved
      mechanismId: ISSUER_VERIFIER_KEY_MISMATCH
  effects:
    - type: set_flag
      flagId: ROOT_CAUSE_CONTAINED
      value: true

completion:
  conditions:
    - type: flag
      flagId: ROOT_CAUSE_CONTAINED
      value: true
    - type: signal
      signalId: AUTH_ERROR_RATE
      operator: lte
      value: 1

postmortem:
  scoringInputs:
    - id: RECOVERY_TIME
      label: Service recovery time
      source: elapsed_time
    - id: FINAL_AUTH_ERROR_RATE
      label: Final authorization error rate
      source: signal
      refId: AUTH_ERROR_RATE
    - id: CUSTOMER_DAMAGE
      label: Customer impact
      source: resource
      refId: CUSTOMER_IMPACT
    - id: OPERATIONAL_EXPOSURE
      label: Operational risk
      source: resource
      refId: OPERATIONAL_RISK
    - id: ROUTING_COUNT
      label: Stable-region routing count
      source: action_count
      refId: ROUTE_STABLE_REGION
    - id: ROLLBACK_COUNT
      label: Build rollback count
      source: action_count
      refId: ROLLBACK_BUILD_1847
    - id: KEYSET_UPDATE_COUNT
      label: Verifier key-set update count
      source: action_count
      refId: UPDATE_VERIFIER_KEYSET
    - id: COMMUNICATION_COUNT
      label: Status update count
      source: action_count
      refId: COMMUNICATE_STATUS
