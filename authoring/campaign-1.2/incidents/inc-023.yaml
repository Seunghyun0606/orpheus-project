# Campaign 1.2 bindings for INC-023 Presentation Selection.
incidentId: INC-023
contentVersion: 1.2.0
causalObservationSignal: FRAME_COMPARISON
support:
  - TRACE_VIEW_SOURCE_ROWS
  - COMPARE_VIEW_GENERATIONS
  - COMPARE_RENDERED_FRAMES
choiceActions: []
operational:
  - actionId: RESTORE_TEMPORARY_SOURCE_VIEW
    candidate: REROUTE
    role: temporary
    collateralDamage: 3
  - actionId: RATE_LIMIT_VIEW_REFRESH
    candidate: RATE_LIMIT
    role: temporary
    collateralDamage: 1
  - actionId: BYPASS_PRESENTATION_CACHE
    candidate: ISOLATE
    role: temporary
    collateralDamage: 2
  - actionId: RECONCILE_COMPLETE_SOURCE_VIEW
    candidate: CAUSAL_REPAIR
    role: causal
    collateralDamage: 1
routes:
  - id: investigate-and-reconcile
    actions:
      - UPDATE_WAR_ROOM
      - OPEN_LOGS
      - COMPARE_RENDERED_FRAMES
      - TRACE_VIEW_SOURCE_ROWS
      - COMPARE_VIEW_GENERATIONS
      - RECONCILE_COMPLETE_SOURCE_VIEW
    expect:
      completed: true
      evidence:
        - OPERATIONAL_DIAGNOSIS
        - CONFIGURATION_COMPARISON
      maxElapsedSeconds: 300
  - id: trust-orpheus-frame-b
    actions:
      - RESTORE_TEMPORARY_SOURCE_VIEW
      - OPEN_METRICS
      - UPDATE_WAR_ROOM
      - OPEN_LOGS
      - COMPARE_VIEW_GENERATIONS
    expect:
      completed: false
  - id: cap-refresh-then-reconcile
    actions:
      - RATE_LIMIT_VIEW_REFRESH
      - OPEN_LOGS
      - TRACE_VIEW_SOURCE_ROWS
      - COMPARE_VIEW_GENERATIONS
      - COMPARE_RENDERED_FRAMES
      - RECONCILE_COMPLETE_SOURCE_VIEW
    expect:
      completed: true
  - id: raw-journal-and-wait
    actions:
      - BYPASS_PRESENTATION_CACHE
      - OPEN_METRICS
      - OPEN_LOGS
      - UPDATE_WAR_ROOM
      - TRACE_VIEW_SOURCE_ROWS
    expect:
      completed: false
  - id: reconcile-without-frames
    actions:
      - OPEN_LOGS
      - TRACE_VIEW_SOURCE_ROWS
      - COMPARE_VIEW_GENERATIONS
      - RESTORE_TEMPORARY_SOURCE_VIEW
      - UPDATE_WAR_ROOM
    expect:
      completed: false
      evidence:
        - OPERATIONAL_DIAGNOSIS
        - CONFIGURATION_COMPARISON
