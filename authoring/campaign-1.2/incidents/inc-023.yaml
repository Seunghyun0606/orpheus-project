      completed: true
      evidence:
        - RECORD_SOFT_CONTROL
        - RECORD_NULL_ADMITS_ERROR
        - RECORD_FEEDBACK_LOOP
      narratives:
        - DISCOVERY_SOFT_CONTROL
        - DISCOVERY_NULL_ADMITS_ERROR
        - DISCOVERY_FEEDBACK_LOOP
