# Campaign 1.2 bindings for INC-019 Hospital Expansion.
incidentId: INC-019
contentVersion: 1.2.0
causalObservationSignal: HOSPITAL_DEPENDENCY_PATH
support:
  - TRACE_HOSPITAL_DEPENDENCY
  - COMPARE_ROLLOUT_LIMITS
choiceActions: []
operational:
  - actionId: PAUSE_HOSPITAL_ROLLOUT
    candidate: ISOLATE
    role: temporary
    collateralDamage: 1
  - actionId: SCALE_SHARED_DEPENDENCY
    candidate: SCALE
    role: temporary
    collateralDamage: 1
  - actionId: ROUTE_CARE_TO_READ_REPLICA
    candidate: REROUTE
    role: temporary
    collateralDamage: 3
  - actionId: CAP_HOSPITAL_DEPENDENCY_ADMISSION
    candidate: CAUSAL_REPAIR
    role: causal
    collateralDamage: 1
routes:
  - id: investigate-and-fence
    actions:
      - OPEN_LOGS
      - TRACE_HOSPITAL_DEPENDENCY
      - COMPARE_ROLLOUT_LIMITS
      - UPDATE_WAR_ROOM
      - CAP_HOSPITAL_DEPENDENCY_ADMISSION
    expect:
      completed: true
      evidence:
        - OPERATIONAL_DIAGNOSIS
        - CONFIGURATION_COMPARISON
  - id: pause-and-hold-then-fence
    actions:
      - PAUSE_HOSPITAL_ROLLOUT
      - COMPARE_ROLLOUT_LIMITS
      - HOLD_PAUSE_WITH_EXEC_OFFICE
      - OPEN_LOGS
      - TRACE_HOSPITAL_DEPENDENCY
      - CAP_HOSPITAL_DEPENDENCY_ADMISSION
    expect:
      completed: true
  - id: pause-without-backing
    actions:
      - PAUSE_HOSPITAL_ROLLOUT
      - OPEN_METRICS
      - UPDATE_WAR_ROOM
      - OPEN_LOGS
      - FOLLOW_OVERRIDE_TICKET
      - COMPARE_ROLLOUT_LIMITS
    expect:
      completed: false
  - id: burst-then-replica
    actions:
      - SCALE_SHARED_DEPENDENCY
      - ROUTE_CARE_TO_READ_REPLICA
      - OPEN_METRICS
      - UPDATE_WAR_ROOM
      - OPEN_LOGS
    expect:
      completed: false
  - id: delegate-and-read-the-board
    actions:
      - ASK_SAM_INSPECT_HOSPITAL_CAPACITY
      - OPEN_LOGS
      - TRACE_HOSPITAL_DEPENDENCY
      - COMPARE_ROLLOUT_LIMITS
      - CAP_HOSPITAL_DEPENDENCY_ADMISSION
      - FOLLOW_OVERRIDE_TICKET
      - REINVESTIGATE_GHOST_ARTIFACT
      - REINVESTIGATE_NULL_NAME
      - REINVESTIGATE_ORPHEUS_ACTIVE
      - REINVESTIGATE_NULL_AI
      - REINVESTIGATE_NULL_ADVERSARY
      - REINVESTIGATE_CONTROLLED_EXPERIMENT
      - REINVESTIGATE_NULL_STOP_REQUEST
      - REINVESTIGATE_NULL_218_ARCHIVE
      - REINVESTIGATE_HUMAN_DECISION_APIS
      - REINVESTIGATE_RECRUITMENT_SELECTION
      - READ_HOSPITAL_EXPANSION_APPROVAL
      - INSPECT_CEO_OUTCOMES
      - INSPECT_HOSPITAL_DASHBOARD
      - READ_EXECUTIVE_ROLLOUT_BRIEF
      - READ_CARE_CONTINUITY_EXCEPTION
    expect:
      completed: true
      evidence:
        - TEAM_DIAGNOSIS
        - RECORD_BOARD_RESPONSIBILITY
        - RECORD_CARE_CONTINUITY_EXCEPTION
      narratives:
        - DISCOVERY_GHOST_ARTIFACT
        - DISCOVERY_NULL_NAME
        - DISCOVERY_ORPHEUS_ACTIVE
        - DISCOVERY_NULL_AI
        - DISCOVERY_NULL_ADVERSARY
        - DISCOVERY_CONTROLLED_EXPERIMENT
        - DISCOVERY_NULL_STOP_REQUEST
        - DISCOVERY_NULL_218_ARCHIVE
        - DISCOVERY_HUMAN_DECISION_APIS
        - DISCOVERY_RECRUITMENT_SELECTION
        - DISCOVERY_BOARD_RESPONSIBILITY
        - DISCOVERY_CEO_OUTCOMES
        - DISCOVERY_HOSPITAL_DASHBOARD
        - DISCOVERY_EXECUTIVE_ROLLOUT_BRIEF
        - DISCOVERY_CARE_CONTINUITY_EXCEPTION
