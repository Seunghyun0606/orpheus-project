    - 'Map AI identity, ADVERSARY provenance, controlled experiments, shutdown request, NULL_218, recruitment, Board responsibility, SOFT CONTROL and observer/final reveals to prerequisites.'
    - 'Specify multiple Board investigation Incidents before the framing reveal, branch accessibility and gameplay/pacing coverage.'
    - 'Produce human approval requests for content allocation, required representation changes and production balance; distinguish approved requirements from proposals.'
  exclude:
    - 'Bypass future material-choice gates, independent acceptance, or mandatory M4 verification before final M5 acceptance/release.'
    - 'Assign new production IDs, ending thresholds or schema versions without approval.'

