id: TASK-025
title: "Verify campaign intelligence against M4 exit criteria"
role: developer
milestone: M4
priority: P0
status: ready

objective: "Produce independently checked evidence for every M4 exit criterion and compatibility promise."
why: "Framework implementation alone does not establish deterministic campaign behavior or preserved player progress."

scope:
  include:
    - "Map all M4 exit criteria to automated fixtures and observed integration/native evidence."
    - "Run full quality checks covering campaign transitions, save/migrations, player behavior, branches/predictions and all ten endings."
    - "Reverify the three-incident MVP, UNKNOWN-only boundary, supported display controls and save-slot protection."
    - "Request independent review, acceptance QA and evaluator handoffs, distinguishing future content work from tested framework readiness."
  exclude:
    - "Starting M5 or approving full-campaign/release scope implicitly."
    - "Overstating native, screen-reader/audio, migration or balance coverage."

depends_on:
  - "TASK-020"
  - "TASK-021"
  - "TASK-022"
  - "TASK-023"
  - "TASK-024"
specs:
  - "specs/feature/campaign-and-player-model.md"
  - "specs/architecture/system-architecture.md"
  - "specs/product/01-game-and-narrative-direction.md"
  - "docs/M4_IMPLEMENTATION_PLAN.md"
relevant_files:
  - "src/tests/"
  - "docs/"
  - "README.md"
  - ".project-os/tasks/results/"
active_decisions:
  - ".project-os/decisions/DEC-001-data-driven-headless-domain.yaml"
  - ".project-os/decisions/DEC-003-deterministic-local-first.yaml"
  - ".project-os/decisions/DEC-005-versioned-incident-save-migration.yaml"
  - ".project-os/decisions/DEC-006-separate-m3-campaign-progress.yaml"
  - ".project-os/decisions/DEC-007-single-incident-slot-confirmation.yaml"
  - ".project-os/decisions/DEC-008-m3-completion-m4-planning.yaml"

acceptance:
  - "Campaign state, flags, values, evidence, progression and model-version compatibility have deterministic persistence/replay evidence."
  - "Action-derived behavior and prediction/branch results are reproducible; every named ending has deterministic coverage."
  - "Current MVP remains playable and UNKNOWN-only, and no critical review finding remains."
  - "Each native/automated claim names its provenance and limitations; any material follow-on scope choice is referred to a human gate."
verification:
  - "Run build, lint, format:check, typecheck, full tests, replays, scenario validation, build:desktop, diff check and projectctl doctor."
  - "Perform native desktop inspection and publish separate implementation, test, independent review, QA and evaluation handoffs."

human_gate: false
risk: high
