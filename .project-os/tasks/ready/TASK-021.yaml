id: TASK-021
title: 'Derive versioned player behavior from accepted action history'
role: developer
milestone: M4
priority: P0
status: ready

objective: 'Compute the approved player behavior model deterministically from actual behavior and versioned authored classifications.'
why: 'Prediction and endings must reflect player behavior rather than arbitrary counters or choice-label shortcuts.'

scope:
  include:
    - 'Implement approved data-driven action classifications and versioned formulas for behavior metrics.'
    - 'Derive restart/rollback, evidence-before-action, investigation, reporting, safety and collaboration behavior where supported by recorded inputs.'
    - 'Represent missing recommendation/NULL interactions and insufficient samples according to the contract rather than inventing acceptance rates.'
    - 'Expose provenance and explanations to tests/tools without exposing hidden campaign values to players.'
  exclude:
    - 'Changing behavioral formulas or ethical weighting outside the reviewed contract.'
    - 'Hardcoded scenario identifiers, real ML/LLM services, and early ORPHEUS identity disclosure.'

