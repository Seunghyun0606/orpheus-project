id: TASK-021
title: "Derive versioned player behavior from accepted action history"
role: developer
milestone: M4
priority: P0
status: ready

objective: "Compute the approved player behavior model deterministically from actual behavior and versioned authored classifications."
why: "Prediction and endings must reflect player behavior rather than arbitrary counters or choice-label shortcuts."

scope:
  include:
    - "Implement approved data-driven action classifications and versioned formulas for behavior metrics."
    - "Derive restart/rollback, evidence-before-action, investigation, reporting, safety and collaboration behavior where supported by recorded inputs."
    - "Represent missing recommendation/NULL interactions and insufficient samples according to the contract rather than inventing acceptance rates."
    - "Expose provenance and explanations to tests/tools without exposing hidden campaign values to players."
  exclude:
    - "Changing behavioral formulas or ethical weighting outside the reviewed contract."
    - "Hardcoded scenario identifiers, real ML/LLM services, and early ORPHEUS identity disclosure."

depends_on:
  - "TASK-019"
specs:
  - "specs/feature/campaign-and-player-model.md"
  - "specs/architecture/system-architecture.md"
  - "specs/product/01-game-and-narrative-direction.md"
  - "docs/M4_IMPLEMENTATION_PLAN.md"
relevant_files:
  - "src/engine/"
  - "src/scenario/"
  - "src/tests/"
  - "specs/feature/campaign-and-player-model.md"
active_decisions:
  - ".project-os/decisions/DEC-001-data-driven-headless-domain.yaml"
  - ".project-os/decisions/DEC-003-deterministic-local-first.yaml"
  - ".project-os/decisions/DEC-005-versioned-incident-save-migration.yaml"
  - ".project-os/decisions/DEC-006-separate-m3-campaign-progress.yaml"
  - ".project-os/decisions/DEC-007-single-incident-slot-confirmation.yaml"
  - ".project-os/decisions/DEC-008-m3-completion-m4-planning.yaml"

acceptance:
  - "Identical accepted history and model version yield identical metrics and provenance."
  - "Rejected commands, duplicate replays, zero eligible samples and alternate-run history have explicit tested behavior."
  - "All required design-model fields are supported or explicitly marked unavailable from current inputs; no manufactured recommendation observations."
  - "Action classification and formula/version references validate, and changed versions do not silently reinterpret old campaign state."
verification:
  - "Run formula fixtures, zero-denominator, rejected/duplicate input, model-version and replay tests; full tests/typecheck/lint."
  - "Obtain independent review and acceptance QA."

human_gate: false
risk: high
