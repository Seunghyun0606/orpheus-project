id: TASK-019
title: "Implement deterministic campaign transitions and authored progression"
role: developer
milestone: M4
priority: P0
status: ready

objective: "Implement the approved pure campaign model and data-driven Act/incident progression without coupling it to React."
why: "Hidden values, narrative flags, evidence and completion need one explainable campaign transition authority."

scope:
  include:
    - "Implement schema-validated campaign definitions and pure transitions using the approved TASK-018 contract."
    - "Preserve provenance for actual accepted actions, discoveries and completion; enforce approved replay/idempotency rules."
    - "Resolve authored Act/incident unlock and branch prerequisites with diagnostic reference validation."
    - "Use minimal fixtures to test hidden values, alignment, evidence, flags, and progression."
  exclude:
    - "Platform I/O, new save writes, player prediction UI or full campaign content."
    - "Unapproved restart-counting policies, hidden-value tuning, and persistence choices."

depends_on:
  - "TASK-018"
specs:
  - "specs/feature/campaign-and-player-model.md"
  - "specs/architecture/system-architecture.md"
  - "specs/product/01-game-and-narrative-direction.md"
  - "docs/M4_IMPLEMENTATION_PLAN.md"
relevant_files:
  - "src/engine/"
  - "src/scenario/"
  - "scripts/validate-scenarios.mjs"
  - "src/tests/"
active_decisions:
  - ".project-os/decisions/DEC-001-data-driven-headless-domain.yaml"
  - ".project-os/decisions/DEC-003-deterministic-local-first.yaml"
  - ".project-os/decisions/DEC-005-versioned-incident-save-migration.yaml"
  - ".project-os/decisions/DEC-006-separate-m3-campaign-progress.yaml"
  - ".project-os/decisions/DEC-007-single-incident-slot-confirmation.yaml"
  - ".project-os/decisions/DEC-008-m3-completion-m4-planning.yaml"

acceptance:
  - "Identical approved definition versions, initial state, and ordered inputs produce equal state and events."
  - "Duplicate/replayed inputs, partial incidents, alternate runs, and invalid references follow the approved contract and have regression tests."
  - "Act unlocks and hidden effects come from validated data, not incident-ID conditionals."
  - "Domain imports no React, Zustand, DOM or Tauri; hidden numeric values are not exposed in current MVP UI."
verification:
  - "Run campaign transition, Act unlock, reference validation, and replay tests; then full tests, typecheck, lint and scenario validation."
  - "Obtain independent review and acceptance QA."

human_gate: false
risk: high
