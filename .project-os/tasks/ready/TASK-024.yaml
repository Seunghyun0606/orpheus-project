id: TASK-024
title: 'Integrate campaign projections with the shared desktop safely'
role: developer
milestone: M4
priority: P0
status: ready

objective: 'Connect the approved campaign systems through adapters while preserving the playable MVP and its accessibility and reveal boundaries.'
why: 'Headless systems need tested UI/adapters without making React the campaign authority or leaking hidden state.'

scope:
  include:
    - 'Connect campaign persistence, progress, evidence and authored eligibility through store adapters.'
    - 'Add approved projections for progression and appropriately gated prediction/ending framework demonstrations using test content.'
    - 'Preserve desk navigation, archived read-only review, live-session isolation, single-slot confirmation and legacy restore.'
    - 'Exercise keyboard, enlarged text, reduced motion and non-color state cues on affected screens.'
  exclude:
    - 'Production late-act content, story-completion percentages, raw hidden-variable dashboards and irreversible player-state reset.'
    - 'Enabling prediction/ending in MVP incidents without an approved content gate.'

