id: TASK-022
title: 'Resolve data-driven branches and deterministic prediction feedback'
role: developer
milestone: M4
priority: P0
status: ready

objective: 'Use approved campaign and player-model inputs for validated branch eligibility and reproducible prediction feedback.'
why: 'The narrative must react to accumulated behavior while preserving reveal order and keeping recommendations distinct from judgment.'

scope:
  include:
    - 'Implement authored conditions over evidence, flags, hidden values and behavior with actionable invalid-reference diagnostics.'
    - 'Implement the approved prediction/confidence policy and update feedback from actual accepted actions.'
    - 'Use explicit non-production fixtures for late-act prediction and reveal gates; preserve current UNKNOWN-only bundles.'
    - 'Verify missing evidence, low sample confidence, unavailable actions, ties and UNKNOWN predictions.'
  exclude:
    - 'Runtime-generated story, arbitrary confidence animation, realtime AI integration or new late-act production content.'
    - 'Changing the prediction policy, confidence semantics, or reveal order without the relevant human decision.'

depends_on:
  - 'TASK-019'
  - 'TASK-021'
