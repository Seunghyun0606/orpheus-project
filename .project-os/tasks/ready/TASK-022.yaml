acceptance:
  - 'Branch and prediction output is deterministic and traceable to validated data and approved model inputs.'
  - 'Unavailable actions, unknown flags/evidence/model versions and invalid conditions are rejected or handled exactly as specified.'
  - 'Fixtures test investigation, safety, reporting and dependency branches without calling any route correct or incorrect.'
  - 'Current INC-001/002/003 remain UNKNOWN-only; prediction is not exposed ahead of its approved narrative gate.'
verification:
  - 'Run branch, confidence/deviation, eligibility/reference and reveal-order tests; validate current/frozen YAML and replay all MVP incidents.'
  - 'Obtain independent review and acceptance QA.'

human_gate: false
risk: high
