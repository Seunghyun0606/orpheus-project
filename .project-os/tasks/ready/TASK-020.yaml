acceptance:
  - 'Round-trip and reload retain approved campaign state, hidden values, flags, evidence, and replay metadata.'
  - 'Old incident/discovery fixtures remain readable and are preserved according to approved migration rules.'
  - 'Corrupt, unsupported, tampered, duplicate or divergent records fail safely without silently replacing valid data.'
  - 'Import/reload does not double-count campaign contributions or fabricate unsupported history.'
verification:
  - 'Run migration, save/load, malformed/incompatible data, interruption and deterministic replay tests plus existing save protections.'
  - 'Obtain independent review and acceptance QA; native data overwrite requires action-time permission.'

