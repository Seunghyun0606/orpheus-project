id: TASK-020
title: 'Persist approved campaign state without losing existing progress'
role: developer
milestone: M4
priority: P0
status: ready

objective: 'Add local-first campaign persistence and any separately approved migration while preserving existing incident and discovery data.'
why: 'The expanded campaign model must survive restart without discarding older saves or inventing player history.'

scope:
  include:
    - 'Implement only the persistence structure and migration policy approved in TASK-018.'
    - 'Validate schema/content versions and replay provenance before accepting imported state.'
    - 'Cover legacy progress import, campaign reload, pending incident continuation, interrupted writes, incompatible saves, and original-byte preservation.'
    - 'Keep incident-slot confirmation and separate discovery persistence behavior unless a later explicit decision supersedes it.'
  exclude:
    - 'Choosing storage keys, destructive conversion, auto-overwrite, or new migration semantics without human approval.'
    - 'Cloud sync or resets of user saves for testing.'

depends_on:
  - 'TASK-019'
