id: TASK-023
title: 'Implement authored ending conditions and deterministic priority resolution'
role: developer
milestone: M4
priority: P0
status: done

objective: 'Resolve the defined ending set through validated data using campaign state, final incident state, and final actions.'
why: 'Endings must express cumulative consequences without a hardcoded good/bad/true result or premature final campaign expansion.'

scope:
  include:
    - 'Implement the approved ending schema, predicates, priority/tie/no-match policy, and a pure resolver.'
    - 'Define deterministic test fixtures for CONTINUITY, LIBERATION, WHISTLEBLOWER, SHUTDOWN, CUSTODIAN, NULL, THE BOARD, THE FIRE, STATUS QUO and REWRITE.'
    - 'Validate flags, evidence, action, model-version and ending references with actionable diagnostics.'
    - 'Keep ending fixture thresholds explicitly test-only until balance/content decisions are approved.'
  exclude:
    - 'Implementing the full BLACKOUT incident, epilogues, or exposing ending content in the current MVP.'
    - 'Inventing production thresholds, substituting a new single objective for REWRITE, or labeling endings good/bad/true.'

