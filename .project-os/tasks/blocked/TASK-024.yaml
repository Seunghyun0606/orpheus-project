acceptance:
  - 'DEC-031 prediction exposure/response/deviation obligations have executable positive and failure/recovery evidence with actual committed presentation provenance; no sample is inferred from calculation, redisplay or inherited/imported history.'
  - 'Accepted domain results drive projections; UI does not duplicate transition, branch, model or ending rules.'
  - 'Remount/reload and repeated archive visits preserve campaign/evidence/history without duplicated contributions.'
  - 'All three MVP paths, UNKNOWN-only reveal checks, archived review, save protections and keyboard regressions pass.'
  - 'Gated fixture screens are accessible at supported native minimum and 150 percent text without blocking controls.'
verification:
  - 'Run actual exposure acknowledgement, response association, positive 0/1 versus 1/1, pooled 2/12 and abort/conflict/lost-ack fixtures; substantiate gated presentation and durable acknowledgement through adapter/native tests.'
  - 'Run adapter/component/end-to-end, archive isolation, save/reload and accessibility tests plus complete quality commands and native inspection.'
