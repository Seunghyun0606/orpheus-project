# Every gate below is an executable command; `npm run check` runs them all and
# CI (.github/workflows/ci.yml) enforces them on every push and pull request.
required:
  build: true # npm run build
  lint: true # npm run lint
  format: true # npm run format:check
  typecheck: true # npm run typecheck
  unit_test: true # npm test
  integration_test: true # npm test (replay, ledger and UI integration suites)
  scenario_validation: true # npm run validate:scenarios
  release_harness: true # npm run test:release-harness
  independent_review: true

thresholds:
  critical_issues: 0

human_gate:
  required:
    - product_vision_change
    - milestone_scope_change
    - breaking_architecture_change
    - destructive_operation
    - production_release
    - subjective_final_approval
  not_required:
    - implementation_detail
    - refactoring_within_existing_architecture
    - test_creation
    - clear_bug_fix
