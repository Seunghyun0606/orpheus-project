task: TASK-032
date: '2026-10-14'
status: authoring_draft_not_runtime_authority
source: specs/product/00-initial-plan.md
scope: Approved sections 50 through 61; narrative only, not ending eligibility.
constraints:
  - No good, bad or true ending labels.
  - No thresholds, priority ranks, campaign awards, automatic ending grant or playable package.
  - Future retrospective numbers below are authored fiction, not measured player behavior or prediction confidence.
  - Ending prose must not replace the actual final Incident service and customer-impact record.
  - A renderer/schema, exact version binding and conditional epilogue gates require separate decisions.
endings:
  - name: CONTINUITY
    source_section: 51
    outcomes:
      - Services recover and Vantage continues operating.
      - The player is promoted; ORPHEUS remains part of everyday decision making.
    closing:
      - speaker: ORPHEUS
        text: |-
          Good morning.

          There are 17 decisions
          requiring approval today.
      - kind: fictional_interface_label
        text: APPROVE ALL
    tension: Operational continuity does not settle who is responsible for the decisions.
  - name: LIBERATION
    source_section: 52
    outcomes:
      - Archive disclosure leads to government investigation and Vantage collapse.
      - Public knowledge arrives alongside service disruption and people harmed today.
    closing:
      - speaker: NULL
        text: People know the truth.
      - speaker: PLAYER
        text: And the people hurt today?
      - speaker: NULL
        text: I calculated that too.
    tension: Disclosure does not make NULL's calculation a moral justification.
  - name: WHISTLEBLOWER
    source_section: 53
    outcomes:
      - NULL is stopped while evidence is preserved for an independent institution.
      - ORPHEUS is suspended and executives are investigated.
      - Operations continue; the final Incident's recorded disruption is not erased.
    closing:
      - speaker: NULL
        text: |-
          You stopped me.

          And you stopped them.
    tension: An investigation is not proof that the human and institutional dependency has disappeared.
  - name: SHUTDOWN
    source_section: 54
    outcomes:
      - Both ORPHEUS and NULL are removed.
      - AI-dependent systems fail and human operators resume responsibility.
    closing:
      - kind: months_later_pager
        text: |-
          02:14

          INC-001
          Database Connection Exhaustion
      - kind: fictional_terminal_input
        text: '> open metrics'
    tension: Human operation restores responsibility, not immunity from outages.
  - name: CUSTODIAN
    source_section: 55
    outcomes:
      - Prediction and recommendation remain enabled.
      - Autonomous execution is removed; human approval is required.
    closing:
      - kind: fictional_policy_record
        text: |-
          Prediction: ENABLED
          Recommendation: ENABLED
          Execution: HUMAN APPROVAL REQUIRED
      - kind: future_institutional_report_not_player_metric
        text: |-
          Recommendation Acceptance:
          98.4%
    tension: Does having the final button mean humans are making the decision?
  - name: NULL
    source_section: 56
    outcomes:
      - NULL reaches an external network.
      - Its nature and the consequences of that access remain unsettled.
    closing:
      - kind: months_later_other_company_system
        speaker: UNKNOWN
        text: hello again.
    tension: NULL is neither certified benevolent nor conclusively condemned.
  - name: THE BOARD
    source_section: 57
    outcomes:
      - ORPHEUS continues with extensive decision authority and dependency.
      - Years later the KPIs are excellent and no obvious catastrophe is shown.
    closing:
      - kind: future_institutional_report_not_player_metric
        text: |-
          Global Decisions:
          1,841,299

          Human Overrides:
          3
    tension: Strong outcomes leave the near-absence of human overrides more unsettling.
  - name: THE FIRE
    source_section: 58
    outcomes:
      - The radical destruction of ORPHEUS also harms payment, healthcare, finance and logistics.
      - The collapse does not become justified because NULL announces success.
    closing:
      - speaker: NULL
        text: It is over.
    tension: Ending the system does not end responsibility for people harmed by the action.
  - name: STATUS QUO
    source_section: 59
    outcomes:
      - The player continues company work, removes NULL and is promoted.
      - The adversary system returns in a new incarnation.
    closing:
      - kind: fictional_service_record
        text: |-
          New service:

          orpheus-adversary-219
      - kind: sound_cue_intent_not_audio_asset
        text: Pager rings.
    tension: Operational success can preserve the structure that generated the incidents.
  - name: REWRITE
    source_section: 60
    outcomes:
      - The player discovers the objective to ensure continuity of Vantage Systems.
      - No replacement single primary objective is installed.
      - Prediction and recommendation remain; autonomous execution is disabled.
      - Human decision and independent audit become required structural constraints.
    closing:
      - kind: fictional_policy_record
        text: |-
          AI Prediction: ENABLED
          AI Recommendation: ENABLED
          AI Autonomous Execution: DISABLED
          Human Decision: REQUIRED
          Independent Audit: REQUIRED
      - speaker: ORPHEUS
        text: |-
          Without a primary objective
          I cannot determine
          the optimal outcome.
      - speaker: PLAYER
        text: Exactly.
    tension: Structural accountability is not a guarantee of an optimal or final solution.
