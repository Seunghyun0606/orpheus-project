scope_boundaries:
  - This file is not a Scenario or CampaignDefinition and is outside runtime/bundled content.
  - New Incident IDs, titles and Memory Leak placement are proposed only; preserve existing INC-001/002/003
    source bytes and versions.
  - M4 QA remains required before final M5 acceptance/release; this proposal grants no task PASS.
  - Ordinary recovery and main Act progression must not depend on optional alignment/prediction samples or
    require every clue.
  - Later revelations need actual prerequisite discovery; provide an accessible data-authored re-investigation
    route rather than fake exposure/history.
  - Required reveal order describes the investigation-heavy route, not forced disclosure on STATUS QUO or
    every player route.
