task: TASK-033
date: '2026-10-14'
status: proposed_not_approved_or_applied
scope: Early accessibility/audio implementation only; no QA waiver or preceding task completion.
proposal:
  readiness_exception:
    - Remove TASK-027 and TASK-032 from implementation-readiness prerequisites only and retain accepted TASK-026 before claiming via projectctl.
    - Keep TASK-027/032 and M4 incomplete; their acceptance and all M5 verification remain required before final completion/release.
    - Preserve all TASK-034/035 dependencies; do not expand this exception to packaging, publication or credentials.
  target:
    primary: Windows x64 Tauri with WebView2
    development: Browser/DOM fixtures support development only, not native certification.
    exclusions: No macOS/Linux/NVDA support claim, installer/signing/distribution decision or new system permissions.
  accessibility:
    - Cover campaign entry, tools, evidence, archive, guidance, ending and settings with semantic headings/tables, visible focus, keyboard controls and non-color status text.
    - Preserve CRT-off, reduced animation and 100/125/150 percent text controls; no intensified flicker.
    - Design for the existing 960x640 minimum viewport at 150 percent text with scrolling and reachable controls.
    - Author automated coverage and later Windows Narrator core-flow/native keyboard/display checks; execute none while QA is deferred.
  audio:
    implementation: Local Web Audio synthesis authored in the repository, not externally sourced recordings or downloaded assets.
    cues: [pager, keyboard, server_hum, notification, relay, critical_alarm]
    asset_provenance: Record synthesis source and cue inventory; no third-party recording license or repository-wide license grant is implied.
    default: Muted; explicit user gesture required to create/resume output, including after restoring remembered preferences.
    controls: Independent mute and master volume from 0 to 1; stop/suspend output when muted, hidden or leaving the campaign.
    event_policy:
      - Operational notifications follow only newly committed live operations/events, never uncommitted candidates, replayed history or archive navigation.
      - Keyboard feedback is a local presentation event only; no global input capture, player-model sample or simulation command.
      - Audio failure or lack of Web Audio support leaves silent visual gameplay usable with a status message, never a volatile campaign fallback.
      - No audio timer advances simulation time or alters RNG, outcomes, receipts, guidance ACK or save authority.
      - Every important cue retains a visible textual alternative; sound is never required to investigate or finish.
  settings:
    storage_key: orpheus.audio.v1
    payload: {schemaVersion: 1, muted: true, volume: 0.35}
    policy: Separate local-first versioned audio preferences; validate shape/range, preserve orpheus.presentation.v1 and all Incident/campaign stores without migration/reset.
    errors: Keep explicit controls functional in memory if preference storage fails; report unsaved preferences without pretending a campaign commit succeeded.
    creation: Read/write only within scoped audio controls/campaign presentation, never from default MVP startup or engine imports.
preserved:
  - Existing default MVP, exact campaign authorities, storage and replay determinism.
  - All deferred automated/independent/native/M4/M5 acceptance requirements.
  - No download, microphone permission, credential/security change, push or release.
excluded:
  - Licensed third-party sound acquisition, music, cross-platform certification, performance-budget approval or packaging.
  - Claiming native screen-reader/audio coverage from DOM fixtures or marking preceding tasks complete.
verification: not_run_QA_deferred
