  continuing_validity: Same factual conjunction plus inclusive ageSeconds 0 through 180, measured from preparation as in DEC-046.
  response_eligibility: Same factual conjunction checked against pre-command context and action availability.
  positive: Recommended action only; the listed alternative is a negative eligible response, not a bad action.
  observation: Actual committed preparation and visible ACK before the next eligible action; unrelated/rejected/expired/no-ACK actions do not create samples.
  scoring: Any future positive effect uses the DEC-055 verified-response qualifier and one logical identity per rule per run; no retry score farming.
  presentation: Existing data-driven recommendation surface; show advisory wording and existing action consequences, no prediction/confidence claim.
