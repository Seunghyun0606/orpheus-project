task: TASK-027
date: '2026-10-14'
status: proposed_not_approved_or_applied
source_finding:
  file: src/engine/campaign/transitions.ts
  function: eligible
  current_gate: incident.act === run.projection.act
  problem: Authored eligibility cannot override this equality, so DEC-059 prior-Act retries require an explicit engine contract rather than only completion effects.
proposal:
  definition_field:
    name: replayAccess
    type: optional literal completed_prior_acts
    scope: Pin only in the new unreleased orpheus-full-campaign 1.0.0 definition; absent in every old authority.
  access:
    - Evaluate all existing authored Incident/Act conditions with unchanged strict availability.
    - Current-Act access remains unchanged.
    - Only with replayAccess=completed_prior_acts, additionally allow an earlier Act when the exact Incident is genuinely present in the replay-verified completed projection.
    - Never allow a future Act, an incomplete earlier Incident, a caller-edited completion or invalid authored conditions.
    - Main order/completion prerequisites, protected action guards and all other eligibility constraints remain unchanged.
  history:
    - Starting again creates a new attempt under existing record/replay v2 contracts, retaining all prior attempts/observations/receipts.
    - No Act rewind, score reset or extra award; advancement stays monotonic and shared effects stay once per campaign.
  compatibility:
    - Keep CampaignDefinition schema 1 with one optional declared policy; no physical storage, operation or saved-run shape change.
    - Canonical new definition authority includes the explicit field; old authority bytes without it and their strict current-Act semantics remain unchanged.
    - No name-based engine branch, global relaxation, latest fallback, old-run reattachment or migration.
  runtime:
    - Update the unregistered complete candidate, then register only a full exact package subject to existing validators.
    - Preserve explicit Full campaign entry, default MVP, incomplete/invalid diagnostics and no automatic creation.
verification_required_later:
  - Genuine old/new records with current/prior/future Act access, rejected incomplete attempts and forged completion.
  - Sequential full run, monotonic advancement, retained observations and shared awards across older-Act retries.
  - Exact compatibility/source/ACK/transaction/restore and ten-ending reachability before acceptance.
excluded:
  - QA waiver, task completion, release, push, score rebalance or old-record modification.
verification: not_run_QA_deferred
