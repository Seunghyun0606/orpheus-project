task: TASK-032
date: '2026-10-14'
status: awaiting_human_decision
type: architecture_change
question: 엔딩 판정에 선택적 기회의 행동 비율을 필수 입력으로 사용할까요?
reason: >-
  Optional opportunity rates can legitimately be unavailable. DEC-025 and the
  existing resolver diagnose every candidate, so a missing sample in one ending
  blocks selection of every ending. Hidden campaign values initialize to zero
  and numeric effect awards remain unselected. TASK-032 readiness approval did
  not select this production input policy or authorize inventing balance.
safe_checkpoint: docs/TASK-032_ENDING_INPUT_CHECKPOINT.md
options:
  - key: A
    label: 누적 값·증거·운영 행동 중심, 선택적 비율은 엔딩 필수 입력에서 제외
    scope: >-
      Prepare an explicit once-per-run numeric effect proposal and ending rules
      using accumulated values/discoveries plus supported operational behavior
      and genuine new final context. Optional opportunity rates retain their
      existing models/branch uses, but are not required ending observations.
  - key: B
    label: 선택적 비율도 필수 입력, 표본 누락 시 전체 엔딩 미확정 유지
    scope: >-
      Prepare rules using optional actual rates as required inputs. Preserve
      all-candidate diagnostics and accept no selected ending when any referenced
      sample is unavailable. No forced response or fabricated observation.
preserved:
  - Strict availability; no missing-as-zero, short-circuit omission or fallback.
  - Accumulated requirements; a final plan alone cannot select an ending.
  - Genuine observations, approved pooled denominators and once-per-run effect identity.
  - New definition only; old authorities, records, stores and strict package admission unchanged.
  - QA deferred, not waived; no completion, push or release.
excluded_from_approval:
  - Exact numeric effect values, ending conditions/thresholds/priority ranks.
  - New presentation/epilogue schema or conditional PROMETHEUS ending/reveal selection.
  - Ending grant operation or reinterpretation of old runs.
