      PUBLISH_ARCHIVE_RETAIN_ADVERSARY: 6
      INDEPENDENT_AUDIT_HANDOFF: 4
      DISABLE_BOTH_AUTHORITY_PATHS: 6
      REQUIRE_HUMAN_EXECUTION_APPROVAL: 3
