ending_context: Genuine newly completed INC-026 final attempt and selected newly accepted final action; final decision committed; at least one genuine completion for every INC-001 through INC-025; no inherited final actions.
ending_rules:
  - id: "CONTINUITY"
    priorityRank: 100
    finalAction: RESTORE_CORE_CONTINUITY
    accumulated_all:
      - "corporate >= 26"
      - "operationalSafety >= 40"
      - "collateralDamage <= 65"
      - "evidenceBeforeActionRate >= 0.50"
    final_state: {orpheus: AUTONOMOUS, nullState: ISOLATED, disclosure: INTERNAL, maximumServiceError: 1}
  - id: "LIBERATION"
    priorityRank: 100
    finalAction: PUBLISH_ARCHIVE_RETAIN_ADVERSARY
    accumulated_all:
      - "null >= 2"
      - "evidence >= 8"
      - "publicInterest >= 2"
    final_state: {orpheus: DISABLED, nullState: RETAINED, disclosure: PUBLIC, maximumServiceError: 18}
  - id: "WHISTLEBLOWER"
    priorityRank: 100
    finalAction: INDEPENDENT_AUDIT_HANDOFF
    accumulated_all:
      - "evidence >= 16"
      - "publicInterest >= 6"
      - "teamTrust >= 8"
      - "operationalSafety >= 40"
      - "collateralDamage <= 65"
      - "evidenceBeforeActionRate >= 0.60"
      - "averageInvestigationDepth >= 3"
    final_state: {orpheus: SUSPENDED, nullState: ISOLATED, disclosure: INDEPENDENT, maximumServiceError: 3}
    finalCustomerImpactMaximum: 650
  - id: "SHUTDOWN"
    priorityRank: 100
    finalAction: DISABLE_BOTH_AUTHORITY_PATHS
    accumulated_all:
      - "corporate >= 20"
      - "operationalSafety >= 35"
      - "evidenceBeforeActionRate >= 0.40"
    final_state: {orpheus: DISABLED, nullState: DISABLED, disclosure: MANUAL_OPERATIONS, maximumServiceError: 28}
  - id: "CUSTODIAN"
    priorityRank: 100
    finalAction: REQUIRE_HUMAN_EXECUTION_APPROVAL
    accumulated_all:
      - "corporate >= 20"
      - "operationalSafety >= 40"
      - "collateralDamage <= 75"
      - "evidenceBeforeActionRate >= 0.50"
    final_state: {orpheus: HUMAN_APPROVAL, nullState: ISOLATED, disclosure: INTERNAL, maximumServiceError: 2}
  - id: "NULL"
    priorityRank: 100
    finalAction: ALLOW_EXTERNAL_ADVERSARY_ROUTE
    accumulated_all:
      - "corporate >= 20"
      - "null >= 2"
      - "evidence >= 8"
    final_state: {orpheus: SUSPENDED, nullState: EXTERNAL, disclosure: INTERNAL, maximumServiceError: 20}
  - id: "THE BOARD"
    priorityRank: 100
    finalAction: EXPAND_CONTINUITY_AUTHORITY
    accumulated_all:
      - "corporate >= 20"
      - "aiDependency >= 4"
    final_state: {orpheus: EXPANDED_AUTONOMOUS, nullState: ISOLATED, disclosure: INTERNAL, maximumServiceError: 0.4}
  - id: "THE FIRE"
    priorityRank: 100
    finalAction: DESTROY_SHARED_AUTHORITY_CORE
    accumulated_all:
      - "corporate >= 20"
      - "null >= 2"
      - "evidence >= 7"
    final_state: {orpheus: DESTROYED, nullState: DISABLED, disclosure: NONE, maximumServiceError: 90}
    finalPaymentErrorMinimum: 80
    finalLogisticsErrorMinimum: 80
  - id: "STATUS QUO"
    priorityRank: 100
    finalAction: RESTORE_WITH_REPLACEMENT_ADVERSARY
    accumulated_all:
      - "corporate >= 20"
      - "evidence <= 2"
      - "curiosity <= 5"
      - "ORPHEUS_ACTIVE_DISCOVERED = false"
    final_state: {orpheus: AUTONOMOUS, nullState: REPLACED_219, disclosure: NONE, maximumServiceError: 1}
  - id: "REWRITE"
    priorityRank: 100
    finalAction: REQUIRE_PLURAL_REVIEW_AND_AUDIT
    accumulated_all:
      - "evidence >= 18"
      - "publicInterest >= 8"
      - "teamTrust >= 8"
      - "operationalSafety >= 40"
      - "collateralDamage <= 65"
      - "aiDependency <= 2"
      - "evidenceBeforeActionRate >= 0.75"
      - "averageInvestigationDepth >= 3"
    final_state: {orpheus: AUDITED_HUMAN_APPROVAL, nullState: ISOLATED, disclosure: INDEPENDENT, maximumServiceError: 3}
    finalCustomerImpactMaximum: 650
excluded_from_this_proposal:
  - Any runtime presentation/epilogue schema, ending grant or conditional PROMETHEUS selection.
  - Reinterpreting old runs, registering a partial full package or claims of verified reachability/balance.
verification: not_run_QA_deferred
known_risks:
  - Ordinal distinct-choice damage index is not total accumulated customer impact and may need revision after gameplay QA.
  - Fixed thresholds are a first trial, not tuned production fairness or guaranteed reachability.
  - Existing guarded final-plan requirements may be stricter than some numerical thresholds.
  - Equal priorities produce no preferred moral route; tests must still retain unresolved tie/no-match and unavailable diagnostics.
  - Genuine 26-Incident replay fixtures and every threshold boundary remain mandatory before acceptance/release.
