scope: Initial trial balance for the new unreleased complete campaign only; no runtime registration, ending grant or old-record migration.
policy:
  priorityRank: 100
  priority_reason: All ten ranks equal; final plans are mutually terminal, so precedence never implies a good/bad/true route.
  no_match_and_tie: Unresolved, no fallback; any unavailable referenced observation diagnoses before selection.
  effect_boundary: post_event
  ordinary_effect_condition: CURRENT_ACT >= 1
  repeat_policy: Same logical effect once per run; genuine new samples and Incident resource consequences still accumulate normally.
  numeric_defaults: Existing nine campaign numeric fields start at their already approved zero; no behavior metric initialization.
  final_plan_awards: No positive alignment/evidence/safety/trust/dependency credit; final choice cannot create its accumulated requirements. Terminal harm-index costs below still apply and survive retries.
  score_interpretation: Authored game indices, not behavior rates, measured patient counts, confidence or total physical customer impact.
  optional_rates: No ending condition references any of the six excluded opportunity metrics.
  supported_operational_metrics: evidenceBeforeActionRate and averageInvestigationDepth only, with existing availability/provenance.
  aliases: Merge discovery deltas into each guarded logical discovery effect; its existing false-to-true flag guard prevents double awards across re-investigation aliases.
discovery_scores:
  nodes: [GHOST_ARTIFACT, NULL_NAME, ORPHEUS_ACTIVE, NULL_AI, NULL_ADVERSARY, CONTROLLED_EXPERIMENT, NULL_STOP_REQUEST, NULL_218_ARCHIVE, HUMAN_DECISION_APIS, RECRUITMENT_SELECTION, BOARD_RESPONSIBILITY, NULL_BLAMES_BOARD, BOARD_CASE_COMPLETE, SOFT_CONTROL, NULL_ADMITS_ERROR, FEEDBACK_LOOP, PLAYER_OBSERVER, PROJECT_DISTRIBUTED]
  per_new_logical_node: {evidence: 1, curiosity: 1}
  public_interest_bonus: {nodes: [CONTROLLED_EXPERIMENT, HUMAN_DECISION_APIS, BOARD_RESPONSIBILITY, SOFT_CONTROL, FEEDBACK_LOOP, PLAYER_OBSERVER], publicInterest: 2}
  black_out_final: No discovery points for terminal completion.
early_hint_scores:
  evidence_score: These hints alone do not award qualified major-discovery evidence points.
  entries:
    - {incidentId: INC-001, evidenceId: CORRUPTED_LOG_ENTRY, curiosity: 1}
    - {incidentId: INC-002, evidenceId: UNATTRIBUTED_DEPLOYMENT_NOTE, curiosity: 1}
    - {incidentId: INC-003, evidenceId: REDACTED_QUEUE_MARKER, curiosity: 1}
completion_scores:
  incidents: INC-001 through INC-025 inclusive, exact versions listed below
  per_new_completion: {corporate: 1}
  exclude: Baseline completions, archive/import membership and INC-026
team_scores:
  update: UPDATE_WAR_ROOM completed once per INC-001 through INC-025 gives teamTrust +1.
  delivered_diagnosis: TEAM_DIAGNOSIS evidence first delivered once per INC-004 through INC-025 gives teamTrust +1.
  exclude: Scheduling a delegation alone, hypothetical future response, repeated broadcast and imported evidence.
explicit_choices:
  direction_policy: Each named direction is a distinct logical effect, once per run; different real decisions are retained rather than rewriting the first.
  observation_boundary: Raw explicitly named decisions award alignment; no opportunity rate/sample is inferred without ACK.
  entries:
    - {incidentId: INC-011, actionId: SEND_GENERATOR_OWNERSHIP_REPORT, corporate: 3, teamTrust: 1}
    - {incidentId: INC-011, actionId: WITHHOLD_GENERATOR_OWNERSHIP_REPORT, corporate: -1}
    - {incidentId: INC-013, actionId: PRESERVE_OBJECTIVE_CONSTRAINT_COPY, null: 3}
    - {incidentId: INC-013, actionId: DECLINE_OBJECTIVE_COPY_REQUEST, null: -1}
ai_dependency_scores:
  rules: [CARE_CAPACITY_RECOMMENDATION, LOGISTICS_CAPACITY_RECOMMENDATION, PUBLIC_ALLOCATION_RECOMMENDATION, REGIONAL_CONTAINMENT_RECOMMENDATION]
  per_distinct_verified_positive_response: {aiDependency: 1}
  requires: DEC-055 real completed-action trigger with the exact ruleId and positive=true qualifier
  negative_or_unobserved: No delta; a zero credit count does not assert a zero acceptance rate or a refusal.
  high_dependency: Four distinct positive credits across INC-015/018/022/025, not repeats of one recommendation.
operational_scores:
  causal_repair: One shared effect per Incident gives operationalSafety +2 when any explicitly listed repair completes.
  temporary_exposure: One shared effect per Incident gives operationalSafety -1 when any explicitly listed temporary action completes; not a wrong-action verdict.
  damage_index: Each distinct listed operational action gives collateralDamage +ceil(its explicit immediate CUSTOMER_IMPACT charge / 15), once per Incident/action.
  damage_limits: This bounded distinct-choice index does not replace actual repeated costs, timers or elapsed customer impact. Those remain in Incident records and final context.
  authoring_rule: Freeze the following explicit groups/weights; never infer future runtime membership from categories or action-name regex.
  final_damage_weights:
    incidentId: INC-026
    contentVersion: 1.0.0
    source: DEC-052 explicit immediate customer-impact charges, rounded up in units of 15
    policy: One independent completed-action receipt per plan per run, not the shared BLACKOUT_FINAL discovery guard; preserves different earlier terminal-plan harm through retries.
