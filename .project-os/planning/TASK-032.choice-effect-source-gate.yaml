type: architecture_change
question: 누적 캠페인 점수가 실제 완료 행동·검증된 추천 응답을 참조하도록 효과 계약을 확장할까요?
reason: >-
  Current effect triggers cover only discovery, narrative and completion events.
  Explicit report actions merely post messages; real acknowledged recommendation
  responses exist outside simulation events. Guessing acceptance from matching
  actions or unavailable rates would violate the approved observation contract.
proposal: specs/architecture/campaign-choice-effect-source-proposal.md
options:
  - key: A
    label: 새 캠페인에 action_completed·검증된 응답 조건 추가(권장)
    scope: >-
      Extend the effect trigger with genuine action_completed targets and an
      optional exact ruleId/positive response qualifier. Reuse the real event
      sequence and existing once-per-run receipts; no storage migration or
      fabricated ACK. Apply only to the new unreleased definition.
  - key: B
    label: 기존 증거·서사·완료 효과만 사용, 선택 점수는 보류
    scope: >-
      Keep the effect schema unchanged and author only effects it can actually
      support. Defer report/AI-response scores and dependent complete ending
      balance until an approved alternative exists; no inferred acceptance.
preserved:
  - DEC-054 required ending metric exclusions and strict availability.
  - Existing observation formulas, seven opportunity identities and actual ACK/response rules.
  - Once-per-run effect identity, pooled genuine behavior samples and atomic durable commit.
  - Frozen old authorities, stores, default MVP and strict complete-package admission.
  - QA deferred, not waived; no task completion, push, release or ending grant.
excluded_from_approval:
  - Exact numeric awards, ending thresholds/ranks and epilogue/presentation gates.
  - New guidance opportunities or treating one observed recommendation as sustained high dependency.
