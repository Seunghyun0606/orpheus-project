decision: >-
  Retain existing INC-001 1.1.0 and INC-002/003 1.2.0 authorities unchanged.
  New INC-004 through INC-026 start at contentVersion 1.0.0. Investigation sidecars
  use <Incident-ID>-INVESTIGATION version 1.0.0, schema 1. New definition/package
  use ID orpheus-full-campaign version 1.0.0, existing schema 1 and record/replay 2.
consequences:
  - Preserve shipped exact bindings and old records; no automatic migration, latest substitution or old authority overwrite.
  - Subsequent presentation/content changes require new pinned package/definition authorities; pre-release authored drafts are not yet certified/shipped bindings.
  - Production behavior/prediction/opportunity/ending model versions, initial values, classifications and numeric campaign/ending balance remain unselected.
  - Cross-Incident reveal representation, schema changes, final actions, destructive storage changes and release retain material-choice gates.
  - QA remains deferred at the latest explicit instruction; no missing verification becomes PASS or canonical task completion.
supersedes: Version-number-unselected clauses only; not compatibility, native verification or final acceptance obligations.
