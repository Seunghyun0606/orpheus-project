id: DEC-010
title: Choose whether incident retries contribute to the official campaign
status: proposed
date: '2026-10-09'
applies_to:
  - M4
task: TASK-018
context: >-
  DEC-009 approves a separate campaign ledger but not the meaning of incident
  restart or replay. Current M3 resets use the same seed and start local command
  sequences over; discovery snapshots retain alternate artifacts without run
  identity. M4 must not infer whether these are additional official actions,
  replacement history or practice. The policy changes behavior observations,
  hidden effects and eventual ending eligibility.
decision: Pending human selection; neither option is approved or implemented.
recommended_option: A
chosen_option: null
options:
  - key: A
    label: Append every official attempt within the same campaign
    details: >-
      An official incident restart or replay creates a distinct attempt within
      the existing campaign run. Preserve previously accepted actions, including
      abandoned attempts, as official history rather than replacing them.
      Separate repeated delivery/projection from a genuinely new attempt even
      when seed and commands are identical. Exact aggregation weights and
      per-effect award scopes still require a reviewed contract.
  - key: B
    label: Separate retries and replays as non-contributing practice
    details: >-
      Preserve the official attempt and campaign history. Restart and replay
      operate as separate practice, with no changes to the official ledger's
      hidden values, model, unlocks, evidence or ending eligibility. Official
      progress resumes the preserved attempt or starts an explicit new campaign;
      it does not silently replace the old attempt. Existing M3 discovery union
      behavior is preserved but is not an automatic practice-to-ledger import.
invariants:
  - UI incident restart is not an accepted restart-service action for restartRate.
  - Repeated projection, archive review or loading is not a new accepted player command.
  - Existing saves and histories are not erased or retroactively assigned to an invented run.
  - Completion and evidence awards require explicit idempotency scope; repeats must not silently farm awards.
  - Choosing attempt policy does not approve numeric weights, schema, legacy import, older-slot association or ending thresholds.
proposal_document: specs/architecture/campaign-intelligence-contract.md
supersedes: null
