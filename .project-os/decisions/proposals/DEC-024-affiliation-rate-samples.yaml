id: DEC-024
title: Choose sample units for company reporting and NULL cooperation rates
status: resolved
date: '2026-10-10'
applies_to:
  - M4
task: TASK-018
context: >-
  The remaining companyReportingRate and nullCooperationRate fields have no
  approved sample-unit policy. A proportion of relevant explicit decisions and
  a share of all activity while a relevant opportunity is available can differ:
  investigation commands may dilute the latter even if followed by reporting.
  These are behavior inputs, not automatic corporate/NULL alignment effects.
decision: Human selected option A; runtime implementation and final contract acceptance remain pending.
recommended_option: A
chosen_option: A
decision_record: .project-os/decisions/DEC-024-explicit-affiliation-response-rates.yaml
options:
  - key: A
    label: Count only eligible responses to explicit reporting or cooperation opportunities
    details: >-
      For each metric, use a valid authored available opportunity and its eligible
      new accepted decision response. A classified reporting/cooperation choice
      is positive; another eligible explicit response is negative. Unrelated
      observations and no response provide no sample. Each identified opportunity
      contributes at most one associated response sample for that metric.
  - key: B
    label: Count all accepted activity while the relevant opportunity is available
    details: >-
      For each metric, every new accepted command in a validated context where
      its relevant authored opportunity is actually available contributes a sample.
      Classified reporting/cooperation commands are positive; other commands,
      including information gathering, are negative. This measures activity share,
      not explicit response proportion. Distinct commands during one opportunity
      can each contribute; a source command counts at most once per metric.
invariants:
  - Pool compatible positives divided by eligible samples under DEC-014; no eligible samples means unavailable, not zero.
  - Use separate authored opportunity, availability, eligibility and positive predicates per metric; the rates are not complements or automatic alignment values.
  - Require verified pre-action context and known available opportunity provenance; never fabricate NULL cooperation from old UNKNOWN hints or inaccessible branches.
  - Support status, generic communication and operational risk are not automatically corporate allegiance or NULL cooperation.
  - No response or expiry by itself adds no sample; timers and outcome events are not additional player choices.
  - Retain genuine eligible new samples in unfinished/abandoned attempts; duplicates, rejection, imports, inherited prefixes and archive review add none.
  - Preserve source identities and compatible definition versions; missing/invalid/unsupported required definitions and ambiguous associations yield diagnostics.
  - Neither option chooses production opportunity/action mappings, reveal gates, thresholds or numeric alignment effects; keep both legacy stores and the UNKNOWN-only MVP unchanged.
proposal_document: specs/architecture/campaign-intelligence-contract.md
supersedes: null
