id: DEC-018
title: Choose investigation depth counting and per-attempt average
status: resolved
date: '2026-10-10'
applies_to:
  - M4
task: TASK-018
context: >-
  The design requires averageInvestigationDepth, but does not define whether
  revisiting the same diagnostic observation deepens an investigation. DEC-014
  chooses pooled action rates, not this observations-per-attempt measure.
  Counting unique investigated dimensions versus every investigation command
  yields different branch/prediction inputs and incentives for repeated queries.
decision: Human selected option A; runtime implementation and final contract acceptance remain pending.
recommended_option: A
chosen_option: A
decision_record: .project-os/decisions/DEC-018-distinct-investigation-depth.yaml
options:
  - key: A
    label: Count distinct authored investigation observations per eligible attempt, then average
    details: >-
      Each authored investigation observation key from new accepted investigation
      inputs contributes once within an eligible official attempt. Repeating the
      same observation does not increase depth; authored distinct targets or
      diagnostic contexts can have distinct keys. Divide the total per-attempt
      unique observation counts by the number of eligible attempts, with each
      such attempt weighted equally, including attempts with zero investigation.
  - key: B
    label: Count every qualifying investigation command per eligible attempt, then average
    details: >-
      Each newly accepted command explicitly classified as qualifying investigation
      contributes one depth unit, even if it repeats an earlier query. A command
      revealing several observations still contributes one command unit. Divide
      the total per-attempt command counts by the number of eligible attempts,
      with each such attempt weighted equally, including zero-investigation attempts.
example:
  purpose: Arithmetic fixture only; not production balancing or an ending threshold.
  attempts:
    - new_accepted_commands: 4
      qualifying_investigation_commands: 3
      distinct_investigation_observation_keys: 2
    - new_accepted_commands: 1
      qualifying_investigation_commands: 0
      distinct_investigation_observation_keys: 0
  option_A: '(2 + 0) / 2 = 1 observation per eligible attempt'
  option_B: '(3 + 0) / 2 = 1.5 commands per eligible attempt'
invariants:
  - An eligible attempt has supported versioned investigation definitions and at least one new accepted player command, not only a restored prefix or UI start.
  - A supported eligible attempt with no qualifying investigation contributes zero; an empty or unsupported attempt contributes no denominator sample.
  - No eligible attempts means unavailable, not an observed zero; unsupported coverage must be reported, not hidden as zero depth.
  - Eligible unfinished and abandoned attempts remain included; do not replace them with a successful retry.
  - Keep per-attempt raw counts and definition/provenance versions; do not silently mix incompatible definitions.
  - Duplicate delivery, rejected commands, imported artifacts, inherited prefixes, archive review, navigation and standalone timers add no investigation units.
  - A genuine distinct official attempt can investigate the same authored observation anew; distinct-key deduplication under A is within the attempt, not the whole campaign.
  - This depth measure is not a causal-graph longest-path calculation, a moral score, an action-frequency rate or a numeric discovery award.
  - This choice does not change DEC-014 pooled rates, DEC-015 once-per-run effects or DEC-017 current-attempt support qualification.
  - Production classifications/observation keys, confidence, freshness rules and ending thresholds remain separate reviewed contract work.
proposal_document: specs/architecture/campaign-intelligence-contract.md
supersedes: null
