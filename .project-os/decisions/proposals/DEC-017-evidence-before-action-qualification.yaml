id: DEC-017
title: Choose what qualifies evidence before a newly accepted intervention
status: proposed
date: '2026-10-09'
applies_to:
  - M4
task: TASK-018
context: >-
  The model tracks evidenceBeforeActionRate, while DEC-011 allows explicitly
  adopted discoveries to satisfy authored presence predicates and DEC-012 permits
  verified inherited baselines. Neither proves new investigation in the current
  attempt. A newly accepted intervention can be measured as preceded by a fresh
  investigation or by already available relevant knowledge; these are different
  behavioral meanings with different branch/prediction inputs.
decision: Pending human selection; neither option is approved or implemented.
recommended_option: A
chosen_option: null
options:
  - key: A
    label: Require qualifying investigation from new accepted inputs in the current attempt
    details: >-
      A new eligible intervention is positive only when versioned authored
      relevance rules find supporting observations from earlier new accepted
      investigation inputs in the same official attempt. Prior-attempt or imported
      membership and inherited checkpoint observations alone do not satisfy this
      metric. They remain usable for approved campaign presence predicates.
  - key: B
    label: Accept verified relevant knowledge already available before the intervention
    details: >-
      A new eligible intervention is positive when its verified pre-action context
      satisfies authored relevant-evidence predicates, whether from this attempt,
      earlier official discoveries, explicit legacy adoption or a verified
      inherited baseline. Fresh investigation in the current attempt is not
      required. Only the new intervention becomes a sample, not past behavior.
example:
  purpose: Eligibility fixture only; not production balancing or an ending threshold.
  context: One new eligible intervention, relevant imported evidence present before it, no new current-attempt investigation.
  option_A: '0/1: observed intervention without qualifying fresh investigation'
  option_B: '1/1: observed intervention with verified relevant knowledge available'
invariants:
  - Define metric eligibility and relevant evidence/diagnostic observations through versioned authored references, not any arbitrary artifact.
  - Only a new accepted eligible intervention provides a denominator sample; imports and baselines themselves provide none.
  - The supporting context must precede the intervention; evidence revealed by that intervention cannot satisfy its own pre-action check.
  - Pool eligible counts under DEC-014, exclude rejected/duplicate inputs, and report zero eligible samples as unavailable.
  - Do not invent historic behavior, alignment, numeric discovery effects or completed incidents under DEC-011/012.
  - Missing or invalid required relevance definitions yield a diagnostic, not a fabricated negative observation.
  - This choice does not alter DEC-016 restart/rollback denominators or DEC-015 once-per-run effects.
  - Investigation depth, relevance freshness rules, ethical intent, prediction confidence and ending thresholds remain separate contract work.
proposal_document: specs/architecture/campaign-intelligence-contract.md
supersedes: null
