id: DEC-013
title: Choose the separate campaign ledger commit and concurrent-writer mechanism
status: resolved
date: '2026-10-09'
applies_to:
  - M4
task: TASK-018
context: >-
  DEC-009 approves a distinct versioned ledger but not its physical storage or
  concurrency protocol. The current SaveStorage has synchronous read/write only,
  without transactions or compare-and-swap. A stale application instance must
  not replace later official history. The new ledger must commit accepted inputs,
  projections and attempt/checkpoint associations coherently while leaving both
  old localStorage stores in their existing roles.
decision: >-
  The human selected option A: use a separate versioned IndexedDB ledger with
  revision-checked transactional commits, preserving both existing localStorage
  stores. The active DEC-013 record captures that boundary. Runtime storage
  is not implemented by resolving this proposal.
decision_record: .project-os/decisions/DEC-013-transactional-indexeddb-campaign-ledger.yaml
recommended_option: A
chosen_option: A
options:
  - key: A
    label: Separate IndexedDB ledger with transactional revision-checked commits
    details: >-
      Add a versioned IndexedDB authority for the new ledger only. In one
      readwrite transaction, validate expected revision and append/replace the
      validated ledger envelope including its input identities, projections and
      checkpoint associations. Publish success after transaction completion,
      not individual request success. Abort conflicting or failed commits;
      neither old localStorage key participates in this transaction. This needs
      a new asynchronous injected adapter and browser/native storage QA.
  - key: B
    label: Separate localStorage envelope guarded by exclusive Web Locks
    details: >-
      Keep the new ledger in a distinct versioned localStorage key. Require all
      participating M4 writers to acquire the same exclusive Web Lock before
      re-reading, validating expected revision and replacing the whole envelope.
      Do not describe read-compare-write as atomic compare-and-swap. If locking
      is unavailable, fail closed for official ledger writes instead of using
      an unlocked fallback. This retains the familiar storage format but needs
      lock capability QA and has whole-envelope size/quota costs.
invariants:
  - Preserve both existing localStorage keys, envelopes and explicit overwrite protections.
  - Persist the candidate official ledger before acknowledging or publishing new official state.
  - Conflict and storage errors preserve the last committed state and do not silently merge, overwrite or retry as a different action.
  - Commit identities make an acknowledged duplicate idempotent and distinguish a genuinely new attempt.
  - No atomic transaction spans the old incident slot, M3 discovery store and new ledger.
  - No automatic backend fallback, truncation, old-store mirroring or destructive reset is approved.
  - Browser commit completion is not a guarantee against hardware failure, user clearing storage or every non-cooperating writer.
  - The chosen adapter must be capability-tested in the supported browser and Tauri WebView; support is not inferred from the standards.
  - Choosing commit mechanism does not approve model formulas, production thresholds or final task acceptance.
technical_references:
  - https://w3c.github.io/IndexedDB/
  - https://w3c.github.io/web-locks/
proposal_document: specs/architecture/campaign-intelligence-contract.md
supersedes: null
