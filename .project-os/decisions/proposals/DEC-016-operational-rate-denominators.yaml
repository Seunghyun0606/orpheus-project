id: DEC-016
title: Choose eligible denominator for restart and rollback rates
status: proposed
date: '2026-10-09'
applies_to:
  - M4
task: TASK-018
context: >-
  DEC-014 fixes aggregation by pooling metric-specific eligible counts, but it
  does not define what qualifies for restartRate and rollbackRate denominators.
  Including observation and communication commands dilutes these rates even
  when the operational interventions are unchanged. The choice affects later
  authored branches and prediction inputs, not just display formatting.
decision: Pending human selection; neither option is approved or implemented.
recommended_option: A
chosen_option: null
options:
  - key: A
    label: Count eligible operational interventions only
    details: >-
      Divide classified service restart or rollback commands by accepted
      operational intervention commands. A versioned authored classification
      defines eligible commands that mitigate or modify the system; observation,
      diagnosis, communication and information-only delegation do not dilute
      these operational choice rates. Categories alone do not substitute for
      validated classification data.
  - key: B
    label: Count all accepted gameplay commands
    details: >-
      Divide classified service restart or rollback commands by every newly
      accepted gameplay command in the official attempt history, including
      observation, investigation, communication and delegation. Additional
      information gathering therefore reduces these action-frequency rates.
example:
  purpose: Arithmetic fixture only; not production balancing or an ending threshold.
  service_restarts: 1
  rollbacks: 1
  other_operational_interventions: 1
  information_or_communication_commands: 6
  option_A_restart_and_rollback: '1/3 each'
  option_B_restart_and_rollback: '1/9 each'
invariants:
  - Both numerators use explicit versioned service-action classifications, not labels or UI restart boundaries.
  - Numerators must be subsets of the selected denominator; missing/invalid required classification cannot silently become zero.
  - Pool approved eligible raw counts across official attempts under DEC-014, including unfinished/abandoned attempts.
  - A zero denominator means unavailable, not an observed zero.
  - Rejected commands, duplicate delivery, inherited prefixes, imports, timers, archive review and navigation add no player command sample.
  - Genuinely new accepted commands in different official attempts remain distinct even when their bytes match.
  - This choice does not change incident action timing/effects or DEC-015 once-per-run authored awards.
  - Evidence-before-action, investigation depth, ethical intent, recommendation exposure, confidence and ending thresholds require their own reviewed contracts.
proposal_document: specs/architecture/campaign-intelligence-contract.md
supersedes: null
