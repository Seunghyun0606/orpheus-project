id: DEC-023
title: Choose observation formulas for safety preference and collateral damage tolerance
status: proposed
date: '2026-10-10'
applies_to:
  - M4
task: TASK-018
context: >-
  The behavior model requires safetyPreference and collateralDamageTolerance,
  separately from accumulated campaign safety/damage values and operational risk.
  A frequency of qualifying choices and a mean normalized authored intensity
  describe different tendencies. Neither formula follows from approved restart,
  investigation, recommendation or prediction rates, and both can affect branches.
decision: Pending human selection; neither option is approved or implemented.
recommended_option: A
chosen_option: null
options:
  - key: A
    label: Pooled binary preference rates at explicit authored tradeoff opportunities
    details: >-
      For each metric, authored pre-action tradeoff/opportunity rules determine
      eligible new accepted choices and whether each meets that metric's positive
      classification. Pool positives divided by eligible choices under DEC-014.
      safetyPreference and collateralDamageTolerance have independent definitions
      and denominators; neither is automatically one minus the other. Intensity
      does not increase a sample's weight.
  - key: B
    label: Mean normalized authored preference intensity per eligible choice
    details: >-
      Validated versioned rules assign each eligible accepted tradeoff choice a
      finite normalized value for the relevant preference using information
      available before the action. Average those values over eligible choices,
      with equal weight per choice rather than per attempt. These are continuous
      authored intensity measures, not binary rates; normalization and meaning
      need explicit reviewed definitions, never raw risk or damage substitution.
invariants:
  - Define eligible tradeoffs and per-metric observations explicitly in versioned authored data; action names, categories and missing opportunities are not moral evidence.
  - Require verified pre-action information/availability and new accepted choice provenance; do not infer tolerance from hidden future outcomes or merely lacking access to a branch.
  - Actual customer impact, simulation operational risk and campaign collateralDamage remain distinct observations/effects, not automatic player preference scores.
  - Retain genuine eligible new choices in unfinished/abandoned official attempts; no eligible observations means unavailable, not observed zero.
  - Missing/invalid references, required context, classification or normalization definitions produce diagnostics, not invented neutral/safe/harm-tolerant samples.
  - Imports, inherited prefixes, rejected/duplicate inputs, timers and archive review add no samples; preserve exact-head and new-baseline boundaries.
  - Preserve observation identities and definition versions; neither option silently reinterprets incompatible history or mutates the two legacy stores.
  - No good/bad/true labels, production thresholds, normalization coefficients, hidden-value effect amounts or late-act MVP content are chosen here.
proposal_document: specs/architecture/campaign-intelligence-contract.md
supersedes: null
