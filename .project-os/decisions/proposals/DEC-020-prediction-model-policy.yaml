id: DEC-020
title: Choose deterministic prediction and confidence model family
status: proposed
date: '2026-10-10'
applies_to:
  - M4
task: TASK-018
context: >-
  The design requires action-derived deterministic predictions and confidence,
  not scripted percentages or live AI. Approved metric counting does not choose
  a prediction formula. Comparable recorded choice frequencies and an authored
  behavioral scoring model can generalize differently from the same history and
  give confidence numbers different meanings. TASK-022 requires approved policy.
decision: Pending human selection; neither option is approved or implemented.
recommended_option: A
chosen_option: null
options:
  - key: A
    label: Predict from comparable recorded action frequencies with empirical share
    details: >-
      Versioned authored rules define comparable pre-action contexts and eligible
      candidate action identities. Pool eligible new historical choices in that
      context among currently available candidates. Predict a uniquely most
      frequent candidate when authored minimum sample requirements are met;
      confidence is its count divided by the eligible candidate sample total.
      Empty/insufficient samples or a top tie produce UNKNOWN. This share is an
      empirical summary, not a calibrated probability or invented prior.
  - key: B
    label: Predict through an authored versioned behavioral scoring model
    details: >-
      Authored rules combine available approved behavior metrics and context
      features into finite nonnegative candidate scores. Predict the unique top
      eligible score when authored support requirements are met; confidence is
      its score divided by the eligible score total. This can generalize without
      prior choices in exactly the same context, but needs reviewed coefficients,
      support rules and normalization. Missing required inputs, zero total or
      a top tie produce UNKNOWN; normalized score is not a calibrated probability.
invariants:
  - Use validated versioned definitions and currently available authored candidates, not fixed story percentages, live LLMs, network services or Math.random.
  - Preserve traceable support/counts or scores and model/context versions; incompatible definitions cannot silently reinterpret prior state.
  - Rejected/duplicate commands, imports, inherited prefixes, archive review and timers create no new player choice samples.
  - Retain eligible new choices from unfinished/abandoned official attempts; equal bytes in distinct official attempts are not duplicate identity.
  - Missing or invalid required definitions/references yield a diagnostic, not zero-filled behavior or a fabricated prediction.
  - Record prediction context and availability before a responding accepted action; later history cannot retrospectively change its earlier prediction.
  - A valid prediction may supply deviation observations only through an actual recorded exposure/opportunity; old UNKNOWN messages are not such records.
  - Unknown or gated-off predictions cannot become invented recommendation acceptance or prediction-deviation samples.
  - Minimum sample/support values, context classifications, scoring coefficients and production reveal rules are not selected here.
  - The current three MVP incidents remain UNKNOWN-only; late-act prediction fixtures remain non-production.
