id: DEC-012
title: Choose official continuation from older or unassociated incident checkpoints
status: resolved
date: '2026-10-09'
applies_to:
  - M4
task: TASK-018
context: >-
  The existing incident slot contains no campaign run or attempt identity, and
  loading it restores an incident snapshot rather than a campaign head. A future
  ledger may already contain later accepted actions. DEC-010 retains prior
  history, while DEC-011 permits discovery-only adoption and does not authorize
  using saved action prefixes as official historical observations. Continuing
  from an old checkpoint therefore needs an explicit gameplay and provenance policy.
decision: >-
  The human selected option A: after confirmation, restore an eligible verified
  unfinished checkpoint as a new official attempt while retaining earlier
  campaign history and counting only subsequent accepted actions. The active
  DEC-012 record does not choose storage transactions, exact schema or weights.
decision_record: .project-os/decisions/DEC-012-confirmed-checkpoint-attempts.yaml
recommended_option: A
chosen_option: A
options:
  - key: A
    label: Explicitly branch an eligible unfinished checkpoint as a new official attempt
    details: >-
      A checkpoint that exactly matches the explicitly associated live attempt
      head resumes it without creating another attempt. For an older or
      unassociated verified unfinished checkpoint, preview and confirm a new
      attempt in the selected campaign, preserving all existing official history.
      Store the restored incident state and replay prefix as a provenance-bearing
      baseline, not newly accepted historical actions. Only subsequently accepted
      actions and their incremental consequences contribute new observations.
      Validate current campaign eligibility; do not import completion or unlock
      Acts from the checkpoint. Discovery adoption remains separately explicit
      under DEC-011, not a hidden side effect of Load.
  - key: B
    label: Official resume only from an explicitly associated live attempt head
    details: >-
      Older or unassociated checkpoints remain available through the preserved
      legacy load and archive flow outside official campaign contribution. They
      cannot resume official play from that saved position. The player resumes
      the verified official attempt head or starts an official retry from the
      authored initial incident state under DEC-010. DEC-011 still allows its
      separate explicit discovery-only adoption.
invariants:
  - Loading alone does not erase or roll back accepted campaign history.
  - Never infer campaign association from equal seed, command bytes, elapsed time or archive order.
  - A completed checkpoint is read-only review, not a new completion award; playable retries use the authored initial state.
  - Scenario eligibility, original replay verification and approved content migration remain required.
  - Pending work and RNG state belong to a verified incident baseline, not evidence of new historical player actions.
  - Reject malformed, incompatible or mismatched associations without silent fallback or source rewrites.
  - Choosing continuation policy does not approve exact schema, cross-key atomicity, model weights or ending balance.
proposal_document: specs/architecture/campaign-intelligence-contract.md
supersedes: null
