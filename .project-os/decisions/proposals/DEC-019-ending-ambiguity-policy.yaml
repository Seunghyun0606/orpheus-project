id: DEC-019
title: Choose ending tie and no-match resolution policy
status: resolved
date: '2026-10-10'
applies_to:
  - M4
task: TASK-018
context: >-
  The design requires authored ending conditions and priority, and TASK-023
  requires approved deterministic overlap, tie and no-match behavior. Priority
  can resolve multiple eligible endings when one has uniquely highest precedence,
  but cannot alone choose between equally preferred matches or when none match.
  Silently choosing STATUS QUO or relying on file order changes ending semantics.
decision: Human selected option A; runtime implementation and final contract acceptance remain pending.
recommended_option: A
chosen_option: A
decision_record: .project-os/decisions/DEC-019-unresolved-ending-ambiguity.yaml
options:
  - key: A
    label: Preserve unresolved ties and no-match outcomes with diagnostics
    details: >-
      Select an ending only when validated conditions and authored priority
      produce a uniquely preferred eligible ending. Equally preferred top matches
      return an ambiguity diagnostic; valid context with no matching conditions
      returns unresolved. Neither case grants an ending flag or substitutes a
      default ending. Authors must correct coverage/priority explicitly.
  - key: B
    label: Resolve ties and no-match through an explicit authored order and fallback ending
    details: >-
      Author and validate an additional stable tie order for equally preferred
      eligible endings, and an explicit fallback ending reference for valid
      fully evaluated context when no conditions match. The fallback may be
      selected despite its ordinary conditions not matching. No implicit file
      order, hardcoded STATUS QUO or fallback from invalid/missing context.
invariants:
  - A uniquely preferred eligible ending uses validated data priority, not React logic, scenario-ID conditionals or an alphabetical winner.
  - Only equally preferred top matches constitute the tie; lower-precedence matches cannot displace a unique preferred result.
  - Missing final context, malformed definitions, unknown references, unsupported versions or unavailable required observations cannot masquerade as valid no-match.
  - Required predicates must distinguish known false from unavailable/indeterminate; neither option silently coerces missing behavior to zero.
  - Deterministic evaluation consumes explicit validated campaign state, final incident state, final actions and recorded definition versions only.
  - Record resolution status, matched candidates, priority provenance and diagnostic explanations without exposing hidden raw scores to players.
  - No ending flag is applied merely by loading, reviewing or attempting an unresolved/invalid evaluation.
  - All ten named endings require positive, exclusion/boundary, overlap, tie, no-match and invalid-context fixtures in TASK-023.
  - This choice does not select production thresholds, priority values, fallback identity, final campaign content or good/bad/true labels.
  - The current MVP remains UNKNOWN-only; ending fixtures cannot expose late-act content through production UI.
proposal_document: specs/architecture/campaign-intelligence-contract.md
supersedes: null
