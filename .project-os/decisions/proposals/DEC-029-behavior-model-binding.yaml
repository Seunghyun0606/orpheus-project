id: DEC-029
title: Pin behavior model authority without silently reclassifying model-less campaign records
status: proposed
date: '2026-10-10'
applies_to: [M4]
task: TASK-021
context: >-
  TASK-021 introduces deterministic behavior metrics under approved formulas.
  Current strict campaign definitions and recorded authority contain no behavior
  model binding. Choosing its introduction boundary determines compatibility
  and whether existing identified history can become official metric samples.
proposed_decision: >-
  Under recommended option A, new campaign definition versions explicitly pin
  immutable behavior data and supported formula/classification versions from
  run creation. Older model-less definitions retain exact replay and unavailable
  official metrics without automatic attachment or backfill. Use the existing
  whole-definition authority and transaction layout, not a new storage key.
human_approval: null
request: .project-os/planning/TASK-021.model-binding-gate.yaml
alternatives:
  - A pins model authority only in new model-enabled definitions/runs and preserves older model-less records.
  - B first designs a separately confirmed transition/migration and approved observation boundary for existing formal runs.
safeguards:
  - No model formula changes, latest-version fallback, production tuning, silent schema conversion or legacy history reconstruction.
  - Both legacy stores, frozen content, existing saved records and physical database layout remain unchanged by the proposal.
  - Recommendation, NULL, ethical-choice and prediction metrics stay unavailable without their own supported recorded opportunities.
  - No proposal implements or accepts TASK-021; independent review and QA remain required.
supersedes: null
