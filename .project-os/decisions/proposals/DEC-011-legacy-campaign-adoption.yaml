id: DEC-011
title: Choose the scope of legacy discoveries adopted by the M4 campaign ledger
status: proposed
date: '2026-10-09'
applies_to:
  - M4
task: TASK-018
context: >-
  Legacy incident and M3 discovery envelopes are replay verifiable but lack
  campaign run identity and a globally ordered accepted action stream. Discovery
  arrays contain overlapping and divergent attempts. The decoder may also add
  target-content discoveries during migration; existing progress re-encoding
  does not retain an independent original migration lineage. DEC-010 approves
  future identified retries, not reconstruction of ambiguous past behavior.
decision: Pending human selection; neither option is approved or implemented.
recommended_option: A
chosen_option: null
options:
  - key: A
    label: Explicitly adopt verified legacy evidence and narrative records only
    details: >-
      Offer a preview and explicit import into a selected campaign run. Retain
      the available source bytes, version and provenance limits, and import only
      evidence and narrative records present in the source-authority verified
      snapshot, not extra artifacts created by target replay. These are tagged
      imported discoveries, not chronological official action observations.
      Do not infer behavior rates, alignment, numeric historical effects,
      completion, Act progression or ending flags. Imported discovery membership
      may be referenced by authored evidence/narrative-presence predicates, but
      discovery effects are not retroactively executed. Unknown original lineage
      remains unknown. Repeat import must not re-award the same discovery.
  - key: B
    label: Keep legacy discoveries in the existing archive without ledger adoption
    details: >-
      Preserve the existing save, loading and discovery archive behavior. The
      new official campaign derives discoveries and progression only from its
      identified new play; no legacy artifact import into its ledger is offered.
      Old evidence remains reviewable but does not qualify official campaign
      evidence predicates or ending eligibility solely by being in that archive.
invariants:
  - Preserve both original keys and bytes; no conversion or source rewrite merely on read.
  - Do not concatenate or choose a first or last snapshot as canonical past behavior.
  - Never use target-content additions as proof of discoveries present in the saved source.
  - Available snapshot provenance is not proof of original player observation time or missing migration lineage.
  - Reject malformed, unsupported or non-replayable records without silent partial adoption or fallback.
  - Choosing adoption scope does not approve older checkpoint continuation, exact schema, transaction guarantees or production balance.
proposal_document: specs/architecture/campaign-intelligence-contract.md
supersedes: null
