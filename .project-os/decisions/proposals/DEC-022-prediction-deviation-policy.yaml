id: DEC-022
title: Choose the meaning of predictionDeviation
status: proposed
date: '2026-10-10'
applies_to:
  - M4
task: TASK-018
context: >-
  DEC-020 chooses empirical pre-action predictions and DEC-021 chooses how actions
  respond to recommendations. Neither defines predictionDeviation. Counting
  departures from the displayed top action and measuring the empirical rarity of
  the chosen action give different values even when the player follows the top
  prediction, affecting future behavior predicates and ending inputs.
decision: Pending human selection; neither option is approved or implemented.
recommended_option: A
chosen_option: null
options:
  - key: A
    label: Pooled rate of eligible responses differing from the exposed prediction
    details: >-
      An eligible new accepted response to a valid recorded prediction exposure
      contributes one sample. A different authored action identity is a deviation,
      the predicted identity is not. Divide total mismatches by total eligible
      responses across official attempts under DEC-014. Matching the top action
      yields zero deviation for that sample, regardless of confidence.
  - key: B
    label: Mean empirical rarity of eligible chosen actions
    details: >-
      For each eligible response to a valid recorded prediction exposure, calculate
      one minus that chosen candidate's share of the prior eligible context-choice
      samples. Average these values over all eligible responses, with equal weight
      per response, not per attempt. This is a continuous rarity measure, not a
      mismatch rate or calibrated probability. A matching top action can have a
      nonzero rarity value; use preserved pre-action candidate counts, never the
      choice's own updated history.
invariants:
  - Require actual valid prediction exposure before the response, same-run/attempt provenance, available eligible candidate identity and compatible versioned definitions.
  - UNKNOWN, invalid or gated-off predictions, missing required definitions and absent eligible responses cannot be treated as observed zero behavior.
  - No eligible response denominator means unavailable; valid zero mismatch or rarity after a supported response is distinct from unavailable.
  - An invalid reference, conflicting identity or unsupported required context yields a diagnostic, not a fabricated positive/negative sample.
  - Count at most one response per identified prediction opportunity; duplicates, imports, inherited prefixes, rejected actions, timers and archive review add none.
  - Retain genuine new eligible responses in unfinished/abandoned attempts; exact-head resume does not recount them and new checkpoint prefixes are baseline only.
  - Preserve prior prediction/counts and ordered history boundaries; later response/outcomes cannot rewrite the prediction they are measured against.
  - A prediction response is distinct from recommendation acceptance; it does not prove motives, moral quality or numeric alignment effects.
  - Exact eligibility, opportunity validity/replacement, action equivalence and production thresholds remain reviewed authored data, not selected tuning here.
  - Keep the three bundled incidents UNKNOWN-only and both legacy stores unchanged; no live AI, arbitrary confidence animation or late-act production content.
