id: DEC-021
title: Measure exposed recommendation acceptance from the next eligible action
status: active
date: '2026-10-10'
applies_to:
  - M4
task: TASK-018
context: >-
  The human selected option A: compare an exposed recommendation with actual
  subsequent eligible behavior, including manually executing the same action.
  A separate accept button is not required to count following behavior, and the
  metric does not establish that the recommendation caused the player's choice.
decision: >-
  For a validated recorded recommendation opportunity, use the next new accepted
  player action classified as an eligible response while the opportunity remains
  valid. Matching the authored recommended action identity is a positive sample;
  another eligible response is a negative sample. Pool eligible positive and
  response counts under DEC-014. No response or expiry contributes no sample,
  not rejection; no eligible responses means unavailable, not zero.
human_approval:
  selected_option: A
  instruction: '실제 행동 기준: 노출된 추천과 다음 유효 행동을 비교, 직접 실행도 수용으로 계산(권장).'
proposal: .project-os/decisions/proposals/DEC-021-recommendation-response-policy.yaml
consequences:
  - Actual gated recommendation exposure, action identity/availability, run/attempt, ordered boundary and definition version must precede the response.
  - A prediction is not automatically a recommendation; UNKNOWN hints, gated-off calculations and unavailable recommendations supply no opportunity.
  - Manual execution of the recommended action counts when it is the next eligible valid response; UI clicks alone and rejected commands are not responses.
  - Unrelated information commands need not consume an opportunity; response eligibility, expiry, replacement and action equivalence require versioned authored definitions.
  - Associate at most one response sample with each identified opportunity; duplicate delivery, imports, inherited prefixes, timers and archive review add no samples.
  - Genuine eligible responses in unfinished or abandoned official attempts remain counted; exact-head resume preserves identity rather than recounting exposure or response.
  - Invalid references, conflicting identities and unsupported required definitions yield diagnostics rather than invented negative samples.
  - Preserve accepted operational actions and their costs once; recommendation matching does not dispatch an additional action or alter DEC-016 denominators.
  - Commit associated response identity and projections together under DEC-013; failed or conflicting writes cannot acknowledge new official samples.
  - This approval does not choose predictionDeviation, numeric AI_DEPENDENCY effects, production thresholds or reveal conditions.
  - Existing save stores and the UNKNOWN-only MVP remain unchanged; TASK-018 still requires remaining contracts, independent review, acceptance QA and evaluation.
supersedes: null
